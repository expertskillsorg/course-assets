<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Five-Rung Independence Ladder</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Climb one rung per practice block; pass a rung at four clean bars at slow tempo</text>

  <!-- Ladder rails -->
  <line x1="150" y1="90" x2="150" y2="430" stroke="#111827" stroke-width="4"/>
  <line x1="180" y1="90" x2="180" y2="430" stroke="#111827" stroke-width="4"/>

  <!-- Upward arrow along the rail -->
  <polygon points="165,76 156,94 174,94" fill="#141B5C"/>

  <!-- Rung 5 (top) -->
  <rect x="150" y="96" width="30" height="16" fill="#1E2A8E"/>
  <rect x="200" y="90" width="470" height="52" rx="6" fill="#1E2A8E"/>
  <text x="216" y="112" font-size="15" font-weight="bold" fill="#ffffff">Rung 5 &#183; Both moving</text>
  <text x="216" y="132" font-size="12" fill="#ffffff">Kick and snare both shift around the steady hi-hat at once. Expressive, real drumming.</text>

  <!-- Rung 4 -->
  <rect x="150" y="164" width="30" height="16" fill="#3E9B6B"/>
  <rect x="200" y="158" width="470" height="52" rx="6" fill="#3E9B6B"/>
  <text x="216" y="180" font-size="15" font-weight="bold" fill="#ffffff">Rung 4 &#183; All three, snare moving</text>
  <text x="216" y="200" font-size="12" fill="#ffffff">Hi-hat and steady kick hold; the snare adds notes off the backbeat.</text>

  <!-- Rung 3 (quit point) -->
  <rect x="150" y="232" width="30" height="16" fill="#C4683A"/>
  <rect x="200" y="226" width="470" height="52" rx="6" fill="#C4683A"/>
  <text x="216" y="248" font-size="15" font-weight="bold" fill="#ffffff">Rung 3 &#183; All three, kick moving</text>
  <text x="216" y="268" font-size="12" fill="#ffffff">Full groove with a busy foot. The hardest step and the common quit point.</text>
  <text x="685" y="256" text-anchor="end" font-size="11" font-weight="bold" fill="#ffffff" opacity="0.9">&#9733; most quit here</text>

  <!-- Rung 2 -->
  <rect x="150" y="300" width="30" height="16" fill="#D4AF37"/>
  <rect x="200" y="294" width="470" height="52" rx="6" fill="#D4AF37"/>
  <text x="216" y="316" font-size="15" font-weight="bold" fill="#141B5C">Rung 2 &#183; Hats plus snare variations</text>
  <text x="216" y="336" font-size="12" fill="#141B5C">Steady hi-hat; the other hand moves the snare to changing spots. No kick yet.</text>

  <!-- Rung 1 (bottom) -->
  <rect x="150" y="368" width="30" height="16" fill="#141B5C"/>
  <rect x="200" y="362" width="470" height="52" rx="6" fill="#141B5C"/>
  <text x="216" y="384" font-size="15" font-weight="bold" fill="#ffffff">Rung 1 &#183; Hats plus kick variations</text>
  <text x="216" y="404" font-size="12" fill="#ffffff">Steady hi-hat; the foot plays a changing kick underneath. No snare yet.</text>

  <!-- start label -->
  <text x="165" y="450" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">start at the bottom</text>

  <!-- passing standard footnote -->
  <text x="360" y="470" text-anchor="middle" font-size="12" fill="#374151">Passing standard, every rung: four bars run clean and repeatable at a slow tempo, count intact.</text>
</svg>
