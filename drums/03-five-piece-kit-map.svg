<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="Arial, sans-serif">
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The five-piece kit, seen from above</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#374151">Drummer sits at the bottom; each piece is tagged with its job</text>

  <!-- drummer seat position marker -->
  <circle cx="380" cy="452" r="22" fill="#E5E7EB"/>
  <text x="380" y="457" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">you</text>

  <!-- KICK (center, near drummer) -->
  <circle cx="380" cy="360" r="46" fill="#3E9B6B"/>
  <text x="380" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Kick</text>
  <text x="380" y="376" text-anchor="middle" font-size="11" fill="#ffffff">PULSE</text>

  <!-- SNARE (left of kick, between knees -> drawn front-left) -->
  <circle cx="270" cy="345" r="34" fill="#C4683A"/>
  <text x="270" y="343" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Snare</text>
  <text x="270" y="359" text-anchor="middle" font-size="10" fill="#ffffff">BACKBEAT</text>

  <!-- HI-HAT (far left) -->
  <ellipse cx="150" cy="330" rx="40" ry="16" fill="#1E2A8E"/>
  <text x="150" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Hi-hat</text>
  <text x="150" y="343" text-anchor="middle" font-size="9" fill="#ffffff">TIMEKEEPER</text>

  <!-- RACK TOM 1 (over kick, left) -->
  <circle cx="320" cy="230" r="32" fill="#141B5C"/>
  <text x="320" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Rack tom</text>
  <text x="320" y="243" text-anchor="middle" font-size="9" fill="#ffffff">FILLS</text>

  <!-- RACK TOM 2 (over kick, right) -->
  <circle cx="440" cy="230" r="32" fill="#141B5C"/>
  <text x="440" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Rack tom</text>
  <text x="440" y="243" text-anchor="middle" font-size="9" fill="#ffffff">FILLS</text>

  <!-- FLOOR TOM (right of kick) -->
  <circle cx="510" cy="345" r="38" fill="#141B5C"/>
  <text x="510" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Floor tom</text>
  <text x="510" y="359" text-anchor="middle" font-size="9" fill="#ffffff">FILLS</text>

  <!-- CRASH (upper left) -->
  <ellipse cx="230" cy="150" rx="52" ry="20" fill="#D4AF37"/>
  <text x="230" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Crash</text>
  <text x="230" y="164" text-anchor="middle" font-size="9" fill="#141B5C">PUNCTUATION</text>

  <!-- RIDE (upper right) -->
  <ellipse cx="540" cy="150" rx="58" ry="22" fill="#D4AF37"/>
  <text x="540" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Ride</text>
  <text x="540" y="164" text-anchor="middle" font-size="9" fill="#141B5C">LOUDER TIMEKEEPER</text>

  <!-- legend -->
  <g font-size="12" fill="#374151">
    <rect x="620" y="300" width="16" height="16" fill="#3E9B6B"/><text x="642" y="313">Kick / drums</text>
    <rect x="620" y="324" width="16" height="16" fill="#C4683A"/><text x="642" y="337">Snare</text>
    <rect x="620" y="348" width="16" height="16" fill="#141B5C"/><text x="642" y="361">Toms</text>
    <rect x="620" y="372" width="16" height="16" fill="#1E2A8E"/><text x="642" y="385">Hi-hat</text>
    <rect x="620" y="396" width="16" height="16" fill="#D4AF37"/><text x="642" y="409">Cymbals</text>
  </g>

  <!-- core-three bracket note -->
  <text x="150" y="420" font-size="12" fill="#374151" font-style="italic">The core three: kick, snare, hi-hat</text>
</svg>
