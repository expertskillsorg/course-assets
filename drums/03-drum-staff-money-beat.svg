<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The drum staff, and the money beat written on it</text>

  <!-- KEY panel -->
  <text x="40" y="74" font-size="15" font-weight="bold" fill="#374151">The three positions</text>
  <!-- mini staff for the key -->
  <g stroke="#E5E7EB" stroke-width="1.5">
    <line x1="40" y1="100" x2="250" y2="100"/>
    <line x1="40" y1="118" x2="250" y2="118"/>
    <line x1="40" y1="136" x2="250" y2="136"/>
    <line x1="40" y1="154" x2="250" y2="154"/>
    <line x1="40" y1="172" x2="250" y2="172"/>
  </g>
  <!-- hi-hat x above top line -->
  <g stroke="#1E2A8E" stroke-width="3" stroke-linecap="round">
    <line x1="72" y1="84" x2="84" y2="96"/><line x1="84" y1="84" x2="72" y2="96"/>
  </g>
  <text x="100" y="94" font-size="13" fill="#1E2A8E" font-weight="bold">Hi-hat (x, on top)</text>
  <!-- snare middle line -->
  <ellipse cx="78" cy="136" rx="9" ry="7" fill="#C4683A"/>
  <text x="100" y="140" font-size="13" fill="#C4683A" font-weight="bold">Snare (middle line)</text>
  <!-- kick bottom space -->
  <ellipse cx="78" cy="181" rx="9" ry="7" fill="#3E9B6B"/>
  <text x="100" y="186" font-size="13" fill="#3E9B6B" font-weight="bold">Kick (bottom space)</text>

  <!-- MAIN staff for the money beat -->
  <text x="300" y="240" font-size="15" font-weight="bold" fill="#374151">One bar of the money beat (4/4)</text>
  <!-- staff lines -->
  <g stroke="#E5E7EB" stroke-width="1.5">
    <line x1="120" y1="280" x2="700" y2="280"/>
    <line x1="120" y1="300" x2="700" y2="300"/>
    <line x1="120" y1="320" x2="700" y2="320"/>
    <line x1="120" y1="340" x2="700" y2="340"/>
    <line x1="120" y1="360" x2="700" y2="360"/>
  </g>
  <!-- bar lines -->
  <line x1="120" y1="280" x2="120" y2="360" stroke="#141B5C" stroke-width="2"/>
  <line x1="700" y1="280" x2="700" y2="360" stroke="#141B5C" stroke-width="2"/>
  <!-- time signature -->
  <text x="98" y="308" font-size="22" font-weight="bold" fill="#141B5C" text-anchor="middle">4</text>
  <text x="98" y="336" font-size="22" font-weight="bold" fill="#141B5C" text-anchor="middle">4</text>

  <!-- count row -->
  <g text-anchor="middle">
    <g font-size="18" font-weight="bold" fill="#141B5C">
      <text x="170" y="404">1</text><text x="310" y="404">2</text><text x="450" y="404">3</text><text x="590" y="404">4</text>
    </g>
    <g font-size="13" fill="#374151">
      <text x="240" y="404">&amp;</text><text x="380" y="404">&amp;</text><text x="520" y="404">&amp;</text><text x="660" y="404">&amp;</text>
    </g>
  </g>

  <!-- hi-hat: 8 x marks above top line at y ~264 -->
  <g stroke="#1E2A8E" stroke-width="3" stroke-linecap="round">
    <line x1="164" y1="258" x2="176" y2="270"/><line x1="176" y1="258" x2="164" y2="270"/>
    <line x1="234" y1="258" x2="246" y2="270"/><line x1="246" y1="258" x2="234" y2="270"/>
    <line x1="304" y1="258" x2="316" y2="270"/><line x1="316" y1="258" x2="304" y2="270"/>
    <line x1="374" y1="258" x2="386" y2="270"/><line x1="386" y1="258" x2="374" y2="270"/>
    <line x1="444" y1="258" x2="456" y2="270"/><line x1="456" y1="258" x2="444" y2="270"/>
    <line x1="514" y1="258" x2="526" y2="270"/><line x1="526" y1="258" x2="514" y2="270"/>
    <line x1="584" y1="258" x2="596" y2="270"/><line x1="596" y1="258" x2="584" y2="270"/>
    <line x1="654" y1="258" x2="666" y2="270"/><line x1="666" y1="258" x2="654" y2="270"/>
  </g>
  <!-- beam across hi-hat stems (visual eighth-note beam) -->
  <rect x="170" y="248" width="496" height="4" fill="#1E2A8E"/>
  <g stroke="#1E2A8E" stroke-width="2">
    <line x1="170" y1="252" x2="170" y2="272"/><line x1="240" y1="252" x2="240" y2="272"/>
    <line x1="310" y1="252" x2="310" y2="272"/><line x1="380" y1="252" x2="380" y2="272"/>
    <line x1="450" y1="252" x2="450" y2="272"/><line x1="520" y1="252" x2="520" y2="272"/>
    <line x1="590" y1="252" x2="590" y2="272"/><line x1="660" y1="252" x2="660" y2="272"/>
  </g>

  <!-- snare on beats 2 and 4 (middle line y=320) -->
  <g fill="#C4683A">
    <ellipse cx="310" cy="320" rx="10" ry="7.5"/>
    <ellipse cx="590" cy="320" rx="10" ry="7.5"/>
  </g>

  <!-- kick on beats 1 and 3 (bottom space y=369) -->
  <g fill="#3E9B6B">
    <ellipse cx="170" cy="369" rx="10" ry="7.5"/>
    <ellipse cx="450" cy="369" rx="10" ry="7.5"/>
  </g>
</svg>
