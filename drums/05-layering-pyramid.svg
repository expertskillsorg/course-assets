<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect width="720" height="460" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Independence Builds One Layer at a Time</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Each layer goes automatic before the next is added</text>

  <!-- Capstone: full groove -->
  <polygon points="360,84 300,150 420,150" fill="#1E2A8E"/>
  <text x="360" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Full groove</text>

  <!-- Layer 3: add backbeat hand -->
  <polygon points="300,152 420,152 460,222 260,222" fill="#3E9B6B"/>
  <text x="360" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Layer 3</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#ffffff">add the backbeat hand</text>

  <!-- Layer 2: add foot -->
  <polygon points="260,224 460,224 500,294 220,294" fill="#D4AF37"/>
  <text x="360" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Layer 2</text>
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#141B5C">add the foot (kick)</text>

  <!-- Layer 1: hi-hat hand alone -->
  <polygon points="220,296 500,296 540,366 180,366" fill="#C4683A"/>
  <text x="360" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Layer 1</text>
  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#ffffff">hi-hat hand alone, steady eighths</text>

  <!-- base line -->
  <line x1="150" y1="366" x2="570" y2="366" stroke="#111827" stroke-width="2"/>
  <text x="360" y="388" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">start here, slow enough to place every note on purpose</text>

  <!-- Build-up arrow (left side) -->
  <line x1="120" y1="360" x2="120" y2="110" stroke="#141B5C" stroke-width="2.5"/>
  <polygon points="120,100 114,116 126,116" fill="#141B5C"/>
  <text x="104" y="240" text-anchor="middle" font-size="12" fill="#141B5C" transform="rotate(-90 104 240)">build up, one layer at a time</text>

  <!-- Collapse rule (right side): drop back one layer, not to zero -->
  <path d="M600 170 q40 60 0 120" fill="none" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="600,290 592,276 608,278" fill="#C4683A"/>
  <text x="632" y="230" text-anchor="middle" font-size="11" fill="#C4683A" transform="rotate(90 632 230)">collapse: drop back one layer</text>

  <!-- footnote -->
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#374151">On a collapse you fall back one layer, never all the way to the base, and the count never stops.</text>
</svg>
