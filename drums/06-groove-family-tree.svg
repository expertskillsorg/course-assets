<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="780" height="490" fill="#FFFFFF"/>
  <text x="390" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">The Groove Family</text>

  <!-- connectors from money beat to each child -->
  <g stroke="#D4AF37" stroke-width="2" fill="none">
    <path d="M390 150 L80 350"/>
    <path d="M390 150 L235 350"/>
    <path d="M390 150 L390 350"/>
    <path d="M390 150 L545 350"/>
    <path d="M390 150 L700 350"/>
  </g>

  <!-- ROOT: Money Beat -->
  <g>
    <rect x="315" y="40" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2.5"/>
    <text x="390" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">Money Beat</text>
    <line x1="327" y1="80" x2="453" y2="80" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="327" y1="100" x2="453" y2="100" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="327" y1="120" x2="453" y2="120" stroke="#E5E7EB" stroke-width="1"/>
    <g font-size="11" fill="#374151" text-anchor="middle">
      <text x="335" y="84">×</text><text x="351" y="84">×</text><text x="366" y="84">×</text><text x="382" y="84">×</text><text x="398" y="84">×</text><text x="413" y="84">×</text><text x="429" y="84">×</text><text x="445" y="84">×</text>
    </g>
    <g fill="#C4683A"><circle cx="366" cy="100" r="3.5"/><circle cx="429" cy="100" r="3.5"/></g>
    <g fill="#141B5C"><circle cx="335" cy="120" r="3.5"/><circle cx="398" cy="120" r="3.5"/></g>
  </g>

  <!-- CHILD 1: And-of-3 kick -->
  <g>
    <rect x="5" y="350" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="80" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">And-of-3 Kick</text>
    <line x1="17" y1="388" x2="143" y2="388" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="17" y1="408" x2="143" y2="408" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="17" y1="428" x2="143" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g font-size="11" fill="#374151" text-anchor="middle">
      <text x="25" y="392">×</text><text x="41" y="392">×</text><text x="56" y="392">×</text><text x="72" y="392">×</text><text x="88" y="392">×</text><text x="103" y="392">×</text><text x="119" y="392">×</text><text x="135" y="392">×</text>
    </g>
    <g fill="#C4683A"><circle cx="56" cy="408" r="3.5"/><circle cx="119" cy="408" r="3.5"/></g>
    <g fill="#141B5C"><circle cx="25" cy="428" r="3.5"/><circle cx="88" cy="428" r="3.5"/><circle cx="103" cy="428" r="3.5"/></g>
  </g>

  <!-- CHILD 2: Four-on-the-floor -->
  <g>
    <rect x="160" y="350" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="235" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Four-on-the-Floor</text>
    <line x1="172" y1="388" x2="298" y2="388" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="172" y1="408" x2="298" y2="408" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="172" y1="428" x2="298" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g font-size="11" fill="#374151" text-anchor="middle">
      <text x="180" y="392">×</text><text x="196" y="392">×</text><text x="211" y="392">×</text><text x="227" y="392">×</text><text x="243" y="392">×</text><text x="258" y="392">×</text><text x="274" y="392">×</text><text x="290" y="392">×</text>
    </g>
    <g fill="#C4683A"><circle cx="211" cy="408" r="3.5"/><circle cx="274" cy="408" r="3.5"/></g>
    <g fill="#141B5C"><circle cx="180" cy="428" r="3.5"/><circle cx="211" cy="428" r="3.5"/><circle cx="243" cy="428" r="3.5"/><circle cx="274" cy="428" r="3.5"/></g>
  </g>

  <!-- CHILD 3: Half-time -->
  <g>
    <rect x="315" y="350" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="390" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Half-Time</text>
    <line x1="327" y1="388" x2="453" y2="388" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="327" y1="408" x2="453" y2="408" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="327" y1="428" x2="453" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g font-size="11" fill="#374151" text-anchor="middle">
      <text x="335" y="392">×</text><text x="351" y="392">×</text><text x="366" y="392">×</text><text x="382" y="392">×</text><text x="398" y="392">×</text><text x="413" y="392">×</text><text x="429" y="392">×</text><text x="445" y="392">×</text>
    </g>
    <g fill="#C4683A"><circle cx="398" cy="408" r="3.5"/></g>
    <g fill="#141B5C"><circle cx="335" cy="428" r="3.5"/></g>
  </g>

  <!-- CHILD 4: 16th-note hats -->
  <g>
    <rect x="470" y="350" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="545" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">16th-Note Hats</text>
    <line x1="482" y1="388" x2="608" y2="388" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="482" y1="408" x2="608" y2="408" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="482" y1="428" x2="608" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g font-size="9" fill="#374151" text-anchor="middle">
      <text x="490" y="391">×</text><text x="497" y="391">×</text><text x="505" y="391">×</text><text x="512" y="391">×</text><text x="520" y="391">×</text><text x="527" y="391">×</text><text x="535" y="391">×</text><text x="542" y="391">×</text><text x="550" y="391">×</text><text x="557" y="391">×</text><text x="565" y="391">×</text><text x="572" y="391">×</text><text x="580" y="391">×</text><text x="587" y="391">×</text><text x="595" y="391">×</text><text x="602" y="391">×</text>
    </g>
    <g fill="#C4683A"><circle cx="521" cy="408" r="3.5"/><circle cx="584" cy="408" r="3.5"/></g>
    <g fill="#141B5C"><circle cx="490" cy="428" r="3.5"/><circle cx="553" cy="428" r="3.5"/></g>
  </g>

  <!-- CHILD 5: Ride version -->
  <g>
    <rect x="625" y="350" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="700" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Ride Version</text>
    <line x1="637" y1="388" x2="763" y2="388" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="637" y1="408" x2="763" y2="408" stroke="#E5E7EB" stroke-width="1"/>
    <line x1="637" y1="428" x2="763" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g fill="none" stroke="#D4AF37" stroke-width="1.3">
      <circle cx="645" cy="385" r="4"/><circle cx="661" cy="385" r="4"/><circle cx="676" cy="385" r="4"/><circle cx="692" cy="385" r="4"/><circle cx="708" cy="385" r="4"/><circle cx="723" cy="385" r="4"/><circle cx="739" cy="385" r="4"/><circle cx="755" cy="385" r="4"/>
    </g>
    <g fill="#C4683A"><circle cx="676" cy="408" r="3.5"/><circle cx="739" cy="408" r="3.5"/></g>
    <g fill="#141B5C"><circle cx="645" cy="428" r="3.5"/><circle cx="708" cy="428" r="3.5"/></g>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#374151">
    <text x="20" y="482">Top row × = hi-hat</text>
    <text x="200" y="482">○ = ride cymbal</text>
    <text x="360" y="482"><tspan fill="#C4683A">●</tspan> = snare (backbeat)</text>
    <text x="560" y="482"><tspan fill="#141B5C">●</tspan> = kick (bass drum)</text>
  </g>
</svg>
