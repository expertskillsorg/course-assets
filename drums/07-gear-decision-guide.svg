<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="780" height="520" fill="#FFFFFF"/>
  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">From Living Situation to the Right Setup</text>

  <!-- Start node -->
  <rect x="300" y="48" width="180" height="46" rx="23" fill="#1E2A8E"/>
  <text x="390" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Where do you live?</text>

  <!-- connectors from start to the three living situations -->
  <g stroke="#374151" stroke-width="1.6" fill="none">
    <path d="M340 94 L150 130"/>
    <path d="M390 94 L390 130"/>
    <path d="M440 94 L630 130"/>
  </g>

  <!-- Three living-situation question boxes -->
  <g>
    <rect x="40" y="130" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="150" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">Apartment, thin walls</text>
    <text x="150" y="172" text-anchor="middle" font-size="11" fill="#374151">Neighbors above or below</text>
  </g>
  <g>
    <rect x="280" y="130" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="390" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">Tight budget or unsure</text>
    <text x="390" y="172" text-anchor="middle" font-size="11" fill="#374151">Not ready to spend yet</text>
  </g>
  <g>
    <rect x="520" y="130" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="630" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">House, garage, basement</text>
    <text x="630" y="172" text-anchor="middle" font-size="11" fill="#374151">Space and few neighbors</text>
  </g>

  <!-- middle question row -->
  <g stroke="#374151" stroke-width="1.6" fill="none">
    <path d="M150 190 L150 240"/>
    <path d="M390 190 L390 240"/>
    <path d="M630 190 L630 240"/>
  </g>

  <g>
    <rect x="40" y="240" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <text x="150" y="263" text-anchor="middle" font-size="11.5" fill="#374151">Can spend $300 to $700</text>
    <text x="150" y="281" text-anchor="middle" font-size="11.5" fill="#374151">and use headphones?</text>
  </g>
  <g>
    <rect x="280" y="240" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <text x="390" y="263" text-anchor="middle" font-size="11.5" fill="#374151">Want progress now for</text>
    <text x="390" y="281" text-anchor="middle" font-size="11.5" fill="#374151">near-zero cost?</text>
  </g>
  <g>
    <rect x="520" y="240" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <text x="630" y="263" text-anchor="middle" font-size="11.5" fill="#374151">Okay with loud, and can</text>
    <text x="630" y="281" text-anchor="middle" font-size="11.5" fill="#374151">buy a used kit?</text>
  </g>

  <!-- connectors to outcomes -->
  <g stroke="#3E9B6B" stroke-width="2" fill="none">
    <path d="M150 296 L150 356"/>
    <path d="M390 296 L390 356"/>
    <path d="M630 296 L630 356"/>
  </g>
  <!-- cross link: apartment "no" also lands on pad -->
  <path d="M180 268 C 250 300, 300 330, 360 360" stroke="#C4683A" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  <text x="270" y="322" text-anchor="middle" font-size="10" fill="#C4683A">if not yet</text>

  <!-- Outcome boxes -->
  <g>
    <rect x="40" y="356" width="220" height="70" rx="8" fill="#1E2A8E"/>
    <text x="150" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Electronic Kit</text>
    <text x="150" y="406" text-anchor="middle" font-size="11" fill="#D4AF37">Mesh heads + real kick pedal</text>
  </g>
  <g>
    <rect x="280" y="356" width="220" height="70" rx="8" fill="#3E9B6B"/>
    <text x="390" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Stay on the Pad</text>
    <text x="390" y="406" text-anchor="middle" font-size="11" fill="#FFFFFF">Under $40, fully viable</text>
  </g>
  <g>
    <rect x="520" y="356" width="220" height="70" rx="8" fill="#C4683A"/>
    <text x="630" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Acoustic Kit</text>
    <text x="630" y="406" text-anchor="middle" font-size="11" fill="#FFFFFF">Buy a used five-piece</text>
  </g>

  <!-- footer rule -->
  <line x1="40" y1="460" x2="740" y2="460" stroke="#E5E7EB" stroke-width="1"/>
  <text x="390" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Skip for now: cymbal upgrades, double-kick pedals, extra toms</text>
  <text x="390" y="506" text-anchor="middle" font-size="11" fill="#374151">All three paths play every groove in this course the same. The pad is always a real answer.</text>
</svg>
