<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="640" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">The Ten-Rung Repertoire Ladder</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#374151">Climb one rung at a time; move up only when the rung runs clean along to a real recording.</text>

  <!-- climb arrow -->
  <line x1="30" y1="600" x2="30" y2="80" stroke="#3E9B6B" stroke-width="3"/>
  <path d="M30 72 l-6 12 h12 z" fill="#3E9B6B"/>
  <text x="18" y="360" font-size="11" fill="#3E9B6B" transform="rotate(-90 18 360)" text-anchor="middle">climb</text>

  <!-- phase brackets -->
  <text x="700" y="330" font-size="11" fill="#1E2A8E" transform="rotate(-90 700 330)" text-anchor="middle">Rungs 1-5: earlier-module skills</text>
  <text x="700" y="150" font-size="11" fill="#C4683A" transform="rotate(-90 700 150)" text-anchor="middle">Rungs 6-10: this module</text>

  <!-- rungs: rung i centered at y = 590 - (i-1)*54 -->
  <!-- rung 1 -->
  <g>
    <rect x="90" y="571" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="590" r="16" fill="#1E2A8E"/>
    <text x="90" y="595" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="120" y="595" font-size="13" fill="#111827">Money beat along to one song, no fills</text>
  </g>
  <!-- rung 2 -->
  <g>
    <rect x="90" y="517" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="536" r="16" fill="#1E2A8E"/>
    <text x="90" y="541" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="120" y="541" font-size="13" fill="#111827">Add the and-of-3 kick to a rock song</text>
  </g>
  <!-- rung 3 -->
  <g>
    <rect x="90" y="463" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="482" r="16" fill="#1E2A8E"/>
    <text x="90" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="120" y="487" font-size="13" fill="#111827">Four-on-the-floor to a dance track</text>
  </g>
  <!-- rung 4 -->
  <g>
    <rect x="90" y="409" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="428" r="16" fill="#1E2A8E"/>
    <text x="90" y="433" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="120" y="433" font-size="13" fill="#111827">Half-time groove to a ballad</text>
  </g>
  <!-- rung 5 -->
  <g>
    <rect x="90" y="355" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="374" r="16" fill="#1E2A8E"/>
    <text x="90" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="120" y="379" font-size="13" fill="#111827">Switch between two grooves in one song</text>
  </g>
  <!-- rung 6 -->
  <g>
    <rect x="90" y="301" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="320" r="16" fill="#D4AF37"/>
    <text x="90" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">6</text>
    <text x="120" y="325" font-size="13" fill="#111827">The three-plus-one fill loop, landing on 1</text>
  </g>
  <!-- rung 7 -->
  <g>
    <rect x="90" y="247" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="266" r="16" fill="#D4AF37"/>
    <text x="90" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">7</text>
    <text x="120" y="271" font-size="13" fill="#111827">All three starter fills, clean landings</text>
  </g>
  <!-- rung 8 -->
  <g>
    <rect x="90" y="193" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="212" r="16" fill="#D4AF37"/>
    <text x="90" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">8</text>
    <text x="120" y="217" font-size="13" fill="#111827">16th-note hats and the ride version in a song</text>
  </g>
  <!-- rung 9 -->
  <g>
    <rect x="90" y="139" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="90" cy="158" r="16" fill="#D4AF37"/>
    <text x="90" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">9</text>
    <text x="120" y="163" font-size="13" fill="#111827">Dynamics: quiet verse, loud chorus, tempo steady</text>
  </g>
  <!-- rung 10 -->
  <g>
    <rect x="90" y="85" width="580" height="38" rx="6" fill="#141B5C"/>
    <circle cx="90" cy="104" r="16" fill="#D4AF37"/>
    <text x="90" y="109" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">10</text>
    <text x="120" y="109" font-size="13" font-weight="bold" fill="#FFFFFF">A fully charted song, end to end, twice</text>
  </g>
</svg>
