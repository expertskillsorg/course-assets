<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Arial, sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#141B5C">The 20-Minute Session</text>
  <text x="30" y="66" font-size="14" fill="#374151">Four timed blocks, drawn to scale across twenty minutes.</text>

  <!-- Bar geometry: x from 30 to 690 = 660px for 20 min = 33px/min -->
  <!-- Warm-up 2min: 30 to 96 -->
  <rect x="30" y="92" width="66" height="60" fill="#3E9B6B"/>
  <!-- New material 8min: 96 to 360 -->
  <rect x="96" y="92" width="264" height="60" fill="#1E2A8E"/>
  <!-- Drill work 7min: 360 to 591 -->
  <rect x="360" y="92" width="231" height="60" fill="#C4683A"/>
  <!-- Play-along 3min: 591 to 690 -->
  <rect x="591" y="92" width="99" height="60" fill="#D4AF37"/>

  <!-- Block minute labels inside -->
  <text x="63" y="128" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2 min</text>
  <text x="228" y="128" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8 min</text>
  <text x="475" y="128" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7 min</text>
  <text x="640" y="128" font-size="13" font-weight="bold" fill="#141B5C" text-anchor="middle">3 min</text>

  <!-- Axis ticks at 0,5,10,15,20 -->
  <line x1="30" y1="158" x2="690" y2="158" stroke="#E5E7EB" stroke-width="1"/>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <line x1="30" y1="158" x2="30" y2="166" stroke="#E5E7EB"/><text x="30" y="180">0</text>
    <line x1="195" y1="158" x2="195" y2="166" stroke="#E5E7EB"/><text x="195" y="180">5</text>
    <line x1="360" y1="158" x2="360" y2="166" stroke="#E5E7EB"/><text x="360" y="180">10</text>
    <line x1="525" y1="158" x2="525" y2="166" stroke="#E5E7EB"/><text x="525" y="180">15</text>
    <line x1="690" y1="158" x2="690" y2="166" stroke="#E5E7EB"/><text x="690" y="180">20</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#111827">
    <rect x="30" y="205" width="14" height="14" fill="#3E9B6B"/>
    <text x="50" y="217">Warm-up strokes</text>
    <rect x="200" y="205" width="14" height="14" fill="#1E2A8E"/>
    <text x="220" y="217">New material</text>
    <rect x="360" y="205" width="14" height="14" fill="#C4683A"/>
    <text x="380" y="217">Drill work</text>
    <rect x="500" y="205" width="14" height="14" fill="#D4AF37"/>
    <text x="520" y="217">Play along to a song</text>
  </g>
</svg>
