<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">The Eighth-Note Tom Fill, Landing on Beat 1</text>

  <text x="335" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">one-bar fill</text>
  <text x="655" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">next bar</text>

  <!-- row labels -->
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="108" y="94">Crash</text>
    <text x="108" y="134">Snare</text>
    <text x="108" y="174">Hi tom</text>
    <text x="108" y="214">Mid tom</text>
    <text x="108" y="254">Floor tom</text>
    <text x="108" y="294">Kick</text>
  </g>

  <!-- staff lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="120" y1="90" x2="700" y2="90"/>
    <line x1="120" y1="130" x2="700" y2="130"/>
    <line x1="120" y1="170" x2="700" y2="170"/>
    <line x1="120" y1="210" x2="700" y2="210"/>
    <line x1="120" y1="250" x2="700" y2="250"/>
    <line x1="120" y1="290" x2="700" y2="290"/>
  </g>

  <!-- barlines -->
  <line x1="120" y1="82" x2="120" y2="298" stroke="#374151" stroke-width="2"/>
  <line x1="575" y1="82" x2="575" y2="298" stroke="#374151" stroke-width="2"/>
  <line x1="700" y1="82" x2="700" y2="298" stroke="#374151" stroke-width="2"/>

  <!-- fill notes: snare, hi tom, mid tom, floor tom (two per beat) -->
  <g fill="#C4683A">
    <circle cx="148" cy="130" r="5.5"/><circle cx="203" cy="130" r="5.5"/>
  </g>
  <g fill="#1E2A8E">
    <circle cx="258" cy="170" r="5.5"/><circle cx="313" cy="170" r="5.5"/>
    <circle cx="368" cy="210" r="5.5"/><circle cx="423" cy="210" r="5.5"/>
  </g>
  <g fill="#141B5C">
    <circle cx="478" cy="250" r="5.5"/><circle cx="533" cy="250" r="5.5"/>
  </g>

  <!-- landing: crash + kick on beat 1 -->
  <circle cx="610" cy="90" r="7" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <line x1="605" y1="85" x2="615" y2="95" stroke="#D4AF37" stroke-width="2.5"/>
  <line x1="615" y1="85" x2="605" y2="95" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="610" cy="290" r="5.5" fill="#141B5C"/>
  <path d="M610 100 L610 122" stroke="#3E9B6B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="640" y="200" font-size="13" font-weight="bold" fill="#3E9B6B">LAND HERE</text>
  <text x="640" y="218" font-size="11" fill="#374151">crash + kick, then</text>
  <text x="640" y="233" font-size="11" fill="#374151">back to the groove</text>

  <!-- sticking -->
  <g font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">
    <text x="148" y="322">R</text><text x="203" y="322">L</text><text x="258" y="322">R</text><text x="313" y="322">L</text><text x="368" y="322">R</text><text x="423" y="322">L</text><text x="478" y="322">R</text><text x="533" y="322">L</text>
  </g>
  <!-- counts -->
  <g font-size="12" fill="#1E2A8E" text-anchor="middle">
    <text x="148" y="344">1</text><text x="203" y="344">+</text><text x="258" y="344">2</text><text x="313" y="344">+</text><text x="368" y="344">3</text><text x="423" y="344">+</text><text x="478" y="344">4</text><text x="533" y="344">+</text>
    <text x="610" y="344" font-weight="bold">1</text>
  </g>
  <text x="380" y="372" text-anchor="middle" font-size="11" fill="#374151">Keep counting out loud straight through the fill so your hands never lose beat 1.</text>
</svg>
