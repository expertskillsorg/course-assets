<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Matched Grip: the fulcrum holds, the fingers stay loose</text>

  <!-- The stick -->
  <g>
    <rect x="90" y="196" width="470" height="16" rx="8" fill="#C4683A"/>
    <ellipse cx="558" cy="204" rx="16" ry="12" fill="#C4683A"/>
    <text x="120" y="188" font-size="13" fill="#374151">butt end</text>
    <text x="520" y="188" font-size="13" fill="#374151">tip</text>
  </g>

  <!-- Palm / hand mass -->
  <path d="M175 150 q-40 20 -40 70 q0 55 55 70 q60 16 110 -8 l0 -150 q-60 -22 -125 18 z" fill="#D4AF37" opacity="0.28"/>

  <!-- Thumb -->
  <path d="M200 168 q45 6 78 30 q10 8 4 18 q-8 10 -20 4 q-30 -18 -66 -20 z" fill="#D4AF37" opacity="0.85"/>
  <!-- First finger -->
  <path d="M205 236 q40 -4 76 -24 q11 -6 17 4 q6 11 -6 18 q-36 22 -84 20 z" fill="#3E9B6B" opacity="0.85"/>
  <!-- Back fingers (curled, loose) -->
  <g fill="#1E2A8E" opacity="0.55">
    <path d="M150 250 q26 24 60 26 l0 16 q-40 -2 -70 -28 z"/>
    <path d="M146 278 q28 22 62 22 l0 15 q-42 0 -72 -24 z"/>
    <path d="M144 304 q30 18 60 18 l0 14 q-40 0 -68 -20 z"/>
  </g>

  <!-- Fulcrum marker -->
  <circle cx="286" cy="204" r="15" fill="none" stroke="#C4683A" stroke-width="3"/>
  <circle cx="286" cy="204" r="4" fill="#C4683A"/>

  <!-- Labels with leader lines -->
  <line x1="286" y1="204" x2="286" y2="96" stroke="#374151" stroke-width="1.5"/>
  <rect x="196" y="68" width="180" height="26" rx="4" fill="#141B5C"/>
  <text x="286" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Fulcrum (thumb + first finger)</text>

  <line x1="230" y1="182" x2="150" y2="130" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="126" font-size="14" fill="#3E9B6B" font-weight="bold">Thumb pad</text>

  <line x1="245" y1="228" x2="150" y2="358" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="374" font-size="14" fill="#3E9B6B" font-weight="bold">First finger</text>

  <line x1="180" y1="290" x2="470" y2="290" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="478" y="286" font-size="14" fill="#1E2A8E" font-weight="bold">Back fingers</text>
  <text x="478" y="306" font-size="13" fill="#374151">curled and relaxed,</text>
  <text x="478" y="324" font-size="13" fill="#374151">never squeezing</text>

  <!-- Palm-down note -->
  <text x="120" y="404" font-size="13" fill="#374151">Both hands the same. Palm faces down. A loose grip lets the stick rattle slightly.</text>
</svg>
