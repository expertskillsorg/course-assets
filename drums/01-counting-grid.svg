<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Arial, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="340" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">One bar: count out loud, one stroke per beat</text>

  <!-- Grid columns: 1 and 2 and 3 and 4 and -->
  <!-- x positions for the 8 slots -->
  <!-- beats at 90,230,370,510 ; ands at 160,300,440,580 -->

  <!-- baseline -->
  <line x1="50" y1="150" x2="630" y2="150" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Beat markers (strong) -->
  <g>
    <g>
      <line x1="90" y1="70" x2="90" y2="230" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="230" y1="70" x2="230" y2="230" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="370" y1="70" x2="370" y2="230" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="510" y1="70" x2="510" y2="230" stroke="#E5E7EB" stroke-width="1"/>
    </g>
  </g>

  <!-- Count row -->
  <g font-size="26" font-weight="bold" fill="#141B5C" text-anchor="middle">
    <text x="90" y="112">1</text>
    <text x="230" y="112">2</text>
    <text x="370" y="112">3</text>
    <text x="510" y="112">4</text>
  </g>
  <g font-size="18" fill="#374151" text-anchor="middle">
    <text x="160" y="112">&amp;</text>
    <text x="300" y="112">&amp;</text>
    <text x="440" y="112">&amp;</text>
    <text x="580" y="112">&amp;</text>
  </g>

  <!-- Quarter-note strokes (main): dots on beats -->
  <g fill="#1E2A8E">
    <circle cx="90" cy="150" r="13"/>
    <circle cx="230" cy="150" r="13"/>
    <circle cx="370" cy="150" r="13"/>
    <circle cx="510" cy="150" r="13"/>
  </g>

  <!-- Stroke letters under beats: R L R L -->
  <g font-size="24" font-weight="bold" text-anchor="middle">
    <text x="90" y="200" fill="#C4683A">R</text>
    <text x="230" y="200" fill="#3E9B6B">L</text>
    <text x="370" y="200" fill="#C4683A">R</text>
    <text x="510" y="200" fill="#3E9B6B">L</text>
  </g>

  <!-- Doubling-up row (eighths): smaller dots on ands too -->
  <text x="50" y="272" font-size="14" fill="#374151" font-weight="bold">Doubling up:</text>
  <g>
    <circle cx="90" cy="298" r="10" fill="#C4683A"/>
    <circle cx="160" cy="298" r="10" fill="#3E9B6B"/>
    <circle cx="230" cy="298" r="10" fill="#C4683A"/>
    <circle cx="300" cy="298" r="10" fill="#3E9B6B"/>
    <circle cx="370" cy="298" r="10" fill="#C4683A"/>
    <circle cx="440" cy="298" r="10" fill="#3E9B6B"/>
    <circle cx="510" cy="298" r="10" fill="#C4683A"/>
    <circle cx="580" cy="298" r="10" fill="#3E9B6B"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="90" y="326">R</text><text x="160" y="326">L</text>
    <text x="230" y="326">R</text><text x="300" y="326">L</text>
    <text x="370" y="326">R</text><text x="440" y="326">L</text>
    <text x="510" y="326">R</text><text x="580" y="326">L</text>
  </g>

  <!-- legend -->
  <text x="350" y="272" font-size="13" fill="#374151">two even strokes per beat, one on each "&amp;"</text>
</svg>
