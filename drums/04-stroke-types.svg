<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Three Strokes: Height Is Volume</text>

  <!-- Panel 1: Full stroke (high to high) -->
  <g>
    <text x="120" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">Full stroke</text>
    <text x="120" y="86" text-anchor="middle" font-size="12" fill="#374151">high to high (loud)</text>
    <!-- surface -->
    <line x1="40" y1="300" x2="200" y2="300" stroke="#111827" stroke-width="3"/>
    <text x="120" y="322" text-anchor="middle" font-size="11" fill="#374151">pad</text>
    <!-- height guides -->
    <line x1="120" y1="110" x2="120" y2="300" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- start stick high -->
    <line x1="120" y1="120" x2="150" y2="150" stroke="#C4683A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="150" cy="150" r="5" fill="#C4683A"/>
    <!-- end stick high (ghost) -->
    <line x1="90" y1="150" x2="120" y2="120" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="90" cy="150" r="5" fill="#D4AF37" opacity="0.7"/>
    <!-- motion arc: down to pad and back up -->
    <path d="M132 132 Q120 300 108 132" fill="none" stroke="#3E9B6B" stroke-width="2.5" stroke-dasharray="5 4"/>
    <polygon points="108,132 104,146 114,144" fill="#3E9B6B"/>
    <text x="120" y="106" text-anchor="middle" font-size="10" fill="#3E9B6B">rebounds up</text>
  </g>

  <!-- Panel 2: Down stroke (high to low) -->
  <g>
    <text x="360" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">Down stroke</text>
    <text x="360" y="86" text-anchor="middle" font-size="12" fill="#374151">high to low (loud, then ready)</text>
    <line x1="280" y1="300" x2="440" y2="300" stroke="#111827" stroke-width="3"/>
    <text x="360" y="322" text-anchor="middle" font-size="11" fill="#374151">pad</text>
    <line x1="360" y1="110" x2="360" y2="300" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- start high -->
    <line x1="360" y1="120" x2="390" y2="150" stroke="#C4683A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="390" cy="150" r="5" fill="#C4683A"/>
    <!-- end low (ghost) -->
    <line x1="330" y1="278" x2="360" y2="270" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="330" cy="278" r="5" fill="#D4AF37" opacity="0.7"/>
    <!-- motion arrow: high down, stops low -->
    <path d="M366 136 Q380 250 356 276" fill="none" stroke="#3E9B6B" stroke-width="2.5" stroke-dasharray="5 4"/>
    <polygon points="356,276 352,262 366,266" fill="#3E9B6B"/>
    <text x="360" y="252" text-anchor="middle" font-size="10" fill="#3E9B6B">stays low</text>
  </g>

  <!-- Panel 3: Tap (low to low) -->
  <g>
    <text x="600" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">Tap stroke</text>
    <text x="600" y="86" text-anchor="middle" font-size="12" fill="#374151">low to low (quiet, fast)</text>
    <line x1="520" y1="300" x2="680" y2="300" stroke="#111827" stroke-width="3"/>
    <text x="600" y="322" text-anchor="middle" font-size="11" fill="#374151">pad</text>
    <line x1="600" y1="260" x2="600" y2="300" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- start low -->
    <line x1="600" y1="270" x2="630" y2="278" stroke="#C4683A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="630" cy="278" r="5" fill="#C4683A"/>
    <!-- end low ghost -->
    <line x1="570" y1="278" x2="600" y2="270" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="570" cy="278" r="5" fill="#D4AF37" opacity="0.7"/>
    <!-- small motion arc near surface -->
    <path d="M612 276 Q600 300 588 276" fill="none" stroke="#3E9B6B" stroke-width="2.5" stroke-dasharray="5 4"/>
    <polygon points="588,276 584,289 594,287" fill="#3E9B6B"/>
    <text x="600" y="250" text-anchor="middle" font-size="10" fill="#3E9B6B">short travel</text>
  </g>

  <!-- legend -->
  <g font-size="11">
    <rect x="250" y="338" width="14" height="6" fill="#C4683A"/>
    <text x="270" y="344" fill="#374151">start</text>
    <rect x="330" y="338" width="14" height="6" fill="#D4AF37" opacity="0.7"/>
    <text x="350" y="344" fill="#374151">end</text>
    <line x1="410" y1="341" x2="426" y2="341" stroke="#3E9B6B" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="432" y="344" fill="#374151">motion path</text>
  </g>
</svg>
