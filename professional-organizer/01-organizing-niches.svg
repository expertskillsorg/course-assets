<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Organizing Niches at a Glance</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#374151">Two broad families, each with focused specialties</text>

  <!-- Center hub -->
  <ellipse cx="380" cy="270" rx="78" ry="46" fill="#1E2A8E"/>
  <text x="380" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Professional</text>
  <text x="380" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Organizing</text>

  <!-- Family label: Residential -->
  <rect x="40" y="92" width="220" height="34" rx="6" fill="#3E9B6B"/>
  <text x="150" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Residential (the home)</text>

  <!-- Family label: Life-stage & business -->
  <rect x="500" y="92" width="220" height="34" rx="6" fill="#C4683A"/>
  <text x="610" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Life-Stage &amp; Business</text>

  <!-- connector lines from hub to left cluster -->
  <line x1="312" y1="258" x2="160" y2="160" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="308" y1="270" x2="160" y2="240" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="312" y1="284" x2="160" y2="320" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="318" y1="298" x2="160" y2="400" stroke="#1E2A8E" stroke-width="2"/>

  <!-- connector lines from hub to right cluster -->
  <line x1="448" y1="258" x2="600" y2="160" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="452" y1="270" x2="600" y2="240" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="452" y1="284" x2="600" y2="320" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="442" y1="298" x2="600" y2="400" stroke="#1E2A8E" stroke-width="2"/>

  <!-- LEFT niche pills -->
  <g>
    <rect x="40" y="143" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="160" y="165" text-anchor="middle" font-size="13" fill="#111827">Whole-home &amp; single rooms</text>

    <rect x="40" y="223" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="160" y="245" text-anchor="middle" font-size="13" fill="#111827">Closets &amp; bedrooms</text>

    <rect x="40" y="303" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="160" y="325" text-anchor="middle" font-size="13" fill="#111827">Kitchens &amp; pantries</text>

    <rect x="40" y="383" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="160" y="405" text-anchor="middle" font-size="13" fill="#111827">Paperwork &amp; digital files</text>
  </g>

  <!-- RIGHT niche pills -->
  <g>
    <rect x="480" y="143" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
    <text x="600" y="165" text-anchor="middle" font-size="13" fill="#111827">Move management</text>

    <rect x="480" y="223" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
    <text x="600" y="245" text-anchor="middle" font-size="13" fill="#111827">Downsizing &amp; seniors</text>

    <rect x="480" y="303" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
    <text x="600" y="325" text-anchor="middle" font-size="13" fill="#111827">Small office &amp; business</text>

    <rect x="480" y="383" width="240" height="34" rx="17" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
    <text x="600" y="405" text-anchor="middle" font-size="13" fill="#111827">Estate &amp; relocation add-ons</text>
  </g>

  <!-- rate arrow -->
  <text x="380" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Specializing narrows your focus and tends to raise your rate</text>
  <line x1="180" y1="482" x2="580" y2="482" stroke="#D4AF37" stroke-width="6" stroke-linecap="round"/>
  <polygon points="580,472 600,482 580,492" fill="#D4AF37"/>
  <text x="180" y="505" text-anchor="middle" font-size="12" fill="#374151">general</text>
  <text x="592" y="505" text-anchor="middle" font-size="12" fill="#374151">specialized</text>
</svg>
