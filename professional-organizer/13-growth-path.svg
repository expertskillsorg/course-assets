<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A four-stage growth path from a solo organizer to a scaled business: solo billing hours, premium and recurring offers, bringing on help, and productized income.">
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">From solo to scaled</text>
  <text x="30" y="60" font-family="Arial, sans-serif" font-size="13" fill="#374151">Each stage adds income without simply adding more hours of your own labor.</text>

  <!-- rising baseline arrow -->
  <line x1="40" y1="250" x2="720" y2="150" stroke="#E5E7EB" stroke-width="3"/>
  <polygon points="720,150 702,148 710,160" fill="#E5E7EB"/>

  <!-- Stage 1 -->
  <rect x="40" y="200" width="150" height="70" rx="8" fill="#1E2A8E"/>
  <text x="115" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1. Solo</text>
  <text x="115" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Bill your hours</text>
  <text x="115" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">One job at a time</text>

  <!-- Stage 2 -->
  <rect x="210" y="165" width="150" height="70" rx="8" fill="#3E9B6B"/>
  <text x="285" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2. Raise &amp; recur</text>
  <text x="285" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Premium packages</text>
  <text x="285" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">Maintenance plans</text>

  <!-- Stage 3 -->
  <rect x="380" y="130" width="150" height="70" rx="8" fill="#C4683A"/>
  <text x="455" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3. Add help</text>
  <text x="455" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">A helper or sub</text>
  <text x="455" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">More jobs at once</text>

  <!-- Stage 4 -->
  <rect x="550" y="95" width="160" height="70" rx="8" fill="#D4AF37"/>
  <text x="630" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#141B5C">4. Productize</text>
  <text x="630" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#141B5C">Workshops, products</text>
  <text x="630" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#141B5C">Income beyond hours</text>

  <text x="40" y="292" font-family="Arial, sans-serif" font-size="11" fill="#374151">You do not have to climb every stage. Pick the growth that fits the business and life you want.</text>
</svg>
