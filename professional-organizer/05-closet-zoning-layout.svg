<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Closet Mapped Into Zones</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Best-reach space holds what you use most</text>

  <!-- closet frame -->
  <rect x="60" y="80" width="520" height="300" fill="#FFFFFF" stroke="#374151" stroke-width="3"/>

  <!-- top shelf: seasonal / special -->
  <rect x="60" y="80" width="520" height="64" fill="#E5E7EB" stroke="#374151" stroke-width="1"/>
  <text x="80" y="106" font-size="14" font-weight="bold" fill="#141B5C">TOP SHELF (hard to reach)</text>
  <text x="80" y="128" font-size="12" fill="#374151">Seasonal and special-occasion: luggage, holiday, off-season</text>

  <!-- hang zone left: long hang -->
  <rect x="60" y="144" width="200" height="150" fill="#1E2A8E"/>
  <text x="160" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">LONG HANG</text>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#FFFFFF">Dresses, coats,</text>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#FFFFFF">long garments</text>

  <!-- hang zone right: double hang prime -->
  <rect x="260" y="144" width="320" height="75" fill="#3E9B6B"/>
  <text x="420" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">DAILY ZONE (eye to hip)</text>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#FFFFFF">Shirts, work clothes, most-worn items, matching hangers</text>
  <text x="420" y="206" text-anchor="middle" font-size="11" fill="#FFFFFF">Prime real estate</text>

  <rect x="260" y="219" width="320" height="75" fill="#D4AF37"/>
  <text x="420" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">FOLDED + ACCESSORIES</text>
  <text x="420" y="265" text-anchor="middle" font-size="11" fill="#141B5C">Shelves or drawers: jeans, sweaters, bags, belts</text>

  <!-- floor zone -->
  <rect x="60" y="294" width="520" height="86" fill="#C4683A"/>
  <text x="320" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">FLOOR ZONE</text>
  <text x="320" y="346" text-anchor="middle" font-size="11" fill="#FFFFFF">Shoes on a rack, laundry bin, bins for bulky items. Keep walkable.</text>

  <text x="320" y="404" text-anchor="middle" font-size="11" fill="#374151">Measure first, then place daily items where hands land naturally.</text>
</svg>
