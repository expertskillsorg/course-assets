<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="A decision flow for one item: ask if it is used, loved, or needed; if yes it is a Keep, if no decide between Sell for valuable items, Donate for usable items, and Toss for broken items">
  <rect x="0" y="0" width="720" height="400" fill="#FFFFFF"/>
  <text x="360" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#141B5C">One Item, Four Homes</text>

  <!-- Top question -->
  <rect x="240" y="52" width="240" height="56" rx="8" fill="#1E2A8E"/>
  <text x="360" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Used, loved, or needed?</text>
  <text x="360" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">(client decides)</text>

  <!-- Yes branch -->
  <line x1="300" y1="108" x2="160" y2="150" stroke="#374151" stroke-width="2"/>
  <text x="210" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">YES</text>
  <rect x="70" y="150" width="180" height="60" rx="8" fill="#3E9B6B"/>
  <text x="160" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">KEEP</text>
  <text x="160" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">Goes on to Sort</text>

  <!-- No branch -->
  <line x1="420" y1="108" x2="500" y2="150" stroke="#374151" stroke-width="2"/>
  <text x="475" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C4683A">NO</text>
  <rect x="410" y="150" width="240" height="50" rx="8" fill="#141B5C"/>
  <text x="530" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Then what shape is it in?</text>

  <!-- Three outcomes -->
  <!-- Sell -->
  <line x1="450" y1="200" x2="370" y2="250" stroke="#374151" stroke-width="2"/>
  <rect x="280" y="250" width="160" height="90" rx="8" fill="#D4AF37"/>
  <text x="360" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#141B5C">SELL</text>
  <text x="360" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#141B5C">Valuable and</text>
  <text x="360" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#141B5C">worth the effort:</text>
  <text x="360" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#141B5C">consignment, resale</text>

  <!-- Donate -->
  <line x1="530" y1="200" x2="530" y2="250" stroke="#374151" stroke-width="2"/>
  <rect x="460" y="250" width="160" height="90" rx="8" fill="#3E9B6B"/>
  <text x="540" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">DONATE</text>
  <text x="540" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">Usable but not</text>
  <text x="540" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">sellable: charity,</text>
  <text x="540" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">get a receipt</text>

  <!-- Toss -->
  <line x1="610" y1="200" x2="680" y2="250" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="250" width="160" height="90" rx="8" fill="#C4683A"/>
  <text x="120" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">TOSS</text>
  <text x="120" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">Broken or unsafe:</text>
  <text x="120" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">recycle or</text>
  <text x="120" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">trash, haul away</text>
  <line x1="500" y1="200" x2="120" y2="250" stroke="#374151" stroke-width="2"/>

  <text x="360" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">You guide the questions. The owner makes every call.</text>
</svg>
