<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Five common reasons people keep belongings, arranged around a central pile of stuff">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">Why People Keep Stuff</text>
  <text x="320" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Most clutter is deferred decisions, not laziness</text>

  <!-- center -->
  <circle cx="320" cy="240" r="58" fill="#1E2A8E"/>
  <text x="320" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">The pile</text>
  <text x="320" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E5E7EB">a stack of</text>
  <text x="320" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E5E7EB">put-off choices</text>

  <!-- connectors -->
  <line x1="320" y1="182" x2="150" y2="120" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="182" x2="490" y2="120" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="266" y1="240" x2="120" y2="240" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="374" y1="240" x2="520" y2="240" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="298" x2="320" y2="360" stroke="#E5E7EB" stroke-width="2"/>

  <!-- 1 Guilt / waste -->
  <rect x="40" y="86" width="170" height="64" rx="8" fill="#FBFBF6" stroke="#D4AF37" stroke-width="2"/>
  <text x="54" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C4683A">Guilt and waste</text>
  <text x="54" y="130" font-family="Arial, sans-serif" font-size="11" fill="#374151">"It was expensive."</text>
  <text x="54" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">"It was a gift."</text>

  <!-- 2 Sentiment -->
  <rect x="430" y="86" width="170" height="64" rx="8" fill="#FBFBF6" stroke="#D4AF37" stroke-width="2"/>
  <text x="444" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C4683A">Sentiment</text>
  <text x="444" y="130" font-family="Arial, sans-serif" font-size="11" fill="#374151">The object stands</text>
  <text x="444" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">in for the memory.</text>

  <!-- 3 Someday -->
  <rect x="20" y="208" width="100" height="64" rx="8" fill="#FBFBF6" stroke="#3E9B6B" stroke-width="2"/>
  <text x="34" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3E9B6B">Someday</text>
  <text x="34" y="252" font-family="Arial, sans-serif" font-size="11" fill="#374151">"I might</text>
  <text x="34" y="266" font-family="Arial, sans-serif" font-size="11" fill="#374151">need it."</text>

  <!-- 4 Identity -->
  <rect x="520" y="208" width="100" height="64" rx="8" fill="#FBFBF6" stroke="#3E9B6B" stroke-width="2"/>
  <text x="534" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3E9B6B">Identity</text>
  <text x="534" y="252" font-family="Arial, sans-serif" font-size="11" fill="#374151">Who they</text>
  <text x="534" y="266" font-family="Arial, sans-serif" font-size="11" fill="#374151">hoped to be.</text>

  <!-- 5 Shame -->
  <rect x="225" y="360" width="190" height="50" rx="8" fill="#141B5C"/>
  <text x="320" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Shame</text>
  <text x="320" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E5E7EB">why they waited so long to ask for help</text>
</svg>
