<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Ace to Ten Story Arc</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Every numbered suit walks the same journey, from a seed to a finished cycle</text>

  <!-- Arc path: rises through the middle, peaks, then settles -->
  <path d="M 60 320 Q 230 110 380 150 Q 530 190 700 300" fill="none" stroke="#E5E7EB" stroke-width="3"/>

  <!-- Number nodes along the arc -->
  <!-- 1 Ace -->
  <circle cx="60" cy="320" r="17" fill="#3E9B6B"/>
  <text x="60" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">A</text>
  <text x="60" y="362" text-anchor="middle" font-size="11" fill="#374151">Seed</text>

  <!-- 2 -->
  <circle cx="138" cy="246" r="15" fill="#1E2A8E"/>
  <text x="138" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="138" y="282" text-anchor="middle" font-size="11" fill="#374151">Pair</text>

  <!-- 3 -->
  <circle cx="216" cy="186" r="15" fill="#1E2A8E"/>
  <text x="216" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="216" y="222" text-anchor="middle" font-size="11" fill="#374151">Growth</text>

  <!-- 4 -->
  <circle cx="296" cy="156" r="15" fill="#1E2A8E"/>
  <text x="296" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="296" y="138" text-anchor="middle" font-size="11" fill="#374151">Stability</text>

  <!-- 5 (peak / turning point) -->
  <circle cx="380" cy="150" r="17" fill="#C4683A"/>
  <text x="380" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="380" y="128" text-anchor="middle" font-size="11" fill="#374151">Conflict</text>

  <!-- 6 -->
  <circle cx="464" cy="162" r="15" fill="#1E2A8E"/>
  <text x="464" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="464" y="140" text-anchor="middle" font-size="11" fill="#374151">Recovery</text>

  <!-- 7 -->
  <circle cx="544" cy="194" r="15" fill="#1E2A8E"/>
  <text x="544" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">7</text>
  <text x="544" y="172" text-anchor="middle" font-size="11" fill="#374151">Choice</text>

  <!-- 8 -->
  <circle cx="620" cy="238" r="15" fill="#1E2A8E"/>
  <text x="620" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">8</text>
  <text x="620" y="274" text-anchor="middle" font-size="11" fill="#374151">Effort</text>

  <!-- 9 -->
  <circle cx="664" cy="276" r="15" fill="#1E2A8E"/>
  <text x="664" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">9</text>
  <text x="664" y="312" text-anchor="middle" font-size="11" fill="#374151">Almost</text>

  <!-- 10 -->
  <circle cx="700" cy="300" r="17" fill="#D4AF37"/>
  <text x="700" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">10</text>
  <text x="700" y="342" text-anchor="middle" font-size="11" fill="#374151">Complete</text>

  <!-- loop-back hint: Ten returns to a new Ace -->
  <path d="M 700 320 Q 720 400 380 400 Q 90 400 60 342" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="380" y="396" text-anchor="middle" font-size="11" font-style="italic" fill="#D4AF37">Ten closes the cycle and points back to a fresh Ace</text>
</svg>
