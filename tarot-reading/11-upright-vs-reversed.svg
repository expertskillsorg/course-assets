<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Same Card, Same Energy, Different Setting</text>
  <text x="360" y="62" text-anchor="middle" font-size="14" fill="#374151">A reversal dims or shifts the upright meaning. It is not a new card.</text>

  <!-- Upright card -->
  <rect x="70" y="100" width="150" height="230" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="3"/>
  <text x="145" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">UPRIGHT</text>
  <!-- bright sun symbol -->
  <circle cx="145" cy="215" r="34" fill="#D4AF37"/>
  <g stroke="#D4AF37" stroke-width="4" stroke-linecap="round">
    <line x1="145" y1="155" x2="145" y2="172"/>
    <line x1="145" y1="258" x2="145" y2="275"/>
    <line x1="85" y1="215" x2="102" y2="215"/>
    <line x1="188" y1="215" x2="205" y2="215"/>
    <line x1="103" y1="173" x2="115" y2="185"/>
    <line x1="175" y1="245" x2="187" y2="257"/>
    <line x1="103" y1="257" x2="115" y2="245"/>
    <line x1="175" y1="185" x2="187" y2="173"/>
  </g>
  <text x="145" y="312" text-anchor="middle" font-size="13" fill="#374151">Full, open, flowing</text>

  <!-- Arrow / dimmer -->
  <line x1="245" y1="215" x2="475" y2="215" stroke="#374151" stroke-width="2"/>
  <polygon points="475,215 463,208 463,222" fill="#374151"/>
  <text x="360" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">turn it down</text>
  <text x="360" y="245" text-anchor="middle" font-size="12" fill="#374151">blocked / internal / delayed / weaker</text>

  <!-- Reversed card -->
  <rect x="500" y="100" width="150" height="230" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <text x="575" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">REVERSED</text>
  <!-- dim sun, upside-down feel -->
  <circle cx="575" cy="215" r="34" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <circle cx="575" cy="215" r="20" fill="#D4AF37" opacity="0.45"/>
  <g stroke="#C4683A" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="575" y1="258" x2="575" y2="272"/>
    <line x1="535" y1="245" x2="546" y2="255"/>
    <line x1="615" y1="245" x2="604" y2="255"/>
  </g>
  <text x="575" y="312" text-anchor="middle" font-size="13" fill="#374151">Same light, turned down</text>

  <!-- footer band -->
  <rect x="70" y="358" width="580" height="42" rx="8" fill="#1E2A8E"/>
  <text x="360" y="384" text-anchor="middle" font-size="14" fill="#FFFFFF">Read the upright meaning first, then ask how the reversal changes it.</text>
</svg>
