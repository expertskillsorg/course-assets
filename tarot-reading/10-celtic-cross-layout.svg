<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#141B5C">The Celtic Cross</text>
  <text x="24" y="56" font-size="13" fill="#374151">Six-card cross (the situation) plus a four-card staff (you and your world)</text>

  <!-- Cross group labels -->
  <text x="40" y="92" font-size="12" font-weight="bold" fill="#1E2A8E">THE CROSS</text>
  <text x="470" y="92" font-size="12" font-weight="bold" fill="#3E9B6B">THE STAFF</text>

  <!-- Card 5: crown (above center) -->
  <rect x="200" y="110" width="80" height="110" rx="6" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="210" cy="120" r="11" fill="#1E2A8E"/>
  <text x="210" y="124" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="240" y="170" font-size="11" fill="#374151" text-anchor="middle">Crown</text>
  <text x="240" y="184" font-size="9" fill="#6B7280" text-anchor="middle">goal / best</text>
  <text x="240" y="195" font-size="9" fill="#6B7280" text-anchor="middle">outcome</text>

  <!-- Card 4: recent past (left) -->
  <rect x="100" y="245" width="80" height="110" rx="6" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="110" cy="255" r="11" fill="#1E2A8E"/>
  <text x="110" y="259" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="140" y="304" font-size="11" fill="#374151" text-anchor="middle">Recent</text>
  <text x="140" y="318" font-size="11" fill="#374151" text-anchor="middle">past</text>

  <!-- Card 1: heart (center) -->
  <rect x="200" y="245" width="80" height="110" rx="6" fill="#ffffff" stroke="#141B5C" stroke-width="2.5"/>
  <!-- Card 2: crosses it (sideways over card 1) -->
  <rect x="195" y="270" width="90" height="60" rx="6" fill="#ffffff" stroke="#C4683A" stroke-width="2.5"/>
  <circle cx="210" cy="255" r="11" fill="#141B5C"/>
  <text x="210" y="259" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="272" cy="320" r="11" fill="#C4683A"/>
  <text x="272" y="324" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="240" y="296" font-size="10" fill="#374151" text-anchor="middle">1 Heart</text>
  <text x="240" y="310" font-size="10" fill="#C4683A" text-anchor="middle">2 Crosses</text>

  <!-- Card 6: near future (right) -->
  <rect x="300" y="245" width="80" height="110" rx="6" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="310" cy="255" r="11" fill="#1E2A8E"/>
  <text x="310" y="259" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="340" y="304" font-size="11" fill="#374151" text-anchor="middle">Near</text>
  <text x="340" y="318" font-size="11" fill="#374151" text-anchor="middle">future</text>

  <!-- Card 3: root (below center) -->
  <rect x="200" y="380" width="80" height="70" rx="6" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="210" cy="390" r="11" fill="#1E2A8E"/>
  <text x="210" y="394" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="240" y="425" font-size="11" fill="#374151" text-anchor="middle">Root</text>

  <!-- Staff column (read bottom to top): 10 top, 7 bottom -->
  <!-- Card 10: outcome (top) -->
  <rect x="490" y="105" width="90" height="78" rx="6" fill="#ffffff" stroke="#D4AF37" stroke-width="3"/>
  <circle cx="502" cy="117" r="11" fill="#D4AF37"/>
  <text x="502" y="121" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">10</text>
  <text x="535" y="150" font-size="11" fill="#374151" text-anchor="middle">Outcome</text>

  <!-- Card 9: hopes & fears -->
  <rect x="490" y="190" width="90" height="78" rx="6" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="502" cy="202" r="11" fill="#3E9B6B"/>
  <text x="502" y="206" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <text x="535" y="232" font-size="10" fill="#374151" text-anchor="middle">Hopes</text>
  <text x="535" y="245" font-size="10" fill="#374151" text-anchor="middle">&amp; fears</text>

  <!-- Card 8: environment -->
  <rect x="490" y="275" width="90" height="78" rx="6" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="502" cy="287" r="11" fill="#3E9B6B"/>
  <text x="502" y="291" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="535" y="320" font-size="10" fill="#374151" text-anchor="middle">Environment</text>

  <!-- Card 7: you (bottom) -->
  <rect x="490" y="360" width="90" height="78" rx="6" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="502" cy="372" r="11" fill="#3E9B6B"/>
  <text x="502" y="376" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="535" y="405" font-size="11" fill="#374151" text-anchor="middle">You</text>

  <!-- direction arrow for staff -->
  <text x="610" y="400" font-size="10" fill="#6B7280" text-anchor="middle">read</text>
  <text x="610" y="412" font-size="10" fill="#6B7280" text-anchor="middle">up</text>
  <path d="M610 390 L610 180" stroke="#6B7280" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <path d="M610 180 l-5 9 l10 0 z" fill="#6B7280"/>
</svg>
