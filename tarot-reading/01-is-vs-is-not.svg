<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">What a Tarot Reading Is, and Is Not</text>

  <!-- IS column -->
  <rect x="40" y="70" width="300" height="280" rx="10" fill="#3E9B6B" opacity="0.10"/>
  <rect x="40" y="70" width="300" height="44" rx="10" fill="#3E9B6B"/>
  <text x="190" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">It IS</text>

  <g fill="#111827" font-size="15">
    <circle cx="68" cy="148" r="5" fill="#3E9B6B"/>
    <text x="84" y="153">A tool for reflection</text>
    <circle cx="68" cy="190" r="5" fill="#3E9B6B"/>
    <text x="84" y="195">A prompt for honest thinking</text>
    <circle cx="68" cy="232" r="5" fill="#3E9B6B"/>
    <text x="84" y="237">A learnable skill</text>
    <circle cx="68" cy="274" r="5" fill="#3E9B6B"/>
    <text x="84" y="279">A way to explore choices</text>
    <circle cx="68" cy="316" r="5" fill="#3E9B6B"/>
    <text x="84" y="321">Insight, in your own words</text>
  </g>

  <!-- IS NOT column -->
  <rect x="380" y="70" width="300" height="280" rx="10" fill="#C4683A" opacity="0.10"/>
  <rect x="380" y="70" width="300" height="44" rx="10" fill="#C4683A"/>
  <text x="530" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">It is NOT</text>

  <g fill="#111827" font-size="15">
    <line x1="404" y1="143" x2="414" y2="153" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <line x1="414" y1="143" x2="404" y2="153" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <text x="426" y="153">A fixed prediction</text>
    <line x1="404" y1="185" x2="414" y2="195" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <line x1="414" y1="185" x2="404" y2="195" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <text x="426" y="195">A psychic power</text>
    <line x1="404" y1="227" x2="414" y2="237" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <line x1="414" y1="227" x2="404" y2="237" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <text x="426" y="237">Dangerous or evil</text>
    <line x1="404" y1="269" x2="414" y2="279" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <line x1="414" y1="269" x2="404" y2="279" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <text x="426" y="279">Advice you must obey</text>
    <line x1="404" y1="311" x2="414" y2="321" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <line x1="414" y1="311" x2="404" y2="321" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <text x="426" y="321">Set in stone</text>
  </g>

  <line x1="360" y1="80" x2="360" y2="340" stroke="#E5E7EB" stroke-width="2"/>
</svg>
