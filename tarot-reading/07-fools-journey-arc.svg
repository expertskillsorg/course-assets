<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Fool's Journey, from 0 to 21</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#374151">One person's path through three life stages, told in 22 Major Arcana cards</text>

  <!-- The arc path -->
  <path d="M 70 360 Q 440 90 810 360" fill="none" stroke="#E5E7EB" stroke-width="3"/>

  <!-- Stage bands -->
  <rect x="40" y="396" width="266" height="48" rx="6" fill="#1E2A8E"/>
  <rect x="307" y="396" width="266" height="48" rx="6" fill="#3E9B6B"/>
  <rect x="574" y="396" width="266" height="48" rx="6" fill="#C4683A"/>
  <text x="173" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Early Majors (0 to 7)</text>
  <text x="173" y="434" text-anchor="middle" font-size="10" fill="#ffffff">Setting out, learning the rules</text>
  <text x="440" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Middle Majors (8 to 14)</text>
  <text x="440" y="434" text-anchor="middle" font-size="10" fill="#ffffff">Tests, loss, and turning inward</text>
  <text x="707" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Later Majors (15 to 21)</text>
  <text x="707" y="434" text-anchor="middle" font-size="10" fill="#ffffff">Breaking free, arriving whole</text>

  <!-- Start marker -->
  <circle cx="70" cy="360" r="9" fill="#D4AF37"/>
  <text x="70" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">0 The Fool</text>
  <!-- End marker -->
  <circle cx="810" cy="360" r="9" fill="#D4AF37"/>
  <text x="810" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">21 The World</text>

  <!-- Key waypoints along the arc -->
  <g font-size="10" fill="#374151" text-anchor="middle">
    <circle cx="200" cy="245" r="6" fill="#1E2A8E"/>
    <text x="200" y="232" fill="#141B5C" font-weight="bold">6 Lovers</text>
    <text x="200" y="222">choice</text>

    <circle cx="340" cy="160" r="6" fill="#3E9B6B"/>
    <text x="340" y="147" fill="#141B5C" font-weight="bold">10 Wheel</text>
    <text x="340" y="137">change</text>

    <circle cx="490" cy="150" r="6" fill="#3E9B6B"/>
    <text x="490" y="137" fill="#141B5C" font-weight="bold">13 Death</text>
    <text x="490" y="127">an ending</text>

    <circle cx="640" cy="200" r="6" fill="#C4683A"/>
    <text x="640" y="187" fill="#141B5C" font-weight="bold">16 Tower</text>
    <text x="640" y="177">a jolt</text>

    <circle cx="740" cy="280" r="6" fill="#C4683A"/>
    <text x="740" y="267" fill="#141B5C" font-weight="bold">19 Sun</text>
    <text x="740" y="257">joy</text>
  </g>

  <text x="440" y="382" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">Numbers are stages of one story, not a ranking. A high number is not "better," just later.</text>
</svg>
