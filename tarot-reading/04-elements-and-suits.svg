<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Four Elements, Four Suits</text>
  <text x="380" y="64" text-anchor="middle" font-size="14" fill="#374151">Each suit carries the energy of one element</text>

  <!-- Fire / Wands -->
  <g>
    <rect x="40" y="90" width="320" height="135" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="92" cy="135" r="26" fill="#C4683A"/>
    <path d="M92 121 q10 10 0 22 q-10 -8 0 -22 z" fill="#FFFFFF"/>
    <text x="132" y="128" font-size="18" font-weight="bold" fill="#C4683A">Fire</text>
    <text x="132" y="150" font-size="16" font-weight="bold" fill="#141B5C">Wands</text>
    <text x="60" y="182" font-size="13" fill="#374151">Energy, action, passion,</text>
    <text x="60" y="200" font-size="13" fill="#374151">creativity, drive, ambition</text>
  </g>

  <!-- Water / Cups -->
  <g>
    <rect x="400" y="90" width="320" height="135" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="452" cy="135" r="26" fill="#1E2A8E"/>
    <path d="M452 122 q12 12 0 24 q-12 -12 0 -24 z" fill="#FFFFFF"/>
    <text x="492" y="128" font-size="18" font-weight="bold" fill="#1E2A8E">Water</text>
    <text x="492" y="150" font-size="16" font-weight="bold" fill="#141B5C">Cups</text>
    <text x="420" y="182" font-size="13" fill="#374151">Emotion, love, relationships,</text>
    <text x="420" y="200" font-size="13" fill="#374151">intuition, feelings, the heart</text>
  </g>

  <!-- Air / Swords -->
  <g>
    <rect x="40" y="245" width="320" height="135" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="92" cy="290" r="26" fill="#374151"/>
    <path d="M80 290 h24 M92 278 v24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="132" y="283" font-size="18" font-weight="bold" fill="#374151">Air</text>
    <text x="132" y="305" font-size="16" font-weight="bold" fill="#141B5C">Swords</text>
    <text x="60" y="337" font-size="13" fill="#374151">Thought, logic, truth,</text>
    <text x="60" y="355" font-size="13" fill="#374151">conflict, communication, words</text>
  </g>

  <!-- Earth / Pentacles -->
  <g>
    <rect x="400" y="245" width="320" height="135" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="452" cy="290" r="26" fill="#3E9B6B"/>
    <path d="M452 277 l11 8 -4 13 h-14 l-4 -13 z" fill="#FFFFFF"/>
    <text x="492" y="283" font-size="18" font-weight="bold" fill="#3E9B6B">Earth</text>
    <text x="492" y="305" font-size="16" font-weight="bold" fill="#141B5C">Pentacles</text>
    <text x="420" y="337" font-size="13" fill="#374151">Money, work, body, home,</text>
    <text x="420" y="355" font-size="13" fill="#374151">the practical and material world</text>
  </g>

  <!-- center gold dot -->
  <circle cx="380" cy="235" r="6" fill="#D4AF37"/>
</svg>
