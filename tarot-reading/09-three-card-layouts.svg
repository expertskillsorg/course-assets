<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Three-Card Spread</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">One layout, three positions, read left to right</text>

  <!-- The three card slots -->
  <g>
    <rect x="120" y="78" width="120" height="160" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="3"/>
    <rect x="300" y="78" width="120" height="160" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="3"/>
    <rect x="480" y="78" width="120" height="160" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="3"/>

    <text x="180" y="158" text-anchor="middle" font-size="42" font-weight="bold" fill="#D4AF37">1</text>
    <text x="360" y="158" text-anchor="middle" font-size="42" font-weight="bold" fill="#D4AF37">2</text>
    <text x="540" y="158" text-anchor="middle" font-size="42" font-weight="bold" fill="#D4AF37">3</text>

    <text x="180" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Card one</text>
    <text x="360" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Card two</text>
    <text x="540" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Card three</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#3E9B6B" stroke-width="3" fill="none">
    <line x1="248" y1="150" x2="290" y2="150"/>
    <polygon points="292,150 282,145 282,155" fill="#3E9B6B" stroke="none"/>
    <line x1="428" y1="150" x2="470" y2="150"/>
    <polygon points="472,150 462,145 462,155" fill="#3E9B6B" stroke="none"/>
  </g>

  <!-- Position-set table -->
  <text x="60" y="288" font-size="13" font-weight="bold" fill="#141B5C">Three ways to name the same three positions:</text>

  <!-- row backgrounds -->
  <rect x="60" y="300" width="600" height="34" fill="#F3F4F6"/>
  <rect x="60" y="368" width="600" height="34" fill="#F3F4F6"/>

  <g font-size="13" text-anchor="middle">
    <text x="180" y="322" fill="#C4683A" font-weight="bold">Past</text>
    <text x="360" y="322" fill="#C4683A" font-weight="bold">Present</text>
    <text x="540" y="322" fill="#C4683A" font-weight="bold">Future</text>

    <text x="180" y="356" fill="#1E2A8E" font-weight="bold">Situation</text>
    <text x="360" y="356" fill="#1E2A8E" font-weight="bold">Action</text>
    <text x="540" y="356" fill="#1E2A8E" font-weight="bold">Outcome</text>

    <text x="180" y="390" fill="#3E9B6B" font-weight="bold">Mind</text>
    <text x="360" y="390" fill="#3E9B6B" font-weight="bold">Body</text>
    <text x="540" y="390" fill="#3E9B6B" font-weight="bold">Spirit</text>
  </g>

  <!-- column dividers -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="270" y1="300" x2="270" y2="402"/>
    <line x1="450" y1="300" x2="450" y2="402"/>
  </g>
</svg>
