<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <!-- Top: whole deck -->
  <rect x="270" y="20" width="180" height="56" rx="8" fill="#141B5C"/>
  <text x="360" y="44" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">The Full Deck</text>
  <text x="360" y="64" text-anchor="middle" fill="#ffffff" font-size="15">78 cards</text>

  <!-- connectors from deck to two halves -->
  <path d="M360 76 L360 92 L180 92 L180 110" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M360 76 L360 92 L540 92 L540 110" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Major Arcana half -->
  <rect x="90" y="110" width="180" height="60" rx="8" fill="#1E2A8E"/>
  <text x="180" y="135" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Major Arcana</text>
  <text x="180" y="156" text-anchor="middle" fill="#ffffff" font-size="14">22 cards, big life themes</text>

  <!-- Minor Arcana half -->
  <rect x="450" y="110" width="180" height="60" rx="8" fill="#3E9B6B"/>
  <text x="540" y="135" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Minor Arcana</text>
  <text x="540" y="156" text-anchor="middle" fill="#ffffff" font-size="14">56 cards, everyday life</text>

  <!-- Major leaf note -->
  <text x="180" y="205" text-anchor="middle" fill="#374151" font-size="13">e.g. The Fool, Death, The Sun</text>

  <!-- connectors from Minor to four suits -->
  <path d="M540 170 L540 196 L150 196 L150 220" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M540 170 L540 196 L350 196 L350 220" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M540 170 L540 196 L530 196 L530 220" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M540 170 L540 196 L630 196 L630 220" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Four suits -->
  <g>
    <rect x="100" y="220" width="100" height="48" rx="6" fill="#C4683A"/>
    <text x="150" y="242" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Wands</text>
    <text x="150" y="260" text-anchor="middle" fill="#ffffff" font-size="12">14 cards</text>
  </g>
  <g>
    <rect x="300" y="220" width="100" height="48" rx="6" fill="#C4683A"/>
    <text x="350" y="242" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Cups</text>
    <text x="350" y="260" text-anchor="middle" fill="#ffffff" font-size="12">14 cards</text>
  </g>
  <g>
    <rect x="480" y="220" width="100" height="48" rx="6" fill="#C4683A"/>
    <text x="530" y="242" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Swords</text>
    <text x="530" y="260" text-anchor="middle" fill="#ffffff" font-size="12">14 cards</text>
  </g>
  <g>
    <rect x="580" y="220" width="110" height="48" rx="6" fill="#C4683A"/>
    <text x="635" y="242" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Pentacles</text>
    <text x="635" y="260" text-anchor="middle" fill="#ffffff" font-size="12">14 cards</text>
  </g>

  <!-- Inside-a-suit breakdown box -->
  <rect x="120" y="310" width="480" height="120" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <text x="360" y="334" text-anchor="middle" fill="#111827" font-size="15" font-weight="bold">Inside every suit: 14 cards</text>

  <rect x="150" y="350" width="180" height="56" rx="6" fill="#D4AF37"/>
  <text x="240" y="374" text-anchor="middle" fill="#141B5C" font-size="14" font-weight="bold">10 numbered cards</text>
  <text x="240" y="393" text-anchor="middle" fill="#141B5C" font-size="13">Ace through Ten</text>

  <rect x="390" y="350" width="180" height="56" rx="6" fill="#D4AF37"/>
  <text x="480" y="374" text-anchor="middle" fill="#141B5C" font-size="14" font-weight="bold">4 court cards</text>
  <text x="480" y="393" text-anchor="middle" fill="#141B5C" font-size="13">Page, Knight, Queen, King</text>

  <text x="360" y="450" text-anchor="middle" fill="#374151" font-size="13">22 Major + (4 suits x 14) = 22 + 56 = 78</text>
</svg>
