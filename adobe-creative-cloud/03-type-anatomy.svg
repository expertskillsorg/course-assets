<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Type Anatomy, One Specimen</text>

  <!-- FAMILY: the specimen word -->
  <text x="60" y="150" font-size="88" font-weight="bold" fill="#1E2A8E" font-family="Georgia, serif">Type</text>
  <line x1="60" y1="170" x2="290" y2="170" stroke="#D4AF37" stroke-width="2"/>
  <text x="60" y="196" font-size="15" fill="#374151">Family: a serif face (note the small feet on each letter)</text>

  <!-- WEIGHT -->
  <text x="360" y="110" font-size="34" font-weight="300" fill="#111827" font-family="Arial, sans-serif">Light</text>
  <text x="360" y="150" font-size="34" font-weight="normal" fill="#111827" font-family="Arial, sans-serif">Regular</text>
  <text x="360" y="190" font-size="34" font-weight="bold" fill="#111827" font-family="Arial, sans-serif">Bold</text>
  <line x1="500" y1="90" x2="500" y2="200" stroke="#3E9B6B" stroke-width="2"/>
  <text x="512" y="150" font-size="15" fill="#374151">Weight: stroke</text>
  <text x="512" y="170" font-size="15" fill="#374151">thickness</text>

  <!-- LEADING -->
  <rect x="60" y="240" width="250" height="120" fill="#F5F6FA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="76" y="272" font-size="19" fill="#111827">One line of text</text>
  <text x="76" y="308" font-size="19" fill="#111827">A second line</text>
  <text x="76" y="344" font-size="19" fill="#111827">A third line</text>
  <line x1="290" y1="258" x2="290" y2="294" stroke="#C4683A" stroke-width="2"/>
  <line x1="286" y1="258" x2="294" y2="258" stroke="#C4683A" stroke-width="2"/>
  <line x1="286" y1="294" x2="294" y2="294" stroke="#C4683A" stroke-width="2"/>
  <text x="76" y="392" font-size="15" fill="#374151">Leading: space between lines</text>

  <!-- TRACKING -->
  <text x="360" y="272" font-size="30" fill="#1E2A8E" letter-spacing="12" font-family="Arial, sans-serif">SPACE</text>
  <line x1="360" y1="292" x2="560" y2="292" stroke="#D4AF37" stroke-width="2"/>
  <text x="360" y="330" font-size="15" fill="#374151">Tracking: space between letters</text>
  <text x="360" y="352" font-size="15" fill="#374151">across a whole word</text>
</svg>
