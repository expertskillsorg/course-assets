<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="620" height="660" fill="#FFFFFF"/>

  <!-- Bleed box (outermost) -->
  <rect x="60" y="70" width="380" height="500" fill="#F7F3EA" stroke="#C4683A" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- Hero photo bleeding to the bleed edge at the top -->
  <rect x="60" y="70" width="380" height="150" fill="#1E2A8E"/>
  <rect x="60" y="70" width="380" height="150" fill="#141B5C" opacity="0.25"/>
  <text x="250" y="150" fill="#FFFFFF" font-size="15" text-anchor="middle" opacity="0.85">hero photo runs to the bleed</text>

  <!-- Trim box (the page / cut line) -->
  <rect x="80" y="90" width="340" height="460" fill="none" stroke="#1E2A8E" stroke-width="2.5"/>

  <!-- Margin box (safety zone) -->
  <rect x="118" y="128" width="264" height="384" fill="none" stroke="#3E9B6B" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Content living inside the margin -->
  <rect x="150" y="250" width="200" height="20" rx="3" fill="#D4AF37"/>
  <rect x="150" y="285" width="150" height="10" rx="3" fill="#374151"/>
  <rect x="150" y="305" width="170" height="10" rx="3" fill="#374151"/>
  <circle cx="250" cy="430" r="34" fill="none" stroke="#3E9B6B" stroke-width="3"/>
  <text x="250" y="436" fill="#3E9B6B" font-size="12" text-anchor="middle">logo</text>

  <!-- Labels and leaders: bleed -->
  <line x1="440" y1="70" x2="560" y2="40" stroke="#C4683A" stroke-width="1.2"/>
  <circle cx="440" cy="70" r="3" fill="#C4683A"/>
  <text x="470" y="30" fill="#C4683A" font-size="14" font-weight="bold">Bleed line</text>
  <text x="470" y="48" fill="#374151" font-size="12">ink extends past the cut</text>

  <!-- trim -->
  <line x1="420" y1="200" x2="560" y2="230" stroke="#1E2A8E" stroke-width="1.2"/>
  <circle cx="420" cy="200" r="3" fill="#1E2A8E"/>
  <text x="470" y="222" fill="#1E2A8E" font-size="14" font-weight="bold">Trim line</text>
  <text x="470" y="240" fill="#374151" font-size="12">where the blade cuts</text>

  <!-- margin -->
  <line x1="382" y1="380" x2="560" y2="410" stroke="#3E9B6B" stroke-width="1.2"/>
  <circle cx="382" cy="380" r="3" fill="#3E9B6B"/>
  <text x="470" y="402" fill="#3E9B6B" font-size="14" font-weight="bold">Margin</text>
  <text x="470" y="420" fill="#374151" font-size="12">keep text safely inside</text>

  <!-- Bottom legend -->
  <text x="60" y="610" fill="#111827" font-size="13" font-weight="bold">Three boundaries, set once in the New Document dialog:</text>
  <text x="60" y="632" fill="#374151" font-size="12.5">Bleed (about 0.125 in out) • Trim (the finished page) • Margin (about 0.25-0.5 in in)</text>
</svg>
