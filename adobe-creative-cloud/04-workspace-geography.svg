<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#F8F9FB"/>

  <!-- App window frame -->
  <rect x="20" y="20" width="600" height="380" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Options bar (top) -->
  <rect x="20" y="20" width="600" height="46" rx="8" fill="#141B5C"/>
  <rect x="20" y="54" width="600" height="12" fill="#141B5C"/>
  <circle cx="52" cy="43" r="9" fill="#D4AF37"/>
  <rect x="72" y="37" width="70" height="12" rx="3" fill="#3A4693"/>
  <rect x="156" y="37" width="46" height="12" rx="3" fill="#3A4693"/>
  <rect x="216" y="37" width="90" height="12" rx="3" fill="#3A4693"/>
  <text x="470" y="47" fill="#C9CEEA" font-size="13" font-weight="bold">OPTIONS BAR</text>

  <!-- Toolbar (left) -->
  <rect x="20" y="66" width="60" height="334" fill="#1E2A8E"/>
  <g fill="#C9CEEA">
    <rect x="38" y="86" width="24" height="18" rx="3"/>
    <rect x="38" y="118" width="24" height="18" rx="3"/>
    <rect x="38" y="150" width="24" height="18" rx="3"/>
    <rect x="38" y="182" width="24" height="18" rx="3"/>
    <rect x="38" y="214" width="24" height="18" rx="3"/>
    <rect x="38" y="246" width="24" height="18" rx="3"/>
  </g>
  <rect x="38" y="86" width="24" height="18" rx="3" fill="#D4AF37"/>
  <text x="50" y="376" fill="#C9CEEA" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 50 340)">TOOLBAR</text>

  <!-- Panels (right) -->
  <rect x="470" y="66" width="150" height="334" fill="#F0F1F6"/>
  <rect x="470" y="66" width="150" height="26" fill="#374151"/>
  <text x="545" y="84" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Layers</text>
  <g>
    <rect x="484" y="104" width="122" height="30" rx="3" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="484" y="140" width="122" height="30" rx="3" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="484" y="176" width="122" height="30" rx="3" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="497" cy="119" r="5" fill="#3E9B6B"/>
    <circle cx="497" cy="155" r="5" fill="#3E9B6B"/>
    <circle cx="497" cy="191" r="5" fill="#3E9B6B"/>
  </g>
  <text x="545" y="388" fill="#374151" font-size="12" font-weight="bold" text-anchor="middle">PANELS</text>

  <!-- Canvas (center) -->
  <rect x="92" y="80" width="366" height="306" rx="4" fill="#EBEDF2" stroke="#E5E7EB"/>
  <rect x="120" y="108" width="310" height="250" rx="4" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <!-- simple pet silhouette -->
  <ellipse cx="260" cy="250" rx="70" ry="52" fill="#C4683A"/>
  <circle cx="325" cy="205" r="40" fill="#C4683A"/>
  <path d="M300 175 L292 150 L312 168 Z" fill="#C4683A"/>
  <path d="M350 175 L358 150 L338 168 Z" fill="#C4683A"/>
  <circle cx="315" cy="205" r="5" fill="#141B5C"/>
  <circle cx="337" cy="205" r="5" fill="#141B5C"/>
  <ellipse cx="326" cy="220" rx="7" ry="5" fill="#141B5C"/>
  <text x="275" y="348" fill="#374151" font-size="13" font-weight="bold" text-anchor="middle">CANVAS</text>
</svg>
