<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#141B5C">Anchor points, handles, and the curves they control</text>

  <!-- Smooth-point curve on left -->
  <text x="40" y="72" font-size="13" fill="#374151">Smooth point (drag = curve)</text>

  <!-- the path -->
  <path d="M70 230 C 130 90, 250 90, 310 230" fill="none" stroke="#1E2A8E" stroke-width="4"/>

  <!-- handles on the top smooth point at midpoint (190,120) -->
  <!-- direction handles as dashed lines -->
  <line x1="190" y1="120" x2="120" y2="120" stroke="#C4683A" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="190" y1="120" x2="260" y2="120" stroke="#C4683A" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- handle ends (round) -->
  <circle cx="120" cy="120" r="7" fill="#C4683A"/>
  <circle cx="260" cy="120" r="7" fill="#C4683A"/>
  <!-- smooth anchor (square) -->
  <rect x="182" y="112" width="16" height="16" fill="#ffffff" stroke="#141B5C" stroke-width="3"/>

  <!-- end anchors (square) -->
  <rect x="62" y="222" width="16" height="16" fill="#141B5C"/>
  <rect x="302" y="222" width="16" height="16" fill="#141B5C"/>

  <text x="120" y="105" font-size="11" fill="#C4683A">handle</text>
  <text x="238" y="105" font-size="11" fill="#C4683A">handle</text>
  <text x="210" y="128" font-size="11" fill="#141B5C">anchor</text>

  <!-- Corner point on right -->
  <text x="470" y="72" font-size="13" fill="#374151">Corner point (click = angle)</text>

  <polyline points="470,230 570,110 670,230" fill="none" stroke="#3E9B6B" stroke-width="4"/>
  <!-- corner anchors -->
  <rect x="462" y="222" width="16" height="16" fill="#141B5C"/>
  <rect x="662" y="222" width="16" height="16" fill="#141B5C"/>
  <rect x="562" y="102" width="16" height="16" fill="#ffffff" stroke="#141B5C" stroke-width="3"/>
  <text x="570" y="98" font-size="11" fill="#141B5C" text-anchor="middle">no handles</text>

  <!-- caption note -->
  <text x="30" y="295" font-size="12" fill="#374151">Longer handles make a broader bend. A corner point has no handles, so the line stays sharp.</text>
</svg>
