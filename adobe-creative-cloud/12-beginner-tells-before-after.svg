<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>

  <!-- Titles -->
  <text x="200" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#C4683A">BEFORE</text>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#3E9B6B">AFTER</text>

  <!-- ============ BEFORE panel ============ -->
  <rect x="40" y="52" width="320" height="360" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>

  <!-- stretched photo (squashed proportions) -->
  <rect x="70" y="78" width="260" height="90" fill="#9CA3AF"/>
  <path d="M70 168 L140 120 L185 150 L245 100 L330 168 Z" fill="#6B7280"/>
  <circle cx="290" cy="108" r="14" fill="#D4AF37"/>
  <text x="200" y="185" text-anchor="middle" font-size="10" fill="#C4683A">stretched, wrong proportions</text>

  <!-- rainbow palette dots -->
  <circle cx="86" cy="212" r="10" fill="#C4683A"/>
  <circle cx="112" cy="212" r="10" fill="#D4AF37"/>
  <circle cx="138" cy="212" r="10" fill="#3E9B6B"/>
  <circle cx="164" cy="212" r="10" fill="#1E2A8E"/>
  <circle cx="190" cy="212" r="10" fill="#8E1E6B"/>
  <text x="215" y="216" font-size="10" fill="#C4683A">too many colors</text>

  <!-- centered everything, default font -->
  <text x="200" y="256" text-anchor="middle" font-size="22" fill="#111827" font-family="Times New Roman, serif">Corner Bakery</text>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#374151" font-family="Times New Roman, serif">Now Open on 5th Street</text>
  <text x="200" y="300" text-anchor="middle" font-size="12" fill="#374151" font-family="Times New Roman, serif">Come and see us today</text>
  <text x="200" y="326" text-anchor="middle" font-size="10" fill="#C4683A">everything centered, default type</text>

  <!-- fake drop shadow box -->
  <rect x="128" y="346" width="150" height="34" fill="#B0B0B0"/>
  <rect x="122" y="340" width="150" height="34" fill="#1E2A8E"/>
  <text x="197" y="361" text-anchor="middle" font-size="12" fill="#FFFFFF">VISIT US</text>
  <text x="200" y="398" text-anchor="middle" font-size="10" fill="#C4683A">heavy drop shadow</text>

  <!-- ============ AFTER panel ============ -->
  <rect x="400" y="52" width="320" height="360" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- correct-proportion photo -->
  <rect x="430" y="78" width="260" height="120" fill="#374151"/>
  <path d="M430 198 L500 150 L545 176 L605 130 L690 198 Z" fill="#1E2A8E"/>
  <circle cx="650" cy="140" r="14" fill="#D4AF37"/>

  <!-- restrained palette: two colors -->
  <circle cx="446" cy="228" r="10" fill="#1E2A8E"/>
  <circle cx="472" cy="228" r="10" fill="#D4AF37"/>
  <text x="497" y="232" font-size="10" fill="#3E9B6B">two colors, with intent</text>

  <!-- left-aligned hierarchy, paired type -->
  <text x="430" y="270" font-size="24" font-weight="bold" fill="#1E2A8E">Corner Bakery</text>
  <text x="430" y="292" font-size="13" fill="#374151">Now open on 5th Street</text>
  <text x="430" y="312" font-size="11" fill="#6B7280">Come and see us today</text>

  <!-- clean flat button aligned left -->
  <rect x="430" y="336" width="120" height="34" fill="#3E9B6B"/>
  <text x="490" y="358" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">VISIT US</text>
  <text x="430" y="394" font-size="10" fill="#3E9B6B">aligned, clear hierarchy, no shadow</text>

  <!-- divider arrow -->
  <path d="M366 232 L394 232" stroke="#374151" stroke-width="2"/>
  <path d="M388 226 L396 232 L388 238 Z" fill="#374151"/>
</svg>
