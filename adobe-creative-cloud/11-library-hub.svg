<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">One library, three apps</text>

  <!-- Central library panel -->
  <rect x="240" y="150" width="160" height="130" rx="8" fill="#1E2A8E"/>
  <text x="320" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Bakery Library</text>
  <!-- swatches -->
  <rect x="258" y="188" width="22" height="22" rx="3" fill="#C4683A"/>
  <rect x="284" y="188" width="22" height="22" rx="3" fill="#D4AF37"/>
  <rect x="310" y="188" width="22" height="22" rx="3" fill="#3E9B6B"/>
  <rect x="336" y="188" width="22" height="22" rx="3" fill="#E5E7EB"/>
  <!-- logo asset -->
  <circle cx="272" cy="238" r="16" fill="#D4AF37"/>
  <text x="272" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">logo</text>
  <!-- type style asset -->
  <rect x="300" y="224" width="82" height="28" rx="4" fill="#FFFFFF"/>
  <text x="341" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Aa type</text>

  <!-- Arrows to three apps -->
  <path d="M240 190 L150 120" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M320 150 L320 96" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M400 190 L490 120" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Photoshop card -->
  <rect x="80" y="66" width="120" height="54" rx="6" fill="#141B5C"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Photoshop</text>
  <text x="140" y="108" text-anchor="middle" font-size="10" fill="#D4AF37">edit pixels</text>

  <!-- Illustrator card -->
  <rect x="260" y="42" width="120" height="54" rx="6" fill="#141B5C"/>
  <text x="320" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Illustrator</text>
  <text x="320" y="84" text-anchor="middle" font-size="10" fill="#D4AF37">draw shapes</text>

  <!-- InDesign card -->
  <rect x="440" y="66" width="120" height="54" rx="6" fill="#141B5C"/>
  <text x="500" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">InDesign</text>
  <text x="500" y="108" text-anchor="middle" font-size="10" fill="#D4AF37">arrange pages</text>

  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#374151">Add the palette, logo, and type styles once. Every app pulls the same brand.</text>
  <text x="320" y="352" text-anchor="middle" font-size="12" fill="#374151">Update an asset here, and the change ripples everywhere it is used.</text>
</svg>
