<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="Arial, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">One Page, Read Two Ways</text>

  <!-- LEFT: Z-pattern -->
  <text x="170" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">The Z-pattern path</text>
  <rect x="50" y="80" width="240" height="320" fill="#F5F6FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Z path -->
  <path d="M80 120 L260 120 L80 360 L260 360" fill="none" stroke="#C4683A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- points -->
  <circle cx="80" cy="120" r="14" fill="#1E2A8E"/><text x="80" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="260" cy="120" r="14" fill="#1E2A8E"/><text x="260" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="80" cy="360" r="14" fill="#1E2A8E"/><text x="80" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <circle cx="260" cy="360" r="14" fill="#D4AF37"/><text x="260" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">4</text>
  <text x="100" y="150" font-size="11" fill="#374151">event name</text>
  <text x="205" y="150" font-size="11" fill="#374151">image</text>
  <text x="100" y="345" font-size="11" fill="#374151">details</text>
  <text x="200" y="345" font-size="11" fill="#374151">tickets</text>

  <!-- RIGHT: column grid -->
  <text x="510" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">A three-column grid</text>
  <rect x="390" y="80" width="240" height="320" fill="#F5F6FA" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- margin -->
  <rect x="410" y="100" width="200" height="280" fill="none" stroke="#3E9B6B" stroke-width="1.5" stroke-dasharray="5 5"/>
  <!-- three columns -->
  <rect x="410" y="100" width="60" height="280" fill="#E9ECF6"/>
  <rect x="480" y="100" width="60" height="280" fill="#E9ECF6"/>
  <rect x="550" y="100" width="60" height="280" fill="#E9ECF6"/>
  <!-- elements aligned to columns -->
  <rect x="410" y="120" width="200" height="40" fill="#1E2A8E"/>
  <rect x="410" y="180" width="130" height="90" fill="#D4AF37"/>
  <rect x="550" y="180" width="60" height="90" fill="#3E9B6B"/>
  <rect x="410" y="290" width="200" height="20" fill="#C4683A"/>
  <rect x="410" y="330" width="130" height="14" fill="#9AA3B2"/>
  <text x="510" y="418" text-anchor="middle" font-size="11" fill="#374151">every edge lands on a column line</text>
</svg>
