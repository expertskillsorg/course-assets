<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#141B5C">The logo process narrows to one kit</text>

  <!-- funnel band showing narrowing options -->
  <polygon points="30,90 730,120 730,150 30,150" fill="#E5E7EB" opacity="0.6"/>

  <!-- Stage 1: Brief -->
  <circle cx="90" cy="200" r="46" fill="#1E2A8E"/>
  <text x="90" y="196" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="90" y="216" font-size="12" fill="#FFFFFF" text-anchor="middle">Brief</text>
  <text x="90" y="272" font-size="11" fill="#374151" text-anchor="middle">read the words</text>

  <!-- Stage 2: Sketches -->
  <circle cx="238" cy="200" r="42" fill="#3E9B6B"/>
  <text x="238" y="196" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="238" y="216" font-size="12" fill="#FFFFFF" text-anchor="middle">Sketches</text>
  <text x="238" y="272" font-size="11" fill="#374151" text-anchor="middle">ten thumbnails</text>

  <!-- Stage 3: Concepts -->
  <circle cx="386" cy="200" r="38" fill="#D4AF37"/>
  <text x="386" y="196" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">3</text>
  <text x="386" y="216" font-size="12" fill="#141B5C" text-anchor="middle">Concepts</text>
  <text x="386" y="272" font-size="11" fill="#374151" text-anchor="middle">develop two</text>

  <!-- Stage 4: Refine -->
  <circle cx="524" cy="200" r="34" fill="#C4683A"/>
  <text x="524" y="196" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="524" y="216" font-size="12" fill="#FFFFFF" text-anchor="middle">Refine</text>
  <text x="524" y="272" font-size="11" fill="#374151" text-anchor="middle">tighten one</text>

  <!-- Stage 5: Kit -->
  <circle cx="660" cy="200" r="30" fill="#141B5C"/>
  <text x="660" y="196" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="660" y="215" font-size="11" fill="#FFFFFF" text-anchor="middle">Kit</text>
  <text x="660" y="266" font-size="11" fill="#374151" text-anchor="middle">export files</text>

  <!-- arrows -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="140" y1="200" x2="190" y2="200" marker-end="url(#a)"/>
    <line x1="284" y1="200" x2="342" y2="200" marker-end="url(#a)"/>
    <line x1="428" y1="200" x2="484" y2="200" marker-end="url(#a)"/>
    <line x1="562" y1="200" x2="626" y2="200" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="30" y="112" font-size="12" fill="#374151">many options</text>
  <text x="670" y="112" font-size="12" fill="#374151" text-anchor="end">one direction</text>
</svg>
