<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#141B5C">Simple shapes combine into a finished badge</text>

  <!-- Parts column -->
  <text x="30" y="70" font-size="13" fill="#374151">The parts</text>

  <!-- ring -->
  <circle cx="70" cy="120" r="34" fill="none" stroke="#1E2A8E" stroke-width="8"/>
  <text x="70" y="178" font-size="11" fill="#374151" text-anchor="middle">ring</text>

  <!-- triangle (mountain) -->
  <polygon points="150,150 190,90 230,150" fill="#3E9B6B"/>
  <text x="190" y="178" font-size="11" fill="#374151" text-anchor="middle">mountain</text>

  <!-- ellipse (sun) -->
  <circle cx="300" cy="120" r="26" fill="#D4AF37"/>
  <text x="300" y="178" font-size="11" fill="#374151" text-anchor="middle">sun</text>

  <!-- star -->
  <polygon points="400,92 408,114 431,114 412,128 419,150 400,137 381,150 388,128 369,114 392,114" fill="#C4683A"/>
  <text x="400" y="178" font-size="11" fill="#374151" text-anchor="middle">star</text>

  <!-- arrow -->
  <line x1="470" y1="120" x2="540" y2="120" stroke="#374151" stroke-width="3"/>
  <polygon points="540,120 528,113 528,127" fill="#374151"/>
  <text x="505" y="108" font-size="12" fill="#374151" text-anchor="middle">unite + align</text>

  <!-- Finished badge -->
  <g transform="translate(640,120)">
    <circle cx="0" cy="0" r="60" fill="#141B5C"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#D4AF37" stroke-width="5"/>
    <!-- sun -->
    <circle cx="0" cy="6" r="30" fill="#D4AF37"/>
    <!-- mountain over sun, clipped by badge feel -->
    <polygon points="-34,26 0,-22 34,26" fill="#3E9B6B"/>
    <polygon points="-14,26 6,-1 26,26" fill="#3E9B6B" opacity="0.7"/>
    <!-- star top -->
    <polygon points="0,-46 4,-36 15,-36 6,-29 10,-19 0,-25 -10,-19 -6,-29 -15,-36 -4,-36" fill="#ffffff"/>
  </g>
  <text x="640" y="205" font-size="12" fill="#374151" text-anchor="middle">finished mark</text>
</svg>
