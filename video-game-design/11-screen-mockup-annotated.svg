<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="470" fill="#ffffff"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">Annotated Screen Mockup</text>
  <text x="330" y="47" text-anchor="middle" font-size="12" fill="#374151">One moment of play: boxes for layout, callouts for doing, seeing, feeling</text>

  <!-- game screen frame -->
  <rect x="170" y="70" width="320" height="220" rx="4" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="2"/>
  <text x="180" y="88" font-size="10" fill="#374151">GAME SCREEN (rough layout, not a real build)</text>

  <!-- HUD -->
  <rect x="182" y="96" width="90" height="20" rx="3" fill="#141B5C"/>
  <text x="227" y="110" text-anchor="middle" font-size="10" fill="#ffffff">HEALTH ▮▮▯</text>

  <!-- gap in floor -->
  <rect x="182" y="250" width="120" height="28" fill="#374151"/>
  <rect x="360" y="250" width="118" height="28" fill="#374151"/>
  <text x="331" y="270" text-anchor="middle" font-size="10" fill="#C4683A" font-weight="bold">GAP</text>

  <!-- player -->
  <rect x="300" y="205" width="26" height="34" rx="3" fill="#3E9B6B"/>
  <text x="313" y="226" text-anchor="middle" font-size="10" fill="#ffffff">P</text>
  <!-- dash motion lines -->
  <line x1="288" y1="215" x2="298" y2="215" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="284" y1="223" x2="296" y2="223" stroke="#3E9B6B" stroke-width="2"/>

  <!-- enemy -->
  <rect x="430" y="207" width="26" height="32" rx="3" fill="#C4683A"/>
  <text x="443" y="228" text-anchor="middle" font-size="10" fill="#ffffff">E</text>

  <!-- locked door -->
  <rect x="462" y="196" width="18" height="54" fill="#D4AF37"/>
  <text x="471" y="226" text-anchor="middle" font-size="10" fill="#141B5C" transform="rotate(90 471 226)">DOOR</text>

  <!-- CALLOUTS -->
  <!-- doing -->
  <circle cx="313" cy="205" r="4" fill="#1E2A8E"/>
  <line x1="313" y1="205" x2="120" y2="150" stroke="#1E2A8E" stroke-width="1.5"/>
  <rect x="18" y="120" width="110" height="44" rx="4" fill="#1E2A8E"/>
  <text x="26" y="137" font-size="10.5" font-weight="bold" fill="#D4AF37">DOING</text>
  <text x="26" y="152" font-size="10" fill="#ffffff">Player dashes</text>
  <text x="26" y="163" font-size="10" fill="#ffffff">over the gap</text>

  <!-- seeing -->
  <circle cx="227" cy="106" r="4" fill="#3E9B6B"/>
  <line x1="227" y1="106" x2="120" y2="330" stroke="#3E9B6B" stroke-width="1.5"/>
  <rect x="18" y="325" width="120" height="44" rx="4" fill="#3E9B6B"/>
  <text x="26" y="342" font-size="10.5" font-weight="bold" fill="#141B5C">SEEING</text>
  <text x="26" y="357" font-size="10" fill="#ffffff">Health bar flashes:</text>
  <text x="26" y="368" font-size="10" fill="#ffffff">last hit landed</text>

  <!-- feeling -->
  <circle cx="471" cy="205" r="4" fill="#C4683A"/>
  <line x1="471" y1="205" x2="560" y2="150" stroke="#C4683A" stroke-width="1.5"/>
  <rect x="532" y="120" width="118" height="44" rx="4" fill="#C4683A"/>
  <text x="540" y="137" font-size="10.5" font-weight="bold" fill="#141B5C">FEELING</text>
  <text x="540" y="152" font-size="10" fill="#ffffff">Tension spike:</text>
  <text x="540" y="163" font-size="10" fill="#ffffff">door is locked</text>

  <!-- enemy callout -->
  <circle cx="443" cy="207" r="4" fill="#141B5C"/>
  <line x1="443" y1="207" x2="560" y2="330" stroke="#141B5C" stroke-width="1.5"/>
  <rect x="532" y="325" width="118" height="44" rx="4" fill="#141B5C"/>
  <text x="540" y="342" font-size="10.5" font-weight="bold" fill="#D4AF37">THREAT</text>
  <text x="540" y="357" font-size="10" fill="#ffffff">Enemy blocks the</text>
  <text x="540" y="368" font-size="10" fill="#ffffff">path to the door</text>

  <!-- legend -->
  <text x="330" y="415" text-anchor="middle" font-size="11.5" fill="#374151">The callouts, not the boxes, are where your design thinking shows.</text>
  <text x="330" y="435" text-anchor="middle" font-size="11" fill="#C4683A" font-weight="bold">Keep it honest: boxes and labels, never a faked screenshot.</text>
</svg>
