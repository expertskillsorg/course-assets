<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The Difficulty Curve, Across a Whole Game</text>

  <!-- Plot area border -->
  <!-- Axes -->
  <line x1="90" y1="70" x2="90" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="370" x2="670" y2="370" stroke="#374151" stroke-width="2"/>

  <!-- Anxiety zone (top band, above the flow channel) -->
  <polygon points="90,70 670,70 670,150 90,250" fill="#C4683A" opacity="0.16"/>
  <text x="640" y="98" text-anchor="end" font-size="13" font-weight="bold" fill="#C4683A">Anxiety zone (too hard)</text>

  <!-- Boredom zone (bottom band, below the flow channel) -->
  <polygon points="90,370 670,370 670,290 90,340" fill="#3E9B6B" opacity="0.16"/>
  <text x="640" y="360" text-anchor="end" font-size="13" font-weight="bold" fill="#3E9B6B">Boredom zone (too easy)</text>

  <!-- Flow channel band (diagonal, rising) -->
  <polygon points="90,340 670,150 670,290 90,340 90,340" fill="#1E2A8E" opacity="0.10"/>
  <polygon points="90,250 670,70 670,150 90,340" fill="#1E2A8E" opacity="0.10"/>
  <text x="120" y="315" font-size="13" font-style="italic" fill="#1E2A8E">Flow channel</text>

  <!-- Center line of the flow channel (dashed) -->
  <line x1="90" y1="295" x2="670" y2="110" stroke="#1E2A8E" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.55"/>

  <!-- Sawtooth difficulty curve (rising, dip after each peak) -->
  <polyline points="90,335 150,300 175,325 235,255 260,280 330,205 355,230 430,155 455,180 540,110 565,135 640,95"
            fill="none" stroke="#D4AF37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Peak dots -->
  <circle cx="150" cy="300" r="5" fill="#141B5C"/>
  <circle cx="235" cy="255" r="5" fill="#141B5C"/>
  <circle cx="330" cy="205" r="5" fill="#141B5C"/>
  <circle cx="430" cy="155" r="5" fill="#141B5C"/>
  <circle cx="540" cy="110" r="6" fill="#C4683A"/>

  <!-- Rest beat labels -->
  <text x="175" y="345" text-anchor="middle" font-size="11" fill="#374151">rest</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#374151">rest</text>
  <text x="355" y="250" text-anchor="middle" font-size="11" fill="#374151">rest</text>

  <!-- Hardest moment callout -->
  <text x="540" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">hardest</text>
  <text x="540" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">moment</text>

  <!-- Ease-off toward finish -->
  <text x="642" y="82" text-anchor="end" font-size="11" fill="#374151">finish eases</text>

  <!-- Axis labels -->
  <text x="380" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Progress through the game &#8594;</text>
  <text x="55" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151" transform="rotate(-90 55 220)">Challenge &#8594;</text>

  <!-- Legend -->
  <line x1="150" y1="425" x2="185" y2="425" stroke="#D4AF37" stroke-width="4"/>
  <text x="192" y="429" font-size="12" fill="#374151">difficulty curve (sawtooth)</text>
  <line x1="400" y1="425" x2="435" y2="425" stroke="#1E2A8E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="442" y="429" font-size="12" fill="#374151">center of the flow channel</text>
</svg>
