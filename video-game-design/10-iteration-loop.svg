<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Arial, sans-serif">
  <rect width="640" height="470" fill="#FFFFFF"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Iteration Loop</text>
  <text x="320" y="54" text-anchor="middle" font-size="13" fill="#374151">Playtest findings route into the design layers, then one change feeds back in</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E2A8E"/>
    </marker>
  </defs>

  <!-- PLAYTEST node (top) -->
  <g>
    <rect x="245" y="76" width="150" height="52" rx="8" fill="#1E2A8E"/>
    <text x="320" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">PLAYTEST</text>
    <text x="320" y="118" text-anchor="middle" font-size="11" fill="#D4AF37">watch, don't steer</text>
  </g>

  <!-- TRIAGE node -->
  <g>
    <rect x="245" y="160" width="150" height="66" rx="8" fill="#141B5C"/>
    <text x="320" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">TRIAGE</text>
    <text x="320" y="200" text-anchor="middle" font-size="10" fill="#FFFFFF">broken / friction / taste</text>
    <text x="320" y="216" text-anchor="middle" font-size="10" fill="#D4AF37">frequency beats intensity</text>
  </g>

  <!-- Design layers row -->
  <g>
    <rect x="30" y="262" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="94" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Mechanics</text>
    <text x="94" y="304" text-anchor="middle" font-size="10" fill="#374151">rules failed?</text>

    <rect x="176" y="262" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="240" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Level</text>
    <text x="240" y="304" text-anchor="middle" font-size="10" fill="#374151">missed the path?</text>

    <rect x="322" y="262" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="386" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Balance</text>
    <text x="386" y="304" text-anchor="middle" font-size="10" fill="#374151">too easy / hard?</text>

    <rect x="468" y="262" width="128" height="56" rx="7" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="532" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Interface</text>
    <text x="532" y="304" text-anchor="middle" font-size="10" fill="#374151">couldn't read it?</text>
  </g>

  <!-- CHANGE ONE THING node -->
  <g>
    <rect x="205" y="356" width="230" height="56" rx="8" fill="#C4683A"/>
    <text x="320" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">CHANGE ONE THING</text>
    <text x="320" y="398" text-anchor="middle" font-size="11" fill="#FFFFFF">predict the effect, then retest</text>
  </g>

  <!-- arrows down the spine -->
  <line x1="320" y1="128" x2="320" y2="158" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- triage to each layer -->
  <path d="M270 226 L94 258" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M300 228 L240 258" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M340 228 L386 258" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M370 226 L530 258" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <!-- layers to change -->
  <path d="M94 320 L240 354" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M240 320 L295 354" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M386 320 L345 354" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M532 320 L400 354" fill="none" stroke="#1E2A8E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- feedback loop back to playtest (right side, gold) -->
  <path d="M435 384 C610 384 622 102 397 102" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ah)"/>
  <text x="600" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A" transform="rotate(90 600 240)">retest &amp; compare</text>

  <!-- version log note -->
  <text x="320" y="442" text-anchor="middle" font-size="11" fill="#374151">Log every loop: date, change, reason. That history becomes portfolio evidence.</text>
  <text x="320" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">Stop when sessions run clean and the notes go quiet.</text>
</svg>
