<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">An Interaction Map: Four Verbs, One Emergent Trick</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#374151">Small thief game. Verbs act on shared things, so players find combos you never wrote down.</text>

  <!-- Four verb nodes across the top -->
  <g>
    <circle cx="110" cy="150" r="48" fill="#1E2A8E"/>
    <text x="110" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">MOVE</text>
    <text x="110" y="166" text-anchor="middle" font-size="10.5" fill="#E5E7EB">walk, climb</text>

    <circle cx="300" cy="150" r="48" fill="#C4683A"/>
    <text x="300" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DOUSE</text>
    <text x="300" y="166" text-anchor="middle" font-size="10.5" fill="#ffffff">put out lights</text>

    <circle cx="490" cy="150" r="48" fill="#3E9B6B"/>
    <text x="490" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">THROW</text>
    <text x="490" y="166" text-anchor="middle" font-size="10.5" fill="#ffffff">toss a bottle</text>

    <circle cx="660" cy="150" r="48" fill="#D4AF37"/>
    <text x="660" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">HIDE</text>
    <text x="660" y="166" text-anchor="middle" font-size="10.5" fill="#141B5C">in shadow</text>
  </g>

  <!-- shared objects row -->
  <text x="380" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">shared things every verb can touch: LIGHT &#183; SOUND &#183; GUARD ATTENTION</text>

  <!-- interaction lines to a combo box -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none">
    <path d="M110 198 L300 300"/>
    <path d="M300 198 L330 300"/>
    <path d="M490 198 L400 300"/>
    <path d="M660 198 L470 300"/>
  </g>

  <!-- emergent combo box -->
  <rect x="230" y="300" width="300" height="86" rx="12" fill="#141B5C"/>
  <text x="380" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#D4AF37">EMERGENT COMBO</text>
  <text x="380" y="352" text-anchor="middle" font-size="12" fill="#ffffff">Throw a bottle to pull the guard away,</text>
  <text x="380" y="370" text-anchor="middle" font-size="12" fill="#ffffff">douse the torch, cross in the new dark.</text>

  <!-- note -->
  <text x="380" y="420" text-anchor="middle" font-size="12.5" fill="#374151">No rule says "distract then sneak." It emerges because THROW makes sound, DOUSE removes light,</text>
  <text x="380" y="440" text-anchor="middle" font-size="12.5" fill="#374151">and HIDE reads darkness. Orthogonal verbs on shared things multiply into moves you never scripted.</text>
</svg>
