<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="500" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#141B5C">Anatomy of a Portfolio Page</text>
  <text x="24" y="56" font-size="13" fill="#374151">Laid out for a reviewer's 90-second skim, top to bottom</text>

  <!-- Browser frame -->
  <rect x="24" y="74" width="470" height="402" rx="8" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="24" y="74" width="470" height="30" rx="8" fill="#1E2A8E"/>
  <circle cx="42" cy="89" r="4" fill="#D4AF37"/>
  <circle cx="56" cy="89" r="4" fill="#3E9B6B"/>
  <circle cx="70" cy="89" r="4" fill="#C4683A"/>

  <!-- Zone 1: header -->
  <rect x="40" y="118" width="438" height="52" rx="5" fill="#141B5C"/>
  <text x="54" y="142" font-size="15" font-weight="bold" fill="#ffffff">Your Name — Game Designer</text>
  <text x="54" y="160" font-size="11" fill="#E5E7EB">One line: what you design + how to contact you</text>

  <!-- Zone 2: best piece -->
  <rect x="40" y="182" width="438" height="118" rx="5" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="52" y="194" width="120" height="94" rx="4" fill="#3E9B6B" opacity="0.25"/>
  <text x="112" y="246" font-size="11" fill="#374151" text-anchor="middle">screenshot</text>
  <text x="186" y="210" font-size="13" font-weight="bold" fill="#141B5C">Best piece first</text>
  <text x="186" y="230" font-size="11" fill="#374151">Concept sentence</text>
  <text x="186" y="248" font-size="11" fill="#374151">Your role</text>
  <text x="186" y="266" font-size="11" fill="#374151">One design decision + why</text>
  <text x="186" y="284" font-size="11" fill="#374151">Evidence of iteration</text>

  <!-- Zone 3: two more pieces -->
  <rect x="40" y="312" width="212" height="86" rx="5" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <rect x="52" y="324" width="70" height="62" rx="4" fill="#D4AF37" opacity="0.3"/>
  <text x="134" y="344" font-size="12" font-weight="bold" fill="#141B5C">Piece two</text>
  <text x="134" y="362" font-size="10" fill="#374151">Different specialty</text>
  <text x="134" y="378" font-size="10" fill="#374151">Concept + role</text>

  <rect x="266" y="312" width="212" height="86" rx="5" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <rect x="278" y="324" width="70" height="62" rx="4" fill="#D4AF37" opacity="0.3"/>
  <text x="360" y="344" font-size="12" font-weight="bold" fill="#141B5C">Piece three</text>
  <text x="360" y="362" font-size="10" fill="#374151">Different specialty</text>
  <text x="360" y="378" font-size="10" fill="#374151">Concept + role</text>

  <!-- Zone 4: contact -->
  <rect x="40" y="410" width="438" height="50" rx="5" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <text x="54" y="432" font-size="12" font-weight="bold" fill="#C4683A">Contact + links</text>
  <text x="54" y="450" font-size="10" fill="#374151">Email, itch.io, one short about line</text>

  <!-- Right: reviewer eye-path -->
  <text x="516" y="130" font-size="13" font-weight="bold" fill="#141B5C">Reviewer's eye</text>
  <line x1="536" y1="146" x2="536" y2="435" stroke="#E5E7EB" stroke-width="2"/>

  <circle cx="536" cy="150" r="13" fill="#141B5C"/>
  <text x="536" y="155" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="558" y="148" font-size="11" fill="#374151">Who are you?</text>
  <text x="558" y="163" font-size="10" fill="#374151">~5 sec</text>

  <circle cx="536" cy="235" r="13" fill="#3E9B6B"/>
  <text x="536" y="240" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="558" y="233" font-size="11" fill="#374151">Can you finish?</text>
  <text x="558" y="248" font-size="10" fill="#374151">~40 sec</text>

  <circle cx="536" cy="352" r="13" fill="#D4AF37"/>
  <text x="536" y="357" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">3</text>
  <text x="558" y="350" font-size="11" fill="#374151">Any range?</text>
  <text x="558" y="365" font-size="10" fill="#374151">~30 sec</text>

  <circle cx="536" cy="433" r="13" fill="#C4683A"/>
  <text x="536" y="438" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="558" y="431" font-size="11" fill="#374151">How to reach you?</text>
  <text x="558" y="446" font-size="10" fill="#374151">~5 sec</text>
</svg>
