<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How a Studio Fits Together</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Design decides the game; the other crafts build and dress it</text>

  <!-- connecting lines from center to satellites -->
  <line x1="320" y1="210" x2="150" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="210" x2="490" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="210" x2="130" y2="300" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="210" x2="510" y2="300" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="210" x2="320" y2="360" stroke="#E5E7EB" stroke-width="2"/>

  <!-- center: design -->
  <circle cx="320" cy="210" r="66" fill="#1E2A8E"/>
  <text x="320" y="205" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">DESIGN</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#D4AF37">decides the game</text>

  <!-- development -->
  <rect x="70" y="118" width="150" height="60" rx="8" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <text x="145" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Development</text>
  <text x="145" y="164" text-anchor="middle" font-size="11" fill="#374151">builds it in code</text>

  <!-- art -->
  <rect x="420" y="118" width="150" height="60" rx="8" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <text x="495" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Art</text>
  <text x="495" y="164" text-anchor="middle" font-size="11" fill="#374151">dresses the visuals</text>

  <!-- audio -->
  <rect x="55" y="272" width="150" height="60" rx="8" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <text x="130" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Audio</text>
  <text x="130" y="318" text-anchor="middle" font-size="11" fill="#374151">gives it sound</text>

  <!-- production -->
  <rect x="435" y="272" width="150" height="60" rx="8" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <text x="510" y="299" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Production</text>
  <text x="510" y="318" text-anchor="middle" font-size="11" fill="#374151">keeps it on track</text>

  <!-- shared vision -->
  <rect x="230" y="360" width="180" height="46" rx="8" fill="#141B5C"/>
  <text x="320" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">One shared vision</text>
  <text x="320" y="398" text-anchor="middle" font-size="10" fill="#D4AF37">every craft aims at it</text>
</svg>
