<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="520" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Lean GDD Skeleton</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#374151">Sections top to bottom, and the module that fills each one</text>

  <!-- page outline -->
  <rect x="70" y="70" width="330" height="430" rx="6" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>

  <!-- section rows -->
  <!-- 1 concept + pillars (highlighted page one) -->
  <rect x="86" y="84" width="298" height="52" rx="4" fill="#1E2A8E"/>
  <text x="98" y="106" font-size="13" font-weight="bold" fill="#ffffff">1. Concept + Pillars</text>
  <text x="98" y="124" font-size="11" fill="#D4AF37">Page one: the game in one glance</text>

  <!-- helper for rows -->
  <rect x="86" y="144" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="165" font-size="12.5" fill="#111827">2. Target Audience + Fun</text>

  <rect x="86" y="186" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="207" font-size="12.5" fill="#111827">3. Core Loop</text>

  <rect x="86" y="228" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="249" font-size="12.5" fill="#111827">4. Mechanics + Rules</text>

  <rect x="86" y="270" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="291" font-size="12.5" fill="#111827">5. Levels + Content</text>

  <rect x="86" y="312" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="333" font-size="12.5" fill="#111827">6. Narrative + World</text>

  <rect x="86" y="354" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="375" font-size="12.5" fill="#111827">7. Interface + Feel</text>

  <rect x="86" y="396" width="298" height="34" rx="4" fill="#EEF1FB" stroke="#E5E7EB"/>
  <text x="98" y="417" font-size="12.5" fill="#111827">8. Balance Notes</text>

  <rect x="86" y="438" width="298" height="34" rx="4" fill="#F3E9CC" stroke="#D4AF37"/>
  <text x="98" y="459" font-size="12.5" fill="#111827">9. Version History</text>

  <!-- source module tags on right -->
  <text x="430" y="114" font-size="11.5" fill="#3E9B6B" font-weight="bold">Module 4</text>
  <text x="430" y="165" font-size="11.5" fill="#374151">Module 3</text>
  <text x="430" y="207" font-size="11.5" fill="#374151">Module 2</text>
  <text x="430" y="249" font-size="11.5" fill="#374151">Module 5</text>
  <text x="430" y="291" font-size="11.5" fill="#374151">Module 6</text>
  <text x="430" y="333" font-size="11.5" fill="#374151">Module 8</text>
  <text x="430" y="375" font-size="11.5" fill="#374151">Module 9</text>
  <text x="430" y="417" font-size="11.5" fill="#374151">Module 7</text>
  <text x="430" y="459" font-size="11.5" fill="#C4683A">Module 10</text>

  <!-- flow arrow -->
  <line x1="52" y1="90" x2="52" y2="480" stroke="#C4683A" stroke-width="2"/>
  <polygon points="52,490 47,478 57,478" fill="#C4683A"/>
  <text x="44" y="285" font-size="11" fill="#C4683A" transform="rotate(-90 44 285)" text-anchor="middle">big picture first, detail last</text>

  <text x="516" y="90" font-size="11" fill="#374151" font-weight="bold">Fills from:</text>
  <text x="510" y="500" font-size="10.5" fill="#374151">5 to 10 pages total</text>
</svg>
