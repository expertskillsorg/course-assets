<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">A Level's Pacing Curve</text>
  <text x="380" y="57" text-anchor="middle" font-size="13" fill="#374151">Tension rises and falls on purpose across one level, from start to exit</text>

  <!-- axes -->
  <line x1="70" y1="360" x2="720" y2="360" stroke="#374151" stroke-width="2"/>
  <line x1="70" y1="90" x2="70" y2="360" stroke="#374151" stroke-width="2"/>
  <text x="34" y="230" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 34 230)">Tension / intensity</text>
  <text x="395" y="398" text-anchor="middle" font-size="12" fill="#374151">Time through the level  &#8594;</text>

  <!-- gridlines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="70" y1="300" x2="720" y2="300"/>
    <line x1="70" y1="240" x2="720" y2="240"/>
    <line x1="70" y1="180" x2="720" y2="180"/>
    <line x1="70" y1="120" x2="720" y2="120"/>
  </g>

  <!-- the pacing curve: build, small peak, rest valley, build, finale peak, resolve -->
  <polyline points="70,345 150,300 220,205 275,235 340,285 420,205 500,150 585,105 640,175 700,200"
            fill="none" stroke="#1E2A8E" stroke-width="3.5"/>

  <!-- beat markers -->
  <g>
    <!-- build -->
    <circle cx="150" cy="300" r="6" fill="#3E9B6B"/>
    <text x="150" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">BUILD</text>
    <text x="150" y="347" text-anchor="middle" font-size="10" fill="#374151">gentle ramp-up</text>

    <!-- first peak -->
    <circle cx="220" cy="205" r="6" fill="#C4683A"/>
    <text x="220" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">PEAK</text>

    <!-- rest valley -->
    <circle cx="300" cy="262" r="6" fill="#D4AF37"/>
    <text x="300" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#B8901F">REST</text>
    <text x="300" y="305" text-anchor="middle" font-size="10" fill="#374151">breather, reward</text>

    <!-- second build -->
    <text x="435" y="248" text-anchor="middle" font-size="11" fill="#374151">build again, higher</text>

    <!-- finale -->
    <circle cx="585" cy="105" r="7" fill="#C4683A"/>
    <text x="585" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">FINALE</text>
    <text x="585" y="78" text-anchor="middle" font-size="10" fill="#374151">hardest test / climax</text>

    <!-- resolve -->
    <circle cx="700" cy="200" r="6" fill="#3E9B6B"/>
    <text x="700" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">EXIT</text>
  </g>

  <!-- note -->
  <text x="395" y="425" text-anchor="middle" font-size="11.5" fill="#374151">A flat line bores or exhausts. The zig-zag of build, peak, and rest is what keeps players in the flow channel.</text>
</svg>
