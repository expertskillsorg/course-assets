<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>

  <text x="360" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Mechanics build Dynamics build Experience</text>

  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Stage 1: Mechanics -->
  <rect x="30" y="70" width="190" height="70" rx="8" fill="#1E2A8E"/>
  <text x="125" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">MECHANICS</text>
  <text x="125" y="122" text-anchor="middle" font-size="12" fill="#E5E7EB">what the designer builds</text>

  <!-- Stage 2: Dynamics -->
  <rect x="265" y="70" width="190" height="70" rx="8" fill="#3E9B6B"/>
  <text x="360" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">DYNAMICS</text>
  <text x="360" y="122" text-anchor="middle" font-size="12" fill="#ffffff">how players actually play</text>

  <!-- Stage 3: Experience -->
  <rect x="500" y="70" width="190" height="70" rx="8" fill="#C4683A"/>
  <text x="595" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">EXPERIENCE</text>
  <text x="595" y="122" text-anchor="middle" font-size="12" fill="#ffffff">the feeling it creates</text>

  <!-- forward arrows -->
  <path d="M222 105 L262 105" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M457 105 L497 105" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>

  <!-- design-backwards arrow -->
  <path d="M595 165 C595 210, 125 210, 125 165" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ar)"/>
  <text x="360" y="205" text-anchor="middle" font-size="12" font-style="italic" fill="#D4AF37">designers plan backwards, from the feeling they want</text>

  <!-- worked example row -->
  <text x="360" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Worked example: an auction game</text>

  <rect x="30" y="270" width="190" height="80" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="125" y="292" text-anchor="middle" font-size="12" fill="#111827">Rule: highest open</text>
  <text x="125" y="310" text-anchor="middle" font-size="12" fill="#111827">bid wins and pays</text>

  <rect x="265" y="270" width="190" height="80" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="360" y="292" text-anchor="middle" font-size="12" fill="#111827">Bidding wars,</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#111827">bluffing, overpaying</text>

  <rect x="500" y="270" width="190" height="80" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="595" y="292" text-anchor="middle" font-size="12" fill="#111827">Tension, greed,</text>
  <text x="595" y="310" text-anchor="middle" font-size="12" fill="#111827">the thrill of a gamble</text>
</svg>
