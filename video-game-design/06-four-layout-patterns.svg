<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">Four Layout Patterns</text>
  <text x="380" y="57" text-anchor="middle" font-size="13" fill="#374151">The same rooms, arranged four ways. Each shape teaches and paces differently.</text>

  <!-- legend -->
  <g>
    <circle cx="250" cy="80" r="7" fill="#3E9B6B"/>
    <text x="263" y="84" font-size="11" fill="#374151">start</text>
    <circle cx="330" cy="80" r="7" fill="#C4683A"/>
    <text x="343" y="84" font-size="11" fill="#374151">goal</text>
    <rect x="405" y="73" width="14" height="14" rx="3" fill="#1E2A8E"/>
    <text x="423" y="84" font-size="11" fill="#374151">room</text>
    <line x1="480" y1="80" x2="505" y2="80" stroke="#374151" stroke-width="2.5"/>
    <text x="510" y="84" font-size="11" fill="#374151">path</text>
  </g>

  <!-- ===== LINEAR ===== -->
  <text x="105" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">LINEAR</text>
  <line x1="45" y1="185" x2="165" y2="185" stroke="#374151" stroke-width="2.5"/>
  <line x1="105" y1="185" x2="105" y2="245" stroke="#374151" stroke-width="2.5"/>
  <line x1="105" y1="245" x2="165" y2="245" stroke="#374151" stroke-width="2.5"/>
  <circle cx="45" cy="185" r="8" fill="#3E9B6B"/>
  <rect x="97" y="177" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="97" y="237" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <circle cx="165" cy="245" r="8" fill="#C4683A"/>
  <text x="105" y="290" text-anchor="middle" font-size="10.5" fill="#374151">One path.</text>
  <text x="105" y="305" text-anchor="middle" font-size="10.5" fill="#374151">Best for teaching.</text>

  <!-- ===== HUB ===== -->
  <text x="290" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">HUB &amp; SPOKE</text>
  <line x1="290" y1="210" x2="240" y2="165" stroke="#374151" stroke-width="2.5"/>
  <line x1="290" y1="210" x2="345" y2="165" stroke="#374151" stroke-width="2.5"/>
  <line x1="290" y1="210" x2="240" y2="255" stroke="#374151" stroke-width="2.5"/>
  <line x1="290" y1="210" x2="345" y2="255" stroke="#374151" stroke-width="2.5"/>
  <rect x="282" y="202" width="18" height="18" rx="3" fill="#D4AF37"/>
  <rect x="232" y="157" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="337" y="157" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="232" y="247" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <circle cx="345" cy="255" r="8" fill="#C4683A"/>
  <text x="290" y="290" text-anchor="middle" font-size="10.5" fill="#374151">A center you</text>
  <text x="290" y="305" text-anchor="middle" font-size="10.5" fill="#374151">return to. Choice.</text>

  <!-- ===== OPEN ===== -->
  <text x="470" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">OPEN</text>
  <g stroke="#374151" stroke-width="2">
    <line x1="425" y1="165" x2="470" y2="165"/>
    <line x1="470" y1="165" x2="515" y2="165"/>
    <line x1="425" y1="210" x2="470" y2="210"/>
    <line x1="470" y1="210" x2="515" y2="210"/>
    <line x1="425" y1="165" x2="425" y2="210"/>
    <line x1="470" y1="165" x2="470" y2="255"/>
    <line x1="515" y1="165" x2="515" y2="210"/>
    <line x1="425" y1="210" x2="425" y2="255"/>
    <line x1="425" y1="255" x2="470" y2="255"/>
  </g>
  <circle cx="425" cy="165" r="8" fill="#3E9B6B"/>
  <rect x="462" y="157" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="507" y="157" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="417" y="202" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <circle cx="515" cy="210" r="8" fill="#C4683A"/>
  <text x="470" y="290" text-anchor="middle" font-size="10.5" fill="#374151">Many paths.</text>
  <text x="470" y="305" text-anchor="middle" font-size="10.5" fill="#374151">Freedom, mastery.</text>

  <!-- ===== LOOP ===== -->
  <text x="655" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">LOOP</text>
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <path d="M 655 160 L 705 190 L 705 240 L 655 270 L 605 240 L 605 190 Z"/>
  </g>
  <circle cx="655" cy="160" r="8" fill="#3E9B6B"/>
  <rect x="697" y="182" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="697" y="232" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <rect x="597" y="182" width="16" height="16" rx="3" fill="#1E2A8E"/>
  <circle cx="655" cy="270" r="8" fill="#C4683A"/>
  <text x="655" y="290" text-anchor="middle" font-size="10.5" fill="#374151">Comes back on</text>
  <text x="655" y="305" text-anchor="middle" font-size="10.5" fill="#374151">itself. Shortcuts.</text>

  <!-- footer -->
  <rect x="45" y="335" width="670" height="72" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="65" y="362" font-size="12.5" fill="#374151">Match the pattern to the job: <tspan font-weight="bold" fill="#141B5C">linear</tspan> guides beginners, <tspan font-weight="bold" fill="#141B5C">hub</tspan> offers safe choice,</text>
  <text x="65" y="384" font-size="12.5" fill="#374151"><tspan font-weight="bold" fill="#141B5C">open</tspan> rewards mastery, and <tspan font-weight="bold" fill="#141B5C">loop</tspan> saves the player a long walk back. Most games mix them across the arc.</text>
</svg>
