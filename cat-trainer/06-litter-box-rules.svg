<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Three Litter Box Rules</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Number, spacing, and placement for a two-cat home</text>

  <!-- Rule 1: Number -->
  <text x="40" y="100" font-size="15" font-weight="bold" fill="#1E2A8E">1. Number: one box per cat, plus one</text>
  <text x="40" y="120" font-size="12" fill="#374151">2 cats means 3 boxes</text>
  <g>
    <rect x="40" y="132" width="44" height="30" rx="4" fill="#3E9B6B"/>
    <rect x="100" y="132" width="44" height="30" rx="4" fill="#3E9B6B"/>
    <rect x="160" y="132" width="44" height="30" rx="4" fill="#3E9B6B"/>
    <text x="62" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
    <text x="122" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
    <text x="182" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  </g>

  <!-- Rule 2: Spacing -->
  <text x="40" y="206" font-size="15" font-weight="bold" fill="#1E2A8E">2. Spacing: spread them out, never stacked</text>
  <g>
    <!-- bad: clustered -->
    <text x="120" y="232" text-anchor="middle" font-size="11" fill="#C4683A" font-weight="bold">No: all in one spot</text>
    <rect x="80" y="240" width="34" height="22" rx="3" fill="#E5E7EB" stroke="#C4683A" stroke-width="2"/>
    <rect x="120" y="240" width="34" height="22" rx="3" fill="#E5E7EB" stroke="#C4683A" stroke-width="2"/>
    <rect x="160" y="240" width="34" height="22" rx="3" fill="#E5E7EB" stroke="#C4683A" stroke-width="2"/>
    <!-- good: spread -->
    <text x="470" y="232" text-anchor="middle" font-size="11" fill="#3E9B6B" font-weight="bold">Yes: separate areas</text>
    <rect x="360" y="240" width="34" height="22" rx="3" fill="#3E9B6B"/>
    <rect x="460" y="240" width="34" height="22" rx="3" fill="#3E9B6B"/>
    <rect x="560" y="240" width="34" height="22" rx="3" fill="#3E9B6B"/>
  </g>

  <!-- Rule 3: Placement -->
  <text x="40" y="310" font-size="15" font-weight="bold" fill="#1E2A8E">3. Placement: quiet, easy, with an exit</text>
  <!-- room sketch -->
  <rect x="40" y="324" width="640" height="116" rx="6" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <!-- good box -->
  <rect x="70" y="392" width="40" height="26" rx="4" fill="#3E9B6B"/>
  <text x="90" y="386" text-anchor="middle" font-size="10" fill="#3E9B6B" font-weight="bold">quiet corner</text>
  <text x="90" y="434" text-anchor="middle" font-size="9" fill="#374151">two exits</text>
  <!-- food/water to avoid near -->
  <rect x="300" y="350" width="40" height="22" rx="4" fill="#D4AF37"/>
  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#374151" font-weight="bold">food &amp; water</text>
  <text x="320" y="386" text-anchor="middle" font-size="9" fill="#374151">keep box away</text>
  <!-- noisy appliance to avoid -->
  <rect x="560" y="392" width="44" height="26" rx="4" fill="#E5E7EB" stroke="#C4683A" stroke-width="2"/>
  <text x="582" y="386" text-anchor="middle" font-size="10" fill="#C4683A" font-weight="bold">noisy machine</text>
  <text x="582" y="434" text-anchor="middle" font-size="9" fill="#374151">avoid this spot</text>
  <!-- divider arrow showing distance -->
  <line x1="118" y1="405" x2="296" y2="405" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
