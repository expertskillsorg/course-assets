<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif">
  <rect width="640" height="320" fill="#FFFFFF"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Marker Timing: The Order Never Changes</text>

  <!-- timeline -->
  <line x1="70" y1="170" x2="570" y2="170" stroke="#374151" stroke-width="2"/>
  <polygon points="570,170 558,164 558,176" fill="#374151"/>
  <text x="582" y="175" font-size="13" fill="#374151">time</text>

  <!-- 1. Behavior -->
  <circle cx="150" cy="170" r="10" fill="#1E2A8E"/>
  <rect x="80" y="92" width="140" height="46" rx="8" fill="#1E2A8E"/>
  <text x="150" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1. Behavior</text>
  <text x="150" y="131" text-anchor="middle" font-size="12" fill="#FFFFFF">cat does the thing</text>
  <line x1="150" y1="138" x2="150" y2="160" stroke="#1E2A8E" stroke-width="2"/>

  <!-- 2. Mark -->
  <circle cx="320" cy="170" r="10" fill="#D4AF37"/>
  <rect x="250" y="92" width="140" height="46" rx="8" fill="#D4AF37"/>
  <text x="320" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">2. Mark</text>
  <text x="320" y="131" text-anchor="middle" font-size="12" fill="#141B5C">click at that instant</text>
  <line x1="320" y1="138" x2="320" y2="160" stroke="#D4AF37" stroke-width="2"/>

  <!-- gap label -->
  <text x="405" y="158" text-anchor="middle" font-size="11" fill="#374151">short gap</text>

  <!-- 3. Treat -->
  <circle cx="490" cy="170" r="10" fill="#3E9B6B"/>
  <rect x="420" y="92" width="140" height="46" rx="8" fill="#3E9B6B"/>
  <text x="490" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3. Treat</text>
  <text x="490" y="131" text-anchor="middle" font-size="12" fill="#FFFFFF">deliver the reward</text>
  <line x1="490" y1="138" x2="490" y2="160" stroke="#3E9B6B" stroke-width="2"/>

  <!-- caption -->
  <text x="320" y="242" text-anchor="middle" font-size="14" fill="#374151">The mark snapshots the moment. The treat can follow a second or two later,</text>
  <text x="320" y="264" text-anchor="middle" font-size="14" fill="#374151">because the cat already knows the marker means food is coming.</text>
  <text x="320" y="294" text-anchor="middle" font-size="13" font-style="italic" fill="#C4683A">Mark first, then reach for the treat. Never the other way around.</text>
</svg>
