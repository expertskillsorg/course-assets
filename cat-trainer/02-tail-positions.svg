<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Six Tail Positions and What Each Signals</text>
  <line x1="40" y1="50" x2="680" y2="50" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Cell 1: Upright -->
  <g>
    <path d="M60 200 q20 30 50 34 q-4 -60 -2 -120" fill="none" stroke="#3E9B6B" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="86" cy="208" rx="34" ry="22" fill="#1E2A8E"/>
    <text x="108" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Upright</text>
    <text x="108" y="265" text-anchor="middle" font-size="12" fill="#374151">Confident, friendly</text>
    <text x="108" y="281" text-anchor="middle" font-size="12" fill="#374151">greeting</text>
  </g>

  <!-- Cell 2: Question-mark -->
  <g>
    <path d="M260 200 q20 30 50 34 q-2 -70 -30 -96 q-26 -22 6 -36" fill="none" stroke="#3E9B6B" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="286" cy="208" rx="34" ry="22" fill="#1E2A8E"/>
    <text x="300" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Question-mark</text>
    <text x="300" y="265" text-anchor="middle" font-size="12" fill="#374151">Playful, curious,</text>
    <text x="300" y="281" text-anchor="middle" font-size="12" fill="#374151">approachable</text>
  </g>

  <!-- Cell 3: Puffed -->
  <g>
    <path d="M470 200 q20 30 50 34 q40 -50 70 -100" fill="none" stroke="#C4683A" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="496" cy="208" rx="34" ry="22" fill="#1E2A8E"/>
    <text x="520" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Puffed / arched</text>
    <text x="520" y="265" text-anchor="middle" font-size="12" fill="#374151">Scared or startled,</text>
    <text x="520" y="281" text-anchor="middle" font-size="12" fill="#374151">looking bigger</text>
  </g>

  <line x1="40" y1="305" x2="680" y2="305" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Cell 4: Thrashing -->
  <g>
    <path d="M60 420 q20 -20 50 -16 q40 -6 30 -50 q-8 -34 30 -30" fill="none" stroke="#D4AF37" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="86" cy="424" rx="34" ry="22" fill="#1E2A8E"/>
    <text x="120" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Thrashing / lashing</text>
    <text x="120" y="390" text-anchor="middle" font-size="12" fill="#374151">Agitated, overstimulated,</text>
    <text x="120" y="406" text-anchor="middle" font-size="12" fill="#374151">back off</text>
  </g>

  <!-- Cell 5: Tucked -->
  <g>
    <path d="M286 430 q-30 -6 -36 -40 q-4 -20 20 -22" fill="none" stroke="#C4683A" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="300" cy="424" rx="34" ry="22" fill="#1E2A8E"/>
    <text x="300" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Tucked under</text>
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#374151">Fearful, submitting,</text>
    <text x="300" y="406" text-anchor="middle" font-size="12" fill="#374151">wants no conflict</text>
  </g>

  <!-- Cell 6: Low/horizontal -->
  <g>
    <path d="M470 424 q40 4 90 0" fill="none" stroke="#D4AF37" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="496" cy="424" rx="34" ry="22" fill="#1E2A8E"/>
    <text x="520" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Low / horizontal</text>
    <text x="520" y="390" text-anchor="middle" font-size="12" fill="#374151">Wary or uncertain,</text>
    <text x="520" y="406" text-anchor="middle" font-size="12" fill="#374151">reading the room</text>
  </g>
</svg>
