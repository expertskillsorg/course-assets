<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Stalled Behavior Plan: Decision Tree</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Work the checks top to bottom. Stop at the first "no."</text>

  <!-- start -->
  <rect x="300" y="76" width="160" height="44" rx="8" fill="#1E2A8E"/>
  <text x="380" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Behavior stalled</text>

  <!-- connector function -->
  <!-- Row geometry: each check is a diamond-ish rounded box on the left, fix box on the right -->

  <!-- 1 reward -->
  <line x1="380" y1="120" x2="380" y2="146" stroke="#374151" stroke-width="2"/>
  <rect x="250" y="146" width="260" height="48" rx="8" fill="#E5E7EB" stroke="#1E2A8E" stroke-width="1.5"/>
  <text x="380" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">1. Is the reward high value enough?</text>
  <text x="380" y="184" text-anchor="middle" font-size="11" fill="#374151">Hungry cat, fresh treat, no better distraction?</text>
  <line x1="510" y1="170" x2="590" y2="170" stroke="#C4683A" stroke-width="2"/>
  <text x="548" y="163" text-anchor="middle" font-size="10" fill="#C4683A">No</text>
  <rect x="590" y="148" width="150" height="44" rx="8" fill="#C4683A"/>
  <text x="665" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Raise reward</text>
  <text x="665" y="182" text-anchor="middle" font-size="10" fill="#ffffff">value or hunger</text>

  <!-- 2 criteria -->
  <line x1="380" y1="194" x2="380" y2="220" stroke="#374151" stroke-width="2"/>
  <text x="392" y="212" font-size="10" fill="#3E9B6B">Yes</text>
  <rect x="250" y="220" width="260" height="48" rx="8" fill="#E5E7EB" stroke="#1E2A8E" stroke-width="1.5"/>
  <text x="380" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">2. Can the cat do the easier step?</text>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#374151">Drop to a step it nailed last week.</text>
  <line x1="510" y1="244" x2="590" y2="244" stroke="#C4683A" stroke-width="2"/>
  <text x="548" y="237" text-anchor="middle" font-size="10" fill="#C4683A">No</text>
  <rect x="590" y="222" width="150" height="44" rx="8" fill="#C4683A"/>
  <text x="665" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Split smaller</text>
  <text x="665" y="256" text-anchor="middle" font-size="10" fill="#ffffff">lower criteria</text>

  <!-- 3 timing -->
  <line x1="380" y1="268" x2="380" y2="294" stroke="#374151" stroke-width="2"/>
  <text x="392" y="286" font-size="10" fill="#3E9B6B">Yes</text>
  <rect x="250" y="294" width="260" height="48" rx="8" fill="#E5E7EB" stroke="#1E2A8E" stroke-width="1.5"/>
  <text x="380" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">3. Is your marker on time?</text>
  <text x="380" y="332" text-anchor="middle" font-size="11" fill="#374151">Film a session and check the click.</text>
  <line x1="510" y1="318" x2="590" y2="318" stroke="#C4683A" stroke-width="2"/>
  <text x="548" y="311" text-anchor="middle" font-size="10" fill="#C4683A">No</text>
  <rect x="590" y="296" width="150" height="44" rx="8" fill="#C4683A"/>
  <text x="665" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Fix timing</text>
  <text x="665" y="330" text-anchor="middle" font-size="10" fill="#ffffff">mark the moment</text>

  <!-- 4 threshold -->
  <line x1="380" y1="342" x2="380" y2="368" stroke="#374151" stroke-width="2"/>
  <text x="392" y="360" font-size="10" fill="#3E9B6B">Yes</text>
  <rect x="250" y="368" width="260" height="48" rx="8" fill="#E5E7EB" stroke="#1E2A8E" stroke-width="1.5"/>
  <text x="380" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">4. Is the cat calm and under threshold?</text>
  <text x="380" y="406" text-anchor="middle" font-size="11" fill="#374151">Eating, loose body, focused?</text>
  <line x1="510" y1="392" x2="590" y2="392" stroke="#C4683A" stroke-width="2"/>
  <text x="548" y="385" text-anchor="middle" font-size="10" fill="#C4683A">No</text>
  <rect x="590" y="370" width="150" height="44" rx="8" fill="#C4683A"/>
  <text x="665" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Calmer setting</text>
  <text x="665" y="404" text-anchor="middle" font-size="10" fill="#ffffff">lower arousal</text>

  <!-- 5 health -->
  <line x1="380" y1="416" x2="380" y2="442" stroke="#374151" stroke-width="2"/>
  <text x="392" y="434" font-size="10" fill="#3E9B6B">Yes</text>
  <rect x="250" y="442" width="260" height="48" rx="8" fill="#E5E7EB" stroke="#1E2A8E" stroke-width="1.5"/>
  <text x="380" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">5. Did it vanish suddenly with no change?</text>
  <text x="380" y="480" text-anchor="middle" font-size="11" fill="#374151">A known behavior lost overnight?</text>
  <line x1="510" y1="466" x2="590" y2="466" stroke="#3E9B6B" stroke-width="2"/>
  <text x="548" y="459" text-anchor="middle" font-size="10" fill="#3E9B6B">Yes</text>
  <rect x="590" y="444" width="150" height="44" rx="8" fill="#D4AF37"/>
  <text x="665" y="463" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">Advise a</text>
  <text x="665" y="478" text-anchor="middle" font-size="10" fill="#141B5C">vet check</text>

  <!-- all clear -->
  <line x1="380" y1="490" x2="380" y2="514" stroke="#374151" stroke-width="2"/>
  <text x="392" y="508" font-size="10" fill="#3E9B6B">No</text>
  <rect x="280" y="514" width="200" height="40" rx="8" fill="#3E9B6B"/>
  <text x="380" y="539" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Rebuild from a winning step</text>
</svg>
