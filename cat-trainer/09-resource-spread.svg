<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <!-- Titles -->
  <text x="180" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Clustered: one bottleneck</text>
  <text x="540" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Spread out: no bottleneck</text>

  <!-- LEFT room -->
  <rect x="40" y="56" width="280" height="280" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <!-- single doorway -->
  <rect x="38" y="180" width="6" height="44" fill="#ffffff"/>
  <text x="30" y="206" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 30 206)">one door</text>

  <!-- clustered resources in a corner -->
  <rect x="230" y="250" width="34" height="34" rx="4" fill="#3E9B6B"/>
  <rect x="270" y="250" width="34" height="34" rx="4" fill="#1E2A8E"/>
  <rect x="230" y="294" width="34" height="34" rx="4" fill="#D4AF37"/>
  <rect x="270" y="294" width="34" height="34" rx="4" fill="#C4683A"/>
  <text x="267" y="244" text-anchor="middle" font-size="11" fill="#374151">all resources, one corner</text>

  <!-- two cats forced together -->
  <circle cx="150" cy="150" r="13" fill="#141B5C"/>
  <circle cx="186" cy="150" r="13" fill="#9aa0c4"/>
  <!-- conflict spark -->
  <path d="M162 138 l8 6 -6 4 9 7" stroke="#C4683A" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <text x="168" y="118" text-anchor="middle" font-size="12" fill="#C4683A" font-weight="bold">competition</text>

  <!-- RIGHT room -->
  <rect x="400" y="56" width="280" height="280" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <!-- multiple exits -->
  <rect x="398" y="120" width="6" height="40" fill="#ffffff"/>
  <rect x="676" y="200" width="6" height="40" fill="#ffffff"/>
  <text x="540" y="350" text-anchor="middle" font-size="12" fill="#374151">multiple exits, spaced stations</text>

  <!-- spread resources -->
  <rect x="424" y="80" width="30" height="30" rx="4" fill="#3E9B6B"/>
  <rect x="626" y="86" width="30" height="30" rx="4" fill="#1E2A8E"/>
  <rect x="424" y="276" width="30" height="30" rx="4" fill="#D4AF37"/>
  <rect x="626" y="276" width="30" height="30" rx="4" fill="#C4683A"/>

  <!-- vertical space -->
  <rect x="530" y="92" width="60" height="10" rx="3" fill="#374151"/>
  <text x="560" y="84" text-anchor="middle" font-size="10" fill="#374151">high shelf</text>

  <!-- two cats with space -->
  <circle cx="470" cy="180" r="13" fill="#141B5C"/>
  <circle cx="600" cy="210" r="13" fill="#9aa0c4"/>

  <!-- legend -->
  <rect x="40" y="354" width="14" height="14" rx="3" fill="#3E9B6B"/>
  <text x="60" y="365" font-size="12" fill="#374151">food</text>
  <rect x="108" y="354" width="14" height="14" rx="3" fill="#1E2A8E"/>
  <text x="128" y="365" font-size="12" fill="#374151">water</text>
  <rect x="180" y="354" width="14" height="14" rx="3" fill="#D4AF37"/>
  <text x="200" y="365" font-size="12" fill="#374151">litter</text>
  <rect x="246" y="354" width="14" height="14" rx="3" fill="#C4683A"/>
  <text x="266" y="365" font-size="12" fill="#374151">resting spot</text>
</svg>
