<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Post Types and Where to Place Them</text>

  <!-- Left panel: post types -->
  <text x="40" y="74" font-size="16" font-weight="bold" fill="#1E2A8E">Two shapes, two needs</text>

  <!-- Vertical post -->
  <rect x="60" y="100" width="34" height="160" rx="4" fill="#C4683A"/>
  <rect x="60" y="100" width="34" height="160" rx="4" fill="none" stroke="#141B5C" stroke-width="2"/>
  <rect x="40" y="260" width="74" height="14" rx="3" fill="#374151"/>
  <line x1="66" y1="108" x2="66" y2="252" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <line x1="77" y1="108" x2="77" y2="252" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <line x1="88" y1="108" x2="88" y2="252" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <text x="77" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Vertical</text>
  <text x="77" y="318" text-anchor="middle" font-size="11" fill="#374151">Tall, sturdy, sisal</text>
  <text x="77" y="334" text-anchor="middle" font-size="11" fill="#374151">For the full-body</text>
  <text x="77" y="350" text-anchor="middle" font-size="11" fill="#374151">stretch and pull</text>

  <!-- Horizontal scratcher -->
  <rect x="150" y="232" width="150" height="26" rx="4" fill="#D4AF37"/>
  <rect x="150" y="232" width="150" height="26" rx="4" fill="none" stroke="#141B5C" stroke-width="2"/>
  <line x1="160" y1="234" x2="160" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="175" y1="234" x2="175" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="190" y1="234" x2="190" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="205" y1="234" x2="205" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="220" y1="234" x2="220" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="235" y1="234" x2="235" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="250" y1="234" x2="250" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="265" y1="234" x2="265" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <line x1="280" y1="234" x2="280" y2="256" stroke="#141B5C" stroke-width="1" opacity="0.4"/>
  <text x="225" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Horizontal</text>
  <text x="225" y="318" text-anchor="middle" font-size="11" fill="#374151">Flat cardboard</text>
  <text x="225" y="334" text-anchor="middle" font-size="11" fill="#374151">or mat, for cats</text>
  <text x="225" y="350" text-anchor="middle" font-size="11" fill="#374151">that scratch down</text>

  <text x="40" y="392" font-size="12" fill="#374151">Offer both. Watch which the cat</text>
  <text x="40" y="410" font-size="12" fill="#374151">chooses, then add more of that kind.</text>

  <!-- Divider -->
  <line x1="345" y1="60" x2="345" y2="420" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Right panel: room placement -->
  <text x="380" y="74" font-size="16" font-weight="bold" fill="#1E2A8E">Place posts in high-traffic spots</text>
  <rect x="380" y="92" width="330" height="300" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>

  <!-- room features -->
  <!-- couch (problem spot) -->
  <rect x="400" y="300" width="120" height="44" rx="6" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <text x="460" y="327" text-anchor="middle" font-size="11" fill="#374151">Couch (problem)</text>
  <!-- post next to couch -->
  <rect x="526" y="296" width="14" height="50" rx="3" fill="#3E9B6B"/>
  <circle cx="533" cy="288" r="9" fill="#D4AF37"/>
  <text x="533" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">1</text>

  <!-- bed / nap spot -->
  <rect x="408" y="120" width="90" height="40" rx="6" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <text x="453" y="144" text-anchor="middle" font-size="11" fill="#374151">Nap spot</text>
  <rect x="504" y="118" width="14" height="46" rx="3" fill="#3E9B6B"/>
  <circle cx="511" cy="110" r="9" fill="#D4AF37"/>
  <text x="511" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">2</text>

  <!-- doorway -->
  <rect x="620" y="92" width="14" height="46" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="660" y="120" text-anchor="middle" font-size="11" fill="#374151">Doorway</text>
  <rect x="640" y="150" width="14" height="46" rx="3" fill="#3E9B6B"/>
  <circle cx="647" cy="142" r="9" fill="#D4AF37"/>
  <text x="647" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">3</text>

  <text x="390" y="378" font-size="11" fill="#374151">Posts beside the spots the cat already uses,</text>
  <text x="390" y="392" font-size="9" fill="#FFFFFF">.</text>

  <!-- legend -->
  <rect x="390" y="402" width="12" height="12" rx="2" fill="#3E9B6B"/>
  <text x="408" y="412" font-size="11" fill="#374151">scratching post</text>
  <rect x="520" y="402" width="12" height="12" rx="2" fill="#E5E7EB" stroke="#374151" stroke-width="1"/>
  <text x="538" y="412" font-size="11" fill="#374151">furniture / feature</text>
</svg>
