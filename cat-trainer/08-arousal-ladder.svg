<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Feline Arousal Ladder</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Each rung is a chance to give space before the cat climbs higher</text>

  <!-- vertical arrow showing escalation -->
  <line x1="56" y1="410" x2="56" y2="92" stroke="#374151" stroke-width="2.5"/>
  <polygon points="56,82 50,98 62,98" fill="#374151"/>
  <text x="42" y="250" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 42 250)">rising arousal</text>

  <!-- Rung 5: bite (top) -->
  <rect x="90" y="92" width="500" height="58" rx="6" fill="#C4683A"/>
  <text x="110" y="118" font-size="16" font-weight="bold" fill="#ffffff">5. Bite or clawed strike</text>
  <text x="110" y="138" font-size="12.5" fill="#ffffff">Contact made. Skin breaks. The cat has run out of warnings.</text>

  <!-- Rung 4 -->
  <rect x="90" y="158" width="500" height="58" rx="6" fill="#D4AF37"/>
  <text x="110" y="184" font-size="16" font-weight="bold" fill="#141B5C">4. Growl, hiss, raised paw, sheathed swat</text>
  <text x="110" y="204" font-size="12.5" fill="#141B5C">Loud, unmistakable warnings. Stop and back off now.</text>

  <!-- Rung 3 -->
  <rect x="90" y="224" width="500" height="58" rx="6" fill="#3E9B6B"/>
  <text x="110" y="250" font-size="16" font-weight="bold" fill="#ffffff">3. Body tenses, skin ripples, hard stare</text>
  <text x="110" y="270" font-size="12.5" fill="#ffffff">Loose turns to stiff. The cat has locked onto a target.</text>

  <!-- Rung 2 -->
  <rect x="90" y="290" width="500" height="58" rx="6" fill="#1E2A8E"/>
  <text x="110" y="316" font-size="16" font-weight="bold" fill="#ffffff">2. Ears rotate sideways or flatten</text>
  <text x="110" y="336" font-size="12.5" fill="#ffffff">Airplane ears. The face says tension is climbing.</text>

  <!-- Rung 1 (bottom) -->
  <rect x="90" y="356" width="500" height="58" rx="6" fill="#141B5C"/>
  <text x="110" y="382" font-size="16" font-weight="bold" fill="#ffffff">1. Tail twitches or flicks</text>
  <text x="110" y="402" font-size="12.5" fill="#ffffff">The quietest, earliest signal. Easiest rung to catch.</text>

  <text x="340" y="446" text-anchor="middle" font-size="12.5" font-style="italic" fill="#374151">Catch the cat low on the ladder and create space. The bite was never the start.</text>
</svg>
