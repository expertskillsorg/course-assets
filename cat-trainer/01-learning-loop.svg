<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="The learning loop: antecedent leads to behavior, behavior leads to consequence, and the consequence feeds back to make the behavior more or less likely next time">
  <rect x="0" y="0" width="720" height="320" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">The Learning Loop</text>

  <!-- Antecedent box -->
  <rect x="36" y="96" width="180" height="96" rx="10" fill="#1E2A8E"/>
  <text x="126" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Antecedent</text>
  <text x="126" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">What happens just</text>
  <text x="126" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">before (the cue)</text>

  <!-- Behavior box -->
  <rect x="270" y="96" width="180" height="96" rx="10" fill="#3E9B6B"/>
  <text x="360" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Behavior</text>
  <text x="360" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">What the cat</text>
  <text x="360" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">actually does</text>

  <!-- Consequence box -->
  <rect x="504" y="96" width="180" height="96" rx="10" fill="#D4AF37"/>
  <text x="594" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#141B5C">Consequence</text>
  <text x="594" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#141B5C">What follows</text>
  <text x="594" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#141B5C">(the outcome)</text>

  <!-- Arrow antecedent -> behavior -->
  <line x1="216" y1="144" x2="262" y2="144" stroke="#374151" stroke-width="3"/>
  <polygon points="262,144 250,138 250,150" fill="#374151"/>

  <!-- Arrow behavior -> consequence -->
  <line x1="450" y1="144" x2="496" y2="144" stroke="#374151" stroke-width="3"/>
  <polygon points="496,144 484,138 484,150" fill="#374151"/>

  <!-- Feedback loop arrow consequence -> behavior (curved underneath) -->
  <path d="M 594 192 L 594 260 L 360 260 L 360 196" fill="none" stroke="#C4683A" stroke-width="3"/>
  <polygon points="360,196 354,208 366,208" fill="#C4683A"/>
  <text x="477" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#C4683A">A good outcome makes the behavior more likely next time</text>

  <!-- Milo example caption -->
  <text x="126" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Can opener runs</text>
  <text x="360" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Milo runs to the kitchen</text>
  <text x="594" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Food appears</text>
</svg>
