<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Client Consultation Workflow</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">From first contact to follow-up, with a referral exit at intake</text>

  <!-- main flow nodes -->
  <!-- Intake -->
  <rect x="24" y="150" width="120" height="64" rx="8" fill="#1E2A8E"/>
  <text x="84" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Intake</text>
  <text x="84" y="197" text-anchor="middle" font-size="11" fill="#E5E7EB">form + history</text>

  <!-- Assess / Observe -->
  <rect x="184" y="150" width="120" height="64" rx="8" fill="#1E2A8E"/>
  <text x="244" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Assess</text>
  <text x="244" y="197" text-anchor="middle" font-size="11" fill="#E5E7EB">observe + explain</text>

  <!-- Demonstrate -->
  <rect x="344" y="150" width="120" height="64" rx="8" fill="#1E2A8E"/>
  <text x="404" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Demonstrate</text>
  <text x="404" y="197" text-anchor="middle" font-size="11" fill="#E5E7EB">+ set goals</text>

  <!-- Written plan -->
  <rect x="504" y="150" width="120" height="64" rx="8" fill="#3E9B6B"/>
  <text x="564" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Written Plan</text>
  <text x="564" y="197" text-anchor="middle" font-size="11" fill="#E5E7EB">the deliverable</text>

  <!-- Follow-up -->
  <rect x="640" y="150" width="96" height="64" rx="8" fill="#D4AF37"/>
  <text x="688" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Follow-up</text>
  <text x="688" y="197" text-anchor="middle" font-size="11" fill="#141B5C">check-in</text>

  <!-- arrows along main flow -->
  <g stroke="#374151" stroke-width="2.5" fill="#374151">
    <line x1="144" y1="182" x2="176" y2="182"/>
    <polygon points="176,182 168,178 168,186"/>
    <line x1="304" y1="182" x2="336" y2="182"/>
    <polygon points="336,182 328,178 328,186"/>
    <line x1="464" y1="182" x2="496" y2="182"/>
    <polygon points="496,182 488,178 488,186"/>
    <line x1="624" y1="182" x2="632" y2="182"/>
    <polygon points="632,182 626,178 626,186"/>
  </g>

  <!-- referral branch from Intake -->
  <g stroke="#C4683A" stroke-width="2.5" fill="none">
    <path d="M84 150 L84 104 L300 104"/>
  </g>
  <polygon points="300,104 292,100 292,108" fill="#C4683A"/>
  <rect x="300" y="80" width="180" height="48" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2.5"/>
  <text x="390" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Medical red flag?</text>
  <text x="390" y="118" text-anchor="middle" font-size="12" fill="#C4683A">Refer to a vet first</text>

  <!-- caption strip -->
  <text x="84" y="246" text-anchor="middle" font-size="11" fill="#374151">read before</text>
  <text x="84" y="260" text-anchor="middle" font-size="11" fill="#374151">you arrive</text>
  <text x="404" y="246" text-anchor="middle" font-size="11" fill="#374151">the session</text>
  <text x="688" y="246" text-anchor="middle" font-size="11" fill="#374151">a week later</text>

  <line x1="24" y1="300" x2="736" y2="300" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="24" y="324" font-size="12" fill="#374151" font-style="italic">Same flow every time. A red flag at intake exits to the vet, not to a training plan.</text>
</svg>
