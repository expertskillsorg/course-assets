<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Arial, sans-serif">
  <rect width="760" height="480" fill="#FFFFFF"/>

  <!-- LEFT: Job posting -->
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#141B5C">Job Posting</text>
  <rect x="40" y="55" width="250" height="370" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="85" font-size="13" font-weight="bold" fill="#1E2A8E">Senior Project Manager</text>
  <line x1="60" y1="98" x2="270" y2="98" stroke="#E5E7EB" stroke-width="1"/>

  <text x="60" y="125" font-size="11" fill="#374151">Lead Agile teams using Scrum to</text>
  <text x="60" y="142" font-size="11" fill="#374151">deliver projects on budget.</text>
  <text x="60" y="166" font-size="11" fill="#374151">Strong stakeholder management</text>
  <text x="60" y="183" font-size="11" fill="#374151">across cross-functional teams.</text>
  <text x="60" y="207" font-size="11" fill="#374151">Own risk mitigation and project</text>
  <text x="60" y="224" font-size="11" fill="#374151">roadmaps; track work in Jira.</text>
  <text x="60" y="252" font-size="11" font-weight="bold" fill="#374151">Required:</text>
  <text x="60" y="270" font-size="11" fill="#374151">Agile, Scrum, budget management,</text>
  <text x="60" y="287" font-size="11" fill="#374151">stakeholder management.</text>
  <text x="60" y="315" font-size="11" font-weight="bold" fill="#374151">Preferred:</text>
  <text x="60" y="333" font-size="11" fill="#374151">PMP, healthcare experience.</text>

  <!-- MIDDLE: ranked tiers -->
  <text x="335" y="40" font-size="18" font-weight="bold" fill="#141B5C">Keyword Map</text>

  <rect x="335" y="60" width="180" height="92" rx="8" fill="#1E2A8E"/>
  <text x="350" y="82" font-size="12" font-weight="bold" fill="#FFFFFF">Tier 1 (required)</text>
  <text x="350" y="103" font-size="11" fill="#FFFFFF">Project Manager (title)</text>
  <text x="350" y="120" font-size="11" fill="#FFFFFF">Agile, Scrum, budget mgmt</text>
  <text x="350" y="137" font-size="11" fill="#FFFFFF">stakeholder management</text>

  <rect x="335" y="166" width="180" height="78" rx="8" fill="#3E9B6B"/>
  <text x="350" y="188" font-size="12" font-weight="bold" fill="#FFFFFF">Tier 2 (key duties)</text>
  <text x="350" y="209" font-size="11" fill="#FFFFFF">cross-functional teams</text>
  <text x="350" y="226" font-size="11" fill="#FFFFFF">risk mitigation, Jira</text>

  <rect x="335" y="258" width="180" height="62" rx="8" fill="#D4AF37"/>
  <text x="350" y="280" font-size="12" font-weight="bold" fill="#141B5C">Tier 3 (nice-to-have)</text>
  <text x="350" y="301" font-size="11" fill="#141B5C">PMP, healthcare</text>

  <!-- arrows posting -> map -->
  <line x1="290" y1="240" x2="333" y2="160" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- RIGHT: resume -->
  <text x="560" y="40" font-size="18" font-weight="bold" fill="#141B5C">Resume</text>
  <rect x="560" y="55" width="160" height="370" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <text x="578" y="92" font-size="11" font-weight="bold" fill="#1E2A8E">Summary</text>
  <rect x="578" y="100" width="124" height="6" rx="3" fill="#1E2A8E"/>
  <rect x="578" y="111" width="100" height="6" rx="3" fill="#E5E7EB"/>

  <text x="578" y="168" font-size="11" font-weight="bold" fill="#3E9B6B">Skills</text>
  <rect x="578" y="176" width="124" height="6" rx="3" fill="#3E9B6B"/>
  <rect x="578" y="187" width="90" height="6" rx="3" fill="#E5E7EB"/>

  <text x="578" y="244" font-size="11" font-weight="bold" fill="#C4683A">Experience</text>
  <rect x="578" y="252" width="124" height="6" rx="3" fill="#C4683A"/>
  <rect x="578" y="263" width="110" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="578" y="274" width="124" height="6" rx="3" fill="#D4AF37"/>
  <rect x="578" y="285" width="96" height="6" rx="3" fill="#E5E7EB"/>

  <!-- arrows map -> resume sections -->
  <line x1="515" y1="106" x2="558" y2="95" stroke="#1E2A8E" stroke-width="2" marker-end="url(#b)"/>
  <line x1="515" y1="205" x2="558" y2="172" stroke="#3E9B6B" stroke-width="2" marker-end="url(#c)"/>
  <line x1="515" y1="289" x2="558" y2="258" stroke="#C4683A" stroke-width="2" marker-end="url(#d)"/>

  <text x="40" y="455" font-size="11" fill="#374151">Pull and rank the posting's terms, then carry each tier into the resume section that should hold it.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1E2A8E"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3E9B6B"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C4683A"/></marker>
  </defs>
</svg>
