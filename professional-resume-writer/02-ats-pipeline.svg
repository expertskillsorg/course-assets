<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, sans-serif">
  <rect width="720" height="320" fill="#FFFFFF"/>
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#141B5C">The path a resume takes through an ATS</text>
  <text x="28" y="58" font-size="12" fill="#374151">From upload to the recruiter's shortlist, with the points where resumes drop out.</text>

  <!-- Stage boxes -->
  <!-- Stage 1 -->
  <rect x="28" y="92" width="118" height="70" rx="8" fill="#1E2A8E"/>
  <text x="87" y="124" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Upload</text>
  <text x="87" y="144" font-size="10" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">file submitted</text>

  <!-- Stage 2 -->
  <rect x="174" y="92" width="118" height="70" rx="8" fill="#141B5C"/>
  <text x="233" y="124" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Parse</text>
  <text x="233" y="144" font-size="10" fill="#FFFFFF" text-anchor="middle" fill-opacity="0.8">sort into fields</text>

  <!-- Stage 3 -->
  <rect x="320" y="92" width="118" height="70" rx="8" fill="#3E9B6B"/>
  <text x="379" y="120" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Keyword</text>
  <text x="379" y="138" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">match</text>

  <!-- Stage 4 -->
  <rect x="466" y="92" width="118" height="70" rx="8" fill="#D4AF37"/>
  <text x="525" y="124" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">4. Rank</text>
  <text x="525" y="144" font-size="10" fill="#141B5C" text-anchor="middle">score the fit</text>

  <!-- Stage 5 -->
  <rect x="612" y="92" width="100" height="70" rx="8" fill="#C4683A"/>
  <text x="662" y="120" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5. Recruiter</text>
  <text x="662" y="138" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">review</text>

  <!-- Connecting arrows -->
  <g stroke="#374151" stroke-width="3" fill="none">
    <path d="M 146 127 L 170 127"/>
    <path d="M 292 127 L 316 127"/>
    <path d="M 438 127 L 462 127"/>
    <path d="M 584 127 L 608 127"/>
  </g>
  <g fill="#374151">
    <polygon points="170,127 160,122 160,132"/>
    <polygon points="316,127 306,122 306,132"/>
    <polygon points="462,127 452,122 452,132"/>
    <polygon points="608,127 598,122 598,132"/>
  </g>

  <!-- Drop-off arrows -->
  <g stroke="#C4683A" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <path d="M 233 162 L 233 212"/>
    <path d="M 379 162 L 379 212"/>
    <path d="M 525 162 L 525 212"/>
  </g>
  <g fill="#C4683A">
    <polygon points="233,214 228,204 238,204"/>
    <polygon points="379,214 374,204 384,204"/>
    <polygon points="525,214 520,204 530,204"/>
  </g>

  <!-- Drop-off zone -->
  <rect x="150" y="222" width="460" height="62" rx="8" fill="#C4683A" fill-opacity="0.10" stroke="#C4683A" stroke-width="1.5"/>
  <text x="380" y="246" font-size="13" font-weight="bold" fill="#C4683A" text-anchor="middle">Where qualified resumes drop out</text>
  <text x="233" y="268" font-size="10" fill="#374151" text-anchor="middle">broken</text>
  <text x="233" y="280" font-size="10" fill="#374151" text-anchor="middle">formatting</text>
  <text x="379" y="268" font-size="10" fill="#374151" text-anchor="middle">missing</text>
  <text x="379" y="280" font-size="10" fill="#374151" text-anchor="middle">keywords</text>
  <text x="525" y="268" font-size="10" fill="#374151" text-anchor="middle">ranked too</text>
  <text x="525" y="280" font-size="10" fill="#374151" text-anchor="middle">low to be seen</text>
</svg>
