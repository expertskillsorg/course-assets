<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#FFFFFF"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The Anatomy of a One-Page Resume</text>

  <!-- page -->
  <rect x="200" y="55" width="240" height="380" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>

  <!-- Contact -->
  <rect x="200" y="55" width="240" height="46" rx="4" fill="#1E2A8E"/>
  <rect x="220" y="68" width="120" height="9" rx="2" fill="#FFFFFF"/>
  <rect x="220" y="83" width="170" height="6" rx="2" fill="#D4AF37"/>

  <!-- Headline + Summary -->
  <rect x="200" y="101" width="240" height="62" fill="#F3F4FB"/>
  <rect x="216" y="112" width="100" height="8" rx="2" fill="#141B5C"/>
  <rect x="216" y="128" width="208" height="5" rx="2" fill="#374151"/>
  <rect x="216" y="139" width="208" height="5" rx="2" fill="#374151"/>
  <rect x="216" y="150" width="150" height="5" rx="2" fill="#374151"/>

  <!-- Experience (largest) -->
  <rect x="216" y="176" width="80" height="8" rx="2" fill="#1E2A8E"/>
  <rect x="216" y="192" width="208" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="202" width="190" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="216" width="208" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="226" width="180" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="240" width="208" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="250" width="196" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="264" width="170" height="5" rx="2" fill="#9CA3AF"/>

  <!-- Skills -->
  <rect x="216" y="296" width="60" height="8" rx="2" fill="#3E9B6B"/>
  <rect x="216" y="312" width="50" height="14" rx="7" fill="#E5F0EA"/>
  <rect x="274" y="312" width="60" height="14" rx="7" fill="#E5F0EA"/>
  <rect x="342" y="312" width="48" height="14" rx="7" fill="#E5F0EA"/>

  <!-- Education -->
  <rect x="216" y="348" width="74" height="8" rx="2" fill="#C4683A"/>
  <rect x="216" y="364" width="208" height="5" rx="2" fill="#9CA3AF"/>
  <rect x="216" y="374" width="150" height="5" rx="2" fill="#9CA3AF"/>

  <!-- callout labels right -->
  <g font-size="13" fill="#141B5C">
    <line x1="440" y1="78" x2="500" y2="78" stroke="#1E2A8E" stroke-width="1.5"/>
    <circle cx="440" cy="78" r="3" fill="#1E2A8E"/>
    <text x="506" y="76" font-weight="bold">Contact</text>
    <text x="506" y="91" font-size="10" fill="#374151">who, and how to reach</text>

    <line x1="440" y1="132" x2="500" y2="132" stroke="#141B5C" stroke-width="1.5"/>
    <circle cx="440" cy="132" r="3" fill="#141B5C"/>
    <text x="506" y="130" font-weight="bold">Headline + Summary</text>
    <text x="506" y="145" font-size="10" fill="#374151">names target + best proof</text>

    <line x1="440" y1="225" x2="500" y2="225" stroke="#1E2A8E" stroke-width="1.5"/>
    <circle cx="440" cy="225" r="3" fill="#1E2A8E"/>
    <text x="506" y="223" font-weight="bold">Experience</text>
    <text x="506" y="238" font-size="10" fill="#374151">achievements, most space</text>

    <line x1="392" y1="313" x2="500" y2="313" stroke="#3E9B6B" stroke-width="1.5"/>
    <circle cx="392" cy="313" r="3" fill="#3E9B6B"/>
    <text x="506" y="311" font-weight="bold">Skills</text>
    <text x="506" y="326" font-size="10" fill="#374151">abilities + ATS keywords</text>

    <line x1="424" y1="366" x2="500" y2="366" stroke="#C4683A" stroke-width="1.5"/>
    <circle cx="424" cy="366" r="3" fill="#C4683A"/>
    <text x="506" y="364" font-weight="bold">Education</text>
    <text x="506" y="379" font-size="10" fill="#374151">degrees + certifications</text>
  </g>

  <!-- left top-third bracket -->
  <line x1="190" y1="55" x2="190" y2="163" stroke="#D4AF37" stroke-width="2"/>
  <text x="184" y="112" text-anchor="middle" font-size="10" fill="#D4AF37" transform="rotate(-90 184 112)">top third: where the scan lands</text>
</svg>
