<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">Reframing Transferable Skills: Teacher to Instructional Designer</text>

  <!-- Old field column -->
  <text x="150" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">Old field language (Teaching)</text>
  <text x="610" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E9B6B">New target language (Instructional Design)</text>

  <!-- Row 1 -->
  <rect x="20" y="92" width="260" height="56" rx="6" fill="#FBEDE4" stroke="#C4683A" stroke-width="1.5"/>
  <text x="150" y="116" text-anchor="middle" font-size="13" fill="#374151">Wrote lesson plans and</text>
  <text x="150" y="134" text-anchor="middle" font-size="13" fill="#374151">unit curricula for classes</text>

  <rect x="480" y="92" width="260" height="56" rx="6" fill="#E6F2EC" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="610" y="116" text-anchor="middle" font-size="13" fill="#374151">Designed curriculum and</text>
  <text x="610" y="134" text-anchor="middle" font-size="13" fill="#374151">learning objectives</text>

  <!-- Row 2 -->
  <rect x="20" y="162" width="260" height="56" rx="6" fill="#FBEDE4" stroke="#C4683A" stroke-width="1.5"/>
  <text x="150" y="186" text-anchor="middle" font-size="13" fill="#374151">Used Google Classroom</text>
  <text x="150" y="204" text-anchor="middle" font-size="13" fill="#374151">and made slide decks</text>

  <rect x="480" y="162" width="260" height="56" rx="6" fill="#E6F2EC" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="610" y="186" text-anchor="middle" font-size="13" fill="#374151">Built content in an LMS</text>
  <text x="610" y="204" text-anchor="middle" font-size="13" fill="#374151">and authoring tools</text>

  <!-- Row 3 -->
  <rect x="20" y="232" width="260" height="56" rx="6" fill="#FBEDE4" stroke="#C4683A" stroke-width="1.5"/>
  <text x="150" y="256" text-anchor="middle" font-size="13" fill="#374151">Graded tests and</text>
  <text x="150" y="274" text-anchor="middle" font-size="13" fill="#374151">tracked student progress</text>

  <rect x="480" y="232" width="260" height="56" rx="6" fill="#E6F2EC" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="610" y="256" text-anchor="middle" font-size="13" fill="#374151">Created assessments and</text>
  <text x="610" y="274" text-anchor="middle" font-size="13" fill="#374151">measured learning outcomes</text>

  <!-- Bridge / arrows -->
  <g stroke="#1E2A8E" stroke-width="2.5" fill="none">
    <path d="M280 120 H 460" marker-end="url(#ar)"/>
    <path d="M280 190 H 460" marker-end="url(#ar)"/>
    <path d="M280 260 H 460" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E2A8E"/>
    </marker>
  </defs>

  <!-- Bridge label -->
  <rect x="305" y="312" width="150" height="34" rx="17" fill="#D4AF37"/>
  <text x="380" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Same skill, retold</text>

  <text x="380" y="366" text-anchor="middle" font-size="12" fill="#374151">The work did not change. The words now match the target field's job postings.</text>
</svg>
