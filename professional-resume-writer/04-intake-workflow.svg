<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="260" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The Intake Workflow: Inquiry to First Draft</text>

  <!-- Stage boxes -->
  <g>
    <rect x="20" y="70" width="130" height="70" rx="8" fill="#1E2A8E"/>
    <text x="85" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1. Inquiry</text>
    <text x="85" y="120" text-anchor="middle" font-size="11" fill="#E5E7EB">First contact</text>
  </g>
  <g>
    <rect x="170" y="70" width="130" height="70" rx="8" fill="#3E9B6B"/>
    <text x="235" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2. Scoping</text>
    <text x="235" y="120" text-anchor="middle" font-size="11" fill="#FFFFFF">Fit, price, terms</text>
  </g>
  <g>
    <rect x="320" y="70" width="130" height="70" rx="8" fill="#D4AF37"/>
    <text x="385" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">3. Questionnaire</text>
    <text x="385" y="120" text-anchor="middle" font-size="11" fill="#111827">Gather raw facts</text>
  </g>
  <g>
    <rect x="470" y="70" width="130" height="70" rx="8" fill="#C4683A"/>
    <text x="535" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">4. Discovery</text>
    <text x="535" y="113" text-anchor="middle" font-size="11" fill="#FFFFFF">call</text>
    <text x="535" y="130" text-anchor="middle" font-size="11" fill="#FFFFFF">Mine wins</text>
  </g>
  <g>
    <rect x="620" y="70" width="120" height="70" rx="8" fill="#141B5C"/>
    <text x="680" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">5. Draft</text>
    <text x="680" y="120" text-anchor="middle" font-size="11" fill="#E5E7EB">First version</text>
  </g>

  <!-- Arrows -->
  <g fill="#374151">
    <polygon points="150,105 170,105 162,99 162,111" transform="translate(0,0)"/>
    <polygon points="300,105 320,105 312,99 312,111"/>
    <polygon points="450,105 470,105 462,99 462,111"/>
    <polygon points="600,105 620,105 612,99 612,111"/>
  </g>

  <!-- Output flow line -->
  <line x1="85" y1="170" x2="680" y2="170" stroke="#E5E7EB" stroke-width="2"/>
  <text x="85" y="195" text-anchor="middle" font-size="10" fill="#374151">contact info</text>
  <text x="235" y="195" text-anchor="middle" font-size="10" fill="#374151">agreement</text>
  <text x="385" y="195" text-anchor="middle" font-size="10" fill="#374151">history + target</text>
  <text x="535" y="195" text-anchor="middle" font-size="10" fill="#374151">concrete results</text>
  <text x="680" y="195" text-anchor="middle" font-size="10" fill="#374151">raw material</text>

  <text x="380" y="235" text-anchor="middle" font-size="12" fill="#374151">Each stage produces what the next one needs. Run the same five steps for every client.</text>
</svg>
