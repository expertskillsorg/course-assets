<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>

  <!-- LEFT: the flat duty -->
  <text x="30" y="40" font-size="15" font-weight="bold" fill="#141B5C">The duty (flat)</text>
  <rect x="30" y="55" width="200" height="90" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="45" y="88" font-size="12.5" fill="#374151">Responsible for</text>
  <text x="45" y="108" font-size="12.5" fill="#374151">managing the sales</text>
  <text x="45" y="128" font-size="12.5" fill="#374151">floor and staff.</text>

  <!-- ARROW -->
  <line x1="240" y1="100" x2="285" y2="100" stroke="#374151" stroke-width="2.5"/>
  <polygon points="285,93 298,100 285,107" fill="#374151"/>

  <!-- MIDDLE: the three CAR stages -->
  <text x="315" y="40" font-size="15" font-weight="bold" fill="#141B5C">Add Challenge, Action, Result</text>

  <rect x="315" y="55" width="415" height="56" rx="8" fill="#1E2A8E"/>
  <text x="332" y="80" font-size="13" font-weight="bold" fill="#D4AF37">Challenge</text>
  <text x="332" y="99" font-size="12" fill="#FFFFFF">Store was losing new hires fast.</text>

  <rect x="315" y="121" width="415" height="56" rx="8" fill="#C4683A"/>
  <text x="332" y="146" font-size="13" font-weight="bold" fill="#FFFFFF">Action</text>
  <text x="332" y="165" font-size="12" fill="#FFFFFF">Rebuilt onboarding + first-month mentors.</text>

  <rect x="315" y="187" width="415" height="56" rx="8" fill="#3E9B6B"/>
  <text x="332" y="212" font-size="13" font-weight="bold" fill="#FFFFFF">Result</text>
  <text x="332" y="231" font-size="12" fill="#FFFFFF">Turnover dropped from 40% to 18% in a year.</text>

  <!-- ARROW DOWN to the finished bullet -->
  <line x1="522" y1="243" x2="522" y2="272" stroke="#374151" stroke-width="2.5"/>
  <polygon points="515,272 522,285 529,272" fill="#374151"/>

  <!-- BOTTOM: the finished achievement bullet (result-first) -->
  <text x="30" y="265" font-size="15" font-weight="bold" fill="#141B5C">The achievement (result-first)</text>
  <rect x="30" y="278" width="700" height="62" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="52" cy="309" r="4" fill="#1E2A8E"/>
  <text x="68" y="305" font-size="13" fill="#111827">Cut new-hire turnover from 40% to 18% within one year by redesigning</text>
  <text x="68" y="324" font-size="13" fill="#111827">onboarding and adding a first-month mentor program.</text>
</svg>
