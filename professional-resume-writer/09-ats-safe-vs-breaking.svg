<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Same resume, two layouts</text>

  <!-- LEFT: ATS-safe -->
  <rect x="30" y="58" width="300" height="372" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <rect x="30" y="58" width="300" height="34" rx="8" fill="#3E9B6B"/>
  <text x="180" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">ATS-safe layout</text>

  <!-- single column content -->
  <text x="52" y="120" font-size="13" font-weight="bold" fill="#1E2A8E">Jordan Lee</text>
  <text x="52" y="138" font-size="9" fill="#374151">jordan.lee@email.com  •  555-0100</text>
  <rect x="52" y="150" width="256" height="1.5" fill="#E5E7EB"/>

  <text x="52" y="172" font-size="11" font-weight="bold" fill="#1E2A8E">SUMMARY</text>
  <rect x="52" y="180" width="256" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="52" y="192" width="230" height="6" rx="3" fill="#E5E7EB"/>

  <text x="52" y="220" font-size="11" font-weight="bold" fill="#1E2A8E">EXPERIENCE</text>
  <rect x="52" y="228" width="256" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="52" y="240" width="256" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="52" y="252" width="200" height="6" rx="3" fill="#E5E7EB"/>

  <text x="52" y="284" font-size="11" font-weight="bold" fill="#1E2A8E">SKILLS</text>
  <rect x="52" y="292" width="256" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="52" y="304" width="180" height="6" rx="3" fill="#E5E7EB"/>

  <text x="52" y="336" font-size="11" font-weight="bold" fill="#1E2A8E">EDUCATION</text>
  <rect x="52" y="344" width="256" height="6" rx="3" fill="#E5E7EB"/>

  <text x="52" y="384" font-size="10" font-weight="bold" fill="#3E9B6B">Parses cleanly:</text>
  <text x="52" y="402" font-size="9" fill="#374151">One column. Standard headings.</text>
  <text x="52" y="416" font-size="9" fill="#374151">Real text. Standard font.</text>

  <!-- RIGHT: ATS-breaking -->
  <rect x="390" y="58" width="300" height="372" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2.5"/>
  <rect x="390" y="58" width="300" height="34" rx="8" fill="#C4683A"/>
  <text x="540" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">ATS-breaking layout</text>

  <!-- header band (broken) -->
  <rect x="408" y="104" width="264" height="22" rx="3" fill="#F3E6DE"/>
  <text x="414" y="119" font-size="9" fill="#C4683A">header zone (name hidden from parser)</text>

  <!-- sidebar column -->
  <rect x="408" y="136" width="86" height="240" rx="3" fill="#F3E6DE"/>
  <text x="451" y="156" text-anchor="middle" font-size="8" fill="#C4683A">side</text>
  <text x="451" y="168" text-anchor="middle" font-size="8" fill="#C4683A">column</text>
  <rect x="418" y="182" width="66" height="5" rx="2" fill="#E5E7EB"/>
  <rect x="418" y="194" width="66" height="5" rx="2" fill="#E5E7EB"/>
  <rect x="418" y="206" width="50" height="5" rx="2" fill="#E5E7EB"/>
  <!-- skill graphic bars -->
  <rect x="418" y="232" width="60" height="7" rx="3" fill="#C4683A" opacity="0.5"/>
  <rect x="418" y="244" width="44" height="7" rx="3" fill="#C4683A" opacity="0.5"/>
  <text x="451" y="272" text-anchor="middle" font-size="7" fill="#C4683A">skill bars</text>
  <text x="451" y="283" text-anchor="middle" font-size="7" fill="#C4683A">(graphic)</text>

  <!-- main column with table -->
  <rect x="502" y="136" width="170" height="100" rx="3" fill="#FFFFFF" stroke="#C4683A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="587" y1="136" x2="587" y2="236" stroke="#C4683A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="502" y1="169" x2="672" y2="169" stroke="#C4683A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="502" y1="202" x2="672" y2="202" stroke="#C4683A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="587" y="128" text-anchor="middle" font-size="8" fill="#C4683A">two-column table</text>

  <rect x="502" y="252" width="170" height="60" rx="3" fill="#F3E6DE"/>
  <text x="587" y="276" text-anchor="middle" font-size="8" fill="#C4683A">text box</text>
  <text x="587" y="290" text-anchor="middle" font-size="8" fill="#C4683A">(skipped or scrambled)</text>

  <text x="408" y="398" font-size="10" font-weight="bold" fill="#C4683A">Parses wrong:</text>
  <text x="408" y="414" font-size="9" fill="#374151">Columns, tables, text boxes,</text>
  <text x="408" y="426" font-size="9" fill="#374151">header zone, skill graphics.</text>
</svg>
