<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Anatomy of a Professional Summary</text>

  <!-- Positioning line -->
  <rect x="120" y="64" width="400" height="74" rx="8" fill="#1E2A8E"/>
  <text x="140" y="92" font-size="13" font-weight="bold" fill="#D4AF37">1. POSITIONING LINE</text>
  <text x="140" y="114" font-size="13" fill="#ffffff">Who they are: title, depth of</text>
  <text x="140" y="132" font-size="13" fill="#ffffff">experience, main strength  (the claim)</text>

  <!-- arrow -->
  <path d="M320 138 L320 158" stroke="#374151" stroke-width="2"/>
  <path d="M320 160 l-5 -8 l10 0 z" fill="#374151"/>

  <!-- Proof points -->
  <rect x="120" y="162" width="400" height="116" rx="8" fill="#3E9B6B"/>
  <text x="140" y="190" font-size="13" font-weight="bold" fill="#ffffff">2. PROOF POINTS</text>
  <circle cx="146" cy="212" r="3" fill="#ffffff"/>
  <text x="158" y="216" font-size="13" fill="#ffffff">Concrete win with a number</text>
  <circle cx="146" cy="236" r="3" fill="#ffffff"/>
  <text x="158" y="240" font-size="13" fill="#ffffff">Concrete win with a number</text>
  <circle cx="146" cy="260" r="3" fill="#ffffff"/>
  <text x="158" y="264" font-size="13" fill="#ffffff">Capability or scale  (the evidence)</text>

  <!-- arrow -->
  <path d="M320 278 L320 298" stroke="#374151" stroke-width="2"/>
  <path d="M320 300 l-5 -8 l10 0 z" fill="#374151"/>

  <!-- Target line -->
  <rect x="120" y="302" width="400" height="64" rx="8" fill="#C4683A"/>
  <text x="140" y="330" font-size="13" font-weight="bold" fill="#ffffff">3. TARGET LINE</text>
  <text x="140" y="352" font-size="13" fill="#ffffff">Points the block at the role wanted  (the aim)</text>

  <text x="320" y="396" text-anchor="middle" font-size="13" font-style="italic" fill="#374151">Claim, then evidence, then aim. Strongest proof first.</text>
</svg>
