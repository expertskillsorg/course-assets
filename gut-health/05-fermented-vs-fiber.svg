<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Two diets, two different effects</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#374151">What a ~10-week trial of healthy adults found</text>

  <!-- Fermented-food column -->
  <rect x="40" y="90" width="300" height="320" rx="10" fill="#F3F6FB" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="40" y="90" width="300" height="46" rx="10" fill="#1E2A8E"/>
  <rect x="40" y="120" width="300" height="16" fill="#1E2A8E"/>
  <text x="190" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Fermented-food diet</text>

  <!-- diversity up -->
  <text x="68" y="180" font-size="14" font-weight="bold" fill="#111827">Microbiome diversity</text>
  <polygon points="270,182 290,182 280,164" fill="#3E9B6B"/>
  <text x="305" y="185" font-size="13" font-weight="bold" fill="#3E9B6B">up</text>
  <text x="68" y="202" font-size="12" fill="#374151">More variety of microbes</text>

  <!-- inflammation down -->
  <text x="68" y="248" font-size="14" font-weight="bold" fill="#111827">Inflammation markers</text>
  <polygon points="270,234 290,234 280,252" fill="#3E9B6B"/>
  <text x="300" y="248" font-size="13" font-weight="bold" fill="#3E9B6B">down</text>
  <text x="68" y="270" font-size="12" fill="#374151">A calmer signal in the body</text>

  <line x1="68" y1="300" x2="312" y2="300" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="68" y="330" font-size="12.5" fill="#374151">Adds live microbes and the</text>
  <text x="68" y="350" font-size="12.5" fill="#374151">compounds they make.</text>
  <text x="68" y="384" font-size="12.5" font-style="italic" fill="#C4683A">e.g. yogurt, kefir, kimchi,</text>
  <text x="68" y="402" font-size="12.5" font-style="italic" fill="#C4683A">sauerkraut, kombucha</text>

  <!-- High-fiber column -->
  <rect x="380" y="90" width="300" height="320" rx="10" fill="#FBF7EC" stroke="#D4AF37" stroke-width="2"/>
  <rect x="380" y="90" width="300" height="46" rx="10" fill="#D4AF37"/>
  <rect x="380" y="120" width="300" height="16" fill="#D4AF37"/>
  <text x="530" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">High-fiber diet</text>

  <!-- diversity flat -->
  <text x="408" y="180" font-size="14" font-weight="bold" fill="#111827">Microbiome diversity</text>
  <rect x="612" y="170" width="22" height="6" fill="#374151"/>
  <text x="640" y="185" font-size="13" font-weight="bold" fill="#374151">flat</text>
  <text x="408" y="202" font-size="12" fill="#374151">No rise in this study</text>

  <!-- enzyme capacity up -->
  <text x="408" y="248" font-size="14" font-weight="bold" fill="#111827">Fiber-digesting capacity</text>
  <polygon points="610,250 630,250 620,232" fill="#3E9B6B"/>
  <text x="645" y="253" font-size="13" font-weight="bold" fill="#3E9B6B">up</text>
  <text x="408" y="270" font-size="12" fill="#374151">Microbes geared to digest fiber</text>

  <line x1="408" y1="300" x2="652" y2="300" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="408" y="330" font-size="12.5" fill="#374151">Feeds the microbes you</text>
  <text x="408" y="350" font-size="12.5" fill="#374151">already have.</text>
  <text x="408" y="384" font-size="12.5" font-style="italic" fill="#C4683A">e.g. beans, oats, vegetables,</text>
  <text x="408" y="402" font-size="12.5" font-style="italic" fill="#C4683A">fruit, seeds</text>

  <text x="360" y="446" text-anchor="middle" font-size="11.5" fill="#374151">Small study of healthy adults. Different jobs, not rivals: do both.</text>
</svg>
