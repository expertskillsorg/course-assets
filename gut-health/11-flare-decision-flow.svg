<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, sans-serif">
  <rect width="560" height="420" fill="#ffffff"/>

  <!-- Start -->
  <rect x="200" y="20" width="160" height="48" rx="24" fill="#1E2A8E"/>
  <text x="280" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Symptoms flare</text>

  <!-- arrow down to decision -->
  <line x1="280" y1="68" x2="280" y2="100" stroke="#374151" stroke-width="2"/>
  <polygon points="280,108 275,98 285,98" fill="#374151"/>

  <!-- Decision diamond -->
  <polygon points="280,110 400,180 280,250 160,180" fill="#D4AF37"/>
  <text x="280" y="172" text-anchor="middle" fill="#141B5C" font-size="13" font-weight="bold">Any red-flag</text>
  <text x="280" y="190" text-anchor="middle" fill="#141B5C" font-size="13" font-weight="bold">symptom?</text>

  <!-- YES branch to right -->
  <line x1="400" y1="180" x2="468" y2="180" stroke="#C4683A" stroke-width="2"/>
  <polygon points="476,180 466,175 466,185" fill="#C4683A"/>
  <text x="432" y="172" text-anchor="middle" fill="#C4683A" font-size="12" font-weight="bold">Yes</text>

  <rect x="430" y="156" width="118" height="48" rx="8" fill="#C4683A"/>
  <text x="489" y="178" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Stop and see</text>
  <text x="489" y="195" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">a doctor</text>

  <!-- NO branch down -->
  <line x1="280" y1="250" x2="280" y2="288" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="280,296 275,286 285,286" fill="#3E9B6B"/>
  <text x="298" y="276" text-anchor="middle" fill="#3E9B6B" font-size="12" font-weight="bold">No</text>

  <!-- Reset box -->
  <rect x="150" y="298" width="260" height="50" rx="8" fill="#3E9B6B"/>
  <text x="280" y="320" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Run the reset routine</text>
  <text x="280" y="338" text-anchor="middle" fill="#ffffff" font-size="12">safe foods, hydrate, rest, change nothing</text>

  <!-- arrow to review -->
  <line x1="280" y1="348" x2="280" y2="372" stroke="#374151" stroke-width="2"/>
  <polygon points="280,380 275,370 285,370" fill="#374151"/>

  <rect x="170" y="382" width="220" height="32" rx="8" fill="#141B5C"/>
  <text x="280" y="403" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Review diary for the trigger</text>
</svg>
