<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#141B5C">Your Four-Week Gut Plan</text>
  <text x="30" y="64" font-size="14" fill="#374151">Build foundations, then find triggers, then lock it in.</text>

  <!-- baseline arrow -->
  <line x1="40" y1="110" x2="720" y2="110" stroke="#E5E7EB" stroke-width="4"/>
  <polygon points="720,110 706,103 706,117" fill="#E5E7EB"/>

  <!-- Phase 1: Weeks 1-2 Foundations -->
  <rect x="40" y="130" width="300" height="180" rx="10" fill="#3E9B6B"/>
  <text x="60" y="160" font-size="16" font-weight="bold" fill="#ffffff">Weeks 1 &amp; 2</text>
  <text x="60" y="182" font-size="15" font-weight="bold" fill="#ffffff">Foundations</text>
  <text x="60" y="210" font-size="13" fill="#ffffff">Slow fiber ramp + water</text>
  <text x="60" y="232" font-size="13" fill="#ffffff">Add one fermented food</text>
  <text x="60" y="254" font-size="13" fill="#ffffff">Keep the daily diary</text>
  <text x="60" y="276" font-size="13" fill="#ffffff">Steady sleep, after-meal walks</text>

  <!-- Phase 2: Week 3 Find triggers -->
  <rect x="360" y="130" width="180" height="180" rx="10" fill="#C4683A"/>
  <text x="380" y="160" font-size="16" font-weight="bold" fill="#ffffff">Week 3</text>
  <text x="380" y="182" font-size="15" font-weight="bold" fill="#ffffff">Find triggers</text>
  <text x="380" y="210" font-size="13" fill="#ffffff">Short elimination</text>
  <text x="380" y="232" font-size="13" fill="#ffffff">Reintroduce one</text>
  <text x="380" y="254" font-size="13" fill="#ffffff">food at a time</text>
  <text x="380" y="276" font-size="13" fill="#ffffff">Use plate + swaps</text>

  <!-- Phase 3: Week 4 Lock it in -->
  <rect x="560" y="130" width="160" height="180" rx="10" fill="#1E2A8E"/>
  <text x="580" y="160" font-size="16" font-weight="bold" fill="#ffffff">Week 4</text>
  <text x="580" y="182" font-size="15" font-weight="bold" fill="#ffffff">Lock it in</text>
  <text x="580" y="210" font-size="13" fill="#ffffff">Settle safe</text>
  <text x="580" y="232" font-size="13" fill="#ffffff">foods + routine</text>
  <text x="580" y="254" font-size="13" fill="#ffffff">Daily stress tool</text>
  <text x="580" y="276" font-size="13" fill="#ffffff">Decide what stays</text>

  <!-- markers on the timeline -->
  <circle cx="40" cy="110" r="7" fill="#D4AF37"/>
  <circle cx="360" cy="110" r="7" fill="#D4AF37"/>
  <circle cx="560" cy="110" r="7" fill="#D4AF37"/>
  <text x="40" y="98" font-size="12" fill="#374151" text-anchor="middle">Start</text>
  <text x="720" y="98" font-size="12" fill="#374151" text-anchor="end">Review &amp; continue</text>
</svg>
