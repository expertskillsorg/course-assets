<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Clean Compliance File</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">One folder per deal, organized so a reviewer finds everything fast</text>

  <!-- Root folder -->
  <rect x="270" y="76" width="180" height="44" rx="6" fill="#1E2A8E"/>
  <text x="360" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">123 Oak St file</text>

  <!-- connector down -->
  <line x1="360" y1="120" x2="360" y2="150" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="150" x2="610" y2="150" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="150" x2="110" y2="172" stroke="#374151" stroke-width="2"/>
  <line x1="285" y1="150" x2="285" y2="172" stroke="#374151" stroke-width="2"/>
  <line x1="460" y1="150" x2="460" y2="172" stroke="#374151" stroke-width="2"/>
  <line x1="610" y1="150" x2="610" y2="172" stroke="#374151" stroke-width="2"/>

  <!-- Column 1: Contract -->
  <rect x="30" y="172" width="160" height="36" rx="5" fill="#D4AF37"/>
  <text x="110" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">1. Contract</text>
  <g font-size="11.5" fill="#111827">
    <rect x="30" y="216" width="160" height="120" rx="5" fill="#F7F4E9" stroke="#E5E7EB"/>
    <text x="42" y="238">Purchase agreement</text>
    <text x="42" y="262">All addenda</text>
    <text x="42" y="286">Amendments</text>
    <text x="42" y="310">Counteroffers</text>
    <text x="42" y="328" font-size="10.5" fill="#374151">(fully executed)</text>
  </g>

  <!-- Column 2: Disclosures -->
  <rect x="205" y="172" width="160" height="36" rx="5" fill="#3E9B6B"/>
  <text x="285" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2. Disclosures</text>
  <g font-size="11.5" fill="#111827">
    <rect x="205" y="216" width="160" height="120" rx="5" fill="#EAF5EF" stroke="#E5E7EB"/>
    <text x="217" y="238">Seller disclosures</text>
    <text x="217" y="262">Lead-based paint</text>
    <text x="217" y="286">Agency disclosures</text>
    <text x="217" y="310">Acknowledgments</text>
    <text x="217" y="328" font-size="10.5" fill="#374151">(signed + dated)</text>
  </g>

  <!-- Column 3: Money -->
  <rect x="380" y="172" width="160" height="36" rx="5" fill="#C4683A"/>
  <text x="460" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3. Money</text>
  <g font-size="11.5" fill="#111827">
    <rect x="380" y="216" width="160" height="120" rx="5" fill="#F8EDE6" stroke="#E5E7EB"/>
    <text x="392" y="238">Earnest money proof</text>
    <text x="392" y="262">Escrow receipt</text>
    <text x="392" y="286">Loan status / approval</text>
    <text x="392" y="310">Title docs</text>
  </g>

  <!-- Column 4: Other -->
  <rect x="555" y="172" width="160" height="36" rx="5" fill="#1E2A8E"/>
  <text x="635" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4. Records</text>
  <g font-size="11.5" fill="#111827">
    <rect x="555" y="216" width="160" height="120" rx="5" fill="#ECEEF8" stroke="#E5E7EB"/>
    <text x="567" y="238">Critical-date sheet</text>
    <text x="567" y="262">Contingency removals</text>
    <text x="567" y="286">Inspection reports</text>
    <text x="567" y="310">Communication log</text>
  </g>

  <!-- bottom rule banner -->
  <rect x="30" y="372" width="660" height="112" rx="8" fill="#141B5C"/>
  <text x="360" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#D4AF37">The rule for every document in the folder</text>
  <g font-size="12.5" fill="#FFFFFF">
    <text x="360" y="430" text-anchor="middle">Final version only. Fully executed. Clearly named with a date.</text>
    <text x="360" y="454" text-anchor="middle">Delivery and acknowledgment tracked. No duplicates, no drafts.</text>
  </g>
</svg>
