<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Problem to First Move</text>

  <!-- Problem node -->
  <rect x="280" y="56" width="200" height="56" rx="10" fill="#C4683A"/>
  <text x="380" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">A problem hits the file</text>
  <text x="380" y="100" text-anchor="middle" font-size="11" fill="#FFFFFF">late loan, low appraisal, etc.</text>

  <!-- connector down -->
  <line x1="380" y1="112" x2="380" y2="140" stroke="#374151" stroke-width="2"/>
  <polygon points="380,148 374,138 386,138" fill="#374151"/>

  <!-- Step 1 -->
  <rect x="60" y="160" width="300" height="48" rx="8" fill="#1E2A8E"/>
  <text x="78" y="190" font-size="14" font-weight="bold" fill="#FFFFFF">1. Document it</text>
  <text x="200" y="190" font-size="11" fill="#D4AF37">what, when, where you learned it</text>

  <line x1="210" y1="208" x2="210" y2="226" stroke="#374151" stroke-width="2"/>
  <polygon points="210,234 204,224 216,224" fill="#374151"/>

  <!-- Step 2 -->
  <rect x="60" y="246" width="300" height="48" rx="8" fill="#1E2A8E"/>
  <text x="78" y="276" font-size="14" font-weight="bold" fill="#FFFFFF">2. Notify the agent</text>
  <text x="220" y="276" font-size="11" fill="#D4AF37">clear, plain message</text>

  <line x1="210" y1="294" x2="210" y2="312" stroke="#374151" stroke-width="2"/>
  <polygon points="210,320 204,310 216,310" fill="#374151"/>

  <!-- Step 3 -->
  <rect x="60" y="332" width="300" height="48" rx="8" fill="#1E2A8E"/>
  <text x="78" y="362" font-size="14" font-weight="bold" fill="#FFFFFF">3. Update the timeline</text>
  <text x="240" y="362" font-size="11" fill="#D4AF37">fix affected dates</text>

  <line x1="210" y1="380" x2="210" y2="398" stroke="#374151" stroke-width="2"/>
  <polygon points="210,406 204,396 216,396" fill="#374151"/>

  <!-- Step 4 -->
  <rect x="60" y="412" width="300" height="40" rx="8" fill="#3E9B6B"/>
  <text x="78" y="437" font-size="14" font-weight="bold" fill="#FFFFFF">4. Propose logistics options</text>

  <!-- Agent lane -->
  <rect x="430" y="160" width="270" height="292" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <text x="565" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">The agent's lane</text>
  <line x1="450" y1="200" x2="680" y2="200" stroke="#E5E7EB" stroke-width="1"/>
  <text x="450" y="226" font-size="12" fill="#374151">Advises the client</text>
  <text x="450" y="252" font-size="12" fill="#374151">Negotiates price and terms</text>
  <text x="450" y="278" font-size="12" fill="#374151">Decides whether to proceed</text>

  <text x="450" y="332" font-size="12" font-weight="bold" fill="#C4683A">Your lane stops here.</text>
  <text x="450" y="356" font-size="12" fill="#374151">You arrange and prepare.</text>
  <text x="450" y="378" font-size="12" fill="#374151">You never give an opinion</text>
  <text x="450" y="396" font-size="12" fill="#374151">on price, terms, or whether</text>
  <text x="450" y="414" font-size="12" fill="#374151">to walk away.</text>

  <!-- arrow from step 2 to agent lane -->
  <line x1="360" y1="270" x2="428" y2="270" stroke="#D4AF37" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="436,270 426,264 426,276" fill="#D4AF37"/>
</svg>
