<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="820" height="360" fill="#FFFFFF"/>
  <text x="410" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Transaction Lifecycle</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#374151">From accepted offer to recorded sale, left to right</text>

  <!-- baseline track -->
  <line x1="60" y1="150" x2="760" y2="150" stroke="#E5E7EB" stroke-width="4"/>

  <!-- stage 1 -->
  <circle cx="90" cy="150" r="14" fill="#3E9B6B"/>
  <text x="90" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <rect x="20" y="180" width="140" height="86" rx="8" fill="#1E2A8E"/>
  <text x="90" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Accepted</text>
  <text x="90" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">offer</text>
  <text x="90" y="248" text-anchor="middle" font-size="10" fill="#D4AF37">anchors all dates</text>

  <!-- stage 2 -->
  <circle cx="225" cy="150" r="14" fill="#3E9B6B"/>
  <text x="225" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <rect x="155" y="180" width="140" height="86" rx="8" fill="#1E2A8E"/>
  <text x="225" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Open</text>
  <text x="225" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">escrow</text>
  <text x="225" y="248" text-anchor="middle" font-size="10" fill="#E5E7EB">deposit + file opens</text>

  <!-- stage 3 -->
  <circle cx="360" cy="150" r="14" fill="#3E9B6B"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
  <rect x="290" y="80" width="140" height="86" rx="8" fill="#C4683A"/>
  <text x="360" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Inspections</text>
  <text x="360" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">+ due diligence</text>
  <text x="360" y="148" text-anchor="middle" font-size="10" fill="#FFE9DC">disclosures, title</text>

  <!-- stage 4 -->
  <circle cx="495" cy="150" r="14" fill="#3E9B6B"/>
  <text x="495" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
  <rect x="425" y="180" width="140" height="86" rx="8" fill="#C4683A"/>
  <text x="495" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Appraisal</text>
  <text x="495" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">+ loan approval</text>
  <text x="495" y="248" text-anchor="middle" font-size="10" fill="#FFE9DC">drives the date</text>

  <!-- stage 5 -->
  <circle cx="630" cy="150" r="14" fill="#3E9B6B"/>
  <text x="630" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>
  <rect x="560" y="80" width="140" height="86" rx="8" fill="#1E2A8E"/>
  <text x="630" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Clear</text>
  <text x="630" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">to close</text>
  <text x="630" y="148" text-anchor="middle" font-size="10" fill="#D4AF37">lender's green light</text>

  <!-- stage 6 -->
  <circle cx="765" cy="150" r="14" fill="#D4AF37"/>
  <text x="765" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">6</text>
  <rect x="690" y="180" width="120" height="86" rx="8" fill="#141B5C"/>
  <text x="750" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Sign, fund,</text>
  <text x="750" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">record</text>
  <text x="750" y="246" text-anchor="middle" font-size="10" fill="#D4AF37">keys change hands</text>

  <text x="410" y="320" text-anchor="middle" font-size="12" fill="#374151">Stages overlap in practice: the loan often works while inspections are still running.</text>
</svg>
