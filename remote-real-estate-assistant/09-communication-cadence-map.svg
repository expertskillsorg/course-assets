<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Communication Cadence Map</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Who gets updated, with what, and when</text>

  <!-- connector lines (drawn first, behind nodes) -->
  <line x1="380" y1="260" x2="180" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="260" x2="580" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="260" x2="180" y2="380" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="260" x2="580" y2="380" stroke="#E5E7EB" stroke-width="2"/>

  <!-- center: transaction file -->
  <circle cx="380" cy="260" r="62" fill="#1E2A8E"/>
  <text x="380" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">The File</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#D4AF37">one source</text>
  <text x="380" y="287" text-anchor="middle" font-size="11" fill="#D4AF37">of truth</text>

  <!-- Agent (top-left) -->
  <rect x="36" y="92" width="230" height="116" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="36" y="92" width="230" height="28" rx="10" fill="#1E2A8E"/>
  <text x="151" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">The Agent</text>
  <text x="50" y="140" font-size="12" fill="#111827">What: done / next / problems</text>
  <text x="50" y="160" font-size="12" fill="#374151">Channel: text or email</text>
  <text x="50" y="180" font-size="12" fill="#3E9B6B" font-weight="bold">When: weekly + risk flags</text>

  <!-- Clients (top-right) -->
  <rect x="494" y="92" width="230" height="116" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="494" y="92" width="230" height="28" rx="10" fill="#3E9B6B"/>
  <text x="609" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">The Clients</text>
  <text x="508" y="140" font-size="12" fill="#111827">What: reassurance + tasks</text>
  <text x="508" y="160" font-size="12" fill="#374151">Channel: email, plain words</text>
  <text x="508" y="180" font-size="12" fill="#3E9B6B" font-weight="bold">When: weekly + milestones</text>

  <!-- Escrow & Title (bottom-left) -->
  <rect x="36" y="322" width="230" height="116" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <rect x="36" y="322" width="230" height="28" rx="10" fill="#D4AF37"/>
  <text x="151" y="341" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Escrow &amp; Title</text>
  <text x="50" y="370" font-size="12" fill="#111827">What: documents + confirms</text>
  <text x="50" y="390" font-size="12" fill="#374151">Channel: email (on record)</text>
  <text x="50" y="410" font-size="12" fill="#C4683A" font-weight="bold">When: tied to deadlines</text>

  <!-- Lender (bottom-right) -->
  <rect x="494" y="322" width="230" height="116" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <rect x="494" y="322" width="230" height="28" rx="10" fill="#C4683A"/>
  <text x="609" y="341" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">The Lender</text>
  <text x="508" y="370" font-size="12" fill="#111827">What: loan milestones</text>
  <text x="508" y="390" font-size="12" fill="#374151">Channel: email, agent looped</text>
  <text x="508" y="410" font-size="12" fill="#C4683A" font-weight="bold">When: tied to loan steps</text>

  <!-- footer band -->
  <rect x="180" y="470" width="400" height="34" rx="8" fill="#141B5C"/>
  <text x="380" y="492" text-anchor="middle" font-size="13" fill="#FFFFFF">Every update: what's done, what's next, what's needed by when</text>
</svg>
