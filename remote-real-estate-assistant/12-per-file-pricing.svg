<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Per-File Pricing Model</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Fee, timing, and package tiers (example numbers, not promises)</text>

  <!-- Fee block -->
  <rect x="40" y="84" width="200" height="120" rx="10" fill="#1E2A8E"/>
  <text x="140" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">THE FEE</text>
  <text x="140" y="150" text-anchor="middle" font-size="30" font-weight="bold" fill="#D4AF37">$350-$500</text>
  <text x="140" y="174" text-anchor="middle" font-size="12" fill="#E5E7EB">flat, per closed file</text>
  <text x="140" y="192" text-anchor="middle" font-size="12" fill="#E5E7EB">one price, one deal</text>

  <!-- Timing block -->
  <rect x="260" y="84" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">WHEN YOU GET PAID</text>
  <circle cx="290" cy="142" r="6" fill="#3E9B6B"/>
  <text x="305" y="147" font-size="13" fill="#111827">At close (most common)</text>
  <circle cx="290" cy="170" r="6" fill="#C4683A"/>
  <text x="305" y="175" font-size="13" fill="#111827">Part upfront, rest at close</text>
  <text x="290" y="196" font-size="11" fill="#374151" font-style="italic">Charge a smaller fee if a file cancels.</text>

  <!-- Add-ons block -->
  <rect x="480" y="84" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="580" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">ADD-ONS</text>
  <text x="500" y="142" font-size="12" fill="#111827">+ Rush / short escrow</text>
  <text x="500" y="166" font-size="12" fill="#111827">+ Listing-side coordination</text>
  <text x="500" y="190" font-size="12" fill="#111827">+ Extra parties or HOA</text>

  <!-- Package tiers header -->
  <text x="360" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Package Tiers</text>

  <!-- Basic -->
  <rect x="40" y="262" width="200" height="160" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="40" y="262" width="200" height="34" rx="10" fill="#374151"/>
  <text x="140" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Basic</text>
  <text x="140" y="320" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2A8E">$350</text>
  <text x="140" y="348" text-anchor="middle" font-size="11" fill="#374151">Contract to close</text>
  <text x="140" y="368" text-anchor="middle" font-size="11" fill="#374151">Timeline + deadlines</text>
  <text x="140" y="388" text-anchor="middle" font-size="11" fill="#374151">Signatures + docs</text>
  <text x="140" y="408" text-anchor="middle" font-size="11" fill="#374151">Compliance file</text>

  <!-- Standard -->
  <rect x="260" y="252" width="200" height="170" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="260" y="252" width="200" height="34" rx="10" fill="#1E2A8E"/>
  <text x="360" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Standard</text>
  <text x="360" y="310" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2A8E">$450</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#374151">Everything in Basic</text>
  <text x="360" y="358" text-anchor="middle" font-size="11" fill="#374151">+ Party communication</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#374151">+ Status updates</text>
  <text x="360" y="398" text-anchor="middle" font-size="11" fill="#374151">+ Escrow/title liaison</text>
  <text x="360" y="416" text-anchor="middle" font-size="10" fill="#3E9B6B" font-weight="bold">most popular</text>

  <!-- Premium -->
  <rect x="480" y="262" width="200" height="160" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="480" y="262" width="200" height="34" rx="10" fill="#3E9B6B"/>
  <text x="580" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Premium</text>
  <text x="580" y="320" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E2A8E">$550+</text>
  <text x="580" y="348" text-anchor="middle" font-size="11" fill="#374151">Everything in Standard</text>
  <text x="580" y="368" text-anchor="middle" font-size="11" fill="#374151">+ Rush handling</text>
  <text x="580" y="388" text-anchor="middle" font-size="11" fill="#374151">+ Listing-side work</text>
  <text x="580" y="408" text-anchor="middle" font-size="11" fill="#374151">+ Priority response</text>
</svg>
