<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#141B5C">From contract clauses to a dated timeline</text>
  <text x="30" y="64" font-size="14" fill="#374151">The words in the purchase agreement become deadlines on a calendar.</text>

  <!-- Left column header -->
  <text x="30" y="104" font-size="15" font-weight="bold" fill="#1E2A8E">Contract clause</text>
  <!-- Right column header -->
  <text x="500" y="104" font-size="15" font-weight="bold" fill="#1E2A8E">Becomes a dated deadline</text>

  <!-- Vertical timeline spine -->
  <line x1="470" y1="120" x2="470" y2="430" stroke="#D4AF37" stroke-width="4"/>

  <!-- Row template: clause box left, dot on spine, date label right -->
  <!-- Row 1 Effective date -->
  <rect x="30" y="120" width="280" height="38" rx="6" fill="#1E2A8E"/>
  <text x="44" y="144" font-size="14" fill="#FFFFFF">"...binding when last party signs"</text>
  <circle cx="470" cy="139" r="8" fill="#3E9B6B"/>
  <line x1="310" y1="139" x2="462" y2="139" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="135" font-size="14" font-weight="bold" fill="#111827">Effective date</text>
  <text x="486" y="151" font-size="12" fill="#374151">Day 0 (counting starts)</text>

  <!-- Row 2 Deposit due -->
  <rect x="30" y="166" width="280" height="38" rx="6" fill="#141B5C"/>
  <text x="44" y="190" font-size="14" fill="#FFFFFF">"deposit within 3 days"</text>
  <circle cx="470" cy="185" r="8" fill="#C4683A"/>
  <line x1="310" y1="185" x2="462" y2="185" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="181" font-size="14" font-weight="bold" fill="#111827">Deposit due</text>
  <text x="486" y="197" font-size="12" fill="#374151">Earnest money delivered</text>

  <!-- Row 3 Inspection -->
  <rect x="30" y="212" width="280" height="38" rx="6" fill="#1E2A8E"/>
  <text x="44" y="236" font-size="14" fill="#FFFFFF">"inspection within 10 days"</text>
  <circle cx="470" cy="231" r="8" fill="#C4683A"/>
  <line x1="310" y1="231" x2="462" y2="231" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="227" font-size="14" font-weight="bold" fill="#111827">Inspection deadline</text>
  <text x="486" y="243" font-size="12" fill="#374151">By 5pm (shifts off weekends)</text>

  <!-- Row 4 Appraisal & loan -->
  <rect x="30" y="258" width="280" height="38" rx="6" fill="#141B5C"/>
  <text x="44" y="282" font-size="14" fill="#FFFFFF">"appraisal &amp; loan by day 21"</text>
  <circle cx="470" cy="277" r="8" fill="#C4683A"/>
  <line x1="310" y1="277" x2="462" y2="277" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="273" font-size="14" font-weight="bold" fill="#111827">Appraisal &amp; loan</text>
  <text x="486" y="289" font-size="12" fill="#374151">Financing milestones</text>

  <!-- Row 5 Contingency removal -->
  <rect x="30" y="304" width="280" height="38" rx="6" fill="#1E2A8E"/>
  <text x="44" y="328" font-size="14" fill="#FFFFFF">"remove contingencies by day 25"</text>
  <circle cx="470" cy="323" r="8" fill="#C4683A"/>
  <line x1="310" y1="323" x2="462" y2="323" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="319" font-size="14" font-weight="bold" fill="#111827">Contingency removal</text>
  <text x="486" y="335" font-size="12" fill="#374151">Buyer commits to proceed</text>

  <!-- Row 6 Walkthrough -->
  <rect x="30" y="350" width="280" height="38" rx="6" fill="#141B5C"/>
  <text x="44" y="374" font-size="14" fill="#FFFFFF">"walkthrough before closing"</text>
  <circle cx="470" cy="369" r="8" fill="#C4683A"/>
  <line x1="310" y1="369" x2="462" y2="369" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="365" font-size="14" font-weight="bold" fill="#111827">Final walkthrough</text>
  <text x="486" y="381" font-size="12" fill="#374151">Buyer's last look</text>

  <!-- Row 7 Closing -->
  <rect x="30" y="396" width="280" height="38" rx="6" fill="#3E9B6B"/>
  <text x="44" y="420" font-size="14" fill="#FFFFFF">"closing on day 35"</text>
  <circle cx="470" cy="415" r="9" fill="#3E9B6B" stroke="#141B5C" stroke-width="2"/>
  <line x1="310" y1="415" x2="461" y2="415" stroke="#E5E7EB" stroke-width="2"/>
  <text x="486" y="411" font-size="14" font-weight="bold" fill="#111827">Closing</text>
  <text x="486" y="427" font-size="12" fill="#374151">Ownership transfers</text>
</svg>
