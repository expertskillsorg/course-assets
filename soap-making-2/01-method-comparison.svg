<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Three Ways to Make Soap</text>

  <!-- Cold Process -->
  <g>
    <rect x="24" y="56" width="212" height="276" rx="12" fill="#ffffff" stroke="#1E2A8E" stroke-width="2.5"/>
    <rect x="24" y="56" width="212" height="44" rx="12" fill="#1E2A8E"/>
    <rect x="24" y="80" width="212" height="20" fill="#1E2A8E"/>
    <text x="130" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Cold Process</text>
    <text x="44" y="132" font-size="12" fill="#374151">Handle lye: yes</text>
    <text x="44" y="158" font-size="12" fill="#374151">No cooking</text>
    <text x="44" y="184" font-size="12" fill="#374151">Ready: 4 to 6 wk cure</text>
    <text x="44" y="210" font-size="12" fill="#374151">Look: smooth, clean</text>
    <text x="44" y="236" font-size="12" fill="#374151">Control: full</text>
    <text x="44" y="262" font-size="12" fill="#374151">Design: best swirls</text>
    <text x="130" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">This course's focus</text>
    <text x="130" y="320" text-anchor="middle" font-size="11" fill="#374151">Best craft to learn</text>
  </g>

  <!-- Hot Process -->
  <g>
    <rect x="254" y="56" width="212" height="276" rx="12" fill="#ffffff" stroke="#C4683A" stroke-width="2.5"/>
    <rect x="254" y="56" width="212" height="44" rx="12" fill="#C4683A"/>
    <rect x="254" y="80" width="212" height="20" fill="#C4683A"/>
    <text x="360" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Hot Process</text>
    <text x="274" y="132" font-size="12" fill="#374151">Handle lye: yes</text>
    <text x="274" y="158" font-size="12" fill="#374151">Cooked with heat</text>
    <text x="274" y="184" font-size="12" fill="#374151">Ready: days, short cure</text>
    <text x="274" y="210" font-size="12" fill="#374151">Look: rustic, textured</text>
    <text x="274" y="236" font-size="12" fill="#374151">Control: full</text>
    <text x="274" y="262" font-size="12" fill="#374151">Design: limited swirls</text>
    <text x="360" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">Faster to use</text>
    <text x="360" y="320" text-anchor="middle" font-size="11" fill="#374151">Same skills, sooner</text>
  </g>

  <!-- Melt & Pour -->
  <g>
    <rect x="484" y="56" width="212" height="276" rx="12" fill="#ffffff" stroke="#3E9B6B" stroke-width="2.5"/>
    <rect x="484" y="56" width="212" height="44" rx="12" fill="#3E9B6B"/>
    <rect x="484" y="80" width="212" height="20" fill="#3E9B6B"/>
    <text x="590" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Melt &amp; Pour</text>
    <text x="504" y="132" font-size="12" fill="#374151">Handle lye: no</text>
    <text x="504" y="158" font-size="12" fill="#374151">Melt a ready base</text>
    <text x="504" y="184" font-size="12" fill="#374151">Ready: same day</text>
    <text x="504" y="210" font-size="12" fill="#374151">Look: can be clear</text>
    <text x="504" y="236" font-size="12" fill="#374151">Control: limited</text>
    <text x="504" y="262" font-size="12" fill="#374151">Design: embeds, layers</text>
    <text x="590" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">Easiest start</text>
    <text x="590" y="320" text-anchor="middle" font-size="11" fill="#374151">No raw lye at all</text>
  </g>
</svg>
