<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The Saponification Reaction</text>

  <!-- Reactants -->
  <g>
    <rect x="30" y="80" width="120" height="64" rx="10" fill="#3E9B6B"/>
    <text x="90" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Oils / Fats</text>
    <text x="90" y="130" text-anchor="middle" font-size="11" fill="#ffffff">(triglycerides)</text>
  </g>
  <text x="172" y="120" text-anchor="middle" font-size="26" font-weight="bold" fill="#374151">+</text>
  <g>
    <rect x="194" y="80" width="120" height="64" rx="10" fill="#C4683A"/>
    <text x="254" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Lye</text>
    <text x="254" y="130" text-anchor="middle" font-size="11" fill="#ffffff">(an alkali)</text>
  </g>
  <text x="336" y="120" text-anchor="middle" font-size="26" font-weight="bold" fill="#374151">+</text>
  <g>
    <rect x="358" y="80" width="120" height="64" rx="10" fill="#1E2A8E"/>
    <text x="418" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Water</text>
    <text x="418" y="130" text-anchor="middle" font-size="11" fill="#ffffff">(dissolves lye)</text>
  </g>

  <!-- Arrow -->
  <g>
    <line x1="498" y1="112" x2="566" y2="112" stroke="#D4AF37" stroke-width="4"/>
    <polygon points="566,104 584,112 566,120" fill="#D4AF37"/>
    <text x="540" y="100" text-anchor="middle" font-size="11" fill="#374151">reacts into</text>
  </g>

  <!-- Products -->
  <g>
    <rect x="596" y="58" width="104" height="50" rx="10" fill="#141B5C"/>
    <text x="648" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Soap</text>
    <text x="648" y="97" text-anchor="middle" font-size="10" fill="#ffffff">(fatty-acid salt)</text>
  </g>
  <text x="648" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#374151">+</text>
  <g>
    <rect x="596" y="138" width="104" height="50" rx="10" fill="#3E9B6B"/>
    <text x="648" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Glycerin</text>
    <text x="648" y="177" text-anchor="middle" font-size="10" fill="#ffffff">(natural moisturizer)</text>
  </g>

  <!-- Note bar -->
  <rect x="30" y="220" width="660" height="56" rx="10" fill="#E5E7EB"/>
  <text x="360" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">The lye is used up in the reaction.</text>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="#374151">A properly made, cured bar contains no leftover lye. The reaction also gives off heat.</text>
</svg>
