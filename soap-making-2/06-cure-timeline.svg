<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How a Bar Changes Over the Cure</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Water leaves, the bar hardens, and it mellows over four to six weeks</text>

  <!-- baseline / timeline axis -->
  <line x1="70" y1="300" x2="660" y2="300" stroke="#374151" stroke-width="2"/>
  <polygon points="660,300 650,295 650,305" fill="#374151"/>
  <text x="668" y="304" font-size="11" fill="#374151">time</text>

  <!-- water-loss curve (descending), green -->
  <path d="M90,110 C200,140 300,225 420,250 C500,266 580,272 640,274" fill="none" stroke="#3E9B6B" stroke-width="3.5"/>
  <circle cx="90" cy="110" r="5" fill="#3E9B6B"/>
  <circle cx="255" cy="190" r="5" fill="#3E9B6B"/>
  <circle cx="420" cy="250" r="5" fill="#3E9B6B"/>
  <circle cx="585" cy="272" r="5" fill="#3E9B6B"/>
  <text x="120" y="98" font-size="12" fill="#3E9B6B" font-weight="bold">Water content / weight</text>

  <!-- hardness curve (ascending), gold -->
  <path d="M90,278 C200,250 300,180 420,135 C500,118 580,110 640,107" fill="none" stroke="#D4AF37" stroke-width="3.5"/>
  <circle cx="90" cy="278" r="5" fill="#D4AF37"/>
  <circle cx="255" cy="218" r="5" fill="#D4AF37"/>
  <circle cx="420" cy="135" r="5" fill="#D4AF37"/>
  <circle cx="585" cy="109" r="5" fill="#D4AF37"/>
  <text x="500" y="96" font-size="12" fill="#C4683A" font-weight="bold">Hardness / mildness</text>

  <!-- week markers -->
  <g font-size="12" fill="#111827" text-anchor="middle">
    <line x1="90" y1="296" x2="90" y2="304" stroke="#374151" stroke-width="2"/>
    <text x="90" y="322">Week 0</text>
    <text x="90" y="338" font-size="10" fill="#374151">soft, high water</text>

    <line x1="255" y1="296" x2="255" y2="304" stroke="#374151" stroke-width="2"/>
    <text x="255" y="322">Week 2</text>
    <text x="255" y="338" font-size="10" fill="#374151">most water gone</text>

    <line x1="420" y1="296" x2="420" y2="304" stroke="#374151" stroke-width="2"/>
    <text x="420" y="322">Week 4</text>
    <text x="420" y="338" font-size="10" fill="#374151">genuinely ready</text>

    <line x1="585" y1="296" x2="585" y2="304" stroke="#374151" stroke-width="2"/>
    <text x="585" y="322">Week 6</text>
    <text x="585" y="338" font-size="10" fill="#374151">better still</text>
  </g>

  <!-- ready band -->
  <rect x="420" y="70" width="240" height="218" fill="#3E9B6B" opacity="0.07"/>
  <line x1="420" y1="70" x2="420" y2="288" stroke="#3E9B6B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="540" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">Ready to use (4 to 6 weeks)</text>
</svg>
