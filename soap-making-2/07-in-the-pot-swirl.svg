<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, sans-serif">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The In-the-Pot Ocean Swirl</text>

  <!-- Stage 1: split -->
  <text x="90" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">1. Split the batter</text>
  <rect x="40" y="80" width="44" height="90" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="46" y="120" width="32" height="44" rx="3" fill="#E5E7EB"/>
  <text x="62" y="186" text-anchor="middle" font-size="10" fill="#374151">white</text>
  <rect x="98" y="80" width="44" height="90" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="104" y="120" width="32" height="44" rx="3" fill="#1E2A8E"/>
  <text x="120" y="186" text-anchor="middle" font-size="10" fill="#374151">blue</text>

  <path d="M158 125 h28" stroke="#D4AF37" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Stage 2: layer back -->
  <text x="262" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">2. Layer blue back in</text>
  <rect x="222" y="80" width="80" height="90" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="228" y="98" width="68" height="66" rx="3" fill="#E5E7EB"/>
  <ellipse cx="248" cy="120" rx="11" ry="9" fill="#1E2A8E"/>
  <ellipse cx="278" cy="138" rx="12" ry="9" fill="#1E2A8E"/>
  <ellipse cx="252" cy="152" rx="9" ry="7" fill="#1E2A8E"/>

  <path d="M318 125 h28" stroke="#D4AF37" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Stage 3: pour into mold -->
  <text x="430" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">3. Pour into the mold</text>
  <rect x="384" y="110" width="92" height="60" rx="4" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <rect x="390" y="116" width="80" height="48" fill="#3E9B6B" opacity="0.15"/>
  <path d="M392 124 q20 8 40 0 t40 0" stroke="#1E2A8E" stroke-width="6" fill="none" opacity="0.85"/>
  <path d="M392 140 q20 -8 40 0 t40 0" stroke="#1E2A8E" stroke-width="6" fill="none" opacity="0.85"/>
  <path d="M392 154 q20 8 40 0 t40 0" stroke="#1E2A8E" stroke-width="6" fill="none" opacity="0.85"/>
  <!-- pour stream -->
  <path d="M430 80 v26" stroke="#C4683A" stroke-width="5" fill="none"/>

  <path d="M492 140 h28" stroke="#D4AF37" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Stage 4: swirl top -->
  <text x="610" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">4. Swirl in S-curves</text>
  <rect x="558" y="110" width="104" height="60" rx="4" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <path d="M566 140 q14 -22 28 0 t28 0 t28 0" stroke="#1E2A8E" stroke-width="7" fill="none"/>
  <path d="M566 152 q14 -18 28 0 t28 0 t28 0" stroke="#ffffff" stroke-width="4" fill="none"/>
  <!-- skewer -->
  <line x1="648" y1="92" x2="612" y2="150" stroke="#C4683A" stroke-width="3"/>
  <circle cx="650" cy="90" r="4" fill="#C4683A"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D4AF37"/>
    </marker>
  </defs>
</svg>
