<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Three Starter Oils, Three Strengths</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Score out of 5 for each quality</text>

  <!-- Axes -->
  <line x1="90" y1="320" x2="600" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Gridlines + scale labels -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="90" y1="274" x2="600" y2="274"/>
    <line x1="90" y1="228" x2="600" y2="228"/>
    <line x1="90" y1="182" x2="600" y2="182"/>
    <line x1="90" y1="136" x2="600" y2="136"/>
    <line x1="90" y1="90" x2="600" y2="90"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="end">
    <text x="82" y="324">0</text>
    <text x="82" y="278">1</text>
    <text x="82" y="232">2</text>
    <text x="82" y="186">3</text>
    <text x="82" y="140">4</text>
    <text x="82" y="94">5</text>
  </g>

  <!-- Group: Hardness (x ~ 150) Cleansing (x ~ 320) Conditioning (x ~ 490) -->
  <!-- Each cluster: Olive (navy), Coconut (gold), Palm (terracotta) -->
  <!-- bar width 34, scale: 46px per unit -->

  <!-- HARDNESS cluster -->
  <!-- Olive 2 -> 92, Coconut 4 -> 184, Palm 5 -> 230 -->
  <rect x="120" y="228" width="34" height="92" fill="#1E2A8E"/>
  <rect x="156" y="136" width="34" height="184" fill="#D4AF37"/>
  <rect x="192" y="90" width="34" height="230" fill="#C4683A"/>
  <text x="173" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Hardness</text>

  <!-- CLEANSING cluster -->
  <!-- Olive 1 -> 46, Coconut 5 -> 230, Palm 2 -> 92 -->
  <rect x="290" y="274" width="34" height="46" fill="#1E2A8E"/>
  <rect x="326" y="90" width="34" height="230" fill="#D4AF37"/>
  <rect x="362" y="228" width="34" height="92" fill="#C4683A"/>
  <text x="343" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Cleansing</text>

  <!-- CONDITIONING cluster -->
  <!-- Olive 5 -> 230, Coconut 1 -> 46, Palm 2 -> 92 -->
  <rect x="460" y="90" width="34" height="230" fill="#1E2A8E"/>
  <rect x="496" y="274" width="34" height="46" fill="#D4AF37"/>
  <rect x="532" y="228" width="34" height="92" fill="#C4683A"/>
  <text x="513" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Conditioning</text>

  <!-- Legend -->
  <g font-size="13" fill="#111827">
    <rect x="150" y="366" width="16" height="16" fill="#1E2A8E"/>
    <text x="172" y="379">Olive</text>
    <rect x="252" y="366" width="16" height="16" fill="#D4AF37"/>
    <text x="274" y="379">Coconut</text>
    <rect x="380" y="366" width="16" height="16" fill="#C4683A"/>
    <text x="402" y="379">Palm</text>
  </g>
</svg>
