<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Symptom to Likely Cause</text>
  <text x="150" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">What you see</text>
  <text x="490" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Most likely cause</text>

  <!-- Row 1 -->
  <rect x="24" y="80" width="252" height="62" rx="8" fill="#FDF6E3" stroke="#D4AF37" stroke-width="2"/>
  <text x="40" y="106" font-size="14" font-weight="bold" fill="#111827">Batter seized or thickened fast</text>
  <text x="40" y="126" font-size="12" fill="#374151">Lumpy, set before you could pour</text>
  <line x1="276" y1="111" x2="364" y2="111" stroke="#1E2A8E" stroke-width="2.5"/>
  <polygon points="364,111 354,106 354,116" fill="#1E2A8E"/>
  <rect x="364" y="80" width="252" height="62" rx="8" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="2"/>
  <text x="380" y="108" font-size="14" font-weight="bold" fill="#1E2A8E">Trace problem</text>
  <text x="380" y="128" font-size="12" fill="#374151">Fast fragrance or soaping too hot</text>

  <!-- Row 2 -->
  <rect x="24" y="156" width="252" height="62" rx="8" fill="#FBEDE6" stroke="#C4683A" stroke-width="2"/>
  <text x="40" y="182" font-size="14" font-weight="bold" fill="#111827">Cracked top or volcano</text>
  <text x="40" y="202" font-size="12" fill="#374151">Wet "alien brain" center</text>
  <line x1="276" y1="187" x2="364" y2="187" stroke="#C4683A" stroke-width="2.5"/>
  <polygon points="364,187 354,182 354,192" fill="#C4683A"/>
  <rect x="364" y="156" width="252" height="62" rx="8" fill="#FBEDE6" stroke="#C4683A" stroke-width="2"/>
  <text x="380" y="184" font-size="14" font-weight="bold" fill="#C4683A">Overheating problem</text>
  <text x="380" y="204" font-size="12" fill="#374151">Too much heat trapped in the mold</text>

  <!-- Row 3 -->
  <rect x="24" y="232" width="252" height="62" rx="8" fill="#FDF6E3" stroke="#D4AF37" stroke-width="2"/>
  <text x="40" y="258" font-size="14" font-weight="bold" fill="#111827">Soft, oily bar</text>
  <text x="40" y="278" font-size="12" fill="#374151">Greasy, will not firm up</text>
  <line x1="276" y1="263" x2="364" y2="263" stroke="#3E9B6B" stroke-width="2.5"/>
  <polygon points="364,263 354,258 354,268" fill="#3E9B6B"/>
  <rect x="364" y="232" width="252" height="62" rx="8" fill="#E9F4EE" stroke="#3E9B6B" stroke-width="2"/>
  <text x="380" y="260" font-size="14" font-weight="bold" fill="#3E9B6B">Lye balance: too little lye</text>
  <text x="380" y="280" font-size="12" fill="#374151">Too much oil, or needs more cure</text>

  <!-- Row 4 -->
  <rect x="24" y="308" width="252" height="62" rx="8" fill="#FBEDE6" stroke="#C4683A" stroke-width="2"/>
  <text x="40" y="334" font-size="14" font-weight="bold" fill="#111827">Crumbly, brittle bar</text>
  <text x="40" y="354" font-size="12" fill="#374151">Cracks apart when cut</text>
  <line x1="276" y1="339" x2="364" y2="339" stroke="#141B5C" stroke-width="2.5"/>
  <polygon points="364,339 354,334 354,344" fill="#141B5C"/>
  <rect x="364" y="308" width="252" height="62" rx="8" fill="#EEF1FB" stroke="#141B5C" stroke-width="2"/>
  <text x="380" y="336" font-size="14" font-weight="bold" fill="#141B5C">Lye balance: too much lye</text>
  <text x="380" y="356" font-size="12" fill="#374151">Test before use, may harm skin</text>

  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#374151">Most lye balance problems trace back to a measuring slip. Weigh everything; weigh the lye twice.</text>
</svg>
