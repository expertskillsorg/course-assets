<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Arial, sans-serif">
  <rect width="560" height="380" fill="#ffffff"/>
  <text x="280" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">What Builds the Cost of One Bar</text>
  <text x="280" y="56" text-anchor="middle" font-size="13" fill="#374151">Each cost layer stacks up to the floor your price must clear</text>

  <!-- Axis baseline -->
  <line x1="150" y1="330" x2="150" y2="90" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="150" y1="330" x2="430" y2="330" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Stacked cost bar: built bottom-up. Bar x=180 width=120 -->
  <!-- Ingredients (oils, lye, additives) ~75c -->
  <rect x="180" y="240" width="120" height="90" fill="#3E9B6B"/>
  <text x="240" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Ingredients</text>
  <text x="240" y="307" text-anchor="middle" font-size="11" fill="#ffffff">~$0.75</text>

  <!-- Packaging + label ~20c -->
  <rect x="180" y="210" width="120" height="30" fill="#D4AF37"/>
  <text x="240" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">Packaging + label ~$0.20</text>

  <!-- Labor (your time) ~15c -->
  <rect x="180" y="185" width="120" height="25" fill="#C4683A"/>
  <text x="240" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Labor ~$0.15</text>

  <!-- Overhead ~5c -->
  <rect x="180" y="168" width="120" height="17" fill="#1E2A8E"/>
  <text x="240" y="181" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Overhead ~$0.05</text>

  <!-- Total cost line -->
  <line x1="150" y1="168" x2="320" y2="168" stroke="#111827" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="326" y="172" font-size="12" font-weight="bold" fill="#111827">Total cost ~$1.15</text>

  <!-- Selling price marker -->
  <line x1="150" y1="110" x2="430" y2="110" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="326" y="106" font-size="13" font-weight="bold" fill="#1E2A8E">Selling price ~$5.00</text>

  <!-- Profit gap arrow -->
  <line x1="345" y1="166" x2="345" y2="112" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="345,110 341,118 349,118" fill="#3E9B6B"/>
  <polygon points="345,168 341,160 349,160" fill="#3E9B6B"/>
  <text x="356" y="142" font-size="12" font-weight="bold" fill="#3E9B6B">Your margin</text>

  <text x="240" y="352" text-anchor="middle" font-size="12" fill="#374151">Cost stack (one bar)</text>
</svg>
