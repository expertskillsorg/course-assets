<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Safe Soaping Setup</text>

  <!-- room outline -->
  <rect x="24" y="56" width="592" height="332" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>

  <!-- counter -->
  <rect x="48" y="250" width="540" height="22" fill="#374151"/>
  <rect x="48" y="272" width="540" height="80" fill="#E5E7EB"/>

  <!-- open window with airflow -->
  <rect x="440" y="84" width="130" height="100" fill="#ffffff" stroke="#1E2A8E" stroke-width="3"/>
  <line x1="505" y1="84" x2="505" y2="184" stroke="#1E2A8E" stroke-width="3"/>
  <line x1="440" y1="134" x2="570" y2="134" stroke="#1E2A8E" stroke-width="3"/>
  <path d="M455 200 q15 -18 30 0 q15 18 30 0" fill="none" stroke="#3E9B6B" stroke-width="3" stroke-linecap="round"/>
  <path d="M455 214 q15 -18 30 0 q15 18 30 0" fill="none" stroke="#3E9B6B" stroke-width="3" stroke-linecap="round"/>
  <text x="505" y="232" text-anchor="middle" font-size="12" fill="#3E9B6B" font-weight="bold">ventilation</text>

  <!-- soapmaker with gear -->
  <!-- head -->
  <circle cx="150" cy="150" r="26" fill="#C4683A"/>
  <!-- goggles -->
  <rect x="128" y="140" width="44" height="16" rx="6" fill="#1E2A8E"/>
  <circle cx="140" cy="148" r="5" fill="#D4AF37"/>
  <circle cx="160" cy="148" r="5" fill="#D4AF37"/>
  <!-- long sleeve body -->
  <rect x="122" y="178" width="56" height="74" rx="10" fill="#1E2A8E"/>
  <!-- sleeves / arms -->
  <rect x="100" y="186" width="22" height="58" rx="9" fill="#1E2A8E"/>
  <rect x="178" y="186" width="22" height="58" rx="9" fill="#1E2A8E"/>
  <!-- gloves -->
  <circle cx="111" cy="248" r="9" fill="#3E9B6B"/>
  <circle cx="189" cy="248" r="9" fill="#3E9B6B"/>
  <text x="150" y="362" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">goggles, gloves, long sleeves</text>

  <!-- dedicated tools on counter -->
  <!-- stainless pot -->
  <rect x="258" y="220" width="48" height="30" rx="4" fill="#374151"/>
  <rect x="252" y="216" width="60" height="8" rx="3" fill="#141B5C"/>
  <!-- plastic jug -->
  <rect x="324" y="212" width="30" height="38" rx="4" fill="#3E9B6B"/>
  <rect x="330" y="204" width="10" height="10" fill="#3E9B6B"/>
  <!-- spatula -->
  <rect x="372" y="206" width="6" height="44" rx="3" fill="#D4AF37"/>
  <rect x="368" y="200" width="14" height="12" rx="3" fill="#D4AF37"/>
  <text x="330" y="298" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">dedicated soaping tools only</text>

  <!-- closed door keeping child + pet out -->
  <rect x="528" y="252" width="64" height="100" fill="#C4683A"/>
  <circle cx="538" cy="304" r="4" fill="#D4AF37"/>
  <text x="560" y="372" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">door closed</text>
  <!-- child + pet behind door (small, outside) -->
  <circle cx="608" cy="300" r="8" fill="#374151"/>
  <rect x="601" y="308" width="14" height="22" rx="5" fill="#374151"/>
  <ellipse cx="606" cy="344" rx="12" ry="6" fill="#374151"/>
  <text x="606" y="372" text-anchor="middle" font-size="10" fill="#374151">kept out</text>
</svg>
