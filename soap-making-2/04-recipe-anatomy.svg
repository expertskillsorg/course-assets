<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Parts of a Soap Recipe</text>

  <!-- Recipe card -->
  <rect x="180" y="58" width="280" height="372" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="320" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">Three-Oil Starter Bar</text>
  <line x1="200" y1="98" x2="440" y2="98" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- OILS block -->
  <text x="202" y="124" font-size="12" font-weight="bold" fill="#3E9B6B">OILS (by weight + %)</text>
  <text x="210" y="144" font-size="12" fill="#374151">Olive oil ......... 500 g (50%)</text>
  <text x="210" y="162" font-size="12" fill="#374151">Coconut oil ... 300 g (30%)</text>
  <text x="210" y="180" font-size="12" fill="#374151">Castor oil ...... 200 g (20%)</text>
  <line x1="200" y1="196" x2="440" y2="196" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- LYE -->
  <text x="202" y="220" font-size="12" font-weight="bold" fill="#C4683A">LYE (NaOH)</text>
  <text x="210" y="240" font-size="12" fill="#374151">142 g</text>
  <line x1="200" y1="254" x2="440" y2="254" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- WATER -->
  <text x="202" y="278" font-size="12" font-weight="bold" fill="#1E2A8E">WATER (distilled)</text>
  <text x="210" y="298" font-size="12" fill="#374151">380 g</text>
  <line x1="200" y1="312" x2="440" y2="312" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- SUPERFAT -->
  <text x="202" y="336" font-size="12" font-weight="bold" fill="#D4AF37">SUPERFAT</text>
  <text x="210" y="356" font-size="12" fill="#374151">5%</text>
  <line x1="200" y1="370" x2="440" y2="370" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ADD-INS -->
  <text x="202" y="394" font-size="12" font-weight="bold" fill="#141B5C">ADD-INS</text>
  <text x="210" y="414" font-size="12" fill="#374151">Lavender oil 30 g</text>

  <!-- Left labels (callouts) -->
  <text x="20" y="150" font-size="11" font-weight="bold" fill="#3E9B6B">The oils that</text>
  <text x="20" y="164" font-size="11" font-weight="bold" fill="#3E9B6B">make the bar</text>
  <line x1="120" y1="155" x2="200" y2="150" stroke="#3E9B6B" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="3" fill="#3E9B6B"/>

  <text x="20" y="226" font-size="11" font-weight="bold" fill="#C4683A">Exact lye for</text>
  <text x="20" y="240" font-size="11" font-weight="bold" fill="#C4683A">these oils</text>
  <line x1="118" y1="228" x2="200" y2="226" stroke="#C4683A" stroke-width="1.5"/>
  <circle cx="200" cy="226" r="3" fill="#C4683A"/>

  <text x="40" y="288" font-size="11" font-weight="bold" fill="#1E2A8E">Dissolves the lye</text>
  <line x1="158" y1="285" x2="200" y2="284" stroke="#1E2A8E" stroke-width="1.5"/>
  <circle cx="200" cy="284" r="3" fill="#1E2A8E"/>

  <!-- Right labels -->
  <text x="476" y="342" font-size="11" font-weight="bold" fill="#D4AF37">Extra oil left</text>
  <text x="476" y="356" font-size="11" font-weight="bold" fill="#D4AF37">in the bar</text>
  <line x1="440" y1="345" x2="470" y2="346" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="440" cy="345" r="3" fill="#D4AF37"/>

  <text x="476" y="406" font-size="11" font-weight="bold" fill="#141B5C">Scent, color,</text>
  <text x="476" y="420" font-size="11" font-weight="bold" fill="#141B5C">extras</text>
  <line x1="440" y1="405" x2="470" y2="406" stroke="#141B5C" stroke-width="1.5"/>
  <circle cx="440" cy="405" r="3" fill="#141B5C"/>

  <text x="320" y="452" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">All amounts by weight, confirmed in a lye calculator.</text>
</svg>
