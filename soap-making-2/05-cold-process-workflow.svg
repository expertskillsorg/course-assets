<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Cold Process Workflow</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#374151">From prepared oils to an insulated mold</text>

  <!-- Row 1: steps 1-4 -->
  <g>
    <rect x="30" y="90" width="150" height="78" rx="10" fill="#1E2A8E"/>
    <text x="105" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1. Prepare oils</text>
    <text x="105" y="142" text-anchor="middle" font-size="11" fill="#E5E7EB">melt hard, add</text>
    <text x="105" y="156" text-anchor="middle" font-size="11" fill="#E5E7EB">liquid oils</text>

    <rect x="220" y="90" width="150" height="78" rx="10" fill="#1E2A8E"/>
    <text x="295" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2. Mix lye</text>
    <text x="295" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">solution</text>
    <text x="295" y="156" text-anchor="middle" font-size="11" fill="#E5E7EB">lye into water</text>

    <rect x="410" y="90" width="150" height="78" rx="10" fill="#C4683A"/>
    <text x="485" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3. Match temps</text>
    <text x="485" y="142" text-anchor="middle" font-size="11" fill="#FBE7DC">~100 to 120 F,</text>
    <text x="485" y="156" text-anchor="middle" font-size="11" fill="#FBE7DC">within ~10 F</text>

    <rect x="600" y="90" width="150" height="78" rx="10" fill="#1E2A8E"/>
    <text x="675" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">4. Combine</text>
    <text x="675" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">and blend</text>
    <text x="675" y="156" text-anchor="middle" font-size="11" fill="#E5E7EB">short pulses</text>
  </g>

  <!-- arrows row 1 -->
  <g fill="#374151">
    <polygon points="180,129 210,129 210,123 222,131 210,139 210,133"/>
    <polygon points="370,129 400,129 400,123 412,131 400,139 400,133"/>
    <polygon points="560,129 590,129 590,123 602,131 590,139 590,133"/>
  </g>

  <!-- down arrow -->
  <polygon points="675,168 681,198 687,198 675,212 663,198 669,198" fill="#374151"/>

  <!-- Row 2: steps 5-7 -->
  <g>
    <rect x="600" y="220" width="150" height="78" rx="10" fill="#D4AF37"/>
    <text x="675" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">5. Bring to</text>
    <text x="675" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">trace</text>
    <text x="675" y="288" text-anchor="middle" font-size="11" fill="#141B5C">light to medium</text>

    <rect x="410" y="220" width="150" height="78" rx="10" fill="#1E2A8E"/>
    <text x="485" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">6. Pour and</text>
    <text x="485" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">mold</text>
    <text x="485" y="288" text-anchor="middle" font-size="11" fill="#E5E7EB">tap out bubbles</text>

    <rect x="220" y="220" width="150" height="78" rx="10" fill="#3E9B6B"/>
    <text x="295" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">7. Insulate</text>
    <text x="295" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">and wait</text>
    <text x="295" y="288" text-anchor="middle" font-size="11" fill="#EAF6EF">gel, 24 to 48 hr</text>
  </g>

  <!-- arrows row 2 (right to left) -->
  <g fill="#374151">
    <polygon points="600,259 570,259 570,253 558,261 570,269 570,263"/>
    <polygon points="410,259 380,259 380,253 368,261 380,269 380,263"/>
  </g>

  <!-- result -->
  <rect x="220" y="340" width="320" height="54" rx="10" fill="#FFFFFF" stroke="#141B5C" stroke-width="2"/>
  <polygon points="295,310 301,330 289,330" fill="#374151"/>
  <text x="380" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Finished loaf set to harden,</text>
  <text x="380" y="384" text-anchor="middle" font-size="13" fill="#374151">labeled with the date, ready to cut</text>
</svg>
