<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Five At-Home Resistance Movements</text>
  <line x1="40" y1="46" x2="720" y2="46" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Movement 1: Sit-to-stand -->
  <g>
    <rect x="40" y="64" width="124" height="210" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle x="0" cx="102" cy="98" r="9" fill="#1E2A8E"/>
    <!-- chair -->
    <line x1="64" y1="190" x2="64" y2="230" stroke="#374151" stroke-width="3"/>
    <line x1="64" y1="190" x2="92" y2="190" stroke="#374151" stroke-width="3"/>
    <line x1="64" y1="170" x2="64" y2="190" stroke="#374151" stroke-width="3"/>
    <!-- standing figure -->
    <line x1="102" y1="107" x2="102" y2="160" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="102" y1="160" x2="92" y2="200" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="102" y1="160" x2="112" y2="200" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="102" y1="120" x2="118" y2="140" stroke="#1E2A8E" stroke-width="4"/>
    <!-- up/down arrow -->
    <path d="M138 130 L138 178 M132 138 L138 130 L144 138 M132 170 L138 178 L144 170" stroke="#3E9B6B" stroke-width="2.5" fill="none"/>
    <text x="102" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Sit-to-stand</text>
    <text x="102" y="268" text-anchor="middle" font-size="10" fill="#374151">Legs</text>
  </g>

  <!-- Movement 2: Wall / counter push-up -->
  <g>
    <rect x="176" y="64" width="124" height="210" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- wall -->
    <line x1="270" y1="90" x2="270" y2="230" stroke="#374151" stroke-width="4"/>
    <!-- leaning figure -->
    <circle cx="226" cy="118" r="9" fill="#C4683A"/>
    <line x1="232" y1="124" x2="262" y2="150" stroke="#C4683A" stroke-width="4"/>
    <line x1="232" y1="124" x2="216" y2="210" stroke="#C4683A" stroke-width="4"/>
    <line x1="216" y1="210" x2="200" y2="230" stroke="#C4683A" stroke-width="4"/>
    <line x1="232" y1="160" x2="262" y2="160" stroke="#C4683A" stroke-width="4"/>
    <path d="M244 100 L262 100 M256 94 L262 100 L256 106" stroke="#3E9B6B" stroke-width="2.5" fill="none"/>
    <text x="238" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Wall push-up</text>
    <text x="238" y="268" text-anchor="middle" font-size="10" fill="#374151">Chest, arms</text>
  </g>

  <!-- Movement 3: Hip hinge -->
  <g>
    <rect x="312" y="64" width="124" height="210" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="356" cy="108" r="9" fill="#1E2A8E"/>
    <!-- hinged-forward torso -->
    <line x1="362" y1="114" x2="392" y2="150" stroke="#1E2A8E" stroke-width="4"/>
    <!-- legs straight down -->
    <line x1="392" y1="150" x2="392" y2="218" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="392" y1="218" x2="378" y2="232" stroke="#1E2A8E" stroke-width="4"/>
    <!-- arms hanging -->
    <line x1="372" y1="128" x2="372" y2="160" stroke="#1E2A8E" stroke-width="4"/>
    <!-- hinge arc -->
    <path d="M392 132 A 30 30 0 0 0 372 118" stroke="#3E9B6B" stroke-width="2.5" fill="none"/>
    <text x="374" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Hip hinge</text>
    <text x="374" y="268" text-anchor="middle" font-size="10" fill="#374151">Back, hips</text>
  </g>

  <!-- Movement 4: Band row -->
  <g>
    <rect x="448" y="64" width="124" height="210" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="498" cy="108" r="9" fill="#C4683A"/>
    <line x1="498" y1="117" x2="498" y2="170" stroke="#C4683A" stroke-width="4"/>
    <line x1="498" y1="170" x2="486" y2="210" stroke="#C4683A" stroke-width="4"/>
    <line x1="498" y1="170" x2="510" y2="210" stroke="#C4683A" stroke-width="4"/>
    <!-- pulling arm -->
    <line x1="498" y1="130" x2="478" y2="142" stroke="#C4683A" stroke-width="4"/>
    <!-- band -->
    <path d="M478 142 Q 455 150 540 150" stroke="#D4AF37" stroke-width="3" fill="none" stroke-dasharray="2 4"/>
    <line x1="540" y1="120" x2="540" y2="200" stroke="#374151" stroke-width="3"/>
    <path d="M470 138 L482 144 M470 138 L474 146 M470 138 L478 136" stroke="#3E9B6B" stroke-width="2" fill="none"/>
    <text x="510" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Band row</text>
    <text x="510" y="268" text-anchor="middle" font-size="10" fill="#374151">Upper back</text>
  </g>

  <!-- Movement 5: Carry -->
  <g>
    <rect x="584" y="64" width="124" height="210" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="646" cy="104" r="9" fill="#1E2A8E"/>
    <line x1="646" y1="113" x2="646" y2="178" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="646" y1="178" x2="634" y2="220" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="646" y1="178" x2="658" y2="220" stroke="#1E2A8E" stroke-width="4"/>
    <!-- arms down at sides -->
    <line x1="646" y1="128" x2="628" y2="166" stroke="#1E2A8E" stroke-width="4"/>
    <line x1="646" y1="128" x2="664" y2="166" stroke="#1E2A8E" stroke-width="4"/>
    <!-- weights in hands -->
    <rect x="620" y="166" width="16" height="14" rx="2" fill="#D4AF37"/>
    <rect x="656" y="166" width="16" height="14" rx="2" fill="#D4AF37"/>
    <!-- forward motion arrow -->
    <path d="M616 232 L676 232 M668 226 L676 232 L668 238" stroke="#3E9B6B" stroke-width="2.5" fill="none"/>
    <text x="646" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Carry</text>
    <text x="646" y="268" text-anchor="middle" font-size="10" fill="#374151">Whole body, grip</text>
  </g>

  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">Five movements cover legs, chest, back, hips, and grip. Use a chair, wall, and one band or two light weights.</text>
</svg>
