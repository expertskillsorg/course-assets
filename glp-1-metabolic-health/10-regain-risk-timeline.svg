<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Why weight tends to return, and what blunts it</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Two paths after the medication stops (illustration, not a promise)</text>

  <!-- Axes -->
  <line x1="90" y1="360" x2="700" y2="360" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="100" x2="90" y2="360" stroke="#374151" stroke-width="2"/>
  <text x="62" y="110" text-anchor="end" font-size="12" fill="#374151">Weight</text>
  <text x="62" y="356" text-anchor="end" font-size="12" fill="#374151">lost</text>

  <!-- x labels -->
  <text x="90" y="382" text-anchor="middle" font-size="12" fill="#374151">On the drug</text>
  <text x="300" y="382" text-anchor="middle" font-size="12" fill="#374151">Taper begins</text>
  <text x="700" y="382" text-anchor="middle" font-size="12" fill="#374151">About 1 year later</text>

  <!-- vertical marker at taper -->
  <line x1="300" y1="110" x2="300" y2="360" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Path A: regain (terracotta) climbs back up toward baseline -->
  <path d="M90,330 L300,330 Q480,330 700,150" fill="none" stroke="#C4683A" stroke-width="4"/>
  <circle cx="700" cy="150" r="5" fill="#C4683A"/>
  <text x="690" y="138" text-anchor="end" font-size="13" font-weight="bold" fill="#C4683A">Most of the loss returns</text>
  <text x="690" y="155" text-anchor="end" font-size="11" fill="#C4683A">appetite comes back, habits fade</text>

  <!-- Path B: held loss (green) stays low -->
  <path d="M90,330 L300,330 Q480,330 700,310" fill="none" stroke="#3E9B6B" stroke-width="4"/>
  <circle cx="700" cy="310" r="5" fill="#3E9B6B"/>
  <text x="690" y="300" text-anchor="end" font-size="13" font-weight="bold" fill="#3E9B6B">Most of the loss held</text>
  <text x="690" y="335" text-anchor="end" font-size="11" fill="#3E9B6B">habits already built carry it</text>

  <!-- What blunts regain panel -->
  <rect x="90" y="398" width="610" height="32" rx="6" fill="#1E2A8E"/>
  <text x="105" y="419" font-size="13" font-weight="bold" fill="#D4AF37">What blunts the climb:</text>
  <text x="240" y="419" font-size="13" fill="#ffffff">kept muscle  &#8226;  kept protein  &#8226;  kept training  &#8226;  kept meal structure</text>
</svg>
