<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">From Body Weight to a Daily Protein Target</text>
  <text x="360" y="62" text-anchor="middle" font-size="14" fill="#374151">Worked example: a person who weighs 200 pounds</text>

  <!-- Step 1 box -->
  <rect x="30" y="95" width="190" height="150" rx="10" fill="#F4F6FB" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="58" cy="123" r="15" fill="#1E2A8E"/>
  <text x="58" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="82" y="128" font-size="14" font-weight="bold" fill="#141B5C">Pounds to kilos</text>
  <text x="125" y="165" text-anchor="middle" font-size="15" fill="#374151">200 lb</text>
  <text x="125" y="190" text-anchor="middle" font-size="14" fill="#374151">divided by 2.2</text>
  <line x1="55" y1="202" x2="195" y2="202" stroke="#E5E7EB" stroke-width="2"/>
  <text x="125" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="#3E9B6B">about 91 kg</text>

  <!-- Arrow 1 -->
  <path d="M225 170 L255 170" stroke="#C4683A" stroke-width="3"/>
  <path d="M255 170 l-9 -6 v12 z" fill="#C4683A"/>

  <!-- Step 2 box -->
  <rect x="265" y="95" width="190" height="150" rx="10" fill="#F4F6FB" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="293" cy="123" r="15" fill="#1E2A8E"/>
  <text x="293" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="317" y="128" font-size="14" font-weight="bold" fill="#141B5C">Times 1.6</text>
  <text x="360" y="165" text-anchor="middle" font-size="15" fill="#374151">91 kg</text>
  <text x="360" y="190" text-anchor="middle" font-size="14" fill="#374151">x 1.6 g per kg</text>
  <line x1="295" y1="202" x2="435" y2="202" stroke="#E5E7EB" stroke-width="2"/>
  <text x="360" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="#3E9B6B">about 146 g</text>

  <!-- Arrow 2 -->
  <path d="M460 170 L490 170" stroke="#C4683A" stroke-width="3"/>
  <path d="M490 170 l-9 -6 v12 z" fill="#C4683A"/>

  <!-- Step 3 box (result) -->
  <rect x="500" y="95" width="190" height="150" rx="10" fill="#1E2A8E" stroke="#141B5C" stroke-width="2"/>
  <circle cx="528" cy="123" r="15" fill="#D4AF37"/>
  <text x="528" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">3</text>
  <text x="552" y="128" font-size="14" font-weight="bold" fill="#FFFFFF">Daily target</text>
  <text x="595" y="172" text-anchor="middle" font-size="32" font-weight="bold" fill="#D4AF37">~146 g</text>
  <text x="595" y="200" text-anchor="middle" font-size="13" fill="#FFFFFF">of protein per day</text>
  <text x="595" y="222" text-anchor="middle" font-size="13" fill="#FFFFFF">while losing weight</text>

  <!-- Spread row -->
  <text x="360" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Spread it across the day: roughly 25 to 40 g per meal</text>
  <rect x="150" y="305" width="130" height="44" rx="8" fill="#3E9B6B"/>
  <text x="215" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Breakfast</text>
  <text x="215" y="343" text-anchor="middle" font-size="12" fill="#FFFFFF">~35 g</text>
  <rect x="295" y="305" width="130" height="44" rx="8" fill="#3E9B6B"/>
  <text x="360" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Lunch</text>
  <text x="360" y="343" text-anchor="middle" font-size="12" fill="#FFFFFF">~40 g</text>
  <rect x="440" y="305" width="130" height="44" rx="8" fill="#3E9B6B"/>
  <text x="505" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Dinner + snack</text>
  <text x="505" y="343" text-anchor="middle" font-size="12" fill="#FFFFFF">~71 g</text>

  <text x="360" y="372" text-anchor="middle" font-size="11" fill="#374151">A starting point to discuss with your dietitian, not a prescription.</text>
</svg>
