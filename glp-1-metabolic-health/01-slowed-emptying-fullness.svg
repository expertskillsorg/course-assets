<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How a Slowed Stomach Keeps You Full</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Same meal, two stomachs. The medication slows how fast food leaves.</text>

  <!-- Left column: without medication -->
  <text x="180" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">Without the medication</text>
  <!-- stomach outline -->
  <path d="M150 110 q-34 16 -28 58 q4 34 34 46 q30 12 56 0 q26 -14 22 -50 q-4 -38 -34 -52 q-26 -12 -50 -2 z" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- food, mostly emptied -->
  <path d="M150 188 q-6 14 14 22 q24 8 44 -4 q10 -8 8 -18 q-32 8 -66 0 z" fill="#C4683A" opacity="0.85"/>
  <text x="180" y="240" text-anchor="middle" font-size="12" fill="#374151">Food leaves quickly</text>
  <!-- timeline arrow -->
  <line x1="80" y1="276" x2="280" y2="276" stroke="#374151" stroke-width="2"/>
  <polygon points="280,276 270,271 270,281" fill="#374151"/>
  <text x="90" y="298" font-size="11" fill="#374151">eat</text>
  <text x="248" y="298" font-size="11" fill="#374151">30 min</text>
  <!-- fullness bar (short) -->
  <rect x="80" y="320" width="64" height="22" rx="4" fill="#3E9B6B"/>
  <rect x="144" y="320" width="156" height="22" rx="4" fill="#E5E7EB"/>
  <text x="80" y="362" font-size="12" fill="#374151">Full for a short while, then hungry again</text>

  <!-- divider -->
  <line x1="360" y1="80" x2="360" y2="380" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Right column: with medication -->
  <text x="540" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">On a GLP-1 medication</text>
  <path d="M510 110 q-34 16 -28 58 q4 34 34 46 q30 12 56 0 q26 -14 22 -50 q-4 -38 -34 -52 q-26 -12 -50 -2 z" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- food, still full -->
  <path d="M500 150 q-12 30 22 44 q34 14 64 -4 q18 -12 12 -34 q-4 -14 -16 -18 q-44 18 -90 0 z" fill="#C4683A" opacity="0.9"/>
  <text x="540" y="240" text-anchor="middle" font-size="12" fill="#374151">Food stays longer</text>
  <line x1="440" y1="276" x2="640" y2="276" stroke="#374151" stroke-width="2"/>
  <polygon points="640,276 630,271 630,281" fill="#374151"/>
  <text x="450" y="298" font-size="11" fill="#374151">eat</text>
  <text x="606" y="298" font-size="11" fill="#374151">hours</text>
  <!-- fullness bar (long) -->
  <rect x="440" y="320" width="200" height="22" rx="4" fill="#3E9B6B"/>
  <text x="440" y="362" font-size="12" fill="#374151">Full early and stays full for hours</text>

  <text x="360" y="402" text-anchor="middle" font-size="12" fill="#D4AF37" font-weight="bold">Early, lasting fullness is the medication working, not a problem to fix.</text>
</svg>
