<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="380" height="380" fill="#ffffff"/>
  <text x="190" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Empty Leg and Full Leg</text>

  <!-- ground -->
  <line x1="50" y1="320" x2="330" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- head -->
  <circle cx="190" cy="80" r="20" fill="none" stroke="#1E2A8E" stroke-width="3"/>
  <!-- torso, tilted weight to the figure's right (viewer left) -->
  <path d="M190 100 L190 200" stroke="#1E2A8E" stroke-width="3" fill="none"/>
  <!-- hips -->
  <line x1="150" y1="200" x2="230" y2="200" stroke="#1E2A8E" stroke-width="3"/>

  <!-- FULL leg (viewer left), bears weight, deep navy + heavy -->
  <path d="M150 200 L138 260 L140 318" stroke="#141B5C" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M140 318 L168 320" stroke="#141B5C" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- weight pour arrows on full leg -->
  <path d="M138 232 L138 250" stroke="#3E9B6B" stroke-width="2.5"/>
  <polygon points="138,256 133,246 143,246" fill="#3E9B6B"/>

  <!-- EMPTY leg (viewer right), light, thin gold -->
  <path d="M230 200 L240 260 L240 318" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M240 318 L266 320" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- weight bar -->
  <rect x="120" y="345" width="140" height="16" rx="3" fill="#E5E7EB"/>
  <rect x="120" y="345" width="98" height="16" rx="3" fill="#141B5C"/>
  <text x="150" y="357" font-size="11" fill="#ffffff" text-anchor="middle">~70%</text>
  <text x="285" y="357" font-size="11" fill="#374151">~30%</text>

  <!-- labels -->
  <text x="90" y="150" font-size="14" font-weight="bold" fill="#141B5C">FULL</text>
  <text x="70" y="168" font-size="12" fill="#374151">weighted, heavy,</text>
  <text x="70" y="183" font-size="12" fill="#374151">rooted</text>

  <text x="278" y="150" font-size="14" font-weight="bold" fill="#C4683A">EMPTY</text>
  <text x="278" y="168" font-size="12" fill="#374151">light, free,</text>
  <text x="278" y="183" font-size="12" fill="#374151">ready to move</text>
</svg>
