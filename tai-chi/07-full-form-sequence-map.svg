<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="620" height="420" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The full form as one continuous path</text>
  <text x="310" y="50" text-anchor="middle" font-size="12" fill="#374151">eight movements in order; the close returns to the start</text>

  <!-- connecting flow path through all nodes -->
  <path d="M 110 110 H 250 H 390 H 530 V 210 H 370 V 310 H 510 M 110 110 V 310 H 270"
        fill="none" stroke="#E5E7EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ordered flow arrows (navy) following the real reading order -->
  <path d="M 110 110 H 530 V 210 H 110 V 310 H 510"
        fill="none" stroke="#1E2A8E" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="530,150 524,138 537,138" fill="#1E2A8E"/>
  <polygon points="110,250 104,238 117,238" fill="#1E2A8E"/>
  <polygon points="510,310 498,304 498,317" fill="#1E2A8E"/>

  <!-- node helper: circle + number + label -->
  <!-- 1 Commencement -->
  <circle cx="110" cy="110" r="22" fill="#1E2A8E"/>
  <text x="110" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
  <text x="110" y="80" text-anchor="middle" font-size="11" fill="#141B5C">Commencement</text>

  <!-- 2 Wild Horse's Mane -->
  <circle cx="250" cy="110" r="22" fill="#3E9B6B"/>
  <text x="250" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#374151">Wild Horse's Mane</text>

  <!-- 3 White Crane -->
  <circle cx="390" cy="110" r="22" fill="#3E9B6B"/>
  <text x="390" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#374151">White Crane</text>

  <!-- 4 Brush Knee -->
  <circle cx="530" cy="110" r="22" fill="#3E9B6B"/>
  <text x="530" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
  <text x="530" y="80" text-anchor="middle" font-size="11" fill="#374151">Brush Knee</text>

  <!-- 5 Playing the Lute -->
  <circle cx="370" cy="210" r="22" fill="#D4AF37"/>
  <text x="370" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">5</text>
  <text x="370" y="180" text-anchor="middle" font-size="11" fill="#374151">Playing the Lute</text>

  <!-- 6 Repulse Monkey (backward step) -->
  <circle cx="110" cy="310" r="22" fill="#C4683A"/>
  <text x="110" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">6</text>
  <text x="110" y="350" text-anchor="middle" font-size="11" fill="#374151">Repulse Monkey</text>
  <text x="110" y="364" text-anchor="middle" font-size="10" fill="#C4683A">(steps backward)</text>

  <!-- 7 Wave Hands (side step) -->
  <circle cx="270" cy="310" r="22" fill="#C4683A"/>
  <text x="270" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">7</text>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#374151">Wave Hands</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#C4683A">(steps sideways)</text>

  <!-- 8 Cross Hands closing -->
  <circle cx="510" cy="310" r="22" fill="#141B5C"/>
  <text x="510" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">8</text>
  <text x="510" y="350" text-anchor="middle" font-size="11" fill="#141B5C">Cross Hands / Close</text>
  <text x="510" y="364" text-anchor="middle" font-size="10" fill="#141B5C">(back to stillness)</text>

  <!-- legend -->
  <rect x="60" y="386" width="500" height="26" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="310" y="403" text-anchor="middle" font-size="11" fill="#374151">Follow the dashed line in order; each movement's end is the next one's beginning.</text>
</svg>
