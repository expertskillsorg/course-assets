<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="520" height="380" fill="#ffffff"/>
  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">White Crane: high and low hands, empty front foot</text>

  <!-- floor -->
  <line x1="60" y1="330" x2="460" y2="330" stroke="#E5E7EB" stroke-width="2"/>

  <!-- head -->
  <circle cx="250" cy="90" r="20" fill="none" stroke="#1E2A8E" stroke-width="3"/>
  <!-- crown lift -->
  <line x1="250" y1="70" x2="250" y2="50" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="3 4"/>
  <polygon points="250,48 245,60 255,60" fill="#D4AF37"/>
  <text x="262" y="55" font-size="11" fill="#D4AF37">lift crown</text>

  <!-- torso, tall -->
  <line x1="250" y1="110" x2="250" y2="220" stroke="#1E2A8E" stroke-width="3"/>

  <!-- high hand (back-side hand up near head) -->
  <path d="M250 130 C 290 120, 320 95, 332 78" fill="none" stroke="#3E9B6B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="334" cy="76" r="7" fill="#3E9B6B"/>
  <text x="345" y="72" font-size="13" fill="#3E9B6B" font-weight="bold">high hand</text>
  <text x="345" y="88" font-size="11" fill="#374151">near the head</text>

  <!-- low hand (front-side hand down by hip) -->
  <path d="M250 150 C 215 175, 195 200, 188 222" fill="none" stroke="#C4683A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="187" cy="224" r="7" fill="#C4683A"/>
  <text x="120" y="222" font-size="13" fill="#C4683A" font-weight="bold">low hand</text>
  <text x="120" y="238" font-size="11" fill="#374151">by the hip</text>

  <!-- back leg, weighted, bent -->
  <path d="M250 220 L 232 280 L 240 330" fill="none" stroke="#1E2A8E" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="240" cy="332" rx="26" ry="9" fill="#1E2A8E"/>
  <text x="240" y="360" text-anchor="middle" font-size="12" fill="#1E2A8E" font-weight="bold">back leg: most weight here</text>

  <!-- front leg, light, toe touch -->
  <path d="M250 220 L 300 285 L 322 326" fill="none" stroke="#C4683A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <ellipse cx="326" cy="328" rx="20" ry="7" fill="none" stroke="#C4683A" stroke-width="2.5"/>
  <circle cx="338" cy="330" r="4" fill="#C4683A"/>
  <text x="372" y="320" text-anchor="middle" font-size="12" fill="#C4683A">empty front foot,</text>
  <text x="372" y="336" text-anchor="middle" font-size="12" fill="#C4683A">light on the toe</text>
</svg>
