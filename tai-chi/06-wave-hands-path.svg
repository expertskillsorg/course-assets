<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="560" height="380" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Wave Hands Like Clouds: the waist turns, the hands follow</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#374151">front view; the turning waist carries the hands along their circles</text>

  <!-- body center / trunk -->
  <line x1="280" y1="120" x2="280" y2="300" stroke="#374151" stroke-width="3"/>
  <circle cx="280" cy="105" r="16" fill="none" stroke="#374151" stroke-width="3"/>

  <!-- waist marker -->
  <circle cx="280" cy="230" r="7" fill="#1E2A8E"/>
  <text x="298" y="234" font-size="12" font-weight="bold" fill="#1E2A8E">waist (turns first)</text>

  <!-- waist turn arc, left and right -->
  <path d="M 215 230 A 70 70 0 0 1 345 230" fill="none" stroke="#1E2A8E" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="215,230 226,222 229,235" fill="#1E2A8E"/>
  <polygon points="345,230 334,222 331,235" fill="#1E2A8E"/>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#1E2A8E">waist turns left and right</text>

  <!-- high hand circle path -->
  <ellipse cx="280" cy="150" rx="95" ry="34" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <polygon points="375,150 363,143 363,157" fill="#D4AF37"/>
  <circle cx="345" cy="135" r="9" fill="#D4AF37"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#D4AF37">high hand (about face height)</text>

  <!-- low hand circle path -->
  <ellipse cx="280" cy="265" rx="95" ry="34" fill="none" stroke="#3E9B6B" stroke-width="3"/>
  <polygon points="185,265 197,258 197,272" fill="#3E9B6B"/>
  <circle cx="215" cy="280" r="9" fill="#3E9B6B"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#3E9B6B">low hand (about waist height)</text>

  <!-- as the waist turns, hands trade -->
  <line x1="345" y1="150" x2="345" y2="250" stroke="#C4683A" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="215" y1="265" x2="215" y2="165" stroke="#C4683A" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- legend -->
  <rect x="60" y="334" width="440" height="34" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#374151">As the waist turns, the high hand sinks and the low hand rises, trading places.</text>
</svg>
