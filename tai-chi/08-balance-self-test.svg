<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="480" height="320" fill="#FFFFFF"/>
  <text x="240" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Single-Leg Timed-Stand Self-Test</text>

  <!-- floor line -->
  <line x1="40" y1="250" x2="240" y2="250" stroke="#374151" stroke-width="2"/>

  <!-- support counter -->
  <rect x="48" y="150" width="14" height="100" fill="#C4683A"/>
  <rect x="40" y="142" width="46" height="12" rx="2" fill="#C4683A"/>
  <text x="63" y="272" text-anchor="middle" font-size="11" fill="#374151">support</text>

  <!-- person on one leg -->
  <!-- head -->
  <circle cx="150" cy="92" r="15" fill="#1E2A8E"/>
  <!-- torso -->
  <rect x="143" y="107" width="14" height="70" rx="6" fill="#1E2A8E"/>
  <!-- reaching arm toward support -->
  <line x1="146" y1="120" x2="90" y2="150" stroke="#1E2A8E" stroke-width="7" stroke-linecap="round"/>
  <!-- other arm out for balance -->
  <line x1="154" y1="120" x2="195" y2="108" stroke="#1E2A8E" stroke-width="7" stroke-linecap="round"/>
  <!-- standing leg -->
  <line x1="150" y1="176" x2="150" y2="250" stroke="#1E2A8E" stroke-width="9" stroke-linecap="round"/>
  <!-- lifted leg -->
  <line x1="150" y1="178" x2="178" y2="220" stroke="#3E9B6B" stroke-width="9" stroke-linecap="round"/>
  <!-- gap marker under lifted foot -->
  <line x1="172" y1="250" x2="186" y2="250" stroke="#3E9B6B" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="200" y="234" font-size="11" fill="#3E9B6B">foot lifted</text>

  <!-- stopwatch -->
  <circle cx="360" cy="100" r="34" fill="#FFFFFF" stroke="#D4AF37" stroke-width="5"/>
  <rect x="354" y="58" width="12" height="9" rx="2" fill="#D4AF37"/>
  <line x1="360" y1="100" x2="360" y2="80" stroke="#141B5C" stroke-width="3" stroke-linecap="round"/>
  <line x1="360" y1="100" x2="376" y2="106" stroke="#141B5C" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="158" text-anchor="middle" font-size="12" fill="#374151">time your hold</text>

  <!-- steps panel -->
  <text x="300" y="205" font-size="13" font-weight="bold" fill="#141B5C">Each month:</text>
  <circle cx="308" cy="227" r="9" fill="#1E2A8E"/><text x="308" y="231" text-anchor="middle" font-size="11" fill="#FFFFFF">1</text>
  <text x="324" y="231" font-size="12" fill="#374151">Stand near support</text>
  <circle cx="308" cy="252" r="9" fill="#1E2A8E"/><text x="308" y="256" text-anchor="middle" font-size="11" fill="#FFFFFF">2</text>
  <text x="324" y="256" font-size="12" fill="#374151">Lift one foot</text>
  <circle cx="308" cy="277" r="9" fill="#1E2A8E"/><text x="308" y="281" text-anchor="middle" font-size="11" fill="#FFFFFF">3</text>
  <text x="324" y="281" font-size="12" fill="#374151">Time, then switch legs</text>
  <circle cx="308" cy="302" r="9" fill="#3E9B6B"/><text x="308" y="306" text-anchor="middle" font-size="11" fill="#FFFFFF">4</text>
  <text x="324" y="306" font-size="12" fill="#374151">Write down both numbers</text>
</svg>
