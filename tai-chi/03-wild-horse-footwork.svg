<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>
  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Part the Wild Horse's Mane: footwork</text>

  <!-- floor grid hint -->
  <line x1="40" y1="300" x2="480" y2="300" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="120" y1="60" x2="120" y2="300" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- LEFT foot: stays as back/support foot -->
  <ellipse cx="120" cy="270" rx="22" ry="40" fill="#1E2A8E"/>
  <text x="120" y="335" text-anchor="middle" font-size="13" fill="#374151">Left foot (weight starts here)</text>

  <!-- right foot start position (light/empty) -->
  <ellipse cx="170" cy="270" rx="22" ry="40" fill="none" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text x="170" y="232" text-anchor="middle" font-size="12" fill="#C4683A">start</text>

  <!-- angled step arrow -->
  <path d="M188 258 C 250 220, 300 190, 352 168" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  <polygon points="352,168 338,166 346,180" fill="#D4AF37"/>
  <text x="270" y="200" text-anchor="middle" font-size="13" fill="#D4AF37" font-weight="bold">step out, heel first (~30 deg)</text>

  <!-- right foot end position, angled, weighted (front of bow stance) -->
  <g transform="translate(378,150) rotate(28)">
    <ellipse cx="0" cy="0" rx="22" ry="40" fill="#3E9B6B"/>
  </g>
  <text x="400" y="118" text-anchor="middle" font-size="13" fill="#3E9B6B" font-weight="bold">Right foot (weight forward)</text>

  <!-- bow stance note -->
  <line x1="378" y1="150" x2="120" y2="270" stroke="#374151" stroke-width="1.5" stroke-dasharray="2 5"/>
  <text x="248" y="290" text-anchor="middle" font-size="12" fill="#374151">bow stance: front knee over front foot, back leg straighter</text>
</svg>
