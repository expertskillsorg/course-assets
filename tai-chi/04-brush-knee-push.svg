<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="540" height="380" fill="#ffffff"/>
  <text x="270" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Brush Knee and Push: two hands, two jobs</text>

  <!-- floor -->
  <line x1="60" y1="335" x2="480" y2="335" stroke="#E5E7EB" stroke-width="2"/>

  <!-- head -->
  <circle cx="230" cy="80" r="18" fill="none" stroke="#1E2A8E" stroke-width="3"/>
  <!-- torso -->
  <line x1="230" y1="98" x2="238" y2="210" stroke="#1E2A8E" stroke-width="3"/>

  <!-- bow stance: front leg weighted, knee over foot -->
  <path d="M238 210 L 300 270 L 312 330" fill="none" stroke="#1E2A8E" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="318" cy="332" rx="26" ry="8" fill="#1E2A8E"/>
  <text x="318" y="358" text-anchor="middle" font-size="11" fill="#1E2A8E">front foot (weight forward)</text>
  <!-- back leg straighter -->
  <path d="M232 210 L 175 290 L 158 330" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="156" cy="332" rx="24" ry="8" fill="#374151"/>

  <!-- PUSH hand: forward at shoulder height -->
  <path d="M238 120 C 300 118, 360 122, 408 126" fill="none" stroke="#3E9B6B" stroke-width="4" stroke-linecap="round"/>
  <polygon points="412,126 396,120 398,134" fill="#3E9B6B"/>
  <text x="350" y="108" text-anchor="middle" font-size="13" fill="#3E9B6B" font-weight="bold">push hand</text>
  <text x="350" y="122" text-anchor="middle" font-size="11" fill="#374151">forward, shoulder height, soft elbow</text>

  <!-- BRUSH hand: curved path down and across the knee -->
  <path d="M250 150 C 270 200, 300 240, 305 268" fill="none" stroke="#C4683A" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 0"/>
  <polygon points="305,272 298,256 314,260" fill="#C4683A"/>
  <text x="378" y="230" text-anchor="middle" font-size="13" fill="#C4683A" font-weight="bold">brush hand</text>
  <text x="378" y="244" text-anchor="middle" font-size="11" fill="#374151">down and across the knee</text>

  <!-- knee marker -->
  <circle cx="300" cy="270" r="6" fill="#D4AF37"/>
  <text x="300" y="296" text-anchor="middle" font-size="11" fill="#D4AF37" font-weight="bold">front knee</text>

  <!-- timing note -->
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#374151">Both finish together as the weight shifts forward into the bow stance.</text>
</svg>
