<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">The Cross Hands Closing: gather, cross, settle</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#374151">front view, three stages; the form ends where it began</text>

  <!-- flow arrows between panels -->
  <line x1="205" y1="190" x2="235" y2="190" stroke="#D4AF37" stroke-width="2.5"/>
  <polygon points="239,190 227,184 227,196" fill="#D4AF37"/>
  <line x1="415" y1="190" x2="445" y2="190" stroke="#D4AF37" stroke-width="2.5"/>
  <polygon points="449,190 437,184 437,196" fill="#D4AF37"/>

  <!-- PANEL 1: feet home -->
  <g>
    <line x1="100" y1="100" x2="100" y2="250" stroke="#374151" stroke-width="3"/>
    <circle cx="100" cy="88" r="14" fill="none" stroke="#374151" stroke-width="3"/>
    <!-- feet parallel -->
    <ellipse cx="82" cy="262" rx="16" ry="9" fill="#1E2A8E"/>
    <ellipse cx="118" cy="262" rx="16" ry="9" fill="#1E2A8E"/>
    <text x="100" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E2A8E">1. feet home</text>
    <text x="100" y="308" text-anchor="middle" font-size="10" fill="#374151">parallel, shoulder-width</text>
  </g>

  <!-- PANEL 2: cross the wrists -->
  <g>
    <line x1="310" y1="100" x2="310" y2="250" stroke="#374151" stroke-width="3"/>
    <circle cx="310" cy="88" r="14" fill="none" stroke="#374151" stroke-width="3"/>
    <!-- crossed wrists at chest -->
    <line x1="285" y1="155" x2="335" y2="125" stroke="#3E9B6B" stroke-width="4" stroke-linecap="round"/>
    <line x1="285" y1="125" x2="335" y2="155" stroke="#C4683A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="310" cy="140" r="5" fill="#141B5C"/>
    <ellipse cx="292" cy="262" rx="16" ry="9" fill="#1E2A8E"/>
    <ellipse cx="328" cy="262" rx="16" ry="9" fill="#1E2A8E"/>
    <text x="310" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">2. cross the wrists</text>
    <text x="310" y="308" text-anchor="middle" font-size="10" fill="#374151">in front of the chest</text>
  </g>

  <!-- PANEL 3: lower and settle -->
  <g>
    <line x1="520" y1="100" x2="520" y2="250" stroke="#374151" stroke-width="3"/>
    <circle cx="520" cy="88" r="14" fill="none" stroke="#374151" stroke-width="3"/>
    <!-- hands lowered to sides -->
    <line x1="520" y1="120" x2="498" y2="205" stroke="#3E9B6B" stroke-width="4" stroke-linecap="round"/>
    <line x1="520" y1="120" x2="542" y2="205" stroke="#C4683A" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="502" cy="262" rx="16" ry="9" fill="#1E2A8E"/>
    <ellipse cx="538" cy="262" rx="16" ry="9" fill="#1E2A8E"/>
    <text x="520" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">3. lower and settle</text>
    <text x="520" y="308" text-anchor="middle" font-size="10" fill="#374151">rooted, tall, still</text>
  </g>

  <rect x="60" y="326" width="500" height="26" rx="6" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="310" y="343" text-anchor="middle" font-size="11" fill="#374151">The same settled, parallel-foot stance the form opened in.</text>
</svg>
