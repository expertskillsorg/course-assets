<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Chunk to Name to Recall Loop</text>

  <!-- Chunk node -->
  <circle cx="130" cy="150" r="62" fill="#1E2A8E"/>
  <text x="130" y="142" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Chunk</text>
  <text x="130" y="166" text-anchor="middle" font-size="12" fill="#E5E7EB">split into</text>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#E5E7EB">small pieces</text>

  <!-- Name node -->
  <circle cx="320" cy="150" r="62" fill="#3E9B6B"/>
  <text x="320" y="142" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Name</text>
  <text x="320" y="166" text-anchor="middle" font-size="12" fill="#ffffff">give each a</text>
  <text x="320" y="182" text-anchor="middle" font-size="12" fill="#ffffff">plain nickname</text>

  <!-- Recall node -->
  <circle cx="510" cy="150" r="62" fill="#D4AF37"/>
  <text x="510" y="142" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Recall</text>
  <text x="510" y="166" text-anchor="middle" font-size="12" fill="#141B5C">do it from</text>
  <text x="510" y="182" text-anchor="middle" font-size="12" fill="#141B5C">memory</text>

  <!-- Arrow chunk -> name -->
  <line x1="196" y1="150" x2="252" y2="150" stroke="#374151" stroke-width="3"/>
  <polygon points="252,150 242,144 242,156" fill="#374151"/>

  <!-- Arrow name -> recall -->
  <line x1="386" y1="150" x2="442" y2="150" stroke="#374151" stroke-width="3"/>
  <polygon points="442,150 432,144 432,156" fill="#374151"/>

  <!-- Loop arrow recall -> chunk (next movement) -->
  <path d="M 510 212 Q 510 280 320 280 Q 130 280 130 212" fill="none" stroke="#C4683A" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="130,212 124,224 136,224" fill="#C4683A"/>
  <text x="320" y="304" text-anchor="middle" font-size="13" fill="#C4683A">reuse on the next movement</text>
</svg>
