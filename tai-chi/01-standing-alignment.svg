<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="360" height="440" fill="#ffffff"/>
  <text x="180" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Head-to-Foot Alignment</text>

  <!-- ground line -->
  <line x1="60" y1="400" x2="300" y2="400" stroke="#374151" stroke-width="2"/>

  <!-- vertical alignment line (plumb) -->
  <line x1="180" y1="70" x2="180" y2="400" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- figure: side view -->
  <!-- head -->
  <circle cx="180" cy="92" r="22" fill="none" stroke="#1E2A8E" stroke-width="3"/>
  <!-- spine / torso -->
  <path d="M180 114 L180 250" stroke="#1E2A8E" stroke-width="3" fill="none"/>
  <!-- arm hanging -->
  <path d="M180 150 q-26 30 -22 90" stroke="#1E2A8E" stroke-width="3" fill="none"/>
  <!-- hips -->
  <ellipse cx="180" cy="250" rx="20" ry="10" fill="none" stroke="#1E2A8E" stroke-width="3"/>
  <!-- leg with soft knee -->
  <path d="M180 258 L172 320 L178 398" stroke="#1E2A8E" stroke-width="3" fill="none"/>
  <!-- foot -->
  <path d="M178 398 L206 400" stroke="#1E2A8E" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- crown lift cue -->
  <path d="M180 70 L180 56" stroke="#3E9B6B" stroke-width="2.5"/>
  <polygon points="180,50 175,60 185,60" fill="#3E9B6B"/>

  <!-- joint dots stacked -->
  <circle cx="180" cy="92" r="4" fill="#C4683A"/>
  <circle cx="180" cy="250" r="4" fill="#C4683A"/>
  <circle cx="172" cy="320" r="4" fill="#C4683A"/>
  <circle cx="178" cy="398" r="4" fill="#C4683A"/>

  <!-- labels on the right -->
  <text x="232" y="58" font-size="13" fill="#3E9B6B">crown lifted</text>
  <text x="232" y="96" font-size="13" fill="#374151">head tall, chin tucked</text>
  <text x="232" y="170" font-size="13" fill="#374151">shoulders dropped</text>
  <text x="232" y="254" font-size="13" fill="#374151">hips level</text>
  <text x="232" y="324" font-size="13" fill="#374151">knees soft (unlocked)</text>
  <text x="232" y="396" font-size="13" fill="#374151">feet shoulder-width</text>

  <text x="180" y="428" text-anchor="middle" font-size="12" fill="#D4AF37">one quiet vertical line</text>
</svg>
