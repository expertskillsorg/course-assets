<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#FFFFFF"/>
  <text x="430" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">The Creaming Stages: Cold Butter to Light and Fluffy</text>

  <!-- progress arrow -->
  <line x1="70" y1="120" x2="790" y2="120" stroke="#E5E7EB" stroke-width="4"/>
  <polygon points="790,120 776,113 776,127" fill="#D4AF37"/>

  <!-- Stage 1: cold butter -->
  <circle cx="130" cy="120" r="42" fill="#D4AF37" opacity="0.25"/>
  <rect x="108" y="100" width="44" height="40" rx="4" fill="#D4AF37" stroke="#141B5C" stroke-width="2"/>
  <text x="130" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">1. Cold / hard</text>
  <text x="130" y="212" text-anchor="middle" font-size="12" fill="#374151">Stop. Wait.</text>
  <text x="130" y="230" text-anchor="middle" font-size="12" fill="#374151">Warm to 65-68F</text>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#C4683A">Won't cream cold</text>

  <!-- Stage 2: softened -->
  <circle cx="320" cy="120" r="44" fill="#D4AF37" opacity="0.35"/>
  <ellipse cx="320" cy="120" rx="30" ry="26" fill="#E7C55A" stroke="#141B5C" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">2. Softened</text>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="#374151">Dents but holds</text>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#374151">Deep yellow</text>
  <text x="320" y="248" text-anchor="middle" font-size="12" fill="#374151">The start line</text>

  <!-- Stage 3: combined/gritty -->
  <circle cx="510" cy="120" r="48" fill="#F1E6C0"/>
  <ellipse cx="510" cy="120" rx="36" ry="30" fill="#F0E4B8" stroke="#141B5C" stroke-width="2"/>
  <circle cx="498" cy="112" r="2" fill="#374151"/><circle cx="518" cy="118" r="2" fill="#374151"/>
  <circle cx="506" cy="128" r="2" fill="#374151"/><circle cx="524" cy="108" r="2" fill="#374151"/>
  <text x="510" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">3. Combined (~1 min)</text>
  <text x="510" y="218" text-anchor="middle" font-size="12" fill="#374151">Grainy, deep gold</text>
  <text x="510" y="236" text-anchor="middle" font-size="12" fill="#C4683A">Most beginners</text>
  <text x="510" y="254" text-anchor="middle" font-size="12" fill="#C4683A">quit here. Keep going.</text>

  <!-- Stage 4: light and fluffy -->
  <circle cx="720" cy="120" r="54" fill="#FBF6E4"/>
  <ellipse cx="720" cy="118" rx="42" ry="36" fill="#FDF8EC" stroke="#3E9B6B" stroke-width="3"/>
  <circle cx="705" cy="108" r="4" fill="#FFFFFF" stroke="#E5E7EB"/><circle cx="732" cy="114" r="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="716" cy="128" r="4" fill="#FFFFFF" stroke="#E5E7EB"/><circle cx="736" cy="102" r="3" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="700" cy="124" r="3" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="720" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">4. Light &amp; fluffy (3-5 min)</text>
  <text x="720" y="222" text-anchor="middle" font-size="12" fill="#374151">Pale, near-white</text>
  <text x="720" y="240" text-anchor="middle" font-size="12" fill="#374151">Almost doubled</text>
  <text x="720" y="258" text-anchor="middle" font-size="12" fill="#3E9B6B">This air is leavening</text>

  <text x="430" y="320" text-anchor="middle" font-size="13" fill="#111827">Color lightens and volume grows as you beat: each stage traps more air for the powder to inflate later.</text>
  <rect x="150" y="345" width="560" height="34" rx="6" fill="#141B5C"/>
  <text x="430" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Cue to stop: pale, fluffy, and nearly doubled in size.</text>
</svg>
