<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Anatomy of an Assembled Layer Cake</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Cross-section, left to right through the middle</text>

  <!-- crumb coat (thin outer skim) drawn as a lighter surround -->
  <rect x="150" y="150" width="250" height="180" rx="6" fill="#F1E4C3"/>

  <!-- cake board -->
  <rect x="120" y="330" width="310" height="16" rx="3" fill="#374151"/>
  <!-- anchor dab -->
  <path d="M255 330 q20 -14 40 0 z" fill="#D4AF37"/>

  <!-- bottom cake layer -->
  <rect x="160" y="255" width="230" height="70" rx="4" fill="#C4683A"/>
  <!-- filling -->
  <rect x="160" y="228" width="230" height="20" fill="#3E9B6B"/>
  <!-- dam rings (buttercream walls at each edge of filling) -->
  <rect x="160" y="222" width="16" height="32" rx="4" fill="#D4AF37"/>
  <rect x="374" y="222" width="16" height="32" rx="4" fill="#D4AF37"/>
  <!-- top cake layer -->
  <rect x="160" y="158" width="230" height="66" rx="4" fill="#C4683A"/>

  <!-- crumb coat outline stroke to show the thin seal -->
  <rect x="150" y="150" width="250" height="180" rx="6" fill="none" stroke="#D4AF37" stroke-width="3"/>

  <!-- labels with leader lines -->
  <!-- crumb coat -->
  <line x1="150" y1="180" x2="470" y2="120" stroke="#1E2A8E" stroke-width="1.5"/>
  <circle cx="150" cy="180" r="3" fill="#1E2A8E"/>
  <text x="476" y="116" font-size="13" font-weight="bold" fill="#1E2A8E">Crumb coat</text>
  <text x="476" y="132" font-size="11" fill="#374151">thin skim seals crumbs, chilled firm</text>

  <!-- top layer -->
  <line x1="390" y1="190" x2="470" y2="190" stroke="#1E2A8E" stroke-width="1.5"/>
  <circle cx="390" cy="190" r="3" fill="#1E2A8E"/>
  <text x="476" y="188" font-size="13" font-weight="bold" fill="#1E2A8E">Level layers</text>
  <text x="476" y="204" font-size="11" fill="#374151">flat side up, stacked square</text>

  <!-- filling + dam -->
  <line x1="390" y1="238" x2="470" y2="252" stroke="#1E2A8E" stroke-width="1.5"/>
  <circle cx="390" cy="238" r="3" fill="#1E2A8E"/>
  <text x="476" y="250" font-size="13" font-weight="bold" fill="#3E9B6B">Filling + dam</text>
  <text x="476" y="266" font-size="11" fill="#374151">soft filling held by a</text>
  <text x="476" y="280" font-size="11" fill="#374151">buttercream wall (gold)</text>

  <!-- board + dab -->
  <line x1="275" y1="338" x2="470" y2="320" stroke="#1E2A8E" stroke-width="1.5"/>
  <circle cx="275" cy="338" r="3" fill="#1E2A8E"/>
  <text x="476" y="318" font-size="13" font-weight="bold" fill="#1E2A8E">Board + anchor dab</text>
  <text x="476" y="334" font-size="11" fill="#374151">frosting glues cake to the board</text>

  <!-- order note -->
  <text x="120" y="392" font-size="12" font-weight="bold" fill="#141B5C">Build order:</text>
  <text x="120" y="410" font-size="12" fill="#374151">anchor &#8594; fill &#8594; dam &#8594; stack &#8594; chill &#8594; crumb coat &#8594; chill &#8594; final coat</text>
  <text x="120" y="432" font-size="11" fill="#C4683A">Chill between stages: the cold cake holds still and stays clean.</text>
</svg>
