<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Three Ways a Bake Rises</text>
  <text x="360" y="62" text-anchor="middle" font-size="14" fill="#374151">Different mechanisms, one shared result</text>

  <!-- three panels -->
  <g>
    <!-- Panel 1 yeast -->
    <rect x="30" y="90" width="200" height="130" rx="10" fill="#ffffff" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="130" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#3E9B6B">Biological</text>
    <text x="130" y="138" text-anchor="middle" font-size="13" fill="#374151">Yeast</text>
    <circle cx="90" cy="180" r="14" fill="#3E9B6B" opacity="0.35"/>
    <circle cx="130" cy="170" r="20" fill="#3E9B6B" opacity="0.35"/>
    <circle cx="170" cy="185" r="12" fill="#3E9B6B" opacity="0.35"/>
    <text x="130" y="208" text-anchor="middle" font-size="11" fill="#374151">slow, builds flavor</text>
  </g>
  <g>
    <!-- Panel 2 chemical -->
    <rect x="260" y="90" width="200" height="130" rx="10" fill="#ffffff" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="360" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#B8942A">Chemical</text>
    <text x="360" y="138" text-anchor="middle" font-size="13" fill="#374151">Soda and powder</text>
    <circle cx="320" cy="180" r="15" fill="#D4AF37" opacity="0.4"/>
    <circle cx="360" cy="172" r="19" fill="#D4AF37" opacity="0.4"/>
    <circle cx="400" cy="184" r="13" fill="#D4AF37" opacity="0.4"/>
    <text x="360" y="208" text-anchor="middle" font-size="11" fill="#374151">fast, no flavor</text>
  </g>
  <g>
    <!-- Panel 3 mechanical -->
    <rect x="490" y="90" width="200" height="130" rx="10" fill="#ffffff" stroke="#C4683A" stroke-width="2.5"/>
    <text x="590" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#C4683A">Mechanical</text>
    <text x="590" y="138" text-anchor="middle" font-size="13" fill="#374151">Air and steam</text>
    <circle cx="550" cy="180" r="13" fill="#C4683A" opacity="0.35"/>
    <circle cx="590" cy="171" r="19" fill="#C4683A" opacity="0.35"/>
    <circle cx="628" cy="184" r="14" fill="#C4683A" opacity="0.35"/>
    <text x="590" y="208" text-anchor="middle" font-size="11" fill="#374151">whipped or vapor</text>
  </g>

  <!-- converging arrows -->
  <line x1="130" y1="228" x2="330" y2="270" stroke="#374151" stroke-width="2"/>
  <line x1="360" y1="228" x2="360" y2="268" stroke="#374151" stroke-width="2"/>
  <line x1="590" y1="228" x2="390" y2="270" stroke="#374151" stroke-width="2"/>

  <!-- shared result -->
  <rect x="210" y="278" width="300" height="46" rx="23" fill="#1E2A8E"/>
  <text x="360" y="307" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Gas trapped by structure</text>
</svg>
