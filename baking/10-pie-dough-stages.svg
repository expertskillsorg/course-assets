<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Three Stages That Build Flake</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#374151">Cold butter, kept in visible pieces and barely handled, is the whole point.</text>

  <!-- arrows between stages -->
  <path d="M 232 190 L 258 190" stroke="#D4AF37" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M 472 190 L 498 190" stroke="#D4AF37" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D4AF37"/>
    </marker>
  </defs>

  <!-- Stage 1: pea-size butter in flour -->
  <g>
    <circle cx="120" cy="170" r="70" fill="#F3EFE2" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="104" y="150" width="13" height="10" rx="2" fill="#D4AF37"/>
    <rect x="128" y="142" width="11" height="9" rx="2" fill="#D4AF37"/>
    <rect x="96" y="176" width="12" height="9" rx="2" fill="#D4AF37"/>
    <rect x="132" y="178" width="13" height="10" rx="2" fill="#D4AF37"/>
    <rect x="114" y="192" width="11" height="8" rx="2" fill="#D4AF37"/>
    <rect x="140" y="160" width="10" height="8" rx="2" fill="#D4AF37"/>
    <rect x="90" y="158" width="10" height="8" rx="2" fill="#D4AF37"/>
    <rect x="118" y="128" width="10" height="8" rx="2" fill="#D4AF37"/>
    <text x="120" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">1. Pea-size butter</text>
    <text x="120" y="292" text-anchor="middle" font-size="12" fill="#374151">Cut cold butter into flour</text>
    <text x="120" y="308" text-anchor="middle" font-size="12" fill="#374151">until the pieces are pea-size.</text>
  </g>

  <!-- Stage 2: shaggy mix -->
  <g>
    <circle cx="360" cy="170" r="70" fill="#F3EFE2" stroke="#E5E7EB" stroke-width="2"/>
    <path d="M 320 190 Q 335 150 360 172 Q 385 148 400 188 Q 380 210 360 196 Q 338 214 320 190 Z" fill="#E7DDBE" stroke="#C4683A" stroke-width="1.5"/>
    <rect x="332" y="168" width="9" height="7" rx="2" fill="#D4AF37"/>
    <rect x="372" y="176" width="9" height="7" rx="2" fill="#D4AF37"/>
    <rect x="352" y="184" width="8" height="6" rx="2" fill="#D4AF37"/>
    <circle cx="348" cy="150" r="2" fill="#9CA3AF"/>
    <circle cx="372" cy="152" r="2" fill="#9CA3AF"/>
    <circle cx="336" cy="204" r="2" fill="#9CA3AF"/>
    <circle cx="384" cy="200" r="2" fill="#9CA3AF"/>
    <text x="360" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">2. Shaggy mix</text>
    <text x="360" y="292" text-anchor="middle" font-size="12" fill="#374151">Add ice water until a squeeze</text>
    <text x="360" y="308" text-anchor="middle" font-size="12" fill="#374151">just holds. Rough, not smooth.</text>
  </g>

  <!-- Stage 3: pressed disc with butter streaks -->
  <g>
    <ellipse cx="600" cy="170" rx="72" ry="60" fill="#E7DDBE" stroke="#C4683A" stroke-width="2"/>
    <path d="M 548 156 Q 580 148 612 158" stroke="#D4AF37" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 556 182 Q 592 176 634 186" stroke="#D4AF37" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 572 200 Q 600 196 628 202" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 566 142 Q 590 138 618 142" stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="600" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">3. Pressed disc</text>
    <text x="600" y="292" text-anchor="middle" font-size="12" fill="#374151">Press (never knead) into a disc,</text>
    <text x="600" y="308" text-anchor="middle" font-size="12" fill="#374151">still streaked with butter. Chill.</text>
  </g>

  <text x="360" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">Those gold butter pieces melt and steam in the oven, prying the dough into flakes.</text>
</svg>
