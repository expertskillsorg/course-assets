<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <text x="350" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Cookie Control Panel</text>
  <text x="350" y="58" text-anchor="middle" font-size="13" fill="#374151">Five dials, one dough. Each setting pushes the cookie toward thick or thin.</text>

  <!-- direction key bar -->
  <rect x="90" y="80" width="520" height="20" rx="10" fill="#E5E7EB"/>
  <rect x="90" y="80" width="260" height="20" rx="10" fill="#3E9B6B"/>
  <rect x="350" y="80" width="260" height="20" fill="#C4683A"/>
  <text x="100" y="94" font-size="12" font-weight="bold" fill="#ffffff">◀ thicker, chewier (structure wins)</text>
  <text x="600" y="94" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">more spread, crisper (flow wins) ▶</text>

  <!-- Dial group: reused shape at 5 centers -->
  <!-- Dial 1: Butter -->
  <g>
    <path d="M 40 210 A 46 46 0 0 1 86 164" fill="none" stroke="#3E9B6B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 86 164 A 46 46 0 0 1 132 210" fill="none" stroke="#C4683A" stroke-width="10" stroke-linecap="round"/>
    <line x1="86" y1="210" x2="86" y2="170" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="86" cy="210" r="5" fill="#1E2A8E"/>
    <text x="48" y="228" font-size="11" fill="#374151">cold</text>
    <text x="124" y="228" text-anchor="end" font-size="11" fill="#374151">warm</text>
    <text x="86" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Butter</text>
  </g>

  <!-- Dial 2: Sugar -->
  <g>
    <path d="M 170 210 A 46 46 0 0 1 216 164" fill="none" stroke="#3E9B6B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 216 164 A 46 46 0 0 1 262 210" fill="none" stroke="#C4683A" stroke-width="10" stroke-linecap="round"/>
    <line x1="216" y1="210" x2="216" y2="170" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="216" cy="210" r="5" fill="#1E2A8E"/>
    <text x="178" y="228" font-size="11" fill="#374151">brown</text>
    <text x="254" y="228" text-anchor="end" font-size="11" fill="#374151">white</text>
    <text x="216" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Sugar</text>
  </g>

  <!-- Dial 3: Flour -->
  <g>
    <path d="M 300 210 A 46 46 0 0 1 346 164" fill="none" stroke="#3E9B6B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 346 164 A 46 46 0 0 1 392 210" fill="none" stroke="#C4683A" stroke-width="10" stroke-linecap="round"/>
    <line x1="346" y1="210" x2="346" y2="170" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="346" cy="210" r="5" fill="#1E2A8E"/>
    <text x="308" y="228" font-size="11" fill="#374151">more</text>
    <text x="384" y="228" text-anchor="end" font-size="11" fill="#374151">less</text>
    <text x="346" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Flour</text>
  </g>

  <!-- Dial 4: Oven -->
  <g>
    <path d="M 430 210 A 46 46 0 0 1 476 164" fill="none" stroke="#3E9B6B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 476 164 A 46 46 0 0 1 522 210" fill="none" stroke="#C4683A" stroke-width="10" stroke-linecap="round"/>
    <line x1="476" y1="210" x2="476" y2="170" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="476" cy="210" r="5" fill="#1E2A8E"/>
    <text x="438" y="228" font-size="11" fill="#374151">hotter</text>
    <text x="514" y="228" text-anchor="end" font-size="11" fill="#374151">cooler</text>
    <text x="476" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Oven heat</text>
  </g>

  <!-- Dial 5: Chill -->
  <g>
    <path d="M 560 210 A 46 46 0 0 1 606 164" fill="none" stroke="#3E9B6B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 606 164 A 46 46 0 0 1 652 210" fill="none" stroke="#C4683A" stroke-width="10" stroke-linecap="round"/>
    <line x1="606" y1="210" x2="606" y2="170" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="606" cy="210" r="5" fill="#1E2A8E"/>
    <text x="568" y="228" font-size="11" fill="#374151">chilled</text>
    <text x="644" y="228" text-anchor="end" font-size="11" fill="#374151">none</text>
    <text x="606" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Chill</text>
  </g>

  <text x="350" y="312" text-anchor="middle" font-size="12" fill="#374151">Green side of each dial slows the spread; the terracotta side lets it flow.</text>
  <text x="350" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4AF37">Turn any dial and you aim the cookie on purpose.</text>
</svg>
