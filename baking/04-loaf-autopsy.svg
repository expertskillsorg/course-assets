<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Arial, sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#141B5C">The Loaf Autopsy: Reading the Crumb</text>
  <text x="30" y="64" font-size="14" fill="#374151">Every symptom in the slice points back to one fixable stage</text>

  <!-- Slice cross-section: domed loaf shape centered -->
  <g>
    <!-- crust outline -->
    <path d="M320 300 L320 210 Q320 120 430 118 Q540 120 540 210 L540 300 Z" fill="#C4683A" opacity="0.25" stroke="#C4683A" stroke-width="3"/>
    <!-- crumb interior -->
    <path d="M332 294 L332 212 Q332 132 430 130 Q528 132 528 212 L528 294 Z" fill="#D4AF37" opacity="0.18"/>

    <!-- good even holes (upper-middle) -->
    <circle cx="410" cy="175" r="9" fill="#ffffff" stroke="#3E9B6B" stroke-width="1.5"/>
    <circle cx="440" cy="190" r="7" fill="#ffffff" stroke="#3E9B6B" stroke-width="1.5"/>
    <circle cx="418" cy="205" r="8" fill="#ffffff" stroke="#3E9B6B" stroke-width="1.5"/>
    <circle cx="452" cy="168" r="6" fill="#ffffff" stroke="#3E9B6B" stroke-width="1.5"/>
    <circle cx="388" cy="195" r="6" fill="#ffffff" stroke="#3E9B6B" stroke-width="1.5"/>

    <!-- large tunnel (under top crust) -->
    <ellipse cx="430" cy="148" rx="34" ry="13" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>

    <!-- gummy streak (center band) -->
    <rect x="360" y="224" width="140" height="14" rx="4" fill="#374151" opacity="0.55"/>

    <!-- dense band (bottom) -->
    <rect x="332" y="262" width="196" height="32" fill="#141B5C" opacity="0.35"/>
    <text x="430" y="283" font-size="10" fill="#141B5C" text-anchor="middle">tight, heavy layer</text>
  </g>

  <!-- Labels with leader lines -->
  <!-- Good crumb -->
  <line x1="388" y1="195" x2="250" y2="170" stroke="#3E9B6B" stroke-width="1.5"/>
  <rect x="60" y="150" width="190" height="44" rx="6" fill="#3E9B6B" opacity="0.12"/>
  <text x="72" y="169" font-size="13" font-weight="bold" fill="#3E9B6B">Even open holes = good</text>
  <text x="72" y="186" font-size="11" fill="#374151">springy, no wet line</text>

  <!-- Tunnel -->
  <line x1="430" y1="148" x2="610" y2="120" stroke="#1E2A8E" stroke-width="1.5"/>
  <rect x="612" y="100" width="215" height="44" rx="6" fill="#1E2A8E" opacity="0.1"/>
  <text x="624" y="119" font-size="13" font-weight="bold" fill="#1E2A8E">Large tunnels / hollow</text>
  <text x="624" y="136" font-size="11" fill="#374151">loose shaping or overproofed</text>

  <!-- Gummy streak -->
  <line x1="500" y1="231" x2="610" y2="231" stroke="#374151" stroke-width="1.5"/>
  <rect x="612" y="210" width="215" height="44" rx="6" fill="#374151" opacity="0.1"/>
  <text x="624" y="229" font-size="13" font-weight="bold" fill="#374151">Gummy streak</text>
  <text x="624" y="246" font-size="11" fill="#374151">sliced too soon or underbaked</text>

  <!-- Dense band -->
  <line x1="360" y1="278" x2="250" y2="300" stroke="#141B5C" stroke-width="1.5"/>
  <rect x="60" y="290" width="190" height="44" rx="6" fill="#141B5C" opacity="0.1"/>
  <text x="72" y="309" font-size="13" font-weight="bold" fill="#141B5C">Dense bottom band</text>
  <text x="72" y="326" font-size="11" fill="#374151">underproofed / underbaked</text>

  <!-- Stage map footer -->
  <rect x="60" y="366" width="740" height="36" rx="6" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="76" y="389" font-size="12" fill="#374151"><tspan font-weight="bold" fill="#141B5C">Each symptom names a stage:</tspan>  tight crumb = kneading  |  dense band = proofing / baking  |  tunnels = shaping  |  gummy = cooling</text>
</svg>
