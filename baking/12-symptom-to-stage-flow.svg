<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Arial, sans-serif">
  <rect width="760" height="560" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Symptom to Stage: Where Did the Bake Go Wrong?</text>

  <!-- Start node -->
  <rect x="280" y="56" width="200" height="46" rx="23" fill="#1E2A8E"/>
  <text x="380" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Name the exact symptom</text>

  <!-- connector -->
  <line x1="380" y1="102" x2="380" y2="128" stroke="#374151" stroke-width="2"/>
  <path d="M375 122 L380 132 L385 122 Z" fill="#374151"/>

  <!-- Question diamond -->
  <polygon points="380,132 520,178 380,224 240,178" fill="#D4AF37"/>
  <text x="380" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">When did the</text>
  <text x="380" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">trouble show up?</text>

  <!-- Five stage lanes -->
  <!-- lane positions -->
  <!-- Measure -->
  <line x1="240" y1="178" x2="80" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="20" y="300" width="130" height="70" rx="8" fill="#F2F4FB" stroke="#1E2A8E" stroke-width="2"/>
  <text x="85" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">MEASURE</text>
  <text x="85" y="344" text-anchor="middle" font-size="11" fill="#374151">Wrong amounts,</text>
  <text x="85" y="358" text-anchor="middle" font-size="11" fill="#374151">scooped flour</text>

  <!-- Mix -->
  <line x1="310" y1="210" x2="245" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="170" y="300" width="130" height="70" rx="8" fill="#F2F4FB" stroke="#3E9B6B" stroke-width="2"/>
  <text x="235" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">MIX</text>
  <text x="235" y="344" text-anchor="middle" font-size="11" fill="#374151">Over/under</text>
  <text x="235" y="358" text-anchor="middle" font-size="11" fill="#374151">worked, no air</text>

  <!-- Proof/Rest -->
  <line x1="380" y1="224" x2="380" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="320" y="300" width="130" height="70" rx="8" fill="#F2F4FB" stroke="#D4AF37" stroke-width="2"/>
  <text x="385" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#B8860B">PROOF / REST</text>
  <text x="385" y="344" text-anchor="middle" font-size="11" fill="#374151">Under, over,</text>
  <text x="385" y="358" text-anchor="middle" font-size="11" fill="#374151">or too cold</text>

  <!-- Bake -->
  <line x1="450" y1="210" x2="515" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="470" y="300" width="130" height="70" rx="8" fill="#F2F4FB" stroke="#C4683A" stroke-width="2"/>
  <text x="535" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">BAKE</text>
  <text x="535" y="344" text-anchor="middle" font-size="11" fill="#374151">Wrong heat,</text>
  <text x="535" y="358" text-anchor="middle" font-size="11" fill="#374151">rack, or time</text>

  <!-- Cool -->
  <line x1="520" y1="178" x2="685" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="620" y="300" width="130" height="70" rx="8" fill="#F2F4FB" stroke="#141B5C" stroke-width="2"/>
  <text x="685" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">COOL</text>
  <text x="685" y="344" text-anchor="middle" font-size="11" fill="#374151">Cut too soon,</text>
  <text x="685" y="358" text-anchor="middle" font-size="11" fill="#374151">stored wrong</text>

  <!-- Down to suspects/single change -->
  <line x1="85" y1="370" x2="85" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="235" y1="370" x2="235" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="385" y1="370" x2="385" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="535" y1="370" x2="535" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="685" y1="370" x2="685" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="85" y1="410" x2="685" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="380" y1="410" x2="380" y2="440" stroke="#374151" stroke-width="2"/>
  <path d="M375 434 L380 444 L385 434 Z" fill="#374151"/>

  <rect x="230" y="444" width="300" height="46" rx="8" fill="#3E9B6B"/>
  <text x="380" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">List the suspects for that stage</text>
  <text x="380" y="482" text-anchor="middle" font-size="12" fill="#EAF5EE">then change ONE thing next bake</text>

  <text x="380" y="524" text-anchor="middle" font-size="12" fill="#374151" font-style="italic">The stage where the symptom appears is where you hunt for the cause.</text>
</svg>
