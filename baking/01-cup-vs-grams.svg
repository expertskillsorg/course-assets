<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">One "cup of flour" is not one amount</text>
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#374151">The cup swings by how you scoop. The grams do not move.</text>

  <!-- Left panel: volume, three heights -->
  <text x="170" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">By the cup (volume)</text>

  <!-- baseline -->
  <line x1="40" y1="330" x2="300" y2="330" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Bar 1: dip and scoop, heaviest -->
  <rect x="56" y="150" width="56" height="180" rx="3" fill="#C4683A"/>
  <text x="84" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">150 g</text>
  <text x="84" y="350" text-anchor="middle" font-size="11" fill="#374151">Dip &amp;</text>
  <text x="84" y="364" text-anchor="middle" font-size="11" fill="#374151">pack</text>

  <!-- Bar 2: level scoop, middle -->
  <rect x="142" y="192" width="56" height="138" rx="3" fill="#D4AF37"/>
  <text x="170" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">130 g</text>
  <text x="170" y="350" text-anchor="middle" font-size="11" fill="#374151">Scoop &amp;</text>
  <text x="170" y="364" text-anchor="middle" font-size="11" fill="#374151">level</text>

  <!-- Bar 3: spoon in, lightest -->
  <rect x="228" y="234" width="56" height="96" rx="3" fill="#3E9B6B"/>
  <text x="256" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">115 g</text>
  <text x="256" y="350" text-anchor="middle" font-size="11" fill="#374151">Spoon &amp;</text>
  <text x="256" y="364" text-anchor="middle" font-size="11" fill="#374151">sweep</text>

  <text x="170" y="392" text-anchor="middle" font-size="12" fill="#C4683A" font-weight="bold">Up to 30% apart</text>

  <!-- divider -->
  <line x1="340" y1="80" x2="340" y2="380" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Right panel: grams, flat -->
  <text x="490" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">By weight (grams)</text>

  <line x1="380" y1="330" x2="600" y2="330" stroke="#E5E7EB" stroke-width="2"/>

  <rect x="396" y="200" width="56" height="130" rx="3" fill="#1E2A8E"/>
  <rect x="472" y="200" width="56" height="130" rx="3" fill="#1E2A8E"/>
  <rect x="548" y="200" width="44" height="130" rx="3" fill="#1E2A8E"/>

  <line x1="388" y1="200" x2="600" y2="200" stroke="#141B5C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="490" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">120 g every time</text>

  <text x="424" y="350" text-anchor="middle" font-size="11" fill="#374151">Bake 1</text>
  <text x="500" y="350" text-anchor="middle" font-size="11" fill="#374151">Bake 2</text>
  <text x="570" y="350" text-anchor="middle" font-size="11" fill="#374151">Bake 3</text>

  <text x="490" y="392" text-anchor="middle" font-size="12" fill="#3E9B6B" font-weight="bold">Same amount, same result</text>
</svg>
