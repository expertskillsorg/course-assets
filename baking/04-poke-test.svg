<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Arial, sans-serif">
  <rect width="860" height="360" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#141B5C">The Poke Test: Reading the Three Responses</text>
  <text x="30" y="64" font-size="14" fill="#374151">Press a floured fingertip half an inch in and watch what the dent does</text>

  <!-- Underproofed -->
  <g>
    <rect x="30" y="95" width="255" height="225" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <ellipse cx="157" cy="185" rx="80" ry="52" fill="#D4AF37" opacity="0.4"/>
    <ellipse cx="157" cy="185" rx="80" ry="52" fill="none" stroke="#C4683A" stroke-width="2.5"/>
    <!-- shallow bounced-back dent -->
    <path d="M143 138 q14 8 28 0" fill="none" stroke="#C4683A" stroke-width="2.5"/>
    <!-- fast spring arrow -->
    <path d="M157 118 v-22" fill="none" stroke="#1E2A8E" stroke-width="4" stroke-linecap="round"/>
    <path d="M148 104 l9 -10 l9 10" fill="none" stroke="#1E2A8E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="157" y="262" font-size="15" font-weight="bold" fill="#C4683A" text-anchor="middle">Underproofed</text>
    <text x="157" y="285" font-size="12" fill="#374151" text-anchor="middle">Springs back fast and full</text>
    <text x="157" y="305" font-size="12" fill="#141B5C" text-anchor="middle" font-weight="bold">Give it more time</text>
  </g>

  <!-- Ready -->
  <g>
    <rect x="302" y="95" width="255" height="225" rx="8" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
    <ellipse cx="430" cy="185" rx="82" ry="54" fill="#3E9B6B" opacity="0.2"/>
    <ellipse cx="430" cy="185" rx="82" ry="54" fill="none" stroke="#3E9B6B" stroke-width="2.5"/>
    <!-- shallow lingering dent -->
    <path d="M416 150 q14 14 28 0" fill="none" stroke="#3E9B6B" stroke-width="3"/>
    <!-- slow spring arrow -->
    <path d="M430 120 v-20" fill="none" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
    <path d="M423 108 l7 -8 l7 8" fill="none" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="262" font-size="15" font-weight="bold" fill="#3E9B6B" text-anchor="middle">Ready</text>
    <text x="430" y="285" font-size="12" fill="#374151" text-anchor="middle">Springs back slowly, small dent stays</text>
    <text x="430" y="305" font-size="12" fill="#141B5C" text-anchor="middle" font-weight="bold">Shape it now</text>
  </g>

  <!-- Overproofed -->
  <g>
    <rect x="574" y="95" width="255" height="225" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M622 200 q80 -70 160 0 q-30 34 -80 34 q-50 0 -80 -34 z" fill="#D4AF37" opacity="0.3"/>
    <path d="M622 200 q80 -70 160 0" fill="none" stroke="#C4683A" stroke-width="2.5"/>
    <path d="M622 200 q30 34 80 34 q50 0 80 -34" fill="none" stroke="#C4683A" stroke-width="2.5"/>
    <!-- deep dent that stays -->
    <path d="M686 160 q16 26 32 0" fill="none" stroke="#C4683A" stroke-width="3"/>
    <!-- no spring: flat bar -->
    <path d="M690 132 h24" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    <text x="702" y="262" font-size="15" font-weight="bold" fill="#C4683A" text-anchor="middle">Overproofed</text>
    <text x="702" y="285" font-size="12" fill="#374151" text-anchor="middle">Dent stays, no recovery</text>
    <text x="702" y="305" font-size="12" fill="#141B5C" text-anchor="middle" font-weight="bold">Degas and reshape</text>
  </g>
</svg>
