<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, sans-serif">
  <rect width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Fold and stack builds the layers</text>

  <!-- Stage 1: pat flat -->
  <g>
    <rect x="30" y="90" width="130" height="34" rx="4" fill="#F1E7D0" stroke="#C4683A" stroke-width="1.5"/>
    <!-- butter flecks -->
    <circle cx="55" cy="107" r="4" fill="#D4AF37"/>
    <circle cx="85" cy="100" r="4" fill="#D4AF37"/>
    <circle cx="112" cy="112" r="4" fill="#D4AF37"/>
    <circle cx="138" cy="102" r="4" fill="#D4AF37"/>
    <circle cx="72" cy="116" r="4" fill="#D4AF37"/>
    <text x="95" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">1. Pat flat</text>
    <text x="95" y="178" text-anchor="middle" font-size="11" fill="#374151">Shaggy dough,</text>
    <text x="95" y="192" text-anchor="middle" font-size="11" fill="#374151">butter pieces visible</text>
  </g>
  <path d="M175 107 l20 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Stage 2: fold over (2 layers) -->
  <g>
    <rect x="215" y="98" width="115" height="26" rx="4" fill="#F1E7D0" stroke="#C4683A" stroke-width="1.5"/>
    <rect x="215" y="84" width="115" height="16" rx="3" fill="#EAD9B4" stroke="#C4683A" stroke-width="1.5"/>
    <circle cx="240" cy="111" r="3.5" fill="#D4AF37"/>
    <circle cx="275" cy="108" r="3.5" fill="#D4AF37"/>
    <circle cx="305" cy="113" r="3.5" fill="#D4AF37"/>
    <text x="272" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">2. Fold over</text>
    <text x="272" y="178" text-anchor="middle" font-size="11" fill="#374151">Two sheets stacked,</text>
    <text x="272" y="192" text-anchor="middle" font-size="11" fill="#374151">then pat and repeat</text>
  </g>
  <path d="M345 100 l20 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Stage 3: stacked sheets after 3-4 folds -->
  <g>
    <rect x="385" y="112" width="105" height="12" rx="2" fill="#F1E7D0" stroke="#C4683A" stroke-width="1.2"/>
    <rect x="385" y="98" width="105" height="12" rx="2" fill="#EAD9B4" stroke="#C4683A" stroke-width="1.2"/>
    <rect x="385" y="84" width="105" height="12" rx="2" fill="#F1E7D0" stroke="#C4683A" stroke-width="1.2"/>
    <rect x="385" y="70" width="105" height="12" rx="2" fill="#EAD9B4" stroke="#C4683A" stroke-width="1.2"/>
    <text x="437" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">3. Many sheets</text>
    <text x="437" y="178" text-anchor="middle" font-size="11" fill="#374151">Cut straight down,</text>
    <text x="437" y="192" text-anchor="middle" font-size="11" fill="#374151">no twisting</text>
  </g>
  <path d="M505 97 l20 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Stage 4: risen biscuit with layers + oven heat -->
  <g>
    <rect x="545" y="98" width="90" height="14" rx="2" fill="#E8C77A" stroke="#C4683A" stroke-width="1.2"/>
    <rect x="548" y="82" width="84" height="14" rx="2" fill="#F1E7D0" stroke="#C4683A" stroke-width="1.2"/>
    <rect x="551" y="66" width="78" height="14" rx="2" fill="#E8C77A" stroke="#C4683A" stroke-width="1.2"/>
    <rect x="554" y="50" width="72" height="14" rx="2" fill="#F1E7D0" stroke="#C4683A" stroke-width="1.2"/>
    <!-- steam arrows -->
    <path d="M575 46 q-4 -8 0 -16" fill="none" stroke="#3E9B6B" stroke-width="2"/>
    <path d="M605 46 q4 -8 0 -16" fill="none" stroke="#3E9B6B" stroke-width="2"/>
    <text x="590" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">4. Tall and flaky</text>
    <text x="590" y="178" text-anchor="middle" font-size="11" fill="#374151">Butter steams apart</text>
    <text x="590" y="192" text-anchor="middle" font-size="11" fill="#3E9B6B">the peelable layers</text>
  </g>

  <rect x="30" y="228" width="700" height="44" rx="6" fill="#F7F4EC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="248" text-anchor="middle" font-size="12" fill="#141B5C" font-weight="bold">Gold flecks are cold butter. Each fold stacks another sheet.</text>
  <text x="380" y="264" text-anchor="middle" font-size="12" fill="#374151">In the oven that water flashes to steam and pries the stacked sheets into flakes.</text>
</svg>
