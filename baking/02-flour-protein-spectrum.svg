<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Flour Protein Spectrum</text>
  <text x="360" y="64" text-anchor="middle" font-size="14" fill="#374151">More protein means more gluten means more chew</text>

  <!-- gradient-style bar built from segments -->
  <rect x="70" y="110" width="580" height="34" rx="17" fill="#E5E7EB"/>
  <rect x="70" y="110" width="193" height="34" fill="#3E9B6B"/>
  <rect x="263" y="110" width="194" height="34" fill="#D4AF37"/>
  <rect x="457" y="110" width="193" height="34" fill="#C4683A"/>
  <rect x="70" y="110" width="580" height="34" rx="17" fill="none" stroke="#141B5C" stroke-width="2"/>

  <!-- end labels -->
  <text x="70" y="176" text-anchor="start" font-size="13" fill="#374151">Tender crumb</text>
  <text x="650" y="176" text-anchor="end" font-size="13" fill="#374151">Chewy structure</text>

  <!-- arrow under bar -->
  <line x1="70" y1="160" x2="650" y2="160" stroke="#374151" stroke-width="1.5"/>
  <polygon points="650,160 640,155 640,165" fill="#374151"/>

  <!-- flour markers -->
  <g font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="166" y="230">Cake flour</text>
    <text x="360" y="230">All-purpose</text>
    <text x="553" y="230">Bread flour</text>
  </g>
  <g font-size="14" fill="#1E2A8E" text-anchor="middle">
    <text x="166" y="252">7 to 9%</text>
    <text x="360" y="252">10 to 12%</text>
    <text x="553" y="252">12 to 14%</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="166" y="276">tender cakes</text>
    <text x="360" y="276">everyday bakes</text>
    <text x="553" y="276">tall, open loaves</text>
  </g>

  <!-- tick marks -->
  <g stroke="#141B5C" stroke-width="2">
    <line x1="166" y1="105" x2="166" y2="149"/>
    <line x1="360" y1="105" x2="360" y2="149"/>
    <line x1="553" y1="105" x2="553" y2="149"/>
  </g>
</svg>
