<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Arial, sans-serif">
  <rect width="860" height="360" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#141B5C">The Five Mixing Methods</text>
  <text x="30" y="64" font-size="14" fill="#374151">Same ingredients, different method, different texture engineered</text>

  <!-- Panel 1: Stir-together -->
  <g>
    <rect x="30" y="90" width="150" height="230" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="105" cy="150" r="34" fill="none" stroke="#3E9B6B" stroke-width="4"/>
    <path d="M105 150 q22 -22 0 -44" fill="none" stroke="#3E9B6B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="92" cy="145" r="4" fill="#C4683A"/>
    <circle cx="118" cy="158" r="5" fill="#C4683A"/>
    <text x="105" y="215" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Stir-together</text>
    <text x="105" y="238" font-size="11" fill="#374151" text-anchor="middle">Fold just combined</text>
    <text x="105" y="285" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">Tender</text>
    <text x="105" y="303" font-size="11" fill="#374151" text-anchor="middle">muffins, quick bread</text>
  </g>

  <!-- Panel 2: Creaming -->
  <g>
    <rect x="196" y="90" width="150" height="230" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="271" cy="150" r="34" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <circle cx="262" cy="142" r="6" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="281" cy="152" r="5" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="268" cy="160" r="4" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <text x="271" y="215" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Creaming</text>
    <text x="271" y="238" font-size="11" fill="#374151" text-anchor="middle">Beat in air</text>
    <text x="271" y="285" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">Light &amp; fluffy</text>
    <text x="271" y="303" font-size="11" fill="#374151" text-anchor="middle">cakes, cookies</text>
  </g>

  <!-- Panel 3: Rubbing-in -->
  <g>
    <rect x="362" y="90" width="150" height="230" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="443" y="122" width="10" height="10" fill="#D4AF37"/>
    <rect x="425" y="135" width="9" height="9" fill="#D4AF37"/>
    <rect x="452" y="148" width="8" height="8" fill="#D4AF37"/>
    <rect x="431" y="158" width="10" height="10" fill="#D4AF37"/>
    <path d="M415 180 h56 M415 172 h56" stroke="#374151" stroke-width="2"/>
    <text x="437" y="215" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Rubbing-in</text>
    <text x="437" y="238" font-size="11" fill="#374151" text-anchor="middle">Cut cold fat in</text>
    <text x="437" y="285" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">Flaky layers</text>
    <text x="437" y="303" font-size="11" fill="#374151" text-anchor="middle">biscuits, pie</text>
  </g>

  <!-- Panel 4: Whipping -->
  <g>
    <rect x="528" y="90" width="150" height="230" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M575 180 q28 -60 56 0" fill="none" stroke="#C4683A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="590" cy="150" r="5" fill="none" stroke="#C4683A" stroke-width="2"/>
    <circle cx="603" cy="140" r="6" fill="none" stroke="#C4683A" stroke-width="2"/>
    <circle cx="616" cy="150" r="5" fill="none" stroke="#C4683A" stroke-width="2"/>
    <text x="603" y="215" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Whipping</text>
    <text x="603" y="238" font-size="11" fill="#374151" text-anchor="middle">Egg foam</text>
    <text x="603" y="285" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">Airy foam</text>
    <text x="603" y="303" font-size="11" fill="#374151" text-anchor="middle">sponges, angel food</text>
  </g>

  <!-- Panel 5: Kneading -->
  <g>
    <rect x="694" y="90" width="136" height="230" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <ellipse cx="762" cy="150" rx="40" ry="26" fill="none" stroke="#1E2A8E" stroke-width="4"/>
    <path d="M735 150 q27 -20 54 0" fill="none" stroke="#1E2A8E" stroke-width="2.5"/>
    <path d="M735 150 q27 20 54 0" fill="none" stroke="#1E2A8E" stroke-width="2.5"/>
    <text x="762" y="215" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Kneading</text>
    <text x="762" y="238" font-size="11" fill="#374151" text-anchor="middle">Build gluten</text>
    <text x="762" y="285" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">Chewy structure</text>
    <text x="762" y="303" font-size="11" fill="#374151" text-anchor="middle">yeast bread</text>
  </g>
</svg>
