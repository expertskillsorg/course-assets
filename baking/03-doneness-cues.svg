<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Arial, sans-serif">
  <rect width="780" height="400" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#141B5C">The Doneness Cue Library</text>
  <text x="30" y="64" font-size="14" fill="#374151">Every bake family announces "done" in its own way. Read the cues, not the timer.</text>

  <!-- Column 1: Cake -->
  <g>
    <rect x="30" y="90" width="230" height="280" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="30" y="90" width="230" height="46" rx="8" fill="#1E2A8E"/>
    <rect x="30" y="120" width="230" height="16" fill="#1E2A8E"/>
    <text x="145" y="120" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Cake &amp; quick bread</text>
    <path d="M70 175 q20 -18 40 0 q20 18 40 0" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <text x="145" y="205" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Springs back to touch</text>
    <text x="145" y="245" font-size="13" fill="#111827" text-anchor="middle">Edges pull from pan</text>
    <text x="145" y="285" font-size="13" fill="#111827" text-anchor="middle">Toothpick: moist crumbs,</text>
    <text x="145" y="305" font-size="13" fill="#111827" text-anchor="middle">no wet batter</text>
    <text x="145" y="345" font-size="12" fill="#3E9B6B" text-anchor="middle" font-weight="bold">Look for all three</text>
  </g>

  <!-- Column 2: Bread -->
  <g>
    <rect x="275" y="90" width="230" height="280" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="275" y="90" width="230" height="46" rx="8" fill="#C4683A"/>
    <rect x="275" y="120" width="230" height="16" fill="#C4683A"/>
    <text x="390" y="120" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Bread</text>
    <path d="M355 170 q35 -26 70 0 v10 h-70 z" fill="#C4683A"/>
    <text x="390" y="205" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Deep golden-brown</text>
    <text x="390" y="245" font-size="13" fill="#111827" text-anchor="middle">Hollow knock on base</text>
    <text x="390" y="285" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">190&#8211;210&#176;F inside</text>
    <text x="390" y="305" font-size="12" fill="#374151" text-anchor="middle">(the referee)</text>
    <text x="390" y="345" font-size="12" fill="#3E9B6B" text-anchor="middle" font-weight="bold">Trust the probe</text>
  </g>

  <!-- Column 3: Cookie -->
  <g>
    <rect x="520" y="90" width="230" height="280" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="520" y="90" width="230" height="46" rx="8" fill="#3E9B6B"/>
    <rect x="520" y="120" width="230" height="16" fill="#3E9B6B"/>
    <text x="635" y="120" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Cookie</text>
    <circle cx="635" cy="172" r="24" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <circle cx="635" cy="172" r="12" fill="#D4AF37" opacity="0.4"/>
    <text x="635" y="215" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Edges set &amp; golden</text>
    <text x="635" y="255" font-size="13" fill="#111827" text-anchor="middle">Center still soft,</text>
    <text x="635" y="275" font-size="13" fill="#111827" text-anchor="middle">slightly shiny</text>
    <text x="635" y="315" font-size="12" fill="#374151" text-anchor="middle">Carryover finishes</text>
    <text x="635" y="345" font-size="12" fill="#3E9B6B" text-anchor="middle" font-weight="bold">Pull looking underdone</text>
  </g>
</svg>
