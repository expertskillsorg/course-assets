<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">Batter Depth Changes Time and Temperature</text>
  <text x="320" y="58" text-anchor="middle" font-size="14" fill="#374151">Same batter, same oven heat, two different pours</text>

  <!-- Left: shallow pan -->
  <g>
    <text x="170" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">Shallow pour</text>
    <rect x="70" y="150" width="200" height="70" fill="none" stroke="#374151" stroke-width="3"/>
    <rect x="73" y="192" width="194" height="25" fill="#D4AF37"/>
    <path d="M170 250 L170 224" stroke="#C4683A" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="170" y="272" text-anchor="middle" font-size="12" fill="#C4683A">heat reaches center fast</text>
    <text x="290" y="208" font-size="12" fill="#374151">thin</text>

    <text x="170" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#C4683A">Hotter + shorter</text>
    <text x="170" y="340" text-anchor="middle" font-size="13" fill="#111827">raise temp ~25&#176;F</text>
    <text x="170" y="360" text-anchor="middle" font-size="13" fill="#111827">bake less time</text>
    <text x="170" y="382" text-anchor="middle" font-size="12" fill="#374151">risk: overbaked, dry</text>
  </g>

  <line x1="320" y1="90" x2="320" y2="390" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Right: deep pan -->
  <g>
    <text x="470" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">Deep pour</text>
    <rect x="390" y="120" width="160" height="130" fill="none" stroke="#374151" stroke-width="3"/>
    <rect x="393" y="150" width="154" height="97" fill="#D4AF37"/>
    <path d="M470 300 L470 254" stroke="#3E9B6B" stroke-width="3" marker-end="url(#arrowg)"/>
    <text x="470" y="322" text-anchor="middle" font-size="12" fill="#3E9B6B">heat has far to travel</text>
    <text x="560" y="203" font-size="12" fill="#374151">thick</text>

    <text x="470" y="348" text-anchor="middle" font-size="16" font-weight="bold" fill="#3E9B6B">Lower + longer</text>
    <text x="470" y="370" text-anchor="middle" font-size="13" fill="#111827">drop temp ~25&#176;F, bake longer</text>
    <text x="470" y="390" text-anchor="middle" font-size="12" fill="#374151">risk: raw middle, set edges</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4683A"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E9B6B"/>
    </marker>
  </defs>
</svg>
