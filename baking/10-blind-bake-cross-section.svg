<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Blind Bake and Bottom-Heat, in Cross-Section</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Weights hold the shape; a low rack and preheated surface drive heat into the bottom crust.</text>

  <!-- oven floor / lower rack context -->
  <rect x="70" y="330" width="580" height="16" fill="#374151"/>
  <text x="360" y="342" text-anchor="middle" font-size="10" fill="#ffffff">low oven rack</text>

  <!-- preheated steel/stone -->
  <rect x="150" y="300" width="420" height="22" rx="4" fill="#C4683A"/>
  <text x="360" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">preheated steel / stone / heavy sheet pan</text>

  <!-- heat arrows rising into the crust -->
  <g stroke="#D4AF37" stroke-width="3" fill="none">
    <path d="M 220 298 L 220 264" marker-end="url(#up)"/>
    <path d="M 290 298 L 290 264" marker-end="url(#up)"/>
    <path d="M 360 298 L 360 264" marker-end="url(#up)"/>
    <path d="M 430 298 L 430 264" marker-end="url(#up)"/>
    <path d="M 500 298 L 500 264" marker-end="url(#up)"/>
  </g>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#D4AF37"/>
    </marker>
  </defs>
  <text x="588" y="286" font-size="11" fill="#C4683A" font-weight="bold">heat up</text>

  <!-- metal pie pan -->
  <path d="M 190 258 L 205 292 L 515 292 L 530 258" fill="none" stroke="#9CA3AF" stroke-width="7" stroke-linejoin="round"/>

  <!-- crust: bottom + walls (deep gold) -->
  <path d="M 200 250 L 214 284 L 506 284 L 520 250 L 512 244 L 214 244 L 200 250 Z" fill="#D4AF37" stroke="#C4683A" stroke-width="2"/>
  <!-- fluted top edge left -->
  <path d="M 200 250 q -8 -8 0 -16 q 10 -6 16 2" fill="#D4AF37" stroke="#C4683A" stroke-width="2"/>
  <!-- fluted top edge right -->
  <path d="M 520 250 q 8 -8 0 -16 q -10 -6 -16 2" fill="#D4AF37" stroke="#C4683A" stroke-width="2"/>

  <!-- parchment sling -->
  <path d="M 224 244 L 232 200 L 300 176 L 420 176 L 488 200 L 496 244" fill="#F3EFE2" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="360" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">parchment sling</text>
  <path d="M 360 156 L 360 176" stroke="#3E9B6B" stroke-width="1.5"/>

  <!-- weights inside parchment -->
  <g fill="#1E2A8E">
    <circle cx="270" cy="220" r="7"/>
    <circle cx="292" cy="230" r="7"/>
    <circle cx="316" cy="216" r="7"/>
    <circle cx="340" cy="228" r="7"/>
    <circle cx="364" cy="216" r="7"/>
    <circle cx="388" cy="228" r="7"/>
    <circle cx="412" cy="218" r="7"/>
    <circle cx="436" cy="228" r="7"/>
    <circle cx="284" cy="208" r="7"/>
    <circle cx="400" cy="206" r="7"/>
  </g>
  <text x="600" y="212" font-size="12" font-weight="bold" fill="#1E2A8E">weights</text>
  <text x="600" y="228" font-size="11" fill="#374151">beans, rice,</text>
  <text x="600" y="242" font-size="11" fill="#374151">sugar, ceramic</text>
  <path d="M 596 218 L 452 220" stroke="#1E2A8E" stroke-width="1.5"/>

  <!-- side labels -->
  <text x="118" y="252" font-size="12" font-weight="bold" fill="#C4683A">walls held</text>
  <text x="118" y="268" font-size="11" fill="#374151">against the pan</text>
  <text x="118" y="282" font-size="11" fill="#374151">so they can't slump</text>
  <path d="M 118 246 L 200 250" stroke="#C4683A" stroke-width="1.5"/>

  <text x="360" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Weights stop slumping and doming; the hot surface below crisps the bottom instead of leaving it soggy.</text>
</svg>
