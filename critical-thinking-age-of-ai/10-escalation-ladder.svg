<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Escalation Ladder</text>
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#374151">Climb only as high as the stakes demand</text>

  <!-- ascending arrow -->
  <line x1="70" y1="360" x2="70" y2="95" stroke="#E5E7EB" stroke-width="3"/>
  <polygon points="70,82 63,98 77,98" fill="#374151"/>
  <text x="48" y="230" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 48 230)">rising stakes</text>

  <!-- Rung 1: AI draft (bottom) -->
  <rect x="110" y="300" width="470" height="70" rx="8" fill="#3E9B6B"/>
  <text x="130" y="332" font-size="17" font-weight="bold" fill="#FFFFFF">1. AI draft</text>
  <text x="130" y="354" font-size="13" fill="#FFFFFF">Orients you: explains terms, frames the question, drafts what to ask</text>

  <!-- Rung 2: verified source (middle) -->
  <rect x="110" y="205" width="470" height="70" rx="8" fill="#D4AF37"/>
  <text x="130" y="237" font-size="17" font-weight="bold" fill="#141B5C">2. Verified authoritative source</text>
  <text x="130" y="259" font-size="13" fill="#141B5C">Grounds you: the actual document, official guidance, the primary record</text>

  <!-- Rung 3: professional (top) -->
  <rect x="110" y="110" width="470" height="70" rx="8" fill="#1E2A8E"/>
  <text x="130" y="142" font-size="17" font-weight="bold" fill="#FFFFFF">3. Qualified professional</text>
  <text x="130" y="164" font-size="13" fill="#FFFFFF">Decides: reviews your specifics and makes the accountable call</text>

  <!-- side note -->
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#C4683A">For legal, medical, tax, or safety exposure, the decision lives on rung 3.</text>
</svg>
