<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Where AI bias and human bias compound</title>
  <desc id="desc">AI inherited bias on the left and human bias on the right both flow into a decision in the center, producing one confident skewed result.</desc>
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <rect x="40" y="40" width="640" height="280" rx="12" fill="#F4F6FB"/>
  <text x="360" y="28" font-family="Georgia, serif" font-size="16" fill="#141B5C" text-anchor="middle">Two slants, one decision</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="70" y="90" width="190" height="80" rx="8" fill="#1E2A8E"/>
    <text x="165" y="120" fill="#FFFFFF" text-anchor="middle">AI inherited bias</text>
    <text x="165" y="142" fill="#FFFFFF" text-anchor="middle" font-size="11">default framing,</text>
    <text x="165" y="157" fill="#FFFFFF" text-anchor="middle" font-size="11">amplified patterns</text>

    <rect x="460" y="90" width="190" height="80" rx="8" fill="#C4683A"/>
    <text x="555" y="120" fill="#FFFFFF" text-anchor="middle">Your own bias</text>
    <text x="555" y="142" fill="#FFFFFF" text-anchor="middle" font-size="11">anchoring, leading</text>
    <text x="555" y="157" fill="#FFFFFF" text-anchor="middle" font-size="11">prompts, over-trust</text>

    <rect x="270" y="208" width="180" height="64" rx="8" fill="#D4AF37"/>
    <text x="360" y="238" fill="#141B5C" text-anchor="middle">The decision</text>
    <text x="360" y="257" fill="#141B5C" text-anchor="middle" font-size="11">where they stack</text>

    <rect x="255" y="290" width="210" height="24" rx="6" fill="#3E9B6B"/>
    <text x="360" y="306" fill="#FFFFFF" text-anchor="middle" font-size="11">interrupt the loop once, early</text>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#374151"/>
    </marker>
  </defs>
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <path d="M165 170 L300 206" marker-end="url(#ah)"/>
    <path d="M555 170 L420 206" marker-end="url(#ah)"/>
  </g>
</svg>
