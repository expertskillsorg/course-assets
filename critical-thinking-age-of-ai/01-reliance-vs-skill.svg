<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The gap that hides in plain sight</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Over months of heavy AI use</text>

  <!-- plot frame -->
  <line x1="80" y1="90" x2="80" y2="320" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="580" y2="320" stroke="#374151" stroke-width="1.5"/>

  <!-- axis labels -->
  <text x="80" y="345" text-anchor="middle" font-size="12" fill="#374151">Month 1</text>
  <text x="580" y="345" text-anchor="middle" font-size="12" fill="#374151">Month 12</text>
  <text x="62" y="105" text-anchor="end" font-size="12" fill="#374151">High</text>
  <text x="62" y="318" text-anchor="end" font-size="12" fill="#374151">Low</text>

  <!-- faint gridlines -->
  <line x1="80" y1="148" x2="580" y2="148" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="80" y1="205" x2="580" y2="205" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="80" y1="262" x2="580" y2="262" stroke="#E5E7EB" stroke-width="1"/>

  <!-- output line: flat and high (terracotta dashed) -->
  <polyline points="80,118 580,114" fill="none" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- reliance line: rising (navy) -->
  <polyline points="80,250 200,225 320,190 440,150 580,108" fill="none" stroke="#1E2A8E" stroke-width="3.5"/>

  <!-- independent skill line: slowly declining (green) -->
  <polyline points="80,170 200,182 320,200 440,224 580,255" fill="none" stroke="#3E9B6B" stroke-width="3.5"/>

  <!-- the gap marker between reliance and skill at right -->
  <line x1="555" y1="116" x2="555" y2="250" stroke="#D4AF37" stroke-width="2"/>
  <text x="548" y="178" text-anchor="end" font-size="11" fill="#D4AF37" font-weight="bold">the</text>
  <text x="548" y="192" text-anchor="end" font-size="11" fill="#D4AF37" font-weight="bold">hidden</text>
  <text x="548" y="206" text-anchor="end" font-size="11" fill="#D4AF37" font-weight="bold">gap</text>

  <!-- legend -->
  <rect x="92" y="366" width="16" height="3" fill="#1E2A8E"/>
  <text x="114" y="372" font-size="11.5" fill="#1E2A8E">Reliance on AI</text>
  <rect x="232" y="366" width="16" height="3" fill="#3E9B6B"/>
  <text x="254" y="372" font-size="11.5" fill="#3E9B6B">Independent skill</text>
  <rect x="392" y="366" width="16" height="3" fill="#C4683A"/>
  <text x="414" y="372" font-size="11.5" fill="#C4683A">Output quality</text>
</svg>
