<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Keep-Your-Edge Loop</text>
  <text x="320" y="62" text-anchor="middle" font-size="14" fill="#374151">Three moves that feed each other, on repeat</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Node 1: Use AI (top) -->
  <circle cx="320" cy="150" r="58" fill="#1E2A8E"/>
  <text x="320" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Use AI</text>
  <text x="320" y="164" text-anchor="middle" font-size="12" fill="#ffffff">heavy lifting</text>

  <!-- Node 2: Check (bottom right) -->
  <circle cx="470" cy="320" r="58" fill="#3E9B6B"/>
  <text x="470" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Check</text>
  <text x="470" y="334" text-anchor="middle" font-size="12" fill="#ffffff">edge habit</text>

  <!-- Node 3: Practice (bottom left) -->
  <circle cx="170" cy="320" r="58" fill="#C4683A"/>
  <text x="170" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Practice</text>
  <text x="170" y="327" text-anchor="middle" font-size="12" fill="#ffffff">AI-free,</text>
  <text x="170" y="343" text-anchor="middle" font-size="12" fill="#ffffff">deliberate</text>

  <!-- Arc arrows forming the loop -->
  <path d="M 372 178 A 200 200 0 0 1 432 270" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 412 332 A 200 200 0 0 1 228 332" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 208 270 A 200 200 0 0 1 268 178" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="320" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">YOU STAY STEERING</text>
</svg>
