<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">One AI output through the full EDGE loop</text>

  <!-- Raw output box -->
  <rect x="40" y="62" width="200" height="64" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="140" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">RAW AI OUTPUT</text>
  <text x="140" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">"Price at $39"</text>

  <!-- arrow down from raw -->
  <line x1="140" y1="126" x2="140" y2="156" stroke="#374151" stroke-width="2"/>
  <polygon points="140,162 135,152 145,152" fill="#374151"/>

  <!-- Step E1 Examine -->
  <rect x="40" y="162" width="200" height="68" rx="8" fill="#1E2A8E"/>
  <text x="56" y="186" font-size="13" font-weight="bold" fill="#D4AF37">E — EXAMINE</text>
  <text x="56" y="206" font-size="11" fill="#FFFFFF">List claims, mark the</text>
  <text x="56" y="221" font-size="11" fill="#FFFFFF">load-bearing one: 2% churn</text>

  <!-- arrow E1 -> D -->
  <line x1="140" y1="230" x2="140" y2="256" stroke="#374151" stroke-width="2"/>
  <polygon points="140,262 135,252 145,252" fill="#374151"/>

  <!-- Step D Detect -->
  <rect x="40" y="262" width="200" height="68" rx="8" fill="#1E2A8E"/>
  <text x="56" y="286" font-size="13" font-weight="bold" fill="#D4AF37">D — DETECT</text>
  <text x="56" y="306" font-size="11" fill="#FFFFFF">Smell test: churn number</text>
  <text x="56" y="321" font-size="11" fill="#FFFFFF">is invented, framing slanted</text>

  <!-- arrow D across to G (right column) -->
  <line x1="240" y1="296" x2="300" y2="296" stroke="#374151" stroke-width="2"/>
  <polygon points="306,296 296,291 296,301" fill="#374151"/>

  <!-- Step G Gauge -->
  <rect x="306" y="262" width="200" height="68" rx="8" fill="#1E2A8E"/>
  <text x="322" y="286" font-size="13" font-weight="bold" fill="#D4AF37">G — GAUGE</text>
  <text x="322" y="306" font-size="11" fill="#FFFFFF">High stakes, low reversibility</text>
  <text x="322" y="321" font-size="11" fill="#FFFFFF">= full verification</text>

  <!-- arrow G up to Exercise -->
  <line x1="406" y1="262" x2="406" y2="236" stroke="#374151" stroke-width="2"/>
  <polygon points="406,230 401,240 411,240" fill="#374151"/>

  <!-- Step E2 Exercise -->
  <rect x="306" y="162" width="200" height="68" rx="8" fill="#3E9B6B"/>
  <text x="322" y="186" font-size="13" font-weight="bold" fill="#FFFFFF">E — EXERCISE</text>
  <text x="322" y="206" font-size="11" fill="#FFFFFF">Synthesize with market</text>
  <text x="322" y="221" font-size="11" fill="#FFFFFF">knowledge, own the call</text>

  <!-- arrow Exercise -> Owned decision -->
  <line x1="506" y1="196" x2="556" y2="196" stroke="#374151" stroke-width="2"/>
  <polygon points="562,196 552,191 552,201" fill="#374151"/>

  <!-- Owned decision box -->
  <rect x="562" y="150" width="168" height="92" rx="8" fill="#D4AF37"/>
  <text x="646" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">OWNED CALL</text>
  <text x="646" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">$35 + renewal</text>
  <text x="646" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">phase-in</text>

  <!-- One-line reason banner -->
  <rect x="40" y="372" width="690" height="56" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="60" y="394" font-size="12" font-weight="bold" fill="#374151">Defensible in one line:</text>
  <text x="60" y="414" font-size="12" fill="#111827">"Raised to $35 with a phase-in because the AI's churn number was unsupported and annual accounts carry the most risk."</text>

  <!-- caption line connecting flow -->
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">Each step feeds the next; the loop ends with a decision you can defend.</text>
</svg>
