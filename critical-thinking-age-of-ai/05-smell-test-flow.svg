<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>

  <!-- Start: AI output -->
  <rect x="270" y="20" width="180" height="48" rx="8" fill="#1E2A8E"/>
  <text x="360" y="49" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">AI output with data</text>

  <!-- connector -->
  <line x1="360" y1="68" x2="360" y2="92" stroke="#374151" stroke-width="2"/>
  <polygon points="360,100 355,90 365,90" fill="#374151"/>

  <!-- Test 1 -->
  <rect x="250" y="100" width="220" height="46" rx="8" fill="#E5E7EB" stroke="#141B5C" stroke-width="1.5"/>
  <text x="360" y="123" text-anchor="middle" fill="#111827" font-size="14" font-weight="bold">1. Too good to be true?</text>
  <text x="360" y="139" text-anchor="middle" fill="#374151" font-size="11">Suspiciously clean or convenient</text>

  <line x1="360" y1="146" x2="360" y2="166" stroke="#374151" stroke-width="2"/>
  <polygon points="360,174 355,164 365,164" fill="#374151"/>

  <!-- Test 2 -->
  <rect x="250" y="174" width="220" height="46" rx="8" fill="#E5E7EB" stroke="#141B5C" stroke-width="1.5"/>
  <text x="360" y="197" text-anchor="middle" fill="#111827" font-size="14" font-weight="bold">2. Checkable specifics?</text>
  <text x="360" y="213" text-anchor="middle" fill="#374151" font-size="11">Names, dates, numbers, quotes</text>

  <line x1="360" y1="220" x2="360" y2="240" stroke="#374151" stroke-width="2"/>
  <polygon points="360,248 355,238 365,238" fill="#374151"/>

  <!-- Test 3 -->
  <rect x="250" y="248" width="220" height="46" rx="8" fill="#E5E7EB" stroke="#141B5C" stroke-width="1.5"/>
  <text x="360" y="271" text-anchor="middle" fill="#111827" font-size="14" font-weight="bold">3. Doubt it out loud?</text>
  <text x="360" y="287" text-anchor="middle" fill="#374151" font-size="11">Ask it to defend its source</text>

  <!-- branch down to three outcomes -->
  <line x1="360" y1="294" x2="360" y2="318" stroke="#374151" stroke-width="2"/>
  <line x1="140" y1="318" x2="580" y2="318" stroke="#374151" stroke-width="2"/>
  <line x1="140" y1="318" x2="140" y2="346" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="360" y1="318" x2="360" y2="346" stroke="#D4AF37" stroke-width="2"/>
  <line x1="580" y1="318" x2="580" y2="346" stroke="#C4683A" stroke-width="2"/>
  <polygon points="140,354 135,344 145,344" fill="#3E9B6B"/>
  <polygon points="360,354 355,344 365,344" fill="#D4AF37"/>
  <polygon points="580,354 575,344 585,344" fill="#C4683A"/>

  <!-- Outcome: Trust -->
  <rect x="60" y="354" width="160" height="64" rx="8" fill="#3E9B6B"/>
  <text x="140" y="382" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">TRUST</text>
  <text x="140" y="402" text-anchor="middle" fill="#FFFFFF" font-size="11">Passes clean, low stakes</text>

  <!-- Outcome: Verify -->
  <rect x="280" y="354" width="160" height="64" rx="8" fill="#D4AF37"/>
  <text x="360" y="382" text-anchor="middle" fill="#141B5C" font-size="16" font-weight="bold">VERIFY</text>
  <text x="360" y="402" text-anchor="middle" fill="#141B5C" font-size="11">Specific and it matters</text>

  <!-- Outcome: Reject -->
  <rect x="500" y="354" width="160" height="64" rx="8" fill="#C4683A"/>
  <text x="580" y="382" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">REJECT</text>
  <text x="580" y="402" text-anchor="middle" fill="#FFFFFF" font-size="11">Source evaporates, ask again</text>

  <text x="360" y="444" text-anchor="middle" fill="#374151" font-size="11" font-style="italic">A flag is a direction, not a verdict.</text>
</svg>
