<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="A 2 by 2 matrix with stakes on the vertical axis and reversibility on the horizontal axis, each quadrant labelled with a verification level.">
  <rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/>

  <text x="380" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#141B5C">Stakes by Reversibility</text>

  <text x="38" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2A8E" transform="rotate(-90 38 300)">STAKES  (how bad if wrong)</text>
  <text x="430" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2A8E">REVERSIBILITY  (how hard to undo)</text>

  <text x="74" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">high</text>
  <text x="74" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">low</text>
  <text x="245" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">reversible</text>
  <text x="615" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">irreversible</text>

  <rect x="100" y="80" width="630" height="400" fill="none" stroke="#141B5C" stroke-width="2"/>
  <line x1="415" y1="80" x2="415" y2="480" stroke="#141B5C" stroke-width="2"/>
  <line x1="100" y1="280" x2="730" y2="280" stroke="#141B5C" stroke-width="2"/>

  <rect x="102" y="82" width="311" height="196" fill="#3E9B6B" fill-opacity="0.16"/>
  <text x="257" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">High stakes, reversible</text>
  <text x="257" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#3E9B6B">Verify the</text>
  <text x="257" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#3E9B6B">load-bearing claims</text>

  <rect x="417" y="82" width="311" height="196" fill="#C4683A" fill-opacity="0.18"/>
  <text x="572" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">High stakes, irreversible</text>
  <text x="572" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#C4683A">Full EDGE pass</text>
  <text x="572" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#C4683A">plus a second human</text>

  <rect x="102" y="282" width="311" height="196" fill="#D4AF37" fill-opacity="0.16"/>
  <text x="257" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Low stakes, reversible</text>
  <text x="257" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1E2A8E">Skim and go</text>

  <rect x="417" y="282" width="311" height="196" fill="#1E2A8E" fill-opacity="0.12"/>
  <text x="572" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Low stakes, irreversible</text>
  <text x="572" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1E2A8E">Quick check,</text>
  <text x="572" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1E2A8E">then commit</text>
</svg>
