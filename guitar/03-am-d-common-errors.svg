<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="500" fill="#FFFFFF"/>
  <text x="350" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Am and D: the shapes and their common errors</text>

  <!-- ===================== A minor (left) ===================== -->
  <text x="200" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">A minor</text>
  <!-- strings x=120,160,200,240,280,320 ; frets y=120,160,200,240 -->
  <line x1="120" y1="120" x2="320" y2="120" stroke="#141B5C" stroke-width="8"/>
  <line x1="120" y1="160" x2="320" y2="160" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="200" x2="320" y2="200" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="240" x2="320" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="160" y1="120" x2="160" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="200" y1="120" x2="200" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="240" y1="120" x2="240" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="280" y1="120" x2="280" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="320" y1="120" x2="320" y2="240" stroke="#374151" stroke-width="2"/>
  <!-- markers: E x120 X, A x160 O, hiE x320 O -->
  <text x="120" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#C4683A">X</text>
  <text x="160" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E9B6B">O</text>
  <text x="320" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E9B6B">O</text>
  <!-- dots: B x280 fret1 y140 f1 ; D x200 fret2 y180 f2 ; G x240 fret2 y180 f3 -->
  <circle cx="280" cy="140" r="12" fill="#1E2A8E"/><text x="280" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
  <circle cx="200" cy="180" r="12" fill="#1E2A8E"/><text x="200" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
  <circle cx="240" cy="180" r="12" fill="#1E2A8E"/><text x="240" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
  <!-- string names -->
  <text x="120" y="260" text-anchor="middle" font-size="11" fill="#374151">E</text>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#374151">A</text>
  <text x="200" y="260" text-anchor="middle" font-size="11" fill="#374151">D</text>
  <text x="240" y="260" text-anchor="middle" font-size="11" fill="#374151">G</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#374151">B</text>
  <text x="320" y="260" text-anchor="middle" font-size="11" fill="#374151">E</text>

  <!-- error flag Am: low E strummed -->
  <line x1="120" y1="95" x2="90" y2="330" stroke="#C4683A" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="40" y="335" width="320" height="58" rx="8" fill="#FBEEE7" stroke="#C4683A" stroke-width="1.5"/>
  <text x="55" y="357" font-size="13" font-weight="bold" fill="#C4683A">Common error:</text>
  <text x="55" y="376" font-size="13" fill="#111827">strumming the low E (marked X). Start your</text>
  <text x="55" y="391" font-size="12" fill="#111827">strum from the A string so Am rings right.</text>

  <!-- ===================== D major (right) ===================== -->
  <text x="500" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">D major</text>
  <!-- strings x=420,460,500,540,580,620 ; frets y=120,160,200,240 -->
  <line x1="420" y1="120" x2="620" y2="120" stroke="#141B5C" stroke-width="8"/>
  <line x1="420" y1="160" x2="620" y2="160" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="200" x2="620" y2="200" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="240" x2="620" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="120" x2="420" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="460" y1="120" x2="460" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="500" y1="120" x2="500" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="540" y1="120" x2="540" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="580" y1="120" x2="580" y2="240" stroke="#374151" stroke-width="2"/>
  <line x1="620" y1="120" x2="620" y2="240" stroke="#374151" stroke-width="2"/>
  <!-- markers: E x420 X, A x460 X, D x500 O -->
  <text x="420" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#C4683A">X</text>
  <text x="460" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#C4683A">X</text>
  <text x="500" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E9B6B">O</text>
  <!-- dots: G x540 fret2 y180 f1 ; hiE x620 fret2 y180 f2 ; B x580 fret3 y220 f3 -->
  <circle cx="540" cy="180" r="12" fill="#1E2A8E"/><text x="540" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
  <circle cx="620" cy="180" r="12" fill="#1E2A8E"/><text x="620" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
  <circle cx="580" cy="220" r="12" fill="#1E2A8E"/><text x="580" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
  <!-- string names -->
  <text x="420" y="260" text-anchor="middle" font-size="11" fill="#374151">E</text>
  <text x="460" y="260" text-anchor="middle" font-size="11" fill="#374151">A</text>
  <text x="500" y="260" text-anchor="middle" font-size="11" fill="#374151">D</text>
  <text x="540" y="260" text-anchor="middle" font-size="11" fill="#374151">G</text>
  <text x="580" y="260" text-anchor="middle" font-size="11" fill="#374151">B</text>
  <text x="620" y="260" text-anchor="middle" font-size="11" fill="#374151">E</text>

  <!-- error flag D: flat finger muting thin E -->
  <line x1="620" y1="192" x2="610" y2="330" stroke="#C4683A" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="360" y="335" width="320" height="58" rx="8" fill="#FBEEE7" stroke="#C4683A" stroke-width="1.5"/>
  <text x="375" y="357" font-size="13" font-weight="bold" fill="#C4683A">Common error:</text>
  <text x="375" y="376" font-size="13" fill="#111827">a flat finger deadens the thin E string.</text>
  <text x="375" y="391" font-size="12" fill="#111827">Curve the knuckles and press with fingertips.</text>

  <text x="350" y="440" text-anchor="middle" font-size="13" font-style="italic" fill="#374151">Am strums 5 strings; D strums 4. Skip the strings marked X.</text>
</svg>
