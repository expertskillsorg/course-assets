<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="520" fill="#FFFFFF"/>
  <text x="330" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Anatomy of a Chord Diagram</text>

  <!-- Grid geometry: strings x = 250,290,330,370,410,450 ; frets y = 150,190,230,270,310 -->
  <!-- Nut (thick top line) -->
  <line x1="250" y1="150" x2="450" y2="150" stroke="#141B5C" stroke-width="9"/>
  <!-- Fret lines -->
  <line x1="250" y1="190" x2="450" y2="190" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="230" x2="450" y2="230" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="270" x2="450" y2="270" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="310" x2="450" y2="310" stroke="#374151" stroke-width="2"/>
  <!-- Strings (vertical) -->
  <line x1="250" y1="150" x2="250" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="290" y1="150" x2="290" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="330" y1="150" x2="330" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="370" y1="150" x2="370" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="410" y1="150" x2="410" y2="310" stroke="#374151" stroke-width="2"/>
  <line x1="450" y1="150" x2="450" y2="310" stroke="#374151" stroke-width="2"/>

  <!-- Above-grid markers: low E x=250 (X muted), A x=290 (O open), high E x=450 (O open) -->
  <text x="250" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="#C4683A">X</text>
  <text x="290" y="136" text-anchor="middle" font-size="20" font-weight="bold" fill="#3E9B6B">O</text>
  <text x="450" y="136" text-anchor="middle" font-size="20" font-weight="bold" fill="#3E9B6B">O</text>

  <!-- Finger dots (this shape is A minor) -->
  <!-- B string (x=410) fret1 -> y between 150-190 = 170, finger 1 -->
  <circle cx="410" cy="170" r="13" fill="#1E2A8E"/>
  <text x="410" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
  <!-- D string (x=330) fret2 -> y=210, finger 2 -->
  <circle cx="330" cy="210" r="13" fill="#1E2A8E"/>
  <text x="330" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
  <!-- G string (x=370) fret2 -> y=210, finger 3 -->
  <circle cx="370" cy="210" r="13" fill="#1E2A8E"/>
  <text x="370" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>

  <!-- String name row below grid -->
  <text x="250" y="332" text-anchor="middle" font-size="12" fill="#374151">E</text>
  <text x="290" y="332" text-anchor="middle" font-size="12" fill="#374151">A</text>
  <text x="330" y="332" text-anchor="middle" font-size="12" fill="#374151">D</text>
  <text x="370" y="332" text-anchor="middle" font-size="12" fill="#374151">G</text>
  <text x="410" y="332" text-anchor="middle" font-size="12" fill="#374151">B</text>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#374151">E</text>
  <text x="350" y="352" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">low E on the left, high E on the right</text>

  <!-- Leader lines and labels -->
  <!-- Nut -->
  <line x1="150" y1="150" x2="248" y2="150" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="150" cy="150" r="3" fill="#D4AF37"/>
  <text x="145" y="146" text-anchor="end" font-size="14" font-weight="bold" fill="#111827">Nut (top edge</text>
  <text x="145" y="163" text-anchor="end" font-size="14" font-weight="bold" fill="#111827">of the neck)</text>

  <!-- Muted string X -->
  <line x1="180" y1="105" x2="245" y2="128" stroke="#C4683A" stroke-width="2"/>
  <circle cx="180" cy="105" r="3" fill="#C4683A"/>
  <text x="175" y="102" text-anchor="end" font-size="13" font-weight="bold" fill="#111827">X = do not</text>
  <text x="175" y="118" text-anchor="end" font-size="13" font-weight="bold" fill="#111827">play this string</text>

  <!-- Open string O -->
  <line x1="290" y1="90" x2="290" y2="122" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="290" cy="90" r="3" fill="#3E9B6B"/>
  <text x="300" y="82" text-anchor="start" font-size="13" font-weight="bold" fill="#111827">O = play the</text>
  <text x="300" y="98" text-anchor="start" font-size="13" font-weight="bold" fill="#111827">string open</text>

  <!-- Finger dot -->
  <line x1="410" y1="170" x2="520" y2="150" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="520" cy="150" r="3" fill="#D4AF37"/>
  <text x="530" y="146" text-anchor="start" font-size="14" font-weight="bold" fill="#111827">Dot = press here.</text>
  <text x="530" y="164" text-anchor="start" font-size="14" font-weight="bold" fill="#111827">Number = which finger</text>

  <!-- Frets label -->
  <line x1="450" y1="230" x2="540" y2="245" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="540" cy="245" r="3" fill="#D4AF37"/>
  <text x="550" y="242" text-anchor="start" font-size="14" font-weight="bold" fill="#111827">Frets (spaces</text>
  <text x="550" y="259" text-anchor="start" font-size="14" font-weight="bold" fill="#111827">count from the nut)</text>

  <!-- Strings label -->
  <line x1="250" y1="285" x2="150" y2="300" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="150" cy="300" r="3" fill="#D4AF37"/>
  <text x="145" y="297" text-anchor="end" font-size="14" font-weight="bold" fill="#111827">Vertical lines</text>
  <text x="145" y="314" text-anchor="end" font-size="14" font-weight="bold" fill="#111827">= the 6 strings</text>

  <!-- fret number ticks -->
  <text x="235" y="174" text-anchor="middle" font-size="12" fill="#374151">1</text>
  <text x="235" y="214" text-anchor="middle" font-size="12" fill="#374151">2</text>
  <text x="235" y="254" text-anchor="middle" font-size="12" fill="#374151">3</text>

  <text x="330" y="420" text-anchor="middle" font-size="13" font-style="italic" fill="#374151">This example shape is A minor.</text>
</svg>
