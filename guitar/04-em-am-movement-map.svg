<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="440" height="400" fill="#FFFFFF"/>
  <text x="220" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Em to Am: a group slide, not a still finger</text>

  <!-- String labels (low E on left) -->
  <text x="60"  y="60" text-anchor="middle" font-size="12" fill="#374151">E</text>
  <text x="110" y="60" text-anchor="middle" font-size="12" fill="#374151">A</text>
  <text x="160" y="60" text-anchor="middle" font-size="12" fill="#374151">D</text>
  <text x="210" y="60" text-anchor="middle" font-size="12" fill="#374151">G</text>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#374151">B</text>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#374151">E</text>

  <!-- Nut (thick) -->
  <rect x="55" y="68" width="260" height="6" fill="#141B5C"/>
  <!-- Frets -->
  <line x1="60" y1="130" x2="310" y2="130" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="190" x2="310" y2="190" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="250" x2="310" y2="250" stroke="#374151" stroke-width="2"/>
  <!-- Strings -->
  <line x1="60"  y1="71" x2="60"  y2="250" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="110" y1="71" x2="110" y2="250" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="160" y1="71" x2="160" y2="250" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="210" y1="71" x2="210" y2="250" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="260" y1="71" x2="260" y2="250" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="310" y1="71" x2="310" y2="250" stroke="#1E2A8E" stroke-width="2"/>

  <!-- Fret number labels -->
  <text x="42" y="104" text-anchor="middle" font-size="11" fill="#374151">1</text>
  <text x="42" y="164" text-anchor="middle" font-size="11" fill="#374151">2</text>

  <defs>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 Z" fill="#D4AF37"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 Z" fill="#3E9B6B"/>
    </marker>
    <marker id="arrowTerra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 Z" fill="#C4683A"/>
    </marker>
  </defs>

  <!-- Group slide arrows at the 2nd fret -->
  <!-- Middle finger slides A string -> D string -->
  <line x1="124" y1="160" x2="146" y2="160" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrowGold)"/>
  <!-- Ring finger slides D string -> G string -->
  <line x1="174" y1="160" x2="196" y2="160" stroke="#3E9B6B" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <!-- Index finger lands fresh on B string, 1st fret -->
  <line x1="260" y1="80" x2="260" y2="90" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrowTerra)"/>

  <!-- Em start: middle on A string, 2nd fret (hollow, shows it leaves) -->
  <circle cx="110" cy="160" r="14" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="110" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#B8942A">2</text>

  <!-- Shared note handoff at D string, 2nd fret: ring leaves (green ring), middle arrives (gold fill) -->
  <circle cx="160" cy="160" r="17" fill="none" stroke="#3E9B6B" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="160" cy="160" r="14" fill="#D4AF37" stroke="#141B5C" stroke-width="2"/>
  <text x="160" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">2</text>

  <!-- Am arrival: ring on G string, 2nd fret (green filled) -->
  <circle cx="210" cy="160" r="14" fill="#3E9B6B" stroke="#141B5C" stroke-width="2"/>
  <text x="210" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>

  <!-- Am arrival: index on B string, 1st fret (terracotta filled) -->
  <circle cx="260" cy="100" r="14" fill="#C4683A" stroke="#141B5C" stroke-width="2"/>
  <text x="260" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>

  <!-- Legend -->
  <circle cx="80" cy="300" r="9" fill="#D4AF37" stroke="#141B5C" stroke-width="1.5"/>
  <text x="96" y="304" font-size="12" fill="#111827">Middle finger slides one string over (A to D)</text>

  <circle cx="80" cy="325" r="9" fill="#3E9B6B" stroke="#141B5C" stroke-width="1.5"/>
  <text x="96" y="329" font-size="12" fill="#111827">Ring finger slides one string over (D to G)</text>

  <circle cx="80" cy="350" r="9" fill="#C4683A" stroke="#141B5C" stroke-width="1.5"/>
  <text x="96" y="354" font-size="12" fill="#111827">Index finger lands fresh on the B string</text>

  <text x="80" y="378" font-size="11" fill="#374151">The D-string, 2nd-fret note keeps sounding: ring hands it off to middle (shared note, not a shared finger).</text>
</svg>
