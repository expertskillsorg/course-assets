<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#FFFFFF"/>
  <text x="380" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">The 20-Minute Session</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#374151">Four blocks, one job each, start to finish.</text>

  <!-- Timeline bar: total width 660 (x 50 to 710) maps to 20 minutes -> 33 px per minute -->
  <!-- Block 1: 2 min, x 50 to 116 -->
  <rect x="50" y="110" width="66" height="70" fill="#3E9B6B"/>
  <!-- Block 2: 8 min, x 116 to 380 -->
  <rect x="116" y="110" width="264" height="70" fill="#1E2A8E"/>
  <!-- Block 3: 7 min, x 380 to 611 -->
  <rect x="380" y="110" width="231" height="70" fill="#C4683A"/>
  <!-- Block 4: 3 min, x 611 to 710 -->
  <rect x="611" y="110" width="99" height="70" fill="#D4AF37"/>

  <!-- Block labels inside -->
  <g text-anchor="middle" fill="#FFFFFF" font-weight="bold">
    <text x="83" y="140" font-size="20">2</text>
    <text x="83" y="162" font-size="11">min</text>
    <text x="248" y="140" font-size="20">8</text>
    <text x="248" y="162" font-size="11">min</text>
    <text x="495" y="140" font-size="20">7</text>
    <text x="495" y="162" font-size="11">min</text>
  </g>
  <g text-anchor="middle" fill="#141B5C" font-weight="bold">
    <text x="660" y="140" font-size="20">3</text>
    <text x="660" y="162" font-size="11">min</text>
  </g>

  <!-- Minute axis -->
  <line x1="50" y1="192" x2="710" y2="192" stroke="#E5E7EB" stroke-width="1"/>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="50" y="210">0</text>
    <text x="380" y="210">10</text>
    <text x="710" y="210">20</text>
  </g>

  <!-- Callout cards below -->
  <g>
    <rect x="50" y="235" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="60" y="258" font-size="13" font-weight="bold" fill="#3E9B6B">Warm up</text>
    <text x="60" y="280" font-size="11" fill="#374151">Tune all six strings,</text>
    <text x="60" y="296" font-size="11" fill="#374151">loosen the hands on</text>
    <text x="60" y="312" font-size="11" fill="#374151">something easy.</text>
  </g>
  <g>
    <rect x="210" y="235" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="220" y="258" font-size="13" font-weight="bold" fill="#1E2A8E">New material</text>
    <text x="220" y="280" font-size="11" fill="#374151">The one new thing</text>
    <text x="220" y="296" font-size="11" fill="#374151">this week. The block</text>
    <text x="220" y="312" font-size="11" fill="#374151">where you grow.</text>
  </g>
  <g>
    <rect x="400" y="235" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
    <text x="410" y="258" font-size="13" font-weight="bold" fill="#C4683A">Drill</text>
    <text x="410" y="280" font-size="11" fill="#374151">Focused repetition</text>
    <text x="410" y="296" font-size="11" fill="#374151">of a skill you have</text>
    <text x="410" y="312" font-size="11" fill="#374151">started but not nailed.</text>
  </g>
  <g>
    <rect x="560" y="235" width="150" height="110" rx="6" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <text x="570" y="258" font-size="13" font-weight="bold" fill="#B8942A">Play for fun</text>
    <text x="570" y="280" font-size="11" fill="#374151">End on music you</text>
    <text x="570" y="296" font-size="11" fill="#374151">already know. This</text>
    <text x="570" y="312" font-size="11" fill="#374151">block is mandatory.</text>
  </g>
</svg>
