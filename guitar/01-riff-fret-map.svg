<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="880" height="300" fill="#FFFFFF"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Your First Riff (4th string, the D string)</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#374151">Play left to right, one note per pluck. Numbers in circles are frets; text below is the finger.</text>

  <!-- string line -->
  <line x1="40" y1="150" x2="840" y2="150" stroke="#374151" stroke-width="3"/>

  <!-- 12 notes: fret, finger -->
  <!-- helper: circle at x=150, gap 62 -->
  <g font-family="Arial, sans-serif">
    <!-- 0 open -->
    <circle cx="70" cy="150" r="22" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2.5"/>
    <text x="70" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">0</text>
    <text x="70" y="210" text-anchor="middle" font-size="12" fill="#374151">open</text>

    <!-- 3 finger1 -->
    <circle cx="140" cy="150" r="22" fill="#1E2A8E"/>
    <text x="140" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="140" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 1</text>

    <!-- 5 finger3 -->
    <circle cx="210" cy="150" r="22" fill="#3E9B6B"/>
    <text x="210" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="210" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 3</text>

    <!-- 0 -->
    <circle cx="280" cy="150" r="22" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2.5"/>
    <text x="280" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">0</text>
    <text x="280" y="210" text-anchor="middle" font-size="12" fill="#374151">open</text>

    <!-- 3 -->
    <circle cx="350" cy="150" r="22" fill="#1E2A8E"/>
    <text x="350" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="350" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 1</text>

    <!-- 5 -->
    <circle cx="420" cy="150" r="22" fill="#3E9B6B"/>
    <text x="420" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="420" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 3</text>

    <!-- 0 -->
    <circle cx="490" cy="150" r="22" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2.5"/>
    <text x="490" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">0</text>
    <text x="490" y="210" text-anchor="middle" font-size="12" fill="#374151">open</text>

    <!-- 3 -->
    <circle cx="560" cy="150" r="22" fill="#1E2A8E"/>
    <text x="560" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="560" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 1</text>

    <!-- 6 finger4 -->
    <circle cx="630" cy="150" r="22" fill="#C4683A"/>
    <text x="630" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">6</text>
    <text x="630" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 4</text>

    <!-- 5 -->
    <circle cx="700" cy="150" r="22" fill="#3E9B6B"/>
    <text x="700" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="700" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 3</text>

    <!-- 3 -->
    <circle cx="770" cy="150" r="22" fill="#1E2A8E"/>
    <text x="770" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="770" y="210" text-anchor="middle" font-size="12" fill="#374151">finger 1</text>

    <!-- 0 -->
    <circle cx="840" cy="150" r="22" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2.5"/>
    <text x="840" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">0</text>
    <text x="840" y="210" text-anchor="middle" font-size="12" fill="#374151">open</text>
  </g>

  <text x="440" y="268" text-anchor="middle" font-size="13" fill="#374151">Say it aloud as you play: open, three, five, open, three, five, open, three, six, five, three, open.</text>
</svg>
