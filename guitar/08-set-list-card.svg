<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#FFFFFF"/>
  <rect x="20" y="20" width="480" height="360" rx="12" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="3"/>

  <!-- Header -->
  <rect x="20" y="20" width="480" height="52" rx="12" fill="#1E2A8E"/>
  <rect x="20" y="48" width="480" height="24" fill="#1E2A8E"/>
  <text x="260" y="53" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">MY SET LIST</text>

  <!-- Column headers -->
  <text x="44" y="98" fill="#374151" font-size="12" font-weight="bold">SONG</text>
  <text x="250" y="98" fill="#374151" font-size="12" font-weight="bold">1st CHORD</text>
  <text x="345" y="98" fill="#374151" font-size="12" font-weight="bold">PATTERN</text>
  <text x="445" y="98" fill="#374151" font-size="12" font-weight="bold">TEMPO</text>
  <line x1="40" y1="106" x2="480" y2="106" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Row 1 -->
  <circle cx="52" cy="132" r="13" fill="#3E9B6B"/>
  <text x="52" y="137" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">1</text>
  <text x="76" y="130" fill="#111827" font-size="14" font-weight="bold">The easy two-chord one</text>
  <text x="76" y="146" fill="#374151" font-size="11" font-style="italic">most automatic</text>
  <text x="250" y="137" fill="#111827" font-size="14">Em</text>
  <text x="345" y="137" fill="#111827" font-size="13">D-DU-UDU</text>
  <text x="445" y="137" fill="#111827" font-size="13">easy</text>
  <line x1="40" y1="160" x2="480" y2="160" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 2 -->
  <circle cx="52" cy="192" r="13" fill="#C4683A"/>
  <text x="52" y="197" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">2</text>
  <text x="76" y="190" fill="#111827" font-size="14" font-weight="bold">The four-chord folk one</text>
  <text x="76" y="206" fill="#374151" font-size="11" font-style="italic">hardest, play it steady</text>
  <text x="250" y="197" fill="#111827" font-size="14">G</text>
  <text x="345" y="197" fill="#111827" font-size="13">D-DU-UDU</text>
  <text x="445" y="197" fill="#111827" font-size="13">medium</text>
  <line x1="40" y1="220" x2="480" y2="220" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 3 -->
  <circle cx="52" cy="252" r="13" fill="#D4AF37"/>
  <text x="52" y="257" text-anchor="middle" fill="#141B5C" font-size="14" font-weight="bold">3</text>
  <text x="76" y="250" fill="#111827" font-size="14" font-weight="bold">The one they all know</text>
  <text x="76" y="266" fill="#374151" font-size="11" font-style="italic">crowd-pleaser, finish smiling</text>
  <text x="250" y="257" fill="#111827" font-size="14">C</text>
  <text x="345" y="257" fill="#111827" font-size="13">all downs</text>
  <text x="445" y="257" fill="#111827" font-size="13">relaxed</text>
  <line x1="40" y1="280" x2="480" y2="280" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Footer reminder -->
  <rect x="40" y="298" width="440" height="62" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="322" fill="#C4683A" font-size="13" font-weight="bold">REMINDER</text>
  <text x="56" y="342" fill="#374151" font-size="12.5">Start song 1 a touch slow. If a chord slips, keep strumming</text>
  <text x="56" y="356" fill="#374151" font-size="12.5">and rejoin on the next "1." Never stop.</text>
</svg>
