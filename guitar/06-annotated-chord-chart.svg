<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="Arial, sans-serif">
  <rect width="660" height="460" fill="#ffffff"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Chord Chart, Fully Labeled</text>

  <!-- VERSE section -->
  <text x="40" y="72" font-size="14" font-weight="bold" fill="#C4683A">VERSE</text>
  <!-- four bars -->
  <g>
    <rect x="40"  y="84" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="170" y="84" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="300" y="84" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="430" y="84" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="105" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">G</text>
    <text x="235" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">Em</text>
    <text x="365" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">C</text>
    <text x="495" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">D</text>
  </g>
  <!-- repeat mark -->
  <rect x="562" y="84" width="16" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <circle cx="570" cy="102" r="2.5" fill="#374151"/>
  <circle cx="570" cy="118" r="2.5" fill="#374151"/>
  <text x="600" y="118" font-size="15" font-weight="bold" fill="#3E9B6B">x2</text>

  <!-- CHORUS section -->
  <text x="40" y="192" font-size="14" font-weight="bold" fill="#C4683A">CHORUS</text>
  <g>
    <rect x="40"  y="204" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="170" y="204" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="300" y="204" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="430" y="204" width="130" height="52" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="105" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">C</text>
    <text x="235" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">G</text>
    <!-- split bar: Am / D two beats each -->
    <text x="345" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">Am</text>
    <text x="365" y="238" text-anchor="middle" font-size="18" fill="#374151">/</text>
    <text x="388" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">D</text>
    <text x="495" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">G</text>
  </g>

  <!-- annotation callouts -->
  <!-- section label arrow -->
  <line x1="70" y1="66" x2="70" y2="30" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="80" y="26" font-size="11.5" fill="#374151">not shown here to keep it clean</text>

  <!-- one box = one bar -->
  <line x1="105" y1="136" x2="105" y2="300" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="60" y="318" font-size="12" fill="#374151">One box = one bar = 4 beats. Strum</text>
  <text x="60" y="334" font-size="12" fill="#374151">the named chord for the whole bar.</text>

  <!-- repeat annotation -->
  <line x1="590" y1="112" x2="620" y2="150" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="470" y="168" font-size="12" fill="#374151">Repeat dots + "x2" mean play</text>
  <text x="470" y="184" font-size="12" fill="#374151">this whole line twice.</text>

  <!-- split bar annotation -->
  <line x1="365" y1="256" x2="365" y2="300" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="300" y="318" font-size="12" fill="#374151">A slash splits one bar: two beats</text>
  <text x="300" y="334" font-size="12" fill="#374151">of Am, then two beats of D.</text>

  <!-- legend box -->
  <rect x="40" y="360" width="580" height="82" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="56" y="384" font-size="13" font-weight="bold" fill="#141B5C">Read it like a route before you drive:</text>
  <text x="56" y="406" font-size="12.5" fill="#374151">VERSE (G Em C D, twice)  →  CHORUS (C G  Am/D  G)  →  back to VERSE.</text>
  <text x="56" y="426" font-size="12.5" fill="#374151">Section labels tell you where you are; boxes tell you what to play; marks tell you how many times.</text>
</svg>
