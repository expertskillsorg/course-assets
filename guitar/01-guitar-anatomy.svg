<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" fill="#FFFFFF"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Parts of the Guitar</text>

  <!-- Neck -->
  <rect x="150" y="150" width="330" height="120" fill="#374151"/>
  <!-- Headstock -->
  <path d="M150 150 L90 138 Q60 134 60 158 L60 262 Q60 286 90 282 L150 270 Z" fill="#1E2A8E"/>
  <!-- Nut -->
  <rect x="146" y="150" width="8" height="120" fill="#D4AF37"/>
  <!-- Frets -->
  <line x1="205" y1="150" x2="205" y2="270" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="260" y1="150" x2="260" y2="270" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="315" y1="150" x2="315" y2="270" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="370" y1="150" x2="370" y2="270" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="425" y1="150" x2="425" y2="270" stroke="#E5E7EB" stroke-width="3"/>

  <!-- Body -->
  <ellipse cx="620" cy="210" rx="145" ry="118" fill="#C4683A"/>
  <ellipse cx="600" cy="210" rx="44" ry="44" fill="#141B5C"/>
  <!-- Bridge -->
  <rect x="672" y="182" width="20" height="56" rx="4" fill="#141B5C"/>

  <!-- Strings -->
  <line x1="70" y1="162" x2="686" y2="188" stroke="#111827" stroke-width="1.4"/>
  <line x1="70" y1="182" x2="686" y2="196" stroke="#111827" stroke-width="1.6"/>
  <line x1="70" y1="202" x2="686" y2="204" stroke="#111827" stroke-width="1.9"/>
  <line x1="70" y1="222" x2="686" y2="216" stroke="#111827" stroke-width="2.2"/>
  <line x1="70" y1="242" x2="686" y2="224" stroke="#111827" stroke-width="2.6"/>
  <line x1="70" y1="260" x2="686" y2="232" stroke="#111827" stroke-width="3"/>

  <!-- Tuning pegs -->
  <circle cx="96" cy="150" r="7" fill="#D4AF37"/>
  <circle cx="112" cy="150" r="7" fill="#D4AF37"/>
  <circle cx="128" cy="150" r="7" fill="#D4AF37"/>
  <circle cx="96" cy="270" r="7" fill="#D4AF37"/>
  <circle cx="112" cy="270" r="7" fill="#D4AF37"/>
  <circle cx="128" cy="270" r="7" fill="#D4AF37"/>

  <!-- String numbers -->
  <text x="702" y="192" font-size="13" fill="#374151">1 (thinnest)</text>
  <text x="702" y="236" font-size="13" fill="#374151">6 (thickest)</text>

  <!-- Labels with leader lines -->
  <g font-size="14" fill="#111827">
    <!-- Headstock -->
    <line x1="100" y1="120" x2="100" y2="138" stroke="#374151" stroke-width="1"/>
    <text x="100" y="110" text-anchor="middle">Headstock</text>
    <!-- Tuning pegs -->
    <line x1="112" y1="300" x2="112" y2="277" stroke="#374151" stroke-width="1"/>
    <text x="112" y="320" text-anchor="middle">Tuning pegs</text>
    <!-- Nut -->
    <line x1="150" y1="132" x2="150" y2="150" stroke="#374151" stroke-width="1"/>
    <text x="150" y="126" text-anchor="middle" fill="#1E2A8E" font-weight="bold">Nut</text>
    <!-- Neck -->
    <line x1="300" y1="300" x2="300" y2="270" stroke="#374151" stroke-width="1"/>
    <text x="300" y="320" text-anchor="middle">Neck</text>
    <!-- Frets -->
    <line x1="340" y1="132" x2="340" y2="150" stroke="#374151" stroke-width="1"/>
    <text x="340" y="126" text-anchor="middle">Frets</text>
    <!-- Body -->
    <line x1="620" y1="340" x2="620" y2="322" stroke="#374151" stroke-width="1"/>
    <text x="620" y="360" text-anchor="middle">Body</text>
    <!-- Bridge -->
    <line x1="682" y1="132" x2="682" y2="182" stroke="#374151" stroke-width="1"/>
    <text x="682" y="126" text-anchor="middle">Bridge</text>
    <!-- Strings -->
    <line x1="470" y1="112" x2="470" y2="200" stroke="#374151" stroke-width="1"/>
    <text x="470" y="106" text-anchor="middle">Strings (1-6)</text>
  </g>
</svg>
