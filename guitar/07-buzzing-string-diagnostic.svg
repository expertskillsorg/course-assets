<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Arial, sans-serif">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">Buzzing String: Symptom to Fix</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Isolate the one bad string, then check causes in order of likelihood.</text>

  <!-- Start -->
  <rect x="270" y="76" width="220" height="46" rx="23" fill="#1E2A8E"/>
  <text x="380" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Strum: pick the buzzing string alone</text>

  <!-- connector -->
  <line x1="380" y1="122" x2="380" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="380,150 375,140 385,140" fill="#374151"/>

  <!-- Check 1 Placement -->
  <rect x="250" y="150" width="260" height="58" rx="8" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <text x="380" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">1. Placement</text>
  <text x="380" y="195" text-anchor="middle" font-size="12" fill="#374151">Finger sitting in the middle of the fret?</text>
  <!-- fix branch -->
  <line x1="510" y1="179" x2="600" y2="179" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="600,179 590,174 590,184" fill="#3E9B6B"/>
  <rect x="600" y="156" width="150" height="46" rx="8" fill="#3E9B6B"/>
  <text x="675" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIX: slide forward,</text>
  <text x="675" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">just behind the fret</text>
  <text x="556" y="174" text-anchor="middle" font-size="10" font-style="italic" fill="#374151">yes</text>

  <line x1="380" y1="208" x2="380" y2="234" stroke="#374151" stroke-width="2"/>
  <polygon points="380,234 375,224 385,224" fill="#374151"/>
  <text x="393" y="224" font-size="10" font-style="italic" fill="#374151">still buzzing</text>

  <!-- Check 2 Curve -->
  <rect x="250" y="234" width="260" height="58" rx="8" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <text x="380" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">2. Curve</text>
  <text x="380" y="279" text-anchor="middle" font-size="12" fill="#374151">Flat finger deadening the next string?</text>
  <line x1="510" y1="263" x2="600" y2="263" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="600,263 590,258 590,268" fill="#3E9B6B"/>
  <rect x="600" y="240" width="150" height="46" rx="8" fill="#3E9B6B"/>
  <text x="675" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIX: curl the knuckle,</text>
  <text x="675" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">press on the fingertip</text>
  <text x="556" y="258" text-anchor="middle" font-size="10" font-style="italic" fill="#374151">yes</text>

  <line x1="380" y1="292" x2="380" y2="318" stroke="#374151" stroke-width="2"/>
  <polygon points="380,318 375,308 385,308" fill="#374151"/>
  <text x="393" y="308" font-size="10" font-style="italic" fill="#374151">still buzzing</text>

  <!-- Check 3 Pressure -->
  <rect x="250" y="318" width="260" height="58" rx="8" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <text x="380" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">3. Pressure</text>
  <text x="380" y="363" text-anchor="middle" font-size="12" fill="#374151">Not enough firm contact?</text>
  <line x1="510" y1="347" x2="600" y2="347" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="600,347 590,342 590,352" fill="#3E9B6B"/>
  <rect x="600" y="324" width="150" height="46" rx="8" fill="#3E9B6B"/>
  <text x="675" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIX: add pressure,</text>
  <text x="675" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">not a death grip</text>
  <text x="556" y="342" text-anchor="middle" font-size="10" font-style="italic" fill="#374151">yes</text>

  <line x1="380" y1="376" x2="380" y2="402" stroke="#374151" stroke-width="2"/>
  <polygon points="380,402 375,392 385,392" fill="#374151"/>
  <text x="393" y="392" font-size="10" font-style="italic" fill="#374151">still buzzing</text>

  <!-- Check 4 Setup -->
  <rect x="250" y="402" width="260" height="58" rx="8" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <text x="380" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">4. Setup (least likely)</text>
  <text x="380" y="447" text-anchor="middle" font-size="12" fill="#374151">Strings too high or worn out?</text>
  <line x1="510" y1="431" x2="600" y2="431" stroke="#C4683A" stroke-width="2"/>
  <polygon points="600,431 590,426 590,436" fill="#C4683A"/>
  <rect x="600" y="408" width="150" height="46" rx="8" fill="#C4683A"/>
  <text x="675" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FIX: cheap shop setup</text>
  <text x="675" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">or fresh strings</text>
  <text x="556" y="426" text-anchor="middle" font-size="10" font-style="italic" fill="#374151">yes</text>

  <!-- Clean end -->
  <line x1="380" y1="460" x2="380" y2="490" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="380,490 375,480 385,480" fill="#3E9B6B"/>
  <rect x="280" y="490" width="200" height="46" rx="23" fill="#D4AF37"/>
  <text x="380" y="519" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">String rings clean</text>
</svg>
