<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="Arial, sans-serif">
  <rect width="660" height="400" fill="#ffffff"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Reading Tab: the Module 1 Riff</text>

  <!-- string letters at left -->
  <text x="44" y="94"  text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">e</text>
  <text x="44" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">B</text>
  <text x="44" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">G</text>
  <text x="44" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">D</text>
  <text x="44" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">A</text>
  <text x="44" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">E</text>

  <!-- six horizontal string lines (top = thinnest, high E) -->
  <line x1="60" y1="90"  x2="600" y2="90"  stroke="#374151" stroke-width="1.3"/>
  <line x1="60" y1="120" x2="600" y2="120" stroke="#374151" stroke-width="1.3"/>
  <line x1="60" y1="150" x2="600" y2="150" stroke="#374151" stroke-width="1.3"/>
  <line x1="60" y1="180" x2="600" y2="180" stroke="#C4683A" stroke-width="1.8"/>
  <line x1="60" y1="210" x2="600" y2="210" stroke="#374151" stroke-width="1.3"/>
  <line x1="60" y1="240" x2="600" y2="240" stroke="#374151" stroke-width="1.3"/>

  <!-- left barline -->
  <line x1="60" y1="90" x2="60" y2="240" stroke="#141B5C" stroke-width="2.5"/>
  <!-- TAB label -->
  <text x="72" y="130" font-size="15" font-weight="bold" fill="#1E2A8E" transform="rotate(-90 72 165)">TAB</text>

  <!-- fret numbers on the D string (4th line from top, y=180), read left to right -->
  <!-- phrase: 0 3 5 | 0 3 5 | 0 3 6 5 | 3 0 -->
  <text x="96"  y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">0</text>
  <text x="126" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">3</text>
  <text x="156" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">5</text>
  <!-- barline -->
  <line x1="180" y1="90" x2="180" y2="240" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="210" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">0</text>
  <text x="240" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">3</text>
  <text x="270" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">5</text>
  <!-- barline -->
  <line x1="300" y1="90" x2="300" y2="240" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="330" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">0</text>
  <text x="360" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">3</text>
  <text x="390" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">6</text>
  <text x="420" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">5</text>
  <!-- barline -->
  <line x1="444" y1="90" x2="444" y2="240" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="474" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">3</text>
  <text x="504" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">0</text>
  <!-- right barline (final) -->
  <line x1="596" y1="90" x2="596" y2="240" stroke="#141B5C" stroke-width="2.5"/>

  <!-- annotations -->
  <line x1="156" y1="175" x2="200" y2="286" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="70" y="304" font-size="12" fill="#374151">Numbers are FRETS, not fingers. "5" = press the 5th fret</text>
  <text x="70" y="320" font-size="12" fill="#374151">of the D string. "0" = play that string open.</text>

  <text x="70" y="348" font-size="12" fill="#374151">Read left to right in time. A number by itself = one note at a time (a riff).</text>
  <text x="70" y="366" font-size="12" fill="#374151">Numbers stacked in a column would be strummed together. Top line = thinnest string.</text>

  <text x="330" y="384" text-anchor="middle" font-size="11.5" font-style="italic" fill="#374151">This is the exact riff you played in Module 1, now written down.</text>
</svg>
