<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="520" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Stress Ladder: Calm to Critical</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Step in at the bottom rungs, long before a dog reaches the top.</text>

  <!-- arrow up the side -->
  <line x1="40" y1="470" x2="40" y2="92" stroke="#374151" stroke-width="2"/>
  <polygon points="40,80 34,96 46,96" fill="#374151"/>
  <text x="22" y="290" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 22 290)">rising stress</text>

  <!-- CRITICAL band (top) -->
  <rect x="70" y="92" width="540" height="92" rx="8" fill="#C4683A"/>
  <text x="90" y="118" font-size="15" font-weight="bold" fill="#ffffff">CRITICAL: do not push past</text>
  <text x="90" y="140" font-size="13" fill="#ffffff">Hard freeze and stare, low growl, lifted lips</text>
  <text x="90" y="160" font-size="13" fill="#ffffff">Air snap, then a bite</text>
  <text x="588" y="135" text-anchor="end" font-size="40" font-weight="bold" fill="#ffffff" opacity="0.45">4</text>

  <!-- HIGH band -->
  <rect x="70" y="196" width="540" height="92" rx="8" fill="#D4AF37"/>
  <text x="90" y="222" font-size="15" font-weight="bold" fill="#141B5C">RISING: take a real break</text>
  <text x="90" y="244" font-size="13" fill="#141B5C">Panting when not hot, trembling, tail tucked tight</text>
  <text x="90" y="264" font-size="13" fill="#141B5C">Trying to climb off the table or hide</text>
  <text x="588" y="239" text-anchor="end" font-size="40" font-weight="bold" fill="#141B5C" opacity="0.4">3</text>

  <!-- EARLY band -->
  <rect x="70" y="300" width="540" height="92" rx="8" fill="#3E9B6B"/>
  <text x="90" y="326" font-size="15" font-weight="bold" fill="#ffffff">EARLY: slow down and reassure</text>
  <text x="90" y="348" font-size="13" fill="#ffffff">Lip licks with no food, big yawns, looking away</text>
  <text x="90" y="368" font-size="13" fill="#ffffff">Whale eye (white showing), a lifted paw held still</text>
  <text x="588" y="343" text-anchor="end" font-size="40" font-weight="bold" fill="#ffffff" opacity="0.45">2</text>

  <!-- CALM band (bottom) -->
  <rect x="70" y="404" width="540" height="74" rx="8" fill="#1E2A8E"/>
  <text x="90" y="430" font-size="15" font-weight="bold" fill="#ffffff">CALM: this is your goal</text>
  <text x="90" y="452" font-size="13" fill="#ffffff">Loose body, soft eyes, tail and ears relaxed</text>
  <text x="90" y="470" font-size="13" fill="#ffffff">Takes a treat, leans into a gentle touch</text>
  <text x="588" y="447" text-anchor="end" font-size="40" font-weight="bold" fill="#ffffff" opacity="0.45">1</text>
</svg>
