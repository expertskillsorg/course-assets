<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Finding the Quick: Light Nails vs Dark Nails</text>

  <!-- divider -->
  <line x1="320" y1="60" x2="320" y2="340" stroke="#E5E7EB" stroke-width="2"/>

  <!-- LEFT: light nail -->
  <text x="160" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E2A8E">Light (clear) nail</text>

  <!-- light nail shape -->
  <path d="M120 110 Q160 96 200 110 L196 230 Q160 280 124 230 Z" fill="#F3F0E6" stroke="#374151" stroke-width="2"/>
  <!-- pink quick visible inside -->
  <path d="M138 120 Q160 112 182 120 L178 196 Q160 214 142 196 Z" fill="#C4683A" opacity="0.55"/>
  <text x="160" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">quick</text>

  <!-- cut line on light -->
  <line x1="116" y1="246" x2="204" y2="246" stroke="#3E9B6B" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#3E9B6B" font-weight="bold">safe cut: past the pink</text>
  <text x="160" y="312" text-anchor="middle" font-size="13" fill="#374151">You can SEE the pink core.</text>
  <text x="160" y="330" text-anchor="middle" font-size="13" fill="#374151">Stop a few mm short of it.</text>

  <!-- RIGHT: dark nail -->
  <text x="480" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E2A8E">Dark (black) nail</text>

  <!-- dark nail shape -->
  <path d="M440 110 Q480 96 520 110 L516 230 Q480 280 444 230 Z" fill="#374151" stroke="#111827" stroke-width="2"/>

  <!-- cut guidance: small slices -->
  <line x1="436" y1="240" x2="524" y2="240" stroke="#3E9B6B" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="480" y="262" text-anchor="middle" font-size="12" fill="#3E9B6B" font-weight="bold">thin slices, then look</text>

  <!-- cut-face dot legend -->
  <circle cx="480" cy="222" r="9" fill="#F3F0E6" stroke="#111827" stroke-width="1.5"/>
  <circle cx="480" cy="222" r="3.5" fill="#C4683A"/>
  <text x="480" y="300" text-anchor="middle" font-size="13" fill="#374151">You can't see the quick.</text>
  <text x="480" y="318" text-anchor="middle" font-size="13" fill="#374151">Cut thin slices until a</text>
  <text x="480" y="334" text-anchor="middle" font-size="13" fill="#374151">small dark dot appears, then stop.</text>
</svg>
