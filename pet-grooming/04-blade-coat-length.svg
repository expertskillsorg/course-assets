<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Blade Number vs. Coat Length Left</text>
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#374151">Higher number = shorter cut = less hair left on the dog</text>

  <!-- baseline / skin -->
  <line x1="70" y1="300" x2="570" y2="300" stroke="#374151" stroke-width="2"/>
  <text x="60" y="305" text-anchor="end" font-size="12" fill="#374151">skin</text>

  <!-- arrow showing direction -->
  <line x1="70" y1="330" x2="570" y2="330" stroke="#C4683A" stroke-width="2"/>
  <polygon points="570,330 560,325 560,335" fill="#C4683A"/>
  <text x="80" y="349" font-size="12" fill="#C4683A">higher number</text>
  <text x="560" y="349" text-anchor="end" font-size="12" fill="#C4683A">shorter hair</text>

  <!-- bars: each bar = hair left. Lower blade number = taller bar -->
  <!-- #4 -->
  <rect x="95" y="120" width="70" height="180" fill="#3E9B6B"/>
  <text x="130" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">#4</text>
  <text x="130" y="318" text-anchor="middle" font-size="11" fill="#374151">longest</text>

  <!-- #5 -->
  <rect x="190" y="160" width="70" height="140" fill="#3E9B6B"/>
  <text x="225" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">#5</text>

  <!-- #7 -->
  <rect x="285" y="195" width="70" height="105" fill="#D4AF37"/>
  <text x="320" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">#7</text>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#374151">body</text>

  <!-- #10 -->
  <rect x="380" y="240" width="70" height="60" fill="#C4683A"/>
  <text x="415" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">#10</text>
  <text x="415" y="318" text-anchor="middle" font-size="11" fill="#374151">sanitary</text>

  <!-- #15 -->
  <rect x="475" y="270" width="70" height="30" fill="#C4683A"/>
  <text x="510" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">#15</text>
  <text x="510" y="318" text-anchor="middle" font-size="11" fill="#374151">closest</text>

  <!-- y label -->
  <text x="40" y="200" text-anchor="middle" font-size="12" fill="#1E2A8E" transform="rotate(-90 40 200)">hair left on dog</text>
</svg>
