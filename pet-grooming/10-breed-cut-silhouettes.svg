<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Common Pet and Breed Cut Silhouettes</text>

  <!-- Cell 1: Puppy / Teddy Bear cut -->
  <g>
    <rect x="24" y="56" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- rounded fluffy body -->
    <ellipse cx="120" cy="130" rx="64" ry="38" fill="#3E9B6B"/>
    <circle cx="78" cy="108" r="30" fill="#3E9B6B"/>
    <circle cx="64" cy="92" r="11" fill="#3E9B6B"/>
    <circle cx="92" cy="92" r="11" fill="#3E9B6B"/>
    <rect x="84" y="158" width="16" height="22" rx="7" fill="#3E9B6B"/>
    <rect x="140" y="158" width="16" height="22" rx="7" fill="#3E9B6B"/>
    <text x="124" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Puppy / Teddy</text>
  </g>

  <!-- Cell 2: Poodle pet trim -->
  <g>
    <rect x="248" y="56" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- shorter body, round head, leg poms, tail pom -->
    <ellipse cx="348" cy="132" rx="60" ry="26" fill="#1E2A8E"/>
    <circle cx="305" cy="112" r="22" fill="#1E2A8E"/>
    <circle cx="288" cy="100" r="13" fill="#1E2A8E"/>
    <circle cx="320" cy="100" r="13" fill="#1E2A8E"/>
    <rect x="312" y="150" width="11" height="22" fill="#1E2A8E"/>
    <rect x="372" y="150" width="11" height="22" fill="#1E2A8E"/>
    <circle cx="317" cy="176" r="11" fill="#D4AF37"/>
    <circle cx="377" cy="176" r="11" fill="#D4AF37"/>
    <circle cx="406" cy="118" r="12" fill="#D4AF37"/>
    <text x="348" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Poodle pet trim</text>
  </g>

  <!-- Cell 3: Bichon round -->
  <g>
    <rect x="472" y="56" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- soft round cloud body and ball head -->
    <ellipse cx="568" cy="134" rx="58" ry="40" fill="#374151"/>
    <circle cx="524" cy="112" r="30" fill="#374151"/>
    <ellipse cx="610" cy="120" rx="16" ry="24" fill="#374151"/>
    <rect x="544" y="166" width="15" height="16" rx="6" fill="#374151"/>
    <rect x="580" y="166" width="15" height="16" rx="6" fill="#374151"/>
    <text x="568" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Bichon round</text>
  </g>

  <!-- Cell 4: Schnauzer / breed pattern -->
  <g>
    <rect x="24" y="200" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- short back, long furnishings on legs and skirt, beard -->
    <rect x="72" y="244" width="96" height="30" rx="6" fill="#C4683A"/>
    <rect x="64" y="226" width="34" height="26" rx="6" fill="#C4683A"/>
    <path d="M66 252 L60 290 L82 290 Z" fill="#D4AF37"/>
    <rect x="84" y="274" width="12" height="34" fill="#D4AF37"/>
    <rect x="148" y="274" width="12" height="34" fill="#D4AF37"/>
    <rect x="72" y="270" width="92" height="14" fill="#D4AF37"/>
    <text x="124" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Breed pattern</text>
  </g>

  <!-- Cell 5: Short all-over / kennel cut -->
  <g>
    <rect x="248" y="200" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- close even outline -->
    <ellipse cx="348" cy="270" rx="58" ry="24" fill="#1E2A8E"/>
    <circle cx="305" cy="254" r="19" fill="#1E2A8E"/>
    <ellipse cx="292" cy="246" rx="8" ry="13" fill="#1E2A8E"/>
    <rect x="318" y="288" width="10" height="18" fill="#1E2A8E"/>
    <rect x="372" y="288" width="10" height="18" fill="#1E2A8E"/>
    <text x="348" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Short all-over</text>
  </g>

  <!-- Cell 6: Sanitary / bath-and-tidy -->
  <g>
    <rect x="472" y="200" width="200" height="128" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- full natural coat, only tidied -->
    <ellipse cx="568" cy="268" rx="60" ry="30" fill="#3E9B6B"/>
    <circle cx="522" cy="250" r="24" fill="#3E9B6B"/>
    <path d="M504 234 L500 218 L516 230 Z" fill="#3E9B6B"/>
    <path d="M540 234 L544 218 L528 230 Z" fill="#3E9B6B"/>
    <rect x="540" y="290" width="13" height="18" rx="5" fill="#3E9B6B"/>
    <rect x="584" y="290" width="13" height="18" rx="5" fill="#3E9B6B"/>
    <text x="568" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Bath and tidy</text>
  </g>

  <text x="360" y="350" text-anchor="middle" font-size="12" fill="#374151">Each outline is a starting template; the right cut depends on the dog's coat, lifestyle, and owner upkeep.</text>
</svg>
