<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#FFFFFF"/>
  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Five Coat Families</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#374151">Texture, a familiar dog, and the one thing to remember</text>

  <!-- Smooth -->
  <g>
    <rect x="24" y="80" width="160" height="270" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="24" y="80" width="160" height="40" rx="10" fill="#1E2A8E"/>
    <rect x="24" y="104" width="160" height="16" fill="#1E2A8E"/>
    <text x="104" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Smooth</text>
    <!-- flat short lines -->
    <g stroke="#374151" stroke-width="2" stroke-linecap="round">
      <line x1="44" y1="150" x2="80" y2="150"/>
      <line x1="92" y1="150" x2="128" y2="150"/>
      <line x1="140" y1="150" x2="164" y2="150"/>
      <line x1="44" y1="166" x2="80" y2="166"/>
      <line x1="92" y1="166" x2="128" y2="166"/>
      <line x1="140" y1="166" x2="164" y2="166"/>
    </g>
    <text x="104" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Labrador</text>
    <text x="104" y="250" text-anchor="middle" font-size="11.5" fill="#374151">Short, flat, sleek.</text>
    <text x="104" y="268" text-anchor="middle" font-size="11.5" fill="#374151">Low care, still</text>
    <text x="104" y="286" text-anchor="middle" font-size="11.5" fill="#374151">sheds.</text>
  </g>

  <!-- Double -->
  <g>
    <rect x="196" y="80" width="160" height="270" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="196" y="80" width="160" height="40" rx="10" fill="#141B5C"/>
    <rect x="196" y="104" width="160" height="16" fill="#141B5C"/>
    <text x="276" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Double</text>
    <!-- two layers -->
    <path d="M216 172 q12 -22 24 0 q12 -22 24 0 q12 -22 24 0 q12 -22 24 0 q12 -22 24 0" fill="none" stroke="#374151" stroke-width="2.5"/>
    <path d="M216 184 q12 -14 24 0 q12 -14 24 0 q12 -14 24 0 q12 -14 24 0 q12 -14 24 0" fill="none" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="276" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Husky</text>
    <text x="276" y="250" text-anchor="middle" font-size="11.5" fill="#374151">Soft layer under a</text>
    <text x="276" y="268" text-anchor="middle" font-size="11.5" fill="#374151">coarse top.</text>
    <text x="276" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C4683A">Never shave.</text>
  </g>

  <!-- Curly -->
  <g>
    <rect x="368" y="80" width="160" height="270" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="368" y="80" width="160" height="40" rx="10" fill="#1E2A8E"/>
    <rect x="368" y="104" width="160" height="16" fill="#1E2A8E"/>
    <text x="448" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Curly / Wool</text>
    <!-- curls -->
    <g fill="none" stroke="#374151" stroke-width="2.5">
      <circle cx="398" cy="160" r="9"/>
      <circle cx="424" cy="160" r="9"/>
      <circle cx="450" cy="160" r="9"/>
      <circle cx="476" cy="160" r="9"/>
      <circle cx="502" cy="160" r="9"/>
      <circle cx="411" cy="178" r="9"/>
      <circle cx="437" cy="178" r="9"/>
      <circle cx="463" cy="178" r="9"/>
      <circle cx="489" cy="178" r="9"/>
    </g>
    <text x="448" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Poodle</text>
    <text x="448" y="250" text-anchor="middle" font-size="11.5" fill="#374151">Springy curls,</text>
    <text x="448" y="268" text-anchor="middle" font-size="11.5" fill="#374151">barely sheds,</text>
    <text x="448" y="286" text-anchor="middle" font-size="11.5" fill="#374151">tangles fast.</text>
  </g>

  <!-- Wire -->
  <g>
    <rect x="540" y="80" width="160" height="270" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="540" y="80" width="160" height="40" rx="10" fill="#141B5C"/>
    <rect x="540" y="104" width="160" height="16" fill="#141B5C"/>
    <text x="620" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Wire</text>
    <!-- jagged bristles -->
    <polyline points="560,178 568,150 576,178 584,150 592,178 600,150 608,178 616,150 624,178 632,150 640,178 648,150 656,178 664,150 672,178 680,150" fill="none" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="620" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Terrier</text>
    <text x="620" y="250" text-anchor="middle" font-size="11.5" fill="#374151">Harsh, bristly top.</text>
    <text x="620" y="268" text-anchor="middle" font-size="11.5" fill="#374151">Hand-stripped,</text>
    <text x="620" y="286" text-anchor="middle" font-size="11.5" fill="#374151">not shaved.</text>
  </g>

  <!-- Long / silky -->
  <g>
    <rect x="712" y="80" width="160" height="270" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="712" y="80" width="160" height="40" rx="10" fill="#D4AF37"/>
    <rect x="712" y="104" width="160" height="16" fill="#D4AF37"/>
    <text x="792" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Long / Silky</text>
    <!-- flowing strands -->
    <g fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round">
      <path d="M740 145 q6 30 -2 55"/>
      <path d="M756 145 q6 30 -2 55"/>
      <path d="M772 145 q6 30 -2 55"/>
      <path d="M788 145 q6 30 -2 55"/>
      <path d="M804 145 q6 30 -2 55"/>
      <path d="M820 145 q6 30 -2 55"/>
    </g>
    <text x="792" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Yorkie</text>
    <text x="792" y="250" text-anchor="middle" font-size="11.5" fill="#374151">Fine, flowing,</text>
    <text x="792" y="268" text-anchor="middle" font-size="11.5" fill="#374151">drapes long,</text>
    <text x="792" y="286" text-anchor="middle" font-size="11.5" fill="#374151">mats quickly.</text>
  </g>

  <text x="440" y="368" text-anchor="middle" font-size="11" fill="#374151">Coat type decides your brush, bath, dryer, and cut, so name it first.</text>
</svg>
