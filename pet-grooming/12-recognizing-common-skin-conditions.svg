<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Four common skin findings a groomer may see on the table">
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 20px; font-weight: bold; fill: #141B5C; }
    .label { font-size: 16px; font-weight: bold; fill: #1E2A8E; }
    .body { font-size: 12.5px; fill: #374151; }
    .note { font-size: 12px; font-style: italic; fill: #C4683A; }
  </style>
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" class="title">Common skin findings: note and describe, never diagnose</text>

  <!-- Card 1: Hot spot -->
  <rect x="24" y="56" width="288" height="150" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="74" cy="118" r="30" fill="#F2D9CC"/>
  <circle cx="74" cy="118" r="18" fill="#C4683A"/>
  <circle cx="74" cy="118" r="8" fill="#8F4422"/>
  <text x="120" y="92" class="label">Hot spot</text>
  <text x="120" y="116" class="body">Red, wet, raw circle.</text>
  <text x="120" y="134" class="body">Often warm, smells off,</text>
  <text x="120" y="152" class="body">hair lost around it.</text>
  <text x="120" y="178" class="note">Stop, do not clip into it, refer.</text>

  <!-- Card 2: Dry / flaky skin -->
  <rect x="328" y="56" width="288" height="150" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="378" cy="118" r="30" fill="#EAE6DA"/>
  <rect x="366" y="106" width="6" height="6" fill="#D4AF37"/>
  <rect x="380" y="114" width="6" height="6" fill="#D4AF37"/>
  <rect x="372" y="124" width="6" height="6" fill="#D4AF37"/>
  <rect x="388" y="106" width="6" height="6" fill="#D4AF37"/>
  <rect x="384" y="128" width="6" height="6" fill="#D4AF37"/>
  <text x="424" y="92" class="label">Dry, flaky skin</text>
  <text x="424" y="116" class="body">White flakes, dull coat,</text>
  <text x="424" y="134" class="body">dog scratches a lot.</text>
  <text x="424" y="178" class="note">Note it; tell the owner.</text>

  <!-- Card 3: Lump / bump -->
  <rect x="24" y="222" width="288" height="150" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M 44 300 Q 64 296 84 300 L 124 300 Q 104 300 104 282 Q 104 268 90 268 Q 76 268 76 282 Q 76 300 44 300 Z" fill="#F2D9CC" stroke="#374151" stroke-width="1.5"/>
  <text x="138" y="258" class="label">Lump or bump</text>
  <text x="138" y="282" class="body">Felt under the coat:</text>
  <text x="138" y="300" class="body">warts, skin tags, masses.</text>
  <text x="138" y="318" class="body">Clip around, never over.</text>
  <text x="138" y="344" class="note">Log it; flag any new one.</text>

  <!-- Card 4: Redness / irritation -->
  <rect x="328" y="222" width="288" height="150" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="378" cy="284" r="30" fill="#F2D9CC"/>
  <path d="M 360 274 Q 378 268 396 274" stroke="#C4683A" stroke-width="3" fill="none"/>
  <path d="M 358 286 Q 378 280 398 286" stroke="#C4683A" stroke-width="3" fill="none"/>
  <path d="M 360 298 Q 378 292 396 298" stroke="#C4683A" stroke-width="3" fill="none"/>
  <text x="424" y="258" class="label">Redness, rash</text>
  <text x="424" y="282" class="body">Pink, itchy, irritated skin,</text>
  <text x="424" y="300" class="body">often belly, armpits, feet.</text>
  <text x="424" y="344" class="note">Describe what you see, refer.</text>

  <text x="24" y="404" class="body">You are the eyes that catch it early. A veterinarian is the one who names and treats it.</text>
</svg>
