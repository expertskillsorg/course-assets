<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Inside a Dog's Nail</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#374151">The hard shell has no feeling. The quick is alive: blood and nerves.</text>

  <!-- Toe -->
  <path d="M150 210 q-30 -70 30 -95 q40 -16 70 6 l0 70 q-50 30 -100 13 z" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="12.5" fill="#374151">toe</text>

  <!-- Nail outer shell -->
  <path d="M250 121 q150 -8 250 60 q14 30 -8 50 q-130 28 -242 -41 z" fill="#FFFFFF" stroke="#141B5C" stroke-width="3"/>

  <!-- The quick (living core) -->
  <path d="M258 138 q120 6 180 56 q8 16 -6 26 q-100 18 -176 -38 z" fill="#C4683A" stroke="#C4683A" stroke-width="1"/>

  <!-- blood vessel inside quick -->
  <path d="M270 152 q90 6 150 50" fill="none" stroke="#141B5C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- safe trim line -->
  <line x1="470" y1="120" x2="470" y2="232" stroke="#3E9B6B" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="470,108 462,124 478,124" fill="#3E9B6B"/>

  <!-- Labels and leaders -->
  <!-- shell -->
  <line x1="360" y1="118" x2="360" y2="86" stroke="#374151" stroke-width="1.5"/>
  <circle cx="360" cy="118" r="3" fill="#141B5C"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Hard outer shell</text>
  <text x="360" y="96" text-anchor="middle" font-size="11.5" fill="#374151">no feeling, safe to trim</text>

  <!-- quick -->
  <line x1="330" y1="170" x2="250" y2="290" stroke="#374151" stroke-width="1.5"/>
  <circle cx="330" cy="170" r="3" fill="#C4683A"/>
  <text x="250" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">The quick</text>
  <text x="250" y="328" text-anchor="middle" font-size="11.5" fill="#374151">living core, hurts and</text>
  <text x="250" y="344" text-anchor="middle" font-size="11.5" fill="#374151">bleeds if cut</text>

  <!-- blood vessel -->
  <line x1="420" y1="200" x2="470" y2="300" stroke="#374151" stroke-width="1.5"/>
  <circle cx="420" cy="200" r="3" fill="#141B5C"/>
  <text x="500" y="304" text-anchor="middle" font-size="12.5" fill="#374151">blood vessel</text>

  <!-- trim line -->
  <line x1="470" y1="232" x2="560" y2="270" stroke="#374151" stroke-width="1.5"/>
  <circle cx="470" cy="232" r="3" fill="#3E9B6B"/>
  <text x="630" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Safe trim line</text>
  <text x="630" y="282" text-anchor="middle" font-size="11.5" fill="#374151">stop just past the</text>
  <text x="630" y="298" text-anchor="middle" font-size="11.5" fill="#374151">tip of the quick</text>

  <!-- bottom note -->
  <rect x="120" y="360" width="520" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="380" y="380" text-anchor="middle" font-size="12" fill="#374151">Long nails grow long quicks. Trim small amounts often and the quick recedes</text>
  <text x="380" y="397" text-anchor="middle" font-size="12" fill="#374151">over weeks, so the nail can finally get shorter.</text>
</svg>
