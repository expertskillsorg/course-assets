<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="360" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Nose-to-Tail Check Sequence</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Same path, every dog, so nothing gets skipped</text>

  <!-- Dog body (side view, facing left) -->
  <g stroke="#1E2A8E" stroke-width="3" fill="#E5E7EB">
    <!-- torso -->
    <path d="M150 200 Q160 150 240 148 L420 150 Q470 152 480 185 L480 230 Q470 250 430 250 L200 250 Q160 248 150 200 Z"/>
    <!-- head -->
    <path d="M150 200 Q120 195 105 175 Q92 160 110 150 Q118 130 145 135 Q160 138 168 155 L170 185 Q165 200 150 200 Z"/>
    <!-- ear -->
    <path d="M150 140 Q160 110 178 120 Q182 140 168 158 Q156 150 150 140 Z" fill="#3E9B6B"/>
    <!-- snout -->
    <path d="M105 175 Q90 178 86 186 Q90 196 104 192 Z" fill="#D4AF37"/>
    <!-- legs -->
    <path d="M210 250 L206 310 M250 252 L248 312 M400 250 L404 312 M440 248 L444 310"/>
    <!-- tail -->
    <path d="M480 200 Q520 185 530 150 Q536 130 520 128" fill="none"/>
  </g>

  <!-- Numbered markers -->
  <g font-size="15" font-weight="bold">
    <!-- 1 nose/face -->
    <circle cx="96" cy="186" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="96" y="191" text-anchor="middle" fill="#FFFFFF">1</text>
    <!-- 2 eyes -->
    <circle cx="132" cy="158" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="132" y="163" text-anchor="middle" fill="#FFFFFF">2</text>
    <!-- 3 ears -->
    <circle cx="172" cy="124" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="172" y="129" text-anchor="middle" fill="#FFFFFF">3</text>
    <!-- 4 mouth/teeth -->
    <circle cx="118" cy="208" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="118" y="213" text-anchor="middle" fill="#FFFFFF">4</text>
    <!-- 5 body/skin -->
    <circle cx="320" cy="198" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="320" y="203" text-anchor="middle" fill="#FFFFFF">5</text>
    <!-- 6 legs/feet/tail -->
    <circle cx="448" cy="288" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="448" y="293" text-anchor="middle" fill="#FFFFFF">6</text>
    <circle cx="520" cy="150" r="15" fill="#C4683A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="520" y="155" text-anchor="middle" fill="#FFFFFF">6</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#111827">
    <text x="60" y="338" font-weight="bold" fill="#141B5C">1</text><text x="74" y="338">Nose &amp; face</text>
    <text x="170" y="338" font-weight="bold" fill="#141B5C">2</text><text x="184" y="338">Eyes</text>
    <text x="244" y="338" font-weight="bold" fill="#141B5C">3</text><text x="258" y="338">Ears</text>
    <text x="312" y="338" font-weight="bold" fill="#141B5C">4</text><text x="326" y="338">Mouth &amp; teeth</text>
    <text x="446" y="338" font-weight="bold" fill="#141B5C">5</text><text x="460" y="338">Body &amp; skin</text>
    <text x="548" y="338" font-weight="bold" fill="#141B5C">6</text><text x="562" y="338">Legs, feet, tail</text>
  </g>
</svg>
