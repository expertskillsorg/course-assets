<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Three supportive cat-handling holds compared against the unsafe scruff hold">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#141B5C">Supportive Cat Holds (No Scruffing)</text>

  <!-- Card 1: chest cradle -->
  <rect x="24" y="60" width="222" height="200" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="135" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2A8E">Chest cradle</text>
  <!-- arm + cat body -->
  <ellipse cx="135" cy="170" rx="78" ry="40" fill="#D4AF37" opacity="0.30"/>
  <ellipse cx="120" cy="170" rx="50" ry="30" fill="#374151" opacity="0.25"/>
  <circle cx="80" cy="160" r="22" fill="#374151" opacity="0.35"/>
  <path d="M64 142 l8 -14 6 14 Z" fill="#374151" opacity="0.35"/>
  <path d="M88 142 l8 -14 6 14 Z" fill="#374151" opacity="0.35"/>
  <!-- supporting hand under chest -->
  <path d="M150 200 q24 -10 44 -4" stroke="#C4683A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="135" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#374151">Hand under the chest,</text>
  <text x="135" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#374151">body against your forearm</text>

  <!-- Card 2: kneel/tabletop support -->
  <rect x="269" y="60" width="222" height="200" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="380" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2A8E">Table support</text>
  <line x1="300" y1="200" x2="460" y2="200" stroke="#141B5C" stroke-width="3"/>
  <ellipse cx="380" cy="178" rx="56" ry="26" fill="#374151" opacity="0.25"/>
  <circle cx="338" cy="172" r="18" fill="#374151" opacity="0.35"/>
  <path d="M326 158 l6 -11 5 11 Z" fill="#374151" opacity="0.35"/>
  <path d="M346 158 l6 -11 5 11 Z" fill="#374151" opacity="0.35"/>
  <!-- two light hands resting -->
  <path d="M404 168 q16 -6 28 0" stroke="#C4683A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M348 196 q14 8 30 6" stroke="#C4683A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="380" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#374151">Light hands steady the cat</text>
  <text x="380" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#374151">on a non-slip surface</text>

  <!-- Card 3: towel wrap -->
  <rect x="514" y="60" width="222" height="200" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="625" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E2A8E">Towel wrap</text>
  <path d="M576 120 q49 -22 98 0 l10 70 q-59 26 -118 0 Z" fill="#1E2A8E" opacity="0.30"/>
  <circle cx="625" cy="138" r="20" fill="#374151" opacity="0.35"/>
  <path d="M611 122 l7 -13 6 13 Z" fill="#374151" opacity="0.35"/>
  <path d="M633 122 l7 -13 6 13 Z" fill="#374151" opacity="0.35"/>
  <text x="625" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#374151">Body wrapped, one</text>
  <text x="625" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#374151">area free to work at a time</text>

  <!-- Unsafe row -->
  <rect x="24" y="290" width="712" height="104" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2.5"/>
  <g transform="translate(56,322)">
    <path d="M16 0 L34 34 H-2 Z" fill="none" stroke="#C4683A" stroke-width="3" stroke-linejoin="round"/>
    <line x1="16" y1="12" x2="16" y2="24" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="30" r="1.8" fill="#C4683A"/>
  </g>
  <text x="116" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C4683A">Not a routine hold: scruffing</text>
  <text x="116" y="354" font-family="Arial, sans-serif" font-size="12.5" fill="#374151">Hanging a cat by the neck skin frightens it, removes its support, and pushes</text>
  <text x="116" y="372" font-family="Arial, sans-serif" font-size="12.5" fill="#374151">it toward the panic threshold. Support the whole body instead.</text>
</svg>
