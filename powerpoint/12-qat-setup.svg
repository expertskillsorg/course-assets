<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Quick Access Toolbar worth building</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#374151">Six commands that live above the ribbon, one click away, on every deck you open</text>

  <!-- toolbar bar -->
  <rect x="70" y="92" width="620" height="60" rx="8" fill="#141B5C"/>

  <!-- button 1: Format Painter -->
  <g>
    <rect x="92" y="106" width="40" height="32" rx="5" fill="#FFFFFF"/>
    <path d="M104 130 L116 118 L122 124 L110 136 Z" fill="#D4AF37"/>
    <rect x="100" y="112" width="14" height="8" rx="2" fill="#1E2A8E"/>
  </g>
  <!-- button 2: Align -->
  <g>
    <rect x="152" y="106" width="40" height="32" rx="5" fill="#FFFFFF"/>
    <rect x="160" y="112" width="24" height="4" rx="1" fill="#1E2A8E"/>
    <rect x="160" y="120" width="16" height="4" rx="1" fill="#1E2A8E"/>
    <rect x="160" y="128" width="24" height="4" rx="1" fill="#1E2A8E"/>
  </g>
  <!-- button 3: Distribute -->
  <g>
    <rect x="212" y="106" width="40" height="32" rx="5" fill="#FFFFFF"/>
    <rect x="218" y="114" width="8" height="16" rx="1" fill="#3E9B6B"/>
    <rect x="228" y="114" width="8" height="16" rx="1" fill="#3E9B6B"/>
    <rect x="238" y="114" width="8" height="16" rx="1" fill="#3E9B6B"/>
  </g>
  <!-- button 4: Selection Pane -->
  <g>
    <rect x="272" y="106" width="40" height="32" rx="5" fill="#FFFFFF"/>
    <rect x="280" y="112" width="24" height="6" rx="1" fill="#1E2A8E"/>
    <rect x="280" y="122" width="24" height="6" rx="1" fill="#C4683A"/>
    <rect x="280" y="130" width="16" height="4" rx="1" fill="#374151"/>
  </g>
  <!-- button 5: Group -->
  <g>
    <rect x="332" y="106" width="40" height="32" rx="5" fill="#FFFFFF"/>
    <rect x="340" y="112" width="24" height="20" rx="2" fill="none" stroke="#1E2A8E" stroke-width="2" stroke-dasharray="3 2"/>
    <rect x="344" y="116" width="7" height="7" fill="#D4AF37"/>
    <rect x="353" y="123" width="7" height="7" fill="#3E9B6B"/>
  </g>
  <!-- button 6: Start from Current Slide -->
  <g>
    <rect x="392" y="106" width="40" height="32" rx="5" fill="#FFFFFF"/>
    <path d="M406 114 L406 130 L420 122 Z" fill="#C4683A"/>
  </g>

  <!-- pointer / labels -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="112" y1="152" x2="112" y2="188"/>
    <line x1="172" y1="152" x2="172" y2="220"/>
    <line x1="232" y1="152" x2="232" y2="252"/>
    <line x1="292" y1="152" x2="292" y2="284"/>
    <line x1="352" y1="152" x2="352" y2="316"/>
    <line x1="412" y1="152" x2="412" y2="348"/>
  </g>

  <g font-size="13" fill="#111827">
    <text x="128" y="192">Format Painter — copy one object's look onto another</text>
    <text x="188" y="224">Align — snap edges of selected objects together</text>
    <text x="248" y="256">Distribute — space three or more objects evenly</text>
    <text x="308" y="288">Selection Pane — see and pick every object by name</text>
    <text x="368" y="320">Group — lock a compound graphic into one unit</text>
    <text x="428" y="352">Start from Current Slide — jump straight into rehearsal</text>
  </g>

  <text x="380" y="384" text-anchor="middle" font-size="12" fill="#374151">Set it up once, export it, and it follows you to every machine you sign into.</text>
</svg>
