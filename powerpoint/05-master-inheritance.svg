<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">One edit at the top cascades down</text>

  <!-- Level 1: Master -->
  <rect x="270" y="58" width="180" height="66" rx="6" fill="#1E2A8E"/>
  <text x="360" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Slide Master</text>
  <text x="360" y="110" text-anchor="middle" font-size="12" fill="#D4AF37">fonts · logo · background</text>

  <!-- connectors master to layouts -->
  <path d="M360 124 L160 176" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M360 124 L360 176" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M360 124 L560 176" stroke="#374151" stroke-width="2" fill="none"/>

  <!-- Level 2: Layouts -->
  <rect x="80" y="176" width="160" height="56" rx="6" fill="#3E9B6B"/>
  <text x="160" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Title layout</text>
  <text x="160" y="221" text-anchor="middle" font-size="11" fill="#FFFFFF">inherits master</text>

  <rect x="280" y="176" width="160" height="56" rx="6" fill="#3E9B6B"/>
  <text x="360" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Content layout</text>
  <text x="360" y="221" text-anchor="middle" font-size="11" fill="#FFFFFF">inherits master</text>

  <rect x="480" y="176" width="160" height="56" rx="6" fill="#3E9B6B"/>
  <text x="560" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Comparison layout</text>
  <text x="560" y="221" text-anchor="middle" font-size="11" fill="#FFFFFF">inherits master</text>

  <!-- connectors layouts to slides -->
  <path d="M160 232 L120 300" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M160 232 L200 300" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M360 232 L320 300" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M360 232 L400 300" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M560 232 L560 300" stroke="#374151" stroke-width="1.5" fill="none"/>

  <!-- Level 3: Slides -->
  <g fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2">
    <rect x="76" y="300" width="88" height="60" rx="4"/>
    <rect x="176" y="300" width="88" height="60" rx="4"/>
    <rect x="286" y="300" width="88" height="60" rx="4"/>
    <rect x="386" y="300" width="88" height="60" rx="4"/>
    <rect x="516" y="300" width="88" height="60" rx="4"/>
  </g>
  <g fill="#374151" font-size="12" text-anchor="middle">
    <text x="120" y="335">Slide</text>
    <text x="220" y="335">Slide</text>
    <text x="330" y="335">Slide</text>
    <text x="430" y="335">Slide</text>
    <text x="560" y="335">Slide</text>
  </g>

  <!-- cascade arrow -->
  <path d="M680 70 L680 430" stroke="#C4683A" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4683A"/>
    </marker>
  </defs>
  <text x="695" y="250" font-size="13" font-weight="bold" fill="#C4683A" transform="rotate(90 695 250)" text-anchor="middle">change flows down</text>

  <text x="30" y="96" font-size="13" fill="#374151">1</text>
  <text x="30" y="208" font-size="13" fill="#374151">2</text>
  <text x="30" y="334" font-size="13" fill="#374151">3</text>
</svg>
