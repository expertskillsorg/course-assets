<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Arial, sans-serif">
  <rect width="820" height="400" fill="#FFFFFF"/>

  <!-- Labels -->
  <text x="210" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#C4683A">Default gridded table</text>
  <text x="610" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E9B6B">Cleaned table</text>

  <!-- ===================== BEFORE (left) ===================== -->
  <!-- outer heavy border -->
  <rect x="40" y="60" width="340" height="270" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- header row default blue -->
  <rect x="40" y="60" width="340" height="45" fill="#1E2A8E"/>
  <text x="60" y="88" font-size="14" font-weight="bold" fill="#FFFFFF">Task</text>
  <text x="215" y="88" font-size="14" font-weight="bold" fill="#FFFFFF">Owner</text>
  <text x="310" y="88" font-size="14" font-weight="bold" fill="#FFFFFF">Cost</text>

  <!-- zebra body rows -->
  <rect x="40" y="105" width="340" height="45" fill="#DCE0F2"/>
  <rect x="40" y="150" width="340" height="45" fill="#FFFFFF"/>
  <rect x="40" y="195" width="340" height="45" fill="#DCE0F2"/>
  <rect x="40" y="240" width="340" height="45" fill="#FFFFFF"/>
  <rect x="40" y="285" width="340" height="45" fill="#DCE0F2"/>

  <!-- vertical gridlines -->
  <line x1="200" y1="60" x2="200" y2="330" stroke="#374151" stroke-width="1"/>
  <line x1="295" y1="60" x2="295" y2="330" stroke="#374151" stroke-width="1"/>
  <!-- horizontal gridlines -->
  <line x1="40" y1="105" x2="380" y2="105" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="150" x2="380" y2="150" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="195" x2="380" y2="195" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="240" x2="380" y2="240" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="285" x2="380" y2="285" stroke="#374151" stroke-width="1"/>

  <!-- before body text (center-ish, misaligned numbers) -->
  <text x="60" y="132" font-size="13" fill="#111827">Design</text>
  <text x="215" y="132" font-size="13" fill="#111827">Amir</text>
  <text x="305" y="132" font-size="13" fill="#111827">4200</text>
  <text x="60" y="177" font-size="13" fill="#111827">Build</text>
  <text x="215" y="177" font-size="13" fill="#111827">Sana</text>
  <text x="310" y="177" font-size="13" fill="#111827">12500</text>
  <text x="60" y="222" font-size="13" fill="#111827">Test</text>
  <text x="215" y="222" font-size="13" fill="#111827">Lee</text>
  <text x="308" y="222" font-size="13" fill="#111827">900</text>
  <text x="60" y="267" font-size="13" fill="#111827">Launch</text>
  <text x="215" y="267" font-size="13" fill="#111827">Noor</text>
  <text x="305" y="267" font-size="13" fill="#111827">3100</text>
  <text x="60" y="312" font-size="13" fill="#111827">Review</text>
  <text x="215" y="312" font-size="13" fill="#111827">Amir</text>
  <text x="309" y="312" font-size="13" fill="#111827">750</text>

  <!-- ===================== AFTER (right) ===================== -->
  <!-- header row: light fill, bold -->
  <rect x="440" y="60" width="340" height="45" fill="#EDEFF7"/>
  <text x="460" y="88" font-size="14" font-weight="bold" fill="#141B5C">Task</text>
  <text x="615" y="88" font-size="14" font-weight="bold" fill="#141B5C">Owner</text>
  <text x="760" y="88" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="end">Cost</text>

  <!-- single thin rule under header -->
  <line x1="440" y1="105" x2="780" y2="105" stroke="#1E2A8E" stroke-width="2"/>

  <!-- highlighted key row (Build) -->
  <rect x="440" y="150" width="340" height="45" fill="#F6ECCF"/>

  <!-- after body text, numbers right-aligned to x=760 -->
  <text x="460" y="132" font-size="13" fill="#111827">Design</text>
  <text x="615" y="132" font-size="13" fill="#111827">Amir</text>
  <text x="760" y="132" font-size="13" fill="#111827" text-anchor="end">4,200</text>

  <text x="460" y="177" font-size="13" font-weight="bold" fill="#111827">Build</text>
  <text x="615" y="177" font-size="13" font-weight="bold" fill="#111827">Sana</text>
  <text x="760" y="177" font-size="13" font-weight="bold" fill="#C4683A" text-anchor="end">12,500</text>

  <text x="460" y="222" font-size="13" fill="#111827">Test</text>
  <text x="615" y="222" font-size="13" fill="#111827">Lee</text>
  <text x="760" y="222" font-size="13" fill="#111827" text-anchor="end">900</text>

  <text x="460" y="267" font-size="13" fill="#111827">Launch</text>
  <text x="615" y="267" font-size="13" fill="#111827">Noor</text>
  <text x="760" y="267" font-size="13" fill="#111827" text-anchor="end">3,100</text>

  <text x="460" y="312" font-size="13" fill="#111827">Review</text>
  <text x="615" y="312" font-size="13" fill="#111827">Amir</text>
  <text x="760" y="312" font-size="13" fill="#111827" text-anchor="end">750</text>

  <!-- faint row separators (thin, light) -->
  <line x1="440" y1="150" x2="780" y2="150" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="440" y1="195" x2="780" y2="195" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="440" y1="240" x2="780" y2="240" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="440" y1="285" x2="780" y2="285" stroke="#E5E7EB" stroke-width="1"/>

  <!-- caption note for highlighted row -->
  <text x="440" y="352" font-size="12" fill="#374151">Numbers right-aligned, one row highlighted, borders and stripes gone.</text>
</svg>
