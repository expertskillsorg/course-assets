<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, sans-serif">
  <rect width="900" height="470" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#141B5C">From Report to Deck</text>

  <!-- LEFT: document sections -->
  <text x="130" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Report sections</text>
  <g>
    <rect x="45" y="86" width="170" height="52" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <line x1="60" y1="102" x2="200" y2="102" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="60" y1="114" x2="200" y2="114" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="60" y1="124" x2="180" y2="124" stroke="#D1D5DB" stroke-width="2"/>
    <text x="60" y="98" font-size="11" font-weight="bold" fill="#1E2A8E">Growth</text>
  </g>
  <g>
    <rect x="45" y="150" width="170" height="52" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <line x1="60" y1="166" x2="200" y2="166" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="60" y1="178" x2="200" y2="178" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="60" y1="188" x2="175" y2="188" stroke="#D1D5DB" stroke-width="2"/>
    <text x="60" y="162" font-size="11" font-weight="bold" fill="#1E2A8E">Finances</text>
  </g>
  <g>
    <rect x="45" y="214" width="170" height="52" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <line x1="60" y1="230" x2="200" y2="230" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="60" y1="242" x2="200" y2="242" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="60" y1="252" x2="185" y2="252" stroke="#D1D5DB" stroke-width="2"/>
    <text x="60" y="226" font-size="11" font-weight="bold" fill="#1E2A8E">Expansion</text>
  </g>

  <!-- arrow to method -->
  <path d="M222 176 L272 176" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- MIDDLE: five-step method -->
  <rect x="288" y="70" width="230" height="330" rx="8" fill="#1E2A8E"/>
  <text x="403" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">The 5-step method</text>
  <g font-size="12" fill="#FFFFFF">
    <circle cx="312" cy="128" r="12" fill="#D4AF37"/><text x="312" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">1</text>
    <text x="332" y="132" fill="#FFFFFF">Extract conclusions</text>
    <circle cx="312" cy="178" r="12" fill="#D4AF37"/><text x="312" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">2</text>
    <text x="332" y="182" fill="#FFFFFF">Group under pillars</text>
    <circle cx="312" cy="228" r="12" fill="#D4AF37"/><text x="312" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">3</text>
    <text x="332" y="232" fill="#FFFFFF">One slide each</text>
    <circle cx="312" cy="278" r="12" fill="#D4AF37"/><text x="312" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">4</text>
    <text x="332" y="282" fill="#FFFFFF">Prose to notes</text>
    <circle cx="312" cy="328" r="12" fill="#D4AF37"/><text x="312" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">5</text>
    <text x="332" y="332" fill="#FFFFFF">Visualize the data</text>
  </g>

  <!-- arrows out to right -->
  <path d="M524 176 L574 176" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- RIGHT: slide sequence -->
  <text x="700" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Slide sequence</text>
  <g>
    <rect x="600" y="86" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="612" y="103" font-size="11" font-weight="bold" fill="#141B5C">Revenue grew 12%</text>
    <rect x="770" y="98" width="18" height="16" rx="2" fill="#3E9B6B"/>
  </g>
  <g>
    <rect x="600" y="134" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="612" y="151" font-size="11" font-weight="bold" fill="#141B5C">Cash is the strongest</text>
    <rect x="770" y="146" width="18" height="16" rx="2" fill="#3E9B6B"/>
  </g>
  <g>
    <rect x="600" y="182" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
    <text x="612" y="199" font-size="11" font-weight="bold" fill="#141B5C">Expansion pays back</text>
    <rect x="770" y="194" width="18" height="16" rx="2" fill="#3E9B6B"/>
  </g>

  <!-- prose to notes -->
  <rect x="600" y="248" width="200" height="60" rx="4" fill="#FDF6E3" stroke="#D4AF37"/>
  <text x="700" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Speaker notes</text>
  <text x="700" y="290" text-anchor="middle" font-size="11" fill="#374151">the report's prose</text>
  <path d="M403 344 C 403 372, 640 320, 640 306" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>

  <!-- data to charts -->
  <rect x="600" y="322" width="200" height="70" rx="4" fill="#F0F7F3" stroke="#3E9B6B"/>
  <text x="700" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Charts</text>
  <rect x="640" y="352" width="12" height="28" fill="#3E9B6B"/>
  <rect x="660" y="360" width="12" height="20" fill="#3E9B6B"/>
  <rect x="680" y="348" width="12" height="32" fill="#C4683A"/>
  <rect x="700" y="366" width="12" height="14" fill="#3E9B6B"/>
  <rect x="720" y="356" width="12" height="24" fill="#3E9B6B"/>

  <text x="130" y="300" text-anchor="middle" font-size="11" fill="#6B7280">40 pages</text>
  <text x="700" y="418" text-anchor="middle" font-size="11" fill="#6B7280">Slides carry the conclusion; notes and charts carry the detail</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#374151"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#D4AF37"/></marker>
  </defs>
</svg>
