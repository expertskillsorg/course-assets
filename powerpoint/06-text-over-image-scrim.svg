<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif">
  <rect width="640" height="320" fill="#FFFFFF"/>

  <!-- LEFT: no scrim, unreadable -->
  <text x="150" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">Without a scrim</text>
  <!-- busy photo simulated with light+dark patches -->
  <g>
    <rect x="30" y="45" width="240" height="230" fill="#E5E7EB"/>
    <rect x="30" y="45" width="240" height="115" fill="#D4AF37"/>
    <circle cx="90" cy="100" r="45" fill="#F0E3B0"/>
    <rect x="150" y="160" width="120" height="115" fill="#374151"/>
    <rect x="30" y="200" width="90" height="75" fill="#9CA3AF"/>
    <!-- white headline, disappears on the light gold band -->
    <text x="150" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF" opacity="0.55">LAUNCH DAY</text>
    <text x="150" y="123" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0.5">is finally here</text>
  </g>
  <text x="150" y="298" text-anchor="middle" font-size="12" fill="#374151">White text lost in the bright areas</text>

  <!-- RIGHT: with scrim, readable -->
  <text x="490" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E9B6B">With a scrim</text>
  <g>
    <rect x="370" y="45" width="240" height="230" fill="#E5E7EB"/>
    <rect x="370" y="45" width="240" height="115" fill="#D4AF37"/>
    <circle cx="430" cy="100" r="45" fill="#F0E3B0"/>
    <rect x="490" y="160" width="120" height="115" fill="#374151"/>
    <rect x="370" y="200" width="90" height="75" fill="#9CA3AF"/>
    <!-- semi-transparent dark scrim over whole image -->
    <rect x="370" y="45" width="240" height="230" fill="#141B5C" opacity="0.6"/>
    <!-- white headline now reads clearly -->
    <text x="490" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">LAUNCH DAY</text>
    <text x="490" y="178" text-anchor="middle" font-size="13" fill="#FFFFFF">is finally here</text>
  </g>
  <text x="490" y="298" text-anchor="middle" font-size="12" fill="#374151">Dark overlay makes text legible</text>
</svg>
