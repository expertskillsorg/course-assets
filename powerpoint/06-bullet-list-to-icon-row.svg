<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Arial, sans-serif">
  <rect width="660" height="300" fill="#FFFFFF"/>

  <!-- LEFT: plain bullet list -->
  <text x="150" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Plain bullet list</text>
  <rect x="30" y="45" width="240" height="215" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="60" cy="95" r="5" fill="#374151"/>
  <text x="78" y="100" font-size="15" fill="#111827">Fast setup</text>
  <circle cx="60" cy="145" r="5" fill="#374151"/>
  <text x="78" y="150" font-size="15" fill="#111827">Secure by default</text>
  <circle cx="60" cy="195" r="5" fill="#374151"/>
  <text x="78" y="200" font-size="15" fill="#111827">24/7 support</text>

  <!-- ARROW -->
  <g stroke="#3E9B6B" stroke-width="4" fill="none">
    <line x1="292" y1="152" x2="332" y2="152"/>
    <polyline points="320,142 332,152 320,162"/>
  </g>

  <!-- RIGHT: icon row -->
  <text x="490" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">Icon row</text>
  <rect x="360" y="45" width="270" height="215" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- icon 1: lightning (fast) -->
  <circle cx="410" cy="120" r="30" fill="#1E2A8E"/>
  <path d="M414 102 l-12 20 h9 l-4 16 12 -20 h-9 z" fill="#FFFFFF"/>
  <text x="410" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Fast setup</text>

  <!-- icon 2: shield (secure) -->
  <circle cx="495" cy="120" r="30" fill="#3E9B6B"/>
  <path d="M495 103 l14 5 v10 c0 10 -7 16 -14 20 c-7 -4 -14 -10 -14 -20 v-10 z" fill="#FFFFFF"/>
  <text x="495" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Secure</text>

  <!-- icon 3: headset (support) -->
  <circle cx="580" cy="120" r="30" fill="#C4683A"/>
  <path d="M568 122 v-3 a12 12 0 0 1 24 0 v3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="566" y="122" width="6" height="12" rx="2" fill="#FFFFFF"/>
  <rect x="588" y="122" width="6" height="12" rx="2" fill="#FFFFFF"/>
  <text x="580" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">24/7 support</text>

  <text x="495" y="235" text-anchor="middle" font-size="12" fill="#374151">Same three ideas, read in one glance</text>
</svg>
