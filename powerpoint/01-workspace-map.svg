<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="480" fill="#FFFFFF"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="26" fill="#141B5C"/>
  <text x="16" y="18" font-size="12" fill="#FFFFFF">Onboarding-Deck.pptx  —  PowerPoint</text>

  <!-- Ribbon tab strip -->
  <rect x="0" y="26" width="720" height="22" fill="#1E2A8E"/>
  <text x="16" y="41" font-size="11" fill="#FFFFFF">File</text>
  <text x="52" y="41" font-size="11" fill="#D4AF37" font-weight="bold">Home</text>
  <text x="98" y="41" font-size="11" fill="#FFFFFF">Insert</text>
  <text x="146" y="41" font-size="11" fill="#FFFFFF">Design</text>
  <text x="200" y="41" font-size="11" fill="#FFFFFF">Transitions</text>
  <text x="272" y="41" font-size="11" fill="#FFFFFF">Animations</text>
  <text x="346" y="41" font-size="11" fill="#FFFFFF">Slide Show</text>
  <rect x="560" y="29" width="140" height="15" rx="7" fill="#FFFFFF" opacity="0.85"/>
  <text x="568" y="41" font-size="10" fill="#374151">Search / Tell Me</text>

  <!-- Ribbon buttons area -->
  <rect x="0" y="48" width="720" height="52" fill="#E5E7EB"/>
  <rect x="14" y="58" width="34" height="34" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="58" width="34" height="34" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <rect x="102" y="58" width="34" height="34" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <rect x="150" y="58" width="60" height="34" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
  <text x="360" y="115" font-size="11" fill="#1E2A8E" font-weight="bold" text-anchor="middle">1  The Ribbon — every command, grouped under tabs</text>

  <!-- Thumbnail strip -->
  <rect x="0" y="128" width="130" height="300" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="16" y="140" width="98" height="55" rx="2" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="10" y="170" font-size="9" fill="#374151">1</text>
  <rect x="16" y="205" width="98" height="55" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="10" y="235" font-size="9" fill="#374151">2</text>
  <rect x="16" y="270" width="98" height="55" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="10" y="300" font-size="9" fill="#374151">3</text>
  <text x="65" y="350" font-size="10" fill="#1E2A8E" font-weight="bold" text-anchor="middle">2</text>
  <text x="65" y="365" font-size="9" fill="#374151" text-anchor="middle">Thumbnails</text>
  <text x="65" y="378" font-size="9" fill="#374151" text-anchor="middle">navigate + reorder</text>

  <!-- Slide pane -->
  <rect x="145" y="140" width="560" height="220" rx="3" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <rect x="185" y="170" width="360" height="26" rx="2" fill="#141B5C"/>
  <text x="200" y="188" font-size="13" fill="#FFFFFF">Welcome to the team</text>
  <rect x="185" y="215" width="300" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="185" y="235" width="260" height="10" rx="2" fill="#E5E7EB"/>
  <rect x="185" y="255" width="280" height="10" rx="2" fill="#E5E7EB"/>
  <text x="425" y="330" font-size="12" fill="#1E2A8E" font-weight="bold" text-anchor="middle">3  Slide pane — where you build the slide</text>

  <!-- Notes pane -->
  <rect x="145" y="368" width="560" height="44" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <text x="155" y="384" font-size="9" fill="#374151" font-style="italic">Click to add notes...</text>
  <text x="425" y="404" font-size="11" fill="#3E9B6B" font-weight="bold" text-anchor="middle">4  Notes pane — your script, hidden from the audience</text>

  <!-- Status bar -->
  <rect x="0" y="428" width="720" height="26" fill="#141B5C"/>
  <text x="16" y="445" font-size="10" fill="#FFFFFF">Slide 1 of 3</text>
  <!-- view switcher icons -->
  <rect x="480" y="433" width="16" height="16" rx="2" fill="#D4AF37"/>
  <rect x="502" y="433" width="16" height="16" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <rect x="524" y="433" width="16" height="16" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <rect x="546" y="433" width="16" height="16" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <!-- zoom -->
  <line x1="600" y1="441" x2="670" y2="441" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="650" cy="441" r="4" fill="#D4AF37"/>
  <text x="360" y="474" font-size="11" fill="#1E2A8E" font-weight="bold" text-anchor="middle">5  Status bar — view switcher (left group) and zoom slider (right)</text>
</svg>
