<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, sans-serif">
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Column headers -->
  <text x="235" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#C4683A">BEFORE</text>
  <text x="725" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#3E9B6B">AFTER</text>

  <!-- Arrow between -->
  <g transform="translate(480,300)">
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#1E2A8E" stroke-width="4"/>
    <path d="M14 -8 L26 0 L14 8 Z" fill="#1E2A8E"/>
  </g>

  <!-- ===== BEFORE slide ===== -->
  <g>
    <rect x="30" y="60" width="410" height="230" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <!-- topic title -->
    <text x="52" y="98" font-size="19" font-weight="bold" fill="#374151">Our Impact</text>
    <!-- wall of text lines -->
    <g fill="#9CA3AF">
      <rect x="52" y="114" width="366" height="7" rx="3"/>
      <rect x="52" y="128" width="366" height="7" rx="3"/>
      <rect x="52" y="142" width="366" height="7" rx="3"/>
      <rect x="52" y="156" width="366" height="7" rx="3"/>
      <rect x="52" y="170" width="366" height="7" rx="3"/>
      <rect x="52" y="184" width="366" height="7" rx="3"/>
      <rect x="52" y="198" width="366" height="7" rx="3"/>
      <rect x="52" y="212" width="366" height="7" rx="3"/>
      <rect x="52" y="226" width="366" height="7" rx="3"/>
      <rect x="52" y="240" width="300" height="7" rx="3"/>
      <rect x="52" y="254" width="340" height="7" rx="3"/>
      <rect x="52" y="268" width="210" height="7" rx="3"/>
    </g>
  </g>
  <text x="235" y="312" text-anchor="middle" font-size="13" fill="#C4683A">130 words, topic title, no point</text>

  <!-- ===== AFTER slide ===== -->
  <g>
    <rect x="520" y="60" width="410" height="230" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <!-- assertion title -->
    <text x="542" y="92" font-size="15" font-weight="bold" fill="#1E2A8E">We nearly doubled meals</text>
    <text x="542" y="110" font-size="15" font-weight="bold" fill="#1E2A8E">served last year</text>
    <!-- hero number -->
    <text x="725" y="178" text-anchor="middle" font-size="52" font-weight="bold" fill="#D4AF37">412,000</text>
    <text x="725" y="198" text-anchor="middle" font-size="12" fill="#374151">meals served, up from 210,000</text>
    <!-- icon row -->
    <g transform="translate(560,225)">
      <!-- plate -->
      <circle cx="30" cy="14" r="16" fill="none" stroke="#374151" stroke-width="2.5"/>
      <circle cx="30" cy="14" r="7" fill="none" stroke="#374151" stroke-width="2"/>
      <text x="30" y="52" text-anchor="middle" font-size="10" fill="#374151">Meals</text>
    </g>
    <g transform="translate(660,225)">
      <!-- house -->
      <path d="M14 16 L30 3 L46 16 L46 30 L14 30 Z" fill="none" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="30" y="52" text-anchor="middle" font-size="10" fill="#374151">Families</text>
    </g>
    <g transform="translate(760,225)">
      <!-- hand -->
      <path d="M18 28 L18 16 a4 4 0 0 1 8 0 l0 -4 a4 4 0 0 1 8 0 l0 4 a4 4 0 0 1 8 0 l0 12 a10 10 0 0 1 -10 8 h-6 a12 12 0 0 1 -10 -8 l-4 -8 a3 3 0 0 1 6 -2 z" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
      <text x="30" y="52" text-anchor="middle" font-size="10" fill="#374151">Volunteers</text>
    </g>
  </g>
  <text x="725" y="312" text-anchor="middle" font-size="13" fill="#3E9B6B">One idea, assertion title, one hero</text>

  <!-- ===== Change callouts ===== -->
  <g font-size="13" fill="#111827">
    <text x="60" y="365" font-weight="bold" fill="#1E2A8E">What changed, step by step</text>
    <g>
      <circle cx="70" cy="392" r="4" fill="#D4AF37"/>
      <text x="84" y="397">Paragraph moved to the speaker notes (Cut)</text>
    </g>
    <g>
      <circle cx="70" cy="418" r="4" fill="#D4AF37"/>
      <text x="84" y="423">Topic title became an assertion (Idea)</text>
    </g>
    <g>
      <circle cx="70" cy="444" r="4" fill="#D4AF37"/>
      <text x="84" y="449">Buried facts rebuilt as a big number + icon row (Structure)</text>
    </g>
    <g>
      <circle cx="70" cy="470" r="4" fill="#D4AF37"/>
      <text x="84" y="475">Objects aligned on a shared center line (Align)</text>
    </g>
    <g>
      <circle cx="70" cy="496" r="4" fill="#D4AF37"/>
      <text x="84" y="501">Accent color on 412,000 so the eye lands there first (Emphasize)</text>
    </g>
  </g>
</svg>
