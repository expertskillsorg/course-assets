<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif">
  <rect width="640" height="520" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Should this element animate?</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Run every element through this before adding motion</text>

  <!-- Start -->
  <rect x="220" y="80" width="200" height="46" rx="23" fill="#1E2A8E"/>
  <text x="320" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Pick one element</text>

  <!-- arrow -->
  <line x1="320" y1="126" x2="320" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="320,158 315,148 325,148" fill="#374151"/>

  <!-- Decision 1 -->
  <polygon points="320,160 470,215 320,270 170,215" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="320" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Does timing the</text>
  <text x="320" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">reveal help the</text>
  <text x="320" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">audience follow?</text>

  <!-- No branch (right) -->
  <line x1="470" y1="215" x2="545" y2="215" stroke="#374151" stroke-width="2"/>
  <polygon points="553,215 543,210 543,220" fill="#374151"/>
  <text x="505" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">No</text>
  <rect x="500" y="315" width="120" height="70" rx="8" fill="#C4683A"/>
  <text x="560" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">No</text>
  <text x="560" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">animation</text>
  <line x1="553" y1="215" x2="560" y2="215" stroke="#374151" stroke-width="2"/>
  <line x1="560" y1="215" x2="560" y2="315" stroke="#374151" stroke-width="2"/>
  <polygon points="560,315 555,305 565,305" fill="#374151"/>

  <!-- Yes branch (down) -->
  <line x1="320" y1="270" x2="320" y2="294" stroke="#374151" stroke-width="2"/>
  <polygon points="320,302 315,292 325,292" fill="#374151"/>
  <text x="335" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">Yes</text>

  <!-- Decision 2 -->
  <polygon points="320,304 460,352 320,400 180,352" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="320" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Is the slide already</text>
  <text x="320" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">carrying one idea?</text>

  <!-- No -> split -->
  <line x1="180" y1="352" x2="110" y2="352" stroke="#374151" stroke-width="2"/>
  <text x="150" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">No</text>
  <rect x="30" y="315" width="150" height="74" rx="8" fill="#D4AF37"/>
  <text x="105" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Split into more</text>
  <text x="105" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">slides instead</text>
  <line x1="110" y1="352" x2="105" y2="352" stroke="#374151" stroke-width="2"/>
  <line x1="105" y1="352" x2="105" y2="389" stroke="#374151" stroke-width="2"/>

  <!-- Yes -> animate -->
  <line x1="320" y1="400" x2="320" y2="430" stroke="#374151" stroke-width="2"/>
  <polygon points="320,438 315,428 325,428" fill="#374151"/>
  <text x="335" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">Yes</text>
  <rect x="185" y="440" width="270" height="60" rx="8" fill="#3E9B6B"/>
  <text x="320" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Subtle on-click Fade or Wipe</text>
  <text x="320" y="486" text-anchor="middle" font-size="12" fill="#FFFFFF">one style deck-wide, nothing loops</text>
</svg>
