<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, sans-serif">
  <rect width="960" height="560" fill="#FFFFFF"/>

  <!-- Column headers -->
  <text x="235" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#C4683A">BEFORE</text>
  <text x="725" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#3E9B6B">AFTER</text>

  <!-- Arrow between -->
  <g transform="translate(480,175)">
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#1E2A8E" stroke-width="4"/>
    <path d="M14 -8 L26 0 L14 8 Z" fill="#1E2A8E"/>
  </g>

  <!-- ===== BEFORE slide ===== -->
  <g>
    <rect x="30" y="60" width="410" height="230" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="52" y="90" font-size="17" font-weight="bold" fill="#374151">Funding Sources</text>
    <!-- two flat pies standing in for 3D pies -->
    <g>
      <circle cx="105" cy="150" r="34" fill="#1E2A8E"/>
      <path d="M105 150 L105 116 A34 34 0 0 1 135 166 Z" fill="#D4AF37"/>
      <path d="M105 150 L135 166 A34 34 0 0 1 90 181 Z" fill="#3E9B6B"/>
      <ellipse cx="105" cy="188" rx="34" ry="7" fill="#141B5C" opacity="0.4"/>
    </g>
    <g>
      <circle cx="195" cy="150" r="34" fill="#1E2A8E"/>
      <path d="M195 150 L195 116 A34 34 0 0 1 227 140 Z" fill="#D4AF37"/>
      <path d="M195 150 L227 140 A34 34 0 0 1 190 183 Z" fill="#3E9B6B"/>
      <ellipse cx="195" cy="188" rx="34" ry="7" fill="#141B5C" opacity="0.4"/>
    </g>
    <!-- legend -->
    <g font-size="8" fill="#374151">
      <rect x="250" y="118" width="8" height="8" fill="#1E2A8E"/><text x="262" y="125">Grants</text>
      <rect x="250" y="132" width="8" height="8" fill="#D4AF37"/><text x="262" y="139">Individual gifts</text>
      <rect x="250" y="146" width="8" height="8" fill="#3E9B6B"/><text x="262" y="153">Corporate</text>
      <rect x="250" y="160" width="8" height="8" fill="#C4683A"/><text x="262" y="167">Events</text>
      <rect x="250" y="174" width="8" height="8" fill="#9CA3AF"/><text x="262" y="181">Other</text>
    </g>
    <!-- data table -->
    <g stroke="#E5E7EB" stroke-width="1">
      <rect x="52" y="205" width="336" height="70" fill="none"/>
      <line x1="52" y1="228" x2="388" y2="228"/>
      <line x1="52" y1="251" x2="388" y2="251"/>
      <line x1="220" y1="205" x2="220" y2="275"/>
      <line x1="304" y1="205" x2="304" y2="275"/>
    </g>
    <g fill="#9CA3AF">
      <rect x="60" y="213" width="70" height="6"/><rect x="240" y="213" width="40" height="6"/><rect x="324" y="213" width="40" height="6"/>
      <rect x="60" y="236" width="70" height="6"/><rect x="240" y="236" width="40" height="6"/><rect x="324" y="236" width="40" height="6"/>
      <rect x="60" y="259" width="70" height="6"/><rect x="240" y="259" width="40" height="6"/><rect x="324" y="259" width="40" height="6"/>
    </g>
    <!-- smiley coin clip art -->
    <g transform="translate(400,95)">
      <circle cx="0" cy="0" r="18" fill="#D4AF37" stroke="#C4683A" stroke-width="2"/>
      <circle cx="-6" cy="-3" r="2" fill="#141B5C"/>
      <circle cx="6" cy="-3" r="2" fill="#141B5C"/>
      <path d="M-7 5 Q0 11 7 5" fill="none" stroke="#141B5C" stroke-width="2"/>
    </g>
  </g>
  <text x="235" y="312" text-anchor="middle" font-size="13" fill="#C4683A">Two 3D pies, legend, table, clip art</text>

  <!-- ===== AFTER slide ===== -->
  <g>
    <rect x="520" y="60" width="410" height="230" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="542" y="88" font-size="14" font-weight="bold" fill="#1E2A8E">Individual donors are now our largest</text>
    <text x="542" y="106" font-size="14" font-weight="bold" fill="#1E2A8E">source of funding</text>
    <!-- clustered column chart, baseline y=250 -->
    <line x1="560" y1="250" x2="900" y2="250" stroke="#374151" stroke-width="1.5"/>
    <!-- Grants group -->
    <rect x="600" y="175" width="34" height="75" fill="#9CA3AF"/>
    <rect x="640" y="160" width="34" height="90" fill="#9CA3AF"/>
    <text x="650" y="268" text-anchor="middle" font-size="11" fill="#374151">Grants</text>
    <!-- Individual gifts group (accent) -->
    <rect x="760" y="150" width="34" height="100" fill="#9CA3AF"/>
    <rect x="800" y="118" width="34" height="132" fill="#D4AF37"/>
    <text x="810" y="268" text-anchor="middle" font-size="11" fill="#374151">Individual gifts</text>
    <!-- annotation -->
    <text x="817" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#C4683A">overtook grants</text>
    <!-- last vs this year mini legend -->
    <g font-size="9" fill="#374151">
      <rect x="560" y="120" width="9" height="9" fill="#9CA3AF"/><text x="573" y="128">Last year</text>
      <rect x="560" y="134" width="9" height="9" fill="#D4AF37"/><text x="573" y="142">This year</text>
    </g>
  </g>
  <text x="725" y="312" text-anchor="middle" font-size="13" fill="#3E9B6B">One chart, one accent bar, one point</text>

  <!-- ===== Change callouts ===== -->
  <g font-size="13" fill="#111827">
    <text x="60" y="365" font-weight="bold" fill="#1E2A8E">What changed, step by step</text>
    <g>
      <circle cx="70" cy="392" r="4" fill="#D4AF37"/>
      <text x="84" y="397">One comparison chosen: individual gifts vs grants (Idea)</text>
    </g>
    <g>
      <circle cx="70" cy="418" r="4" fill="#D4AF37"/>
      <text x="84" y="423">Two pies became one clustered column chart (Structure)</text>
    </g>
    <g>
      <circle cx="70" cy="444" r="4" fill="#D4AF37"/>
      <text x="84" y="449">Legend, table, and clip-art coin removed; table sent to appendix (Cut)</text>
    </g>
    <g>
      <circle cx="70" cy="470" r="4" fill="#D4AF37"/>
      <text x="84" y="475">Accent bar plus gray, with a short annotation (Emphasize)</text>
    </g>
    <g>
      <circle cx="70" cy="496" r="4" fill="#D4AF37"/>
      <text x="84" y="501">Topic title rewritten as the finding (Idea)</text>
    </g>
  </g>
</svg>
