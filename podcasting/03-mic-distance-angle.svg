<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Mic distance and off-axis angle</text>

  <!-- baseline / desk -->
  <line x1="40" y1="330" x2="600" y2="330" stroke="#E5E7EB" stroke-width="3"/>

  <!-- Head -->
  <circle cx="160" cy="230" r="46" fill="#FFFFFF" stroke="#374151" stroke-width="3"/>
  <circle cx="178" cy="225" r="4" fill="#374151"/>
  <path d="M196 244 q14 10 26 4" fill="none" stroke="#C4683A" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="300" text-anchor="middle" font-size="14" fill="#374151">your mouth</text>

  <!-- Microphone body, set off to the side and tilted -->
  <g transform="translate(360 210) rotate(18)">
    <rect x="-26" y="-70" width="52" height="120" rx="22" fill="#1E2A8E"/>
    <rect x="-26" y="-70" width="52" height="44" rx="22" fill="#D4AF37"/>
    <rect x="-8" y="50" width="16" height="60" fill="#374151"/>
  </g>
  <text x="382" y="320" text-anchor="middle" font-size="14" fill="#374151">microphone</text>

  <!-- distance line: palm's width -->
  <line x1="206" y1="225" x2="338" y2="225" stroke="#3E9B6B" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="272" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">about a palm's width (4 to 6 in)</text>

  <!-- off-axis: speak ACROSS, not straight in -->
  <line x1="206" y1="232" x2="352" y2="186" stroke="#C4683A" stroke-width="3"/>
  <polygon points="352,186 338,184 344,196" fill="#C4683A"/>
  <text x="300" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">speak slightly across the mic</text>

  <text x="320" y="392" text-anchor="middle" font-size="13" fill="#374151">Off-axis angle softens hard "p" and "b" pops; steady distance keeps your loudness even.</text>
</svg>
