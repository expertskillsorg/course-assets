<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Reading the input meter</text>

  <!-- LEFT: healthy meter -->
  <g>
    <text x="160" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E2A8E">Healthy take</text>

    <!-- meter track -->
    <rect x="120" y="90" width="80" height="220" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
    <!-- filled level up to ~ -9 dB -->
    <rect x="128" y="168" width="64" height="134" rx="4" fill="#3E9B6B"/>
    <!-- peak cap marker -->
    <rect x="128" y="163" width="64" height="6" fill="#1E2A8E"/>

    <!-- scale labels -->
    <text x="214" y="100" font-size="12" fill="#374151">0</text>
    <text x="208" y="146" font-size="12" fill="#374151">-6</text>
    <text x="208" y="202" font-size="12" fill="#374151">-12</text>
    <text x="208" y="258" font-size="12" fill="#374151">-18</text>

    <!-- ceiling line -->
    <line x1="120" y1="98" x2="200" y2="98" stroke="#C4683A" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- headroom bracket -->
    <text x="160" y="135" text-anchor="middle" font-size="11" fill="#374151">headroom</text>

    <text x="160" y="340" text-anchor="middle" font-size="13" fill="#111827">Peaks near -9 dB</text>
    <text x="160" y="360" text-anchor="middle" font-size="13" fill="#3E9B6B" font-weight="bold">Safe, clear, room to spare</text>
  </g>

  <!-- divider -->
  <line x1="320" y1="70" x2="320" y2="350" stroke="#E5E7EB" stroke-width="2"/>

  <!-- RIGHT: clipped meter -->
  <g>
    <text x="480" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E2A8E">Clipped take</text>

    <rect x="440" y="90" width="80" height="220" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
    <!-- filled all the way to top -->
    <rect x="448" y="98" width="64" height="204" rx="4" fill="#C4683A"/>
    <!-- pinned overload bar at very top -->
    <rect x="448" y="92" width="64" height="10" fill="#141B5C"/>

    <text x="534" y="100" font-size="12" fill="#374151">0</text>
    <text x="528" y="146" font-size="12" fill="#374151">-6</text>
    <text x="528" y="202" font-size="12" fill="#374151">-12</text>
    <text x="528" y="258" font-size="12" fill="#374151">-18</text>

    <!-- OVER marker -->
    <text x="480" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">OVER</text>

    <text x="480" y="340" text-anchor="middle" font-size="13" fill="#111827">Pinned at 0 dB</text>
    <text x="480" y="360" text-anchor="middle" font-size="13" fill="#C4683A" font-weight="bold">Distorted, cannot be fixed</text>
  </g>
</svg>
