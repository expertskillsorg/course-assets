<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">One host feed fans out to every app</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#374151">Submit your feed once. Each app reads the same feed and shows your show.</text>

  <!-- Central hub: the host + feed -->
  <circle cx="200" cy="230" r="78" fill="#1E2A8E"/>
  <text x="200" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Your host</text>
  <text x="200" y="234" text-anchor="middle" font-size="12" fill="#FFFFFF">stores audio +</text>
  <text x="200" y="251" text-anchor="middle" font-size="12" fill="#FFFFFF">builds one</text>
  <text x="200" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4AF37">RSS feed</text>

  <!-- Spokes from hub to each destination -->
  <line x1="276" y1="190" x2="470" y2="100" stroke="#3E9B6B" stroke-width="3"/>
  <line x1="278" y1="218" x2="470" y2="180" stroke="#3E9B6B" stroke-width="3"/>
  <line x1="278" y1="248" x2="470" y2="262" stroke="#3E9B6B" stroke-width="3"/>
  <line x1="274" y1="276" x2="470" y2="344" stroke="#3E9B6B" stroke-width="3"/>

  <!-- Arrowheads at each destination -->
  <polygon points="470,100 456,96 459,109" fill="#3E9B6B"/>
  <polygon points="470,180 456,177 457,190" fill="#3E9B6B"/>
  <polygon points="470,262 457,256 455,269" fill="#3E9B6B"/>
  <polygon points="470,344 458,334 454,346" fill="#3E9B6B"/>

  <!-- Destination cards -->
  <rect x="478" y="78" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="498" y="100" font-size="13" font-weight="bold" fill="#111827">Apple Podcasts</text>
  <text x="498" y="117" font-size="11" fill="#374151">submit feed in Apple Podcasts Connect</text>

  <rect x="478" y="160" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="498" y="182" font-size="13" font-weight="bold" fill="#111827">Spotify</text>
  <text x="498" y="199" font-size="11" fill="#374151">submit feed in Spotify for Creators</text>

  <rect x="478" y="242" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="498" y="264" font-size="13" font-weight="bold" fill="#111827">YouTube</text>
  <text x="498" y="281" font-size="11" fill="#374151">add your feed to show it as a podcast</text>

  <rect x="478" y="324" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="498" y="346" font-size="13" font-weight="bold" fill="#111827">Other apps</text>
  <text x="498" y="363" font-size="11" fill="#374151">Amazon, Overcast, Pocket Casts, and more</text>

  <!-- Ownership note under hub -->
  <text x="200" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">You own the feed.</text>
  <text x="200" y="364" text-anchor="middle" font-size="11" fill="#374151">Move hosts and the apps</text>
  <text x="200" y="380" text-anchor="middle" font-size="11" fill="#374151">follow, if you redirect it.</text>
</svg>
