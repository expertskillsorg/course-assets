<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Soft surfaces stop the echo</text>

  <!-- Room walls -->
  <rect x="70" y="60" width="500" height="320" fill="#FFFFFF" stroke="#374151" stroke-width="3"/>

  <!-- Desk + mic in the middle -->
  <rect x="280" y="250" width="80" height="14" fill="#374151"/>
  <rect x="312" y="200" width="16" height="52" fill="#1E2A8E"/>
  <circle cx="320" cy="196" r="12" fill="#D4AF37"/>
  <text x="320" y="290" text-anchor="middle" font-size="13" fill="#374151">you + mic</text>

  <!-- Sound bouncing arrows toward walls -->
  <line x1="320" y1="200" x2="150" y2="140" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="320" y1="200" x2="490" y2="140" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="320" y1="210" x2="150" y2="320" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="320" y1="210" x2="490" y2="320" stroke="#C4683A" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- Soft surfaces: blanket on back wall, rug, curtain, cushions -->
  <rect x="200" y="64" width="240" height="22" fill="#3E9B6B"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">blanket on the wall behind you</text>

  <rect x="240" y="340" width="160" height="34" rx="6" fill="#3E9B6B"/>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">rug on the floor</text>

  <rect x="74" y="120" width="22" height="180" fill="#3E9B6B"/>
  <text x="86" y="216" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" transform="rotate(-90 86 216)">curtain</text>

  <rect x="544" y="120" width="22" height="180" fill="#3E9B6B"/>
  <text x="556" y="216" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold" transform="rotate(90 556 216)">cushions</text>

  <text x="320" y="412" text-anchor="middle" font-size="13" fill="#374151">Soft surfaces (green) catch the reflections instead of letting them bounce back into the mic.</text>
</svg>
