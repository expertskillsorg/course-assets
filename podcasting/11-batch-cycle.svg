<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="A repeating five-stage batch cycle that feeds a buffer of finished episodes staying ahead of the publish date">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">The Batch Cycle Keeps a Buffer Ahead</text>

  <!-- Cycle ring -->
  <circle cx="240" cy="225" r="135" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Stage nodes around the ring -->
  <!-- Plan (top) -->
  <circle cx="240" cy="90" r="40" fill="#1E2A8E"/>
  <text x="240" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Plan</text>
  <!-- Record (right) -->
  <circle cx="368" cy="178" r="40" fill="#3E9B6B"/>
  <text x="368" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Record</text>
  <!-- Edit (bottom right) -->
  <circle cx="320" cy="332" r="40" fill="#D4AF37"/>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#141B5C">Edit</text>
  <!-- Package (bottom left) -->
  <circle cx="160" cy="332" r="40" fill="#C4683A"/>
  <text x="160" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Pack-</text>
  <text x="160" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">age</text>
  <!-- Schedule (left) -->
  <circle cx="112" cy="178" r="40" fill="#141B5C"/>
  <text x="112" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Sched-</text>
  <text x="112" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">ule</text>

  <!-- Directional arrows along the ring -->
  <g fill="#374151">
    <polygon points="320,128 336,140 314,146"/>
    <polygon points="358,256 352,278 338,262"/>
    <polygon points="240,372 218,366 234,352"/>
    <polygon points="108,250 122,262 100,272"/>
    <polygon points="132,128 146,142 124,148"/>
  </g>

  <!-- Buffer output -->
  <line x1="375" y1="225" x2="500" y2="225" stroke="#374151" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="500,219 514,225 500,231" fill="#374151"/>
  <text x="530" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#141B5C">Finished buffer</text>

  <!-- Buffer stack of episodes -->
  <g>
    <rect x="528" y="140" width="150" height="34" rx="4" fill="#3E9B6B"/>
    <text x="603" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Ep 4 (ready)</text>
    <rect x="528" y="180" width="150" height="34" rx="4" fill="#3E9B6B"/>
    <text x="603" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Ep 5 (ready)</text>
    <rect x="528" y="220" width="150" height="34" rx="4" fill="#3E9B6B"/>
    <text x="603" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Ep 6 (ready)</text>
    <rect x="528" y="260" width="150" height="34" rx="4" fill="none" stroke="#E5E7EB" stroke-width="2"/>
    <text x="603" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Ep 7 (next batch)</text>
  </g>

  <!-- Publish line marker -->
  <line x1="528" y1="320" x2="678" y2="320" stroke="#C4683A" stroke-width="2"/>
  <text x="603" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C4683A">Publish date is here</text>
  <text x="603" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">three episodes of cushion above it</text>
</svg>
