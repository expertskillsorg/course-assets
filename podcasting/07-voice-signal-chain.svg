<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#FFFFFF"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Voice Signal Chain</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#374151">Always in this order, left to right</text>

  <!-- Raw input -->
  <rect x="24" y="110" width="120" height="80" rx="10" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <text x="84" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Raw</text>
  <text x="84" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">voice</text>

  <!-- arrow -->
  <line x1="148" y1="150" x2="186" y2="150" stroke="#374151" stroke-width="2.5"/>
  <polygon points="186,150 176,145 176,155" fill="#374151"/>

  <!-- Step 1 EQ -->
  <rect x="190" y="100" width="120" height="100" rx="10" fill="#1E2A8E" stroke="#141B5C" stroke-width="1.5"/>
  <text x="250" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1. EQ</text>
  <text x="250" y="160" text-anchor="middle" font-size="11.5" fill="#FFFFFF">Shapes tone:</text>
  <text x="250" y="176" text-anchor="middle" font-size="11.5" fill="#FFFFFF">cut mud,</text>
  <text x="250" y="192" text-anchor="middle" font-size="11.5" fill="#FFFFFF">add presence</text>

  <line x1="314" y1="150" x2="352" y2="150" stroke="#374151" stroke-width="2.5"/>
  <polygon points="352,150 342,145 342,155" fill="#374151"/>

  <!-- Step 2 Compression -->
  <rect x="356" y="100" width="120" height="100" rx="10" fill="#3E9B6B" stroke="#141B5C" stroke-width="1.5"/>
  <text x="416" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2. Compress</text>
  <text x="416" y="160" text-anchor="middle" font-size="11.5" fill="#FFFFFF">Evens volume:</text>
  <text x="416" y="176" text-anchor="middle" font-size="11.5" fill="#FFFFFF">loud and quiet</text>
  <text x="416" y="192" text-anchor="middle" font-size="11.5" fill="#FFFFFF">move closer</text>

  <line x1="480" y1="150" x2="518" y2="150" stroke="#374151" stroke-width="2.5"/>
  <polygon points="518,150 508,145 508,155" fill="#374151"/>

  <!-- Step 3 Limiter -->
  <rect x="522" y="100" width="120" height="100" rx="10" fill="#C4683A" stroke="#141B5C" stroke-width="1.5"/>
  <text x="582" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3. Limiter</text>
  <text x="582" y="160" text-anchor="middle" font-size="11.5" fill="#FFFFFF">Safety net:</text>
  <text x="582" y="176" text-anchor="middle" font-size="11.5" fill="#FFFFFF">catches stray</text>
  <text x="582" y="192" text-anchor="middle" font-size="11.5" fill="#FFFFFF">peaks</text>

  <line x1="646" y1="150" x2="684" y2="150" stroke="#374151" stroke-width="2.5"/>
  <polygon points="684,150 674,145 674,155" fill="#374151"/>

  <!-- Output -->
  <rect x="688" y="110" width="56" height="80" rx="10" fill="#D4AF37" stroke="#141B5C" stroke-width="1.5"/>
  <text x="716" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Clean</text>
  <text x="716" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">out</text>

  <text x="380" y="262" text-anchor="middle" font-size="13" fill="#374151">Tone first, then volume, then protection. Reversing the order undoes your work.</text>
</svg>
