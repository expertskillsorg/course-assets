<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Two podcast covers shown at full size and at tiny thumbnail size; the legible one stays readable while the cluttered one turns to mush">
  <rect x="0" y="0" width="640" height="360" fill="#FFFFFF"/>

  <!-- LEFT: legible cover -->
  <text x="160" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3E9B6B">Legible</text>

  <!-- full size legible -->
  <rect x="60" y="50" width="200" height="200" rx="10" fill="#1E2A8E"/>
  <text x="160" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF">CALM</text>
  <text x="160" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#D4AF37">PARENT</text>
  <text x="160" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">a parenting podcast</text>

  <!-- thumbnail legible -->
  <text x="160" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">at thumbnail size</text>
  <rect x="135" y="296" width="50" height="50" rx="4" fill="#1E2A8E"/>
  <text x="160" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">CALM</text>
  <text x="160" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#D4AF37">PARENT</text>

  <!-- divider -->
  <line x1="320" y1="50" x2="320" y2="346" stroke="#E5E7EB" stroke-width="2"/>

  <!-- RIGHT: unreadable cover -->
  <text x="480" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#C4683A">Unreadable</text>

  <!-- full size cluttered -->
  <rect x="380" y="50" width="200" height="200" rx="10" fill="#141B5C"/>
  <circle cx="430" cy="100" r="22" fill="#C4683A"/>
  <circle cx="525" cy="95" r="16" fill="#3E9B6B"/>
  <rect x="400" y="150" width="160" height="14" fill="#D4AF37"/>
  <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">The Wonderful Everyday Honest</text>
  <text x="480" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">Real Talk Parenting Journey Show</text>
  <text x="480" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1E2A8E">tiny tagline nobody can read here either</text>
  <text x="480" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">with photo + 6 words + 3 colors</text>

  <!-- thumbnail cluttered (mush) -->
  <text x="480" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">at thumbnail size</text>
  <rect x="455" y="296" width="50" height="50" rx="4" fill="#141B5C"/>
  <circle cx="468" cy="309" r="6" fill="#C4683A"/>
  <circle cx="491" cy="307" r="4" fill="#3E9B6B"/>
  <rect x="463" y="320" width="34" height="4" fill="#D4AF37"/>
  <rect x="463" y="328" width="34" height="3" fill="#6B7280"/>
  <rect x="463" y="334" width="34" height="3" fill="#6B7280"/>
</svg>
