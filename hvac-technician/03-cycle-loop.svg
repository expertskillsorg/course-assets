<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E2A8E"/>
    </marker>
    <marker id="arrowTerra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4683A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="560" fill="#FFFFFF"/>

  <rect x="24" y="60" width="376" height="440" rx="14" fill="#EEF0FA"/>
  <rect x="400" y="60" width="376" height="440" rx="14" fill="#FAEFE9"/>
  <line x1="400" y1="60" x2="400" y2="500" stroke="#374151" stroke-width="2" stroke-dasharray="8 6"/>

  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">One Loop, Four Jobs</text>

  <text x="212" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">LOW SIDE  ·  cold, low pressure</text>
  <text x="588" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">HIGH SIDE  ·  hot, high pressure</text>
  <text x="212" y="108" text-anchor="middle" font-size="13" fill="#374151">indoors</text>
  <text x="588" y="108" text-anchor="middle" font-size="13" fill="#374151">outdoors</text>

  <polyline points="150,310 150,420 312,420" fill="none" stroke="#1E2A8E" stroke-width="4" marker-end="url(#arrowNavy)"/>
  <polyline points="488,420 650,420 650,318" fill="none" stroke="#C4683A" stroke-width="4" marker-end="url(#arrowTerra)"/>
  <polyline points="650,190 650,105 488,105" fill="none" stroke="#C4683A" stroke-width="4" marker-end="url(#arrowTerra)"/>
  <polyline points="312,105 150,105 150,182" fill="none" stroke="#1E2A8E" stroke-width="4" marker-end="url(#arrowNavy)"/>

  <rect x="60" y="190" width="180" height="120" rx="10" fill="#1E2A8E"/>
  <text x="150" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">EVAPORATOR</text>
  <text x="150" y="258" text-anchor="middle" font-size="13" fill="#FFFFFF">indoor coil</text>
  <text x="150" y="280" text-anchor="middle" font-size="13" fill="#FFFFFF">absorbs house heat</text>
  <text x="150" y="298" text-anchor="middle" font-size="13" fill="#FFFFFF">liquid boils to vapor</text>

  <rect x="560" y="190" width="180" height="120" rx="10" fill="#C4683A"/>
  <text x="650" y="234" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">CONDENSER</text>
  <text x="650" y="258" text-anchor="middle" font-size="13" fill="#FFFFFF">outdoor coil</text>
  <text x="650" y="280" text-anchor="middle" font-size="13" fill="#FFFFFF">releases that heat</text>
  <text x="650" y="298" text-anchor="middle" font-size="13" fill="#FFFFFF">vapor condenses to liquid</text>

  <rect x="312" y="370" width="176" height="100" rx="10" fill="#D4AF37"/>
  <text x="400" y="404" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">COMPRESSOR</text>
  <text x="400" y="428" text-anchor="middle" font-size="13" fill="#111827">raises pressure</text>
  <text x="400" y="448" text-anchor="middle" font-size="13" fill="#111827">and temperature</text>

  <rect x="312" y="60" width="176" height="90" rx="10" fill="#3E9B6B"/>
  <text x="400" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">METERING DEVICE</text>
  <text x="400" y="114" text-anchor="middle" font-size="13" fill="#FFFFFF">drops pressure,</text>
  <text x="400" y="134" text-anchor="middle" font-size="13" fill="#FFFFFF">liquid flashes cold</text>

  <text x="196" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">suction line</text>
  <text x="196" y="465" text-anchor="middle" font-size="12" fill="#374151">cold low-pressure vapor</text>

  <text x="576" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">hot gas line</text>
  <text x="576" y="465" text-anchor="middle" font-size="12" fill="#374151">high-pressure hot vapor</text>

  <text x="572" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">liquid line</text>
  <text x="572" y="146" text-anchor="middle" font-size="12" fill="#374151">high-pressure warm liquid</text>

  <text x="228" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">cold mix</text>
  <text x="228" y="146" text-anchor="middle" font-size="12" fill="#374151">low-pressure liquid + vapor</text>

  <text x="400" y="524" text-anchor="middle" font-size="13" fill="#374151">The compressor and the metering device are the two borders between the sides.</text>
  <text x="400" y="544" text-anchor="middle" font-size="13" fill="#374151">Heat enters the loop at the evaporator and leaves it at the condenser. Nothing is used up.</text>
</svg>
