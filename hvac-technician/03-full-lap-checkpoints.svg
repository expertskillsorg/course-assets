<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Arial, sans-serif">
  <defs>
    <marker id="lapNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E2A8E"/>
    </marker>
    <marker id="lapTerra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4683A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">One Full Lap: Eight Checkpoints</text>

  <polyline points="340,150 260,150 260,240" fill="none" stroke="#1E2A8E" stroke-width="4" marker-end="url(#lapNavy)"/>
  <polyline points="260,335 260,430 324,430" fill="none" stroke="#1E2A8E" stroke-width="4" marker-end="url(#lapNavy)"/>
  <polyline points="470,430 540,430 540,340" fill="none" stroke="#C4683A" stroke-width="4" marker-end="url(#lapTerra)"/>
  <polyline points="540,245 540,150 466,150" fill="none" stroke="#C4683A" stroke-width="4" marker-end="url(#lapTerra)"/>

  <rect x="340" y="110" width="120" height="80" rx="8" fill="#3E9B6B"/>
  <text x="400" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">METERING</text>
  <text x="400" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">DEVICE</text>

  <rect x="180" y="245" width="160" height="90" rx="8" fill="#1E2A8E"/>
  <text x="264" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">EVAPORATOR</text>
  <text x="264" y="316" text-anchor="middle" font-size="12" fill="#FFFFFF">indoors</text>

  <rect x="460" y="245" width="160" height="90" rx="8" fill="#C4683A"/>
  <text x="546" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">CONDENSER</text>
  <text x="546" y="316" text-anchor="middle" font-size="12" fill="#FFFFFF">outdoors</text>

  <rect x="330" y="390" width="140" height="80" rx="8" fill="#D4AF37"/>
  <text x="400" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">COMPRESSOR</text>
  <text x="400" y="446" text-anchor="middle" font-size="12" fill="#111827">pressure jumps</text>

  <line x1="170" y1="185" x2="244" y2="212" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="170" y1="278" x2="180" y2="285" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="170" y1="372" x2="244" y2="378" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="200" y1="470" x2="290" y2="440" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="600" y1="470" x2="512" y2="440" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="630" y1="278" x2="620" y2="285" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="630" y1="188" x2="556" y2="212" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="640" y1="118" x2="516" y2="142" stroke="#E5E7EB" stroke-width="2"/>

  <rect x="10" y="150" width="160" height="66" rx="8" fill="#EEF0FA" stroke="#1E2A8E" stroke-width="2"/>
  <text x="20" y="170" font-size="12" font-weight="bold" fill="#1E2A8E">1 · Leaving metering</text>
  <text x="20" y="189" font-size="12" fill="#111827">LOW side  ·  ~40&#176;F</text>
  <text x="20" y="207" font-size="12" fill="#374151">cold liquid + vapor</text>

  <rect x="10" y="245" width="160" height="66" rx="8" fill="#EEF0FA" stroke="#1E2A8E" stroke-width="2"/>
  <text x="20" y="265" font-size="12" font-weight="bold" fill="#1E2A8E">2 · Through evaporator</text>
  <text x="20" y="284" font-size="12" fill="#111827">LOW  ·  ~40&#176;F held</text>
  <text x="20" y="302" font-size="12" fill="#374151">boiling into vapor</text>

  <rect x="10" y="340" width="160" height="66" rx="8" fill="#EEF0FA" stroke="#1E2A8E" stroke-width="2"/>
  <text x="20" y="360" font-size="12" font-weight="bold" fill="#1E2A8E">3 · Leaving evaporator</text>
  <text x="20" y="379" font-size="12" fill="#111827">LOW  ·  ~50&#176;F</text>
  <text x="20" y="397" font-size="12" fill="#374151">vapor + superheat</text>

  <rect x="110" y="475" width="180" height="66" rx="8" fill="#EEF0FA" stroke="#1E2A8E" stroke-width="2"/>
  <text x="120" y="495" font-size="12" font-weight="bold" fill="#1E2A8E">4 · Suction line</text>
  <text x="120" y="514" font-size="12" fill="#111827">LOW  ·  cold vapor</text>
  <text x="120" y="532" font-size="12" fill="#374151">big insulated pipe</text>

  <rect x="510" y="475" width="180" height="66" rx="8" fill="#FAEFE9" stroke="#C4683A" stroke-width="2"/>
  <text x="520" y="495" font-size="12" font-weight="bold" fill="#C4683A">5 · Leaving compressor</text>
  <text x="520" y="514" font-size="12" fill="#111827">HIGH side  ·  ~180&#176;F</text>
  <text x="520" y="532" font-size="12" fill="#374151">hot vapor</text>

  <rect x="630" y="245" width="160" height="66" rx="8" fill="#FAEFE9" stroke="#C4683A" stroke-width="2"/>
  <text x="640" y="265" font-size="12" font-weight="bold" fill="#C4683A">6 · Through condenser</text>
  <text x="640" y="284" font-size="12" fill="#111827">HIGH  ·  ~120&#176;F held</text>
  <text x="640" y="302" font-size="12" fill="#374151">condensing to liquid</text>

  <rect x="630" y="150" width="160" height="66" rx="8" fill="#FAEFE9" stroke="#C4683A" stroke-width="2"/>
  <text x="640" y="170" font-size="12" font-weight="bold" fill="#C4683A">7 · Leaving condenser</text>
  <text x="640" y="189" font-size="12" fill="#111827">HIGH  ·  ~110&#176;F</text>
  <text x="640" y="207" font-size="12" fill="#374151">liquid + subcooling</text>

  <rect x="620" y="55" width="170" height="66" rx="8" fill="#FAEFE9" stroke="#C4683A" stroke-width="2"/>
  <text x="630" y="75" font-size="12" font-weight="bold" fill="#C4683A">8 · Liquid line</text>
  <text x="630" y="94" font-size="12" fill="#111827">HIGH  ·  warm liquid</text>
  <text x="630" y="112" font-size="12" fill="#374151">small bare pipe</text>

  <circle cx="260" cy="212" r="15" fill="#1E2A8E"/>
  <text x="260" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <circle cx="205" cy="270" r="15" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="205" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">2</text>
  <circle cx="260" cy="378" r="15" fill="#1E2A8E"/>
  <text x="260" y="383" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
  <circle cx="300" cy="430" r="15" fill="#1E2A8E"/>
  <text x="300" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
  <circle cx="505" cy="430" r="15" fill="#C4683A"/>
  <text x="505" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>
  <circle cx="597" cy="270" r="15" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="597" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">6</text>
  <circle cx="540" cy="212" r="15" fill="#C4683A"/>
  <text x="540" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">7</text>
  <circle cx="502" cy="150" r="15" fill="#C4683A"/>
  <text x="502" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">8</text>

  <text x="400" y="570" text-anchor="middle" font-size="13" fill="#374151">Pressure changes in only two places: the compressor (low to high) and the metering device (high to low).</text>
  <text x="400" y="590" text-anchor="middle" font-size="13" fill="#374151">Temperatures are typical residential cooling figures, not exact specifications.</text>
</svg>
