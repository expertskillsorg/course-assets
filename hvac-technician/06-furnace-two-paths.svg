<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="880" height="580" fill="#FFFFFF"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Gas Furnace: Two Paths That Never Touch</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#374151">Upflow furnace, cutaway view. House air is warmed by contact, never by mixing.</text>

  <!-- cabinet -->
  <rect x="290" y="90" width="290" height="410" rx="8" fill="#F4F5FA" stroke="#141B5C" stroke-width="3"/>
  <line x1="290" y1="150" x2="580" y2="150" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="290" y1="360" x2="580" y2="360" stroke="#E5E7EB" stroke-width="2"/>

  <!-- supply plenum label -->
  <text x="435" y="122" text-anchor="middle" font-size="12" fill="#374151">supply plenum</text>

  <!-- heat exchanger: clamshell tubes -->
  <g stroke="#C4683A" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M330 340 L330 230 Q330 195 352 195 Q374 195 374 230 L374 300"/>
    <path d="M392 340 L392 230 Q392 195 414 195 Q436 195 436 230 L436 300"/>
    <path d="M454 340 L454 230 Q454 195 476 195 Q498 195 498 230 L498 300"/>
  </g>
  <text x="414" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">sealed heat exchanger</text>

  <!-- burners -->
  <rect x="318" y="340" width="192" height="20" rx="4" fill="#D4AF37" stroke="#141B5C" stroke-width="2"/>
  <g fill="#C4683A">
    <path d="M330 340 q8 -14 0 -26 q14 10 8 26 z"/>
    <path d="M392 340 q8 -14 0 -26 q14 10 8 26 z"/>
    <path d="M454 340 q8 -14 0 -26 q14 10 8 26 z"/>
  </g>
  <text x="414" y="378" text-anchor="middle" font-size="12" fill="#374151">burners + igniter + flame sensor</text>

  <!-- blower -->
  <circle cx="414" cy="440" r="42" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="3"/>
  <g stroke="#1E2A8E" stroke-width="3">
    <line x1="414" y1="398" x2="414" y2="482"/>
    <line x1="372" y1="440" x2="456" y2="440"/>
    <line x1="384" y1="410" x2="444" y2="470"/>
    <line x1="444" y1="410" x2="384" y2="470"/>
  </g>
  <text x="414" y="497" text-anchor="middle" font-size="12" fill="#1E2A8E">blower</text>

  <!-- gas valve -->
  <rect x="596" y="330" width="66" height="34" rx="4" fill="#FFFFFF" stroke="#D4AF37" stroke-width="3"/>
  <text x="629" y="352" text-anchor="middle" font-size="12" fill="#141B5C">gas valve</text>
  <line x1="596" y1="347" x2="510" y2="347" stroke="#D4AF37" stroke-width="5"/>
  <text x="700" y="352" font-size="12" fill="#374151">gas in</text>

  <!-- inducer -->
  <circle cx="614" cy="200" r="30" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <path d="M614 180 a20 20 0 0 1 14 34" fill="none" stroke="#C4683A" stroke-width="4"/>
  <text x="614" y="252" text-anchor="middle" font-size="12" fill="#C4683A">inducer motor</text>
  <line x1="580" y1="215" x2="590" y2="210" stroke="#C4683A" stroke-width="4"/>

  <!-- flue -->
  <path d="M614 170 L614 120 L760 120" fill="none" stroke="#C4683A" stroke-width="8" stroke-linecap="round"/>
  <text x="770" y="116" font-size="13" font-weight="bold" fill="#C4683A">flue</text>
  <text x="770" y="134" font-size="12" fill="#374151">to outdoors</text>

  <!-- combustion path arrows -->
  <g fill="#C4683A">
    <path d="M540 347 l-16 -7 v14 z"/>
    <path d="M414 300 l-7 16 h14 z" transform="rotate(180 414 308)"/>
  </g>
  <text x="470" y="316" font-size="11" fill="#C4683A">hot gases rise inside the tubes</text>

  <!-- air path arrows -->
  <g stroke="#1E2A8E" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M150 470 L250 470 L250 440 L366 440"/>
    <path d="M414 396 L414 300"/>
    <path d="M414 200 L414 96 L414 60"/>
  </g>
  <g fill="#1E2A8E">
    <path d="M372 440 l-18 -9 v18 z"/>
    <path d="M414 292 l-9 18 h18 z" transform="rotate(180 414 301)"/>
    <path d="M414 52 l-9 18 h18 z" transform="rotate(180 414 61)"/>
  </g>
  <text x="150" y="456" font-size="13" font-weight="bold" fill="#1E2A8E">return air in</text>
  <text x="440" y="252" font-size="12" fill="#1E2A8E">house air flows around</text>
  <text x="440" y="268" font-size="12" fill="#1E2A8E">the outside of the tubes</text>
  <text x="300" y="52" font-size="13" font-weight="bold" fill="#1E2A8E">warm supply air out</text>

  <!-- legend -->
  <rect x="60" y="510" width="760" height="52" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="82" y1="536" x2="130" y2="536" stroke="#1E2A8E" stroke-width="6" stroke-linecap="round"/>
  <text x="140" y="541" font-size="13" fill="#111827">Air path: return air, blower, over the exchanger, out to the house</text>
  <line x1="470" y1="536" x2="518" y2="536" stroke="#C4683A" stroke-width="6" stroke-linecap="round"/>
  <text x="528" y="541" font-size="13" fill="#111827">Combustion path: gas, burners, tubes, inducer, flue</text>
</svg>
