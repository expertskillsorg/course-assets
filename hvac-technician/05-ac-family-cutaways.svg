<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="880" height="640" fill="#FFFFFF"/>
  <text x="440" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The AC Family, Cut Away</text>
  <text x="440" y="54" text-anchor="middle" font-size="13" fill="#374151">Blue = indoor side (evaporator + blower) · Terracotta = outdoor side (compressor + condenser) · Gray = building wall</text>

  <!-- PANEL 1 SPLIT -->
  <rect x="20" y="72" width="410" height="250" rx="12" fill="#F7F8FC" stroke="#E5E7EB" stroke-width="2"/>
  <text x="40" y="98" font-size="16" font-weight="bold" fill="#1E2A8E">1 · Split System</text>
  <rect x="212" y="112" width="14" height="180" fill="#E5E7EB"/>
  <rect x="52" y="130" width="140" height="130" rx="8" fill="#1E2A8E"/>
  <text x="122" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">EVAPORATOR</text>
  <text x="122" y="196" text-anchor="middle" font-size="12" fill="#FFFFFF">+ BLOWER</text>
  <text x="122" y="222" text-anchor="middle" font-size="11" fill="#FFFFFF">air handler</text>
  <rect x="246" y="130" width="150" height="130" rx="8" fill="#C4683A"/>
  <text x="321" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">COMPRESSOR</text>
  <text x="321" y="196" text-anchor="middle" font-size="12" fill="#FFFFFF">+ CONDENSER</text>
  <text x="321" y="222" text-anchor="middle" font-size="11" fill="#FFFFFF">yard unit</text>
  <path d="M192 190 L246 190" stroke="#D4AF37" stroke-width="8"/>
  <text x="219" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#D4AF37">line set</text>
  <rect x="90" y="112" width="64" height="16" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <text x="122" y="292" text-anchor="middle" font-size="11" fill="#374151">ducts through the house</text>

  <!-- PANEL 2 MINI SPLIT -->
  <rect x="450" y="72" width="410" height="250" rx="12" fill="#F7F8FC" stroke="#E5E7EB" stroke-width="2"/>
  <text x="470" y="98" font-size="16" font-weight="bold" fill="#1E2A8E">2 · Ductless Mini-Split</text>
  <rect x="642" y="112" width="14" height="180" fill="#E5E7EB"/>
  <rect x="500" y="128" width="128" height="46" rx="8" fill="#1E2A8E"/>
  <text x="564" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">WALL HEAD</text>
  <text x="564" y="164" text-anchor="middle" font-size="10" fill="#FFFFFF">coil + fan, no duct</text>
  <path d="M508 178 L500 196 M540 178 L532 196 M572 178 L564 196 M604 178 L596 196" stroke="#1E2A8E" stroke-width="3"/>
  <rect x="500" y="228" width="128" height="46" rx="8" fill="#1E2A8E"/>
  <text x="564" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">SECOND HEAD</text>
  <text x="564" y="264" text-anchor="middle" font-size="10" fill="#FFFFFF">its own zone</text>
  <rect x="676" y="152" width="150" height="110" rx="8" fill="#C4683A"/>
  <text x="751" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">INVERTER</text>
  <text x="751" y="216" text-anchor="middle" font-size="12" fill="#FFFFFF">OUTDOOR UNIT</text>
  <text x="751" y="240" text-anchor="middle" font-size="11" fill="#FFFFFF">variable speed</text>
  <path d="M628 150 L660 150 L660 200 L676 200" fill="none" stroke="#D4AF37" stroke-width="6"/>
  <path d="M628 250 L660 250 L660 210 L676 210" fill="none" stroke="#D4AF37" stroke-width="6"/>
  <text x="656" y="304" text-anchor="middle" font-size="11" fill="#374151">line sets through a 3-inch hole</text>

  <!-- PANEL 3 PACKAGED -->
  <rect x="20" y="340" width="410" height="250" rx="12" fill="#F7F8FC" stroke="#E5E7EB" stroke-width="2"/>
  <text x="40" y="366" font-size="16" font-weight="bold" fill="#1E2A8E">3 · Packaged Unit / RTU</text>
  <rect x="52" y="386" width="150" height="150" rx="8" fill="#EEF0FA" stroke="#374151" stroke-width="2"/>
  <text x="127" y="470" text-anchor="middle" font-size="12" fill="#374151">conditioned space</text>
  <rect x="52" y="374" width="150" height="14" fill="#E5E7EB"/>
  <rect x="228" y="366" width="180" height="150" rx="8" fill="#C4683A"/>
  <text x="318" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">ONE CABINET</text>
  <rect x="242" y="410" width="152" height="40" rx="6" fill="#1E2A8E"/>
  <text x="318" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">evaporator + blower</text>
  <text x="318" y="472" text-anchor="middle" font-size="11" fill="#FFFFFF">compressor + condenser</text>
  <text x="318" y="494" text-anchor="middle" font-size="11" fill="#FFFFFF">no line set at all</text>
  <rect x="220" y="516" width="196" height="14" fill="#374151"/>
  <text x="318" y="546" text-anchor="middle" font-size="11" fill="#374151">roof curb or slab pad</text>
  <path d="M228 420 L202 420" stroke="#D4AF37" stroke-width="10"/>
  <path d="M228 460 L202 460" stroke="#D4AF37" stroke-width="10"/>
  <text x="215" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">supply</text>
  <text x="215" y="482" text-anchor="middle" font-size="10" font-weight="bold" fill="#D4AF37">return</text>

  <!-- PANEL 4 WINDOW -->
  <rect x="450" y="340" width="410" height="250" rx="12" fill="#F7F8FC" stroke="#E5E7EB" stroke-width="2"/>
  <text x="470" y="366" font-size="16" font-weight="bold" fill="#1E2A8E">4 · Window Unit</text>
  <rect x="642" y="380" width="14" height="160" fill="#E5E7EB"/>
  <rect x="520" y="392" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <rect x="524" y="396" width="122" height="122" fill="#1E2A8E"/>
  <text x="585" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">EVAPORATOR</text>
  <text x="585" y="458" text-anchor="middle" font-size="11" fill="#FFFFFF">+ blower</text>
  <text x="585" y="482" text-anchor="middle" font-size="10" fill="#FFFFFF">room side</text>
  <rect x="652" y="396" width="114" height="122" fill="#C4683A"/>
  <text x="709" y="434" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">COMPRESSOR</text>
  <text x="709" y="452" text-anchor="middle" font-size="11" fill="#FFFFFF">+ condenser</text>
  <text x="709" y="470" text-anchor="middle" font-size="11" fill="#FFFFFF">+ fan</text>
  <text x="709" y="492" text-anchor="middle" font-size="10" fill="#FFFFFF">outdoor side</text>
  <circle cx="646" cy="500" r="7" fill="#D4AF37"/>
  <text x="646" y="544" text-anchor="middle" font-size="11" font-weight="bold" fill="#D4AF37">cap tube crosses the divider</text>
  <text x="656" y="564" text-anchor="middle" font-size="11" fill="#374151">the entire cycle within arm's reach</text>

  <text x="440" y="618" text-anchor="middle" font-size="13" fill="#374151">Same four components in every panel. Only the packaging and the air delivery change.</text>
</svg>
