<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#FFFFFF"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Path Into the Trade</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#374151">From where you are now to a working technician</text>

  <line x1="60" y1="470" x2="840" y2="470" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="494" font-size="11" fill="#374151">TODAY</text>
  <text x="840" y="494" font-size="11" fill="#374151" text-anchor="end">2 TO 5 YEARS OUT</text>

  <!-- Stage 1: knowledge -->
  <rect x="52" y="200" width="150" height="86" rx="8" fill="#1E2A8E"/>
  <text x="127" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Foundations</text>
  <text x="127" y="250" text-anchor="middle" font-size="11.5" fill="#FFFFFF">This course:</text>
  <text x="127" y="266" text-anchor="middle" font-size="11.5" fill="#FFFFFF">cycle, systems,</text>
  <text x="127" y="282" text-anchor="middle" font-size="11.5" fill="#FFFFFF">electrical, safety</text>
  <text x="127" y="310" text-anchor="middle" font-size="11" fill="#374151">Certificate of Completion</text>
  <text x="127" y="326" text-anchor="middle" font-size="11" fill="#374151">(not a license)</text>

  <!-- arrow 1 -->
  <line x1="206" y1="243" x2="248" y2="243" stroke="#374151" stroke-width="2.5"/>
  <polygon points="248,236 262,243 248,250" fill="#374151"/>

  <!-- Stage 2: EPA 608 -->
  <rect x="266" y="196" width="152" height="94" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="3"/>
  <text x="342" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">EPA 608</text>
  <text x="342" y="244" text-anchor="middle" font-size="11.5" fill="#374151">Study Core, aim</text>
  <text x="342" y="260" text-anchor="middle" font-size="11.5" fill="#374151">for Universal</text>
  <text x="342" y="278" text-anchor="middle" font-size="11.5" fill="#374151">Approx. $25 to $150</text>
  <text x="342" y="312" text-anchor="middle" font-size="11" fill="#C4683A">EPA-approved provider only</text>
  <text x="342" y="328" text-anchor="middle" font-size="11" fill="#C4683A">Card does not expire</text>

  <!-- fan out to three routes -->
  <line x1="422" y1="243" x2="452" y2="243" stroke="#374151" stroke-width="2.5"/>
  <line x1="452" y1="118" x2="452" y2="368" stroke="#374151" stroke-width="2.5"/>
  <line x1="452" y1="118" x2="486" y2="118" stroke="#374151" stroke-width="2.5"/>
  <line x1="452" y1="243" x2="486" y2="243" stroke="#374151" stroke-width="2.5"/>
  <line x1="452" y1="368" x2="486" y2="368" stroke="#374151" stroke-width="2.5"/>
  <polygon points="486,111 500,118 486,125" fill="#374151"/>
  <polygon points="486,236 500,243 486,250" fill="#374151"/>
  <polygon points="486,361 500,368 486,375" fill="#374151"/>

  <text x="452" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">THREE DOORS</text>

  <!-- Route cards -->
  <rect x="504" y="84" width="186" height="70" rx="8" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="518" y="108" font-size="13" font-weight="bold" fill="#1E2A8E">Trade School</text>
  <text x="518" y="127" font-size="11.5" fill="#374151">6 months to 2 years</text>
  <text x="518" y="144" font-size="11.5" fill="#374151">Roughly $1,200 to $15,000+</text>

  <rect x="504" y="209" width="186" height="70" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="518" y="233" font-size="13" font-weight="bold" fill="#3E9B6B">Apprenticeship</text>
  <text x="518" y="252" font-size="11.5" fill="#374151">3 to 5 years, paid</text>
  <text x="518" y="269" font-size="11.5" fill="#374151">Competitive entry</text>

  <rect x="504" y="334" width="186" height="70" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="518" y="358" font-size="13" font-weight="bold" fill="#C4683A">Helper Job</text>
  <text x="518" y="377" font-size="11.5" fill="#374151">Hired now, learn on the truck</text>
  <text x="518" y="394" font-size="11.5" fill="#374151">Fastest paycheck</text>

  <!-- funnel in -->
  <line x1="694" y1="118" x2="722" y2="118" stroke="#374151" stroke-width="2.5"/>
  <line x1="694" y1="243" x2="722" y2="243" stroke="#374151" stroke-width="2.5"/>
  <line x1="694" y1="368" x2="722" y2="368" stroke="#374151" stroke-width="2.5"/>
  <line x1="722" y1="118" x2="722" y2="368" stroke="#374151" stroke-width="2.5"/>
  <line x1="722" y1="243" x2="756" y2="243" stroke="#374151" stroke-width="2.5"/>
  <polygon points="756,236 770,243 756,250" fill="#374151"/>

  <!-- Stage 4: first job -->
  <rect x="774" y="186" width="82" height="114" rx="8" fill="#141B5C"/>
  <text x="815" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">First</text>
  <text x="815" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Job</text>
  <text x="815" y="258" text-anchor="middle" font-size="11" fill="#D4AF37">Work under</text>
  <text x="815" y="273" text-anchor="middle" font-size="11" fill="#D4AF37">the shop's</text>
  <text x="815" y="288" text-anchor="middle" font-size="11" fill="#D4AF37">license</text>

  <text x="815" y="324" text-anchor="middle" font-size="11" fill="#374151">Log hours,</text>
  <text x="815" y="340" text-anchor="middle" font-size="11" fill="#374151">then state</text>
  <text x="815" y="356" text-anchor="middle" font-size="11" fill="#374151">licensing</text>

  <!-- boosters band -->
  <rect x="52" y="404" width="366" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="66" y="424" font-size="11.5" font-weight="bold" fill="#141B5C">Boosters, any time:</text>
  <text x="66" y="442" font-size="11.5" fill="#374151">OSHA 10 card, entry-level industry credential, driver's license</text>
</svg>
