<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img">
  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#141B5C">From complaint to isolated fault</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">The fault sits at the step where the sequence stops</text>

  <!-- Stage 1 -->
  <rect x="40" y="88" width="240" height="62" rx="8" fill="#1E2A8E"/>
  <text x="160" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1. Verify the complaint</text>
  <text x="160" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">See the failure yourself</text>

  <path d="M280 119 L322 119" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M322 119 l-9 -5 l0 10 z" fill="#374151"/>

  <!-- Stage 2 -->
  <rect x="330" y="88" width="240" height="62" rx="8" fill="#1E2A8E"/>
  <text x="450" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2. Observe for free</text>
  <text x="450" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">Look, listen, smell, touch, ask</text>

  <path d="M570 119 L612 119" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M612 119 l-9 -5 l0 10 z" fill="#374151"/>

  <!-- Stage 3 -->
  <rect x="620" y="88" width="240" height="62" rx="8" fill="#1E2A8E"/>
  <text x="740" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3. Walk the sequence</text>
  <text x="740" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">Measure at each step</text>

  <path d="M740 150 L740 178 L450 178 L450 200" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M450 200 l-5 -9 l10 0 z" fill="#374151"/>

  <!-- Sequence chain label -->
  <text x="60" y="228" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Expected sequence of operation (cooling call)</text>

  <!-- chain boxes -->
  <rect x="40" y="242" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="116" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">Thermostat</text>
  <text x="116" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">calls for cool</text>
  <text x="116" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3E9B6B">24V present</text>

  <rect x="212" y="242" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="288" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">Signal reaches</text>
  <text x="288" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">outdoor unit</text>
  <text x="288" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3E9B6B">24V present</text>

  <rect x="384" y="242" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="460" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">Contactor</text>
  <text x="460" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">pulls in</text>
  <text x="460" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3E9B6B">line voltage out</text>

  <rect x="556" y="242" width="152" height="70" rx="6" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <text x="632" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">Compressor</text>
  <text x="632" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">starts and runs</text>
  <text x="632" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C4683A">hums, will not start</text>

  <rect x="728" y="242" width="132" height="70" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2.5"/>
  <text x="794" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Cold air</text>
  <text x="794" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">at the register</text>
  <text x="794" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">not reached</text>

  <!-- connectors between chain boxes -->
  <path d="M192 277 L208 277" stroke="#374151" stroke-width="2"/>
  <path d="M364 277 L380 277" stroke="#374151" stroke-width="2"/>
  <path d="M536 277 L552 277" stroke="#374151" stroke-width="2"/>
  <path d="M708 277 L724 277" stroke="#374151" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- fault marker -->
  <path d="M632 320 L632 348" stroke="#C4683A" stroke-width="2.5"/>
  <path d="M632 348 l-6 -10 l12 0 z" fill="#C4683A"/>
  <rect x="470" y="352" width="324" height="46" rx="8" fill="#C4683A"/>
  <text x="632" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">The sequence dies here. Test in this zone.</text>

  <!-- half-splitting note -->
  <rect x="40" y="352" width="400" height="46" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <text x="60" y="372" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#141B5C">Half-splitting</text>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="12" fill="#374151">Test the middle of the chain first, kill half the suspects.</text>

  <!-- bottom stages -->
  <rect x="40" y="432" width="380" height="66" rx="8" fill="#141B5C"/>
  <text x="230" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">4. Confirm before you condemn</text>
  <text x="230" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">One measurement that proves this part, not a guess</text>

  <path d="M420 465 L472 465" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M472 465 l-9 -5 l0 10 z" fill="#374151"/>

  <rect x="480" y="432" width="380" height="66" rx="8" fill="#3E9B6B"/>
  <text x="670" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">5. Repair, then re-run the whole sequence</text>
  <text x="670" y="479" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">A fix is not done until the system completes every step</text>

  <text x="450" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Same method on any equipment, including gear you have never seen before.</text>
</svg>
