<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Signed Lease to Opening Day</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#374151">A typical build-out timeline. Weeks vary by city and how much work the space needs.</text>

  <!-- Baseline -->
  <line x1="60" y1="208" x2="700" y2="208" stroke="#E5E7EB" stroke-width="4"/>

  <!-- Start marker -->
  <circle cx="60" cy="208" r="8" fill="#1E2A8E"/>
  <text x="60" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">Lease</text>
  <text x="60" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">signed</text>

  <!-- End marker -->
  <circle cx="700" cy="208" r="8" fill="#3E9B6B"/>
  <text x="700" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">Opening</text>
  <text x="700" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">day</text>

  <!-- Phase 1: Permits -->
  <rect x="78" y="186" width="104" height="44" rx="6" fill="#1E2A8E"/>
  <text x="130" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Permits</text>
  <text x="130" y="221" text-anchor="middle" font-size="10" fill="#FFFFFF">filed first</text>
  <text x="130" y="160" text-anchor="middle" font-size="10" fill="#374151">Weeks 1-4+</text>
  <line x1="130" y1="166" x2="130" y2="184" stroke="#374151" stroke-width="1"/>

  <!-- Phase 2: Utilities -->
  <rect x="190" y="186" width="104" height="44" rx="6" fill="#D4AF37"/>
  <text x="242" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Utilities</text>
  <text x="242" y="221" text-anchor="middle" font-size="10" fill="#141B5C">capacity check</text>
  <text x="242" y="160" text-anchor="middle" font-size="10" fill="#374151">Weeks 2-5</text>
  <line x1="242" y1="166" x2="242" y2="184" stroke="#374151" stroke-width="1"/>

  <!-- Phase 3: Construction -->
  <rect x="302" y="186" width="116" height="44" rx="6" fill="#C4683A"/>
  <text x="360" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Plumbing</text>
  <text x="360" y="221" text-anchor="middle" font-size="10" fill="#FFFFFF">and electrical</text>
  <text x="360" y="160" text-anchor="middle" font-size="10" fill="#374151">Weeks 4-9</text>
  <line x1="360" y1="166" x2="360" y2="184" stroke="#374151" stroke-width="1"/>

  <!-- Phase 4: Install -->
  <rect x="426" y="186" width="104" height="44" rx="6" fill="#1E2A8E"/>
  <text x="478" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Machine</text>
  <text x="478" y="221" text-anchor="middle" font-size="10" fill="#FFFFFF">install</text>
  <text x="478" y="160" text-anchor="middle" font-size="10" fill="#374151">Weeks 8-11</text>
  <line x1="478" y1="166" x2="478" y2="184" stroke="#374151" stroke-width="1"/>

  <!-- Phase 5: Inspection -->
  <rect x="538" y="186" width="104" height="44" rx="6" fill="#D4AF37"/>
  <text x="590" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Final</text>
  <text x="590" y="221" text-anchor="middle" font-size="10" fill="#141B5C">inspections</text>
  <text x="590" y="160" text-anchor="middle" font-size="10" fill="#374151">Weeks 10-12</text>
  <line x1="590" y1="166" x2="590" y2="184" stroke="#374151" stroke-width="1"/>

  <!-- Phase 6: Launch -->
  <rect x="650" y="186" width="44" height="44" rx="6" fill="#3E9B6B"/>
  <text x="672" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Soft</text>
  <text x="672" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">open</text>

  <!-- Bottom note bar -->
  <rect x="78" y="288" width="616" height="44" rx="6" fill="#F3F4F6"/>
  <text x="92" y="306" font-size="12" font-weight="bold" fill="#141B5C">Why permits go first:</text>
  <text x="92" y="324" font-size="12" fill="#374151">City review is the slowest, hardest-to-control step, so you start it the day you sign and run everything else alongside it.</text>
</svg>
