<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="680" height="480" fill="#ffffff"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Camera and Lighting Coverage Zones</text>

  <!-- lighting wash (no dark corners) -->
  <rect x="70" y="60" width="540" height="330" fill="#D4AF37" fill-opacity="0.10"/>

  <!-- store outer wall -->
  <rect x="70" y="60" width="540" height="330" fill="none" stroke="#374151" stroke-width="3"/>

  <!-- entrance bottom center -->
  <rect x="310" y="382" width="60" height="14" fill="#3E9B6B"/>
  <text x="340" y="416" text-anchor="middle" font-size="12" fill="#111827" font-weight="bold">Entrance</text>

  <!-- machine banks: washers left, dryers right -->
  <rect x="86" y="84" width="44" height="270" fill="#1E2A8E" rx="4"/>
  <text x="108" y="219" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" transform="rotate(-90 108 219)">WASHERS</text>
  <rect x="550" y="84" width="44" height="270" fill="#C4683A" rx="4"/>
  <text x="572" y="219" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold" transform="rotate(-90 572 219)">DRYERS</text>

  <!-- money handling area (changer + ATM) -->
  <rect x="295" y="84" width="90" height="50" fill="#141B5C" rx="4"/>
  <text x="340" y="105" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="bold">Changer /</text>
  <text x="340" y="120" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="bold">ATM (cash)</text>

  <!-- folding/seating center -->
  <rect x="290" y="200" width="100" height="60" fill="#3E9B6B" rx="6"/>
  <text x="340" y="235" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">Fold / seat</text>

  <!-- CAMERA cones -->
  <!-- Camera 1: corner top-left, covers entrance + washers -->
  <polygon points="92,78 360,372 100,372" fill="#1E2A8E" fill-opacity="0.14" stroke="#1E2A8E" stroke-width="1"/>
  <circle cx="92" cy="78" r="7" fill="#1E2A8E"/>
  <text x="100" y="74" font-size="10" fill="#1E2A8E" font-weight="bold">Cam 1</text>

  <!-- Camera 2: corner top-right, covers entrance + dryers -->
  <polygon points="588,78 320,372 580,372" fill="#C4683A" fill-opacity="0.14" stroke="#C4683A" stroke-width="1"/>
  <circle cx="588" cy="78" r="7" fill="#C4683A"/>
  <text x="552" y="74" font-size="10" fill="#C4683A" font-weight="bold">Cam 2</text>

  <!-- Camera 3: aimed at cash area -->
  <polygon points="340,360 296,150 384,150" fill="#141B5C" fill-opacity="0.16" stroke="#141B5C" stroke-width="1"/>
  <circle cx="340" cy="360" r="7" fill="#141B5C"/>
  <text x="348" y="364" font-size="10" fill="#141B5C" font-weight="bold">Cam 3 (cash)</text>

  <!-- legend -->
  <rect x="70" y="430" width="540" height="40" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5" rx="6"/>
  <rect x="86" y="442" width="16" height="16" fill="#D4AF37" fill-opacity="0.30"/>
  <text x="108" y="455" font-size="11.5" fill="#111827">Lighting (no dark corners)</text>
  <polygon points="280,442 296,442 288,458" fill="#1E2A8E" fill-opacity="0.30"/>
  <text x="302" y="455" font-size="11.5" fill="#111827">Camera coverage cone</text>
  <circle cx="470" cy="450" r="6" fill="#141B5C"/>
  <text x="482" y="455" font-size="11.5" fill="#111827">Camera position</text>
</svg>
