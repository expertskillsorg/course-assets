<svg viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="470" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="19" font-weight="bold" fill="#141B5C">Sample Annual Income Statement</text>
  <text x="40" y="54" font-size="12" fill="#374151">Read every line as a percentage of gross revenue.</text>

  <!-- statement table -->
  <rect x="40" y="72" width="350" height="350" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- header row -->
  <rect x="40" y="72" width="350" height="34" fill="#141B5C"/>
  <text x="56" y="94" font-size="13" font-weight="bold" fill="#FFFFFF">Line item</text>
  <text x="300" y="94" font-size="13" font-weight="bold" fill="#FFFFFF">Amount</text>
  <text x="372" y="94" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="end">%</text>

  <!-- Gross revenue -->
  <text x="56" y="132" font-size="13" font-weight="bold" fill="#111827">Gross revenue</text>
  <text x="372" y="132" font-size="13" font-weight="bold" fill="#1E2A8E" text-anchor="end">$240,000</text>
  <text x="372" y="148" font-size="11" fill="#374151" text-anchor="end">100%</text>
  <line x1="40" y1="158" x2="390" y2="158" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Utilities -->
  <text x="56" y="182" font-size="13" fill="#111827">Utilities (water, gas, power)</text>
  <text x="372" y="182" font-size="13" fill="#C4683A" text-anchor="end">$53,000</text>
  <text x="372" y="198" font-size="11" fill="#374151" text-anchor="end">22%</text>
  <line x1="40" y1="208" x2="390" y2="208" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Rent -->
  <text x="56" y="232" font-size="13" fill="#111827">Rent</text>
  <text x="372" y="232" font-size="13" fill="#111827" text-anchor="end">$36,000</text>
  <text x="372" y="248" font-size="11" fill="#374151" text-anchor="end">15%</text>
  <line x1="40" y1="258" x2="390" y2="258" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Repairs -->
  <text x="56" y="282" font-size="13" fill="#111827">Repairs &amp; maintenance</text>
  <text x="372" y="282" font-size="13" fill="#C4683A" text-anchor="end">$12,000</text>
  <text x="372" y="298" font-size="11" fill="#374151" text-anchor="end">5%</text>
  <line x1="40" y1="308" x2="390" y2="308" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Other operating -->
  <text x="56" y="332" font-size="13" fill="#111827">Insurance, supplies, labor</text>
  <text x="372" y="332" font-size="13" fill="#111827" text-anchor="end">$39,000</text>
  <text x="372" y="348" font-size="11" fill="#374151" text-anchor="end">16%</text>
  <line x1="40" y1="358" x2="390" y2="358" stroke="#374151" stroke-width="1.5"/>

  <!-- Net income -->
  <rect x="40" y="362" width="350" height="44" fill="#3E9B6B"/>
  <text x="56" y="390" font-size="14" font-weight="bold" fill="#FFFFFF">Net income</text>
  <text x="372" y="390" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="end">$100,000  (42%)</text>

  <!-- annotation arrows + notes -->
  <!-- utilities note -->
  <line x1="390" y1="182" x2="470" y2="182" stroke="#C4683A" stroke-width="1.5"/>
  <polygon points="470,182 462,178 462,186" fill="#C4683A"/>
  <rect x="470" y="166" width="170" height="34" fill="#FFFFFF" stroke="#C4683A" stroke-width="1.2"/>
  <text x="478" y="181" font-size="10.5" fill="#374151">Match to actual bills.</text>
  <text x="478" y="194" font-size="10.5" fill="#374151">This is the utility ratio.</text>

  <!-- repairs note -->
  <line x1="390" y1="282" x2="470" y2="282" stroke="#C4683A" stroke-width="1.5"/>
  <polygon points="470,282 462,278 462,286" fill="#C4683A"/>
  <rect x="470" y="266" width="170" height="34" fill="#FFFFFF" stroke="#C4683A" stroke-width="1.2"/>
  <text x="478" y="281" font-size="10.5" fill="#374151">Too low or missing means</text>
  <text x="478" y="294" font-size="10.5" fill="#374151">deferred upkeep you inherit.</text>

  <!-- revenue note -->
  <line x1="390" y1="128" x2="470" y2="128" stroke="#1E2A8E" stroke-width="1.5"/>
  <polygon points="470,128 462,124 462,132" fill="#1E2A8E"/>
  <rect x="470" y="112" width="170" height="34" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="1.2"/>
  <text x="478" y="127" font-size="10.5" fill="#374151">Verify against water bill</text>
  <text x="478" y="140" font-size="10.5" fill="#374151">and tax returns first.</text>

  <text x="40" y="446" font-size="11" fill="#374151">Net income shown before any loan payment. Subtract debt service to reach the cash you keep.</text>
</svg>
