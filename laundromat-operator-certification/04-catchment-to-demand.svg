<svg viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="420" fill="#FFFFFF"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Catchment to Demand Estimate</text>
  <text x="330" y="54" text-anchor="middle" font-size="13" fill="#374151">A one-mile radius, filtered down to the washers it can support</text>

  <!-- LEFT: catchment radius map -->
  <circle cx="180" cy="240" r="115" fill="#EAF1FB" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="180" cy="240" r="6" fill="#C4683A"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">site</text>
  <line x1="180" y1="240" x2="295" y2="240" stroke="#1E2A8E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="238" y="234" text-anchor="middle" font-size="11" fill="#1E2A8E">1 mile</text>

  <!-- household dots: renters (gold) vs owners (muted) -->
  <g fill="#D4AF37">
    <circle cx="140" cy="195" r="5"/><circle cx="165" cy="210" r="5"/><circle cx="200" cy="190" r="5"/>
    <circle cx="220" cy="220" r="5"/><circle cx="150" cy="245" r="5"/><circle cx="195" cy="250" r="5"/>
    <circle cx="225" cy="265" r="5"/><circle cx="135" cy="275" r="5"/><circle cx="170" cy="285" r="5"/>
    <circle cx="205" cy="295" r="5"/><circle cx="120" cy="225" r="5"/><circle cx="240" cy="240" r="5"/>
  </g>
  <g fill="#9CA3AF">
    <circle cx="110" cy="255" r="5"/><circle cx="180" cy="160" r="5"/><circle cx="245" cy="200" r="5"/>
    <circle cx="150" cy="300" r="5"/><circle cx="215" cy="180" r="5"/><circle cx="100" cy="200" r="5"/>
  </g>
  <rect x="95" y="362" width="11" height="11" fill="#D4AF37"/>
  <text x="112" y="372" font-size="11" fill="#374151">renter household</text>
  <rect x="220" y="362" width="11" height="11" fill="#9CA3AF"/>
  <text x="237" y="372" font-size="11" fill="#374151">owner household</text>

  <!-- arrow -->
  <line x1="310" y1="240" x2="370" y2="240" stroke="#374151" stroke-width="2.5"/>
  <polygon points="370,233 384,240 370,247" fill="#374151"/>

  <!-- RIGHT: funnel of numbers -->
  <rect x="400" y="120" width="230" height="56" rx="8" fill="#1E2A8E"/>
  <text x="515" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">8,000 households</text>
  <text x="515" y="162" text-anchor="middle" font-size="11" fill="#FFFFFF">inside the catchment</text>

  <line x1="515" y1="176" x2="515" y2="196" stroke="#374151" stroke-width="2"/>
  <polygon points="508,196 515,208 522,196" fill="#374151"/>

  <rect x="420" y="210" width="190" height="56" rx="8" fill="#3E9B6B"/>
  <text x="515" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4,800 renters</text>
  <text x="515" y="252" text-anchor="middle" font-size="11" fill="#FFFFFF">60% rent</text>

  <line x1="515" y1="266" x2="515" y2="286" stroke="#374151" stroke-width="2"/>
  <polygon points="508,286 515,298 522,286" fill="#374151"/>

  <rect x="440" y="300" width="150" height="56" rx="8" fill="#D4AF37"/>
  <text x="515" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">~24 washers</text>
  <text x="515" y="342" text-anchor="middle" font-size="11" fill="#141B5C">at ~200 renters each</text>

  <text x="330" y="402" text-anchor="middle" font-size="11" fill="#374151">Renter households, not total population, set how many machines an area can feed. Subtract competitors next.</text>
</svg>
