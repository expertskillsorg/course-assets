<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Balanced Washer Mix for a 2,000 sq ft Store</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Family market. Bar height = number of machines. Larger sizes earn more per cycle.</text>

  <!-- axis -->
  <line x1="90" y1="330" x2="600" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="330" stroke="#374151" stroke-width="2"/>

  <!-- gridlines + y labels (0,2,4,6,8,10) -->
  <g font-size="11" fill="#374151">
    <line x1="90" y1="330" x2="600" y2="330" stroke="#E5E7EB" stroke-width="1"/>
    <text x="80" y="334" text-anchor="end">0</text>
    <line x1="90" y1="286" x2="600" y2="286" stroke="#E5E7EB" stroke-width="1"/>
    <text x="80" y="290" text-anchor="end">2</text>
    <line x1="90" y1="242" x2="600" y2="242" stroke="#E5E7EB" stroke-width="1"/>
    <text x="80" y="246" text-anchor="end">4</text>
    <line x1="90" y1="198" x2="600" y2="198" stroke="#E5E7EB" stroke-width="1"/>
    <text x="80" y="202" text-anchor="end">6</text>
    <line x1="90" y1="154" x2="600" y2="154" stroke="#E5E7EB" stroke-width="1"/>
    <text x="80" y="158" text-anchor="end">8</text>
    <line x1="90" y1="110" x2="600" y2="110" stroke="#E5E7EB" stroke-width="1"/>
    <text x="80" y="114" text-anchor="end">10</text>
  </g>
  <text x="34" y="220" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 34 220)">Number of machines</text>

  <!-- bars: scale 22px per machine. base y=330 -->
  <!-- Small: 6 -> 132 -->
  <rect x="130" y="198" width="80" height="132" fill="#1E2A8E"/>
  <text x="170" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">6</text>
  <!-- Medium: 10 -> 220 -->
  <rect x="245" y="110" width="80" height="220" fill="#3E9B6B"/>
  <text x="285" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">10</text>
  <!-- Large: 8 -> 176 -->
  <rect x="360" y="154" width="80" height="176" fill="#D4AF37"/>
  <text x="400" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">8</text>
  <!-- Oversized: 4 -> 88 -->
  <rect x="475" y="242" width="80" height="88" fill="#C4683A"/>
  <text x="515" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">4</text>

  <!-- x labels -->
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="170" y="352">Small</text>
    <text x="170" y="368" font-size="10" fill="#374151">18-20 lb</text>
    <text x="285" y="352">Medium</text>
    <text x="285" y="368" font-size="10" fill="#374151">25-30 lb</text>
    <text x="400" y="352">Large</text>
    <text x="400" y="368" font-size="10" fill="#374151">40 lb</text>
    <text x="515" y="352">Oversized</text>
    <text x="515" y="368" font-size="10" fill="#374151">60-80 lb</text>
  </g>

  <!-- earnings arrow -->
  <text x="345" y="402" text-anchor="middle" font-size="12" fill="#C4683A" font-weight="bold">Revenue per cycle rises from small to oversized</text>
  <line x1="130" y1="392" x2="555" y2="392" stroke="#C4683A" stroke-width="2"/>
  <polygon points="555,392 545,387 545,397" fill="#C4683A"/>
</svg>
