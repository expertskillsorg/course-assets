<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Same 20 Washers, Different Turns</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Daily washer revenue at a $4.00 vend price</text>

  <!-- axis -->
  <line x1="90" y1="320" x2="600" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="320" stroke="#E5E7EB" stroke-width="1"/>

  <!-- gridlines + y labels -->
  <line x1="90" y1="262" x2="600" y2="262" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="90" y1="204" x2="600" y2="204" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="90" y1="146" x2="600" y2="146" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="324" text-anchor="end" font-size="12" fill="#374151">$0</text>
  <text x="80" y="266" text-anchor="end" font-size="12" fill="#374151">$160</text>
  <text x="80" y="208" text-anchor="end" font-size="12" fill="#374151">$320</text>
  <text x="80" y="150" text-anchor="end" font-size="12" fill="#374151">$480</text>

  <!-- Bar 1: 1 turn = $80 -->
  <rect x="140" y="291" width="90" height="29" fill="#C4683A"/>
  <text x="185" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">$80</text>
  <text x="185" y="342" text-anchor="middle" font-size="13" fill="#111827">1 turn/day</text>
  <text x="185" y="360" text-anchor="middle" font-size="11" fill="#374151">underused</text>

  <!-- Bar 2: 4 turns = $320 -->
  <rect x="300" y="204" width="90" height="116" fill="#1E2A8E"/>
  <text x="345" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">$320</text>
  <text x="345" y="342" text-anchor="middle" font-size="13" fill="#111827">4 turns/day</text>
  <text x="345" y="360" text-anchor="middle" font-size="11" fill="#374151">healthy</text>

  <!-- Bar 3: 6 turns = $480 -->
  <rect x="460" y="146" width="90" height="174" fill="#3E9B6B"/>
  <text x="505" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">$480</text>
  <text x="505" y="342" text-anchor="middle" font-size="13" fill="#111827">6 turns/day</text>
  <text x="505" y="360" text-anchor="middle" font-size="11" fill="#374151">humming</text>

  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#374151">Revenue per machine = turns per day x vend price. Idle machines earn nothing.</text>
</svg>
