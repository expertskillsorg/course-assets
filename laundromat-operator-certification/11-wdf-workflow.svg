<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Wash-Dry-Fold Workflow</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#374151">From a tagged drop-off to a clean pickup, every order treated the same way</text>

  <!-- Stage 1 -->
  <rect x="24" y="96" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <circle cx="89" cy="128" r="18" fill="#1E2A8E"/>
  <text x="89" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="89" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Drop-off</text>
  <text x="89" y="190" text-anchor="middle" font-size="11" fill="#374151">Weigh in front</text>
  <text x="89" y="206" text-anchor="middle" font-size="11" fill="#374151">of customer</text>
  <text x="89" y="222" text-anchor="middle" font-size="11" fill="#374151">Tag with name,</text>
  <text x="89" y="238" text-anchor="middle" font-size="11" fill="#374151">log, set pickup</text>

  <!-- Stage 2 -->
  <rect x="178" y="96" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="243" cy="128" r="18" fill="#3E9B6B"/>
  <text x="243" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="243" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Wash</text>
  <text x="243" y="190" text-anchor="middle" font-size="11" fill="#374151">Sort by color</text>
  <text x="243" y="206" text-anchor="middle" font-size="11" fill="#374151">and fabric</text>
  <text x="243" y="222" text-anchor="middle" font-size="11" fill="#374151">Treat stains</text>
  <text x="243" y="238" text-anchor="middle" font-size="11" fill="#374151">before the load</text>

  <!-- Stage 3 -->
  <rect x="332" y="96" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="397" cy="128" r="18" fill="#3E9B6B"/>
  <text x="397" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="397" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Dry &amp; fold</text>
  <text x="397" y="190" text-anchor="middle" font-size="11" fill="#374151">Dry fully</text>
  <text x="397" y="206" text-anchor="middle" font-size="11" fill="#374151">Fold to one</text>
  <text x="397" y="222" text-anchor="middle" font-size="11" fill="#374151">standard, then</text>
  <text x="397" y="238" text-anchor="middle" font-size="11" fill="#374151">bag the order</text>

  <!-- Stage 4 -->
  <rect x="486" y="96" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="551" cy="128" r="18" fill="#D4AF37"/>
  <text x="551" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">4</text>
  <text x="551" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Ready</text>
  <text x="551" y="190" text-anchor="middle" font-size="11" fill="#374151">Text or call</text>
  <text x="551" y="206" text-anchor="middle" font-size="11" fill="#374151">when finished</text>
  <text x="551" y="222" text-anchor="middle" font-size="11" fill="#374151">Store orders</text>
  <text x="551" y="238" text-anchor="middle" font-size="11" fill="#374151">organized</text>

  <!-- Stage 5 -->
  <rect x="630" y="96" width="106" height="150" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <circle cx="683" cy="128" r="18" fill="#C4683A"/>
  <text x="683" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="683" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Pickup</text>
  <text x="683" y="190" text-anchor="middle" font-size="11" fill="#374151">Match to</text>
  <text x="683" y="206" text-anchor="middle" font-size="11" fill="#374151">the tag</text>
  <text x="683" y="222" text-anchor="middle" font-size="11" fill="#374151">Take payment</text>
  <text x="683" y="238" text-anchor="middle" font-size="11" fill="#374151">at collection</text>

  <!-- arrows -->
  <g fill="#374151">
    <polygon points="158,171 174,165 174,177"/>
    <polygon points="312,171 328,165 328,177"/>
    <polygon points="466,171 482,165 482,177"/>
    <polygon points="620,171 626,168 626,174"/>
  </g>
  <line x1="154" y1="171" x2="172" y2="171" stroke="#374151" stroke-width="2"/>
  <line x1="308" y1="171" x2="326" y2="171" stroke="#374151" stroke-width="2"/>
  <line x1="462" y1="171" x2="480" y2="171" stroke="#374151" stroke-width="2"/>
  <line x1="616" y1="171" x2="628" y2="171" stroke="#374151" stroke-width="2"/>

  <text x="380" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">The whole service rests on two promises: consistent folding and a turnaround you always hit.</text>
  <text x="380" y="324" text-anchor="middle" font-size="12" fill="#374151">One lost or late order can cost a regular for good, so protect quality at every stage.</text>
</svg>
