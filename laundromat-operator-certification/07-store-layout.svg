<svg viewBox="0 0 660 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="460" fill="#ffffff"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">An Efficient Laundromat Floor Layout</text>

  <!-- store outer wall -->
  <rect x="60" y="55" width="540" height="340" fill="#ffffff" stroke="#374151" stroke-width="3"/>

  <!-- street side windows (top) -->
  <line x1="180" y1="55" x2="300" y2="55" stroke="#D4AF37" stroke-width="6"/>
  <line x1="360" y1="55" x2="480" y2="55" stroke="#D4AF37" stroke-width="6"/>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#374151">Storefront windows (street, open sightlines)</text>

  <!-- entrance -->
  <rect x="300" y="385" width="60" height="14" fill="#3E9B6B"/>
  <text x="330" y="418" text-anchor="middle" font-size="12" fill="#111827" font-weight="bold">Entrance</text>

  <!-- Washers along left wall -->
  <g>
    <rect x="78" y="80" width="46" height="290" fill="#1E2A8E" rx="4"/>
    <text x="101" y="228" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold" transform="rotate(-90 101 228)">WASHERS</text>
  </g>

  <!-- Dryers along right wall -->
  <g>
    <rect x="536" y="80" width="46" height="290" fill="#C4683A" rx="4"/>
    <text x="559" y="228" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold" transform="rotate(-90 559 228)">DRYERS</text>
  </g>

  <!-- Center: folding tables + seating -->
  <rect x="270" y="90" width="120" height="70" fill="#3E9B6B" rx="6"/>
  <text x="330" y="122" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Folding</text>
  <text x="330" y="138" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">tables</text>

  <rect x="270" y="210" width="120" height="60" fill="#D4AF37" rx="6"/>
  <text x="330" y="238" text-anchor="middle" font-size="12" fill="#141B5C" font-weight="bold">Seating</text>
  <text x="330" y="254" text-anchor="middle" font-size="10" fill="#141B5C">(view of machines)</text>

  <!-- Vending near entrance -->
  <rect x="270" y="300" width="55" height="60" fill="#141B5C" rx="4"/>
  <text x="297" y="326" text-anchor="middle" font-size="9" fill="#ffffff">Snack</text>
  <text x="297" y="340" text-anchor="middle" font-size="9" fill="#ffffff">vending</text>

  <rect x="335" y="300" width="55" height="60" fill="#141B5C" rx="4"/>
  <text x="362" y="326" text-anchor="middle" font-size="9" fill="#ffffff">Soap</text>
  <text x="362" y="340" text-anchor="middle" font-size="9" fill="#ffffff">vending</text>

  <!-- wide aisles indicated by arrows -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="138" y1="180" x2="262" y2="180"/>
    <polygon points="138,180 148,175 148,185" fill="#374151" stroke="none"/>
    <polygon points="262,180 252,175 252,185" fill="#374151" stroke="none"/>
    <line x1="398" y1="180" x2="522" y2="180"/>
    <polygon points="398,180 408,175 408,185" fill="#374151" stroke="none"/>
    <polygon points="522,180 512,175 512,185" fill="#374151" stroke="none"/>
  </g>
  <text x="200" y="172" text-anchor="middle" font-size="10" fill="#374151">wide aisle</text>
  <text x="460" y="172" text-anchor="middle" font-size="10" fill="#374151">wide aisle</text>

  <!-- flow callout -->
  <text x="330" y="446" text-anchor="middle" font-size="12" fill="#1E2A8E" font-weight="bold">Customer path: Wash (left) &#8594; Dry (right) &#8594; Fold &amp; seat (center) &#8594; exit</text>
</svg>
