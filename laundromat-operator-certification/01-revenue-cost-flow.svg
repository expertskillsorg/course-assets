<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How Money Flows Through a Laundromat</text>

  <!-- Central store box -->
  <rect x="285" y="150" width="150" height="120" rx="10" fill="#1E2A8E"/>
  <text x="360" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">THE STORE</text>
  <text x="360" y="224" text-anchor="middle" font-size="12" fill="#FFFFFF">washers and</text>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#FFFFFF">dryers running</text>

  <!-- LEFT: Revenue in -->
  <text x="135" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E9B6B">REVENUE IN</text>

  <rect x="30" y="108" width="210" height="44" rx="6" fill="#3E9B6B"/>
  <text x="135" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Core vend</text>
  <text x="135" y="146" text-anchor="middle" font-size="11" fill="#FFFFFF">self-service wash and dry</text>

  <rect x="30" y="162" width="210" height="44" rx="6" fill="#3E9B6B"/>
  <text x="135" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Add-ons</text>
  <text x="135" y="200" text-anchor="middle" font-size="11" fill="#FFFFFF">wash-dry-fold, vending, ATM</text>

  <!-- Arrows revenue -> store -->
  <line x1="240" y1="130" x2="282" y2="180" stroke="#3E9B6B" stroke-width="3"/>
  <polygon points="282,180 270,176 274,168" fill="#3E9B6B"/>
  <line x1="240" y1="184" x2="282" y2="200" stroke="#3E9B6B" stroke-width="3"/>
  <polygon points="282,200 270,198 271,189" fill="#3E9B6B"/>

  <!-- RIGHT: Costs out -->
  <text x="585" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">COSTS OUT</text>

  <rect x="480" y="108" width="210" height="44" rx="6" fill="#C4683A"/>
  <text x="585" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Fixed costs</text>
  <text x="585" y="146" text-anchor="middle" font-size="11" fill="#FFFFFF">rent, loan, insurance</text>

  <rect x="480" y="162" width="210" height="44" rx="6" fill="#C4683A"/>
  <text x="585" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Variable costs</text>
  <text x="585" y="200" text-anchor="middle" font-size="11" fill="#FFFFFF">water, sewer, gas, power</text>

  <!-- Arrows store -> costs -->
  <line x1="438" y1="180" x2="478" y2="130" stroke="#C4683A" stroke-width="3"/>
  <polygon points="478,130 466,138 463,130" fill="#C4683A"/>
  <line x1="438" y1="200" x2="478" y2="184" stroke="#C4683A" stroke-width="3"/>
  <polygon points="478,184 466,189 466,180" fill="#C4683A"/>

  <!-- DOWN: Profit -->
  <line x1="360" y1="270" x2="360" y2="312" stroke="#D4AF37" stroke-width="4"/>
  <polygon points="360,318 352,304 368,304" fill="#D4AF37"/>

  <rect x="270" y="320" width="180" height="56" rx="8" fill="#D4AF37"/>
  <text x="360" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">PROFIT</text>
  <text x="360" y="365" text-anchor="middle" font-size="11" fill="#141B5C">what is left in the bucket</text>

  <!-- Footnote -->
  <text x="360" y="404" text-anchor="middle" font-size="11" fill="#374151">Utilities alone usually take 20 to 25 percent of revenue on a healthy store.</text>
</svg>
