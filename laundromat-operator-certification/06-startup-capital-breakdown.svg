<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Full Startup Capital Stack</text>
  <text x="340" y="54" text-anchor="middle" font-size="13" fill="#374151">A $250,000 purchase price grows to the real cash you need</text>

  <!-- Left: the price everyone sees -->
  <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">What buyers plan for</text>
  <rect x="90" y="250" width="120" height="120" rx="6" fill="#1E2A8E"/>
  <text x="150" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Purchase</text>
  <text x="150" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">price</text>
  <text x="150" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">$250,000</text>

  <!-- arrow -->
  <line x1="225" y1="300" x2="285" y2="300" stroke="#374151" stroke-width="2.5"/>
  <polygon points="285,292 300,300 285,308" fill="#374151"/>

  <!-- Right: the full stack -->
  <text x="460" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">What the deal really needs</text>

  <!-- working capital / reserves (top) -->
  <rect x="370" y="108" width="180" height="46" rx="6" fill="#C4683A"/>
  <text x="460" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Working capital + reserves</text>
  <text x="460" y="147" text-anchor="middle" font-size="11" fill="#FFFFFF">~$20,000 (slow-month buffer)</text>

  <!-- get-ready -->
  <rect x="370" y="158" width="180" height="40" rx="6" fill="#D4AF37"/>
  <text x="460" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Get-ready: repairs, sign,</text>
  <text x="460" y="193" text-anchor="middle" font-size="11" fill="#141B5C">deposits ~$10,000</text>

  <!-- cash to close -->
  <rect x="370" y="202" width="180" height="40" rx="6" fill="#3E9B6B"/>
  <text x="460" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Cash to close: down pmt</text>
  <text x="460" y="237" text-anchor="middle" font-size="11" fill="#FFFFFF">+ fees (your cash)</text>

  <!-- purchase (financed) -->
  <rect x="370" y="246" width="180" height="124" rx="6" fill="#1E2A8E"/>
  <text x="460" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Purchase price</text>
  <text x="460" y="322" text-anchor="middle" font-size="11" fill="#FFFFFF">(mostly financed)</text>

  <!-- total bracket -->
  <line x1="566" y1="108" x2="566" y2="370" stroke="#141B5C" stroke-width="2"/>
  <line x1="560" y1="108" x2="566" y2="108" stroke="#141B5C" stroke-width="2"/>
  <line x1="560" y1="370" x2="566" y2="370" stroke="#141B5C" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Real</text>
  <text x="600" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">need:</text>
  <text x="600" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">~$320k</text>
  <text x="600" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">to $340k</text>

  <text x="340" y="412" text-anchor="middle" font-size="10" fill="#374151">All figures are planning estimates; down-payment and reserve amounts vary by lender and deal. Confirm with a lender.</text>
</svg>
