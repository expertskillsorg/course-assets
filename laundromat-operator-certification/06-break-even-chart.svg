<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#FFFFFF"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Finding the Break-Even Point</text>
  <text x="340" y="52" text-anchor="middle" font-size="13" fill="#374151">Where the revenue line crosses total costs, the store starts to profit</text>

  <!-- plot frame -->
  <line x1="90" y1="80" x2="90" y2="350" stroke="#374151" stroke-width="2"/>
  <line x1="90" y1="350" x2="600" y2="350" stroke="#374151" stroke-width="2"/>

  <!-- axis labels -->
  <text x="46" y="220" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 46 220)">Dollars per month</text>
  <text x="345" y="392" text-anchor="middle" font-size="12" fill="#374151">Monthly revenue (store activity) &#8594;</text>

  <!-- y ticks -->
  <text x="82" y="354" text-anchor="end" font-size="10" fill="#374151">$0</text>
  <text x="82" y="278" text-anchor="end" font-size="10" fill="#374151">$6k</text>
  <text x="82" y="202" text-anchor="end" font-size="10" fill="#374151">$12k</text>
  <text x="82" y="126" text-anchor="end" font-size="10" fill="#374151">$18k</text>

  <!-- loss zone shading (left of crossing x=345) -->
  <rect x="90" y="80" width="255" height="270" fill="#C4683A" opacity="0.07"/>
  <!-- profit zone shading (right of crossing) -->
  <rect x="345" y="80" width="255" height="270" fill="#3E9B6B" opacity="0.09"/>

  <!-- fixed cost line (flat at $9k -> y = 350 - 9000/18000*270 = 350-135=215) -->
  <line x1="90" y1="215" x2="600" y2="215" stroke="#1E2A8E" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="596" y="208" text-anchor="end" font-size="11" font-weight="bold" fill="#1E2A8E">Fixed costs $9k</text>

  <!-- total cost line: starts at fixed $9k (y=215 at x=90), variable 25% of revenue.
       At revenue $18k (x=600): total = 9k + 0.25*18k = 13.5k -> y = 350 - 13500/18000*270 = 350-202.5=147.5 -->
  <line x1="90" y1="215" x2="600" y2="147" stroke="#C4683A" stroke-width="3"/>
  <text x="596" y="140" text-anchor="end" font-size="11" font-weight="bold" fill="#C4683A">Total costs</text>

  <!-- revenue line: y = x (revenue = revenue). At revenue 0 (x=90) y=350; at revenue 18k (x=600) y=80 -->
  <line x1="90" y1="350" x2="600" y2="80" stroke="#3E9B6B" stroke-width="3"/>
  <text x="560" y="92" text-anchor="end" font-size="11" font-weight="bold" fill="#3E9B6B">Revenue</text>

  <!-- break-even crossing: total = revenue. R = 9k/0.75 = 12k.
       x for revenue 12k: 90 + 12000/18000*510 = 90 + 340 = 430. y for 12k: 350 - 12000/18000*270 = 350-180 = 170 -->
  <circle cx="430" cy="170" r="6" fill="#141B5C"/>
  <line x1="430" y1="170" x2="430" y2="350" stroke="#141B5C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">$12k break-even</text>

  <!-- zone labels -->
  <text x="210" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Loss zone</text>
  <text x="210" y="338" text-anchor="middle" font-size="10" fill="#374151">costs above revenue</text>
  <text x="515" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Profit zone</text>
  <text x="515" y="218" text-anchor="middle" font-size="10" fill="#374151">revenue above costs</text>

  <text x="340" y="414" text-anchor="middle" font-size="10" fill="#374151">Illustrative figures: $9k fixed costs, variable cost 25% of revenue. Use your own verified numbers.</text>
</svg>
