<svg viewBox="0 0 700 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="470" fill="#FFFFFF"/>
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">When to Raise Your Vend Prices</text>
  <text x="350" y="56" text-anchor="middle" font-size="13" fill="#374151">Run the checks on a schedule; any one signal can point to a small raise</text>

  <!-- Start -->
  <rect x="270" y="78" width="160" height="40" rx="20" fill="#1E2A8E"/>
  <text x="350" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Scheduled price review</text>

  <!-- arrow down -->
  <line x1="350" y1="118" x2="350" y2="138" stroke="#374151" stroke-width="2"/>
  <polygon points="350,142 344,130 356,130" fill="#374151"/>

  <!-- Decision 1 -->
  <polygon points="350,148 470,188 350,228 230,188" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="350" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Have costs risen?</text>
  <text x="350" y="202" text-anchor="middle" font-size="11" fill="#374151">Utilities or rent up</text>

  <!-- Decision 2 -->
  <polygon points="350,242 470,282 350,322 230,282" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="350" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Full at peak?</text>
  <text x="350" y="296" text-anchor="middle" font-size="11" fill="#374151">People waiting for machines</text>

  <!-- Decision 3 -->
  <polygon points="350,336 470,376 350,416 230,376" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="350" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Prices over 2 yrs old?</text>
  <text x="350" y="390" text-anchor="middle" font-size="11" fill="#374151">Behind costs and rivals</text>

  <!-- connectors between diamonds (NO branch) -->
  <line x1="350" y1="228" x2="350" y2="242" stroke="#374151" stroke-width="2"/>
  <text x="362" y="240" font-size="11" fill="#374151">No</text>
  <line x1="350" y1="322" x2="350" y2="336" stroke="#374151" stroke-width="2"/>
  <text x="362" y="334" font-size="11" fill="#374151">No</text>

  <!-- YES branches go right to action box -->
  <rect x="500" y="150" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <rect x="500" y="150" width="180" height="30" rx="10" fill="#D4AF37"/>
  <rect x="500" y="166" width="180" height="14" fill="#D4AF37"/>
  <text x="590" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Raise, in small steps</text>
  <text x="514" y="200" font-size="11" fill="#374151">Check local prices first</text>
  <text x="514" y="220" font-size="11" fill="#374151">Size it small (a quarter)</text>
  <text x="514" y="240" font-size="11" fill="#374151">Start with busiest machines</text>
  <text x="514" y="260" font-size="11" fill="#374151">Give notice and a reason</text>

  <!-- yes arrows -->
  <line x1="470" y1="188" x2="500" y2="188" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="500,188 488,182 488,194" fill="#3E9B6B"/>
  <text x="476" y="180" font-size="11" fill="#3E9B6B">Yes</text>
  <line x1="470" y1="282" x2="490" y2="282" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="490" y1="282" x2="490" y2="230" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="490" y1="230" x2="500" y2="230" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="500,230 488,224 488,236" fill="#3E9B6B"/>
  <text x="476" y="274" font-size="11" fill="#3E9B6B">Yes</text>
  <line x1="470" y1="376" x2="495" y2="376" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="495" y1="376" x2="495" y2="255" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="495" y1="255" x2="500" y2="255" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="500,255 488,249 488,261" fill="#3E9B6B"/>
  <text x="476" y="368" font-size="11" fill="#3E9B6B">Yes</text>

  <!-- No-all path -->
  <line x1="230" y1="376" x2="60" y2="376" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="376" x2="60" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="20" y="240" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="105" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Hold this round</text>
  <text x="105" y="286" text-anchor="middle" font-size="11" fill="#374151">Review again next period</text>
  <line x1="60" y1="300" x2="60" y2="270" stroke="#374151" stroke-width="2"/>
  <polygon points="60,270 54,282 66,282" fill="#374151"/>
  <text x="150" y="368" font-size="11" fill="#374151">No to all</text>

  <text x="350" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E2A8E">After any raise, watch turns and revenue for a month; if volume holds, that price is your new floor.</text>
</svg>
