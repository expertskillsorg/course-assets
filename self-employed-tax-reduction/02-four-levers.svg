<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="The four levers of tax reduction surrounding your business profit: deductions, structure, retirement, and timing">
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#141B5C">The Four Levers of Tax Reduction</text>

  <!-- center profit -->
  <circle cx="320" cy="200" r="62" fill="#1E2A8E"/>
  <text x="320" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Your</text>
  <text x="320" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Profit</text>

  <!-- connectors -->
  <line x1="320" y1="138" x2="320" y2="92" stroke="#374151" stroke-width="2"/>
  <line x1="382" y1="200" x2="476" y2="200" stroke="#374151" stroke-width="2"/>
  <line x1="320" y1="262" x2="320" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="258" y1="200" x2="164" y2="200" stroke="#374151" stroke-width="2"/>

  <!-- Lever 1: Deductions (top) -->
  <rect x="200" y="44" width="240" height="48" rx="8" fill="#3E9B6B"/>
  <text x="320" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1. Deductions</text>
  <text x="320" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">shrink taxable income</text>

  <!-- Lever 2: Structure (right) -->
  <rect x="476" y="176" width="156" height="48" rx="8" fill="#D4AF37"/>
  <text x="554" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#141B5C">2. Structure</text>
  <text x="554" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#141B5C">changes SE tax owed</text>

  <!-- Lever 3: Retirement (bottom) -->
  <rect x="200" y="300" width="240" height="48" rx="8" fill="#C4683A"/>
  <text x="320" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3. Retirement</text>
  <text x="320" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">shelters income now</text>

  <!-- Lever 4: Timing (left) -->
  <rect x="8" y="176" width="156" height="48" rx="8" fill="#1E2A8E"/>
  <text x="86" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4. Timing</text>
  <text x="86" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">shifts income between years</text>
</svg>
