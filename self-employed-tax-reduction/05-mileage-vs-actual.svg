<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#FFFFFF"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Mileage vs. Actual: Which Method Wins?</text>

  <!-- Mileage column -->
  <rect x="30" y="60" width="310" height="60" rx="10" fill="#1E2A8E"/>
  <text x="185" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Standard Mileage</text>
  <text x="185" y="110" text-anchor="middle" font-size="13" fill="#FFFFFF">Business miles &#215; flat IRS rate *</text>

  <!-- Actual column -->
  <rect x="380" y="60" width="310" height="60" rx="10" fill="#C4683A"/>
  <text x="535" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Actual Expense</text>
  <text x="535" y="110" text-anchor="middle" font-size="13" fill="#FFFFFF">Real car costs &#215; business-use %</text>

  <!-- Tends to win row -->
  <text x="40" y="158" font-size="13" font-weight="bold" fill="#374151">TENDS TO WIN FOR</text>
  <rect x="30" y="168" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="185" y="196" text-anchor="middle" font-size="14" fill="#111827">Cheap, fuel-efficient cars</text>
  <text x="185" y="220" text-anchor="middle" font-size="14" fill="#111827">driven lots of business miles</text>
  <rect x="380" y="168" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="535" y="196" text-anchor="middle" font-size="14" fill="#111827">Expensive or thirsty vehicles</text>
  <text x="535" y="220" text-anchor="middle" font-size="14" fill="#111827">with high running costs</text>

  <!-- Effort row -->
  <text x="40" y="268" font-size="13" font-weight="bold" fill="#374151">RECORD-KEEPING</text>
  <rect x="30" y="278" width="310" height="46" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="185" y="306" text-anchor="middle" font-size="14" fill="#374151">Mileage log only</text>
  <rect x="380" y="278" width="310" height="46" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="535" y="306" text-anchor="middle" font-size="14" fill="#374151">Log + every car receipt</text>

  <!-- Year-one note -->
  <rect x="30" y="342" width="660" height="34" rx="8" fill="#D4AF37"/>
  <text x="360" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Year one: pick mileage to keep the option to switch later.</text>

  <text x="360" y="392" text-anchor="middle" font-size="11" fill="#374151">* Per-mile rate changes most years. Check this year's IRS rate.</text>
</svg>
