<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">SEP-IRA vs. Solo 401(k)</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#374151">Two ways a solo business owner shelters profit from tax</text>

  <!-- SEP-IRA card -->
  <rect x="30" y="80" width="310" height="340" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="30" y="80" width="310" height="46" rx="10" fill="#1E2A8E"/>
  <rect x="30" y="110" width="310" height="16" fill="#1E2A8E"/>
  <text x="185" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">SEP-IRA</text>

  <text x="50" y="156" font-size="13" font-weight="bold" fill="#141B5C">Who contributes</text>
  <text x="50" y="176" font-size="12.5" fill="#374151">Employer side only (your business)</text>

  <text x="50" y="208" font-size="13" font-weight="bold" fill="#141B5C">Contribution limit</text>
  <text x="50" y="228" font-size="12.5" fill="#374151">Up to ~25% of net profit,</text>
  <text x="50" y="245" font-size="12.5" fill="#374151">capped at the current annual limit</text>

  <text x="50" y="277" font-size="13" font-weight="bold" fill="#141B5C">Paperwork</text>
  <text x="50" y="297" font-size="12.5" fill="#3E9B6B">Very light. Open and fund.</text>

  <text x="50" y="329" font-size="13" font-weight="bold" fill="#141B5C">Best for</text>
  <text x="50" y="349" font-size="12.5" fill="#374151">Higher earners who want</text>
  <text x="50" y="366" font-size="12.5" fill="#374151">simplicity, no employees</text>
  <text x="50" y="397" font-size="12" fill="#C4683A">Check the current year's limit</text>

  <!-- Solo 401k card -->
  <rect x="380" y="80" width="310" height="340" rx="10" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="380" y="80" width="310" height="46" rx="10" fill="#3E9B6B"/>
  <rect x="380" y="110" width="310" height="16" fill="#3E9B6B"/>
  <text x="535" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Solo 401(k)</text>

  <text x="400" y="156" font-size="13" font-weight="bold" fill="#141B5C">Who contributes</text>
  <text x="400" y="176" font-size="12.5" fill="#374151">You as employee + employer side</text>

  <text x="400" y="208" font-size="13" font-weight="bold" fill="#141B5C">Contribution limit</text>
  <text x="400" y="228" font-size="12.5" fill="#374151">Employee amount + ~25% profit,</text>
  <text x="400" y="245" font-size="12.5" fill="#374151">often more at moderate income</text>

  <text x="400" y="277" font-size="13" font-weight="bold" fill="#141B5C">Paperwork</text>
  <text x="400" y="297" font-size="12.5" fill="#C4683A">More setup; filing once it grows</text>

  <text x="400" y="329" font-size="13" font-weight="bold" fill="#141B5C">Best for</text>
  <text x="400" y="349" font-size="12.5" fill="#374151">Moderate earners who want to</text>
  <text x="400" y="366" font-size="12.5" fill="#374151">save the most; allows catch-up</text>
  <text x="400" y="397" font-size="12" fill="#C4683A">Check the current year's limit</text>

  <text x="360" y="440" text-anchor="middle" font-size="11.5" fill="#374151">Education only. Confirm the right account and amount with a tax professional.</text>
</svg>
