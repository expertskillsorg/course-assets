<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="420" fill="#FFFFFF"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">S-Corp Breakeven: Savings vs. Running Costs</text>
  <text x="330" y="54" text-anchor="middle" font-size="13" fill="#374151">Illustrative rule of thumb, not a guarantee</text>

  <!-- axes -->
  <line x1="80" y1="350" x2="610" y2="350" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="90" x2="80" y2="350" stroke="#374151" stroke-width="2"/>
  <text x="335" y="392" text-anchor="middle" font-size="13" fill="#374151">Yearly profit</text>
  <text x="40" y="220" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 40 220)">Dollars per year</text>

  <!-- x labels -->
  <text x="80" y="370" text-anchor="middle" font-size="11" fill="#374151">$30k</text>
  <text x="220" y="370" text-anchor="middle" font-size="11" fill="#374151">$50k</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#374151">$80k</text>
  <text x="500" y="370" text-anchor="middle" font-size="11" fill="#374151">$120k</text>
  <text x="600" y="370" text-anchor="middle" font-size="11" fill="#374151">$160k</text>

  <!-- fixed cost line (flat ~$2,500) -->
  <line x1="80" y1="318" x2="610" y2="318" stroke="#C4683A" stroke-width="3"/>
  <text x="500" y="338" font-size="12" font-weight="bold" fill="#C4683A">Running costs (roughly flat)</text>

  <!-- savings line (rising) -->
  <polyline points="80,350 220,300 360,225 500,140 610,100" fill="none" stroke="#3E9B6B" stroke-width="3"/>
  <text x="430" y="150" font-size="12" font-weight="bold" fill="#3E9B6B">SE-tax savings (rise with profit)</text>

  <!-- breakeven marker -->
  <circle cx="300" cy="261" r="6" fill="#D4AF37" stroke="#141B5C" stroke-width="2"/>
  <line x1="300" y1="261" x2="300" y2="350" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Breakeven</text>
  <text x="300" y="234" text-anchor="middle" font-size="11" fill="#374151">often near $60k-$80k</text>

  <!-- zones -->
  <text x="180" y="110" text-anchor="middle" font-size="12" fill="#C4683A">Costs &gt; savings:</text>
  <text x="180" y="126" text-anchor="middle" font-size="12" fill="#C4683A">usually not worth it</text>
  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#3E9B6B">Savings &gt; costs:</text>
  <text x="500" y="316" text-anchor="middle" font-size="12" fill="#3E9B6B">worth a closer look</text>
</svg>
