<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Two Ways to Claim the Home Office</text>

  <!-- Simplified card -->
  <rect x="30" y="64" width="310" height="278" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="30" y="64" width="310" height="44" rx="10" fill="#1E2A8E"/>
  <rect x="30" y="92" width="310" height="16" fill="#1E2A8E"/>
  <text x="185" y="93" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Simplified Method</text>

  <text x="50" y="142" font-size="15" fill="#374151">Office square feet</text>
  <text x="320" y="142" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">150 sq ft</text>
  <text x="185" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#D4AF37">&#215;</text>
  <text x="50" y="200" font-size="15" fill="#374151">Flat IRS rate / sq ft</text>
  <text x="320" y="200" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">$5 *</text>
  <line x1="50" y1="220" x2="320" y2="220" stroke="#E5E7EB" stroke-width="2"/>
  <text x="50" y="252" font-size="15" fill="#374151">Deduction</text>
  <text x="320" y="252" text-anchor="end" font-size="18" font-weight="bold" fill="#3E9B6B">$750</text>
  <rect x="50" y="276" width="270" height="50" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="185" y="298" text-anchor="middle" font-size="13" fill="#374151">No bills to keep. Capped total.</text>
  <text x="185" y="316" text-anchor="middle" font-size="13" fill="#374151">Fast, but often smaller.</text>

  <!-- Actual card -->
  <rect x="380" y="64" width="310" height="278" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <rect x="380" y="64" width="310" height="44" rx="10" fill="#C4683A"/>
  <rect x="380" y="92" width="310" height="16" fill="#C4683A"/>
  <text x="535" y="93" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Actual Method</text>

  <text x="400" y="142" font-size="15" fill="#374151">Business-use %</text>
  <text x="670" y="142" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">10%</text>
  <text x="535" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#D4AF37">&#215;</text>
  <text x="400" y="200" font-size="15" fill="#374151">Real home costs</text>
  <text x="670" y="200" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">$24,000</text>
  <line x1="400" y1="220" x2="670" y2="220" stroke="#E5E7EB" stroke-width="2"/>
  <text x="400" y="252" font-size="15" fill="#374151">Deduction</text>
  <text x="670" y="252" text-anchor="end" font-size="18" font-weight="bold" fill="#3E9B6B">$2,400</text>
  <rect x="400" y="276" width="270" height="50" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="535" y="298" text-anchor="middle" font-size="13" fill="#374151">Save the bills, do the percentages.</text>
  <text x="535" y="316" text-anchor="middle" font-size="13" fill="#374151">More work, often bigger.</text>

  <text x="360" y="368" text-anchor="middle" font-size="12" fill="#374151">* Rate and cap shown as an example. Check this year's IRS rate. Run both, take the larger.</text>
</svg>
