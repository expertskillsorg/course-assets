<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Two Models of Care</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Different tools for different needs, not better versus worse</text>

  <!-- Column headers -->
  <rect x="40" y="76" width="320" height="46" rx="6" fill="#3E9B6B"/>
  <text x="200" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Midwifery Model</text>
  <rect x="380" y="76" width="300" height="46" rx="6" fill="#1E2A8E"/>
  <text x="530" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Medical Model</text>

  <!-- Row labels down the left edge -->
  <g font-size="12" font-weight="bold" fill="#141B5C">
    <text x="40" y="150">Core view of birth</text>
    <text x="40" y="232">Time and relationship</text>
    <text x="40" y="314">Approach to intervention</text>
    <text x="40" y="396">Best fit</text>
  </g>

  <!-- Midwifery cells -->
  <g font-size="12" fill="#374151">
    <rect x="40" y="158" width="320" height="58" rx="5" fill="#EAF5EF" stroke="#3E9B6B"/>
    <text x="54" y="180">A normal, healthy event for</text>
    <text x="54" y="198">most people; watch and support</text>

    <rect x="40" y="240" width="320" height="58" rx="5" fill="#EAF5EF" stroke="#3E9B6B"/>
    <text x="54" y="262">Longer visits, continuity of care,</text>
    <text x="54" y="280">shared decision-making</text>

    <rect x="40" y="322" width="320" height="58" rx="5" fill="#EAF5EF" stroke="#3E9B6B"/>
    <text x="54" y="344">Used when needed; let birth</text>
    <text x="54" y="362">unfold when all is healthy</text>

    <rect x="40" y="404" width="320" height="40" rx="5" fill="#EAF5EF" stroke="#3E9B6B"/>
    <text x="54" y="429">Healthy, lower-risk pregnancies</text>
  </g>

  <!-- Medical cells -->
  <g font-size="12" fill="#374151">
    <rect x="380" y="158" width="300" height="58" rx="5" fill="#EAEBF6" stroke="#1E2A8E"/>
    <text x="394" y="180">A process to manage and screen</text>
    <text x="394" y="198">for risk at every step</text>

    <rect x="380" y="240" width="300" height="58" rx="5" fill="#EAEBF6" stroke="#1E2A8E"/>
    <text x="394" y="262">Shorter visits, larger caseloads,</text>
    <text x="394" y="280">provider-led decisions</text>

    <rect x="380" y="322" width="300" height="58" rx="5" fill="#EAEBF6" stroke="#1E2A8E"/>
    <text x="394" y="344">Ready intervention; tests, tools,</text>
    <text x="394" y="362">and surgery on hand</text>

    <rect x="380" y="404" width="300" height="40" rx="5" fill="#EAEBF6" stroke="#1E2A8E"/>
    <text x="394" y="429">Higher-risk or complex pregnancies</text>
  </g>
</svg>
