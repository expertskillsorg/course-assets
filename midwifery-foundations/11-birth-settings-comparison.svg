<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Three Birth Settings, Three Trade-offs</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">No single best choice. Each setting gains one strength by giving up another.</text>

  <!-- Column headers -->
  <g>
    <rect x="40" y="78" width="200" height="40" rx="6" fill="#3E9B6B"/>
    <text x="140" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Home</text>

    <rect x="260" y="78" width="200" height="40" rx="6" fill="#D4AF37"/>
    <text x="360" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Birth center</text>

    <rect x="480" y="78" width="200" height="40" rx="6" fill="#1E2A8E"/>
    <text x="580" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Hospital</text>
  </g>

  <!-- Row labels -->
  <text x="32" y="158" font-size="13" font-weight="bold" fill="#111827">Medical backup on site</text>
  <text x="32" y="248" font-size="13" font-weight="bold" fill="#111827">Privacy + low intervention</text>
  <text x="32" y="338" font-size="13" font-weight="bold" fill="#111827">Wide access + coverage</text>

  <!-- helper: bars use fill segments to show level (1-3) -->
  <!-- Medical backup: home low, center mid, hospital high -->
  <g>
    <rect x="40" y="166" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="40" y="166" width="66" height="22" rx="4" fill="#3E9B6B"/>
    <text x="140" y="182" text-anchor="middle" font-size="11" fill="#111827">Transfer plan</text>

    <rect x="260" y="166" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="260" y="166" width="133" height="22" rx="4" fill="#D4AF37"/>
    <text x="360" y="182" text-anchor="middle" font-size="11" fill="#111827">Equipped + agreement</text>

    <rect x="480" y="166" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="480" y="166" width="200" height="22" rx="4" fill="#1E2A8E"/>
    <text x="580" y="182" text-anchor="middle" font-size="11" fill="#ffffff">Surgery + NICU</text>
  </g>

  <!-- Privacy/low intervention: home high, center mid, hospital low -->
  <g>
    <rect x="40" y="256" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="40" y="256" width="200" height="22" rx="4" fill="#3E9B6B"/>
    <text x="140" y="272" text-anchor="middle" font-size="11" fill="#ffffff">Most private</text>

    <rect x="260" y="256" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="260" y="256" width="133" height="22" rx="4" fill="#D4AF37"/>
    <text x="360" y="272" text-anchor="middle" font-size="11" fill="#111827">Homelike</text>

    <rect x="480" y="256" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="480" y="256" width="66" height="22" rx="4" fill="#1E2A8E"/>
    <text x="580" y="272" text-anchor="middle" font-size="11" fill="#111827">More monitoring</text>
  </g>

  <!-- Access/coverage: home low, center mid, hospital high -->
  <g>
    <rect x="40" y="346" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="40" y="346" width="66" height="22" rx="4" fill="#3E9B6B"/>
    <text x="140" y="362" text-anchor="middle" font-size="11" fill="#111827">Varies by state</text>

    <rect x="260" y="346" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="260" y="346" width="133" height="22" rx="4" fill="#D4AF37"/>
    <text x="360" y="362" text-anchor="middle" font-size="11" fill="#111827">Fewer, region-based</text>

    <rect x="480" y="346" width="200" height="22" rx="4" fill="#E5E7EB"/>
    <rect x="480" y="346" width="200" height="22" rx="4" fill="#1E2A8E"/>
    <text x="580" y="362" text-anchor="middle" font-size="11" fill="#ffffff">Nearly everywhere</text>
  </g>

  <!-- footer note -->
  <rect x="40" y="398" width="640" height="44" rx="6" fill="#F3F4F6"/>
  <text x="360" y="418" text-anchor="middle" font-size="12" fill="#374151">Out-of-hospital safety depends on a low-risk pregnancy, a trained attendant,</text>
  <text x="360" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">and a fast, prearranged transfer plan to a hospital.</text>
</svg>
