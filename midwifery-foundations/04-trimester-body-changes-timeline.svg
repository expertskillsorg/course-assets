<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How the Pregnant Body Changes Across the Trimesters</text>

  <!-- timeline baseline -->
  <line x1="70" y1="92" x2="660" y2="92" stroke="#374151" stroke-width="2.5"/>
  <text x="70" y="78" font-size="11" fill="#374151">Week 1</text>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#374151">Week 20</text>
  <text x="660" y="78" text-anchor="end" font-size="11" fill="#374151">Week 40 (term)</text>

  <!-- trimester ticks/zones -->
  <line x1="70" y1="86" x2="70" y2="98" stroke="#374151" stroke-width="2"/>
  <line x1="266" y1="86" x2="266" y2="98" stroke="#374151" stroke-width="2"/>
  <line x1="462" y1="86" x2="462" y2="98" stroke="#374151" stroke-width="2"/>
  <line x1="660" y1="86" x2="660" y2="98" stroke="#374151" stroke-width="2"/>

  <text x="168" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">First trimester</text>
  <text x="364" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">Second trimester</text>
  <text x="561" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">Third trimester</text>

  <!-- Blood volume rising curve -->
  <text x="70" y="150" font-size="12" font-weight="bold" fill="#C4683A">Blood volume rises 40 to 50%</text>
  <path d="M70 196 C 220 192, 380 162, 660 142" stroke="#C4683A" stroke-width="4" fill="none"/>
  <circle cx="660" cy="142" r="5" fill="#C4683A"/>
  <text x="118" y="190" font-size="10" fill="#374151">heart works harder, beats faster</text>

  <!-- Uterus growth: three pear/belly shapes -->
  <text x="70" y="236" font-size="12" font-weight="bold" fill="#3E9B6B">Uterus grows: pear sized to full term</text>
  <path d="M165 268 q-9 -2 -9 10 q0 14 9 14 q9 0 9 -14 q0 -12 -9 -10 z" fill="#3E9B6B"/>
  <ellipse cx="362" cy="278" rx="16" ry="20" fill="#3E9B6B"/>
  <ellipse cx="560" cy="276" rx="24" ry="30" fill="#3E9B6B"/>
  <text x="165" y="312" text-anchor="middle" font-size="10" fill="#374151">small pear</text>
  <text x="362" y="312" text-anchor="middle" font-size="10" fill="#374151">rounded belly</text>
  <text x="560" y="318" text-anchor="middle" font-size="10" fill="#374151">full term</text>

  <!-- felt / visible changes by trimester -->
  <line x1="40" y1="338" x2="680" y2="338" stroke="#E5E7EB" stroke-width="1.5"/>

  <rect x="60" y="352" width="190" height="70" rx="8" fill="#FBF5E6" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="74" y="372" font-size="11" font-weight="bold" fill="#141B5C">Felt early</text>
  <text x="74" y="390" font-size="10.5" fill="#374151">Tender breasts, nausea,</text>
  <text x="74" y="405" font-size="10.5" fill="#374151">fatigue, frequent urination</text>

  <rect x="265" y="352" width="190" height="70" rx="8" fill="#FBF5E6" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="279" y="372" font-size="11" font-weight="bold" fill="#141B5C">Felt mid</text>
  <text x="279" y="390" font-size="10.5" fill="#374151">Belly shows, often feels</text>
  <text x="279" y="405" font-size="10.5" fill="#374151">best, heartburn begins</text>

  <rect x="470" y="352" width="190" height="70" rx="8" fill="#FBF5E6" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="484" y="372" font-size="11" font-weight="bold" fill="#141B5C">Felt late</text>
  <text x="484" y="390" font-size="10.5" fill="#374151">Back strain, swelling,</text>
  <text x="484" y="405" font-size="10.5" fill="#374151">breathlessness, broken sleep</text>
</svg>
