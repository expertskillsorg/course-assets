<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Arial, sans-serif">
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Stages of Labor</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#374151">The cervix thins and opens across the long first stage, then the baby and placenta are born</text>

  <!-- First stage band -->
  <rect x="30" y="80" width="500" height="300" rx="10" fill="#F4F6FB" stroke="#E5E7EB"/>
  <text x="280" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">First Stage: opening the cervix</text>

  <!-- Cervix circles: thick/closed -> effaced/dilated -->
  <!-- Early -->
  <circle cx="120" cy="200" r="46" fill="none" stroke="#C4683A" stroke-width="18"/>
  <circle cx="120" cy="200" r="6" fill="#141B5C"/>
  <text x="120" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Early phase</text>
  <text x="120" y="287" text-anchor="middle" font-size="11" fill="#374151">thick, 0 to 6 cm</text>

  <!-- Active -->
  <circle cx="280" cy="200" r="46" fill="none" stroke="#D4AF37" stroke-width="11"/>
  <circle cx="280" cy="200" r="24" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Active phase</text>
  <text x="280" y="287" text-anchor="middle" font-size="11" fill="#374151">thinner, 6 to 8 cm</text>

  <!-- Transition / full -->
  <circle cx="440" cy="200" r="46" fill="none" stroke="#3E9B6B" stroke-width="5"/>
  <circle cx="440" cy="200" r="39" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <text x="440" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Transition</text>
  <text x="440" y="287" text-anchor="middle" font-size="11" fill="#374151">100% effaced, 10 cm</text>

  <!-- Arrows between cervix stages -->
  <path d="M174 200 H224" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M334 200 H384" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#374151">Effacement = thinning (the ring gets narrower)</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#374151">Dilation = opening (the center gets wider)</text>

  <!-- Second stage -->
  <rect x="552" y="80" width="278" height="142" rx="10" fill="#FBF4EC" stroke="#E5E7EB"/>
  <text x="691" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">Second Stage</text>
  <text x="691" y="126" text-anchor="middle" font-size="12" fill="#374151">Pushing and the</text>
  <text x="691" y="143" text-anchor="middle" font-size="12" fill="#374151">birth of the baby</text>
  <!-- simple baby head icon -->
  <circle cx="691" cy="184" r="22" fill="#C4683A"/>
  <circle cx="691" cy="184" r="22" fill="none" stroke="#141B5C" stroke-width="2"/>

  <!-- Third stage -->
  <rect x="552" y="238" width="278" height="142" rx="10" fill="#EEF6F1" stroke="#E5E7EB"/>
  <text x="691" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E9B6B">Third Stage</text>
  <text x="691" y="284" text-anchor="middle" font-size="12" fill="#374151">Delivery of the</text>
  <text x="691" y="301" text-anchor="middle" font-size="12" fill="#374151">placenta (afterbirth)</text>
  <!-- placenta icon -->
  <ellipse cx="691" cy="342" rx="30" ry="18" fill="#3E9B6B"/>
  <path d="M691 342 q26 -6 44 6" stroke="#141B5C" stroke-width="2" fill="none"/>

  <!-- flow arrow first->second -->
  <path d="M490 130 H548" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#ar2)"/>
  <path d="M691 222 V236" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#ar2)"/>

  <text x="430" y="410" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">Timings vary widely from one labor to the next; these phases describe what happens, not a schedule.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#374151"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1E2A8E"/></marker>
  </defs>
</svg>
