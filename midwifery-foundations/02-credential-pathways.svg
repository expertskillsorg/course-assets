<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How Each Midwifery Credential Is Earned</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#374151">Three separate pathways, three separate certifying bodies, three different scopes</text>

  <!-- Column headers -->
  <rect x="40" y="80" width="210" height="40" rx="6" fill="#1E2A8E"/>
  <text x="145" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">CNM</text>
  <rect x="275" y="80" width="210" height="40" rx="6" fill="#3E9B6B"/>
  <text x="380" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">CM</text>
  <rect x="510" y="80" width="210" height="40" rx="6" fill="#C4683A"/>
  <text x="615" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">CPM</text>

  <!-- CNM steps -->
  <g>
    <rect x="40" y="135" width="210" height="46" rx="6" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="1"/>
    <text x="145" y="156" text-anchor="middle" font-size="12" fill="#111827">Bachelor's degree</text>
    <text x="145" y="172" text-anchor="middle" font-size="12" fill="#111827">plus become an RN</text>
    <rect x="40" y="195" width="210" height="46" rx="6" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="1"/>
    <text x="145" y="216" text-anchor="middle" font-size="12" fill="#111827">Graduate (master's)</text>
    <text x="145" y="232" text-anchor="middle" font-size="12" fill="#111827">nurse-midwifery program</text>
    <rect x="40" y="255" width="210" height="46" rx="6" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="1"/>
    <text x="145" y="276" text-anchor="middle" font-size="12" fill="#111827">Pass the AMCB</text>
    <text x="145" y="292" text-anchor="middle" font-size="12" fill="#111827">national board exam</text>
    <rect x="40" y="315" width="210" height="46" rx="6" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="1"/>
    <text x="145" y="336" text-anchor="middle" font-size="12" fill="#111827">State license</text>
    <text x="145" y="352" text-anchor="middle" font-size="11" fill="#374151">(all 50 states)</text>
  </g>

  <!-- CM steps -->
  <g>
    <rect x="275" y="135" width="210" height="46" rx="6" fill="#EBF5EF" stroke="#3E9B6B" stroke-width="1"/>
    <text x="380" y="156" text-anchor="middle" font-size="12" fill="#111827">Bachelor's degree</text>
    <text x="380" y="172" text-anchor="middle" font-size="11" fill="#374151">(nursing not required)</text>
    <rect x="275" y="195" width="210" height="46" rx="6" fill="#EBF5EF" stroke="#3E9B6B" stroke-width="1"/>
    <text x="380" y="216" text-anchor="middle" font-size="12" fill="#111827">Graduate midwifery</text>
    <text x="380" y="232" text-anchor="middle" font-size="12" fill="#111827">program (ACME)</text>
    <rect x="275" y="255" width="210" height="46" rx="6" fill="#EBF5EF" stroke="#3E9B6B" stroke-width="1"/>
    <text x="380" y="276" text-anchor="middle" font-size="12" fill="#111827">Pass the same AMCB</text>
    <text x="380" y="292" text-anchor="middle" font-size="12" fill="#111827">board exam as a CNM</text>
    <rect x="275" y="315" width="210" height="46" rx="6" fill="#EBF5EF" stroke="#3E9B6B" stroke-width="1"/>
    <text x="380" y="336" text-anchor="middle" font-size="12" fill="#111827">Recognized in a</text>
    <text x="380" y="352" text-anchor="middle" font-size="11" fill="#374151">limited set of states</text>
  </g>

  <!-- CPM steps -->
  <g>
    <rect x="510" y="135" width="210" height="46" rx="6" fill="#F7ECE5" stroke="#C4683A" stroke-width="1"/>
    <text x="615" y="156" text-anchor="middle" font-size="12" fill="#111827">Direct-entry training</text>
    <text x="615" y="172" text-anchor="middle" font-size="11" fill="#374151">(no nursing degree)</text>
    <rect x="510" y="195" width="210" height="46" rx="6" fill="#F7ECE5" stroke="#C4683A" stroke-width="1"/>
    <text x="615" y="216" text-anchor="middle" font-size="12" fill="#111827">Supervised births</text>
    <text x="615" y="232" text-anchor="middle" font-size="12" fill="#111827">and clinical hours</text>
    <rect x="510" y="255" width="210" height="46" rx="6" fill="#F7ECE5" stroke="#C4683A" stroke-width="1"/>
    <text x="615" y="276" text-anchor="middle" font-size="12" fill="#111827">Pass the NARM exam</text>
    <text x="615" y="292" text-anchor="middle" font-size="12" fill="#111827">to earn the CPM</text>
    <rect x="510" y="315" width="210" height="46" rx="6" fill="#F7ECE5" stroke="#C4683A" stroke-width="1"/>
    <text x="615" y="336" text-anchor="middle" font-size="12" fill="#111827">Legal in many but</text>
    <text x="615" y="352" text-anchor="middle" font-size="11" fill="#374151">not all states</text>
  </g>

  <!-- connectors -->
  <g stroke="#9CA3AF" stroke-width="2">
    <line x1="145" y1="181" x2="145" y2="195"/>
    <line x1="145" y1="241" x2="145" y2="255"/>
    <line x1="145" y1="301" x2="145" y2="315"/>
    <line x1="380" y1="181" x2="380" y2="195"/>
    <line x1="380" y1="241" x2="380" y2="255"/>
    <line x1="380" y1="301" x2="380" y2="315"/>
    <line x1="615" y1="181" x2="615" y2="195"/>
    <line x1="615" y1="241" x2="615" y2="255"/>
    <line x1="615" y1="301" x2="615" y2="315"/>
  </g>

  <!-- scope footer -->
  <rect x="40" y="385" width="680" height="100" rx="8" fill="#FAFAF7" stroke="#E5E7EB" stroke-width="1"/>
  <text x="58" y="410" font-size="13" font-weight="bold" fill="#141B5C">Typical scope and setting</text>
  <text x="58" y="434" font-size="12" fill="#1E2A8E" font-weight="bold">CNM:</text>
  <text x="110" y="434" font-size="12" fill="#374151">full prenatal-to-postpartum care, can prescribe, mostly hospitals and birth centers.</text>
  <text x="58" y="456" font-size="12" fill="#3E9B6B" font-weight="bold">CM:</text>
  <text x="110" y="456" font-size="12" fill="#374151">same clinical scope as a CNM, but only where the state recognizes the credential.</text>
  <text x="58" y="478" font-size="12" fill="#C4683A" font-weight="bold">CPM:</text>
  <text x="110" y="478" font-size="12" fill="#374151">out-of-hospital birth (homes and birth centers); scope set by state law.</text>
</svg>
