<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="36" y="40" font-size="22" font-weight="bold" fill="#141B5C">Average RPM Range by Niche</text>
  <text x="36" y="62" font-size="13" fill="#374151">Estimated revenue per 1,000 monetized long-form views (US audience)</text>

  <!-- axis baseline -->
  <line x1="220" y1="92" x2="220" y2="372" stroke="#E5E7EB" stroke-width="1"/>
  <!-- gridlines -->
  <line x1="320" y1="92" x2="320" y2="372" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="420" y1="92" x2="420" y2="372" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="520" y1="92" x2="520" y2="372" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="620" y1="92" x2="620" y2="372" stroke="#E5E7EB" stroke-width="1"/>
  <text x="220" y="390" font-size="11" fill="#374151" text-anchor="middle">$0</text>
  <text x="320" y="390" font-size="11" fill="#374151" text-anchor="middle">$5</text>
  <text x="420" y="390" font-size="11" fill="#374151" text-anchor="middle">$10</text>
  <text x="520" y="390" font-size="11" fill="#374151" text-anchor="middle">$15</text>
  <text x="620" y="390" font-size="11" fill="#374151" text-anchor="middle">$20</text>

  <!-- scale: $0 at x=220, $20 at x=620 -> 20px per $1 -->

  <!-- Finance/Legal: $8 to $20 -> 380 to 620 -->
  <text x="206" y="120" font-size="13" fill="#111827" text-anchor="end">Finance / Legal</text>
  <rect x="380" y="106" width="240" height="22" rx="3" fill="#1E2A8E"/>
  <text x="630" y="121" font-size="11" fill="#374151">$8 - $20</text>

  <!-- Tech/Software: $5 to $12 -> 320 to 460 -->
  <text x="206" y="162" font-size="13" fill="#111827" text-anchor="end">Tech / Software</text>
  <rect x="320" y="148" width="140" height="22" rx="3" fill="#141B5C"/>
  <text x="470" y="163" font-size="11" fill="#374151">$5 - $12</text>

  <!-- Education: $4 to $9 -> 300 to 400 -->
  <text x="206" y="204" font-size="13" fill="#111827" text-anchor="end">Education</text>
  <rect x="300" y="190" width="100" height="22" rx="3" fill="#3E9B6B"/>
  <text x="410" y="205" font-size="11" fill="#374151">$4 - $9</text>

  <!-- Lifestyle: $2 to $6 -> 260 to 340 -->
  <text x="206" y="246" font-size="13" fill="#111827" text-anchor="end">Lifestyle</text>
  <rect x="260" y="232" width="80" height="22" rx="3" fill="#D4AF37"/>
  <text x="350" y="247" font-size="11" fill="#374151">$2 - $6</text>

  <!-- Gaming/Entertainment: $1 to $4 -> 240 to 300 -->
  <text x="206" y="288" font-size="13" fill="#111827" text-anchor="end">Gaming / Entertainment</text>
  <rect x="240" y="274" width="60" height="22" rx="3" fill="#C4683A"/>
  <text x="310" y="289" font-size="11" fill="#374151">$1 - $4</text>

  <text x="36" y="345" font-size="12" fill="#374151">Ranges are rough estimates and vary by season, audience country,</text>
  <text x="36" y="363" font-size="12" fill="#374151">and how many viewers see ads. Treat them as planning guides, not promises.</text>
</svg>
