<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#141B5C">YouTube Studio Analytics</text>
  <text x="30" y="56" font-size="13" fill="#374151">Where the 5 key metrics live</text>

  <!-- Tab bar -->
  <rect x="30" y="74" width="700" height="44" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
  <rect x="30" y="74" width="150" height="44" rx="6" fill="#1E2A8E"/>
  <text x="105" y="101" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Overview</text>
  <text x="262" y="101" font-size="13" fill="#374151" text-anchor="middle">Content / Reach</text>
  <text x="430" y="101" font-size="13" fill="#374151" text-anchor="middle">Engagement</text>
  <text x="600" y="101" font-size="13" fill="#374151" text-anchor="middle">Audience</text>
  <line x1="200" y1="80" x2="200" y2="112" stroke="#E5E7EB"/>
  <line x1="345" y1="80" x2="345" y2="112" stroke="#E5E7EB"/>
  <line x1="520" y1="80" x2="520" y2="112" stroke="#E5E7EB"/>

  <!-- Overview card -->
  <rect x="30" y="150" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="46" y="176" font-size="13" font-weight="bold" fill="#1E2A8E">OVERVIEW</text>
  <text x="46" y="204" font-size="12" fill="#374151">Views</text>
  <text x="46" y="232" font-size="12" fill="#374151">Watch time (hours)</text>
  <rect x="44" y="246" width="182" height="40" rx="5" fill="#EDEFF8"/>
  <text x="56" y="263" font-size="11" font-weight="bold" fill="#141B5C">5. Subscriber gain</text>
  <text x="56" y="279" font-size="10" fill="#374151">subscribers per video</text>

  <!-- Content/Reach card -->
  <rect x="275" y="150" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <text x="291" y="176" font-size="13" font-weight="bold" fill="#C4683A">CONTENT / REACH</text>
  <rect x="289" y="190" width="182" height="44" rx="5" fill="#FBF4DF"/>
  <text x="301" y="208" font-size="11" font-weight="bold" fill="#141B5C">1. Impressions</text>
  <text x="301" y="225" font-size="10" fill="#374151">how far it was shown</text>
  <rect x="289" y="244" width="182" height="44" rx="5" fill="#FBF4DF"/>
  <text x="301" y="262" font-size="11" font-weight="bold" fill="#141B5C">2. Click-through rate</text>
  <text x="301" y="279" font-size="10" fill="#374151">packaging signal</text>

  <!-- Engagement card -->
  <rect x="520" y="150" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="536" y="176" font-size="13" font-weight="bold" fill="#3E9B6B">ENGAGEMENT</text>
  <rect x="534" y="190" width="182" height="44" rx="5" fill="#E7F3EC"/>
  <text x="546" y="208" font-size="11" font-weight="bold" fill="#141B5C">3. Watch time</text>
  <text x="546" y="225" font-size="10" fill="#374151">total hours, monetization</text>
  <rect x="534" y="244" width="182" height="44" rx="5" fill="#E7F3EC"/>
  <text x="546" y="262" font-size="11" font-weight="bold" fill="#141B5C">4. Avg view duration</text>
  <text x="546" y="279" font-size="10" fill="#374151">content quality signal</text>

  <!-- Reading order arrows -->
  <text x="30" y="350" font-size="13" font-weight="bold" fill="#141B5C">Read them in order:</text>
  <g font-size="12" fill="#374151">
    <rect x="30" y="365" width="120" height="34" rx="17" fill="#1E2A8E"/>
    <text x="90" y="387" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Shown?</text>
    <rect x="190" y="365" width="120" height="34" rx="17" fill="#D4AF37"/>
    <text x="250" y="387" fill="#141B5C" text-anchor="middle" font-weight="bold">Clicked?</text>
    <rect x="350" y="365" width="120" height="34" rx="17" fill="#3E9B6B"/>
    <text x="410" y="387" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Stayed?</text>
    <rect x="510" y="365" width="140" height="34" rx="17" fill="#C4683A"/>
    <text x="580" y="387" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Grew?</text>
  </g>
  <path d="M150 382 L188 382" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M310 382 L348 382" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M470 382 L508 382" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <text x="30" y="440" font-size="12" fill="#374151">Impressions and CTR answer "shown" and "clicked." Average view</text>
  <text x="30" y="458" font-size="12" fill="#374151">duration answers "stayed." Watch time and subscriber gain answer "grew."</text>
  <text x="30" y="486" font-size="11" fill="#374151" font-style="italic">The Revenue tab appears only after you join the YouTube Partner Program.</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
