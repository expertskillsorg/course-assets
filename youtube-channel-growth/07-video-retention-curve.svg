<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="Arial, sans-serif">
  <rect width="660" height="430" fill="#FFFFFF"/>
  <text x="32" y="38" font-size="20" font-weight="bold" fill="#141B5C">Where viewers leave a video</text>
  <text x="32" y="60" font-size="13" fill="#374151">The line shows the share of viewers still watching across the length of the video.</text>

  <!-- chart geometry: x 90 (0%) to 620 (100% of video length); y 90 (100% watching) to 300 (0% watching) -->
  <!-- y axis gridlines + labels -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="90" y1="90" x2="620" y2="90"/>
    <line x1="90" y1="160" x2="620" y2="160"/>
    <line x1="90" y1="230" x2="620" y2="230"/>
    <line x1="90" y1="300" x2="620" y2="300"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="end">
    <text x="82" y="94">100%</text>
    <text x="82" y="164">66%</text>
    <text x="82" y="234">33%</text>
    <text x="82" y="304">0%</text>
  </g>
  <text x="30" y="200" font-size="12" fill="#141B5C" font-weight="bold" transform="rotate(-90 30 200)" text-anchor="middle">Viewers still watching</text>

  <!-- x axis stage labels -->
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="150" y="320">First 30 sec</text>
    <text x="290" y="320">Intro</text>
    <text x="430" y="320">Body</text>
    <text x="585" y="320">Close</text>
  </g>
  <line x1="90" y1="300" x2="620" y2="300" stroke="#374151" stroke-width="1.5"/>

  <!-- retention curve: starts 100% at left, steep cold-open drop, intro dip, gentle body slope, small close dip -->
  <polyline points="90,90 130,110 150,150 220,165 290,205 360,215 430,228 520,242 585,250 620,275"
            fill="none" stroke="#1E2A8E" stroke-width="3"/>

  <!-- drop-off markers -->
  <circle cx="150" cy="150" r="6" fill="#C4683A"/>
  <circle cx="290" cy="205" r="6" fill="#C4683A"/>
  <circle cx="585" cy="250" r="6" fill="#3E9B6B"/>

  <!-- annotation: cold open -->
  <rect x="96" y="96" width="168" height="44" rx="5" fill="#FBE9E0" stroke="#C4683A" stroke-width="1"/>
  <text x="104" y="113" font-size="11" font-weight="bold" fill="#141B5C">Drop-off 1: cold open</text>
  <text x="104" y="130" font-size="10.5" fill="#374151">Weak first 5-10 sec loses viewers fast</text>

  <!-- annotation: intro -->
  <rect x="240" y="118" width="170" height="44" rx="5" fill="#FBE9E0" stroke="#C4683A" stroke-width="1"/>
  <text x="248" y="135" font-size="11" font-weight="bold" fill="#141B5C">Drop-off 2: long intro</text>
  <text x="248" y="152" font-size="10.5" fill="#374151">Slow setup before any payoff</text>

  <!-- annotation: body -->
  <rect x="372" y="246" width="150" height="30" rx="5" fill="#EEF1FB" stroke="#1E2A8E" stroke-width="1"/>
  <text x="380" y="265" font-size="10.5" fill="#374151">Body: gentle slope is healthy</text>

  <!-- annotation: close -->
  <rect x="476" y="278" width="160" height="30" rx="5" fill="#E7F2EC" stroke="#3E9B6B" stroke-width="1"/>
  <text x="484" y="297" font-size="10.5" fill="#374151">Close: deliver value, then ask</text>

  <!-- legend -->
  <line x1="32" y1="350" x2="628" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="40" cy="372" r="6" fill="#C4683A"/>
  <text x="52" y="377" font-size="12" fill="#374151">The two most common drop-off moments</text>
  <circle cx="330" cy="372" r="6" fill="#3E9B6B"/>
  <text x="342" y="377" font-size="12" fill="#374151">The healthy close</text>
  <text x="32" y="404" font-size="12" fill="#374151" font-style="italic">A strong video holds a high, slowly sloping line. Sharp early cliffs are the fixable failures.</text>
</svg>
