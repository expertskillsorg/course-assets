<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The Four Ways YouTube Surfaces Your Video</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#374151">Each pathway measures something different</text>

  <!-- Card 1: Search -->
  <rect x="40" y="92" width="320" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="40" y="92" width="320" height="40" rx="10" fill="#1E2A8E"/>
  <rect x="40" y="116" width="320" height="16" fill="#1E2A8E"/>
  <text x="60" y="118" font-size="16" font-weight="bold" fill="#FFFFFF">YouTube Search</text>
  <text x="60" y="160" font-size="13" fill="#111827">Viewer types a query into the search bar.</text>
  <text x="60" y="184" font-size="12" font-weight="bold" fill="#374151">Measures:</text>
  <text x="60" y="204" font-size="12" fill="#374151">keyword match + watch behavior</text>
  <text x="60" y="222" font-size="12" fill="#374151">from people who searched the same thing</text>

  <!-- Card 2: Browse -->
  <rect x="400" y="92" width="320" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="400" y="92" width="320" height="40" rx="10" fill="#1E2A8E"/>
  <rect x="400" y="116" width="320" height="16" fill="#1E2A8E"/>
  <text x="420" y="118" font-size="16" font-weight="bold" fill="#FFFFFF">Browse Feed (Homepage)</text>
  <text x="420" y="160" font-size="13" fill="#111827">Videos shown on the homepage and feed.</text>
  <text x="420" y="184" font-size="12" font-weight="bold" fill="#374151">Measures:</text>
  <text x="420" y="204" font-size="12" fill="#374151">predicted viewer fit</text>
  <text x="420" y="222" font-size="12" fill="#374151">(what YouTube thinks this person wants)</text>

  <!-- Card 3: Suggested -->
  <rect x="40" y="256" width="320" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="40" y="256" width="320" height="40" rx="10" fill="#D4AF37"/>
  <rect x="40" y="280" width="320" height="16" fill="#D4AF37"/>
  <text x="60" y="282" font-size="16" font-weight="bold" fill="#111827">Suggested Videos (Sidebar)</text>
  <text x="60" y="324" font-size="13" fill="#111827">Videos shown next to or after another.</text>
  <text x="60" y="348" font-size="12" font-weight="bold" fill="#374151">Measures:</text>
  <text x="60" y="368" font-size="12" fill="#374151">click-through rate + watch time</text>
  <text x="60" y="386" font-size="12" fill="#374151">on the video the viewer is already watching</text>

  <!-- Card 4: Shorts -->
  <rect x="400" y="256" width="320" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="400" y="256" width="320" height="40" rx="10" fill="#D4AF37"/>
  <rect x="400" y="280" width="320" height="16" fill="#D4AF37"/>
  <text x="420" y="282" font-size="16" font-weight="bold" fill="#111827">Shorts Feed</text>
  <text x="420" y="324" font-size="13" fill="#111827">A separate vertical, swipe-up feed.</text>
  <text x="420" y="348" font-size="12" font-weight="bold" fill="#374151">Measures:</text>
  <text x="420" y="368" font-size="12" fill="#374151">swipe-away rate + watch-through</text>
  <text x="420" y="386" font-size="12" fill="#374151">a completely separate engine from long-form</text>

  <text x="380" y="426" text-anchor="middle" font-size="11" fill="#374151">Navy = long-form discovery   |   Gold = its own distinct signals</text>
</svg>
