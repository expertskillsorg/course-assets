<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">One Playlist, Three Places It Works</text>

  <!-- Center playlist node -->
  <rect x="305" y="180" width="150" height="64" rx="10" fill="#1E2A8E"/>
  <text x="380" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Your Playlist</text>
  <text x="380" y="228" text-anchor="middle" font-size="11" fill="#D4AF37">"Budgeting Basics"</text>

  <!-- Connectors -->
  <path d="M305 200 C 220 180, 180 140, 150 118" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M380 180 L380 130" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M455 200 C 540 180, 580 140, 610 118" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- 1. Search -->
  <rect x="40" y="72" width="220" height="92" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="64" cy="96" r="11" fill="#3E9B6B"/>
  <text x="64" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="84" y="100" font-size="14" font-weight="bold" fill="#111827">YouTube Search</text>
  <rect x="56" y="116" width="188" height="18" rx="9" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="66" y="129" font-size="10" fill="#374151">budgeting basics for beginners</text>
  <text x="56" y="152" font-size="10.5" fill="#374151">Playlist ranks above single videos</text>

  <!-- 2. Channel home page -->
  <rect x="270" y="48" width="220" height="74" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="294" cy="72" r="11" fill="#3E9B6B"/>
  <text x="294" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="314" y="76" font-size="14" font-weight="bold" fill="#111827">Channel Home Page</text>
  <rect x="284" y="90" width="40" height="24" rx="3" fill="#D4AF37"/>
  <rect x="330" y="90" width="40" height="24" rx="3" fill="#C4683A"/>
  <rect x="376" y="90" width="40" height="24" rx="3" fill="#1E2A8E"/>
  <text x="424" y="106" font-size="10.5" fill="#374151">section row</text>

  <!-- 3. End screen -->
  <rect x="500" y="72" width="220" height="92" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="524" cy="96" r="11" fill="#3E9B6B"/>
  <text x="524" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="544" y="100" font-size="14" font-weight="bold" fill="#111827">End Screen</text>
  <rect x="516" y="116" width="78" height="40" rx="4" fill="#141B5C"/>
  <text x="555" y="140" text-anchor="middle" font-size="9" fill="#ffffff">watch next</text>
  <text x="604" y="134" font-size="10.5" fill="#374151">auto-plays</text>
  <text x="604" y="150" font-size="10.5" fill="#374151">the queue</text>

  <!-- Outcome bar -->
  <rect x="150" y="300" width="460" height="74" rx="10" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.5"/>
  <path d="M380 244 L380 300" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="374,294 386,294 380,302" fill="#374151"/>
  <text x="380" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Each entry point starts an auto-play queue</text>
  <text x="380" y="352" text-anchor="middle" font-size="12.5" fill="#374151">More videos per visit = more watch time + longer sessions</text>
</svg>
