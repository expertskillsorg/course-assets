<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Two gut communities side by side: a balanced gut with many different microbes and an imbalanced gut with few crowded-out types">
  <rect x="0" y="0" width="640" height="380" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">A Balanced Gut vs an Imbalanced Gut</text>

  <!-- Left: balanced -->
  <rect x="30" y="60" width="270" height="270" rx="14" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="3"/>
  <text x="165" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3E9B6B">Balanced (diverse)</text>

  <!-- many varied shapes -->
  <g>
    <circle cx="80" cy="130" r="13" fill="#3E9B6B"/>
    <circle cx="130" cy="160" r="10" fill="#1E2A8E"/>
    <rect x="170" y="120" width="22" height="22" rx="5" fill="#D4AF37"/>
    <circle cx="225" cy="150" r="14" fill="#C4683A"/>
    <rect x="90" y="190" width="20" height="20" rx="6" fill="#1E2A8E"/>
    <circle cx="150" cy="215" r="12" fill="#D4AF37"/>
    <circle cx="205" cy="200" r="10" fill="#3E9B6B"/>
    <rect x="240" y="195" width="18" height="18" rx="5" fill="#C4683A"/>
    <circle cx="75" cy="255" r="11" fill="#C4683A"/>
    <rect x="120" y="255" width="22" height="22" rx="6" fill="#3E9B6B"/>
    <circle cx="185" cy="270" r="13" fill="#1E2A8E"/>
    <circle cx="240" cy="260" r="10" fill="#D4AF37"/>
  </g>
  <text x="165" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Many types, no one takes over</text>

  <!-- Right: imbalanced -->
  <rect x="340" y="60" width="270" height="270" rx="14" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <text x="475" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#C4683A">Imbalanced (crowded)</text>

  <!-- mostly one shape crowding out the rest -->
  <g fill="#C4683A">
    <circle cx="390" cy="130" r="13"/><circle cx="430" cy="125" r="13"/><circle cx="470" cy="135" r="13"/>
    <circle cx="510" cy="125" r="13"/><circle cx="550" cy="135" r="13"/>
    <circle cx="400" cy="170" r="13"/><circle cx="440" cy="175" r="13"/><circle cx="480" cy="168" r="13"/>
    <circle cx="520" cy="175" r="13"/><circle cx="560" cy="168" r="13"/>
    <circle cx="395" cy="212" r="13"/><circle cx="435" cy="218" r="13"/><circle cx="515" cy="215" r="13"/>
    <circle cx="555" cy="210" r="13"/><circle cx="410" cy="258" r="13"/><circle cx="540" cy="255" r="13"/>
  </g>
  <!-- the few survivors of other types -->
  <rect x="468" y="206" width="18" height="18" rx="5" fill="#1E2A8E"/>
  <circle cx="475" cy="258" r="10" fill="#3E9B6B"/>
  <text x="475" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">One type crowds the rest out</text>

  <!-- arrow between -->
  <text x="320" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#374151">vs</text>
</svg>
