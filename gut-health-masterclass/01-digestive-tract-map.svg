<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="A simple map of the digestive tract showing where most gut microbes live">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">Where Your Gut Microbes Live</text>

  <!-- Mouth -->
  <ellipse cx="160" cy="78" rx="34" ry="20" fill="#D4AF37"/>
  <text x="160" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Mouth</text>

  <!-- Esophagus -->
  <rect x="150" y="98" width="20" height="62" rx="9" fill="#E5E7EB"/>

  <!-- Stomach -->
  <path d="M150 160 q-44 6 -42 56 q2 44 52 50 q44 4 44 -34 q0 -30 -22 -42 q-16 -8 -32 -30 z" fill="#C4683A"/>
  <text x="120" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stomach</text>

  <!-- Small intestine -->
  <path d="M170 250 q60 8 50 50 q-10 36 -56 30 q-44 -6 -30 38 q12 38 64 30" fill="none" stroke="#1E2A8E" stroke-width="22" stroke-linecap="round"/>
  <text x="244" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E2A8E">Small intestine</text>

  <!-- Large intestine / colon -->
  <path d="M214 398 h120 v-150 h44 v178" fill="none" stroke="#3E9B6B" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Large intestine (colon)</text>

  <!-- microbe dots clustered in colon -->
  <g fill="#D4AF37">
    <circle cx="378" cy="300" r="4"/><circle cx="386" cy="330" r="4"/><circle cx="372" cy="350" r="4"/>
    <circle cx="384" cy="370" r="4"/><circle cx="376" cy="260" r="4"/><circle cx="388" cy="288" r="4"/>
    <circle cx="370" cy="318" r="4"/>
  </g>

  <!-- Callout box -->
  <rect x="430" y="120" width="186" height="200" rx="10" fill="#141B5C"/>
  <text x="523" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">The hot spot</text>
  <text x="448" y="180" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Most of your gut</text>
  <text x="448" y="200" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">microbes live in the</text>
  <text x="448" y="220" font-family="Arial, sans-serif" font-size="13" fill="#D4AF37" font-weight="bold">large intestine.</text>
  <text x="448" y="252" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Food travels down,</text>
  <text x="448" y="272" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">and what reaches the</text>
  <text x="448" y="292" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">colon decides which</text>
  <text x="448" y="312" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">microbes thrive.</text>
</svg>
