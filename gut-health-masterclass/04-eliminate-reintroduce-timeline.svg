<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Eliminate, Then Reintroduce</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#374151">Calm the gut first, then test one food at a time with gaps between.</text>

  <!-- baseline timeline arrow -->
  <line x1="40" y1="150" x2="710" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="710,150 698,144 698,156" fill="#374151"/>

  <!-- Phase 1: Elimination -->
  <rect x="40" y="120" width="230" height="60" rx="8" fill="#1E2A8E"/>
  <text x="155" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Elimination</text>
  <text x="155" y="167" text-anchor="middle" font-size="12" fill="#ffffff">Remove 1 to 3 triggers, 2 to 4 weeks</text>
  <text x="155" y="200" text-anchor="middle" font-size="12" fill="#374151">Symptoms calm down</text>

  <!-- Reintroduction window header -->
  <rect x="290" y="120" width="420" height="60" rx="8" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <text x="500" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Reintroduction</text>
  <text x="500" y="167" text-anchor="middle" font-size="12" fill="#374151">One food at a time, with a clean gap between</text>

  <!-- Test food blocks below -->
  <!-- Food A -->
  <rect x="300" y="225" width="120" height="110" rx="8" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <rect x="300" y="225" width="120" height="26" rx="8" fill="#D4AF37"/>
  <rect x="300" y="240" width="120" height="11" fill="#D4AF37"/>
  <text x="360" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Food A</text>
  <text x="360" y="272" text-anchor="middle" font-size="11" fill="#111827">Day 1: small</text>
  <text x="360" y="290" text-anchor="middle" font-size="11" fill="#111827">Day 2: larger</text>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#374151">Watch 2 to 3</text>
  <text x="360" y="330" text-anchor="middle" font-size="11" fill="#374151">days, record it</text>

  <!-- Gap -->
  <text x="455" y="285" text-anchor="middle" font-size="22" fill="#374151">+</text>
  <text x="455" y="306" text-anchor="middle" font-size="10" fill="#374151">clean gap</text>

  <!-- Food B -->
  <rect x="490" y="225" width="120" height="110" rx="8" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <rect x="490" y="225" width="120" height="26" rx="8" fill="#C4683A"/>
  <rect x="490" y="240" width="120" height="11" fill="#C4683A"/>
  <text x="550" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Food B</text>
  <text x="550" y="272" text-anchor="middle" font-size="11" fill="#111827">Day 1: small</text>
  <text x="550" y="290" text-anchor="middle" font-size="11" fill="#111827">Day 2: larger</text>
  <text x="550" y="316" text-anchor="middle" font-size="11" fill="#374151">Watch 2 to 3</text>
  <text x="550" y="330" text-anchor="middle" font-size="11" fill="#374151">days, record it</text>

  <!-- next -->
  <text x="650" y="285" text-anchor="middle" font-size="14" fill="#374151">next</text>
  <text x="650" y="302" text-anchor="middle" font-size="14" fill="#374151">food...</text>

  <!-- connector lines -->
  <line x1="360" y1="180" x2="360" y2="225" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="550" y1="180" x2="550" y2="225" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
