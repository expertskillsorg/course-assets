<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Simple Weekly Maintenance Rhythm</text>

  <!-- Daily band label -->
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#374151">EVERY DAY</text>

  <!-- Seven day columns -->
  <g font-size="13" fill="#111827">
    <!-- column backgrounds -->
    <rect x="40"  y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>
    <rect x="134" y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>
    <rect x="228" y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>
    <rect x="322" y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>
    <rect x="416" y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>
    <rect x="510" y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>
    <rect x="604" y="100" width="86" height="150" rx="8" fill="#1E2A8E"/>

    <!-- day labels -->
    <g fill="#FFFFFF" font-weight="bold" text-anchor="middle">
      <text x="83"  y="122">Mon</text>
      <text x="177" y="122">Tue</text>
      <text x="271" y="122">Wed</text>
      <text x="365" y="122">Thu</text>
      <text x="459" y="122">Fri</text>
      <text x="553" y="122">Sat</text>
      <text x="647" y="122">Sun</text>
    </g>

    <!-- daily habit icons text per column -->
    <g fill="#FFFFFF" font-size="11" text-anchor="middle">
      <text x="83"  y="150">Fiber</text>
      <text x="83"  y="172">Fluids</text>
      <text x="83"  y="194">Move</text>
      <text x="83"  y="216">Calm meals</text>
      <text x="177" y="150">Fiber</text>
      <text x="177" y="172">Fluids</text>
      <text x="177" y="194">Move</text>
      <text x="177" y="216">Calm meals</text>
      <text x="271" y="150">Fiber</text>
      <text x="271" y="172">Fluids</text>
      <text x="271" y="194">Move</text>
      <text x="271" y="216">Calm meals</text>
      <text x="365" y="150">Fiber</text>
      <text x="365" y="172">Fluids</text>
      <text x="365" y="194">Move</text>
      <text x="365" y="216">Calm meals</text>
      <text x="459" y="150">Fiber</text>
      <text x="459" y="172">Fluids</text>
      <text x="459" y="194">Move</text>
      <text x="459" y="216">Calm meals</text>
      <text x="553" y="150">Fiber</text>
      <text x="553" y="172">Fluids</text>
      <text x="553" y="194">Move</text>
      <text x="553" y="216">Calm meals</text>
      <text x="647" y="150">Fiber</text>
      <text x="647" y="172">Fluids</text>
      <text x="647" y="194">Move</text>
      <text x="647" y="216">Calm meals</text>
    </g>
  </g>

  <!-- Weekly aims band -->
  <text x="40" y="300" font-size="13" font-weight="bold" fill="#374151">ACROSS THE WEEK</text>

  <rect x="40" y="312" width="320" height="64" rx="8" fill="#3E9B6B"/>
  <text x="200" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Plant variety</text>
  <text x="200" y="362" text-anchor="middle" font-size="12" fill="#FFFFFF">Aim for many different plants</text>

  <rect x="370" y="312" width="320" height="64" rx="8" fill="#D4AF37"/>
  <text x="530" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Fermented foods</text>
  <text x="530" y="362" text-anchor="middle" font-size="12" fill="#141B5C">A small serving most days</text>

  <text x="360" y="404" text-anchor="middle" font-size="12" fill="#374151">Consistency, not perfection. The same few habits, repeated most of the time.</text>
</svg>
