<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="The gut-brain axis shown as a two-way connection between the brain and the gut, linked by the vagus nerve, with signals traveling in both directions">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#141B5C">The Gut-Brain Axis: A Two-Way Street</text>

  <!-- Brain node -->
  <ellipse cx="320" cy="110" rx="78" ry="52" fill="#1E2A8E"/>
  <path d="M278 100 q8 -22 30 -22 q12 -14 28 -2 q22 -4 22 18 q14 6 4 24 q4 16 -16 18 q-10 14 -28 4 q-18 8 -28 -8 q-18 -2 -12 -22 q-8 -16 0 -32 Z" fill="#3C4BB8" opacity="0.55"/>
  <text x="320" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Brain</text>
  <text x="320" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E5E7EB">mood, stress, focus</text>

  <!-- Gut node -->
  <ellipse cx="320" cy="320" rx="78" ry="52" fill="#3E9B6B"/>
  <path d="M286 300 q-14 16 0 30 q-4 18 18 16 q12 12 26 0 q20 4 18 -16 q14 -12 0 -28 q4 -16 -16 -16 q-12 -10 -26 0 q-18 -2 -20 14 Z" fill="#2E7A52" opacity="0.6"/>
  <text x="320" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Gut</text>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">microbiome, digestion</text>

  <!-- Vagus nerve channel label -->
  <rect x="356" y="196" width="150" height="28" rx="14" fill="#D4AF37"/>
  <text x="431" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">vagus nerve</text>

  <!-- Downward arrow (brain to gut) -->
  <line x1="292" y1="160" x2="292" y2="266" stroke="#1E2A8E" stroke-width="6"/>
  <polygon points="292,272 284,256 300,256" fill="#1E2A8E"/>
  <text x="246" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">stress</text>
  <text x="246" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">slows</text>
  <text x="246" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">digestion</text>

  <!-- Upward arrow (gut to brain) -->
  <line x1="348" y1="266" x2="348" y2="160" stroke="#3E9B6B" stroke-width="6"/>
  <polygon points="348,154 340,170 356,170" fill="#3E9B6B"/>
  <text x="402" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">gut shapes</text>
  <text x="402" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">mood and</text>
  <text x="402" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">calm</text>

  <text x="320" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Signals travel both ways, all day long.</text>
</svg>
