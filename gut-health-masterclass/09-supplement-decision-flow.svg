<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Arial, sans-serif" role="img" aria-label="A worth-it-versus-skip decision flow for any gut supplement. Four yes-or-no questions are asked in order: is there real evidence for this use, does it list the studied dose and form, is it third-party tested, and do you actually need it given your diet. A no at any step routes to skip and save your money. Four yes answers route to it may earn a short trial.">
  <rect x="0" y="0" width="720" height="560" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Worth it, or skip it?</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Run any gut supplement through four questions, in order.</text>

  <!-- Q1 -->
  <rect x="150" y="78" width="300" height="56" rx="8" fill="#1E2A8E"/>
  <text x="300" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1. Real evidence for THIS use?</text>
  <text x="300" y="121" text-anchor="middle" font-size="11" fill="#E5E7EB">Studied for your goal, not just "gut health"</text>
  <line x1="300" y1="134" x2="300" y2="160" stroke="#374151" stroke-width="2"/>
  <polygon points="300,166 294,156 306,156" fill="#374151"/>

  <!-- Q2 -->
  <rect x="150" y="166" width="300" height="56" rx="8" fill="#1E2A8E"/>
  <text x="300" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2. Right dose and form listed?</text>
  <text x="300" y="209" text-anchor="middle" font-size="11" fill="#E5E7EB">Matches the studied amount; no hidden blend</text>
  <line x1="300" y1="222" x2="300" y2="248" stroke="#374151" stroke-width="2"/>
  <polygon points="300,254 294,244 306,244" fill="#374151"/>

  <!-- Q3 -->
  <rect x="150" y="254" width="300" height="56" rx="8" fill="#1E2A8E"/>
  <text x="300" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3. Third-party tested?</text>
  <text x="300" y="297" text-anchor="middle" font-size="11" fill="#E5E7EB">An outside lab checked the contents</text>
  <line x1="300" y1="310" x2="300" y2="336" stroke="#374151" stroke-width="2"/>
  <polygon points="300,342 294,332 306,332" fill="#374151"/>

  <!-- Q4 -->
  <rect x="150" y="342" width="300" height="56" rx="8" fill="#1E2A8E"/>
  <text x="300" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4. Do I actually need it?</text>
  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#E5E7EB">Food cannot already cover this gap</text>
  <line x1="300" y1="398" x2="300" y2="424" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="300,430 294,420 306,420" fill="#3E9B6B"/>

  <!-- Yes outcome -->
  <rect x="150" y="430" width="300" height="58" rx="8" fill="#3E9B6B"/>
  <text x="300" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Four yes answers</text>
  <text x="300" y="475" text-anchor="middle" font-size="12" fill="#FFFFFF">It may earn a short, honest trial.</text>

  <!-- No branch labels and arrows to the right -->
  <text x="470" y="100" font-size="11" font-weight="bold" fill="#C4683A">No</text>
  <text x="470" y="188" font-size="11" font-weight="bold" fill="#C4683A">No</text>
  <text x="470" y="276" font-size="11" font-weight="bold" fill="#C4683A">No</text>
  <text x="470" y="364" font-size="11" font-weight="bold" fill="#C4683A">No</text>

  <line x1="450" y1="106" x2="556" y2="106" stroke="#C4683A" stroke-width="2"/>
  <line x1="450" y1="194" x2="556" y2="194" stroke="#C4683A" stroke-width="2"/>
  <line x1="450" y1="282" x2="556" y2="282" stroke="#C4683A" stroke-width="2"/>
  <line x1="450" y1="370" x2="556" y2="370" stroke="#C4683A" stroke-width="2"/>
  <line x1="556" y1="106" x2="556" y2="370" stroke="#C4683A" stroke-width="2"/>
  <line x1="556" y1="238" x2="586" y2="238" stroke="#C4683A" stroke-width="2"/>
  <polygon points="592,238 582,232 582,244" fill="#C4683A"/>

  <!-- Skip outcome -->
  <rect x="592" y="206" width="118" height="64" rx="8" fill="#C4683A"/>
  <text x="651" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Skip it.</text>
  <text x="651" y="252" text-anchor="middle" font-size="11" fill="#FFFFFF">Save your</text>
  <text x="651" y="266" text-anchor="middle" font-size="11" fill="#FFFFFF">money.</text>

  <text x="360" y="524" text-anchor="middle" font-size="11" fill="#374151">One "no" is enough to walk away. The aisle is full of products that fail step one.</text>
  <text x="360" y="542" text-anchor="middle" font-size="10" fill="#374151" font-style="italic">Educational self-care guidance, not medical advice.</text>
</svg>
