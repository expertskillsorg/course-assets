<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Common Trigger Food Categories</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#374151">Worth testing in a sensitive gut. "Common trigger" does not mean "bad food."</text>

  <!-- Card 1: High-FODMAP -->
  <rect x="30" y="90" width="320" height="150" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="30" y="90" width="320" height="34" rx="10" fill="#1E2A8E"/>
  <rect x="30" y="110" width="320" height="14" fill="#1E2A8E"/>
  <text x="48" y="113" font-size="15" font-weight="bold" fill="#ffffff">High-FODMAP foods</text>
  <text x="48" y="148" font-size="13" fill="#111827">Onions, garlic, wheat, apples,</text>
  <text x="48" y="167" font-size="13" fill="#111827">beans, some stone fruits</text>
  <text x="48" y="200" font-size="12" fill="#374151">Fermentable carbs draw in water and</text>
  <text x="48" y="217" font-size="12" fill="#374151">feed gas: bloating and cramps.</text>

  <!-- Card 2: Lactose/dairy -->
  <rect x="370" y="90" width="320" height="150" rx="10" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="370" y="90" width="320" height="34" rx="10" fill="#3E9B6B"/>
  <rect x="370" y="110" width="320" height="14" fill="#3E9B6B"/>
  <text x="388" y="113" font-size="15" font-weight="bold" fill="#ffffff">Lactose and dairy</text>
  <text x="388" y="148" font-size="13" fill="#111827">Milk, soft cheeses, ice cream</text>
  <text x="388" y="200" font-size="12" fill="#374151">Many adults make less lactase, so milk</text>
  <text x="388" y="217" font-size="12" fill="#374151">sugar ferments: gas and looseness.</text>

  <!-- Card 3: Sugar / sugar alcohols -->
  <rect x="30" y="262" width="320" height="150" rx="10" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <rect x="30" y="262" width="320" height="34" rx="10" fill="#D4AF37"/>
  <rect x="30" y="282" width="320" height="14" fill="#D4AF37"/>
  <text x="48" y="285" font-size="15" font-weight="bold" fill="#141B5C">Added sugar and sugar alcohols</text>
  <text x="48" y="320" font-size="13" fill="#111827">Soda, candy, "sugar-free" gum</text>
  <text x="48" y="339" font-size="13" fill="#111827">(sorbitol, mannitol, xylitol)</text>
  <text x="48" y="372" font-size="12" fill="#374151">Hard to absorb and pull water in,</text>
  <text x="48" y="389" font-size="12" fill="#374151">stirring up gas and loose stools.</text>

  <!-- Card 4: Ultra-processed / alcohol / fatty meals -->
  <rect x="370" y="262" width="320" height="150" rx="10" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <rect x="370" y="262" width="320" height="34" rx="10" fill="#C4683A"/>
  <rect x="370" y="282" width="320" height="14" fill="#C4683A"/>
  <text x="388" y="285" font-size="15" font-weight="bold" fill="#ffffff">Ultra-processed, alcohol, big meals</text>
  <text x="388" y="320" font-size="13" fill="#111827">Packaged snacks, fast food, beer,</text>
  <text x="388" y="339" font-size="13" fill="#111827">wine, heavy greasy plates</text>
  <text x="388" y="372" font-size="12" fill="#374151">Low fiber and additives slow digestion</text>
  <text x="388" y="389" font-size="12" fill="#374151">and disturb the microbiome.</text>
</svg>
