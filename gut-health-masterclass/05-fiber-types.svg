<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#FFFFFF"/>
  <text x="360" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#141B5C">Two Kinds of Fiber, You Want Both</text>

  <!-- Soluble column -->
  <rect x="40" y="70" width="300" height="330" rx="14" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="3"/>
  <rect x="40" y="70" width="300" height="52" rx="14" fill="#3E9B6B"/>
  <rect x="40" y="100" width="300" height="22" fill="#3E9B6B"/>
  <text x="190" y="103" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Soluble</text>

  <text x="62" y="152" font-size="15" font-weight="bold" fill="#374151">What it is</text>
  <text x="62" y="174" font-size="14" fill="#111827">Dissolves into a soft gel</text>
  <text x="62" y="192" font-size="14" fill="#111827">in water</text>

  <text x="62" y="226" font-size="15" font-weight="bold" fill="#374151">Foods</text>
  <text x="62" y="248" font-size="14" fill="#111827">Oats, beans, lentils,</text>
  <text x="62" y="266" font-size="14" fill="#111827">apples, oranges, carrots,</text>
  <text x="62" y="284" font-size="14" fill="#111827">barley, psyllium</text>

  <text x="62" y="318" font-size="15" font-weight="bold" fill="#374151">Effect</text>
  <text x="62" y="340" font-size="14" fill="#111827">Feeds bacteria heavily,</text>
  <text x="62" y="358" font-size="14" fill="#111827">softens stool, slows</text>
  <text x="62" y="376" font-size="14" fill="#111827">digestion, keeps you full</text>

  <!-- Insoluble column -->
  <rect x="380" y="70" width="300" height="330" rx="14" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <rect x="380" y="70" width="300" height="52" rx="14" fill="#C4683A"/>
  <rect x="380" y="100" width="300" height="22" fill="#C4683A"/>
  <text x="530" y="103" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">Insoluble</text>

  <text x="402" y="152" font-size="15" font-weight="bold" fill="#374151">What it is</text>
  <text x="402" y="174" font-size="14" fill="#111827">Does not dissolve,</text>
  <text x="402" y="192" font-size="14" fill="#111827">stays coarse</text>

  <text x="402" y="226" font-size="15" font-weight="bold" fill="#374151">Foods</text>
  <text x="402" y="248" font-size="14" fill="#111827">Whole grains, wheat bran,</text>
  <text x="402" y="266" font-size="14" fill="#111827">nuts, seeds, fruit and veg</text>
  <text x="402" y="284" font-size="14" fill="#111827">skins, leafy greens</text>

  <text x="402" y="318" font-size="15" font-weight="bold" fill="#374151">Effect</text>
  <text x="402" y="340" font-size="14" fill="#111827">Adds bulk, speeds transit,</text>
  <text x="402" y="358" font-size="14" fill="#111827">the classic "keeps you</text>
  <text x="402" y="376" font-size="14" fill="#111827">regular" fiber</text>

  <text x="360" y="426" text-anchor="middle" font-size="14" fill="#D4AF37" font-weight="bold">Most whole plants contain a mix of both</text>
</svg>
