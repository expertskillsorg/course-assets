<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#141B5C">From Pillars to a Weekly Calendar</text>

  <!-- Pillars column header -->
  <text x="30" y="74" font-size="14" font-weight="bold" fill="#374151">Your 4 content pillars</text>

  <!-- Pillar 1 -->
  <rect x="30" y="86" width="200" height="46" rx="6" fill="#1E2A8E"/>
  <text x="130" y="115" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Destinations</text>
  <!-- Pillar 2 -->
  <rect x="30" y="146" width="200" height="46" rx="6" fill="#3E9B6B"/>
  <text x="130" y="175" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Budget Tips</text>
  <!-- Pillar 3 -->
  <rect x="30" y="206" width="200" height="46" rx="6" fill="#D4AF37"/>
  <text x="130" y="235" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Behind the Scenes</text>
  <!-- Pillar 4 -->
  <rect x="30" y="266" width="200" height="46" rx="6" fill="#C4683A"/>
  <text x="130" y="295" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gear &amp; Tools</text>

  <!-- Arrows feeding into the calendar -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M230 109 C 280 109, 290 150, 330 150"/>
    <path d="M230 169 C 280 169, 290 175, 330 175"/>
    <path d="M230 229 C 280 229, 290 240, 330 240"/>
    <path d="M230 289 C 280 289, 290 305, 330 305"/>
  </g>
  <g fill="#374151">
    <polygon points="330,150 322,146 322,154"/>
    <polygon points="330,175 322,171 322,179"/>
    <polygon points="330,240 322,236 322,244"/>
    <polygon points="330,305 322,301 322,309"/>
  </g>

  <!-- Calendar header -->
  <text x="350" y="74" font-size="14" font-weight="bold" fill="#374151">A repeatable posting week (3 posts)</text>

  <!-- Calendar grid: Mon / Wed / Fri -->
  <!-- Monday -->
  <rect x="350" y="86" width="380" height="96" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="366" y="112" font-size="13" font-weight="bold" fill="#141B5C">MON</text>
  <rect x="430" y="96" width="14" height="14" rx="3" fill="#1E2A8E"/>
  <text x="454" y="108" font-size="13" fill="#111827">Destinations  -  short video</text>
  <text x="366" y="150" font-size="12" fill="#374151">Educate: "3 stops most people miss in Lisbon"</text>

  <!-- Wednesday -->
  <rect x="350" y="196" width="380" height="96" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="366" y="222" font-size="13" font-weight="bold" fill="#141B5C">WED</text>
  <rect x="430" y="206" width="14" height="14" rx="3" fill="#3E9B6B"/>
  <text x="454" y="218" font-size="13" fill="#111827">Budget Tips  -  carousel</text>
  <text x="366" y="260" font-size="12" fill="#374151">Educate: "How I flew round trip for under $200"</text>

  <!-- Friday -->
  <rect x="350" y="306" width="380" height="96" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="366" y="332" font-size="13" font-weight="bold" fill="#141B5C">FRI</text>
  <rect x="430" y="316" width="14" height="14" rx="3" fill="#D4AF37"/>
  <text x="454" y="328" font-size="13" fill="#111827">Behind the Scenes  -  story</text>
  <text x="366" y="370" font-size="12" fill="#374151">Entertain: a real travel-day mishap</text>

  <!-- Footnote -->
  <text x="350" y="430" font-size="12" fill="#374151">Same pillars, same slots, every week. The plan repeats so you do not start from zero.</text>
</svg>
