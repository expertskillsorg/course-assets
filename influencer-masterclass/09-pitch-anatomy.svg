<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif" role="img" aria-label="Anatomy of a winning brand pitch, from subject line to call to action">
  <rect x="0" y="0" width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Anatomy of a Winning Brand Pitch</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#374151">Five parts, top to bottom, that move a brand from open to reply</text>

  <!-- Subject line -->
  <rect x="60" y="84" width="640" height="62" rx="8" fill="#1E2A8E"/>
  <text x="80" y="112" font-size="15" font-weight="bold" fill="#FFFFFF">1. Subject line</text>
  <text x="80" y="133" font-size="13" fill="#E5E7EB">Short and specific so it gets opened: "Home-decor creator + your vases"</text>

  <!-- Hook -->
  <rect x="60" y="158" width="640" height="62" rx="8" fill="#3E9B6B"/>
  <text x="80" y="186" font-size="15" font-weight="bold" fill="#FFFFFF">2. Hook</text>
  <text x="80" y="207" font-size="13" fill="#FFFFFF">Two lines about the fit between your audience and their product</text>

  <!-- Value -->
  <rect x="60" y="232" width="640" height="62" rx="8" fill="#D4AF37"/>
  <text x="80" y="260" font-size="15" font-weight="bold" fill="#141B5C">3. Value</text>
  <text x="80" y="281" font-size="13" fill="#141B5C">One concrete idea: the exact post or series you would create for them</text>

  <!-- Proof -->
  <rect x="60" y="306" width="640" height="62" rx="8" fill="#C4683A"/>
  <text x="80" y="334" font-size="15" font-weight="bold" fill="#FFFFFF">4. Proof</text>
  <text x="80" y="355" font-size="13" fill="#FFFFFF">A real number or result: engagement rate, saves, a past collaboration</text>

  <!-- Ask / CTA -->
  <rect x="60" y="380" width="640" height="62" rx="8" fill="#141B5C"/>
  <text x="80" y="408" font-size="15" font-weight="bold" fill="#FFFFFF">5. Call to action</text>
  <text x="80" y="429" font-size="13" fill="#E5E7EB">One easy next step: "Open to a quick call or a sample collaboration?"</text>

  <!-- flow arrow -->
  <line x1="40" y1="84" x2="40" y2="442" stroke="#374151" stroke-width="2"/>
  <polygon points="40,452 34,438 46,438" fill="#374151"/>
  <text x="22" y="270" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 22 270)">read top to bottom</text>

  <text x="380" y="486" text-anchor="middle" font-size="13" fill="#374151">Keep the whole pitch short: a brand should be able to read it in under a minute.</text>
</svg>
