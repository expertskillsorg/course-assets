<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">As you scale: keep, systemize, or outsource each task</text>

  <!-- KEEP column -->
  <rect x="30" y="64" width="200" height="320" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="30" y="64" width="200" height="44" rx="10" fill="#1E2A8E"/>
  <text x="130" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">KEEP</text>
  <text x="130" y="128" text-anchor="middle" font-size="12" fill="#374151">Only you can do it</text>
  <text x="130" y="170" text-anchor="middle" font-size="13" fill="#111827">On-camera presence</text>
  <text x="130" y="200" text-anchor="middle" font-size="13" fill="#111827">Your point of view</text>
  <text x="130" y="230" text-anchor="middle" font-size="13" fill="#111827">Brand relationships</text>
  <text x="130" y="260" text-anchor="middle" font-size="13" fill="#111827">Creative direction</text>
  <text x="130" y="290" text-anchor="middle" font-size="13" fill="#111827">Final approval</text>

  <!-- SYSTEMIZE column -->
  <rect x="260" y="64" width="200" height="320" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <rect x="260" y="64" width="200" height="44" rx="10" fill="#D4AF37"/>
  <text x="360" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">SYSTEMIZE</text>
  <text x="360" y="128" text-anchor="middle" font-size="12" fill="#374151">Repeatable, make a process</text>
  <text x="360" y="170" text-anchor="middle" font-size="13" fill="#111827">Posting checklist</text>
  <text x="360" y="200" text-anchor="middle" font-size="13" fill="#111827">Caption template</text>
  <text x="360" y="230" text-anchor="middle" font-size="13" fill="#111827">Content calendar</text>
  <text x="360" y="260" text-anchor="middle" font-size="13" fill="#111827">Pitch template</text>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#111827">Filing your files</text>

  <!-- OUTSOURCE column -->
  <rect x="490" y="64" width="200" height="320" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="490" y="64" width="200" height="44" rx="10" fill="#3E9B6B"/>
  <text x="590" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">OUTSOURCE</text>
  <text x="590" y="128" text-anchor="middle" font-size="12" fill="#374151">Hand off once systemized</text>
  <text x="590" y="170" text-anchor="middle" font-size="13" fill="#111827">Video editing</text>
  <text x="590" y="200" text-anchor="middle" font-size="13" fill="#111827">Scheduling posts</text>
  <text x="590" y="230" text-anchor="middle" font-size="13" fill="#111827">Inbox and admin</text>
  <text x="590" y="260" text-anchor="middle" font-size="13" fill="#111827">Bookkeeping</text>
  <text x="590" y="290" text-anchor="middle" font-size="13" fill="#111827">Graphics</text>

  <!-- arrow systemize -> outsource -->
  <path d="M462 330 L488 330" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="475" y="322" text-anchor="middle" font-size="11" fill="#374151"></text>
  <text x="475" y="356" text-anchor="middle" font-size="11" fill="#C4683A">systemize first,</text>
  <text x="475" y="370" text-anchor="middle" font-size="11" fill="#C4683A">then hand off</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
