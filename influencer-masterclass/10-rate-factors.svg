<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">What Sets Your Rate, and How It Becomes a Rate Card</text>

  <!-- Left column: the five factors -->
  <text x="170" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Factors that set your rate</text>

  <!-- Factor cards -->
  <g>
    <rect x="30" y="90" width="280" height="46" rx="6" fill="#1E2A8E"/>
    <text x="50" y="112" font-size="13" font-weight="bold" fill="#ffffff">Audience size</text>
    <text x="50" y="129" font-size="11" fill="#E5E7EB">How many people you reach</text>
  </g>
  <g>
    <rect x="30" y="146" width="280" height="46" rx="6" fill="#3E9B6B"/>
    <text x="50" y="168" font-size="13" font-weight="bold" fill="#ffffff">Engagement</text>
    <text x="50" y="185" font-size="11" fill="#ffffff">How much they trust and respond</text>
  </g>
  <g>
    <rect x="30" y="202" width="280" height="46" rx="6" fill="#D4AF37"/>
    <text x="50" y="224" font-size="13" font-weight="bold" fill="#141B5C">Niche value</text>
    <text x="50" y="241" font-size="11" fill="#141B5C">How much brands spend in your space</text>
  </g>
  <g>
    <rect x="30" y="258" width="280" height="46" rx="6" fill="#C4683A"/>
    <text x="50" y="280" font-size="13" font-weight="bold" fill="#ffffff">Deliverables</text>
    <text x="50" y="297" font-size="11" fill="#ffffff">How much work the brand asks for</text>
  </g>
  <g>
    <rect x="30" y="314" width="280" height="46" rx="6" fill="#141B5C"/>
    <text x="50" y="336" font-size="13" font-weight="bold" fill="#ffffff">Usage rights</text>
    <text x="50" y="353" font-size="11" fill="#E5E7EB">How long and where they reuse it</text>
  </g>

  <!-- Arrow -->
  <g>
    <line x1="320" y1="225" x2="400" y2="225" stroke="#374151" stroke-width="3"/>
    <polygon points="400,217 418,225 400,233" fill="#374151"/>
    <text x="365" y="215" text-anchor="middle" font-size="11" fill="#374151">feed into</text>
  </g>

  <!-- Right column: rate card -->
  <rect x="430" y="86" width="300" height="300" rx="8" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="430" y="86" width="300" height="40" rx="8" fill="#1E2A8E"/>
  <text x="580" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Your Rate Card</text>

  <text x="450" y="156" font-size="12" font-weight="bold" fill="#111827">Deliverable</text>
  <text x="710" y="156" text-anchor="end" font-size="12" font-weight="bold" fill="#111827">Starting price</text>
  <line x1="450" y1="166" x2="710" y2="166" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="450" y="194" font-size="12" fill="#374151">One short video</text>
  <text x="710" y="194" text-anchor="end" font-size="12" fill="#3E9B6B">$___</text>
  <line x1="450" y1="206" x2="710" y2="206" stroke="#E5E7EB" stroke-width="1"/>

  <text x="450" y="232" font-size="12" fill="#374151">Carousel post</text>
  <text x="710" y="232" text-anchor="end" font-size="12" fill="#3E9B6B">$___</text>
  <line x1="450" y1="244" x2="710" y2="244" stroke="#E5E7EB" stroke-width="1"/>

  <text x="450" y="270" font-size="12" fill="#374151">Story set (3 frames)</text>
  <text x="710" y="270" text-anchor="end" font-size="12" fill="#3E9B6B">$___</text>
  <line x1="450" y1="282" x2="710" y2="282" stroke="#E5E7EB" stroke-width="1"/>

  <text x="450" y="308" font-size="12" fill="#374151">Bundle (video + post)</text>
  <text x="710" y="308" text-anchor="end" font-size="12" fill="#3E9B6B">$___</text>
  <line x1="450" y1="320" x2="710" y2="320" stroke="#E5E7EB" stroke-width="1"/>

  <text x="450" y="350" font-size="11" font-style="italic" fill="#C4683A">Starting prices, not final. Adjust per deal.</text>

  <text x="380" y="430" text-anchor="middle" font-size="11" fill="#374151">The same five factors raise or lower every line on the card. Rates are baselines that vary widely by creator and deal.</text>
</svg>
