<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Arial, sans-serif">
  <rect width="720" height="320" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Your 90-Day Creator Roadmap</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">From setup to your first paid deal</text>

  <!-- baseline -->
  <line x1="40" y1="150" x2="640" y2="150" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Phase 1 -->
  <rect x="40" y="120" width="150" height="60" rx="8" fill="#1E2A8E"/>
  <text x="115" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Foundation</text>
  <text x="115" y="166" text-anchor="middle" font-size="11" fill="#FFFFFF">Niche, brand, profile</text>
  <text x="115" y="200" text-anchor="middle" font-size="11" fill="#374151">Days 1-21</text>

  <!-- Phase 2 -->
  <rect x="200" y="120" width="150" height="60" rx="8" fill="#3E9B6B"/>
  <text x="275" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Content System</text>
  <text x="275" y="166" text-anchor="middle" font-size="11" fill="#FFFFFF">Pillars, cadence, posts</text>
  <text x="275" y="200" text-anchor="middle" font-size="11" fill="#374151">Days 22-45</text>

  <!-- Phase 3 -->
  <rect x="360" y="120" width="150" height="60" rx="8" fill="#D4AF37"/>
  <text x="435" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Growth</text>
  <text x="435" y="166" text-anchor="middle" font-size="11" fill="#141B5C">First 1,000, collabs</text>
  <text x="435" y="200" text-anchor="middle" font-size="11" fill="#374151">Days 46-70</text>

  <!-- Phase 4 -->
  <rect x="520" y="120" width="150" height="60" rx="8" fill="#C4683A"/>
  <text x="595" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Monetization</text>
  <text x="595" y="166" text-anchor="middle" font-size="11" fill="#FFFFFF">Streams, pitch, deal</text>
  <text x="595" y="200" text-anchor="middle" font-size="11" fill="#374151">Days 71-90</text>

  <!-- arrows between -->
  <path d="M190 150 l12 0" stroke="#374151" stroke-width="2"/>
  <path d="M350 150 l12 0" stroke="#374151" stroke-width="2"/>
  <path d="M510 150 l12 0" stroke="#374151" stroke-width="2"/>

  <!-- goal flag -->
  <circle cx="595" cy="252" r="6" fill="#C4683A"/>
  <text x="595" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">First paid deal</text>
</svg>
