<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Disclosing a Sponsored Post</text>

  <!-- DO column -->
  <rect x="30" y="70" width="310" height="320" rx="10" fill="#F2F7F4" stroke="#3E9B6B" stroke-width="2"/>
  <circle cx="62" cy="102" r="16" fill="#3E9B6B"/>
  <path d="M54 102 l6 6 l11 -13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="108" font-size="19" font-weight="bold" fill="#3E9B6B">Do this</text>

  <text x="56" y="150" font-size="14" fill="#374151">&#8226; Plain words: "paid," "sponsored," "ad"</text>
  <text x="56" y="184" font-size="14" fill="#374151">&#8226; Place it up front, before "more"</text>
  <text x="56" y="218" font-size="14" fill="#374151">&#8226; Say it out loud + on screen in video</text>
  <text x="56" y="252" font-size="14" fill="#374151">&#8226; Use the paid-partnership label</text>
  <text x="56" y="286" font-size="14" fill="#374151">&#8226; Disclose on every paid post</text>

  <rect x="56" y="312" width="258" height="56" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="68" y="334" font-size="13" font-weight="bold" fill="#141B5C">#ad Paid partnership with [brand]</text>
  <text x="68" y="354" font-size="12" fill="#374151">This carrier has been a lifesaver...</text>

  <!-- DON'T column -->
  <rect x="380" y="70" width="310" height="320" rx="10" fill="#FBF1EC" stroke="#C4683A" stroke-width="2"/>
  <circle cx="412" cy="102" r="16" fill="#C4683A"/>
  <path d="M405 95 l14 14 M419 95 l-14 14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="438" y="108" font-size="19" font-weight="bold" fill="#C4683A">Not this</text>

  <text x="406" y="150" font-size="14" fill="#374151">&#8226; Vague tags: #sp, #collab, #ambassador</text>
  <text x="406" y="184" font-size="14" fill="#374151">&#8226; Buried at the end of the caption</text>
  <text x="406" y="218" font-size="14" fill="#374151">&#8226; No spoken or on-screen note</text>
  <text x="406" y="252" font-size="14" fill="#374151">&#8226; Hidden in a wall of hashtags</text>
  <text x="406" y="286" font-size="14" fill="#374151">&#8226; Skipped "just this once"</text>

  <rect x="406" y="312" width="258" height="56" rx="6" fill="#FFFFFF" stroke="#C4683A" stroke-width="1.5"/>
  <text x="418" y="334" font-size="12" fill="#374151">Obsessed with this carrier!!</text>
  <text x="418" y="354" font-size="11" fill="#9CA3AF">#momlife #baby #toddler #sp #collab #fyp</text>
</svg>
