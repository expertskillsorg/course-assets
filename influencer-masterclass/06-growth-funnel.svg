<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Audience Growth Funnel</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">From a stranger's scroll to an engaged follower</text>

  <!-- Stage 1: Reach -->
  <polygon points="90,80 550,80 478,150 162,150" fill="#1E2A8E"/>
  <text x="320" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Reach</text>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="#E5E7EB">Strangers who see your post in a feed</text>

  <!-- Stage 2: Profile visit -->
  <polygon points="162,158 478,158 430,228 210,228" fill="#3E9B6B"/>
  <text x="320" y="188" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Profile Visit</text>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#FFFFFF">Curious viewers who tap your name</text>

  <!-- Stage 3: Follow -->
  <polygon points="210,236 430,236 392,306 248,306" fill="#D4AF37"/>
  <text x="320" y="266" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Follow</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#141B5C">Visitors convinced to hit follow</text>

  <!-- Stage 4: Engaged follower -->
  <polygon points="248,314 392,314 360,384 280,384" fill="#C4683A"/>
  <text x="320" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Engaged</text>
  <text x="320" y="365" text-anchor="middle" font-size="12" fill="#FFFFFF">Returns, watches, comments</text>

  <!-- Shrink arrow -->
  <line x1="600" y1="90" x2="600" y2="375" stroke="#374151" stroke-width="2"/>
  <polygon points="600,384 595,372 605,372" fill="#374151"/>
  <text x="618" y="240" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(90 618 240)">Fewer people at each stage</text>
</svg>
