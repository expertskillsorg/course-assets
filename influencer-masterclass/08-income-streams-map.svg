<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How Five Income Streams Connect to Your Audience</text>

  <!-- connecting lines (drawn first so nodes sit on top) -->
  <line x1="380" y1="230" x2="160" y2="120" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="230" x2="600" y2="120" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="230" x2="120" y2="300" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="230" x2="640" y2="300" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="380" y1="230" x2="380" y2="400" stroke="#E5E7EB" stroke-width="2"/>

  <!-- center: audience -->
  <circle cx="380" cy="230" r="62" fill="#1E2A8E"/>
  <text x="380" y="224" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">YOUR</text>
  <text x="380" y="246" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">AUDIENCE</text>

  <!-- Brand deals (top left) -->
  <rect x="40" y="78" width="200" height="78" rx="10" fill="#D4AF37"/>
  <text x="140" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Brand Deals</text>
  <text x="140" y="128" text-anchor="middle" font-size="11" fill="#141B5C">A company pays you to</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#141B5C">reach your audience</text>

  <!-- Affiliate (top right) -->
  <rect x="520" y="78" width="200" height="78" rx="10" fill="#3E9B6B"/>
  <text x="620" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Affiliate Marketing</text>
  <text x="620" y="128" text-anchor="middle" font-size="11" fill="#FFFFFF">Audience buys via your</text>
  <text x="620" y="143" text-anchor="middle" font-size="11" fill="#FFFFFF">link; you earn a cut</text>

  <!-- Digital products (bottom left) -->
  <rect x="20" y="262" width="200" height="78" rx="10" fill="#C4683A"/>
  <text x="120" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Digital Products</text>
  <text x="120" y="312" text-anchor="middle" font-size="11" fill="#FFFFFF">Audience buys what</text>
  <text x="120" y="327" text-anchor="middle" font-size="11" fill="#FFFFFF">you make once</text>

  <!-- Platform payouts (bottom right) -->
  <rect x="540" y="262" width="200" height="78" rx="10" fill="#1E2A8E"/>
  <text x="640" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Platform Payouts</text>
  <text x="640" y="312" text-anchor="middle" font-size="11" fill="#FFFFFF">Platform pays you for</text>
  <text x="640" y="327" text-anchor="middle" font-size="11" fill="#FFFFFF">the attention earned</text>

  <!-- Services (bottom center) -->
  <rect x="280" y="402" width="200" height="48" rx="10" fill="#374151"/>
  <text x="380" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Services</text>
  <text x="380" y="442" text-anchor="middle" font-size="11" fill="#FFFFFF">You sell your time and skill</text>
</svg>
