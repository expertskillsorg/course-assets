<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="520" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Clean Client and Listing Folder Structure</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">One top folder per client, with consistent subfolders inside every listing</text>

  <!-- Top level -->
  <rect x="40" y="80" width="300" height="40" rx="6" fill="#1E2A8E"/>
  <text x="62" y="105" font-size="15" font-weight="bold" fill="#FFFFFF">Clients</text>
  <text x="300" y="105" text-anchor="end" font-size="12" fill="#D4AF37">top level</text>

  <!-- connector down -->
  <line x1="70" y1="120" x2="70" y2="160" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Client folder -->
  <line x1="70" y1="180" x2="100" y2="180" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="100" y="160" width="320" height="38" rx="6" fill="#141B5C"/>
  <text x="120" y="184" font-size="14" font-weight="bold" fill="#FFFFFF">Smith, Jane (Seller)</text>

  <line x1="120" y1="198" x2="120" y2="430" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Client subfolders -->
  <line x1="120" y1="232" x2="150" y2="232" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="214" width="270" height="34" rx="6" fill="#3E9B6B"/>
  <text x="168" y="236" font-size="13" fill="#FFFFFF">01 Contacts and Notes</text>

  <line x1="120" y1="280" x2="150" y2="280" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="262" width="270" height="34" rx="6" fill="#3E9B6B"/>
  <text x="168" y="284" font-size="13" fill="#FFFFFF">02 Agreements</text>

  <!-- Listings subfolder (expands) -->
  <line x1="120" y1="328" x2="150" y2="328" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="310" width="270" height="34" rx="6" fill="#C4683A"/>
  <text x="168" y="332" font-size="13" font-weight="bold" fill="#FFFFFF">03 Listings</text>

  <line x1="120" y1="376" x2="150" y2="376" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="358" width="270" height="34" rx="6" fill="#3E9B6B"/>
  <text x="168" y="380" font-size="13" fill="#FFFFFF">04 Marketing</text>

  <line x1="120" y1="424" x2="150" y2="424" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="150" y="406" width="270" height="34" rx="6" fill="#3E9B6B"/>
  <text x="168" y="428" font-size="13" fill="#FFFFFF">05 Reports and Hours</text>

  <!-- Inside a listing -->
  <line x1="420" y1="327" x2="450" y2="327" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="450" y="240" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="466" y="266" font-size="13" font-weight="bold" fill="#C4683A">Inside one listing:</text>
  <text x="466" y="288" font-size="12" fill="#374151">123 Oak St</text>

  <rect x="466" y="300" width="208" height="28" rx="5" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="480" y="319" font-size="12" fill="#111827">Photos</text>
  <rect x="466" y="334" width="208" height="28" rx="5" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="480" y="353" font-size="12" fill="#111827">Disclosures and Docs</text>
  <rect x="466" y="368" width="208" height="28" rx="5" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="480" y="387" font-size="12" fill="#111827">MLS and Listing Info</text>
  <rect x="466" y="402" width="208" height="28" rx="5" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="480" y="421" font-size="12" fill="#111827">Marketing Assets</text>

  <text x="40" y="488" font-size="12" fill="#374151">Naming rule: number folders to force order, and name files like</text>
  <text x="40" y="506" font-size="12" font-weight="bold" fill="#1E2A8E">123-Oak-St_Listing-Agreement_2026-06-06.pdf</text>
</svg>
