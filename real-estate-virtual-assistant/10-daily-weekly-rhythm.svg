<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#141B5C">A Real Estate VA's Daily and Weekly Rhythm</text>

  <!-- Daily timeline -->
  <text x="24" y="70" font-size="15" font-weight="bold" fill="#1E2A8E">DAILY (every workday)</text>
  <line x1="24" y1="84" x2="696" y2="84" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Morning -->
  <circle cx="120" cy="84" r="7" fill="#3E9B6B"/>
  <text x="120" y="110" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">Morning</text>
  <text x="120" y="128" font-size="11" fill="#374151" text-anchor="middle">Check leads + CRM</text>
  <text x="120" y="143" font-size="11" fill="#374151" text-anchor="middle">Confirm today's</text>
  <text x="120" y="158" font-size="11" fill="#374151" text-anchor="middle">appointments</text>

  <!-- Midday -->
  <circle cx="360" cy="84" r="7" fill="#D4AF37"/>
  <text x="360" y="110" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">Midday</text>
  <text x="360" y="128" font-size="11" fill="#374151" text-anchor="middle">Task work + replies</text>
  <text x="360" y="143" font-size="11" fill="#374151" text-anchor="middle">Update listings,</text>
  <text x="360" y="158" font-size="11" fill="#374151" text-anchor="middle">deadlines, docs</text>

  <!-- End of day -->
  <circle cx="600" cy="84" r="7" fill="#C4683A"/>
  <text x="600" y="110" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">End of day</text>
  <text x="600" y="128" font-size="11" fill="#374151" text-anchor="middle">Review + prep</text>
  <text x="600" y="143" font-size="11" fill="#374151" text-anchor="middle">tomorrow,</text>
  <text x="600" y="158" font-size="11" fill="#374151" text-anchor="middle">send handoff note</text>

  <!-- Weekly cycle -->
  <text x="24" y="220" font-size="15" font-weight="bold" fill="#1E2A8E">WEEKLY (recurring blocks)</text>
  <line x1="24" y1="234" x2="696" y2="234" stroke="#E5E7EB" stroke-width="2"/>

  <g>
    <rect x="40" y="256" width="180" height="68" rx="8" fill="#1E2A8E"/>
    <text x="130" y="284" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Monday</text>
    <text x="130" y="305" font-size="11" fill="#ffffff" text-anchor="middle">Plan the week,</text>
    <text x="130" y="319" font-size="11" fill="#ffffff" text-anchor="middle">agent check-in</text>
  </g>
  <g>
    <rect x="270" y="256" width="180" height="68" rx="8" fill="#3E9B6B"/>
    <text x="360" y="284" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Midweek</text>
    <text x="360" y="305" font-size="11" fill="#ffffff" text-anchor="middle">Marketing + social</text>
    <text x="360" y="319" font-size="11" fill="#ffffff" text-anchor="middle">content batch</text>
  </g>
  <g>
    <rect x="500" y="256" width="180" height="68" rx="8" fill="#C4683A"/>
    <text x="590" y="284" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Friday</text>
    <text x="590" y="305" font-size="11" fill="#ffffff" text-anchor="middle">Reporting, CRM</text>
    <text x="590" y="319" font-size="11" fill="#ffffff" text-anchor="middle">cleanup, recap</text>
  </g>

  <!-- arrows between weekly blocks -->
  <path d="M222 290 L268 290" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M452 290 L498 290" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <text x="360" y="380" font-size="12" fill="#374151" text-anchor="middle" font-style="italic">The daily loop keeps the business moving; the weekly blocks keep it growing.</text>
  <rect x="40" y="404" width="640" height="36" rx="8" fill="#141B5C"/>
  <text x="360" y="427" font-size="13" font-weight="bold" fill="#D4AF37" text-anchor="middle">Same tasks, same times, every week = a rhythm you can run without being told.</text>
</svg>
