<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The deal lifecycle as a left-to-right timeline with three stages, pre-contract, under contract, and post-close, showing where a VA plugs in with admin tasks and where the licensed-only and TC-only work sits above the line.">
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">Where a VA plugs into the deal</text>

  <!-- timeline arrow -->
  <line x1="60" y1="180" x2="710" y2="180" stroke="#374151" stroke-width="3"/>
  <polygon points="710,180 696,172 696,188" fill="#374151"/>

  <!-- stage markers -->
  <circle cx="160" cy="180" r="7" fill="#1E2A8E"/>
  <circle cx="385" cy="180" r="7" fill="#1E2A8E"/>
  <circle cx="610" cy="180" r="7" fill="#1E2A8E"/>

  <text x="160" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Pre-contract</text>
  <text x="385" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Under contract</text>
  <text x="610" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E2A8E" text-anchor="middle">Post-close</text>

  <!-- VA tasks below the line (green) -->
  <rect x="70" y="240" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="80" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">VA helps here</text>
  <text x="80" y="282" font-family="Arial, sans-serif" font-size="11" fill="#374151">Prep documents</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="11" fill="#374151">Schedule, organize</text>
  <text x="80" y="318" font-family="Arial, sans-serif" font-size="11" fill="#374151">Set up the file</text>

  <rect x="295" y="240" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="305" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">VA helps here</text>
  <text x="305" y="282" font-family="Arial, sans-serif" font-size="11" fill="#374151">Collect signatures</text>
  <text x="305" y="300" font-family="Arial, sans-serif" font-size="11" fill="#374151">Track deadlines</text>
  <text x="305" y="318" font-family="Arial, sans-serif" font-size="11" fill="#374151">Send reminders</text>

  <rect x="520" y="240" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="530" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">VA helps here</text>
  <text x="530" y="282" font-family="Arial, sans-serif" font-size="11" fill="#374151">Update records</text>
  <text x="530" y="300" font-family="Arial, sans-serif" font-size="11" fill="#374151">Archive the file</text>
  <text x="530" y="318" font-family="Arial, sans-serif" font-size="11" fill="#374151">Client follow-up</text>

  <!-- reserved work above the line (terracotta) -->
  <rect x="180" y="78" width="400" height="62" rx="6" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="200" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C4683A">Not the VA's lane</text>
  <text x="200" y="122" font-family="Arial, sans-serif" font-size="11" fill="#374151">Advising on terms and price (agent only) | owning the contract to close (TC)</text>

  <line x1="380" y1="140" x2="385" y2="173" stroke="#C4683A" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
