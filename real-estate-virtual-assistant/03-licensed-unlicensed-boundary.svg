<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Where a VA's Work Stops and an Agent's Begins</text>

  <!-- center divider line -->
  <line x1="360" y1="60" x2="360" y2="400" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="360" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#D4AF37">THE LINE</text>

  <!-- LEFT: VA can do -->
  <rect x="24" y="96" width="312" height="296" rx="10" fill="#3E9B6B" opacity="0.10"/>
  <text x="180" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E9B6B">A VA CAN DO (no license)</text>
  <text x="180" y="142" text-anchor="middle" font-size="11" fill="#374151">Facts and logistics</text>

  <g font-size="12.5" fill="#111827">
    <text x="44" y="172">Enter and clean CRM data</text>
    <text x="44" y="198">Schedule showings and meetings</text>
    <text x="44" y="224">Prepare and organize documents</text>
    <text x="44" y="250">Build marketing and social posts</text>
    <text x="44" y="276">Send factual follow-up messages</text>
    <text x="44" y="302">Track deadlines and dates</text>
    <text x="44" y="328">Relay info the agent provides</text>
    <text x="44" y="354">Manage the calendar and email</text>
  </g>

  <!-- RIGHT: needs a license -->
  <rect x="384" y="96" width="312" height="296" rx="10" fill="#C4683A" opacity="0.10"/>
  <text x="540" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">NEEDS A LICENSE (not the VA)</text>
  <text x="540" y="142" text-anchor="middle" font-size="11" fill="#374151">Advice and representation</text>

  <g font-size="12.5" fill="#111827">
    <text x="404" y="172">Advise on price or offer terms</text>
    <text x="404" y="198">Negotiate on a client's behalf</text>
    <text x="404" y="224">Show property to buyers</text>
    <text x="404" y="250">Solicit or sign new clients</text>
    <text x="404" y="276">Give opinions on a home's value</text>
    <text x="404" y="302">Explain what a contract means</text>
    <text x="404" y="328">Promise outcomes or results</text>
    <text x="404" y="354">Discuss commission to a client</text>
  </g>

  <text x="360" y="412" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">Exact rules vary by state and brokerage. Confirm with the agent's broker before acting.</text>
</svg>
