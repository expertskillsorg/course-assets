<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A line falling steeply from left to right showing that the chance of reaching a new lead drops sharply as response time grows: very high within five minutes, much lower after thirty minutes, and near the floor after a few hours.">
  <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#141B5C">Chance of Reaching a Lead vs. Response Time</text>

  <!-- axes -->
  <line x1="80" y1="60" x2="80" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="320" x2="600" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- y axis label -->
  <text x="30" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151" transform="rotate(-90 30 195)">Chance of connecting</text>
  <!-- x axis label -->
  <text x="340" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Time before you respond</text>

  <!-- gridline ticks -->
  <text x="72" y="66" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#374151">High</text>
  <text x="72" y="324" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#374151">Low</text>

  <!-- x ticks -->
  <text x="110" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">5 min</text>
  <text x="240" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">30 min</text>
  <text x="370" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">1 hr</text>
  <text x="500" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">5 hrs</text>
  <text x="585" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">24 hrs</text>

  <!-- the falling curve -->
  <path d="M110 78 C 170 110, 200 200, 240 235 S 340 295, 370 300 S 500 314, 585 317" fill="none" stroke="#C4683A" stroke-width="4" stroke-linecap="round"/>

  <!-- highlight points -->
  <circle cx="110" cy="78" r="6" fill="#3E9B6B"/>
  <circle cx="240" cy="235" r="6" fill="#D4AF37"/>
  <circle cx="585" cy="317" r="6" fill="#1E2A8E"/>

  <!-- callouts -->
  <text x="122" y="74" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">Reply in minutes: best odds</text>
  <text x="252" y="232" font-family="Arial, sans-serif" font-size="12" fill="#374151">Wait 30 min: odds fall fast</text>
  <text x="430" y="308" font-family="Arial, sans-serif" font-size="12" fill="#374151">Next day: nearly cold</text>
</svg>
