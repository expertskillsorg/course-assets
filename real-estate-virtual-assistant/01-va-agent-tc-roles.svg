<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect width="720" height="440" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How the Agent, TC, and VA Roles Overlap</text>

  <!-- Circles -->
  <circle cx="265" cy="225" r="135" fill="#1E2A8E" fill-opacity="0.16" stroke="#1E2A8E" stroke-width="2.5"/>
  <circle cx="455" cy="225" r="135" fill="#3E9B6B" fill-opacity="0.16" stroke="#3E9B6B" stroke-width="2.5"/>
  <circle cx="360" cy="320" r="135" fill="#D4AF37" fill-opacity="0.18" stroke="#C4683A" stroke-width="2.5"/>

  <!-- Role titles -->
  <text x="185" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E2A8E">AGENT</text>
  <text x="185" y="172" text-anchor="middle" font-size="12" fill="#374151">(licensed)</text>
  <text x="535" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#3E9B6B">TC</text>
  <text x="360" y="412" text-anchor="middle" font-size="17" font-weight="bold" fill="#C4683A">VA</text>

  <!-- Agent-only -->
  <text x="180" y="205" text-anchor="middle" font-size="12" fill="#111827">Advises clients</text>
  <text x="180" y="225" text-anchor="middle" font-size="12" fill="#111827">Negotiates</text>
  <text x="180" y="245" text-anchor="middle" font-size="12" fill="#111827">Represents</text>
  <text x="180" y="265" text-anchor="middle" font-size="12" fill="#111827">Shows homes</text>

  <!-- TC-only -->
  <text x="545" y="210" text-anchor="middle" font-size="12" fill="#111827">Owns one deal</text>
  <text x="545" y="230" text-anchor="middle" font-size="12" fill="#111827">offer to close</text>
  <text x="545" y="252" text-anchor="middle" font-size="12" fill="#111827">Deal deadlines</text>

  <!-- VA-only -->
  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#111827">Ongoing business support</text>
  <text x="360" y="382" text-anchor="middle" font-size="12" fill="#111827">CRM, marketing, scheduling</text>

  <!-- Shared overlap (center) -->
  <text x="360" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Shared logistics:</text>
  <text x="360" y="250" text-anchor="middle" font-size="11" fill="#374151">documents, scheduling,</text>
  <text x="360" y="266" text-anchor="middle" font-size="11" fill="#374151">reminders</text>
</svg>
