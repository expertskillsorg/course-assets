<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="A horizontal timeline of a real estate deal in three phases: preparing to list, on the market, and under contract to closing, with the main stages marked along the line">
  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#141B5C">The Deal Lifecycle: Listing to Closing</text>

  <!-- phase header bands -->
  <rect x="40" y="64" width="280" height="34" rx="6" fill="#1E2A8E"/>
  <rect x="340" y="64" width="240" height="34" rx="6" fill="#3E9B6B"/>
  <rect x="600" y="64" width="320" height="34" rx="6" fill="#C4683A"/>
  <text x="180" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Preparing to list</text>
  <text x="460" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">On the market</text>
  <text x="760" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Under contract to closing</text>

  <!-- timeline spine -->
  <line x1="60" y1="150" x2="900" y2="150" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>

  <!-- stage nodes -->
  <!-- node positions -->
  <g font-family="Arial, sans-serif" font-size="12.5" fill="#374151">
    <!-- 1 listing agreement -->
    <circle cx="110" cy="150" r="11" fill="#1E2A8E"/>
    <text x="110" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="110" y="190" text-anchor="middle">Listing</text>
    <text x="110" y="206" text-anchor="middle">agreement</text>

    <!-- 2 prep + photos -->
    <circle cx="230" cy="150" r="11" fill="#1E2A8E"/>
    <text x="230" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="230" y="190" text-anchor="middle">Prep &amp;</text>
    <text x="230" y="206" text-anchor="middle">photos</text>

    <!-- 3 go live MLS -->
    <circle cx="360" cy="150" r="11" fill="#3E9B6B"/>
    <text x="360" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="360" y="190" text-anchor="middle">Go live</text>
    <text x="360" y="206" text-anchor="middle">on MLS</text>

    <!-- 4 showings -->
    <circle cx="470" cy="150" r="11" fill="#3E9B6B"/>
    <text x="470" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="470" y="190" text-anchor="middle">Showings</text>

    <!-- 5 offer accepted -->
    <circle cx="560" cy="150" r="11" fill="#3E9B6B"/>
    <text x="560" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="560" y="190" text-anchor="middle">Offer</text>
    <text x="560" y="206" text-anchor="middle">accepted</text>

    <!-- 6 earnest money -->
    <circle cx="650" cy="150" r="11" fill="#C4683A"/>
    <text x="650" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6</text>
    <text x="650" y="190" text-anchor="middle">Earnest</text>
    <text x="650" y="206" text-anchor="middle">money</text>

    <!-- 7 inspection + appraisal -->
    <circle cx="740" cy="150" r="11" fill="#C4683A"/>
    <text x="740" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">7</text>
    <text x="740" y="190" text-anchor="middle">Inspection,</text>
    <text x="740" y="206" text-anchor="middle">appraisal</text>

    <!-- 8 financing clears -->
    <circle cx="820" cy="150" r="11" fill="#C4683A"/>
    <text x="820" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">8</text>
    <text x="820" y="190" text-anchor="middle">Financing</text>
    <text x="820" y="206" text-anchor="middle">clears</text>

    <!-- 9 closing -->
    <circle cx="895" cy="150" r="13" fill="#D4AF37"/>
    <text x="895" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">9</text>
    <text x="895" y="190" text-anchor="middle" font-weight="bold" fill="#141B5C">Closing</text>
  </g>

  <!-- VA note band -->
  <rect x="40" y="300" width="880" height="84" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#141B5C">Where the VA helps</text>
  <text x="60" y="354" font-family="Arial, sans-serif" font-size="13" fill="#374151">Coordinate prep, book the photographer, gather details, schedule showings, and track every</text>
  <text x="60" y="372" font-family="Arial, sans-serif" font-size="13" fill="#374151">deadline once the deal is under contract. The agent advises and decides; the VA keeps it all on schedule.</text>
</svg>
