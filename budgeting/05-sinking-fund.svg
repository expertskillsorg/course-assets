<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, sans-serif">
  <rect width="640" height="360" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">How a sinking fund works</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">One yearly bill, divided into twelve small monthly set-asides</text>

  <!-- Annual bill box -->
  <rect x="40" y="92" width="170" height="120" rx="10" fill="#1E2A8E"/>
  <text x="125" y="124" text-anchor="middle" font-size="14" fill="#FFFFFF">Annual bill</text>
  <text x="125" y="166" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">$600</text>
  <text x="125" y="192" text-anchor="middle" font-size="13" fill="#D4AF37">car insurance</text>

  <!-- Divide marker -->
  <circle cx="262" cy="152" r="26" fill="#D4AF37"/>
  <text x="262" y="159" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">÷12</text>

  <!-- Arrow from bill to divide -->
  <line x1="210" y1="152" x2="232" y2="152" stroke="#374151" stroke-width="2.5"/>
  <polygon points="232,146 244,152 232,158" fill="#374151"/>

  <!-- Arrow from divide to monthly -->
  <line x1="288" y1="152" x2="312" y2="152" stroke="#374151" stroke-width="2.5"/>
  <polygon points="312,146 324,152 312,158" fill="#374151"/>

  <!-- Twelve monthly set-asides as a row of small coins -->
  <g>
    <!-- row of 12 small green chips, 6 + 6 -->
    <!-- top row -->
    <g fill="#3E9B6B">
      <rect x="336" y="100" width="44" height="40" rx="6"/>
      <rect x="386" y="100" width="44" height="40" rx="6"/>
      <rect x="436" y="100" width="44" height="40" rx="6"/>
      <rect x="486" y="100" width="44" height="40" rx="6"/>
      <rect x="536" y="100" width="44" height="40" rx="6"/>
      <rect x="586" y="100" width="44" height="40" rx="6"/>
    </g>
    <!-- bottom row -->
    <g fill="#3E9B6B">
      <rect x="336" y="150" width="44" height="40" rx="6"/>
      <rect x="386" y="150" width="44" height="40" rx="6"/>
      <rect x="436" y="150" width="44" height="40" rx="6"/>
      <rect x="486" y="150" width="44" height="40" rx="6"/>
      <rect x="536" y="150" width="44" height="40" rx="6"/>
      <rect x="586" y="150" width="44" height="40" rx="6"/>
    </g>
    <!-- $50 labels -->
    <g fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">
      <text x="358" y="125">$50</text>
      <text x="408" y="125">$50</text>
      <text x="458" y="125">$50</text>
      <text x="508" y="125">$50</text>
      <text x="558" y="125">$50</text>
      <text x="608" y="125">$50</text>
      <text x="358" y="175">$50</text>
      <text x="408" y="175">$50</text>
      <text x="458" y="175">$50</text>
      <text x="508" y="175">$50</text>
      <text x="558" y="175">$50</text>
      <text x="608" y="175">$50</text>
    </g>
  </g>
  <text x="483" y="210" text-anchor="middle" font-size="13" fill="#374151">$50 set aside each month, 12 months</text>

  <!-- Bottom timeline showing money ready when bill lands -->
  <line x1="40" y1="272" x2="600" y2="272" stroke="#E5E7EB" stroke-width="3"/>
  <g fill="#3E9B6B">
    <circle cx="70" cy="272" r="6"/>
    <circle cx="118" cy="272" r="6"/>
    <circle cx="166" cy="272" r="6"/>
    <circle cx="214" cy="272" r="6"/>
    <circle cx="262" cy="272" r="6"/>
    <circle cx="310" cy="272" r="6"/>
    <circle cx="358" cy="272" r="6"/>
    <circle cx="406" cy="272" r="6"/>
    <circle cx="454" cy="272" r="6"/>
    <circle cx="502" cy="272" r="6"/>
    <circle cx="550" cy="272" r="6"/>
  </g>
  <!-- month 12: bill lands -->
  <circle cx="598" cy="272" r="11" fill="#C4683A"/>
  <text x="598" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">!</text>

  <text x="70" y="300" text-anchor="middle" font-size="11" fill="#374151">Month 1</text>
  <text x="598" y="300" text-anchor="middle" font-size="11" fill="#C4683A" font-weight="bold">Bill lands</text>
  <text x="320" y="330" text-anchor="middle" font-size="13" fill="#141B5C">By the time the $600 bill arrives, the money is already saved.</text>
</svg>
