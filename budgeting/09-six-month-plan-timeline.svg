<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="A six-month money plan timeline. A goal of one thousand dollars is reached by setting aside about one hundred sixty-seven dollars each month, with a milestone marked at month three for a halfway review and the goal reached at month six.">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#141B5C">A Six-Month Money Plan</text>
  <text x="380" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Goal: $1,000 starter emergency fund, about $167 set aside each month</text>

  <!-- baseline track -->
  <line x1="70" y1="250" x2="690" y2="250" stroke="#E5E7EB" stroke-width="4"/>
  <!-- progress fill -->
  <line x1="70" y1="250" x2="690" y2="250" stroke="#3E9B6B" stroke-width="4"/>
  <polygon points="690,242 706,250 690,258" fill="#3E9B6B"/>

  <!-- month markers -->
  <!-- Month 1 -->
  <circle cx="70" cy="250" r="11" fill="#1E2A8E"/>
  <text x="70" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Month 1</text>
  <text x="70" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">$167</text>

  <!-- Month 2 -->
  <circle cx="194" cy="250" r="11" fill="#1E2A8E"/>
  <text x="194" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Month 2</text>
  <text x="194" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">$334</text>

  <!-- Month 3 milestone -->
  <circle cx="318" cy="250" r="16" fill="#D4AF37"/>
  <text x="318" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Month 3</text>
  <text x="318" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">$501</text>
  <rect x="246" y="120" width="144" height="58" rx="8" fill="#D4AF37"/>
  <text x="318" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#141B5C">Halfway review</text>
  <text x="318" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#141B5C">check and adjust</text>
  <line x1="318" y1="178" x2="318" y2="234" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Month 4 -->
  <circle cx="442" cy="250" r="11" fill="#1E2A8E"/>
  <text x="442" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Month 4</text>
  <text x="442" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">$668</text>

  <!-- Month 5 -->
  <circle cx="566" cy="250" r="11" fill="#1E2A8E"/>
  <text x="566" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Month 5</text>
  <text x="566" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">$835</text>

  <!-- Month 6 goal -->
  <circle cx="690" cy="250" r="16" fill="#3E9B6B"/>
  <text x="690" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#141B5C">Month 6</text>
  <text x="690" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">$1,000</text>
  <rect x="612" y="120" width="150" height="58" rx="8" fill="#3E9B6B"/>
  <text x="687" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Goal reached</text>
  <text x="687" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">fund is funded</text>
  <line x1="690" y1="178" x2="690" y2="234" stroke="#3E9B6B" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="380" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">One goal, one monthly amount, a check at the halfway point, and a dated finish line.</text>
</svg>
