<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Arial, sans-serif" role="img" aria-label="A money map: all income at the top flows down and splits into two buckets, fixed expenses that stay the same each month and flexible spending that you control.">
  <rect x="0" y="0" width="600" height="440" fill="#FFFFFF"/>

  <!-- Income band -->
  <rect x="150" y="24" width="300" height="64" rx="10" fill="#1E2A8E"/>
  <text x="300" y="52" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">INCOME</text>
  <text x="300" y="74" fill="#D4AF37" font-size="13" text-anchor="middle">Everything coming in this month</text>

  <!-- Flow connectors -->
  <path d="M300 88 L300 116" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M300 116 L185 116 L185 150" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M300 116 L415 116 L415 150" stroke="#374151" stroke-width="2" fill="none"/>
  <!-- arrowheads -->
  <path d="M185 150 l-6 -10 l12 0 z" fill="#374151"/>
  <path d="M415 150 l-6 -10 l12 0 z" fill="#374151"/>

  <!-- Fixed bucket -->
  <rect x="40" y="156" width="250" height="244" rx="12" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <rect x="40" y="156" width="250" height="46" rx="12" fill="#3E9B6B"/>
  <rect x="40" y="186" width="250" height="16" fill="#3E9B6B"/>
  <text x="165" y="186" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">FIXED</text>
  <text x="165" y="222" fill="#141B5C" font-size="12" text-anchor="middle">Same amount every month</text>

  <text x="64" y="252" fill="#374151" font-size="13">Rent or mortgage</text>
  <text x="64" y="278" fill="#374151" font-size="13">Utilities and phone</text>
  <text x="64" y="304" fill="#374151" font-size="13">Insurance</text>
  <text x="64" y="330" fill="#374151" font-size="13">Loan and car payments</text>
  <text x="64" y="356" fill="#374151" font-size="13">Subscriptions</text>
  <line x1="64" y1="372" x2="266" y2="372" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="392" fill="#141B5C" font-size="13" font-weight="bold">Total fixed</text>

  <!-- Flexible bucket -->
  <rect x="310" y="156" width="250" height="244" rx="12" fill="#FFFFFF" stroke="#C4683A" stroke-width="2.5"/>
  <rect x="310" y="156" width="250" height="46" rx="12" fill="#C4683A"/>
  <rect x="310" y="186" width="250" height="16" fill="#C4683A"/>
  <text x="435" y="186" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">FLEXIBLE</text>
  <text x="435" y="222" fill="#141B5C" font-size="12" text-anchor="middle">Spending you control</text>

  <text x="334" y="252" fill="#374151" font-size="13">Food and groceries</text>
  <text x="334" y="278" fill="#374151" font-size="13">Transport and gas</text>
  <text x="334" y="304" fill="#374151" font-size="13">Fun and eating out</text>
  <text x="334" y="330" fill="#374151" font-size="13">Personal</text>
  <text x="334" y="356" fill="#374151" font-size="13">Misc</text>
  <line x1="334" y1="372" x2="536" y2="372" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="334" y="392" fill="#141B5C" font-size="13" font-weight="bold">Total flexible</text>

  <!-- Caption strip -->
  <text x="300" y="426" fill="#374151" font-size="12" text-anchor="middle" font-style="italic">Every dollar of income lands in one of these two buckets.</text>
</svg>
