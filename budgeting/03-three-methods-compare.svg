<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Three Budgeting Methods at a Glance</text>

  <!-- 50/30/20 card -->
  <rect x="24" y="60" width="208" height="320" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="24" y="60" width="208" height="46" rx="10" fill="#1E2A8E"/>
  <rect x="24" y="86" width="208" height="20" fill="#1E2A8E"/>
  <text x="128" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">50 / 30 / 20</text>
  <!-- proportion bar -->
  <rect x="48" y="124" width="160" height="22" fill="#1E2A8E"/>
  <rect x="48" y="124" width="80" height="22" fill="#1E2A8E"/>
  <rect x="128" y="124" width="48" height="22" fill="#3E9B6B"/>
  <rect x="176" y="124" width="32" height="22" fill="#D4AF37"/>
  <text x="88" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">50%</text>
  <text x="152" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">30%</text>
  <text x="192" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">20%</text>
  <text x="48" y="174" font-size="13" fill="#111827">Needs / Wants /</text>
  <text x="48" y="192" font-size="13" fill="#111827">Savings split</text>
  <text x="48" y="226" font-size="12" fill="#374151">Effort: Low</text>
  <text x="48" y="252" font-size="12" fill="#374151">Tracking: Little</text>
  <text x="48" y="278" font-size="12" fill="#374151">Control: Light</text>
  <text x="48" y="328" font-size="12" font-weight="bold" fill="#1E2A8E">Best for:</text>
  <text x="48" y="348" font-size="12" fill="#111827">Steady income,</text>
  <text x="48" y="365" font-size="12" fill="#111827">wants it simple</text>

  <!-- Zero-based card -->
  <rect x="256" y="60" width="208" height="320" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="256" y="60" width="208" height="46" rx="10" fill="#3E9B6B"/>
  <rect x="256" y="86" width="208" height="20" fill="#3E9B6B"/>
  <text x="360" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Zero-Based</text>
  <!-- every dollar a job -->
  <rect x="280" y="124" width="160" height="22" fill="#3E9B6B"/>
  <text x="360" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Income minus jobs = 0</text>
  <text x="280" y="174" font-size="13" fill="#111827">Every dollar gets</text>
  <text x="280" y="192" font-size="13" fill="#111827">assigned a job</text>
  <text x="280" y="226" font-size="12" fill="#374151">Effort: Higher</text>
  <text x="280" y="252" font-size="12" fill="#374151">Tracking: Regular</text>
  <text x="280" y="278" font-size="12" fill="#374151">Control: Most</text>
  <text x="280" y="328" font-size="12" font-weight="bold" fill="#3E9B6B">Best for:</text>
  <text x="280" y="348" font-size="12" fill="#111827">Wants full</text>
  <text x="280" y="365" font-size="12" fill="#111827">control of money</text>

  <!-- Envelope card -->
  <rect x="488" y="60" width="208" height="320" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <rect x="488" y="60" width="208" height="46" rx="10" fill="#C4683A"/>
  <rect x="488" y="86" width="208" height="20" fill="#C4683A"/>
  <text x="592" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Envelopes</text>
  <!-- envelope icon -->
  <rect x="512" y="120" width="64" height="40" rx="3" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <path d="M512 122 L544 144 L576 122" fill="none" stroke="#C4683A" stroke-width="2"/>
  <text x="592" y="138" font-size="12" fill="#111827">One pile per</text>
  <text x="592" y="155" font-size="12" fill="#111827">category</text>
  <text x="512" y="186" font-size="13" fill="#111827">Empty = you stop</text>
  <text x="512" y="226" font-size="12" fill="#374151">Effort: Medium</text>
  <text x="512" y="252" font-size="12" fill="#374151">Tracking: Built in</text>
  <text x="512" y="278" font-size="12" fill="#374151">Control: Hard stop</text>
  <text x="512" y="328" font-size="12" font-weight="bold" fill="#C4683A">Best for:</text>
  <text x="512" y="348" font-size="12" fill="#111827">Chronic</text>
  <text x="512" y="365" font-size="12" fill="#111827">overspenders</text>
</svg>
