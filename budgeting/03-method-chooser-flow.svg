<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Method Chooser</text>

  <!-- Q1 -->
  <rect x="230" y="56" width="260" height="56" rx="8" fill="#141B5C"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Do you overspend almost</text>
  <text x="360" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">every month?</text>

  <!-- Q1 YES line to envelopes -->
  <path d="M490 84 L600 84 L600 150" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="600,150 595,140 605,140" fill="#374151"/>
  <text x="545" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">YES</text>

  <!-- Q1 NO line down to Q2 -->
  <path d="M360 112 L360 150" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="360,150 355,140 365,140" fill="#374151"/>
  <text x="376" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">NO</text>

  <!-- Envelopes result (top right) -->
  <rect x="528" y="150" width="144" height="64" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="600" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">Envelopes</text>
  <text x="600" y="198" text-anchor="middle" font-size="11" fill="#111827">Empty pile = stop</text>

  <!-- Q2 -->
  <rect x="230" y="150" width="260" height="56" rx="8" fill="#141B5C"/>
  <text x="360" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Is your income steady, and you</text>
  <text x="360" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">want low effort?</text>

  <!-- Q2 YES line to 50/30/20 -->
  <path d="M230 178 L120 178 L120 244" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="120,244 115,234 125,234" fill="#374151"/>
  <text x="175" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">YES</text>

  <!-- 50/30/20 result -->
  <rect x="48" y="244" width="144" height="64" rx="8" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="120" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A8E">50 / 30 / 20</text>
  <text x="120" y="292" text-anchor="middle" font-size="11" fill="#111827">Simple percentages</text>

  <!-- Q2 NO line down to Q3 -->
  <path d="M360 206 L360 244" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="360,244 355,234 365,234" fill="#374151"/>
  <text x="376" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">NO</text>

  <!-- Q3 -->
  <rect x="230" y="244" width="260" height="56" rx="8" fill="#141B5C"/>
  <text x="360" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Do you want full control of</text>
  <text x="360" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">every dollar?</text>

  <!-- Q3 YES line to zero-based -->
  <path d="M360 300 L360 344" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="360,344 355,334 365,334" fill="#374151"/>
  <text x="376" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">YES</text>

  <!-- Zero-based result -->
  <rect x="288" y="344" width="144" height="64" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="360" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E9B6B">Zero-Based</text>
  <text x="360" y="392" text-anchor="middle" font-size="11" fill="#111827">Every dollar a job</text>

  <text x="360" y="438" text-anchor="middle" font-size="12" fill="#374151">Still unsure? Start with 50/30/20. You can switch any month.</text>
</svg>
