<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="A paycheck flows into one income account, which splits into three accounts: bills, spending, and savings">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>

  <!-- Paycheck -->
  <rect x="290" y="24" width="180" height="56" rx="8" fill="#141B5C"/>
  <text x="380" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Your Paycheck</text>
  <text x="380" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37">lands here every payday</text>

  <!-- Arrow paycheck to income account -->
  <line x1="380" y1="80" x2="380" y2="120" stroke="#374151" stroke-width="2.5"/>
  <polygon points="380,128 374,116 386,116" fill="#374151"/>

  <!-- Income / checking account -->
  <rect x="270" y="128" width="220" height="56" rx="8" fill="#1E2A8E"/>
  <text x="380" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Main Account</text>
  <text x="380" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">paycheck arrives, then splits</text>

  <!-- Splitting lines -->
  <line x1="380" y1="184" x2="380" y2="208" stroke="#374151" stroke-width="2.5"/>
  <line x1="140" y1="208" x2="620" y2="208" stroke="#374151" stroke-width="2.5"/>
  <line x1="140" y1="208" x2="140" y2="248" stroke="#374151" stroke-width="2.5"/>
  <line x1="380" y1="208" x2="380" y2="248" stroke="#374151" stroke-width="2.5"/>
  <line x1="620" y1="208" x2="620" y2="248" stroke="#374151" stroke-width="2.5"/>
  <polygon points="140,256 134,244 146,244" fill="#374151"/>
  <polygon points="380,256 374,244 386,244" fill="#374151"/>
  <polygon points="620,256 614,244 626,244" fill="#374151"/>

  <!-- Bills account -->
  <rect x="40" y="256" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="3"/>
  <rect x="40" y="256" width="200" height="34" rx="10" fill="#C4683A"/>
  <text x="140" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Bills Account</text>
  <text x="140" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">rent, utilities, phone,</text>
  <text x="140" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">insurance, loans</text>
  <text x="140" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C4683A">autopay runs from here</text>

  <!-- Spending account -->
  <rect x="280" y="256" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="3"/>
  <rect x="280" y="256" width="200" height="34" rx="10" fill="#3E9B6B"/>
  <text x="380" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Spending Account</text>
  <text x="380" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">groceries, gas, eating</text>
  <text x="380" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">out, fun</text>
  <text x="380" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3E9B6B">you spend by hand here</text>

  <!-- Savings account -->
  <rect x="520" y="256" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="3"/>
  <rect x="520" y="256" width="200" height="34" rx="10" fill="#D4AF37"/>
  <text x="620" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#141B5C">Savings Account</text>
  <text x="620" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">starter buffer and</text>
  <text x="620" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">sinking funds</text>
  <text x="620" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#B8941F">grows on autopilot</text>
</svg>
