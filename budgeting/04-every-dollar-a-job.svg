<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#FFFFFF"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Give Every Dollar a Job</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#374151">Income flows down through categories until what is left equals zero</text>

  <!-- Income bar at top -->
  <rect x="200" y="68" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="320" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Take-home income</text>
  <text x="320" y="107" text-anchor="middle" font-size="13" fill="#D4AF37" font-weight="bold">$3,200</text>

  <!-- connector -->
  <line x1="320" y1="114" x2="320" y2="134" stroke="#374151" stroke-width="2"/>
  <polygon points="320,140 314,130 326,130" fill="#374151"/>

  <!-- Category rows: label left, running balance right -->
  <!-- Row 1: Fixed bills -->
  <rect x="120" y="146" width="300" height="38" rx="5" fill="#141B5C"/>
  <text x="135" y="170" font-size="13" font-weight="bold" fill="#FFFFFF">1. Fixed bills</text>
  <text x="408" y="170" text-anchor="end" font-size="13" fill="#FFFFFF">- $1,750</text>
  <rect x="430" y="146" width="110" height="38" rx="5" fill="#E5E7EB"/>
  <text x="485" y="164" text-anchor="middle" font-size="10" fill="#374151">left to assign</text>
  <text x="485" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">$1,450</text>

  <!-- Row 2: Essentials -->
  <rect x="120" y="192" width="300" height="38" rx="5" fill="#3E9B6B"/>
  <text x="135" y="216" font-size="13" font-weight="bold" fill="#FFFFFF">2. Essentials (food, gas)</text>
  <text x="408" y="216" text-anchor="end" font-size="13" fill="#FFFFFF">- $620</text>
  <rect x="430" y="192" width="110" height="38" rx="5" fill="#E5E7EB"/>
  <text x="485" y="210" text-anchor="middle" font-size="10" fill="#374151">left to assign</text>
  <text x="485" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">$830</text>

  <!-- Row 3: Savings & goals -->
  <rect x="120" y="238" width="300" height="38" rx="5" fill="#D4AF37"/>
  <text x="135" y="262" font-size="13" font-weight="bold" fill="#141B5C">3. Savings &amp; goals</text>
  <text x="408" y="262" text-anchor="end" font-size="13" fill="#141B5C">- $400</text>
  <rect x="430" y="238" width="110" height="38" rx="5" fill="#E5E7EB"/>
  <text x="485" y="256" text-anchor="middle" font-size="10" fill="#374151">left to assign</text>
  <text x="485" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">$430</text>

  <!-- Row 4: Wants -->
  <rect x="120" y="284" width="300" height="38" rx="5" fill="#C4683A"/>
  <text x="135" y="308" font-size="13" font-weight="bold" fill="#FFFFFF">4. Wants (fun, misc)</text>
  <text x="408" y="308" text-anchor="end" font-size="13" fill="#FFFFFF">- $430</text>
  <rect x="430" y="284" width="110" height="38" rx="5" fill="#E5E7EB"/>
  <text x="485" y="302" text-anchor="middle" font-size="10" fill="#374151">left to assign</text>
  <text x="485" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">$0</text>

  <!-- connector to zero -->
  <line x1="320" y1="322" x2="320" y2="346" stroke="#374151" stroke-width="2"/>
  <polygon points="320,352 314,342 326,342" fill="#374151"/>

  <!-- Zero result -->
  <rect x="220" y="358" width="200" height="48" rx="8" fill="#3E9B6B"/>
  <text x="320" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Left to assign</text>
  <text x="320" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">$0  the plan is done</text>

  <text x="320" y="440" text-anchor="middle" font-size="12" fill="#374151">$3,200 income  minus  every category  =  $0</text>
</svg>
