<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="A repeating monthly cycle: four weekly 10-minute check-ins around the loop, closed by one monthly reset that starts the next month.">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#141B5C">The Money Routine: Four Check-Ins, One Reset</text>

  <!-- guiding loop -->
  <circle cx="360" cy="248" r="150" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 7"/>

  <!-- arrowheads on the loop showing clockwise flow -->
  <polygon points="510,242 520,248 510,254" fill="#374151"/>
  <polygon points="366,98 360,88 354,98" fill="#374151"/>
  <polygon points="210,254 200,248 210,242" fill="#374151"/>
  <polygon points="354,398 360,408 366,398" fill="#374151"/>

  <!-- Week 1 (top) -->
  <circle cx="360" cy="98" r="46" fill="#1E2A8E"/>
  <text x="360" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Week 1</text>
  <text x="360" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">10-min check</text>

  <!-- Week 2 (right) -->
  <circle cx="510" cy="248" r="46" fill="#1E2A8E"/>
  <text x="510" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Week 2</text>
  <text x="510" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">10-min check</text>

  <!-- Week 3 (bottom) -->
  <circle cx="360" cy="398" r="46" fill="#1E2A8E"/>
  <text x="360" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Week 3</text>
  <text x="360" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">10-min check</text>

  <!-- Week 4 (left) -->
  <circle cx="210" cy="248" r="46" fill="#1E2A8E"/>
  <text x="210" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Week 4</text>
  <text x="210" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">10-min check</text>

  <!-- center: monthly reset -->
  <circle cx="360" cy="248" r="58" fill="#D4AF37"/>
  <text x="360" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#141B5C">Monthly</text>
  <text x="360" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#141B5C">Reset</text>
  <text x="360" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#141B5C">start fresh</text>

  <!-- reset feeds back to week 1 -->
  <path d="M360 190 L360 150" fill="none" stroke="#3E9B6B" stroke-width="3"/>
  <polygon points="354,152 360,142 366,152" fill="#3E9B6B"/>

  <text x="360" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Four quick check-ins through the month, then one reset starts the loop again.</text>
</svg>
