<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The 30-day founding-client plan</text>

  <!-- Week cards -->
  <!-- Week 1 -->
  <rect x="24" y="70" width="138" height="120" rx="10" fill="#1E2A8E"/>
  <text x="93" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">WEEK 1</text>
  <text x="93" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Announce to</text>
  <text x="93" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">your network</text>
  <text x="93" y="166" text-anchor="middle" font-size="11" fill="#C7CCEA">Write the message,</text>
  <text x="93" y="181" text-anchor="middle" font-size="11" fill="#C7CCEA">list fifty people</text>

  <!-- Week 2 -->
  <rect x="178" y="70" width="138" height="120" rx="10" fill="#1E2A8E"/>
  <text x="247" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">WEEK 2</text>
  <text x="247" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Send personal</text>
  <text x="247" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">messages</text>
  <text x="247" y="166" text-anchor="middle" font-size="11" fill="#C7CCEA">One at a time,</text>
  <text x="247" y="181" text-anchor="middle" font-size="11" fill="#C7CCEA">a handful a day</text>

  <!-- Week 3 -->
  <rect x="332" y="70" width="138" height="120" rx="10" fill="#1E2A8E"/>
  <text x="401" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">WEEK 3</text>
  <text x="401" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Run discovery</text>
  <text x="401" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">calls</text>
  <text x="401" y="166" text-anchor="middle" font-size="11" fill="#C7CCEA">Each yes books a</text>
  <text x="401" y="181" text-anchor="middle" font-size="11" fill="#C7CCEA">structured fit check</text>

  <!-- Week 4 -->
  <rect x="486" y="70" width="138" height="120" rx="10" fill="#1E2A8E"/>
  <text x="555" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">WEEK 4</text>
  <text x="555" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Ask for</text>
  <text x="555" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">referrals</text>
  <text x="555" y="166" text-anchor="middle" font-size="11" fill="#C7CCEA">"Who is one person</text>
  <text x="555" y="181" text-anchor="middle" font-size="11" fill="#C7CCEA">you know?"</text>

  <!-- connecting arrows between weeks -->
  <polygon points="164,130 178,130 171,123 171,137" fill="#D4AF37"/>
  <polygon points="318,130 332,130 325,123 325,137" fill="#D4AF37"/>
  <polygon points="472,130 486,130 479,123 479,137" fill="#D4AF37"/>

  <!-- pipeline counter feed -->
  <line x1="320" y1="200" x2="320" y2="234" stroke="#374151" stroke-width="2"/>
  <polygon points="312,230 328,230 320,246" fill="#374151"/>

  <!-- Pipeline counter -->
  <rect x="60" y="256" width="520" height="80" rx="10" fill="#ffffff" stroke="#141B5C" stroke-width="2"/>
  <text x="320" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Track the pipeline</text>
  <text x="124" y="316" text-anchor="middle" font-size="12" fill="#111827">messaged</text>
  <text x="206" y="316" text-anchor="middle" font-size="13" fill="#374151">&#8594;</text>
  <text x="262" y="316" text-anchor="middle" font-size="12" fill="#111827">replied</text>
  <text x="330" y="316" text-anchor="middle" font-size="13" fill="#374151">&#8594;</text>
  <text x="392" y="316" text-anchor="middle" font-size="12" fill="#111827">booked a call</text>
  <text x="478" y="316" text-anchor="middle" font-size="13" fill="#374151">&#8594;</text>
  <text x="528" y="316" text-anchor="middle" font-size="12" fill="#111827">signed</text>

  <!-- arrow to outcome -->
  <line x1="320" y1="338" x2="320" y2="368" stroke="#374151" stroke-width="2"/>
  <polygon points="312,364 328,364 320,380" fill="#374151"/>

  <!-- Outcome -->
  <rect x="180" y="386" width="280" height="44" rx="22" fill="#3E9B6B"/>
  <text x="320" y="414" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Your first three clients</text>
</svg>
