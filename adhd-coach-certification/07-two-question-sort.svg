<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The two-question sort</text>

  <!-- task in -->
  <rect x="40" y="190" width="120" height="56" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
  <text x="100" y="216" text-anchor="middle" font-size="14" fill="#111827">a task</text>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#374151">from the list</text>

  <line x1="160" y1="218" x2="196" y2="218" stroke="#374151" stroke-width="2"/>
  <path d="M196 218 l-9 -5 v10 z" fill="#374151"/>

  <!-- Q1 -->
  <rect x="200" y="120" width="200" height="60" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="300" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">Q1: What breaks</text>
  <text x="300" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">if this waits a week?</text>

  <!-- Q2 -->
  <rect x="200" y="256" width="200" height="60" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="300" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">Q2: Who is</text>
  <text x="300" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">waiting on me?</text>

  <line x1="160" y1="218" x2="180" y2="218" stroke="#374151" stroke-width="2"/>
  <path d="M180 150 v136" stroke="#374151" stroke-width="2" fill="none"/>
  <line x1="180" y1="150" x2="200" y2="150" stroke="#374151" stroke-width="2"/>
  <line x1="180" y1="286" x2="200" y2="286" stroke="#374151" stroke-width="2"/>
  <path d="M200 150 l-9 -5 v10 z" fill="#374151"/>
  <path d="M200 286 l-9 -5 v10 z" fill="#374151"/>

  <!-- arrows to buckets -->
  <line x1="400" y1="150" x2="488" y2="86" stroke="#374151" stroke-width="2"/>
  <path d="M488 86 l-3 -10 -7 6 z" fill="#374151"/>
  <line x1="400" y1="218" x2="488" y2="218" stroke="#374151" stroke-width="2"/>
  <path d="M488 218 l-9 -5 v10 z" fill="#374151"/>
  <line x1="400" y1="286" x2="488" y2="352" stroke="#374151" stroke-width="2"/>
  <path d="M488 352 l-10 3 7 6 z" fill="#374151"/>

  <!-- NOW bucket -->
  <rect x="492" y="58" width="196" height="70" rx="10" fill="#C4683A"/>
  <text x="590" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">NOW</text>
  <text x="590" y="108" text-anchor="middle" font-size="12" fill="#ffffff">today &#183; cap of 3</text>

  <!-- THIS WEEK bucket -->
  <rect x="492" y="183" width="196" height="70" rx="10" fill="#1E2A8E"/>
  <text x="590" y="211" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">THIS WEEK</text>
  <text x="590" y="233" text-anchor="middle" font-size="12" fill="#ffffff">real, but not today</text>

  <!-- PARKED bucket -->
  <rect x="492" y="318" width="196" height="70" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <text x="590" y="346" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">PARKED</text>
  <text x="590" y="368" text-anchor="middle" font-size="12" fill="#374151">loud but breaks nothing</text>

  <text x="360" y="424" text-anchor="middle" font-size="12" fill="#374151" font-style="italic">Run it out loud, one task at a time. Now never exceeds three.</text>
</svg>
