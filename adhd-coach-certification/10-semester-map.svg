<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
  <rect width="640" height="380" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#141B5C">The Semester Map</text>
  <text x="30" y="56" font-size="13" fill="#374151">Five syllabi merged into one visible timeline in week one.</text>

  <!-- Course legend -->
  <rect x="30" y="74" width="14" height="14" fill="#1E2A8E"/>
  <text x="50" y="86" font-size="11.5" fill="#374151">Bio</text>
  <rect x="100" y="74" width="14" height="14" fill="#3E9B6B"/>
  <text x="120" y="86" font-size="11.5" fill="#374151">History</text>
  <rect x="186" y="74" width="14" height="14" fill="#C4683A"/>
  <text x="206" y="86" font-size="11.5" fill="#374151">English</text>
  <rect x="272" y="74" width="14" height="14" fill="#7A4FA3"/>
  <text x="292" y="86" font-size="11.5" fill="#374151">Stats</text>
  <rect x="340" y="74" width="14" height="14" fill="#D4AF37"/>
  <text x="360" y="86" font-size="11.5" fill="#374151">Psych</text>

  <!-- Timeline baseline -->
  <line x1="40" y1="300" x2="610" y2="300" stroke="#141B5C" stroke-width="2"/>

  <!-- Week ticks and labels (weeks 1-15) -->
  <!-- spacing: x = 40 + (week-1)*40.7 -->
  <g font-size="10" fill="#6B7280" text-anchor="middle">
    <line x1="40"  y1="300" x2="40"  y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="40"  y="322">1</text>
    <line x1="81"  y1="300" x2="81"  y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="81"  y="322">2</text>
    <line x1="122" y1="300" x2="122" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="122" y="322">3</text>
    <line x1="163" y1="300" x2="163" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="163" y="322">4</text>
    <line x1="204" y1="300" x2="204" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="204" y="322">5</text>
    <line x1="244" y1="300" x2="244" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="244" y="322">6</text>
    <line x1="285" y1="300" x2="285" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="285" y="322">7</text>
    <line x1="326" y1="300" x2="326" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="326" y="322">8</text>
    <line x1="367" y1="300" x2="367" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="367" y="322">9</text>
    <line x1="408" y1="300" x2="408" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="408" y="322">10</text>
    <line x1="448" y1="300" x2="448" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="448" y="322">11</text>
    <line x1="489" y1="300" x2="489" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="489" y="322">12</text>
    <line x1="530" y1="300" x2="530" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="530" y="322">13</text>
    <line x1="571" y1="300" x2="571" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="571" y="322">14</text>
    <line x1="610" y1="300" x2="610" y2="308" stroke="#9CA3AF" stroke-width="1"/><text x="610" y="322">15</text>
  </g>
  <text x="40" y="345" font-size="11" fill="#9CA3AF">Week of semester</text>
  <text x="610" y="345" font-size="11" fill="#9CA3AF" text-anchor="end">Finals</text>

  <!-- Cluster zone: midterms (weeks 7-8) -->
  <rect x="270" y="100" width="78" height="200" fill="#FEF3C7" opacity="0.55"/>
  <text x="309" y="118" font-size="11.5" font-weight="bold" fill="#B45309" text-anchor="middle">MIDTERM</text>
  <text x="309" y="132" font-size="11.5" font-weight="bold" fill="#B45309" text-anchor="middle">CLUSTER</text>

  <!-- Cluster zone: finals (weeks 14-15) -->
  <rect x="555" y="100" width="60" height="200" fill="#FEE2E2" opacity="0.6"/>
  <text x="585" y="118" font-size="11.5" font-weight="bold" fill="#B91C1C" text-anchor="middle">FINALS</text>
  <text x="585" y="132" font-size="11.5" font-weight="bold" fill="#B91C1C" text-anchor="middle">CLUSTER</text>

  <!-- Deadline markers: stacked stems from baseline. Color = course. -->
  <!-- Early scattered deadlines -->
  <line x1="81"  y1="300" x2="81"  y2="270" stroke="#1E2A8E" stroke-width="2"/><circle cx="81"  cy="266" r="5" fill="#1E2A8E"/>
  <line x1="122" y1="300" x2="122" y2="252" stroke="#3E9B6B" stroke-width="2"/><circle cx="122" cy="248" r="5" fill="#3E9B6B"/>
  <line x1="163" y1="300" x2="163" y2="270" stroke="#C4683A" stroke-width="2"/><circle cx="163" cy="266" r="5" fill="#C4683A"/>
  <line x1="204" y1="300" x2="204" y2="252" stroke="#7A4FA3" stroke-width="2"/><circle cx="204" cy="248" r="5" fill="#7A4FA3"/>

  <!-- Midterm cluster: stacked deadlines piling up weeks 7-8 -->
  <line x1="285" y1="300" x2="285" y2="260" stroke="#1E2A8E" stroke-width="2"/><circle cx="285" cy="256" r="5" fill="#1E2A8E"/>
  <line x1="296" y1="300" x2="296" y2="232" stroke="#3E9B6B" stroke-width="2"/><circle cx="296" cy="228" r="5" fill="#3E9B6B"/>
  <line x1="309" y1="300" x2="309" y2="204" stroke="#C4683A" stroke-width="2"/><circle cx="309" cy="200" r="5" fill="#C4683A"/>
  <line x1="322" y1="300" x2="322" y2="232" stroke="#7A4FA3" stroke-width="2"/><circle cx="322" cy="228" r="5" fill="#7A4FA3"/>
  <line x1="333" y1="300" x2="333" y2="260" stroke="#D4AF37" stroke-width="2"/><circle cx="333" cy="256" r="5" fill="#D4AF37"/>

  <!-- Mid-semester scattered -->
  <line x1="408" y1="300" x2="408" y2="252" stroke="#3E9B6B" stroke-width="2"/><circle cx="408" cy="248" r="5" fill="#3E9B6B"/>
  <line x1="489" y1="300" x2="489" y2="270" stroke="#D4AF37" stroke-width="2"/><circle cx="489" cy="266" r="5" fill="#D4AF37"/>

  <!-- Finals cluster: heavy pile-up weeks 14-15 -->
  <line x1="565" y1="300" x2="565" y2="252" stroke="#1E2A8E" stroke-width="2"/><circle cx="565" cy="248" r="5" fill="#1E2A8E"/>
  <line x1="577" y1="300" x2="577" y2="224" stroke="#3E9B6B" stroke-width="2"/><circle cx="577" cy="220" r="5" fill="#3E9B6B"/>
  <line x1="589" y1="300" x2="589" y2="196" stroke="#C4683A" stroke-width="2"/><circle cx="589" cy="192" r="5" fill="#C4683A"/>
  <line x1="601" y1="300" x2="601" y2="224" stroke="#7A4FA3" stroke-width="2"/><circle cx="601" cy="220" r="5" fill="#7A4FA3"/>
  <line x1="595" y1="300" x2="595" y2="168" stroke="#D4AF37" stroke-width="2"/><circle cx="595" cy="164" r="5" fill="#D4AF37"/>

  <text x="320" y="372" font-size="11.5" fill="#374151" text-anchor="middle">The cluster zones — invisible in five separate syllabi — are what blindside the syllabus-blind student.</text>
</svg>
