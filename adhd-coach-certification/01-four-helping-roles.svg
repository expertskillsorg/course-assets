<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Four Helping Roles and the Clinical Line</text>

  <!-- Clinical side label -->
  <text x="150" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">CLINICAL CARE (licensed)</text>
  <!-- Forward-looking side label -->
  <text x="490" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">FORWARD-LOOKING SUPPORT (unlicensed)</text>

  <!-- Hard boundary line -->
  <line x1="300" y1="92" x2="300" y2="350" stroke="#C4683A" stroke-width="4" stroke-dasharray="2 0"/>
  <text x="300" y="372" text-anchor="middle" font-size="12" font-style="italic" fill="#C4683A">the hard line: only clinicians diagnose &amp; treat</text>

  <!-- Therapy card (clinical side) -->
  <rect x="40" y="110" width="220" height="100" rx="10" fill="#141B5C"/>
  <text x="150" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Therapy</text>
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#E5E7EB">Heals conditions</text>
  <text x="150" y="184" text-anchor="middle" font-size="12" fill="#E5E7EB">Backward &amp; inward</text>
  <text x="150" y="202" text-anchor="middle" font-size="12" fill="#D4AF37">Diagnoses &amp; treats</text>

  <!-- Coaching card (highlighted) -->
  <rect x="340" y="110" width="160" height="100" rx="10" fill="#1E2A8E" stroke="#D4AF37" stroke-width="3"/>
  <text x="420" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Coaching</text>
  <text x="420" y="166" text-anchor="middle" font-size="12" fill="#E5E7EB">Builds systems</text>
  <text x="420" y="184" text-anchor="middle" font-size="12" fill="#E5E7EB">Looks forward</text>
  <text x="420" y="202" text-anchor="middle" font-size="12" fill="#D4AF37">Never treats</text>

  <!-- Tutoring card -->
  <rect x="340" y="230" width="160" height="92" rx="10" fill="#3E9B6B"/>
  <text x="420" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Tutoring</text>
  <text x="420" y="286" text-anchor="middle" font-size="12" fill="#FFFFFF">Teaches content</text>
  <text x="420" y="304" text-anchor="middle" font-size="12" fill="#FFFFFF">in one subject</text>

  <!-- Mentoring card -->
  <rect x="520" y="230" width="160" height="92" rx="10" fill="#3E9B6B"/>
  <text x="600" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Mentoring</text>
  <text x="600" y="286" text-anchor="middle" font-size="12" fill="#FFFFFF">Shares a path</text>
  <text x="600" y="304" text-anchor="middle" font-size="12" fill="#FFFFFF">already walked</text>

  <!-- Referral arrow across line -->
  <text x="520" y="150" font-size="12" fill="#374151">When the work is</text>
  <text x="520" y="168" font-size="12" fill="#374151">clinical, refer</text>
  <path d="M515 158 C 360 158, 320 158, 304 158" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
