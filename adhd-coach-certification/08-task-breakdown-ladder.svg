<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Task Breakdown Ladder</text>
  <text x="320" y="60" text-anchor="middle" font-size="13.5" fill="#374151">Climb down from a fog to a single physical first move</text>

  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L5 10 L10 0 z" fill="#1E2A8E"/>
    </marker>
  </defs>

  <!-- Level 1: Project -->
  <rect x="70" y="80" width="500" height="58" rx="10" fill="#141B5C" opacity="0.10" stroke="#141B5C" stroke-width="2"/>
  <text x="92" y="104" font-size="12" font-weight="bold" fill="#1E2A8E">PROJECT</text>
  <text x="92" y="125" font-size="14.5" font-weight="bold" fill="#141B5C">Submit the report</text>

  <line x1="320" y1="138" x2="320" y2="160" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- Level 2: Chunks -->
  <rect x="100" y="162" width="440" height="74" rx="10" fill="#1E2A8E" opacity="0.08" stroke="#1E2A8E" stroke-width="2"/>
  <text x="122" y="184" font-size="12" font-weight="bold" fill="#1E2A8E">CHUNKS</text>
  <text x="122" y="205" font-size="13" fill="#141B5C">Gather receipts &#183; log in to portal &#183; enter each expense</text>
  <text x="122" y="224" font-size="13" fill="#141B5C">&#183; attach images &#183; review &#183; submit</text>

  <line x1="320" y1="236" x2="320" y2="258" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- Level 3: First chunk -->
  <rect x="150" y="260" width="340" height="58" rx="10" fill="#1E2A8E" opacity="0.06" stroke="#1E2A8E" stroke-width="2"/>
  <text x="172" y="284" font-size="12" font-weight="bold" fill="#1E2A8E">FIRST CHUNK</text>
  <text x="172" y="305" font-size="14" fill="#141B5C">Gather the receipts</text>

  <line x1="320" y1="318" x2="320" y2="340" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- Level 4: First physical action -->
  <rect x="200" y="342" width="240" height="74" rx="10" fill="#141B5C" stroke="#141B5C" stroke-width="2"/>
  <text x="320" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#9FB0FF">FIRST PHYSICAL ACTION &#183; UNDER 10 MIN</text>
  <text x="320" y="388" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Pull the receipts envelope</text>
  <text x="320" y="406" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">out of the work bag</text>

  <text x="320" y="446" text-anchor="middle" font-size="12.5" fill="#1E2A8E" font-style="italic">Not "submit the report" &#8212; just pull out the envelope.</text>
</svg>
