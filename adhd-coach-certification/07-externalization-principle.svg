<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- LEFT: internal -->
  <text x="180" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Internal time sense</text>
  <text x="180" y="64" text-anchor="middle" font-size="14" fill="#374151">unreliable, runs in the head</text>

  <!-- head outline -->
  <path d="M180 110 C120 110 100 160 110 210 C116 240 140 256 150 270 L150 300 L210 300 L210 268 C232 250 250 224 250 184 C250 140 230 110 180 110 Z" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
  <!-- foggy clock inside head -->
  <circle cx="180" cy="195" r="46" fill="#ffffff" stroke="#C4683A" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="180" y1="195" x2="180" y2="162" stroke="#C4683A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="180" y1="195" x2="206" y2="206" stroke="#C4683A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <text x="180" y="262" text-anchor="middle" font-size="13" fill="#C4683A" font-style="italic">"it takes a second"</text>

  <!-- arrow -->
  <text x="360" y="190" text-anchor="middle" font-size="34" fill="#3E9B6B" font-weight="bold">&#8594;</text>
  <text x="360" y="222" text-anchor="middle" font-size="13" fill="#374151">replace with</text>

  <!-- RIGHT: external tools -->
  <text x="560" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E2A8E">Visible external tools</text>
  <text x="560" y="64" text-anchor="middle" font-size="14" fill="#374151">time you can see</text>

  <!-- analog clock -->
  <circle cx="470" cy="150" r="44" fill="#ffffff" stroke="#1E2A8E" stroke-width="3"/>
  <line x1="470" y1="150" x2="470" y2="118" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
  <line x1="470" y1="150" x2="495" y2="160" stroke="#1E2A8E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="150" r="4" fill="#1E2A8E"/>
  <text x="470" y="218" text-anchor="middle" font-size="13" fill="#374151">analog clock</text>

  <!-- visual timer wedge -->
  <circle cx="610" cy="150" r="44" fill="#ffffff" stroke="#D4AF37" stroke-width="3"/>
  <path d="M610 150 L610 106 A44 44 0 0 1 648 172 Z" fill="#D4AF37"/>
  <text x="610" y="218" text-anchor="middle" font-size="13" fill="#374151">visual timer</text>

  <!-- calendar with blocks -->
  <rect x="486" y="262" width="148" height="118" rx="6" fill="#ffffff" stroke="#3E9B6B" stroke-width="3"/>
  <rect x="486" y="262" width="148" height="24" rx="6" fill="#3E9B6B"/>
  <text x="560" y="279" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">CALENDAR</text>
  <rect x="498" y="298" width="124" height="16" rx="3" fill="#1E2A8E" opacity="0.85"/>
  <rect x="498" y="322" width="86" height="16" rx="3" fill="#C4683A" opacity="0.85"/>
  <rect x="498" y="346" width="110" height="16" rx="3" fill="#D4AF37"/>
  <text x="560" y="396" text-anchor="middle" font-size="13" fill="#374151">blocked durations</text>
</svg>
