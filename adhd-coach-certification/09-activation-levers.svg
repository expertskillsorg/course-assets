<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Arial, sans-serif">
  <rect width="640" height="560" fill="#ffffff"/>
  <text x="320" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Four Activation Levers as Weekly Systems</text>
  <text x="320" y="64" text-anchor="middle" font-size="14" fill="#374151">Build what activates the brain into the week on purpose</text>

  <!-- Interest -->
  <rect x="40" y="92" width="270" height="150" rx="12" fill="#1E2A8E" opacity="0.06" stroke="#1E2A8E" stroke-width="2"/>
  <text x="64" y="124" font-size="17" font-weight="bold" fill="#141B5C">INTEREST</text>
  <text x="64" y="150" font-size="13" fill="#374151">make the task something the brain</text>
  <text x="64" y="168" font-size="13" fill="#374151">actually wants to lean toward</text>
  <line x1="64" y1="184" x2="286" y2="184" stroke="#1E2A8E" stroke-width="1" opacity="0.3"/>
  <text x="64" y="208" font-size="13.5" font-weight="bold" fill="#1E2A8E">System example</text>
  <text x="64" y="228" font-size="13" fill="#111827">Pair the task with a favorite playlist</text>

  <!-- Novelty -->
  <rect x="330" y="92" width="270" height="150" rx="12" fill="#1E2A8E" opacity="0.06" stroke="#1E2A8E" stroke-width="2"/>
  <text x="354" y="124" font-size="17" font-weight="bold" fill="#141B5C">NOVELTY</text>
  <text x="354" y="150" font-size="13" fill="#374151">keep it fresh so it does not fade</text>
  <text x="354" y="168" font-size="13" fill="#374151">into stale background</text>
  <line x1="354" y1="184" x2="576" y2="184" stroke="#1E2A8E" stroke-width="1" opacity="0.3"/>
  <text x="354" y="208" font-size="13.5" font-weight="bold" fill="#1E2A8E">System example</text>
  <text x="354" y="228" font-size="13" fill="#111827">Rotate the location or working spot</text>

  <!-- Urgency -->
  <rect x="40" y="262" width="270" height="150" rx="12" fill="#1E2A8E" opacity="0.06" stroke="#1E2A8E" stroke-width="2"/>
  <text x="64" y="294" font-size="17" font-weight="bold" fill="#141B5C">URGENCY</text>
  <text x="64" y="320" font-size="13" fill="#374151">give the moment a deadline the</text>
  <text x="64" y="338" font-size="13" fill="#374151">brain can feel</text>
  <line x1="64" y1="354" x2="286" y2="354" stroke="#1E2A8E" stroke-width="1" opacity="0.3"/>
  <text x="64" y="378" font-size="13.5" font-weight="bold" fill="#1E2A8E">System example</text>
  <text x="64" y="398" font-size="13" fill="#111827">A booked deadline with real stakes</text>

  <!-- Social -->
  <rect x="330" y="262" width="270" height="150" rx="12" fill="#1E2A8E" opacity="0.06" stroke="#1E2A8E" stroke-width="2"/>
  <text x="354" y="294" font-size="17" font-weight="bold" fill="#141B5C">SOCIAL</text>
  <text x="354" y="320" font-size="13" fill="#374151">borrow the pull of other people</text>
  <text x="354" y="338" font-size="13" fill="#374151">to get started and stay on</text>
  <line x1="354" y1="354" x2="576" y2="354" stroke="#1E2A8E" stroke-width="1" opacity="0.3"/>
  <text x="354" y="378" font-size="13.5" font-weight="bold" fill="#1E2A8E">System example</text>
  <text x="354" y="398" font-size="13" fill="#111827">A co-working or standing check-in</text>

  <!-- Rotation note -->
  <rect x="40" y="442" width="560" height="78" rx="12" fill="#141B5C"/>
  <text x="320" y="474" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff">Levers wear out, so rotate them</text>
  <text x="320" y="498" text-anchor="middle" font-size="13" fill="#DCE0F2">The deadline that worked last month goes flat and the novel tool becomes</text>
  <text x="320" y="516" text-anchor="middle" font-size="13" fill="#DCE0F2">the boring one. Plan the swap in advance, before a lever stops firing.</text>
</svg>
