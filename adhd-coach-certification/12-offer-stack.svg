<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">From three pieces to one sentence</text>

  <!-- Stacked narrowing layers -->
  <polygon points="120,80 520,80 470,140 170,140" fill="#1E2A8E"/>
  <text x="320" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">NICHE</text>
  <text x="545" y="115" font-size="13" fill="#374151">who you help</text>

  <polygon points="170,150 470,150 430,210 210,210" fill="#3E9B6B"/>
  <text x="320" y="188" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">OFFER</text>
  <text x="545" y="185" font-size="13" fill="#374151">the result you</text>
  <text x="545" y="202" font-size="13" fill="#374151">help them reach</text>

  <polygon points="210,220 430,220 400,280 240,280" fill="#D4AF37"/>
  <text x="320" y="258" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">PACKAGE</text>
  <text x="545" y="255" font-size="13" fill="#374151">what they buy</text>

  <!-- funnel arrow -->
  <line x1="320" y1="288" x2="320" y2="330" stroke="#374151" stroke-width="2"/>
  <polygon points="312,326 328,326 320,342" fill="#374151"/>

  <!-- the sentence -->
  <rect x="60" y="350" width="520" height="86" rx="10" fill="#ffffff" stroke="#141B5C" stroke-width="2"/>
  <text x="320" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">One sentence a buyer understands</text>
  <text x="320" y="406" text-anchor="middle" font-size="13" fill="#111827">"I help [who] who [problem] build [the thing],</text>
  <text x="320" y="424" text-anchor="middle" font-size="13" fill="#111827">so they [result]."</text>
</svg>
