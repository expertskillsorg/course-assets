<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Arial, sans-serif">
  <rect width="720" height="640" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Concern Noticed to Referral Made</text>

  <!-- Start -->
  <rect x="270" y="60" width="180" height="48" rx="24" fill="#1E2A8E"/>
  <text x="360" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">You notice a concern</text>

  <!-- arrow -->
  <line x1="360" y1="108" x2="360" y2="138" stroke="#374151" stroke-width="2"/>
  <polygon points="360,146 354,134 366,134" fill="#374151"/>

  <!-- Decision 1: risk of harm / acute crisis -->
  <polygon points="360,150 510,210 360,270 210,210" fill="#C4683A"/>
  <text x="360" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Risk of harm or</text>
  <text x="360" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">acute crisis?</text>

  <!-- Yes branch -->
  <line x1="510" y1="210" x2="600" y2="210" stroke="#374151" stroke-width="2"/>
  <polygon points="608,210 596,204 596,216" fill="#374151"/>
  <text x="555" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">YES</text>
  <rect x="560" y="178" width="150" height="118" rx="8" fill="#fbeae2" stroke="#C4683A" stroke-width="2"/>
  <text x="635" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">STOP coaching</text>
  <text x="635" y="224" text-anchor="middle" font-size="12" fill="#374151">Follow crisis</text>
  <text x="635" y="240" text-anchor="middle" font-size="12" fill="#374151">protocol</text>
  <text x="635" y="262" text-anchor="middle" font-size="12" fill="#374151">988 / 911 /</text>
  <text x="635" y="278" text-anchor="middle" font-size="12" fill="#374151">local crisis line</text>

  <!-- No branch down -->
  <line x1="360" y1="270" x2="360" y2="300" stroke="#374151" stroke-width="2"/>
  <polygon points="360,308 354,296 366,296" fill="#374151"/>
  <text x="378" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">NO</text>

  <!-- Name the concern -->
  <rect x="255" y="310" width="210" height="48" rx="8" fill="#141B5C"/>
  <text x="360" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Name it calmly with the client</text>

  <line x1="360" y1="358" x2="360" y2="388" stroke="#374151" stroke-width="2"/>
  <polygon points="360,396 354,384 366,384" fill="#374151"/>

  <!-- Decision 2: outside scope -->
  <polygon points="360,400 510,460 360,520 210,460" fill="#D4AF37"/>
  <text x="360" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Outside coaching</text>
  <text x="360" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">scope?</text>

  <!-- Yes: refer -->
  <line x1="510" y1="460" x2="600" y2="460" stroke="#374151" stroke-width="2"/>
  <polygon points="608,460 596,454 596,466" fill="#374151"/>
  <text x="555" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">YES</text>
  <rect x="560" y="428" width="150" height="92" rx="8" fill="#eef5f1" stroke="#3E9B6B" stroke-width="2"/>
  <text x="635" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Warm referral</text>
  <text x="635" y="476" text-anchor="middle" font-size="12" fill="#374151">to a clinician;</text>
  <text x="635" y="492" text-anchor="middle" font-size="12" fill="#374151">coaching may</text>
  <text x="635" y="508" text-anchor="middle" font-size="12" fill="#374151">pause or continue</text>

  <!-- No: keep coaching -->
  <line x1="360" y1="520" x2="360" y2="552" stroke="#374151" stroke-width="2"/>
  <polygon points="360,560 354,548 366,548" fill="#374151"/>
  <text x="378" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">NO</text>
  <rect x="240" y="562" width="240" height="48" rx="8" fill="#3E9B6B"/>
  <text x="360" y="586" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Coachable concern:</text>
  <text x="360" y="603" text-anchor="middle" font-size="13" fill="#ffffff">continue coaching it</text>
</svg>
