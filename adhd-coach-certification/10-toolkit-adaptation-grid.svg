<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#141B5C">Toolkit Adaptation Grid</text>
  <text x="30" y="56" font-size="13" fill="#374151">One principle, re-fitted for the client in front of you.</text>

  <!-- Column headers -->
  <rect x="200" y="74" width="180" height="44" fill="#1E2A8E"/>
  <rect x="384" y="74" width="180" height="44" fill="#3E9B6B"/>
  <rect x="568" y="74" width="162" height="44" fill="#C4683A"/>
  <text x="290" y="101" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Working Adult</text>
  <text x="474" y="101" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">College Student</text>
  <text x="649" y="95" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Parent of</text>
  <text x="649" y="111" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ADHD Child</text>

  <!-- Row label header -->
  <rect x="30" y="74" width="166" height="44" fill="#141B5C"/>
  <text x="113" y="101" font-size="13" font-weight="bold" fill="#D4AF37" text-anchor="middle">Tool</text>

  <!-- Rows -->
  <!-- Row 1: Externalize time -->
  <rect x="30" y="122" width="166" height="78" fill="#E5E7EB"/>
  <text x="40" y="155" font-size="13" font-weight="bold" fill="#111827">Externalize</text>
  <text x="40" y="172" font-size="13" font-weight="bold" fill="#111827">time</text>
  <rect x="200" y="122" width="180" height="78" fill="#F4F5FB"/>
  <text x="210" y="150" font-size="11.5" fill="#374151">Protected calendar</text>
  <text x="210" y="167" font-size="11.5" fill="#374151">blocks + buffers</text>
  <text x="210" y="184" font-size="11.5" fill="#374151">around meetings</text>
  <rect x="384" y="122" width="180" height="78" fill="#EEF7F1"/>
  <text x="394" y="150" font-size="11.5" fill="#374151">All syllabi on one</text>
  <text x="394" y="167" font-size="11.5" fill="#374151">calendar, with</text>
  <text x="394" y="184" font-size="11.5" fill="#374151">start dates</text>
  <rect x="568" y="122" width="162" height="78" fill="#FAF0EA"/>
  <text x="578" y="150" font-size="11.5" fill="#374151">Visible timer for</text>
  <text x="578" y="167" font-size="11.5" fill="#374151">the homework</text>
  <text x="578" y="184" font-size="11.5" fill="#374151">block</text>

  <!-- Row 2: Get started -->
  <rect x="30" y="202" width="166" height="78" fill="#E5E7EB"/>
  <text x="40" y="235" font-size="13" font-weight="bold" fill="#111827">Get started</text>
  <text x="40" y="252" font-size="13" font-weight="bold" fill="#111827">(activation)</text>
  <rect x="200" y="202" width="180" height="78" fill="#F4F5FB"/>
  <text x="210" y="230" font-size="11.5" fill="#374151">First-hour block,</text>
  <text x="210" y="247" font-size="11.5" fill="#374151">door closed, one</text>
  <text x="210" y="264" font-size="11.5" fill="#374151">important task</text>
  <rect x="384" y="202" width="180" height="78" fill="#EEF7F1"/>
  <text x="394" y="230" font-size="11.5" fill="#374151">Library body</text>
  <text x="394" y="247" font-size="11.5" fill="#374151">doubling + task</text>
  <text x="394" y="264" font-size="11.5" fill="#374151">breakdown</text>
  <rect x="568" y="202" width="162" height="78" fill="#FAF0EA"/>
  <text x="578" y="230" font-size="11.5" fill="#374151">Parent sits near</text>
  <text x="578" y="247" font-size="11.5" fill="#374151">as teammate,</text>
  <text x="578" y="264" font-size="11.5" fill="#374151">not enforcer</text>

  <!-- Row 3: Routines -->
  <rect x="30" y="282" width="166" height="78" fill="#E5E7EB"/>
  <text x="40" y="315" font-size="13" font-weight="bold" fill="#111827">Anchored</text>
  <text x="40" y="332" font-size="13" font-weight="bold" fill="#111827">routines</text>
  <rect x="200" y="282" width="180" height="78" fill="#F4F5FB"/>
  <text x="210" y="310" font-size="11.5" fill="#374151">Habits anchored</text>
  <text x="210" y="327" font-size="11.5" fill="#374151">to fixed daily</text>
  <text x="210" y="344" font-size="11.5" fill="#374151">work points</text>
  <rect x="384" y="282" width="180" height="78" fill="#EEF7F1"/>
  <text x="394" y="310" font-size="11.5" fill="#374151">Attached to</text>
  <text x="394" y="327" font-size="11.5" fill="#374151">repeating</text>
  <text x="394" y="344" font-size="11.5" fill="#374151">lectures</text>
  <rect x="568" y="282" width="162" height="78" fill="#FAF0EA"/>
  <text x="578" y="310" font-size="11.5" fill="#374151">Predictable</text>
  <text x="578" y="327" font-size="11.5" fill="#374151">evening</text>
  <text x="578" y="344" font-size="11.5" fill="#374151">sequence</text>

  <!-- Row 4: Scope -->
  <rect x="30" y="362" width="166" height="78" fill="#141B5C"/>
  <text x="40" y="395" font-size="13" font-weight="bold" fill="#D4AF37">Scope of</text>
  <text x="40" y="412" font-size="13" font-weight="bold" fill="#D4AF37">practice</text>
  <rect x="200" y="362" width="180" height="78" fill="#F4F5FB"/>
  <text x="210" y="390" font-size="11.5" fill="#374151">Refer legal /</text>
  <text x="210" y="407" font-size="11.5" fill="#374151">accommodation</text>
  <text x="210" y="424" font-size="11.5" fill="#374151">rulings to HR</text>
  <rect x="384" y="362" width="180" height="78" fill="#EEF7F1"/>
  <text x="394" y="390" font-size="11.5" fill="#374151">Point to</text>
  <text x="394" y="407" font-size="11.5" fill="#374151">disability</text>
  <text x="394" y="424" font-size="11.5" fill="#374151">services office</text>
  <rect x="568" y="362" width="162" height="78" fill="#FAF0EA"/>
  <text x="578" y="390" font-size="11.5" fill="#374151">Refer child to</text>
  <text x="578" y="407" font-size="11.5" fill="#374151">clinicians and</text>
  <text x="578" y="424" font-size="11.5" fill="#374151">the school</text>
</svg>
