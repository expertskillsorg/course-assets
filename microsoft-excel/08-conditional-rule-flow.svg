<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">How a conditional rule flags exceptions</text>

  <!-- Left column: incoming values -->
  <text x="95" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Days on Market</text>
  <g font-size="14" fill="#111827">
    <rect x="40" y="86" width="110" height="34" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="95" y="108" text-anchor="middle">18</text>
    <rect x="40" y="126" width="110" height="34" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="95" y="148" text-anchor="middle">74</text>
    <rect x="40" y="166" width="110" height="34" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="95" y="188" text-anchor="middle">41</text>
    <rect x="40" y="206" width="110" height="34" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="95" y="228" text-anchor="middle">92</text>
    <rect x="40" y="246" width="110" height="34" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="95" y="268" text-anchor="middle">7</text>
  </g>

  <!-- Arrows into the rule -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M150 103 L250 175"/>
    <path d="M150 143 L250 183"/>
    <path d="M150 183 L250 190"/>
    <path d="M150 223 L250 197"/>
    <path d="M150 263 L250 205"/>
  </g>

  <!-- Rule box -->
  <rect x="250" y="150" width="150" height="80" rx="8" fill="#1E2A8E"/>
  <text x="325" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">RULE</text>
  <text x="325" y="204" text-anchor="middle" font-size="13" fill="#D4AF37">value &gt; 60 ?</text>

  <!-- Pass arrow -->
  <path d="M400 175 L490 120" stroke="#C4683A" stroke-width="2.5" fill="none" marker-end="url(#head)"/>
  <text x="455" y="128" font-size="12" fill="#C4683A" font-weight="bold">passes</text>

  <!-- Fail arrow -->
  <path d="M400 205 L490 265" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#headgray)"/>
  <text x="452" y="252" font-size="12" fill="#374151">fails</text>

  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#C4683A"/></marker>
    <marker id="headgray" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#374151"/></marker>
  </defs>

  <!-- Flagged output -->
  <rect x="500" y="92" width="110" height="34" rx="4" fill="#C4683A"/>
  <text x="555" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">74</text>
  <rect x="500" y="132" width="110" height="34" rx="4" fill="#C4683A"/>
  <text x="555" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">92</text>
  <text x="555" y="184" text-anchor="middle" font-size="12" fill="#C4683A" font-weight="bold">highlighted</text>

  <!-- Unchanged output -->
  <rect x="500" y="238" width="110" height="34" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="555" y="260" text-anchor="middle" font-size="14" fill="#111827">18 · 41 · 7</text>
  <text x="555" y="290" text-anchor="middle" font-size="12" fill="#374151">left unchanged</text>

  <!-- Loop note -->
  <path d="M555 300 C555 340, 95 340, 95 300" stroke="#3E9B6B" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#headgreen)"/>
  <marker id="headgreen" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3E9B6B"/></marker>
  <text x="325" y="360" text-anchor="middle" font-size="13" fill="#3E9B6B" font-weight="bold">re-checks automatically whenever a value changes</text>
</svg>
