<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">One IF, one test, two possible answers</text>

  <!-- Input cell -->
  <rect x="30" y="140" width="150" height="60" rx="6" fill="#1E2A8E"/>
  <text x="105" y="166" text-anchor="middle" font-size="13" fill="#ffffff">Start Date in B2</text>
  <text x="105" y="186" text-anchor="middle" font-size="12" fill="#D4AF37">is it filled in?</text>

  <!-- Diamond test -->
  <polygon points="320,120 400,170 320,220 240,170" fill="#ffffff" stroke="#C4683A" stroke-width="2.5"/>
  <text x="320" y="165" text-anchor="middle" font-size="12" fill="#111827">The test:</text>
  <text x="320" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">B2 &gt; 0 ?</text>

  <!-- arrow input to diamond -->
  <line x1="180" y1="170" x2="238" y2="170" stroke="#374151" stroke-width="2"/>
  <polygon points="238,170 228,165 228,175" fill="#374151"/>

  <!-- TRUE branch -->
  <line x1="400" y1="170" x2="480" y2="115" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="480,115 469,117 474,126" fill="#3E9B6B"/>
  <rect x="480" y="88" width="140" height="54" rx="6" fill="#3E9B6B"/>
  <text x="550" y="110" text-anchor="middle" font-size="12" fill="#ffffff">TRUE returns</text>
  <text x="550" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">"Complete"</text>
  <text x="437" y="130" text-anchor="middle" font-size="11" fill="#3E9B6B" font-weight="bold">yes</text>

  <!-- FALSE branch -->
  <line x1="400" y1="170" x2="480" y2="225" stroke="#C4683A" stroke-width="2"/>
  <polygon points="480,225 474,214 469,223" fill="#C4683A"/>
  <rect x="480" y="198" width="140" height="54" rx="6" fill="#C4683A"/>
  <text x="550" y="220" text-anchor="middle" font-size="12" fill="#ffffff">FALSE returns</text>
  <text x="550" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">"Pending"</text>
  <text x="437" y="212" text-anchor="middle" font-size="11" fill="#C4683A" font-weight="bold">no</text>

  <!-- formula strip -->
  <rect x="30" y="285" width="580" height="34" rx="4" fill="#E5E7EB"/>
  <text x="320" y="307" text-anchor="middle" font-size="13" fill="#141B5C" font-family="monospace">=IF(B2&gt;0, "Complete", "Pending")</text>
</svg>
