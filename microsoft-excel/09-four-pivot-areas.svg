<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Arial, sans-serif">
  <rect width="720" height="470" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#141B5C">The four pivot areas</text>
  <text x="30" y="56" font-size="12" fill="#374151">Drop a field into an area and the pivot rebuilds itself around it.</text>

  <!-- Filters bar -->
  <rect x="150" y="80" width="440" height="34" fill="#D4AF37"/>
  <text x="370" y="102" font-size="13" font-weight="bold" fill="#141B5C" text-anchor="middle">FILTERS  ·  narrows the whole pivot (e.g. Channel)</text>

  <!-- Columns bar -->
  <rect x="270" y="126" width="320" height="30" fill="#3E9B6B"/>
  <text x="430" y="146" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COLUMNS  ·  a split across the top (Month)</text>

  <!-- Rows column -->
  <rect x="150" y="168" width="110" height="230" fill="#1E2A8E"/>
  <text x="205" y="278" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 205 278)">ROWS · buckets (Category)</text>

  <!-- Values grid -->
  <rect x="270" y="168" width="320" height="230" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="430" y="270" font-size="13" font-weight="bold" fill="#C4683A" text-anchor="middle">VALUES</text>
  <text x="430" y="292" font-size="11" fill="#374151" text-anchor="middle">the number in every cell (Sum of Sales)</text>

  <!-- mock grid lines -->
  <g stroke="#E5E7EB" stroke-width="1">
    <line x1="270" y1="210" x2="590" y2="210"/>
    <line x1="270" y1="252" x2="590" y2="252"/>
    <line x1="270" y1="336" x2="590" y2="336"/>
    <line x1="376" y1="168" x2="376" y2="398"/>
    <line x1="483" y1="168" x2="483" y2="398"/>
  </g>

  <!-- sample values -->
  <g font-size="11" fill="#111827" text-anchor="middle">
    <text x="323" y="235">Jan</text><text x="430" y="235">Feb</text><text x="536" y="235">Mar</text>
  </g>

  <!-- Legend of what each move does -->
  <text x="30" y="430" font-size="12" fill="#374151">Rows makes the buckets · Columns adds a second split · Values fills the grid with a total · Filters gates the whole pivot.</text>
  <text x="30" y="452" font-size="11" fill="#374151" font-style="italic">Same fields, dragged to different areas, ask a different question.</text>
</svg>
