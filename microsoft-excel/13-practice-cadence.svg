<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Practice Cadence</text>

  <!-- timeline spine -->
  <line x1="70" y1="120" x2="570" y2="120" stroke="#E5E7EB" stroke-width="4"/>
  <polygon points="570,120 558,113 558,127" fill="#E5E7EB"/>

  <!-- Weekly node -->
  <circle cx="140" cy="120" r="13" fill="#3E9B6B"/>
  <text x="140" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">W</text>
  <rect x="60" y="150" width="160" height="86" rx="8" fill="#3E9B6B"/>
  <text x="140" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Weekly</text>
  <text x="140" y="193" text-anchor="middle" font-size="11" fill="#ffffff">One real task,</text>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#ffffff">done in Excel.</text>
  <text x="140" y="226" text-anchor="middle" font-size="11" fill="#ffffff">~10 minutes.</text>

  <!-- Monthly node -->
  <circle cx="320" cy="120" r="13" fill="#1E2A8E"/>
  <text x="320" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">M</text>
  <rect x="240" y="150" width="160" height="86" rx="8" fill="#1E2A8E"/>
  <text x="320" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Monthly</text>
  <text x="320" y="193" text-anchor="middle" font-size="11" fill="#ffffff">Rebuild one report</text>
  <text x="320" y="208" text-anchor="middle" font-size="11" fill="#ffffff">from raw data,</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#ffffff">start to finish.</text>

  <!-- 90-day node -->
  <circle cx="500" cy="120" r="13" fill="#D4AF37"/>
  <text x="500" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#141B5C">90</text>
  <rect x="420" y="150" width="160" height="86" rx="8" fill="#D4AF37"/>
  <text x="500" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">90 Days</text>
  <text x="500" y="193" text-anchor="middle" font-size="11" fill="#141B5C">Re-score the</text>
  <text x="500" y="208" text-anchor="middle" font-size="11" fill="#141B5C">Module 12 tasks.</text>
  <text x="500" y="226" text-anchor="middle" font-size="11" fill="#141B5C">Measure what stuck.</text>

  <!-- labels above -->
  <text x="140" y="86" text-anchor="middle" font-size="11" fill="#374151">small &amp; frequent</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" fill="#374151">complete &amp; occasional</text>
  <text x="500" y="86" text-anchor="middle" font-size="11" fill="#374151">measured once</text>

  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">Never let two full weeks pass with zero Excel.</text>
</svg>
