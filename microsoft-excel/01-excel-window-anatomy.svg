<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="480" fill="#FFFFFF"/>
  <rect x="20" y="20" width="680" height="440" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Ribbon -->
  <rect x="20" y="20" width="680" height="52" rx="8" fill="#1E2A8E"/>
  <rect x="20" y="52" width="680" height="20" fill="#1E2A8E"/>
  <text x="44" y="42" fill="#FFFFFF" font-size="13" font-weight="bold">Home</text>
  <text x="104" y="42" fill="#C9CEF0" font-size="13">Insert</text>
  <text x="160" y="42" fill="#C9CEF0" font-size="13">Data</text>
  <rect x="44" y="52" width="34" height="14" rx="2" fill="#D4AF37"/>
  <rect x="86" y="52" width="34" height="14" rx="2" fill="#3E9B6B"/>
  <rect x="128" y="52" width="52" height="14" rx="2" fill="#C4683A"/>
  <rect x="188" y="52" width="34" height="14" rx="2" fill="#D4AF37"/>

  <!-- Name box + formula bar -->
  <rect x="20" y="80" width="70" height="26" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="55" y="97" fill="#111827" font-size="12" text-anchor="middle" font-weight="bold">B2</text>
  <rect x="94" y="80" width="606" height="26" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="106" y="97" fill="#374151" font-size="12">Maria</text>

  <!-- Column headers -->
  <g font-size="12" fill="#374151" font-weight="bold" text-anchor="middle">
    <rect x="60" y="112" width="640" height="22" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="20" y="112" width="40" height="22" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="140" y="127">A</text>
    <text x="300" y="127">B</text>
    <text x="460" y="127">C</text>
    <text x="620" y="127">D</text>
  </g>

  <!-- Row numbers + grid -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <!-- row number cells -->
    <rect x="20" y="134" width="40" height="30" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="153">1</text>
    <rect x="20" y="164" width="40" height="30" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="183">2</text>
    <rect x="20" y="194" width="40" height="30" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="213">3</text>
    <rect x="20" y="224" width="40" height="30" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="243">4</text>
    <rect x="20" y="254" width="40" height="30" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/><text x="40" y="273">5</text>
  </g>

  <!-- grid cells -->
  <g stroke="#E5E7EB" stroke-width="1" fill="#FFFFFF">
    <rect x="60" y="134" width="160" height="30"/><rect x="220" y="134" width="160" height="30"/><rect x="380" y="134" width="160" height="30"/><rect x="540" y="134" width="160" height="30"/>
    <rect x="60" y="164" width="160" height="30"/><rect x="220" y="164" width="160" height="30"/><rect x="380" y="164" width="160" height="30"/><rect x="540" y="164" width="160" height="30"/>
    <rect x="60" y="194" width="160" height="30"/><rect x="220" y="194" width="160" height="30"/><rect x="380" y="194" width="160" height="30"/><rect x="540" y="194" width="160" height="30"/>
    <rect x="60" y="224" width="160" height="30"/><rect x="220" y="224" width="160" height="30"/><rect x="380" y="224" width="160" height="30"/><rect x="540" y="224" width="160" height="30"/>
    <rect x="60" y="254" width="160" height="30"/><rect x="220" y="254" width="160" height="30"/><rect x="380" y="254" width="160" height="30"/><rect x="540" y="254" width="160" height="30"/>
  </g>

  <!-- header row content -->
  <g font-size="11" fill="#111827" font-weight="bold">
    <text x="70" y="153">Last</text><text x="230" y="153">First</text><text x="390" y="153">Tickets</text>
  </g>
  <!-- highlighted cell B2 -->
  <rect x="220" y="164" width="160" height="30" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="3"/>
  <text x="230" y="183" font-size="11" fill="#111827">Maria</text>
  <text x="70" y="183" font-size="11" fill="#374151">Chen</text>
  <text x="390" y="183" font-size="11" fill="#374151">12</text>

  <!-- Sheet tabs -->
  <g font-size="11">
    <rect x="20" y="296" width="90" height="24" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
    <text x="65" y="312" fill="#111827" text-anchor="middle" font-weight="bold">Volunteers</text>
    <rect x="110" y="296" width="88" height="24" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="154" y="312" fill="#374151" text-anchor="middle">Donations</text>
    <rect x="198" y="296" width="66" height="24" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="231" y="312" fill="#374151" text-anchor="middle">Budget</text>
  </g>

  <!-- Status bar -->
  <rect x="20" y="320" width="680" height="24" fill="#141B5C"/>
  <text x="32" y="336" fill="#C9CEF0" font-size="11">Ready</text>
  <text x="560" y="336" fill="#C9CEF0" font-size="11">Average: 12   Count: 1</text>

  <!-- Callout labels -->
  <g font-size="12" fill="#1E2A8E" font-weight="bold">
    <text x="360" y="372" text-anchor="middle">Ribbon = the tools, grouped in tabs</text>
    <line x1="360" y1="358" x2="200" y2="46" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
  <g font-size="11" fill="#374151">
    <text x="55" y="392" text-anchor="middle" fill="#1E2A8E" font-weight="bold">Name Box</text>
    <line x1="55" y1="378" x2="55" y2="106" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="400" y="410" text-anchor="middle" fill="#1E2A8E" font-weight="bold">Formula bar shows the cell's true contents</text>
    <line x1="400" y1="416" x2="300" y2="106" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="300" y="436" text-anchor="middle" fill="#1E2A8E" font-weight="bold">One selected cell (B2), outlined in green</text>
    <line x1="300" y1="442" x2="300" y2="196" stroke="#3E9B6B" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="150" y="456" text-anchor="middle" fill="#1E2A8E" font-weight="bold">Sheet tabs = pages in the workbook</text>
    <line x1="150" y1="446" x2="65" y2="320" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="600" y="436" text-anchor="middle" fill="#1E2A8E" font-weight="bold">Status bar = quick facts on your selection</text>
    <line x1="600" y1="442" x2="600" y2="344" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>
