<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Anatomy of a Function Call</text>

  <!-- The formula, big, in a bar -->
  <rect x="80" y="80" width="560" height="70" rx="6" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <text x="100" y="128" font-size="40" font-family="monospace" fill="#111827">=</text>
  <text x="128" y="128" font-size="40" font-family="monospace" font-weight="bold" fill="#1E2A8E">SUM</text>
  <text x="215" y="128" font-size="40" font-family="monospace" fill="#C4683A">(</text>
  <text x="238" y="128" font-size="40" font-family="monospace" fill="#3E9B6B">B2:B20</text>
  <text x="405" y="128" font-size="40" font-family="monospace" fill="#C4683A">)</text>

  <!-- Labels with connector lines -->
  <!-- equals sign -->
  <line x1="108" y1="150" x2="108" y2="200" stroke="#374151" stroke-width="1.5"/>
  <text x="108" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Equals sign</text>
  <text x="108" y="238" text-anchor="middle" font-size="12" fill="#374151">"calculate this"</text>

  <!-- function name -->
  <line x1="170" y1="150" x2="170" y2="255" stroke="#1E2A8E" stroke-width="1.5"/>
  <text x="170" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">Function name</text>
  <text x="170" y="293" text-anchor="middle" font-size="12" fill="#374151">the job to do</text>

  <!-- parentheses -->
  <line x1="310" y1="150" x2="310" y2="200" stroke="#C4683A" stroke-width="1.5"/>
  <text x="310" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">Parentheses</text>
  <text x="310" y="238" text-anchor="middle" font-size="12" fill="#374151">hold the input</text>

  <!-- argument -->
  <line x1="300" y1="150" x2="300" y2="150" stroke="#3E9B6B" stroke-width="0"/>
  <line x1="290" y1="150" x2="480" y2="255" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="500" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">Argument (the range)</text>
  <text x="500" y="288" text-anchor="middle" font-size="12" fill="#374151">which cells to work on</text>

  <!-- result arrow -->
  <line x1="640" y1="115" x2="690" y2="115" stroke="#141B5C" stroke-width="2" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#141B5C"/>
    </marker>
  </defs>
  <rect x="620" y="170" width="90" height="46" rx="6" fill="#141B5C"/>
  <text x="665" y="199" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">1,480</text>
  <text x="665" y="236" text-anchor="middle" font-size="12" fill="#374151">the result</text>
</svg>
