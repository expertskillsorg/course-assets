<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="480" fill="#FFFFFF"/>
  <!-- page -->
  <rect x="30" y="20" width="580" height="440" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- title + date -->
  <text x="52" y="58" font-size="19" font-weight="bold" fill="#141B5C">Northwind Outdoor &#8212; Q1 Sales</text>
  <text x="588" y="58" text-anchor="end" font-size="12" fill="#374151">As of Mar 31</text>
  <line x1="52" y1="70" x2="588" y2="70" stroke="#D4AF37" stroke-width="2"/>

  <!-- headline numbers -->
  <rect x="52" y="86" width="168" height="66" rx="6" fill="#1E2A8E"/>
  <text x="136" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">$148,000</text>
  <text x="136" y="138" text-anchor="middle" font-size="11" fill="#E5E7EB">Total Q1 sales</text>

  <rect x="236" y="86" width="168" height="66" rx="6" fill="#3E9B6B"/>
  <text x="320" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">Tents</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#FFFFFF">Top category &#183; $61,200</text>

  <rect x="420" y="86" width="168" height="66" rx="6" fill="#C4683A"/>
  <text x="504" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">March</text>
  <text x="504" y="138" text-anchor="middle" font-size="11" fill="#FFFFFF">Best month &#183; $57,200</text>

  <!-- chart 1: column -->
  <rect x="52" y="168" width="256" height="150" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="188" font-size="12" font-weight="bold" fill="#141B5C">Sales by category</text>
  <line x1="70" y1="298" x2="292" y2="298" stroke="#374151" stroke-width="1.5"/>
  <rect x="86" y="214" width="34" height="84" fill="#1E2A8E"/>
  <rect x="136" y="250" width="34" height="48" fill="#1E2A8E"/>
  <rect x="186" y="254" width="34" height="44" fill="#1E2A8E"/>
  <rect x="236" y="270" width="34" height="28" fill="#1E2A8E"/>

  <!-- chart 2: line -->
  <rect x="332" y="168" width="256" height="150" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="344" y="188" font-size="12" font-weight="bold" fill="#141B5C">Monthly trend</text>
  <line x1="350" y1="298" x2="572" y2="298" stroke="#374151" stroke-width="1.5"/>
  <polyline points="380,278 460,258 540,224" fill="none" stroke="#3E9B6B" stroke-width="3"/>
  <circle cx="380" cy="278" r="4" fill="#3E9B6B"/>
  <circle cx="460" cy="258" r="4" fill="#3E9B6B"/>
  <circle cx="540" cy="224" r="4" fill="#3E9B6B"/>

  <!-- small table -->
  <rect x="52" y="334" width="256" height="96" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="354" font-size="12" font-weight="bold" fill="#141B5C">Category detail</text>
  <line x1="64" y1="362" x2="296" y2="362" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="64" y="382" font-size="11" fill="#374151">Tents</text><text x="284" y="382" text-anchor="end" font-size="11" fill="#111827">$61,200</text>
  <text x="64" y="400" font-size="11" fill="#374151">Packs</text><text x="284" y="400" text-anchor="end" font-size="11" fill="#111827">$34,800</text>
  <text x="64" y="418" font-size="11" fill="#374151">Sleep</text><text x="284" y="418" text-anchor="end" font-size="11" fill="#111827">$32,400</text>

  <!-- takeaway -->
  <rect x="332" y="334" width="256" height="96" rx="6" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="344" y="356" font-size="12" font-weight="bold" fill="#141B5C">The takeaway</text>
  <text x="344" y="380" font-size="11" fill="#374151">Q1 sales climbed every month</text>
  <text x="344" y="398" font-size="11" fill="#374151">and Tents led every category.</text>
  <text x="344" y="416" font-size="11" fill="#374151">Momentum is with premium gear.</text>

  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#374151">One sheet &#183; aligned &#183; no gridlines &#183; every number traceable to the pivot</text>
</svg>
