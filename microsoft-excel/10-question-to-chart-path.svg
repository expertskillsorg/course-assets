<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="660" height="420" fill="#FFFFFF"/>
  <text x="330" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">What question is the data answering?</text>

  <!-- start node -->
  <rect x="240" y="52" width="180" height="46" rx="8" fill="#1E2A8E"/>
  <text x="330" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Say it in one sentence</text>

  <!-- connectors -->
  <path d="M330 98 L330 120 L120 120 L120 150" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M330 98 L330 150" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M330 98 L330 120 L540 120 L540 150" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- branch labels -->
  <rect x="30" y="150" width="180" height="40" rx="6" fill="#E5E7EB"/>
  <text x="120" y="175" text-anchor="middle" font-size="13" fill="#111827">"Which is biggest?"</text>

  <rect x="240" y="150" width="180" height="40" rx="6" fill="#E5E7EB"/>
  <text x="330" y="175" text-anchor="middle" font-size="13" fill="#111827">"Which way is it heading?"</text>

  <rect x="450" y="150" width="180" height="40" rx="6" fill="#E5E7EB"/>
  <text x="540" y="175" text-anchor="middle" font-size="13" fill="#111827">"What share of the whole?"</text>

  <!-- connectors to charts -->
  <path d="M120 190 L120 214" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M330 190 L330 214" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M540 190 L540 214" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- COLUMN chart icon -->
  <rect x="40" y="214" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <line x1="60" y1="330" x2="180" y2="330" stroke="#374151" stroke-width="2"/>
  <rect x="70" y="290" width="20" height="40" fill="#1E2A8E"/>
  <rect x="100" y="268" width="20" height="62" fill="#1E2A8E"/>
  <rect x="130" y="250" width="20" height="80" fill="#1E2A8E"/>
  <rect x="160" y="300" width="14" height="30" fill="#1E2A8E"/>
  <text x="120" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Column / Bar</text>

  <!-- LINE chart icon -->
  <rect x="250" y="214" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <line x1="270" y1="330" x2="390" y2="330" stroke="#374151" stroke-width="2"/>
  <polyline points="272,318 305,300 340,278 385,250" fill="none" stroke="#3E9B6B" stroke-width="3"/>
  <circle cx="272" cy="318" r="3" fill="#3E9B6B"/>
  <circle cx="305" cy="300" r="3" fill="#3E9B6B"/>
  <circle cx="340" cy="278" r="3" fill="#3E9B6B"/>
  <circle cx="385" cy="250" r="3" fill="#3E9B6B"/>
  <text x="330" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Line</text>

  <!-- PIE chart icon -->
  <rect x="460" y="214" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="540" cy="284" r="42" fill="#1E2A8E"/>
  <path d="M540 284 L540 242 A42 42 0 0 1 578 300 Z" fill="#C4683A"/>
  <text x="540" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Pie (few slices)</text>

  <text x="330" y="398" text-anchor="middle" font-size="12" fill="#374151">When unsure, default to a column chart. It is the honest workhorse.</text>
</svg>
