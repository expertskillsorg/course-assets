<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#141B5C">From hiring-test skill to the module that teaches it</text>

  <text x="150" y="66" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">WHAT THE TEST CHECKS</text>
  <text x="610" y="66" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">WHERE YOU LEARNED IT</text>

  <!-- Row 1: Formulas & functions -> Modules 3-5 -->
  <rect x="30" y="82" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="150" y="105" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Formulas &amp; functions</text>
  <text x="150" y="120" font-size="11" fill="#D4AF37" text-anchor="middle">SUM, IF, text, dates</text>
  <line x1="270" y1="105" x2="490" y2="105" stroke="#D4AF37" stroke-width="2.5"/>
  <polygon points="490,105 480,100 480,110" fill="#D4AF37"/>
  <rect x="490" y="82" width="240" height="46" rx="6" fill="#E5E7EB"/>
  <text x="610" y="111" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Modules 3 to 5</text>

  <!-- Row 2: Lookups -> Module 6 -->
  <rect x="30" y="140" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="150" y="163" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Lookups</text>
  <text x="150" y="178" font-size="11" fill="#D4AF37" text-anchor="middle">XLOOKUP, VLOOKUP (most screened)</text>
  <line x1="270" y1="163" x2="490" y2="163" stroke="#3E9B6B" stroke-width="2.5"/>
  <polygon points="490,163 480,158 480,168" fill="#3E9B6B"/>
  <rect x="490" y="140" width="240" height="46" rx="6" fill="#E5E7EB"/>
  <text x="610" y="169" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Module 6</text>

  <!-- Row 3: Data cleaning -> Module 7 -->
  <rect x="30" y="198" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="150" y="221" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data cleaning</text>
  <text x="150" y="236" font-size="11" fill="#D4AF37" text-anchor="middle">duplicates, split, validate</text>
  <line x1="270" y1="221" x2="490" y2="221" stroke="#C4683A" stroke-width="2.5"/>
  <polygon points="490,221 480,216 480,226" fill="#C4683A"/>
  <rect x="490" y="198" width="240" height="46" rx="6" fill="#E5E7EB"/>
  <text x="610" y="227" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Module 7</text>

  <!-- Row 4: Sort, filter, highlight -> Module 8 -->
  <rect x="30" y="256" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="150" y="279" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sort, filter, highlight</text>
  <text x="150" y="294" font-size="11" fill="#D4AF37" text-anchor="middle">answer show-me questions</text>
  <line x1="270" y1="279" x2="490" y2="279" stroke="#D4AF37" stroke-width="2.5"/>
  <polygon points="490,279 480,274 480,284" fill="#D4AF37"/>
  <rect x="490" y="256" width="240" height="46" rx="6" fill="#E5E7EB"/>
  <text x="610" y="285" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Module 8</text>

  <!-- Row 5: PivotTables -> Module 9 -->
  <rect x="30" y="314" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="150" y="337" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PivotTables</text>
  <text x="150" y="352" font-size="11" fill="#D4AF37" text-anchor="middle">what "advanced Excel" means</text>
  <line x1="270" y1="337" x2="490" y2="337" stroke="#3E9B6B" stroke-width="2.5"/>
  <polygon points="490,337 480,332 480,342" fill="#3E9B6B"/>
  <rect x="490" y="314" width="240" height="46" rx="6" fill="#E5E7EB"/>
  <text x="610" y="343" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Module 9</text>

  <!-- Row 6: Charts & reports -> Module 10 -->
  <rect x="30" y="372" width="240" height="46" rx="6" fill="#1E2A8E"/>
  <text x="150" y="395" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Charts &amp; reports</text>
  <text x="150" y="410" font-size="11" fill="#D4AF37" text-anchor="middle">choose, format, assemble</text>
  <line x1="270" y1="395" x2="490" y2="395" stroke="#C4683A" stroke-width="2.5"/>
  <polygon points="490,395 480,390 480,400" fill="#C4683A"/>
  <rect x="490" y="372" width="240" height="46" rx="6" fill="#E5E7EB"/>
  <text x="610" y="401" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">Module 10</text>

  <text x="30" y="452" font-size="12" fill="#374151">No secret seventh skill: the whole test is a checklist you have already worked through.</text>
</svg>
