<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Routine, at Three Speeds</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">The same bookkeeping cycle, run weekly, monthly, and quarterly</text>

  <!-- Weekly column -->
  <rect x="40" y="82" width="216" height="238" rx="10" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <rect x="40" y="82" width="216" height="46" rx="10" fill="#D4AF37"/>
  <rect x="40" y="112" width="216" height="16" fill="#D4AF37"/>
  <text x="148" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">WEEKLY</text>
  <text x="148" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">20 to 40 minutes</text>
  <text x="62" y="186" font-size="12.5" fill="#111827">Zero the bank feed:</text>
  <text x="62" y="204" font-size="12.5" fill="#111827">match, add, or exclude</text>
  <text x="62" y="234" font-size="12.5" fill="#111827">Glance at A/R and nudge</text>
  <text x="62" y="252" font-size="12.5" fill="#111827">past-due invoices</text>
  <text x="62" y="282" font-size="12.5" fill="#111827">Snap and attach stray</text>
  <text x="62" y="300" font-size="12.5" fill="#111827">receipts</text>

  <!-- Monthly column -->
  <rect x="272" y="82" width="216" height="238" rx="10" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="272" y="82" width="216" height="46" rx="10" fill="#3E9B6B"/>
  <rect x="272" y="112" width="216" height="16" fill="#3E9B6B"/>
  <text x="380" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">MONTHLY</text>
  <text x="380" y="152" text-anchor="middle" font-size="12.5" fill="#374151" font-style="italic">weekly pass, plus:</text>
  <text x="380" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">about 30 minutes</text>
  <text x="294" y="212" font-size="12.5" fill="#111827">Reconcile each account</text>
  <text x="294" y="230" font-size="12.5" fill="#111827">to the statement</text>
  <text x="294" y="260" font-size="12.5" fill="#111827">Read your reports:</text>
  <text x="294" y="278" font-size="12.5" fill="#111827">P&amp;L and balance sheet</text>

  <!-- Quarterly column -->
  <rect x="504" y="82" width="216" height="238" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="504" y="82" width="216" height="46" rx="10" fill="#1E2A8E"/>
  <rect x="504" y="112" width="216" height="16" fill="#1E2A8E"/>
  <text x="612" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">QUARTERLY</text>
  <text x="612" y="152" text-anchor="middle" font-size="12.5" fill="#374151" font-style="italic">monthly work, plus:</text>
  <text x="612" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">about 30 minutes</text>
  <text x="526" y="212" font-size="12.5" fill="#111827">Empty the parking lot</text>
  <text x="526" y="242" font-size="12.5" fill="#111827">Tidy your bank rules</text>
  <text x="526" y="272" font-size="12.5" fill="#111827">Run a mini-close</text>

  <text x="380" y="346" text-anchor="middle" font-size="12" fill="#374151" font-style="italic">Never fall more than two weeks behind, and tax season stays boring.</text>
</svg>
