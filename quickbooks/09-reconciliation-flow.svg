<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#FFFFFF"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The reconciliation flow: compare two records, drive the difference to zero</text>

  <!-- Two inputs -->
  <rect x="34" y="70" width="210" height="88" rx="8" fill="#1E2A8E"/>
  <text x="139" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Bank statement</text>
  <text x="139" y="120" text-anchor="middle" font-size="12" fill="#E5E7EB">The bank's own record</text>
  <text x="139" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">Ending balance $6,000 · Mar 31</text>

  <rect x="34" y="176" width="210" height="88" rx="8" fill="#374151"/>
  <text x="139" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Your books</text>
  <text x="139" y="226" text-anchor="middle" font-size="12" fill="#E5E7EB">The March register in QBO</text>
  <text x="139" y="247" text-anchor="middle" font-size="12" fill="#E5E7EB">Categorized, For Review at zero</text>

  <!-- arrows to compare -->
  <line x1="244" y1="114" x2="300" y2="150" stroke="#111827" stroke-width="2"/>
  <line x1="244" y1="220" x2="300" y2="184" stroke="#111827" stroke-width="2"/>
  <polygon points="300,167 288,160 290,174" fill="#111827"/>

  <!-- compare box -->
  <rect x="302" y="130" width="176" height="74" rx="8" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="390" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Check off each line</text>
  <text x="390" y="177" text-anchor="middle" font-size="12" fill="#374151">the two records share</text>
  <text x="390" y="194" text-anchor="middle" font-size="11" fill="#374151">(cleared vs uncleared)</text>

  <!-- arrow to difference -->
  <line x1="478" y1="167" x2="540" y2="167" stroke="#111827" stroke-width="2"/>
  <polygon points="540,167 528,161 528,173" fill="#111827"/>

  <!-- difference counter -->
  <rect x="542" y="128" width="204" height="78" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="644" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Difference counter</text>
  <text x="644" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#C4683A">Not $0 yet?</text>
  <text x="644" y="196" text-anchor="middle" font-size="11" fill="#374151">a discrepancy is hiding</text>

  <!-- two discrepancies feeding the loop -->
  <rect x="300" y="248" width="204" height="70" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <text x="402" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Discrepancy 1: transposition</text>
  <text x="402" y="291" text-anchor="middle" font-size="11" fill="#374151">Oakwood deposit keyed $1,200,</text>
  <text x="402" y="307" text-anchor="middle" font-size="11" fill="#374151">statement says $2,100 · fix it</text>

  <rect x="516" y="248" width="230" height="70" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <text x="631" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Discrepancy 2: duplicate</text>
  <text x="631" y="291" text-anchor="middle" font-size="11" fill="#374151">Home Depot $420 entered twice,</text>
  <text x="631" y="307" text-anchor="middle" font-size="11" fill="#374151">left uncleared · delete it</text>

  <!-- loop arrow from difference down to discrepancies and back -->
  <path d="M 644 206 L 644 232 L 631 232 L 631 246" fill="none" stroke="#C4683A" stroke-width="2"/>
  <polygon points="631,246 625,234 637,234" fill="#C4683A"/>
  <path d="M 402 246 L 402 224 L 470 224" fill="none" stroke="#C4683A" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="402" y="238" text-anchor="middle" font-size="10" fill="#C4683A">resolve, recheck</text>

  <!-- final result -->
  <rect x="270" y="368" width="240" height="74" rx="8" fill="#3E9B6B"/>
  <text x="390" y="398" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Difference = $0</text>
  <text x="390" y="420" text-anchor="middle" font-size="12" fill="#FFFFFF">Reconciled: the month is locked,</text>
  <text x="390" y="436" text-anchor="middle" font-size="12" fill="#FFFFFF">trustworthy history</text>

  <!-- arrow from difference counter to result -->
  <path d="M 644 206 L 644 344 L 510 344 L 510 380 L 512 380" fill="none" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="512,405 500,399 512,393" fill="#3E9B6B" transform="translate(0,0)"/>
  <text x="600" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">once it reads zero</text>
</svg>
