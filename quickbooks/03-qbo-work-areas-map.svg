<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#FFFFFF"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="720" height="46" rx="6" fill="#141B5C"/>
  <!-- Search bar -->
  <rect x="40" y="33" width="300" height="20" rx="10" fill="#FFFFFF"/>
  <text x="54" y="47" font-size="12" fill="#374151">Search anything by name or amount</text>
  <!-- +New button -->
  <rect x="560" y="31" width="72" height="24" rx="6" fill="#3E9B6B"/>
  <text x="596" y="47" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">+ New</text>
  <!-- gear -->
  <circle cx="700" cy="43" r="13" fill="#D4AF37"/>
  <circle cx="700" cy="43" r="5" fill="#141B5C"/>
  <text x="700" y="20" font-size="11" fill="#374151" text-anchor="middle">gear</text>

  <!-- Left menu column -->
  <rect x="20" y="82" width="180" height="378" rx="6" fill="#1E2A8E"/>
  <text x="110" y="106" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Left menu</text>

  <!-- menu items -->
  <g font-size="13" fill="#FFFFFF" font-weight="bold">
    <rect x="34" y="120" width="152" height="42" rx="5" fill="#141B5C"/>
    <text x="48" y="146">1. Dashboard</text>
    <rect x="34" y="172" width="152" height="42" rx="5" fill="#141B5C"/>
    <text x="48" y="198">2. Transactions</text>
    <rect x="34" y="224" width="152" height="42" rx="5" fill="#141B5C"/>
    <text x="48" y="250">3. Sales</text>
    <rect x="34" y="276" width="152" height="42" rx="5" fill="#141B5C"/>
    <text x="48" y="302">4. Expenses</text>
    <rect x="34" y="328" width="152" height="42" rx="5" fill="#141B5C"/>
    <text x="48" y="354">5. Reports</text>
    <rect x="34" y="380" width="152" height="42" rx="5" fill="#141B5C"/>
    <text x="48" y="406">6. Taxes</text>
  </g>

  <!-- What lives where (right panel labels) -->
  <g font-size="12.5" fill="#111827">
    <line x1="200" y1="141" x2="250" y2="141" stroke="#E5E7EB" stroke-width="2"/>
    <text x="258" y="138" font-weight="bold" fill="#1E2A8E">Home glance</text>
    <text x="258" y="153" fill="#374151">cash, recent activity, unpaid invoices</text>

    <line x1="200" y1="193" x2="250" y2="193" stroke="#E5E7EB" stroke-width="2"/>
    <text x="258" y="190" font-weight="bold" fill="#1E2A8E">Bank feed</text>
    <text x="258" y="205" fill="#374151">sort connected-account activity (most time here)</text>

    <line x1="200" y1="245" x2="250" y2="245" stroke="#E5E7EB" stroke-width="2"/>
    <text x="258" y="242" font-weight="bold" fill="#1E2A8E">Money in</text>
    <text x="258" y="257" fill="#374151">customers, invoices, products and services</text>

    <line x1="200" y1="297" x2="250" y2="297" stroke="#E5E7EB" stroke-width="2"/>
    <text x="258" y="294" font-weight="bold" fill="#1E2A8E">Money out</text>
    <text x="258" y="309" fill="#374151">vendors, bills, expense records</text>

    <line x1="200" y1="349" x2="250" y2="349" stroke="#E5E7EB" stroke-width="2"/>
    <text x="258" y="346" font-weight="bold" fill="#1E2A8E">The payoff</text>
    <text x="258" y="361" fill="#374151">the three core reports and more</text>

    <line x1="200" y1="401" x2="250" y2="401" stroke="#E5E7EB" stroke-width="2"/>
    <text x="258" y="398" font-weight="bold" fill="#1E2A8E">Sales tax center</text>
    <text x="258" y="413" fill="#374151">and 1099 tools (visit monthly)</text>
  </g>

  <!-- shortcut callouts -->
  <rect x="470" y="120" width="270" height="70" rx="6" fill="#FFF7E6" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="484" y="142" font-size="12.5" font-weight="bold" fill="#C4683A">Gear icon (top-right)</text>
  <text x="484" y="160" font-size="12" fill="#374151">settings, chart of accounts,</text>
  <text x="484" y="176" font-size="12" fill="#374151">and every list QuickBooks keeps</text>

  <rect x="470" y="204" width="270" height="70" rx="6" fill="#EAF5EF" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="484" y="226" font-size="12.5" font-weight="bold" fill="#3E9B6B">+ New button (top-left)</text>
  <text x="484" y="244" font-size="12" fill="#374151">starts any manual transaction:</text>
  <text x="484" y="260" font-size="12" fill="#374151">invoice, expense, check, transfer</text>
</svg>
