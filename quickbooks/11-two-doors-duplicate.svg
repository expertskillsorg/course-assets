<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">One real purchase, two ways into the books</text>

  <!-- The single real event -->
  <rect x="240" y="56" width="240" height="66" rx="8" fill="#1E2A8E"/>
  <text x="360" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">One real event</text>
  <text x="360" y="105" text-anchor="middle" font-size="13" fill="#FFFFFF">$200 fuel, paid March 8</text>

  <!-- split arrows -->
  <path d="M320 122 L180 168" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M400 122 L540 168" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Door A: bank feed -->
  <rect x="60" y="176" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="180" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">Door 1: The bank feed</text>
  <text x="180" y="228" text-anchor="middle" font-size="12.5" fill="#374151">The feed shows the $200 and</text>
  <text x="180" y="246" text-anchor="middle" font-size="12.5" fill="#374151">you click Add. Record made.</text>

  <!-- Door B: manual -->
  <rect x="420" y="176" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <text x="540" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">Door 2: Entered by hand</text>
  <text x="540" y="228" text-anchor="middle" font-size="12.5" fill="#374151">You also keyed it as a bill</text>
  <text x="540" y="246" text-anchor="middle" font-size="12.5" fill="#374151">or expense. Second record.</text>

  <!-- converge arrows -->
  <path d="M180 266 L320 328" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M540 266 L400 328" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- result: duplicate -->
  <rect x="200" y="336" width="320" height="86" rx="8" fill="#C4683A"/>
  <text x="360" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Two records in your books</text>
  <text x="360" y="390" text-anchor="middle" font-size="13" fill="#FFFFFF">Fuel now reads $400. Profit drops,</text>
  <text x="360" y="408" text-anchor="middle" font-size="13" fill="#FFFFFF">and the account will not reconcile.</text>
</svg>
