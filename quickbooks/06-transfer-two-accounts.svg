<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="tarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E2A8E"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#ffffff"/>

  <text x="360" y="40" text-anchor="middle" fill="#141B5C" font-size="20" font-weight="bold">One transfer, two accounts</text>

  <!-- Checking box -->
  <rect x="48" y="96" width="230" height="130" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="163" y="130" text-anchor="middle" fill="#141B5C" font-size="16" font-weight="bold">Business Checking</text>
  <line x1="72" y1="146" x2="254" y2="146" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="163" y="180" text-anchor="middle" fill="#C4683A" font-size="26" font-weight="bold">- $900</text>
  <text x="163" y="205" text-anchor="middle" fill="#374151" font-size="13">money out</text>

  <!-- Credit card box -->
  <rect x="442" y="96" width="230" height="130" rx="10" fill="#ffffff" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="557" y="130" text-anchor="middle" fill="#141B5C" font-size="16" font-weight="bold">Credit Card</text>
  <line x1="466" y1="146" x2="648" y2="146" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="557" y="180" text-anchor="middle" fill="#3E9B6B" font-size="26" font-weight="bold">- $900</text>
  <text x="557" y="205" text-anchor="middle" fill="#374151" font-size="13">balance owed drops</text>

  <!-- connecting arrow -->
  <line x1="288" y1="161" x2="432" y2="161" stroke="#1E2A8E" stroke-width="3" marker-end="url(#tarrow)"/>
  <rect x="300" y="242" width="120" height="30" rx="6" fill="#D4AF37"/>
  <text x="360" y="262" text-anchor="middle" fill="#141B5C" font-size="14" font-weight="bold">ONE event</text>
  <line x1="360" y1="176" x2="360" y2="242" stroke="#D4AF37" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Wrong view -->
  <rect x="120" y="320" width="480" height="96" rx="10" fill="#F9F5EC" stroke="#C4683A" stroke-width="2"/>
  <text x="360" y="352" text-anchor="middle" fill="#C4683A" font-size="15" font-weight="bold">The mistake: recording it as two expenses</text>
  <text x="360" y="380" text-anchor="middle" fill="#374151" font-size="14">"$900 expense" out of checking + "$900 expense" on the card</text>
  <text x="360" y="402" text-anchor="middle" fill="#141B5C" font-size="14" font-weight="bold">= the same $900 counted twice</text>
  <line x1="150" y1="368" x2="570" y2="368" stroke="#C4683A" stroke-width="2"/>
</svg>
