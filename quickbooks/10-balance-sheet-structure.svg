<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="Arial, sans-serif">
  <rect width="540" height="400" fill="#FFFFFF"/>
  <text x="270" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">The balance sheet always balances</text>
  <text x="270" y="50" text-anchor="middle" font-size="13" fill="#374151">Assets  =  Liabilities  +  Equity</text>

  <!-- fulcrum / beam -->
  <line x1="90" y1="120" x2="450" y2="120" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 120 l-16 40 h32 z" fill="#374151"/>
  <rect x="255" y="160" width="30" height="14" fill="#374151"/>

  <!-- left pan: Assets -->
  <line x1="150" y1="120" x2="150" y2="150" stroke="#374151" stroke-width="1.5"/>
  <rect x="70" y="150" width="160" height="130" rx="6" fill="#1E2A8E"/>
  <text x="150" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">ASSETS</text>
  <text x="150" y="200" text-anchor="middle" font-size="20" font-weight="bold" fill="#D4AF37">24,000</text>
  <line x1="88" y1="214" x2="212" y2="214" stroke="#3B4B9A" stroke-width="1"/>
  <text x="88" y="238" font-size="12" fill="#FFFFFF">Checking</text>
  <text x="212" y="238" text-anchor="end" font-size="12" fill="#FFFFFF">6,000</text>
  <text x="88" y="262" font-size="12" fill="#FFFFFF">Work truck</text>
  <text x="212" y="262" text-anchor="end" font-size="12" fill="#FFFFFF">18,000</text>

  <!-- right pan: Liabilities + Equity -->
  <line x1="390" y1="120" x2="390" y2="150" stroke="#374151" stroke-width="1.5"/>
  <rect x="310" y="150" width="160" height="70" rx="6" fill="#C4683A"/>
  <text x="390" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">LIABILITIES</text>
  <text x="390" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">13,307</text>
  <text x="326" y="212" font-size="10.5" fill="#FFFFFF">card 1,687 · loan 11,620</text>

  <rect x="310" y="224" width="160" height="56" rx="6" fill="#3E9B6B"/>
  <text x="390" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">EQUITY</text>
  <text x="390" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">10,693</text>

  <!-- equals -->
  <text x="270" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">24,000  =  13,307  +  10,693</text>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#374151">The two totals match, so the sheet is in balance.</text>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#374151">Net income from the P&amp;L flows into Equity.</text>
</svg>
