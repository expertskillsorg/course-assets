<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Year-End Timeline</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Three calm phases, not one frantic day</text>

  <!-- baseline -->
  <line x1="70" y1="120" x2="690" y2="120" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="70" y1="120" x2="640" y2="120" stroke="#1E2A8E" stroke-width="4"/>
  <polygon points="690,120 672,112 672,128" fill="#1E2A8E"/>

  <!-- December node -->
  <circle cx="160" cy="120" r="13" fill="#D4AF37"/>
  <text x="160" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">1</text>
  <text x="160" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">December</text>
  <text x="160" y="76" text-anchor="middle" font-size="11" fill="#374151">Pre-checks</text>
  <rect x="60" y="150" width="200" height="118" rx="8" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <text x="76" y="176" font-size="12" fill="#111827">Sweep contractors for W-9s</text>
  <text x="76" y="200" font-size="12" fill="#111827">Chase last big receipts</text>
  <text x="76" y="224" font-size="12" fill="#111827">Glance at loan and card</text>
  <text x="76" y="240" font-size="12" fill="#111827">balances</text>

  <!-- January node -->
  <circle cx="380" cy="120" r="13" fill="#3E9B6B"/>
  <text x="380" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="380" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">January</text>
  <text x="380" y="76" text-anchor="middle" font-size="11" fill="#374151">Close and package</text>
  <rect x="280" y="150" width="200" height="118" rx="8" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <text x="296" y="176" font-size="12" fill="#111827">Reconcile December</text>
  <text x="296" y="200" font-size="12" fill="#111827">Empty the parking lot</text>
  <text x="296" y="224" font-size="12" fill="#111827">Run reports, build pack</text>
  <text x="296" y="248" font-size="12" fill="#111827">File 1099s by Jan 31</text>

  <!-- February node -->
  <circle cx="600" cy="120" r="13" fill="#C4683A"/>
  <text x="600" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="600" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">February +</text>
  <text x="600" y="76" text-anchor="middle" font-size="11" fill="#374151">Handoff and file</text>
  <rect x="500" y="150" width="200" height="118" rx="8" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <text x="516" y="176" font-size="12" fill="#111827">Hand accountant the pack</text>
  <text x="516" y="200" font-size="12" fill="#111827">Accountant files return</text>
  <text x="516" y="224" font-size="12" fill="#111827">Close the books, then</text>
  <text x="516" y="240" font-size="12" fill="#111827">reset for the new year</text>

  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#374151" font-style="italic">Quarterly mini-closes make January boring, which means you did it right.</text>
</svg>
