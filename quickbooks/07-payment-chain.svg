<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="820" height="440" fill="#FFFFFF"/>
  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Invoice to Matched Deposit</text>
  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#374151">Each payment is recorded once, then combined into the single deposit the bank shows</text>

  <!-- Step 1: Invoice -->
  <rect x="40" y="95" width="150" height="86" rx="10" fill="#1E2A8E"/>
  <text x="115" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1. Invoice</text>
  <text x="115" y="150" text-anchor="middle" font-size="11.5" fill="#FFFFFF">You bill the couple.</text>
  <text x="115" y="166" text-anchor="middle" font-size="11.5" fill="#FFFFFF">Income is recorded.</text>

  <!-- Step 2: Receive Payment -->
  <rect x="230" y="95" width="150" height="86" rx="10" fill="#3E9B6B"/>
  <text x="305" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2. Receive</text>
  <text x="305" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Payment</text>
  <text x="305" y="162" text-anchor="middle" font-size="11.5" fill="#FFFFFF">Closes the invoice.</text>

  <!-- Step 3: Undeposited Funds -->
  <rect x="420" y="95" width="160" height="86" rx="10" fill="#D4AF37"/>
  <text x="500" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">3. Undeposited</text>
  <text x="500" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Funds</text>
  <text x="500" y="162" text-anchor="middle" font-size="11.5" fill="#141B5C">Payments wait here.</text>

  <!-- Step 4: Bank Deposit -->
  <rect x="630" y="95" width="150" height="86" rx="10" fill="#141B5C"/>
  <text x="705" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4. Bank</text>
  <text x="705" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Deposit</text>
  <text x="705" y="162" text-anchor="middle" font-size="11.5" fill="#FFFFFF">One deposit total.</text>

  <!-- Arrows between steps -->
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <line x1="192" y1="138" x2="224" y2="138"/>
    <polygon points="224,138 214,133 214,143" fill="#374151" stroke="none"/>
    <line x1="382" y1="138" x2="414" y2="138"/>
    <polygon points="414,138 404,133 404,143" fill="#374151" stroke="none"/>
    <line x1="582" y1="138" x2="624" y2="138"/>
    <polygon points="624,138 614,133 614,143" fill="#374151" stroke="none"/>
  </g>

  <!-- Three payments gathering into undeposited funds -->
  <text x="410" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Three separate payments...</text>
  <rect x="150" y="255" width="130" height="40" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="215" y="280" text-anchor="middle" font-size="12" fill="#111827">Couple A  $500</text>
  <rect x="150" y="305" width="130" height="40" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="215" y="330" text-anchor="middle" font-size="12" fill="#111827">Couple B  $500</text>
  <rect x="150" y="355" width="130" height="40" rx="6" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="215" y="380" text-anchor="middle" font-size="12" fill="#111827">Couple C  $500</text>

  <!-- Funnel arrows -->
  <g stroke="#D4AF37" stroke-width="2.5" fill="none">
    <line x1="284" y1="275" x2="392" y2="315"/>
    <line x1="284" y1="325" x2="392" y2="325"/>
    <line x1="284" y1="375" x2="392" y2="335"/>
  </g>

  <!-- Combined into one deposit -->
  <rect x="398" y="300" width="150" height="52" rx="8" fill="#141B5C"/>
  <text x="473" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">One deposit</text>
  <text x="473" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">$1,500</text>

  <!-- Match in feed -->
  <line x1="550" y1="326" x2="586" y2="326" stroke="#374151" stroke-width="2.5"/>
  <polygon points="586,326 576,321 576,331" fill="#374151" stroke="none"/>
  <rect x="590" y="298" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#141B5C" stroke-width="2"/>
  <text x="680" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#141B5C">Bank feed: $1,500</text>
  <text x="680" y="340" text-anchor="middle" font-size="12" fill="#3E9B6B">MATCH, never add</text>

  <text x="410" y="422" text-anchor="middle" font-size="12" fill="#C4683A" font-weight="bold">Skip undeposited funds and your books show 3 deposits while the bank shows 1: the feed never matches.</text>
</svg>
