<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="Arial, sans-serif">
  <rect width="520" height="440" fill="#FFFFFF"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">Rivera Home Services — March P&amp;L</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#374151">Read it top to bottom</text>

  <!-- Total Income -->
  <rect x="60" y="70" width="400" height="44" rx="4" fill="#3E9B6B"/>
  <text x="80" y="98" font-size="14" font-weight="bold" fill="#FFFFFF">Total Income</text>
  <text x="440" y="98" text-anchor="end" font-size="14" font-weight="bold" fill="#FFFFFF">6,575</text>

  <!-- minus COGS -->
  <text x="80" y="135" font-size="12.5" fill="#C4683A">− Cost of Goods Sold (materials, subcontractor)</text>
  <text x="440" y="135" text-anchor="end" font-size="12.5" fill="#C4683A">3,655</text>
  <line x1="60" y1="145" x2="460" y2="145" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Gross Profit -->
  <rect x="90" y="153" width="370" height="38" rx="4" fill="#1E2A8E"/>
  <text x="108" y="177" font-size="13" font-weight="bold" fill="#FFFFFF">Gross Profit</text>
  <text x="442" y="177" text-anchor="end" font-size="13" font-weight="bold" fill="#FFFFFF">2,920</text>

  <!-- minus Expenses -->
  <text x="108" y="214" font-size="12.5" fill="#C4683A">− Operating Expenses (rent, fuel, insurance…)</text>
  <text x="442" y="214" text-anchor="end" font-size="12.5" fill="#C4683A">2,097</text>
  <line x1="90" y1="224" x2="460" y2="224" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Net Operating Income -->
  <rect x="120" y="232" width="340" height="38" rx="4" fill="#1E2A8E"/>
  <text x="138" y="256" font-size="13" font-weight="bold" fill="#FFFFFF">Net Operating Income</text>
  <text x="444" y="256" text-anchor="end" font-size="13" font-weight="bold" fill="#FFFFFF">823</text>

  <!-- minus interest -->
  <text x="138" y="293" font-size="12.5" fill="#C4683A">− Other Expenses (loan interest)</text>
  <text x="444" y="293" text-anchor="end" font-size="12.5" fill="#C4683A">70</text>
  <line x1="120" y1="303" x2="460" y2="303" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Net Income -->
  <rect x="150" y="315" width="310" height="52" rx="4" fill="#D4AF37"/>
  <text x="168" y="340" font-size="15" font-weight="bold" fill="#141B5C">Net Income</text>
  <text x="168" y="357" font-size="11" fill="#141B5C">the bottom line: March's profit</text>
  <text x="444" y="348" text-anchor="end" font-size="18" font-weight="bold" fill="#141B5C">753</text>

  <!-- down arrow -->
  <line x1="40" y1="80" x2="40" y2="350" stroke="#374151" stroke-width="1.5"/>
  <path d="M40 350 l-5 -10 h10 z" fill="#374151"/>
  <text x="30" y="220" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90 30 220)">income to profit</text>

  <text x="260" y="400" text-anchor="middle" font-size="11.5" fill="#374151">Income up top, subtractions in the middle, one profit number at the bottom.</text>
</svg>
