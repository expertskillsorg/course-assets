<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">From the For Review list into your books</text>

  <!-- For Review source -->
  <rect x="40" y="70" width="200" height="330" rx="10" fill="#1E2A8E"/>
  <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">For Review list</text>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#D4AF37">what the bank pulled in</text>
  <rect x="60" y="140" width="160" height="46" rx="5" fill="#ffffff"/>
  <text x="140" y="162" text-anchor="middle" font-size="11" fill="#374151">SQ *NADIA COFFEE</text>
  <text x="140" y="177" text-anchor="middle" font-size="11" fill="#111827" font-weight="bold">+$318.40</text>
  <rect x="60" y="198" width="160" height="46" rx="5" fill="#ffffff"/>
  <text x="140" y="220" text-anchor="middle" font-size="11" fill="#374151">COSTCO WHSE</text>
  <text x="140" y="235" text-anchor="middle" font-size="11" fill="#111827" font-weight="bold">-$96.12</text>
  <rect x="60" y="256" width="160" height="46" rx="5" fill="#ffffff"/>
  <text x="140" y="278" text-anchor="middle" font-size="11" fill="#374151">TRANSFER TO CARD</text>
  <text x="140" y="293" text-anchor="middle" font-size="11" fill="#111827" font-weight="bold">-$150.00</text>
  <rect x="60" y="314" width="160" height="46" rx="5" fill="#ffffff"/>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#374151">DUPLICATE IMPORT</text>
  <text x="140" y="351" text-anchor="middle" font-size="11" fill="#111827" font-weight="bold">-$96.12</text>

  <!-- decision diamond -->
  <polygon points="360,235 420,200 480,235 420,270" fill="#D4AF37"/>
  <text x="420" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Is it</text>
  <text x="420" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">already there?</text>

  <!-- arrow source to diamond -->
  <line x1="240" y1="235" x2="356" y2="235" stroke="#374151" stroke-width="2"/>
  <polygon points="356,235 346,230 346,240" fill="#374151"/>

  <!-- three outcome boxes -->
  <rect x="560" y="86" width="170" height="78" rx="8" fill="#3E9B6B"/>
  <text x="645" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">MATCH</text>
  <text x="645" y="135" text-anchor="middle" font-size="11" fill="#ffffff">links to an entry</text>
  <text x="645" y="150" text-anchor="middle" font-size="11" fill="#ffffff">already in the books</text>

  <rect x="560" y="196" width="170" height="78" rx="8" fill="#1E2A8E"/>
  <text x="645" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">ADD</text>
  <text x="645" y="245" text-anchor="middle" font-size="11" fill="#ffffff">creates a new entry</text>
  <text x="645" y="260" text-anchor="middle" font-size="11" fill="#ffffff">with a category</text>

  <rect x="560" y="306" width="170" height="78" rx="8" fill="#C4683A"/>
  <text x="645" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">EXCLUDE</text>
  <text x="645" y="355" text-anchor="middle" font-size="11" fill="#ffffff">removes it; does not</text>
  <text x="645" y="370" text-anchor="middle" font-size="11" fill="#ffffff">belong in the books</text>

  <!-- arrows from diamond -->
  <line x1="470" y1="218" x2="558" y2="128" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="558,128 547,131 552,140" fill="#3E9B6B"/>
  <text x="512" y="160" text-anchor="middle" font-size="10" fill="#3E9B6B" font-weight="bold">yes</text>

  <line x1="480" y1="235" x2="558" y2="235" stroke="#1E2A8E" stroke-width="2"/>
  <polygon points="558,235 548,230 548,240" fill="#1E2A8E"/>
  <text x="519" y="228" text-anchor="middle" font-size="10" fill="#1E2A8E" font-weight="bold">no, it's new</text>

  <line x1="470" y1="252" x2="558" y2="342" stroke="#C4683A" stroke-width="2"/>
  <polygon points="558,342 547,338 552,331" fill="#C4683A"/>
  <text x="510" y="320" text-anchor="middle" font-size="10" fill="#C4683A" font-weight="bold">not real</text>

  <!-- books result -->
  <rect x="560" y="410" width="170" height="40" rx="8" fill="#141B5C"/>
  <text x="645" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Your books</text>
  <line x1="645" y1="164" x2="645" y2="408" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="645" y1="274" x2="645" y2="408" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
