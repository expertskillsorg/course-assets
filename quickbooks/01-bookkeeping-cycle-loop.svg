<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Monthly Bookkeeping Cycle</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Five steps that repeat every month</text>

  <!-- center hub -->
  <circle cx="320" cy="250" r="52" fill="#1E2A8E"/>
  <text x="320" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Repeat</text>
  <text x="320" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">monthly</text>

  <!-- Node coordinates around a circle, radius ~150 -->
  <!-- 1 Capture: top -->
  <g>
    <circle cx="320" cy="110" r="40" fill="#D4AF37"/>
    <text x="320" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">1</text>
    <text x="320" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Capture</text>
  </g>
  <!-- 2 Categorize: right -->
  <g>
    <circle cx="463" cy="200" r="40" fill="#3E9B6B"/>
    <text x="463" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="463" y="214" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Categorize</text>
  </g>
  <!-- 3 Reconcile: bottom-right -->
  <g>
    <circle cx="408" cy="370" r="40" fill="#C4683A"/>
    <text x="408" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="408" y="384" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#FFFFFF">Reconcile</text>
  </g>
  <!-- 4 Review: bottom-left -->
  <g>
    <circle cx="232" cy="370" r="40" fill="#1E2A8E"/>
    <text x="232" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="232" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Review</text>
  </g>
  <!-- 5 File: left -->
  <g>
    <circle cx="177" cy="200" r="40" fill="#141B5C"/>
    <text x="177" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="177" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">File</text>
  </g>

  <!-- arrows along the loop (clockwise) -->
  <g fill="none" stroke="#374151" stroke-width="3">
    <path d="M357 128 A150 150 0 0 1 431 168" marker-end="url(#ah)"/>
    <path d="M470 240 A150 150 0 0 1 438 336" marker-end="url(#ah)"/>
    <path d="M368 383 A150 150 0 0 1 272 383" marker-end="url(#ah)"/>
    <path d="M202 336 A150 150 0 0 1 170 240" marker-end="url(#ah)"/>
    <path d="M209 168 A150 150 0 0 1 283 128" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- captions -->
  <text x="320" y="438" text-anchor="middle" font-size="12" fill="#374151">Capture transactions, sort them, prove them against the bank, read the reports, keep the records. Then do it again.</text>
</svg>
