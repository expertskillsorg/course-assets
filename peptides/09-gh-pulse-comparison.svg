<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#FFFFFF"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Natural GH pulses vs a stimulated pulse</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#374151" stroke-width="2"/>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#374151" stroke-width="2"/>

  <!-- y axis label -->
  <text x="30" y="185" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 30 185)">GH in the blood</text>
  <!-- x axis label -->
  <text x="335" y="345" text-anchor="middle" font-size="13" fill="#374151">Time over a day and night</text>

  <!-- baseline grid -->
  <line x1="70" y1="280" x2="600" y2="280" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="200" x2="600" y2="200" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="70" y1="120" x2="600" y2="120" stroke="#E5E7EB" stroke-width="1"/>

  <!-- natural pulse curve: several small-to-moderate bumps, return to baseline -->
  <path d="M70,290 L110,290 Q135,150 160,290 L200,290 Q225,200 250,290 L300,290 Q330,90 360,290 L410,290 Q435,210 460,290 L600,290"
        fill="none" stroke="#3E9B6B" stroke-width="3"/>

  <!-- stimulated pulse curve: one large tall spike -->
  <path d="M70,292 L150,292 Q230,40 310,292 L600,292"
        fill="none" stroke="#C4683A" stroke-width="3" stroke-dasharray="2 0"/>

  <!-- markers -->
  <circle cx="310" cy="60" r="4" fill="#C4683A"/>
  <circle cx="300" cy="105" r="4" fill="#3E9B6B"/>

  <!-- legend -->
  <rect x="370" y="70" width="220" height="64" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <line x1="384" y1="92" x2="414" y2="92" stroke="#3E9B6B" stroke-width="3"/>
  <text x="422" y="96" font-size="12" fill="#111827">Natural: several gentle pulses</text>
  <line x1="384" y1="116" x2="414" y2="116" stroke="#C4683A" stroke-width="3"/>
  <text x="422" y="120" font-size="12" fill="#111827">Stimulated: one larger pulse</text>

  <!-- baseline note -->
  <text x="78" y="296" font-size="11" fill="#374151">baseline</text>
</svg>
