<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">When to keep going, pause, or seek care</text>

  <!-- Start -->
  <rect x="280" y="58" width="200" height="48" rx="24" fill="#1E2A8E"/>
  <text x="380" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">You notice a symptom</text>

  <!-- arrow to Q1 -->
  <line x1="380" y1="106" x2="380" y2="134" stroke="#374151" stroke-width="2"/>
  <polygon points="380,140 374,130 386,130" fill="#374151"/>

  <!-- Q1 diamond -->
  <polygon points="380,142 500,202 380,262 260,202" fill="#ffffff" stroke="#141B5C" stroke-width="2"/>
  <text x="380" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Emergency sign?</text>
  <text x="380" y="208" text-anchor="middle" font-size="11" fill="#374151">trouble breathing,</text>
  <text x="380" y="223" text-anchor="middle" font-size="11" fill="#374151">throat/lip swelling, fever +</text>
  <text x="380" y="238" text-anchor="middle" font-size="11" fill="#374151">spreading hot site, pus</text>

  <!-- Q1 yes -> seek care -->
  <line x1="500" y1="202" x2="610" y2="202" stroke="#C4683A" stroke-width="2"/>
  <polygon points="616,202 606,196 606,208" fill="#C4683A"/>
  <text x="556" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">YES</text>
  <rect x="616" y="170" width="132" height="64" rx="8" fill="#C4683A"/>
  <text x="682" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SEEK CARE NOW</text>
  <text x="682" y="218" text-anchor="middle" font-size="11" fill="#ffffff">stop, get help / call 911</text>

  <!-- Q1 no -> Q2 -->
  <line x1="380" y1="262" x2="380" y2="294" stroke="#374151" stroke-width="2"/>
  <polygon points="380,300 374,290 386,290" fill="#374151"/>
  <text x="396" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">NO</text>

  <!-- Q2 diamond -->
  <polygon points="380,302 500,362 380,422 260,362" fill="#ffffff" stroke="#141B5C" stroke-width="2"/>
  <text x="380" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Mild, expected,</text>
  <text x="380" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">flat or improving?</text>
  <text x="380" y="388" text-anchor="middle" font-size="11" fill="#374151">on the normal list, not worsening</text>

  <!-- Q2 yes -> keep going -->
  <line x1="500" y1="362" x2="610" y2="362" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="616,362 606,356 606,368" fill="#3E9B6B"/>
  <text x="556" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">YES</text>
  <rect x="616" y="330" width="132" height="64" rx="8" fill="#3E9B6B"/>
  <text x="682" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">KEEP GOING</text>
  <text x="682" y="378" text-anchor="middle" font-size="11" fill="#ffffff">note it, watch the trend</text>

  <!-- Q2 no -> pause -->
  <line x1="380" y1="422" x2="380" y2="452" stroke="#D4AF37" stroke-width="2"/>
  <polygon points="380,458 374,448 386,448" fill="#D4AF37"/>
  <text x="396" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">NO</text>
  <rect x="290" y="458" width="180" height="50" rx="8" fill="#D4AF37"/>
  <text x="380" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">PAUSE &amp; WATCH</text>
  <text x="380" y="498" text-anchor="middle" font-size="11" fill="#141B5C">hold use, ready to seek care</text>
</svg>
