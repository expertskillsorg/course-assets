<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="The safe-use decision path as a left-to-right flow: Goal, Evaluate, Source, Prepare, Dose, Monitor, with a stop-and-rethink loop back from Evaluate.">
  <rect x="0" y="0" width="880" height="360" fill="#FFFFFF"/>
  <text x="440" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">The Safe-Use Decision Path</text>
  <text x="440" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">One direction of travel, with a way back at every gate</text>

  <!-- nodes -->
  <g font-family="Arial, sans-serif">
    <!-- Goal -->
    <rect x="24" y="120" width="120" height="64" rx="10" fill="#1E2A8E"/>
    <text x="84" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Goal</text>
    <text x="84" y="170" text-anchor="middle" font-size="11" fill="#E5E7EB">What problem?</text>

    <!-- Evaluate -->
    <rect x="168" y="120" width="120" height="64" rx="10" fill="#1E2A8E"/>
    <text x="228" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Evaluate</text>
    <text x="228" y="170" text-anchor="middle" font-size="11" fill="#E5E7EB">Six-question lens</text>

    <!-- Source -->
    <rect x="312" y="120" width="120" height="64" rx="10" fill="#3E9B6B"/>
    <text x="372" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Source</text>
    <text x="372" y="170" text-anchor="middle" font-size="11" fill="#FFFFFF">Vendor + COA</text>

    <!-- Prepare -->
    <rect x="456" y="120" width="120" height="64" rx="10" fill="#3E9B6B"/>
    <text x="516" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Prepare</text>
    <text x="516" y="170" text-anchor="middle" font-size="11" fill="#FFFFFF">Reconstitute</text>

    <!-- Dose -->
    <rect x="600" y="120" width="120" height="64" rx="10" fill="#D4AF37"/>
    <text x="660" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Dose</text>
    <text x="660" y="170" text-anchor="middle" font-size="11" fill="#141B5C">Calculate + draw</text>

    <!-- Monitor -->
    <rect x="744" y="120" width="120" height="64" rx="10" fill="#C4683A"/>
    <text x="804" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Monitor</text>
    <text x="804" y="170" text-anchor="middle" font-size="11" fill="#FFFFFF">Log + watch</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <path d="M144 152 H166" marker-end="url(#arrow)"/>
    <path d="M288 152 H310" marker-end="url(#arrow)"/>
    <path d="M432 152 H454" marker-end="url(#arrow)"/>
    <path d="M576 152 H598" marker-end="url(#arrow)"/>
    <path d="M720 152 H742" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C4683A"/>
    </marker>
  </defs>

  <!-- stop / rethink loop back from Evaluate to Goal -->
  <path d="M228 184 V248 H84 V184" stroke="#C4683A" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#redarrow)"/>
  <text x="156" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C4683A">2+ unknowns? Stop and rethink</text>

  <!-- monitor feedback note -->
  <path d="M804 184 V300 H516 V184" stroke="#374151" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="660" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Something feels wrong? Pause, adjust, or stop</text>
</svg>
