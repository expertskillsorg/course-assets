<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Arial, sans-serif">
  <rect width="860" height="320" fill="#FFFFFF"/>
  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The mixing step sequence</text>

  <!-- Step 1: draw water -->
  <g>
    <circle cx="90" cy="100" r="20" fill="#1E2A8E"/>
    <text x="90" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <!-- syringe -->
    <rect x="55" y="150" width="70" height="22" rx="4" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <rect x="55" y="153" width="40" height="16" fill="#3E9B6B" opacity="0.6"/>
    <line x1="125" y1="161" x2="148" y2="161" stroke="#374151" stroke-width="2"/>
    <text x="90" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Draw the water</text>
    <text x="90" y="223" text-anchor="middle" font-size="11" fill="#374151">measured amount</text>
  </g>

  <!-- arrow -->
  <path d="M165 161 H200" stroke="#D4AF37" stroke-width="3" marker-end="url(#a)"/>

  <!-- Step 2: angle the needle -->
  <g>
    <circle cx="270" cy="100" r="20" fill="#1E2A8E"/>
    <text x="270" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
    <rect x="248" y="145" width="44" height="55" rx="6" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <line x1="300" y1="120" x2="266" y2="150" stroke="#374151" stroke-width="2"/>
    <text x="270" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Angle the needle</text>
    <text x="270" y="243" text-anchor="middle" font-size="11" fill="#374151">aim at the glass wall</text>
  </g>

  <path d="M315 161 H350" stroke="#D4AF37" stroke-width="3" marker-end="url(#a)"/>

  <!-- Step 3: run down wall -->
  <g>
    <circle cx="420" cy="100" r="20" fill="#1E2A8E"/>
    <text x="420" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
    <rect x="398" y="145" width="44" height="55" rx="6" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <path d="M404 150 Q406 175 404 195" stroke="#3E9B6B" stroke-width="3" fill="none"/>
    <text x="420" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Run down the wall</text>
    <text x="420" y="243" text-anchor="middle" font-size="11" fill="#374151">slow stream</text>
  </g>

  <path d="M465 161 H500" stroke="#D4AF37" stroke-width="3" marker-end="url(#a)"/>

  <!-- Step 4: swirl gently -->
  <g>
    <circle cx="570" cy="100" r="20" fill="#1E2A8E"/>
    <text x="570" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">4</text>
    <rect x="548" y="145" width="44" height="55" rx="6" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <path d="M558 188 A14 9 0 1 1 582 188" stroke="#C4683A" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <text x="570" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Swirl gently</text>
    <text x="570" y="243" text-anchor="middle" font-size="11" fill="#374151">never shake</text>
  </g>

  <path d="M615 161 H650" stroke="#D4AF37" stroke-width="3" marker-end="url(#a)"/>

  <!-- Step 5: dissolve clear -->
  <g>
    <circle cx="720" cy="100" r="20" fill="#3E9B6B"/>
    <text x="720" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">5</text>
    <rect x="698" y="145" width="44" height="55" rx="6" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
    <rect x="700" y="165" width="40" height="33" rx="4" fill="#1E2A8E" opacity="0.25"/>
    <text x="720" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Let it dissolve</text>
    <text x="720" y="243" text-anchor="middle" font-size="11" fill="#374151">clear = ready</text>
  </g>

  <text x="430" y="295" text-anchor="middle" font-size="14" fill="#374151" font-style="italic">Be gentle to protect the peptide; be exact with the water to protect your math.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#D4AF37"/>
    </marker>
  </defs>
</svg>
