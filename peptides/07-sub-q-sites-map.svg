<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Arial, sans-serif">
  <rect width="520" height="420" fill="#FFFFFF"/>
  <text x="260" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">Common Subcutaneous Administration Areas</text>

  <!-- Body outline (front-facing, simplified) -->
  <g stroke="#374151" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- head -->
    <circle cx="260" cy="95" r="26"/>
    <!-- neck to shoulders -->
    <path d="M248 119 L248 132 L196 150 M272 119 L272 132 L324 150"/>
    <!-- torso -->
    <path d="M196 150 L184 268 L210 286 L210 300 L310 300 L310 286 L336 268 L324 150"/>
    <!-- arms -->
    <path d="M196 150 L150 170 L138 268 L160 274 L176 196"/>
    <path d="M324 150 L370 170 L382 268 L360 274 L344 196"/>
    <!-- legs -->
    <path d="M210 300 L196 392 L228 392 L248 312"/>
    <path d="M310 300 L324 392 L292 392 L272 312"/>
  </g>

  <!-- Abdomen shaded zones (either side of navel) -->
  <circle cx="260" cy="240" r="3" fill="#374151"/>
  <ellipse cx="232" cy="244" rx="22" ry="30" fill="#3E9B6B" opacity="0.45"/>
  <ellipse cx="288" cy="244" rx="22" ry="30" fill="#3E9B6B" opacity="0.45"/>

  <!-- Flanks -->
  <ellipse cx="196" cy="222" rx="12" ry="26" fill="#D4AF37" opacity="0.55"/>
  <ellipse cx="324" cy="222" rx="12" ry="26" fill="#D4AF37" opacity="0.55"/>

  <!-- Upper thighs (front/outer) -->
  <ellipse cx="218" cy="340" rx="16" ry="30" fill="#1E2A8E" opacity="0.40"/>
  <ellipse cx="302" cy="340" rx="16" ry="30" fill="#1E2A8E" opacity="0.40"/>

  <!-- Backs of upper arms -->
  <ellipse cx="152" cy="210" rx="11" ry="24" fill="#C4683A" opacity="0.50"/>
  <ellipse cx="368" cy="210" rx="11" ry="24" fill="#C4683A" opacity="0.50"/>

  <!-- Legend -->
  <g font-size="13" fill="#111827">
    <rect x="400" y="120" width="16" height="16" fill="#3E9B6B" opacity="0.45"/>
    <text x="424" y="133">Abdomen</text>
    <rect x="400" y="148" width="16" height="16" fill="#D4AF37" opacity="0.55"/>
    <text x="424" y="161">Flank</text>
    <rect x="400" y="176" width="16" height="16" fill="#1E2A8E" opacity="0.40"/>
    <text x="424" y="189">Upper thigh</text>
    <rect x="400" y="204" width="16" height="16" fill="#C4683A" opacity="0.50"/>
    <text x="424" y="217">Upper arm</text>
  </g>

  <text x="260" y="410" text-anchor="middle" font-size="12" fill="#374151">Areas with enough soft tissue and room to rotate spots over time.</text>
</svg>
