<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Parts of an Insulin Syringe</text>

  <!-- Plunger -->
  <rect x="60" y="120" width="70" height="22" rx="3" fill="#374151"/>
  <rect x="118" y="124" width="14" height="14" fill="#374151"/>

  <!-- Barrel -->
  <rect x="132" y="112" width="380" height="38" rx="4" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- liquid fill in barrel -->
  <rect x="132" y="114" width="150" height="34" fill="#3E9B6B" opacity="0.35"/>

  <!-- Unit markings on barrel -->
  <g stroke="#141B5C" stroke-width="2">
    <line x1="170" y1="112" x2="170" y2="98"/>
    <line x1="210" y1="112" x2="210" y2="104"/>
    <line x1="250" y1="112" x2="250" y2="98"/>
    <line x1="290" y1="112" x2="290" y2="104"/>
    <line x1="330" y1="112" x2="330" y2="98"/>
    <line x1="370" y1="112" x2="370" y2="104"/>
    <line x1="410" y1="112" x2="410" y2="98"/>
    <line x1="450" y1="112" x2="450" y2="104"/>
    <line x1="490" y1="112" x2="490" y2="98"/>
  </g>
  <g font-size="11" fill="#141B5C" text-anchor="middle">
    <text x="170" y="92">10</text>
    <text x="250" y="92">20</text>
    <text x="330" y="92">30</text>
    <text x="410" y="92">40</text>
    <text x="490" y="92">50</text>
  </g>

  <!-- Hub / neck -->
  <rect x="512" y="120" width="20" height="22" fill="#374151"/>

  <!-- Needle -->
  <rect x="532" y="128" width="120" height="6" fill="#1E2A8E"/>
  <polygon points="652,128 668,131 652,134" fill="#1E2A8E"/>

  <!-- Labels with leader lines -->
  <g stroke="#C4683A" stroke-width="1.5">
    <line x1="95" y1="120" x2="95" y2="200"/>
    <line x1="322" y1="150" x2="322" y2="215"/>
    <line x1="330" y1="98" x2="330" y2="70"/>
    <line x1="595" y1="134" x2="595" y2="200"/>
  </g>

  <text x="95" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Plunger</text>
  <text x="95" y="234" text-anchor="middle" font-size="11" fill="#374151">push to expel</text>

  <text x="322" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Barrel</text>
  <text x="322" y="249" text-anchor="middle" font-size="11" fill="#374151">holds the liquid</text>

  <text x="330" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Unit markings</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#374151">read your dose here, not "mL"</text>

  <text x="595" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Needle</text>
  <text x="595" y="234" text-anchor="middle" font-size="11" fill="#374151">short and fine for sub-q</text>

  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">A U-100 insulin syringe: 100 units fill the full 1 mL barrel.</text>
</svg>
