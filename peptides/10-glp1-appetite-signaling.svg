<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How a GLP-1 Peptide Acts on Appetite</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">One signal, three targets, one result: feeling full sooner and longer</text>

  <!-- Source node -->
  <rect x="250" y="78" width="140" height="48" rx="10" fill="#1E2A8E"/>
  <text x="320" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">GLP-1 peptide</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#D4AF37">binds the GLP-1 receptor</text>

  <!-- connectors -->
  <path d="M285 126 L150 175" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M320 126 L320 175" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M355 126 L490 175" stroke="#374151" stroke-width="2" fill="none"/>

  <!-- Brain target -->
  <rect x="40" y="178" width="200" height="92" rx="10" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <text x="140" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Brain</text>
  <text x="140" y="224" text-anchor="middle" font-size="12" fill="#374151">Raises the feeling</text>
  <text x="140" y="240" text-anchor="middle" font-size="12" fill="#374151">of fullness</text>
  <text x="140" y="258" text-anchor="middle" font-size="11" fill="#3E9B6B">"food noise" quiets</text>

  <!-- Stomach target -->
  <rect x="220" y="178" width="200" height="92" rx="10" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <text x="320" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Stomach</text>
  <text x="320" y="224" text-anchor="middle" font-size="12" fill="#374151">Slows how fast</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#374151">it empties</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#C4683A">stay full longer</text>

  <!-- Pancreas target -->
  <rect x="400" y="178" width="200" height="92" rx="10" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <text x="500" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Pancreas</text>
  <text x="500" y="224" text-anchor="middle" font-size="12" fill="#374151">Releases insulin when</text>
  <text x="500" y="240" text-anchor="middle" font-size="12" fill="#374151">blood sugar is high</text>
  <text x="500" y="258" text-anchor="middle" font-size="11" fill="#D4AF37">steadier blood sugar</text>

  <!-- arrows down to result -->
  <path d="M140 270 L300 318" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M320 270 L320 318" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M500 270 L340 318" stroke="#374151" stroke-width="2" fill="none"/>

  <!-- result -->
  <rect x="150" y="320" width="340" height="64" rx="12" fill="#141B5C"/>
  <text x="320" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Less hungry, full sooner</text>
  <text x="320" y="370" text-anchor="middle" font-size="12" fill="#D4AF37">eating less follows, and weight change follows that</text>
</svg>
