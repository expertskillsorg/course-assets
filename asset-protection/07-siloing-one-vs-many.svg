<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- LEFT: one basket -->
  <text x="190" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">One LLC, four rentals</text>
  <text x="190" y="56" text-anchor="middle" font-size="13" fill="#374151">One claim can reach all four</text>

  <!-- single entity box -->
  <rect x="40" y="80" width="300" height="210" rx="10" fill="#FBEAE3" stroke="#C4683A" stroke-width="2.5"/>
  <text x="190" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Single LLC</text>

  <!-- four houses inside -->
  <g>
    <rect x="70" y="120" width="110" height="70" rx="6" fill="#1E2A8E"/>
    <text x="125" y="160" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">House 1</text>
    <rect x="200" y="120" width="110" height="70" rx="6" fill="#1E2A8E"/>
    <text x="255" y="160" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">House 2</text>
    <rect x="70" y="205" width="110" height="70" rx="6" fill="#1E2A8E"/>
    <text x="125" y="245" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">House 3</text>
    <rect x="200" y="205" width="110" height="70" rx="6" fill="#1E2A8E"/>
    <text x="255" y="245" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">House 4</text>
  </g>

  <!-- claim arrow into the box -->
  <line x1="190" y1="340" x2="190" y2="294" stroke="#C4683A" stroke-width="3"/>
  <polygon points="190,290 184,302 196,302" fill="#C4683A"/>
  <text x="190" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Claim at House 1</text>
  <text x="190" y="382" text-anchor="middle" font-size="12" fill="#374151">reaches the whole basket</text>

  <!-- divider -->
  <line x1="380" y1="70" x2="380" y2="390" stroke="#E5E7EB" stroke-width="2"/>

  <!-- RIGHT: many baskets -->
  <text x="570" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Four LLCs, one each</text>
  <text x="570" y="56" text-anchor="middle" font-size="13" fill="#3E9B6B">A claim is contained to one</text>

  <g>
    <!-- silo 1 (hit) -->
    <rect x="420" y="80" width="140" height="110" rx="8" fill="#FBEAE3" stroke="#C4683A" stroke-width="2.5"/>
    <text x="490" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">LLC 1</text>
    <rect x="438" y="110" width="104" height="62" rx="6" fill="#1E2A8E"/>
    <text x="490" y="146" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">House 1</text>

    <!-- silo 2 -->
    <rect x="580" y="80" width="140" height="110" rx="8" fill="#EAF4EE" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="650" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">LLC 2</text>
    <rect x="598" y="110" width="104" height="62" rx="6" fill="#1E2A8E"/>
    <text x="650" y="146" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">House 2</text>

    <!-- silo 3 -->
    <rect x="420" y="205" width="140" height="110" rx="8" fill="#EAF4EE" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="490" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">LLC 3</text>
    <rect x="438" y="235" width="104" height="62" rx="6" fill="#1E2A8E"/>
    <text x="490" y="271" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">House 3</text>

    <!-- silo 4 -->
    <rect x="580" y="205" width="140" height="110" rx="8" fill="#EAF4EE" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="650" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">LLC 4</text>
    <rect x="598" y="235" width="104" height="62" rx="6" fill="#1E2A8E"/>
    <text x="650" y="271" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">House 4</text>
  </g>

  <!-- claim arrow into silo 1 only -->
  <line x1="490" y1="365" x2="490" y2="194" stroke="#C4683A" stroke-width="3"/>
  <polygon points="490,190 484,202 496,202" fill="#C4683A"/>
  <text x="570" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Claim at House 1 stays in LLC 1</text>
</svg>
