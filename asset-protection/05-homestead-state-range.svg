<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
  <text x="32" y="40" font-size="20" font-weight="bold" fill="#141B5C">Homestead Protection Varies by State</text>
  <text x="32" y="62" font-size="13" fill="#374151">How much primary-home equity is shielded from ordinary creditors (illustrative)</text>

  <!-- baseline -->
  <line x1="200" y1="110" x2="200" y2="350" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Bar 1: Unlimited (FL / TX) -->
  <rect x="200" y="118" width="380" height="48" fill="#3E9B6B"/>
  <text x="32" y="148" font-size="14" font-weight="bold" fill="#111827">FL / TX</text>
  <text x="32" y="165" font-size="11" fill="#374151">strong states</text>
  <text x="214" y="148" font-size="14" font-weight="bold" fill="#FFFFFF">Unlimited equity protected</text>
  <text x="555" y="148" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="end">∞</text>

  <!-- Bar 2: Capped mid -->
  <rect x="200" y="198" width="150" height="48" fill="#D4AF37"/>
  <text x="32" y="228" font-size="14" font-weight="bold" fill="#111827">Mid-range</text>
  <text x="32" y="245" font-size="11" fill="#374151">capped state</text>
  <text x="214" y="228" font-size="13" font-weight="bold" fill="#141B5C">Tens to low hundreds of $K</text>

  <!-- Bar 3: Low -->
  <rect x="200" y="278" width="36" height="48" fill="#C4683A"/>
  <text x="32" y="308" font-size="14" font-weight="bold" fill="#111827">Low state</text>
  <text x="32" y="325" font-size="11" fill="#374151">weak shield</text>
  <text x="246" y="308" font-size="13" font-weight="bold" fill="#141B5C">A few thousand $</text>

  <!-- arrow axis -->
  <text x="200" y="372" font-size="11" fill="#374151">less protected</text>
  <text x="580" y="372" font-size="11" fill="#374151" text-anchor="end">more protected</text>
  <line x1="200" y1="356" x2="580" y2="356" stroke="#374151" stroke-width="1.5"/>
  <path d="M580 356 l-8 -4 l0 8 z" fill="#374151"/>

  <text x="32" y="392" font-size="10" fill="#374151">Amounts are illustrative. Verify your own state's current homestead figure.</text>
</svg>
