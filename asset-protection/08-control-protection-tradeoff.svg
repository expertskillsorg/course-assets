<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A tradeoff scale showing that more control means less protection. A revocable trust sits at the high-control, low-protection end. An irrevocable trust sits at the low-control, high-protection end.">
  <rect x="0" y="0" width="640" height="360" fill="#FFFFFF"/>
  <text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#141B5C">The Control vs Protection Tradeoff</text>

  <!-- The sliding scale bar -->
  <rect x="80" y="170" width="480" height="14" rx="7" fill="#E5E7EB"/>
  <!-- gradient feel via two colored halves -->
  <rect x="80" y="170" width="240" height="14" rx="7" fill="#C4683A"/>
  <rect x="320" y="170" width="240" height="14" rx="7" fill="#3E9B6B"/>

  <!-- End labels -->
  <text x="80" y="220" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">More control</text>
  <text x="80" y="238" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#374151">Less protection</text>
  <text x="560" y="220" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Less control</text>
  <text x="560" y="238" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#374151">More protection</text>

  <!-- Arrow showing direction of tradeoff -->
  <text x="320" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#6B7280">The more you keep your hands on it, the more a creditor can reach it.</text>

  <!-- Revocable marker (control end) -->
  <circle cx="150" cy="177" r="12" fill="#C4683A" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="70" y="92" width="160" height="58" rx="8" fill="#FFFFFF" stroke="#C4683A" stroke-width="2"/>
  <text x="150" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C4683A">Revocable trust</text>
  <text x="150" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">You stay in control</text>
  <line x1="150" y1="150" x2="150" y2="165" stroke="#C4683A" stroke-width="2"/>

  <!-- Irrevocable marker (protection end) -->
  <circle cx="490" cy="177" r="12" fill="#3E9B6B" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="410" y="92" width="170" height="58" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <text x="495" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3E9B6B">Irrevocable trust</text>
  <text x="495" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">You give up control</text>
  <line x1="490" y1="150" x2="490" y2="165" stroke="#3E9B6B" stroke-width="2"/>

  <!-- Footnote -->
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Creditor protection lives at the right end, and it costs you control to get there.</text>
</svg>
