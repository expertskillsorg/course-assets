<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Protection Priority Ladder</text>
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#374151">Climb from the bottom: cheapest and fastest first</text>

  <!-- arrow showing cost/complexity rising -->
  <line x1="40" y1="410" x2="40" y2="95" stroke="#374151" stroke-width="2"/>
  <polygon points="40,86 35,98 45,98" fill="#374151"/>
  <text x="28" y="250" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 28 250)">More cost, effort, and complexity</text>

  <!-- Rung 4: Trusts (top) -->
  <rect x="90" y="92" width="510" height="68" rx="8" fill="#141B5C"/>
  <text x="112" y="124" font-size="17" font-weight="bold" fill="#ffffff">4. Trusts</text>
  <text x="112" y="146" font-size="12.5" fill="#E5E7EB">Most complex and costly. Only if lower layers leave a real gap.</text>

  <!-- Rung 3: Entities -->
  <rect x="90" y="172" width="510" height="68" rx="8" fill="#1E2A8E"/>
  <text x="112" y="204" font-size="17" font-weight="bold" fill="#ffffff">3. Entities (LLCs)</text>
  <text x="112" y="226" font-size="12.5" fill="#E5E7EB">Yearly cost and upkeep. Set up only for activities that create risk.</text>

  <!-- Rung 2: Exemptions -->
  <rect x="90" y="252" width="510" height="68" rx="8" fill="#3E9B6B"/>
  <text x="112" y="284" font-size="17" font-weight="bold" fill="#ffffff">2. Exemptions</text>
  <text x="112" y="306" font-size="12.5" fill="#ffffff">Little or no cost. Fund retirement, confirm your homestead and titling.</text>

  <!-- Rung 1: Insurance (bottom) -->
  <rect x="90" y="332" width="510" height="68" rx="8" fill="#D4AF37"/>
  <text x="112" y="364" font-size="17" font-weight="bold" fill="#111827">1. Insurance</text>
  <text x="112" y="386" font-size="12.5" fill="#111827">Cheapest per dollar, ready in days. Stops most claims first. Start here.</text>
</svg>
