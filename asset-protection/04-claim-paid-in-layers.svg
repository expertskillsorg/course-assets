<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How a Large Claim Gets Paid, in Layers</text>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#374151">A $1,000,000 claim against a homeowner with a $300,000 base limit and a $1,000,000 umbrella</text>

  <!-- incoming claim arrow -->
  <text x="70" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">CLAIM</text>
  <text x="70" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">$1,000,000</text>
  <line x1="110" y1="150" x2="190" y2="150" stroke="#C4683A" stroke-width="3"/>
  <polygon points="190,143 205,150 190,157" fill="#C4683A"/>

  <!-- Layer 1: primary policy -->
  <rect x="210" y="100" width="150" height="100" rx="8" fill="#1E2A8E"/>
  <text x="285" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Primary policy</text>
  <text x="285" y="154" text-anchor="middle" font-size="12" fill="#ffffff">pays first</text>
  <text x="285" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#D4AF37">$300,000</text>

  <line x1="360" y1="150" x2="395" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="395,144 408,150 395,156" fill="#374151"/>
  <text x="384" y="138" text-anchor="middle" font-size="11" fill="#374151">$700k left</text>

  <!-- Layer 2: umbrella -->
  <rect x="412" y="100" width="150" height="100" rx="8" fill="#3E9B6B"/>
  <text x="487" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Umbrella policy</text>
  <text x="487" y="154" text-anchor="middle" font-size="12" fill="#ffffff">pays next</text>
  <text x="487" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">$700,000</text>

  <line x1="562" y1="150" x2="597" y2="150" stroke="#374151" stroke-width="2"/>
  <polygon points="597,144 610,150 597,156" fill="#374151"/>
  <text x="585" y="138" text-anchor="middle" font-size="11" fill="#374151">$0 left</text>

  <!-- Layer 3: personal assets -->
  <rect x="614" y="100" width="92" height="100" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <text x="660" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Your</text>
  <text x="660" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">assets</text>
  <text x="660" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#3E9B6B">$0</text>

  <!-- caption band -->
  <rect x="40" y="250" width="640" height="58" rx="8" fill="#F3F4F6"/>
  <text x="60" y="278" font-size="13" fill="#374151">The base policy pays up to its limit. The umbrella picks up the rest of a covered claim, up to its</text>
  <text x="60" y="298" font-size="13" fill="#374151">own limit. Only what is left after both layers run out would ever reach your personal assets.</text>

  <!-- without umbrella note -->
  <rect x="40" y="328" width="640" height="62" rx="8" fill="#FBEFEA"/>
  <text x="60" y="354" font-size="13" font-weight="bold" fill="#C4683A">Without the umbrella:</text>
  <text x="190" y="354" font-size="13" fill="#374151">the base policy pays $300,000 and the remaining</text>
  <text x="60" y="374" font-size="13" font-weight="bold" fill="#C4683A">$700,000</text>
  <text x="118" y="374" font-size="13" fill="#374151">comes straight out of your savings, home equity, and future wages.</text>
</svg>
