<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">When You Set Up Protection Decides Whether It Holds</text>

  <!-- main timeline arrow -->
  <line x1="60" y1="150" x2="660" y2="150" stroke="#374151" stroke-width="3"/>
  <polygon points="660,150 648,143 648,157" fill="#374151"/>
  <text x="60" y="140" font-size="13" fill="#374151">Clear skies, no trouble in sight</text>
  <text x="640" y="140" text-anchor="end" font-size="13" fill="#374151">Time</text>

  <!-- the claim event marker -->
  <line x1="470" y1="95" x2="470" y2="300" stroke="#C4683A" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="470" cy="150" r="9" fill="#C4683A"/>
  <text x="470" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Claim becomes foreseeable</text>
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#C4683A">(accident, demand letter, dispute)</text>

  <!-- safe zone -->
  <rect x="60" y="170" width="380" height="56" rx="8" fill="#3E9B6B"/>
  <text x="250" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">SET UP EARLY = SAFE</text>
  <text x="250" y="215" text-anchor="middle" font-size="12" fill="#FFFFFF">Hard for a creditor to challenge later</text>

  <!-- danger zone -->
  <rect x="490" y="170" width="170" height="56" rx="8" fill="#C4683A"/>
  <text x="575" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">SET UP NOW = RISKY</text>
  <text x="575" y="215" text-anchor="middle" font-size="11" fill="#FFFFFF">Looks like a dodge; can be unwound</text>

  <!-- early marker -->
  <circle cx="160" cy="150" r="9" fill="#1E2A8E"/>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#1E2A8E">Protection put</text>
  <text x="160" y="286" text-anchor="middle" font-size="12" fill="#1E2A8E">in place here</text>

  <!-- lookback note -->
  <text x="360" y="345" text-anchor="middle" font-size="11" fill="#374151">A creditor can "look back" at recent moves, so the further from the claim you act, the stronger your protection.</text>
</svg>
