<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Asset Exposure Matrix</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">Where common assets fall by how reachable and how liquid they are</text>

  <!-- Quadrant backgrounds -->
  <rect x="110" y="90" width="230" height="160" fill="#3E9B6B" opacity="0.14"/>
  <rect x="340" y="90" width="230" height="160" fill="#C4683A" opacity="0.14"/>
  <rect x="110" y="250" width="230" height="160" fill="#3E9B6B" opacity="0.20"/>
  <rect x="340" y="250" width="230" height="160" fill="#C4683A" opacity="0.20"/>

  <!-- Axis lines -->
  <line x1="110" y1="90" x2="110" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="410" x2="570" y2="410" stroke="#374151" stroke-width="2"/>
  <line x1="340" y1="90" x2="340" y2="410" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="110" y1="250" x2="570" y2="250" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Axis labels -->
  <text x="225" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">PROTECTED</text>
  <text x="455" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">EXPOSED</text>
  <text x="225" y="450" text-anchor="middle" font-size="11" fill="#374151">creditors usually can't touch it</text>
  <text x="455" y="450" text-anchor="middle" font-size="11" fill="#374151">a judgment can reach it</text>

  <text x="92" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E" transform="rotate(-90 92 170)">LIQUID</text>
  <text x="92" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E" transform="rotate(-90 92 330)">ILLIQUID</text>

  <!-- Top-left: protected + liquid -->
  <text x="225" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Protected &amp; liquid</text>
  <text x="225" y="142" text-anchor="middle" font-size="12" fill="#111827">401(k) / pension</text>
  <text x="225" y="164" text-anchor="middle" font-size="12" fill="#111827">IRA (state limits)</text>

  <!-- Top-right: exposed + liquid -->
  <text x="455" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Exposed &amp; liquid</text>
  <text x="455" y="142" text-anchor="middle" font-size="12" fill="#111827">Brokerage account</text>
  <text x="455" y="164" text-anchor="middle" font-size="12" fill="#111827">Cash / savings</text>
  <text x="455" y="186" text-anchor="middle" font-size="11" fill="#C4683A" font-weight="bold">easiest to seize</text>

  <!-- Bottom-left: protected + illiquid -->
  <text x="225" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Protected &amp; illiquid</text>
  <text x="225" y="302" text-anchor="middle" font-size="12" fill="#111827">Home equity in a</text>
  <text x="225" y="320" text-anchor="middle" font-size="12" fill="#111827">strong-homestead state</text>

  <!-- Bottom-right: exposed + illiquid -->
  <text x="455" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Exposed &amp; illiquid</text>
  <text x="455" y="302" text-anchor="middle" font-size="12" fill="#111827">Home equity in a</text>
  <text x="455" y="320" text-anchor="middle" font-size="12" fill="#111827">weak-homestead state</text>
  <text x="455" y="342" text-anchor="middle" font-size="12" fill="#111827">Rental property, valuables</text>
</svg>
