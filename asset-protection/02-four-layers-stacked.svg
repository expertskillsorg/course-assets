<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Four-Layer Defense</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">A claim from outside must break through every layer to reach your wealth</text>

  <!-- Layer 1: Insurance (outermost) -->
  <rect x="70" y="80" width="500" height="330" rx="14" fill="#1E2A8E"/>
  <text x="320" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Layer 1  Insurance</text>

  <!-- Layer 2: Exemptions -->
  <rect x="120" y="118" width="400" height="272" rx="12" fill="#3E9B6B"/>
  <text x="320" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Layer 2  Statutory Exemptions</text>

  <!-- Layer 3: Entities -->
  <rect x="170" y="156" width="300" height="214" rx="10" fill="#C4683A"/>
  <text x="320" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Layer 3  Business Entities</text>

  <!-- Layer 4: Trusts -->
  <rect x="220" y="194" width="200" height="138" rx="8" fill="#D4AF37"/>
  <text x="320" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Layer 4  Trusts</text>

  <!-- Core: personal wealth -->
  <rect x="262" y="236" width="116" height="62" rx="8" fill="#141B5C"/>
  <text x="320" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Your</text>
  <text x="320" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Wealth</text>

  <!-- Threat arrow arriving from outside -->
  <text x="40" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">Lawsuit</text>
  <text x="40" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">threat</text>
  <line x1="20" y1="270" x2="64" y2="270" stroke="#C4683A" stroke-width="4"/>
  <polygon points="64,262 80,270 64,278" fill="#C4683A"/>

  <text x="320" y="428" text-anchor="middle" font-size="12" fill="#374151">Cheapest and easiest on the outside; more costly and involved as you move in</text>
</svg>
