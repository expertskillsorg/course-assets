<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">How an AI reads your prompt and predicts the next words</text>

  <!-- Prompt box -->
  <rect x="40" y="70" width="300" height="120" rx="10" fill="#1E2A8E"/>
  <text x="60" y="100" font-size="13" fill="#D4AF37" font-weight="bold">YOUR PROMPT</text>
  <text x="60" y="128" font-size="14" fill="#FFFFFF">Write a warm, 600-word blog post</text>
  <text x="60" y="150" font-size="14" fill="#FFFFFF">for small-business owners about</text>
  <text x="60" y="172" font-size="14" fill="#FFFFFF">sending fewer, better emails...</text>

  <!-- Arrow 1 -->
  <line x1="345" y1="130" x2="415" y2="130" stroke="#374151" stroke-width="3"/>
  <polygon points="415,130 403,123 403,137" fill="#374151"/>

  <!-- Read step -->
  <rect x="420" y="70" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="440" y="100" font-size="13" fill="#3E9B6B" font-weight="bold">THE AI READS EVERY WORD</text>
  <text x="440" y="126" font-size="13" fill="#374151">It treats each word as a clue about</text>
  <text x="440" y="146" font-size="13" fill="#374151">what should come next. More clues</text>
  <text x="440" y="166" font-size="13" fill="#374151">means a narrower, sharper guess.</text>

  <!-- Arrow down -->
  <line x1="570" y1="195" x2="570" y2="232" stroke="#374151" stroke-width="3"/>
  <polygon points="570,232 563,220 577,220" fill="#374151"/>

  <!-- Predict step -->
  <text x="380" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">It predicts the next word, over and over, building the answer one word at a time</text>

  <!-- Two paths -->
  <!-- Vague path -->
  <rect x="40" y="285" width="330" height="95" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2.5"/>
  <text x="60" y="312" font-size="13" font-weight="bold" fill="#C4683A">Few clues (vague prompt)</text>
  <text x="60" y="336" font-size="12.5" fill="#374151">Many next words seem equally likely, so</text>
  <text x="60" y="354" font-size="12.5" fill="#374151">it picks the safest, most average one.</text>
  <text x="60" y="372" font-size="12.5" fill="#C4683A" font-weight="bold">Result: generic, forgettable answer</text>

  <!-- Specific path -->
  <rect x="390" y="285" width="330" height="95" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="410" y="312" font-size="13" font-weight="bold" fill="#3E9B6B">Many clues (specific prompt)</text>
  <text x="410" y="336" font-size="12.5" fill="#374151">The clues point clearly to one kind of</text>
  <text x="410" y="354" font-size="12.5" fill="#374151">word, so the guesses stay on target.</text>
  <text x="410" y="372" font-size="12.5" fill="#3E9B6B" font-weight="bold">Result: specific, useful answer</text>
</svg>
