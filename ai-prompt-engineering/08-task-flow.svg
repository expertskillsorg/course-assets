<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Arial, sans-serif">
  <rect width="880" height="360" fill="#FFFFFF"/>

  <!-- Big task block -->
  <rect x="40" y="40" width="200" height="80" rx="10" fill="#141B5C"/>
  <text x="140" y="72" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">One Big Task</text>
  <text x="140" y="96" text-anchor="middle" fill="#D4AF37" font-size="12">Market analysis</text>

  <!-- Splitting arrow -->
  <path d="M240 80 L300 80" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M296 74 L304 80 L296 86 Z" fill="#374151"/>
  <text x="270" y="68" text-anchor="middle" fill="#374151" font-size="11">split</text>

  <!-- Five step boxes in a flow -->
  <!-- Step 1 -->
  <rect x="320" y="150" width="150" height="64" rx="8" fill="#1E2A8E"/>
  <text x="395" y="178" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">1. Customer</text>
  <text x="395" y="197" text-anchor="middle" fill="#FFFFFF" font-size="10">Who buys it?</text>

  <!-- Step 2 -->
  <rect x="500" y="150" width="150" height="64" rx="8" fill="#1E2A8E"/>
  <text x="575" y="178" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">2. Competitors</text>
  <text x="575" y="197" text-anchor="middle" fill="#FFFFFF" font-size="10">Who else sells?</text>

  <!-- Step 3 -->
  <rect x="680" y="150" width="150" height="64" rx="8" fill="#1E2A8E"/>
  <text x="755" y="178" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">3. Pricing</text>
  <text x="755" y="197" text-anchor="middle" fill="#FFFFFF" font-size="10">What price band?</text>

  <!-- Step 4 -->
  <rect x="500" y="266" width="150" height="64" rx="8" fill="#3E9B6B"/>
  <text x="575" y="294" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">4. Risks</text>
  <text x="575" y="313" text-anchor="middle" fill="#FFFFFF" font-size="10">What could fail?</text>

  <!-- Step 5 -->
  <rect x="680" y="266" width="150" height="64" rx="8" fill="#3E9B6B"/>
  <text x="755" y="294" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">5. Launch plan</text>
  <text x="755" y="313" text-anchor="middle" fill="#FFFFFF" font-size="10">How to reach them?</text>

  <!-- Connect big task to step 1 -->
  <path d="M300 80 L395 80 L395 144" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M389 140 L395 148 L401 140 Z" fill="#374151"/>

  <!-- Flow arrows feeding next -->
  <!-- 1 -> 2 -->
  <path d="M470 182 L494 182" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M490 176 L498 182 L490 188 Z" fill="#D4AF37"/>
  <!-- 2 -> 3 -->
  <path d="M650 182 L674 182" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M670 176 L678 182 L670 188 Z" fill="#D4AF37"/>
  <!-- 3 -> 4 (down and left) -->
  <path d="M755 214 L755 240 L575 240 L575 260" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M569 256 L575 264 L581 256 Z" fill="#D4AF37"/>
  <!-- 4 -> 5 -->
  <path d="M650 298 L674 298" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <path d="M670 292 L678 298 L670 304 Z" fill="#D4AF37"/>

  <!-- Legend -->
  <text x="40" y="320" fill="#374151" font-size="12" font-weight="bold">Each gold arrow:</text>
  <text x="40" y="338" fill="#374151" font-size="12">one answer feeds the next prompt</text>
</svg>
