<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Same task, two prompts</text>

  <!-- BEFORE column -->
  <rect x="30" y="56" width="310" height="372" rx="10" fill="#ffffff" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="30" y="56" width="310" height="38" rx="10" fill="#C4683A"/>
  <rect x="30" y="80" width="310" height="14" fill="#C4683A"/>
  <text x="185" y="81" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">VAGUE PROMPT</text>

  <text x="50" y="120" font-size="13" font-style="italic" fill="#374151">"write a job description for a</text>
  <text x="50" y="138" font-size="13" font-style="italic" fill="#374151">customer success coordinator"</text>

  <text x="50" y="170" font-size="12" font-weight="bold" fill="#C4683A">The weak result</text>
  <!-- generic short block -->
  <rect x="50" y="182" width="270" height="9" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="198" width="240" height="9" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="214" width="258" height="9" rx="3" fill="#E5E7EB"/>
  <rect x="50" y="230" width="180" height="9" rx="3" fill="#E5E7EB"/>

  <text x="50" y="280" font-size="12" fill="#374151">Could fit any company</text>
  <text x="50" y="302" font-size="12" fill="#374151">No company facts</text>
  <text x="50" y="324" font-size="12" fill="#374151">No set structure</text>
  <text x="50" y="346" font-size="12" fill="#374151">Forgettable, generic voice</text>

  <text x="185" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#C4683A">Generic. Fits no one.</text>

  <!-- arrow -->
  <text x="360" y="250" text-anchor="middle" font-size="28" fill="#D4AF37">&#8594;</text>

  <!-- AFTER column -->
  <rect x="380" y="56" width="310" height="372" rx="10" fill="#ffffff" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="380" y="56" width="310" height="38" rx="10" fill="#1E2A8E"/>
  <rect x="380" y="80" width="310" height="14" fill="#1E2A8E"/>
  <text x="535" y="81" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">FRAMEWORK PROMPT</text>

  <text x="400" y="116" font-size="11" fill="#374151">Role + Context + Task + Format + Example</text>

  <text x="400" y="142" font-size="12" font-weight="bold" fill="#3E9B6B">The strong result</text>
  <!-- structured block: heading + bullets -->
  <rect x="400" y="152" width="160" height="10" rx="3" fill="#1E2A8E"/>
  <text x="400" y="184" font-size="10" font-weight="bold" fill="#141B5C">Key Responsibilities</text>
  <circle cx="406" cy="198" r="3" fill="#3E9B6B"/><rect x="416" y="194" width="240" height="8" rx="3" fill="#E5E7EB"/>
  <circle cx="406" cy="216" r="3" fill="#3E9B6B"/><rect x="416" y="212" width="220" height="8" rx="3" fill="#E5E7EB"/>
  <text x="400" y="244" font-size="10" font-weight="bold" fill="#141B5C">Required Qualifications</text>
  <circle cx="406" cy="258" r="3" fill="#3E9B6B"/><rect x="416" y="254" width="230" height="8" rx="3" fill="#E5E7EB"/>
  <circle cx="406" cy="276" r="3" fill="#3E9B6B"/><rect x="416" y="272" width="200" height="8" rx="3" fill="#E5E7EB"/>

  <text x="400" y="312" font-size="12" fill="#374151">Names the 90-person company</text>
  <text x="400" y="334" font-size="12" fill="#374151">Mentions remote + onboarding</text>
  <text x="400" y="356" font-size="12" fill="#374151">Exact sections requested</text>

  <text x="535" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Specific. Ready to use.</text>
</svg>
