<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">Same Research, Three Shapes</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#374151">The words barely change. How fast you can use them does.</text>

  <!-- Column 1: Paragraph -->
  <g>
    <rect x="24" y="74" width="208" height="296" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="128" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">Paragraph</text>
    <line x1="44" y1="120" x2="212" y2="120" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="138" x2="212" y2="138" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="156" x2="212" y2="156" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="174" x2="200" y2="174" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="192" x2="212" y2="192" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="210" x2="184" y2="210" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <rect x="44" y="324" width="168" height="28" rx="14" fill="#C4683A"/>
    <text x="128" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Slow to use</text>
  </g>

  <!-- Column 2: Table -->
  <g>
    <rect x="256" y="74" width="208" height="296" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="360" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">Table</text>
    <rect x="276" y="116" width="168" height="24" fill="#1E2A8E"/>
    <line x1="332" y1="116" x2="332" y2="212" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="388" y1="116" x2="388" y2="212" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="276" y="140" width="168" height="24" fill="#F3F4F6"/>
    <rect x="276" y="164" width="168" height="24" fill="#ffffff"/>
    <rect x="276" y="188" width="168" height="24" fill="#F3F4F6"/>
    <rect x="276" y="116" width="168" height="96" fill="none" stroke="#1E2A8E" stroke-width="1.5"/>
    <line x1="276" y1="140" x2="444" y2="140" stroke="#1E2A8E" stroke-width="1"/>
    <line x1="276" y1="164" x2="444" y2="164" stroke="#1E2A8E" stroke-width="1"/>
    <line x1="276" y1="188" x2="444" y2="188" stroke="#1E2A8E" stroke-width="1"/>
    <rect x="276" y="324" width="168" height="28" rx="14" fill="#3E9B6B"/>
    <text x="360" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Fastest to scan</text>
  </g>

  <!-- Column 3: Checklist -->
  <g>
    <rect x="488" y="74" width="208" height="296" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="592" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E2A8E">Checklist</text>
    <g>
      <rect x="508" y="120" width="16" height="16" rx="3" fill="#3E9B6B"/>
      <path d="M511 128 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="534" y1="128" x2="668" y2="128" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="508" y="152" width="16" height="16" rx="3" fill="#3E9B6B"/>
      <path d="M511 160 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="534" y1="160" x2="652" y2="160" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="508" y="184" width="16" height="16" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
      <line x1="534" y1="192" x2="668" y2="192" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="508" y="216" width="16" height="16" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
      <line x1="534" y1="224" x2="640" y2="224" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    </g>
    <rect x="508" y="324" width="168" height="28" rx="14" fill="#D4AF37"/>
    <text x="592" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">Fastest to act on</text>
  </g>
</svg>
