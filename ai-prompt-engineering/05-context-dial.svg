<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, sans-serif">
  <rect width="720" height="360" fill="#FFFFFF"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">The Context Dial</text>

  <!-- Dial arc -->
  <path d="M 180 250 A 180 180 0 0 1 540 250" fill="none" stroke="#E5E7EB" stroke-width="16" stroke-linecap="round"/>
  <!-- Colored segments over arc -->
  <path d="M 180 250 A 180 180 0 0 1 244 118" fill="none" stroke="#C4683A" stroke-width="16" stroke-linecap="round"/>
  <path d="M 290 92 A 180 180 0 0 1 430 92" fill="none" stroke="#3E9B6B" stroke-width="16" stroke-linecap="round"/>
  <path d="M 476 118 A 180 180 0 0 1 540 250" fill="none" stroke="#C4683A" stroke-width="16" stroke-linecap="round"/>

  <!-- Needle pointing to center (just right) -->
  <line x1="360" y1="250" x2="360" y2="96" stroke="#1E2A8E" stroke-width="6" stroke-linecap="round"/>
  <circle cx="360" cy="250" r="12" fill="#1E2A8E"/>

  <!-- Tick labels on arc -->
  <text x="150" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">Too little</text>
  <text x="360" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">Just right</text>
  <text x="570" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#C4683A">Too much</text>

  <!-- Effect cards -->
  <rect x="40" y="290" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="56" y="313" font-size="13" font-weight="bold" fill="#C4683A">Generic answer</text>
  <text x="56" y="333" font-size="12" fill="#374151">Falls back on the average</text>

  <rect x="260" y="290" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="1.5"/>
  <text x="276" y="313" font-size="13" font-weight="bold" fill="#3E9B6B">Sharp, on-target</text>
  <text x="276" y="333" font-size="12" fill="#374151">Every fact earns its place</text>

  <rect x="480" y="290" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="496" y="313" font-size="13" font-weight="bold" fill="#C4683A">Buried answer</text>
  <text x="496" y="333" font-size="12" fill="#374151">Noise drowns the point</text>
</svg>
