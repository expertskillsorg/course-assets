<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#141B5C">The R-C-T-F-E framework</text>
  <text x="40" y="70" font-size="14" fill="#374151">Five parts stack into one clear prompt</text>

  <!-- Stack of blocks: Examples on top, Role at base -->
  <!-- E -->
  <rect x="40" y="96" width="360" height="52" rx="8" fill="#C4683A"/>
  <text x="60" y="121" font-size="17" font-weight="bold" fill="#FFFFFF">E  Examples</text>
  <text x="60" y="139" font-size="12" fill="#FBEDE6">What does a good version look like?</text>

  <!-- F -->
  <rect x="40" y="158" width="360" height="52" rx="8" fill="#3E9B6B"/>
  <text x="60" y="183" font-size="17" font-weight="bold" fill="#FFFFFF">F  Format</text>
  <text x="60" y="201" font-size="12" fill="#E7F3EC">What shape should the answer take?</text>

  <!-- T -->
  <rect x="40" y="220" width="360" height="52" rx="8" fill="#D4AF37"/>
  <text x="60" y="245" font-size="17" font-weight="bold" fill="#141B5C">T  Task</text>
  <text x="60" y="263" font-size="12" fill="#5A4A12">What exactly do you want done?</text>

  <!-- C -->
  <rect x="40" y="282" width="360" height="52" rx="8" fill="#1E2A8E"/>
  <text x="60" y="307" font-size="17" font-weight="bold" fill="#FFFFFF">C  Context</text>
  <text x="60" y="325" font-size="12" fill="#D6D9F0">What is the situation?</text>

  <!-- R -->
  <rect x="40" y="344" width="360" height="52" rx="8" fill="#141B5C"/>
  <text x="60" y="369" font-size="17" font-weight="bold" fill="#FFFFFF">R  Role</text>
  <text x="60" y="387" font-size="12" fill="#C9CDE8">Who should the AI act as?</text>

  <!-- Brace and result on the right -->
  <path d="M 416 96 q 14 0 14 16 l 0 118 q 0 16 14 16 q -14 0 -14 16 l 0 118 q 0 16 -14 16" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="452" y="196" width="148" height="104" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <text x="526" y="232" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">One clear</text>
  <text x="526" y="252" font-size="14" font-weight="bold" fill="#141B5C" text-anchor="middle">prompt</text>
  <text x="526" y="278" font-size="12" fill="#374151" text-anchor="middle">expert result</text>
</svg>
