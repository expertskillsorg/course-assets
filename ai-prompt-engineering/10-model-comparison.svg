<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#FFFFFF"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#141B5C">Three Capable Assistants, Three Leanings</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#374151">General tendencies, not fixed rankings. Tools update often, so judge by current behavior.</text>

  <!-- ChatGPT card -->
  <rect x="30" y="90" width="200" height="290" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="30" y="90" width="200" height="52" rx="12" fill="#1E2A8E"/>
  <rect x="30" y="120" width="200" height="22" fill="#1E2A8E"/>
  <text x="130" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">ChatGPT</text>
  <text x="130" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Flexible all-rounder</text>
  <text x="130" y="206" text-anchor="middle" font-size="12" fill="#374151">Conversational and</text>
  <text x="130" y="224" text-anchor="middle" font-size="12" fill="#374151">natural; shifts tone</text>
  <text x="130" y="242" text-anchor="middle" font-size="12" fill="#374151">with ease.</text>
  <text x="130" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">BEST FIT</text>
  <text x="130" y="310" text-anchor="middle" font-size="12" fill="#111827">Writing, rewriting,</text>
  <text x="130" y="328" text-anchor="middle" font-size="12" fill="#111827">brainstorming,</text>
  <text x="130" y="346" text-anchor="middle" font-size="12" fill="#111827">everyday tasks</text>

  <!-- Claude card -->
  <rect x="260" y="90" width="200" height="290" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="260" y="90" width="200" height="52" rx="12" fill="#3E9B6B"/>
  <rect x="260" y="120" width="200" height="22" fill="#3E9B6B"/>
  <text x="360" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Claude</text>
  <text x="360" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Careful and thorough</text>
  <text x="360" y="206" text-anchor="middle" font-size="12" fill="#374151">Thoughtful, longer</text>
  <text x="360" y="224" text-anchor="middle" font-size="12" fill="#374151">reasoning; flags</text>
  <text x="360" y="242" text-anchor="middle" font-size="12" fill="#374151">what's uncertain.</text>
  <text x="360" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">BEST FIT</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#111827">Long documents,</text>
  <text x="360" y="328" text-anchor="middle" font-size="12" fill="#111827">nuanced instructions,</text>
  <text x="360" y="346" text-anchor="middle" font-size="12" fill="#111827">careful reasoning</text>

  <!-- Gemini card -->
  <rect x="490" y="90" width="200" height="290" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="490" y="90" width="200" height="52" rx="12" fill="#D4AF37"/>
  <rect x="490" y="120" width="200" height="22" fill="#D4AF37"/>
  <text x="590" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">Gemini</text>
  <text x="590" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Fast and tidy</text>
  <text x="590" y="206" text-anchor="middle" font-size="12" fill="#374151">Quick, well</text>
  <text x="590" y="224" text-anchor="middle" font-size="12" fill="#374151">organized, scannable</text>
  <text x="590" y="242" text-anchor="middle" font-size="12" fill="#374151">factual answers.</text>
  <text x="590" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#C4683A">BEST FIT</text>
  <text x="590" y="310" text-anchor="middle" font-size="12" fill="#111827">Tables, lists,</text>
  <text x="590" y="328" text-anchor="middle" font-size="12" fill="#111827">comparisons,</text>
  <text x="590" y="346" text-anchor="middle" font-size="12" fill="#111827">structured output</text>

  <text x="360" y="405" text-anchor="middle" font-size="11" font-style="italic" fill="#374151">The same five-part framework works on all three. The tool is just where you point it.</text>
</svg>
