<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Refinement Loop</text>

  <!-- Step 1: Get an answer (top) -->
  <rect x="240" y="60" width="160" height="56" rx="10" fill="#1E2A8E"/>
  <text x="320" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Get an answer</text>
  <text x="320" y="103" text-anchor="middle" font-size="12" fill="#E5E7EB">the AI's first reply</text>

  <!-- Step 2: Diagnose (right) -->
  <rect x="452" y="182" width="160" height="56" rx="10" fill="#D4AF37"/>
  <text x="532" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Diagnose</text>
  <text x="532" y="225" text-anchor="middle" font-size="12" fill="#141B5C">name the weak part</text>

  <!-- Step 3: three moves (bottom) -->
  <rect x="160" y="300" width="320" height="80" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="320" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Apply one move</text>
  <rect x="174" y="332" width="92" height="36" rx="7" fill="#3E9B6B"/>
  <text x="220" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Correct</text>
  <rect x="274" y="332" width="92" height="36" rx="7" fill="#C4683A"/>
  <text x="320" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Constrain</text>
  <rect x="374" y="332" width="92" height="36" rx="7" fill="#1E2A8E"/>
  <text x="420" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Expand</text>

  <!-- arrows -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
  <!-- answer -> diagnose -->
  <path d="M400 100 C 470 110, 525 140, 532 178" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- diagnose -> moves -->
  <path d="M520 240 C 500 290, 440 300, 420 326" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- moves -> answer (loop back) -->
  <path d="M220 332 C 90 300, 90 130, 236 96" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="70" y="218" text-anchor="middle" font-size="12" font-style="italic" fill="#374151" transform="rotate(-90 70 218)">repeat</text>
</svg>
