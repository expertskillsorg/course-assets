<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Coach's Referral Decision Flow</text>

  <!-- Step 1 -->
  <rect x="270" y="56" width="220" height="56" rx="10" fill="#1E2A8E"/>
  <text x="380" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">A concern is noticed</text>
  <text x="380" y="99" text-anchor="middle" font-size="12" fill="#FFFFFF">in a session or message</text>

  <!-- arrow -->
  <line x1="380" y1="112" x2="380" y2="142" stroke="#374151" stroke-width="2"/>
  <polygon points="380,150 374,140 386,140" fill="#374151"/>

  <!-- Decision diamond -->
  <polygon points="380,154 500,214 380,274 260,214" fill="#D4AF37"/>
  <text x="380" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Is it a red flag,</text>
  <text x="380" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">or out of scope?</text>

  <!-- NO branch left -->
  <line x1="260" y1="214" x2="150" y2="214" stroke="#3E9B6B" stroke-width="2"/>
  <polygon points="142,214 152,208 152,220" fill="#3E9B6B"/>
  <text x="205" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#3E9B6B">No</text>
  <rect x="30" y="186" width="112" height="56" rx="10" fill="#3E9B6B"/>
  <text x="86" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Keep coaching</text>
  <text x="86" y="228" text-anchor="middle" font-size="11" fill="#FFFFFF">the lifestyle levers</text>

  <!-- YES branch down -->
  <line x1="380" y1="274" x2="380" y2="304" stroke="#C4683A" stroke-width="2"/>
  <polygon points="380,312 374,302 386,302" fill="#C4683A"/>
  <text x="400" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">Yes</text>

  <!-- Refer steps -->
  <rect x="120" y="316" width="180" height="58" rx="10" fill="#C4683A"/>
  <text x="210" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Name the concern</text>
  <text x="210" y="358" text-anchor="middle" font-size="11" fill="#FFFFFF">calmly, no diagnosis</text>

  <rect x="320" y="316" width="180" height="58" rx="10" fill="#1E2A8E"/>
  <text x="410" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Refer to a clinician</text>
  <text x="410" y="358" text-anchor="middle" font-size="11" fill="#FFFFFF">and pause that topic</text>

  <rect x="520" y="316" width="180" height="58" rx="10" fill="#141B5C"/>
  <text x="610" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Document and</text>
  <text x="610" y="358" text-anchor="middle" font-size="11" fill="#FFFFFF">follow up gently</text>

  <line x1="300" y1="345" x2="318" y2="345" stroke="#374151" stroke-width="2"/>
  <polygon points="320,345 310,339 310,351" fill="#374151"/>
  <line x1="500" y1="345" x2="518" y2="345" stroke="#374151" stroke-width="2"/>
  <polygon points="520,345 510,339 510,351" fill="#374151"/>
</svg>
