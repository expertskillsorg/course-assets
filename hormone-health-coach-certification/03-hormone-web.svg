<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
  <text x="350" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Hormone Web: Each One Influences the Others</text>

  <!-- connecting lines (drawn first, behind nodes) -->
  <!-- top-left to top-right -->
  <line x1="200" y1="150" x2="500" y2="150" stroke="#374151" stroke-width="2"/>
  <!-- top-left to bottom-left -->
  <line x1="180" y1="180" x2="180" y2="320" stroke="#374151" stroke-width="2"/>
  <!-- top-right to bottom-right -->
  <line x1="520" y1="180" x2="520" y2="320" stroke="#374151" stroke-width="2"/>
  <!-- bottom-left to bottom-right -->
  <line x1="200" y1="350" x2="500" y2="350" stroke="#374151" stroke-width="2"/>
  <!-- diagonals -->
  <line x1="210" y1="175" x2="490" y2="325" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="490" y1="175" x2="210" y2="325" stroke="#E5E7EB" stroke-width="2"/>

  <!-- node: Stress / Cortisol (top-left, terracotta) -->
  <circle cx="180" cy="150" r="62" fill="#C4683A"/>
  <text x="180" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Stress</text>
  <text x="180" y="165" text-anchor="middle" font-size="14" fill="#ffffff">Cortisol</text>

  <!-- node: Sex hormones (top-right, navy) -->
  <circle cx="520" cy="150" r="62" fill="#1E2A8E"/>
  <text x="520" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Sex</text>
  <text x="520" y="161" text-anchor="middle" font-size="13" fill="#ffffff">hormones</text>
  <text x="520" y="178" text-anchor="middle" font-size="11" fill="#ffffff">estrogen, progest.</text>

  <!-- node: Blood sugar / Insulin (bottom-left, green) -->
  <circle cx="180" cy="350" r="62" fill="#3E9B6B"/>
  <text x="180" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Blood sugar</text>
  <text x="180" y="365" text-anchor="middle" font-size="14" fill="#ffffff">Insulin</text>

  <!-- node: Thyroid (bottom-right, gold) -->
  <circle cx="520" cy="350" r="62" fill="#D4AF37"/>
  <text x="520" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">Thyroid</text>
  <text x="520" y="365" text-anchor="middle" font-size="11" fill="#141B5C">sets the pace</text>

  <!-- caption -->
  <text x="350" y="438" text-anchor="middle" font-size="13" fill="#374151">Pull on one strand and the whole web moves.</text>
</svg>
