<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Hormone Feedback Loop</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#374151">The body senses a level, then adjusts production up or down</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1E2A8E"/>
    </marker>
  </defs>

  <!-- Center set point -->
  <circle cx="320" cy="232" r="58" fill="#F4F6FF" stroke="#D4AF37" stroke-width="3"/>
  <text x="320" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Healthy</text>
  <text x="320" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">set point</text>

  <!-- Sense node (top) -->
  <rect x="232" y="90" width="176" height="56" rx="10" fill="#1E2A8E"/>
  <text x="320" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Body senses</text>
  <text x="320" y="132" text-anchor="middle" font-size="13" fill="#ffffff">the hormone level</text>

  <!-- Low node (left) -->
  <rect x="40" y="300" width="200" height="62" rx="10" fill="#3E9B6B"/>
  <text x="140" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Level too LOW</text>
  <text x="140" y="344" text-anchor="middle" font-size="13" fill="#ffffff">gland makes MORE</text>

  <!-- High node (right) -->
  <rect x="400" y="300" width="200" height="62" rx="10" fill="#C4683A"/>
  <text x="500" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Level too HIGH</text>
  <text x="500" y="344" text-anchor="middle" font-size="13" fill="#ffffff">gland makes LESS</text>

  <!-- Arrows: sense -> branches -->
  <path d="M250 146 Q150 200 140 296" fill="none" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M390 146 Q490 200 500 296" fill="none" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrows: branches -> set point -->
  <path d="M222 322 Q300 300 268 268" fill="none" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M418 322 Q340 300 372 268" fill="none" stroke="#1E2A8E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow: set point -> sense (loop closes) -->
  <path d="M320 174 L320 150" fill="none" stroke="#D4AF37" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="320" y="400" text-anchor="middle" font-size="12.5" fill="#374151" font-style="italic">The loop runs continuously, holding the hormone near its set point</text>
</svg>
