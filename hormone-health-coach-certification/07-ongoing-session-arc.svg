<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Ongoing Session Arc</text>
  <text x="380" y="54" text-anchor="middle" font-size="13" fill="#374151">One loop each session, laddering toward the goal</text>

  <!-- The repeating loop (left side) -->
  <text x="170" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">The repeating loop</text>

  <!-- four nodes of the cycle -->
  <circle cx="170" cy="150" r="34" fill="#1E2A8E"/>
  <text x="170" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Review</text>

  <circle cx="270" cy="230" r="34" fill="#3E9B6B"/>
  <text x="270" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Focus</text>

  <circle cx="170" cy="310" r="34" fill="#D4AF37"/>
  <text x="170" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Commit</text>

  <circle cx="70" cy="230" r="34" fill="#C4683A"/>
  <text x="70" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Work</text>

  <!-- cycle arrows clockwise: Review->Focus->... wait order is Review, Focus, Work, Commit -->
  <path d="M198 170 Q240 188 248 206" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>
  <path d="M250 256 Q210 286 196 296" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>
  <path d="M142 296 Q98 282 90 258" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>
  <path d="M92 204 Q132 174 146 168" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>

  <text x="170" y="234" text-anchor="middle" font-size="11" fill="#374151">each</text>
  <text x="170" y="248" text-anchor="middle" font-size="11" fill="#374151">session</text>

  <!-- big arrow to staircase -->
  <path d="M320 230 L380 230" stroke="#1E2A8E" stroke-width="3" fill="none" marker-end="url(#ah3)"/>

  <!-- staircase (right side) -->
  <text x="560" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Laddering toward the goal</text>

  <!-- steps -->
  <rect x="420" y="280" width="90" height="40" fill="#1E2A8E"/>
  <text x="465" y="305" text-anchor="middle" font-size="12" fill="#FFFFFF">Session 1</text>

  <rect x="510" y="240" width="90" height="80" fill="#3E9B6B"/>
  <text x="555" y="265" text-anchor="middle" font-size="12" fill="#FFFFFF">Session 2</text>

  <rect x="600" y="200" width="90" height="120" fill="#C4683A"/>
  <text x="645" y="225" text-anchor="middle" font-size="12" fill="#FFFFFF">Session 3</text>

  <!-- rising arrow -->
  <path d="M425 270 L630 160" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ah2)"/>

  <!-- goal flag -->
  <line x1="660" y1="160" x2="660" y2="120" stroke="#141B5C" stroke-width="3"/>
  <path d="M660 122 L700 132 L660 142 z" fill="#D4AF37"/>
  <text x="668" y="115" font-size="12" font-weight="bold" fill="#141B5C">Goal</text>

  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#374151"/>
    </marker>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1E2A8E"/>
    </marker>
  </defs>
</svg>
