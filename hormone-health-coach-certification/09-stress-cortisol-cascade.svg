<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="#FFFFFF"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">From Chronic Stress to a System Out of Balance</text>

  <!-- Step 1: chronic stress -->
  <rect x="250" y="58" width="220" height="52" rx="10" fill="#C4683A"/>
  <text x="360" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Chronic stress</text>
  <text x="360" y="101" text-anchor="middle" font-size="12" fill="#FFFFFF">never switches off</text>

  <!-- arrow down -->
  <line x1="360" y1="110" x2="360" y2="138" stroke="#374151" stroke-width="2"/>
  <polygon points="360,148 354,136 366,136" fill="#374151"/>

  <!-- Step 2: high cortisol -->
  <rect x="240" y="148" width="240" height="58" rx="10" fill="#1E2A8E"/>
  <text x="360" y="174" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Cortisol stays high</text>
  <text x="360" y="194" text-anchor="middle" font-size="12" fill="#D4AF37">the stress hormone never resets</text>

  <!-- fan-out lines -->
  <line x1="360" y1="206" x2="360" y2="236" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="262" x2="120" y2="290" stroke="#374151" stroke-width="2"/>
  <line x1="280" y1="262" x2="280" y2="290" stroke="#374151" stroke-width="2"/>
  <line x1="440" y1="262" x2="440" y2="290" stroke="#374151" stroke-width="2"/>
  <line x1="600" y1="262" x2="600" y2="290" stroke="#374151" stroke-width="2"/>
  <path d="M360 236 H120 V262" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M360 236 H280 V262" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M360 236 H440 V262" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M360 236 H600 V262" fill="none" stroke="#374151" stroke-width="2"/>

  <polygon points="120,300 114,288 126,288" fill="#374151"/>
  <polygon points="280,300 274,288 286,288" fill="#374151"/>
  <polygon points="440,300 434,288 446,288" fill="#374151"/>
  <polygon points="600,300 594,288 606,288" fill="#374151"/>

  <!-- Knock-on effects -->
  <g>
    <rect x="40" y="300" width="160" height="86" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="120" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Sleep</text>
    <text x="120" y="350" text-anchor="middle" font-size="11.5" fill="#374151">High at night,</text>
    <text x="120" y="366" text-anchor="middle" font-size="11.5" fill="#374151">so rest breaks down</text>
  </g>
  <g>
    <rect x="200" y="300" width="160" height="86" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="280" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Blood sugar</text>
    <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#374151">Runs higher and</text>
    <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#374151">less steady</text>
  </g>
  <g>
    <rect x="360" y="300" width="160" height="86" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="440" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Sex hormones</text>
    <text x="440" y="350" text-anchor="middle" font-size="11.5" fill="#374151">Dialed back in</text>
    <text x="440" y="366" text-anchor="middle" font-size="11.5" fill="#374151">constant demand</text>
  </g>
  <g>
    <rect x="520" y="300" width="160" height="86" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
    <text x="600" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Thyroid</text>
    <text x="600" y="350" text-anchor="middle" font-size="11.5" fill="#374151">Signals can</text>
    <text x="600" y="366" text-anchor="middle" font-size="11.5" fill="#374151">slow down</text>
  </g>

  <text x="360" y="428" text-anchor="middle" font-size="12.5" fill="#374151" font-style="italic">One stuck input tips the whole connected system, not a single broken part.</text>
</svg>
