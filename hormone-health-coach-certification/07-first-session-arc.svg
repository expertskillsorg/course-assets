<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="760" height="280" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The First-Session Arc</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#374151">Five parts across a 60-minute first session</text>

  <!-- baseline -->
  <line x1="40" y1="150" x2="720" y2="150" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Step 1 Connect -->
  <circle cx="100" cy="150" r="26" fill="#1E2A8E"/>
  <text x="100" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="100" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Connect</text>
  <text x="100" y="218" text-anchor="middle" font-size="12" fill="#374151">~10 min</text>

  <!-- Step 2 Review intake -->
  <circle cx="240" cy="150" r="26" fill="#3E9B6B"/>
  <text x="240" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="240" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Review intake</text>
  <text x="240" y="218" text-anchor="middle" font-size="12" fill="#374151">~15 min</text>

  <!-- Step 3 Set direction -->
  <circle cx="380" cy="150" r="26" fill="#D4AF37"/>
  <text x="380" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">3</text>
  <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Set direction</text>
  <text x="380" y="218" text-anchor="middle" font-size="12" fill="#374151">~15 min</text>

  <!-- Step 4 Choose first action -->
  <circle cx="520" cy="150" r="26" fill="#C4683A"/>
  <text x="520" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="520" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Choose first action</text>
  <text x="520" y="218" text-anchor="middle" font-size="12" fill="#374151">~15 min</text>

  <!-- Step 5 Confirm next step -->
  <circle cx="660" cy="150" r="26" fill="#141B5C"/>
  <text x="660" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="660" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Confirm next step</text>
  <text x="660" y="218" text-anchor="middle" font-size="12" fill="#374151">~5 min</text>

  <!-- arrows -->
  <path d="M132 150 L202 150" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M272 150 L342 150" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M412 150 L482 150" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M552 150 L622 150" stroke="#374151" stroke-width="2" marker-end="url(#ah)"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
