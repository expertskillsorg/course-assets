<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="520" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Symptoms May Point to a System (Never a Diagnosis)</text>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#374151">Each symptom can relate to more than one system. You map, you do not label.</text>

  <!-- Column 1: Symptoms -->
  <text x="130" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Common symptoms</text>

  <!-- symptom pills -->
  <rect x="30" y="108" width="200" height="34" rx="17" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="130" text-anchor="middle" font-size="13" fill="#111827">Afternoon energy crash</text>

  <rect x="30" y="156" width="200" height="34" rx="17" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="178" text-anchor="middle" font-size="13" fill="#111827">Sugar cravings</text>

  <rect x="30" y="204" width="200" height="34" rx="17" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="226" text-anchor="middle" font-size="13" fill="#111827">Wired but tired at night</text>

  <rect x="30" y="252" width="200" height="34" rx="17" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="274" text-anchor="middle" font-size="13" fill="#111827">Mood dips before period</text>

  <rect x="30" y="300" width="200" height="34" rx="17" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="322" text-anchor="middle" font-size="13" fill="#111827">Always cold, low energy</text>

  <rect x="30" y="348" width="200" height="34" rx="17" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="370" text-anchor="middle" font-size="13" fill="#111827">Stubborn belly weight</text>

  <!-- Column 2: Systems (right side) -->
  <text x="585" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Hormone systems</text>

  <!-- Blood sugar (green) -->
  <rect x="470" y="112" width="230" height="48" rx="10" fill="#3E9B6B"/>
  <text x="585" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Blood sugar / Insulin</text>
  <text x="585" y="152" text-anchor="middle" font-size="11" fill="#ffffff">energy, cravings, weight</text>

  <!-- Cortisol (terracotta) -->
  <rect x="470" y="184" width="230" height="48" rx="10" fill="#C4683A"/>
  <text x="585" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Stress / Cortisol</text>
  <text x="585" y="224" text-anchor="middle" font-size="11" fill="#ffffff">sleep, wired-and-tired</text>

  <!-- Sex hormones (navy) -->
  <rect x="470" y="256" width="230" height="48" rx="10" fill="#1E2A8E"/>
  <text x="585" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Sex hormones</text>
  <text x="585" y="296" text-anchor="middle" font-size="11" fill="#ffffff">cycle-timed mood shifts</text>

  <!-- Thyroid (gold) -->
  <rect x="470" y="328" width="230" height="48" rx="10" fill="#D4AF37"/>
  <text x="585" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">Thyroid</text>
  <text x="585" y="368" text-anchor="middle" font-size="11" fill="#141B5C">cold, slow, low energy</text>

  <!-- connecting lines: symptom -> system (light, many-to-many) -->
  <!-- energy crash -> blood sugar, cortisol, thyroid -->
  <line x1="230" y1="125" x2="470" y2="136" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="230" y1="125" x2="470" y2="208" stroke="#C4683A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- cravings -> blood sugar -->
  <line x1="230" y1="173" x2="470" y2="136" stroke="#3E9B6B" stroke-width="2"/>
  <!-- wired/tired -> cortisol -->
  <line x1="230" y1="221" x2="470" y2="208" stroke="#C4683A" stroke-width="2"/>
  <!-- mood before period -> sex hormones, blood sugar -->
  <line x1="230" y1="269" x2="470" y2="280" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="230" y1="269" x2="470" y2="148" stroke="#3E9B6B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- always cold -> thyroid -->
  <line x1="230" y1="317" x2="470" y2="352" stroke="#D4AF37" stroke-width="2"/>
  <!-- belly weight -> blood sugar, cortisol, thyroid -->
  <line x1="230" y1="365" x2="470" y2="148" stroke="#3E9B6B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="230" y1="365" x2="470" y2="220" stroke="#C4683A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="230" y1="365" x2="470" y2="364" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- legend / footer -->
  <line x1="40" y1="430" x2="80" y2="430" stroke="#374151" stroke-width="2"/>
  <text x="90" y="434" font-size="12" fill="#374151">solid = strong link</text>
  <line x1="240" y1="430" x2="280" y2="430" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="290" y="434" font-size="12" fill="#374151">dashed = may also relate</text>

  <rect x="40" y="456" width="640" height="44" rx="8" fill="#ffffff" stroke="#D4AF37" stroke-width="2"/>
  <text x="360" y="483" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">A symptom touching many systems is a coaching signal, not a diagnosis.</text>
</svg>
