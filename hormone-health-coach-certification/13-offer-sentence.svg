<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">Three pieces become one sentence a buyer understands</text>

  <!-- Three building blocks -->
  <!-- Niche -->
  <rect x="40" y="70" width="200" height="96" rx="10" fill="#1E2A8E"/>
  <text x="140" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">NICHE</text>
  <text x="140" y="126" text-anchor="middle" font-size="12" fill="#ffffff">Who you help</text>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#ffffff">(a specific person)</text>

  <!-- Offer -->
  <rect x="280" y="70" width="200" height="96" rx="10" fill="#3E9B6B"/>
  <text x="380" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">OFFER</text>
  <text x="380" y="126" text-anchor="middle" font-size="12" fill="#ffffff">The result you</text>
  <text x="380" y="146" text-anchor="middle" font-size="12" fill="#ffffff">help them reach</text>

  <!-- Package -->
  <rect x="520" y="70" width="200" height="96" rx="10" fill="#C4683A"/>
  <text x="620" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">PACKAGE</text>
  <text x="620" y="126" text-anchor="middle" font-size="12" fill="#ffffff">How you deliver it</text>
  <text x="620" y="146" text-anchor="middle" font-size="12" fill="#ffffff">(the format)</text>

  <!-- Plus signs -->
  <text x="260" y="128" text-anchor="middle" font-size="26" font-weight="bold" fill="#374151">+</text>
  <text x="500" y="128" text-anchor="middle" font-size="26" font-weight="bold" fill="#374151">+</text>

  <!-- Arrow down -->
  <line x1="380" y1="176" x2="380" y2="214" stroke="#D4AF37" stroke-width="4"/>
  <polygon points="380,228 372,212 388,212" fill="#D4AF37"/>

  <!-- The one sentence card -->
  <rect x="40" y="244" width="680" height="150" rx="12" fill="#ffffff" stroke="#D4AF37" stroke-width="3"/>
  <text x="380" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#D4AF37">YOUR ONE-SENTENCE OFFER</text>
  <text x="380" y="312" text-anchor="middle" font-size="15" fill="#111827">"I help <tspan fill="#1E2A8E" font-weight="bold">tired women in perimenopause</tspan></text>
  <text x="380" y="338" text-anchor="middle" font-size="15" fill="#111827"><tspan fill="#3E9B6B" font-weight="bold">get their energy and sleep back</tspan></text>
  <text x="380" y="364" text-anchor="middle" font-size="15" fill="#111827">through a <tspan fill="#C4683A" font-weight="bold">12-week lifestyle coaching program</tspan>."</text>
</svg>
