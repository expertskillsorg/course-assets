<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="640" height="460" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">The Goal Funnel</text>
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#374151">From a big wish down to this week's small action</text>

  <!-- Level 1: big wish (widest) -->
  <path d="M70 90 H570 L500 150 H140 Z" fill="#1E2A8E"/>
  <text x="320" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Big wish</text>
  <text x="320" y="137" text-anchor="middle" font-size="13" fill="#ffffff">"I want to balance my hormones"</text>

  <!-- Level 2: focus area -->
  <path d="M140 160 H500 L440 220 H200 Z" fill="#3E9B6B"/>
  <text x="320" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Focus area</text>
  <text x="320" y="207" text-anchor="middle" font-size="13" fill="#ffffff">Steady afternoon energy</text>

  <!-- Level 3: this week's action -->
  <path d="M200 230 H440 L380 290 H260 Z" fill="#D4AF37"/>
  <text x="320" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#141B5C">This week's action</text>
  <text x="320" y="277" text-anchor="middle" font-size="13" fill="#141B5C">Protein at breakfast</text>

  <!-- Level 4: first step (narrowest) -->
  <path d="M260 300 H380 L348 356 H292 Z" fill="#C4683A"/>
  <text x="320" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">First step</text>
  <text x="320" y="345" text-anchor="middle" font-size="12" fill="#ffffff">Buy eggs today</text>

  <!-- arrow down to the doable outcome -->
  <line x1="320" y1="364" x2="320" y2="396" stroke="#374151" stroke-width="2"/>
  <path d="M320 404 l-7 -10 h14 Z" fill="#374151"/>
  <text x="320" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#3E9B6B">One small action she'll actually do</text>

  <!-- side labels: wide vs narrow -->
  <text x="40" y="124" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90 40 124)">vague</text>
  <text x="40" y="330" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90 40 330)">concrete</text>
</svg>
