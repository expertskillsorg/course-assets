<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Sample Hormone-Supportive Day</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#374151" font-style="italic">Working with the body's natural clock, from morning light to wind-down.</text>

  <!-- timeline baseline -->
  <line x1="70" y1="230" x2="690" y2="230" stroke="#E5E7EB" stroke-width="4"/>

  <!-- sun-to-moon arc indicator -->
  <path d="M70 230 Q380 90 690 230" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-dasharray="5 6"/>
  <circle cx="120" cy="196" r="11" fill="#D4AF37"/>
  <circle cx="640" cy="196" r="11" fill="#1E2A8E"/>
  <circle cx="646" cy="192" r="9" fill="#FFFFFF"/>

  <!-- nodes -->
  <!-- Morning -->
  <circle cx="120" cy="230" r="9" fill="#D4AF37"/>
  <line x1="120" y1="230" x2="120" y2="262" stroke="#374151" stroke-width="2"/>
  <rect x="58" y="262" width="124" height="92" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5"/>
  <text x="120" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Morning</text>
  <text x="120" y="306" text-anchor="middle" font-size="11" fill="#374151">Outdoor light</text>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="#374151">Protein breakfast</text>
  <text x="120" y="338" text-anchor="middle" font-size="11" fill="#374151">Steady start</text>

  <!-- Midday meals -->
  <circle cx="290" cy="230" r="9" fill="#3E9B6B"/>
  <line x1="290" y1="230" x2="290" y2="262" stroke="#374151" stroke-width="2"/>
  <rect x="228" y="262" width="124" height="92" rx="10" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2.5"/>
  <text x="290" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Midday</text>
  <text x="290" y="306" text-anchor="middle" font-size="11" fill="#374151">Balanced meals</text>
  <text x="290" y="322" text-anchor="middle" font-size="11" fill="#374151">Protein, fat, fiber</text>
  <text x="290" y="338" text-anchor="middle" font-size="11" fill="#374151">Even blood sugar</text>

  <!-- Afternoon movement -->
  <circle cx="460" cy="230" r="9" fill="#C4683A"/>
  <line x1="460" y1="230" x2="460" y2="262" stroke="#374151" stroke-width="2"/>
  <rect x="398" y="262" width="124" height="92" rx="10" fill="#FFFFFF" stroke="#C4683A" stroke-width="2.5"/>
  <text x="460" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Daytime</text>
  <text x="460" y="306" text-anchor="middle" font-size="11" fill="#374151">Walk or strength</text>
  <text x="460" y="322" text-anchor="middle" font-size="11" fill="#374151">Micro-breaks</text>
  <text x="460" y="338" text-anchor="middle" font-size="11" fill="#374151">Breath resets</text>

  <!-- Evening wind-down -->
  <circle cx="640" cy="230" r="9" fill="#1E2A8E"/>
  <line x1="640" y1="230" x2="640" y2="262" stroke="#374151" stroke-width="2"/>
  <rect x="578" y="262" width="124" height="92" rx="10" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2.5"/>
  <text x="640" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#141B5C">Evening</text>
  <text x="640" y="306" text-anchor="middle" font-size="11" fill="#374151">Dim lights</text>
  <text x="640" y="322" text-anchor="middle" font-size="11" fill="#374151">Screens aside</text>
  <text x="640" y="338" text-anchor="middle" font-size="11" fill="#374151">Consistent bedtime</text>

  <text x="380" y="392" text-anchor="middle" font-size="12.5" fill="#374151" font-style="italic">Coach one anchor first, let it hold, then build the rest of the rhythm around it.</text>
</svg>
