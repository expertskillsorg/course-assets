<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#141B5C">A Day of Blood Sugar: Roller Coaster vs. Steady</text>

  <!-- Plot frame -->
  <line x1="80" y1="70" x2="80" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="330" x2="660" y2="330" stroke="#374151" stroke-width="2"/>
  <text x="40" y="205" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90 40 205)">Blood sugar</text>

  <!-- comfortable zone band -->
  <rect x="80" y="220" width="580" height="60" fill="#3E9B6B" opacity="0.12"/>
  <text x="650" y="256" text-anchor="end" font-size="11" fill="#3E9B6B">steady zone</text>

  <!-- Roller coaster curve (terracotta): big spikes and crashes -->
  <polyline points="80,250 150,120 210,300 290,110 360,310 440,130 520,305 600,150 660,300"
    fill="none" stroke="#C4683A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crash markers -->
  <circle cx="210" cy="300" r="5" fill="#C4683A"/>
  <circle cx="360" cy="310" r="5" fill="#C4683A"/>
  <circle cx="520" cy="305" r="5" fill="#C4683A"/>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#C4683A">crashes bring cravings, low energy, and a cortisol bump</text>

  <!-- Steady curve (green): gentle waves inside the zone -->
  <polyline points="80,255 150,232 210,252 290,234 360,250 440,232 520,252 600,236 660,250"
    fill="none" stroke="#3E9B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- meal markers -->
  <g font-size="11" fill="#1E2A8E" text-anchor="middle">
    <line x1="150" y1="330" x2="150" y2="336" stroke="#1E2A8E" stroke-width="2"/>
    <text x="150" y="372">Breakfast</text>
    <line x1="360" y1="330" x2="360" y2="336" stroke="#1E2A8E" stroke-width="2"/>
    <text x="360" y="372">Lunch</text>
    <line x1="600" y1="330" x2="600" y2="336" stroke="#1E2A8E" stroke-width="2"/>
    <text x="600" y="372">Dinner</text>
  </g>

  <!-- Legend -->
  <g font-size="13">
    <rect x="120" y="392" width="26" height="6" rx="3" fill="#C4683A"/>
    <text x="154" y="398" fill="#374151">Spike-and-crash day (sugary, skipped meals)</text>
    <rect x="430" y="392" width="26" height="6" rx="3" fill="#3E9B6B"/>
    <text x="464" y="398" fill="#374151">Steady day (balanced plates)</text>
  </g>

  <!-- gold accent dot on a spike peak -->
  <circle cx="290" cy="110" r="5" fill="#D4AF37"/>
  <text x="290" y="100" text-anchor="middle" font-size="11" fill="#D4AF37">spike</text>
</svg>
