<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Track Changes Review Cycle</text>

  <!-- Stage 1: Record -->
  <rect x="30" y="90" width="180" height="90" rx="8" fill="#1E2A8E"/>
  <text x="120" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1. Record</text>
  <text x="120" y="146" text-anchor="middle" font-size="12" fill="#ffffff">Track Changes on;</text>
  <text x="120" y="163" text-anchor="middle" font-size="12" fill="#ffffff">edits saved as markup</text>

  <!-- Stage 2: Review -->
  <rect x="270" y="90" width="180" height="90" rx="8" fill="#D4AF37"/>
  <text x="360" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#141B5C">2. Review</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#141B5C">Read each change</text>
  <text x="360" y="163" text-anchor="middle" font-size="12" fill="#141B5C">in the reviewing pane</text>

  <!-- Stage 3 split: Accept / Reject -->
  <rect x="510" y="52" width="180" height="70" rx="8" fill="#3E9B6B"/>
  <text x="600" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3a. Accept</text>
  <text x="600" y="103" text-anchor="middle" font-size="12" fill="#ffffff">edit becomes final text</text>

  <rect x="510" y="148" width="180" height="70" rx="8" fill="#C4683A"/>
  <text x="600" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3b. Reject</text>
  <text x="600" y="199" text-anchor="middle" font-size="12" fill="#ffffff">edit disappears, original stays</text>

  <!-- Arrows -->
  <line x1="210" y1="135" x2="264" y2="135" stroke="#374151" stroke-width="3"/>
  <polygon points="264,135 254,130 254,140" fill="#374151"/>

  <line x1="450" y1="123" x2="504" y2="92" stroke="#374151" stroke-width="3"/>
  <polygon points="504,92 493,92 500,101" fill="#374151"/>
  <line x1="450" y1="147" x2="504" y2="178" stroke="#374151" stroke-width="3"/>
  <polygon points="504,178 500,169 493,178" fill="#374151"/>

  <text x="360" y="262" text-anchor="middle" font-size="13" fill="#374151">Every tracked edit stays as markup until it is accepted or rejected. Turning tracking</text>
  <text x="360" y="282" text-anchor="middle" font-size="13" fill="#374151">off only stops new recording; it does not resolve the edits already there.</text>
</svg>
