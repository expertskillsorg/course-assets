<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="18" font-weight="bold" fill="#141B5C">Every floating image is anchored to a paragraph</text>

  <!-- page -->
  <rect x="30" y="60" width="440" height="300" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- text lines with a gap for the image (square wrap) -->
  <g fill="#E5E7EB">
    <rect x="55" y="85" width="390" height="8" rx="4"/>
    <rect x="55" y="105" width="390" height="8" rx="4"/>
    <!-- paragraph that owns the anchor -->
    <rect x="55" y="150" width="150" height="8" rx="4" fill="#374151"/>
    <rect x="55" y="170" width="150" height="8" rx="4" fill="#374151"/>
    <rect x="55" y="190" width="150" height="8" rx="4" fill="#374151"/>
    <rect x="55" y="210" width="150" height="8" rx="4" fill="#374151"/>
    <rect x="55" y="255" width="390" height="8" rx="4"/>
    <rect x="55" y="275" width="390" height="8" rx="4"/>
    <rect x="55" y="295" width="390" height="8" rx="4"/>
    <rect x="55" y="315" width="290" height="8" rx="4"/>
  </g>

  <!-- the floating image, text wraps square around it -->
  <rect x="240" y="145" width="200" height="90" fill="#1E2A8E"/>
  <circle cx="275" cy="175" r="14" fill="#D4AF37"/>
  <polygon points="240,235 300,195 340,225 380,190 440,235" fill="#3E9B6B"/>
  <text x="255" y="270" font-size="12" fill="#FFFFFF" font-style="italic"></text>

  <!-- anchor icon near the owning paragraph -->
  <g stroke="#C4683A" stroke-width="2.5" fill="none">
    <circle cx="42" cy="150" r="5"/>
    <line x1="42" y1="155" x2="42" y2="172"/>
    <line x1="34" y1="162" x2="50" y2="162"/>
    <path d="M32 168 a10 10 0 0 0 20 0"/>
  </g>

  <!-- dashed link from anchor to image -->
  <line x1="48" y1="152" x2="238" y2="160" stroke="#C4683A" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- callouts on the right -->
  <g font-size="14">
    <rect x="510" y="90" width="220" height="60" rx="6" fill="#141B5C"/>
    <text x="524" y="115" fill="#FFFFFF" font-weight="bold">Wrapping style</text>
    <text x="524" y="136" fill="#FFFFFF" font-size="12">Square: text flows around it</text>

    <rect x="510" y="170" width="220" height="60" rx="6" fill="#C4683A"/>
    <text x="524" y="195" fill="#FFFFFF" font-weight="bold">Anchor</text>
    <text x="524" y="216" fill="#FFFFFF" font-size="12">Ties image to this paragraph</text>

    <rect x="510" y="250" width="220" height="60" rx="6" fill="#3E9B6B"/>
    <text x="524" y="275" fill="#FFFFFF" font-weight="bold">Fix position on page</text>
    <text x="524" y="296" fill="#FFFFFF" font-size="12">Pins it to the page as text moves</text>
  </g>

  <text x="30" y="388" font-size="13" font-style="italic" fill="#374151">Move the anchored paragraph and the image moves with it. That is why pictures jump.</text>
</svg>
