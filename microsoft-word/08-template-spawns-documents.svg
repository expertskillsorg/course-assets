<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#FFFFFF"/>

  <!-- Template master -->
  <g>
    <rect x="245" y="24" width="150" height="96" rx="6" fill="#1E2A8E"/>
    <rect x="245" y="24" width="150" height="26" rx="6" fill="#141B5C"/>
    <text x="320" y="42" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">TEMPLATE</text>
    <text x="320" y="60" text-anchor="middle" fill="#D4AF37" font-size="11" font-weight="bold">agency-letter.dotx</text>
    <!-- content lines representing styles/layout -->
    <rect x="263" y="72" width="114" height="6" rx="3" fill="#D4AF37"/>
    <rect x="263" y="86" width="90" height="5" rx="2.5" fill="#E5E7EB"/>
    <rect x="263" y="97" width="114" height="5" rx="2.5" fill="#E5E7EB"/>
    <rect x="263" y="108" width="70" height="5" rx="2.5" fill="#E5E7EB"/>
  </g>

  <text x="320" y="142" text-anchor="middle" fill="#374151" font-size="12" font-style="italic">one master, saved once</text>

  <!-- Fan-out connectors -->
  <g stroke="#3E9B6B" stroke-width="2.5" fill="none">
    <path d="M320 150 C 320 175, 90 175, 90 210"/>
    <path d="M320 150 C 320 175, 243 180, 243 210"/>
    <path d="M320 150 C 320 175, 397 180, 397 210"/>
    <path d="M320 150 C 320 175, 550 175, 550 210"/>
  </g>
  <g fill="#3E9B6B">
    <circle cx="90" cy="210" r="4"/>
    <circle cx="243" cy="210" r="4"/>
    <circle cx="397" cy="210" r="4"/>
    <circle cx="550" cy="210" r="4"/>
  </g>

  <!-- Documents -->
  <!-- doc 1 -->
  <g>
    <rect x="45" y="222" width="90" height="120" rx="5" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="45" y="222" width="90" height="20" rx="5" fill="#3E9B6B"/>
    <text x="90" y="236" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">Document 1</text>
    <rect x="57" y="256" width="66" height="4" rx="2" fill="#D4AF37"/>
    <rect x="57" y="268" width="52" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="57" y="278" width="66" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="57" y="288" width="40" height="4" rx="2" fill="#E5E7EB"/>
    <text x="90" y="330" text-anchor="middle" fill="#C4683A" font-size="9" font-weight="bold">Harpers</text>
  </g>
  <!-- doc 2 -->
  <g>
    <rect x="198" y="222" width="90" height="120" rx="5" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="198" y="222" width="90" height="20" rx="5" fill="#3E9B6B"/>
    <text x="243" y="236" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">Document 2</text>
    <rect x="210" y="256" width="66" height="4" rx="2" fill="#D4AF37"/>
    <rect x="210" y="268" width="52" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="210" y="278" width="66" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="210" y="288" width="40" height="4" rx="2" fill="#E5E7EB"/>
    <text x="243" y="330" text-anchor="middle" fill="#C4683A" font-size="9" font-weight="bold">Nguyen</text>
  </g>
  <!-- doc 3 -->
  <g>
    <rect x="352" y="222" width="90" height="120" rx="5" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="352" y="222" width="90" height="20" rx="5" fill="#3E9B6B"/>
    <text x="397" y="236" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">Document 3</text>
    <rect x="364" y="256" width="66" height="4" rx="2" fill="#D4AF37"/>
    <rect x="364" y="268" width="52" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="364" y="278" width="66" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="364" y="288" width="40" height="4" rx="2" fill="#E5E7EB"/>
    <text x="397" y="330" text-anchor="middle" fill="#C4683A" font-size="9" font-weight="bold">Okafor</text>
  </g>
  <!-- doc 4 -->
  <g>
    <rect x="505" y="222" width="90" height="120" rx="5" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="505" y="222" width="90" height="20" rx="5" fill="#3E9B6B"/>
    <text x="550" y="236" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="bold">Document 4</text>
    <rect x="517" y="256" width="66" height="4" rx="2" fill="#D4AF37"/>
    <rect x="517" y="268" width="52" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="517" y="278" width="66" height="4" rx="2" fill="#E5E7EB"/>
    <rect x="517" y="288" width="40" height="4" rx="2" fill="#E5E7EB"/>
    <text x="550" y="330" text-anchor="middle" fill="#C4683A" font-size="9" font-weight="bold">Reyes</text>
  </g>

  <text x="320" y="372" text-anchor="middle" fill="#374151" font-size="12" font-style="italic">many documents, same styles and layout, different content</text>
  <rect x="150" y="388" width="14" height="10" fill="#D4AF37"/>
  <text x="170" y="397" fill="#374151" font-size="11">inherited formatting</text>
  <rect x="360" y="388" width="14" height="10" fill="#C4683A"/>
  <text x="380" y="397" fill="#374151" font-size="11">content that changes</text>
</svg>
