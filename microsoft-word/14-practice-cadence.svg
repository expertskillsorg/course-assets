<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#141B5C">The Practice Cadence at a Glance</text>

  <!-- timeline spine -->
  <line x1="70" y1="150" x2="570" y2="150" stroke="#E5E7EB" stroke-width="4"/>

  <!-- WEEKLY -->
  <circle cx="150" cy="150" r="16" fill="#1E2A8E"/>
  <text x="150" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">W</text>
  <rect x="70" y="70" width="160" height="52" rx="8" fill="#1E2A8E"/>
  <text x="150" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">WEEKLY</text>
  <text x="150" y="111" text-anchor="middle" font-size="11" fill="#ffffff">One real document,</text>
  <text x="150" y="197" text-anchor="middle" font-size="11" fill="#374151">styled from a template</text>

  <!-- MONTHLY -->
  <circle cx="330" cy="150" r="16" fill="#3E9B6B"/>
  <text x="330" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">M</text>
  <rect x="250" y="70" width="160" height="52" rx="8" fill="#3E9B6B"/>
  <text x="330" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">MONTHLY</text>
  <text x="330" y="111" text-anchor="middle" font-size="11" fill="#ffffff">One rescue or template,</text>
  <text x="330" y="197" text-anchor="middle" font-size="11" fill="#374151">a merge if work provides one</text>

  <!-- 90-DAY -->
  <circle cx="510" cy="150" r="16" fill="#D4AF37"/>
  <text x="510" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#141B5C">90</text>
  <rect x="430" y="70" width="160" height="52" rx="8" fill="#D4AF37"/>
  <text x="510" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#141B5C">90-DAY MARK</text>
  <text x="510" y="111" text-anchor="middle" font-size="11" fill="#141B5C">Rebuild resume or report,</text>
  <text x="510" y="197" text-anchor="middle" font-size="11" fill="#374151">then compare the difference</text>

  <!-- fallback rule -->
  <rect x="120" y="235" width="400" height="40" rx="8" fill="#ffffff" stroke="#C4683A" stroke-width="2"/>
  <text x="320" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#C4683A">Fallback rule: never two weeks without a styled document</text>
</svg>
