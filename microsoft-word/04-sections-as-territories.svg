<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif">
  <rect width="640" height="320" fill="#FFFFFF"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#141B5C">One document, three layout territories</text>

  <!-- Section 1: portrait brief -->
  <rect x="55" y="60" width="120" height="180" rx="4" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="70" y1="90" x2="160" y2="90" stroke="#374151" stroke-width="3"/>
  <line x1="70" y1="105" x2="160" y2="105" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="70" y1="118" x2="160" y2="118" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="70" y1="131" x2="160" y2="131" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="70" y1="144" x2="140" y2="144" stroke="#E5E7EB" stroke-width="3"/>
  <text x="115" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">Section 1</text>
  <text x="115" y="279" text-anchor="middle" font-size="11" fill="#374151">Brief · Portrait</text>

  <!-- Break marker 1 -->
  <text x="215" y="150" text-anchor="middle" font-size="26" fill="#D4AF37">&#8250;</text>
  <text x="215" y="172" text-anchor="middle" font-size="9" fill="#C4683A">section</text>
  <text x="215" y="183" text-anchor="middle" font-size="9" fill="#C4683A">break</text>

  <!-- Section 2: landscape exhibit -->
  <rect x="250" y="105" width="180" height="120" rx="4" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <line x1="265" y1="135" x2="415" y2="135" stroke="#3E9B6B" stroke-width="3"/>
  <line x1="265" y1="152" x2="415" y2="152" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="265" y1="169" x2="415" y2="169" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="340" y1="120" x2="340" y2="210" stroke="#E5E7EB" stroke-width="2"/>
  <text x="340" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E9B6B">Section 2</text>
  <text x="340" y="265" text-anchor="middle" font-size="11" fill="#374151">Exhibit · Landscape</text>

  <!-- Break marker 2 -->
  <text x="470" y="150" text-anchor="middle" font-size="26" fill="#D4AF37">&#8250;</text>
  <text x="470" y="172" text-anchor="middle" font-size="9" fill="#C4683A">section</text>
  <text x="470" y="183" text-anchor="middle" font-size="9" fill="#C4683A">break</text>

  <!-- Section 3: portrait close -->
  <rect x="505" y="60" width="120" height="180" rx="4" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <line x1="520" y1="90" x2="610" y2="90" stroke="#374151" stroke-width="3"/>
  <line x1="520" y1="105" x2="610" y2="105" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="520" y1="118" x2="610" y2="118" stroke="#E5E7EB" stroke-width="3"/>
  <line x1="520" y1="131" x2="590" y2="131" stroke="#E5E7EB" stroke-width="3"/>
  <text x="565" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2A8E">Section 3</text>
  <text x="565" y="279" text-anchor="middle" font-size="11" fill="#374151">Close · Portrait</text>

  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#111827">Each section keeps its own margins, orientation, headers, and numbering.</text>
</svg>
