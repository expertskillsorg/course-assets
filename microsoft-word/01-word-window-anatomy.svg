<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#FFFFFF"/>
  <!-- Outer window frame -->
  <rect x="20" y="20" width="600" height="400" fill="#F3F4F6" stroke="#141B5C" stroke-width="2" rx="6"/>

  <!-- Ribbon -->
  <rect x="20" y="20" width="600" height="70" fill="#1E2A8E" rx="6"/>
  <rect x="20" y="60" width="600" height="30" fill="#1E2A8E"/>
  <text x="40" y="45" fill="#FFFFFF" font-size="13" font-weight="bold">Home</text>
  <text x="95" y="45" fill="#C7CBEA" font-size="13">Insert</text>
  <text x="150" y="45" fill="#C7CBEA" font-size="13">Layout</text>
  <text x="215" y="45" fill="#C7CBEA" font-size="13">View</text>
  <rect x="40" y="66" width="26" height="18" fill="#D4AF37" rx="2"/>
  <rect x="74" y="66" width="26" height="18" fill="#3E9B6B" rx="2"/>
  <rect x="108" y="66" width="26" height="18" fill="#C4683A" rx="2"/>
  <rect x="142" y="66" width="26" height="18" fill="#7C86C8" rx="2"/>
  <rect x="176" y="66" width="26" height="18" fill="#7C86C8" rx="2"/>

  <!-- Ruler -->
  <rect x="20" y="90" width="600" height="20" fill="#E5E7EB"/>
  <g stroke="#374151" stroke-width="1">
    <line x1="120" y1="93" x2="120" y2="107"/>
    <line x1="180" y1="96" x2="180" y2="104"/>
    <line x1="240" y1="96" x2="240" y2="104"/>
    <line x1="300" y1="96" x2="300" y2="104"/>
    <line x1="360" y1="96" x2="360" y2="104"/>
    <line x1="420" y1="96" x2="420" y2="104"/>
    <line x1="480" y1="93" x2="480" y2="107"/>
  </g>

  <!-- Page -->
  <rect x="180" y="130" width="240" height="250" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="200" y="150" width="200" height="14" fill="#141B5C"/>
  <g fill="#374151">
    <rect x="200" y="180" width="200" height="6"/>
    <rect x="200" y="194" width="200" height="6"/>
    <rect x="200" y="208" width="160" height="6"/>
    <rect x="200" y="230" width="200" height="6"/>
    <rect x="200" y="244" width="200" height="6"/>
    <rect x="200" y="258" width="120" height="6"/>
  </g>
  <text x="300" y="405" fill="#374151" font-size="11" text-anchor="middle" font-style="italic">The page</text>

  <!-- Status bar -->
  <rect x="20" y="398" width="600" height="22" fill="#141B5C" rx="0"/>
  <text x="34" y="413" fill="#FFFFFF" font-size="10">Page 1 of 2</text>
  <text x="120" y="413" fill="#FFFFFF" font-size="10">312 words</text>
  <circle cx="560" cy="409" r="4" fill="#D4AF37"/>
  <rect x="500" y="407" width="55" height="4" fill="#7C86C8" rx="2"/>

  <!-- Labels / callout lines -->
  <g font-size="11" fill="#1E2A8E" font-weight="bold">
    <text x="470" y="52">Ribbon</text>
    <text x="470" y="104">Ruler</text>
    <text x="470" y="415" fill="#D4AF37">Zoom</text>
    <text x="34" y="392" fill="#141B5C">Status bar</text>
  </g>
  <g stroke="#1E2A8E" stroke-width="1" stroke-dasharray="3 3">
    <line x1="466" y1="48" x2="440" y2="48"/>
    <line x1="466" y1="100" x2="490" y2="100"/>
  </g>
</svg>
