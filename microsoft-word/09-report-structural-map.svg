<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="19" font-weight="bold" fill="#141B5C">Harbor Lane Consulting: the report's three territories</text>

  <!-- Front matter -->
  <rect x="30" y="60" width="220" height="300" rx="8" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
  <rect x="30" y="60" width="220" height="34" rx="8" fill="#D4AF37"/>
  <text x="140" y="83" font-size="15" font-weight="bold" fill="#141B5C" text-anchor="middle">FRONT MATTER</text>
  <text x="140" y="112" font-size="12" fill="#374151" text-anchor="middle">numbered i, ii  (roman)</text>

  <rect x="52" y="128" width="176" height="44" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="140" y="150" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">Cover page</text>
  <text x="140" y="166" font-size="11" fill="#374151" text-anchor="middle">no page number shown</text>

  <rect x="52" y="184" width="176" height="44" rx="4" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="140" y="206" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">Table of Contents</text>
  <text x="140" y="222" font-size="11" fill="#374151" text-anchor="middle">page ii</text>

  <text x="140" y="262" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">Section break</text>
  <text x="140" y="278" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">divides this zone</text>
  <text x="140" y="294" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">from the body,</text>
  <text x="140" y="310" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">so numbering</text>
  <text x="140" y="326" font-size="11" fill="#374151" text-anchor="middle" font-style="italic">can restart.</text>

  <!-- Body -->
  <rect x="270" y="60" width="220" height="300" rx="8" fill="#FFFFFF" stroke="#1E2A8E" stroke-width="2"/>
  <rect x="270" y="60" width="220" height="34" rx="8" fill="#1E2A8E"/>
  <text x="380" y="83" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BODY</text>
  <text x="380" y="112" font-size="12" fill="#374151" text-anchor="middle">restarts at 1  (arabic)</text>

  <rect x="292" y="126" width="176" height="30" rx="4" fill="#EEF1FB" stroke="#1E2A8E"/>
  <text x="380" y="146" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">1  Executive Summary</text>
  <rect x="292" y="162" width="176" height="30" rx="4" fill="#EEF1FB" stroke="#1E2A8E"/>
  <text x="380" y="182" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">2  Current-State Findings</text>
  <rect x="292" y="198" width="176" height="30" rx="4" fill="#EEF1FB" stroke="#1E2A8E"/>
  <text x="380" y="218" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">3  Recommendations</text>
  <rect x="292" y="234" width="176" height="30" rx="4" fill="#EEF1FB" stroke="#1E2A8E"/>
  <text x="380" y="254" font-size="12" font-weight="bold" fill="#141B5C" text-anchor="middle">4  Implementation Roadmap</text>
  <text x="380" y="300" font-size="11" fill="#374151" text-anchor="middle">Heading 1 = each section</text>
  <text x="380" y="318" font-size="11" fill="#374151" text-anchor="middle">Heading 2 = its subsections</text>

  <!-- Back matter -->
  <rect x="510" y="60" width="220" height="300" rx="8" fill="#FFFFFF" stroke="#3E9B6B" stroke-width="2"/>
  <rect x="510" y="60" width="220" height="34" rx="8" fill="#3E9B6B"/>
  <text x="620" y="83" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BACK MATTER</text>
  <text x="620" y="112" font-size="12" fill="#374151" text-anchor="middle">numbering continues</text>

  <rect x="532" y="128" width="176" height="60" rx="4" fill="#EAF5EF" stroke="#3E9B6B"/>
  <text x="620" y="152" font-size="13" font-weight="bold" fill="#141B5C" text-anchor="middle">Appendix A</text>
  <text x="620" y="170" font-size="11" fill="#374151" text-anchor="middle">Methodology and</text>
  <text x="620" y="184" font-size="11" fill="#374151" text-anchor="middle">data tables</text>
  <text x="620" y="218" font-size="11" fill="#374151" text-anchor="middle">Detail the body</text>
  <text x="620" y="234" font-size="11" fill="#374151" text-anchor="middle">points to but</text>
  <text x="620" y="250" font-size="11" fill="#374151" text-anchor="middle">does not need</text>
  <text x="620" y="266" font-size="11" fill="#374151" text-anchor="middle">to interrupt.</text>

  <!-- flow arrows -->
  <path d="M250 210 L270 210" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <path d="M490 210 L510 210" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#111827"/>
    </marker>
  </defs>

  <text x="380" y="392" font-size="12" fill="#374151" text-anchor="middle">Three zones, one file. Section breaks let the page numbering change between them.</text>
</svg>
