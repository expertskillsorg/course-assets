<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#FFFFFF"/>

  <!-- Style definition box -->
  <rect x="180" y="30" width="280" height="120" rx="6" fill="#F7F8FC" stroke="#1E2A8E" stroke-width="2"/>
  <text x="320" y="56" fill="#141B5C" font-size="15" font-weight="bold" text-anchor="middle">Heading 1 (the style definition)</text>
  <line x1="200" y1="68" x2="440" y2="68" stroke="#E5E7EB" stroke-width="1"/>
  <text x="204" y="90" fill="#374151" font-size="12">Font: Calibri Light</text>
  <text x="204" y="110" fill="#374151" font-size="12">Size: 16 pt, Bold</text>
  <text x="204" y="130" fill="#374151" font-size="12">Color: navy</text>
  <text x="360" y="90" fill="#374151" font-size="12">Space after: 6 pt</text>
  <text x="360" y="110" fill="#374151" font-size="12">Space before: 12 pt</text>

  <!-- Broadcast arrows -->
  <g stroke="#D4AF37" stroke-width="2" fill="none">
    <path d="M240 150 L110 210"/>
    <path d="M290 150 L253 210"/>
    <path d="M350 150 L397 210"/>
    <path d="M400 150 L540 210"/>
  </g>
  <g fill="#D4AF37">
    <polygon points="110,210 104,200 118,203"/>
    <polygon points="253,210 246,201 259,201"/>
    <polygon points="397,210 391,201 404,201"/>
    <polygon points="540,210 532,203 546,200"/>
  </g>
  <text x="320" y="182" fill="#374151" font-size="11" text-anchor="middle" font-style="italic">every paragraph wearing Heading 1 gets these settings</text>

  <!-- Four paragraphs wearing the style -->
  <g>
    <rect x="40" y="212" width="140" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="52" y="234" fill="#141B5C" font-size="12" font-weight="bold">Budget Review</text>
    <line x1="52" y1="252" x2="160" y2="252" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="268" x2="160" y2="268" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="284" x2="120" y2="284" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="192" y="212" width="140" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="204" y="234" fill="#141B5C" font-size="12" font-weight="bold">Spring Event</text>
    <line x1="204" y1="252" x2="312" y2="252" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="204" y1="268" x2="312" y2="268" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="204" y1="284" x2="272" y2="284" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="344" y="212" width="140" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="356" y="234" fill="#141B5C" font-size="12" font-weight="bold">Membership</text>
    <line x1="356" y1="252" x2="464" y2="252" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="356" y1="268" x2="464" y2="268" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="356" y1="284" x2="424" y2="284" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="496" y="212" width="140" height="80" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="508" y="234" fill="#141B5C" font-size="12" font-weight="bold">Next Meeting</text>
    <line x1="508" y1="252" x2="616" y2="252" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="508" y1="268" x2="616" y2="268" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
    <line x1="508" y1="284" x2="576" y2="284" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Change-once note -->
  <rect x="140" y="330" width="360" height="60" rx="6" fill="#FDF6E3" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="320" y="356" fill="#141B5C" font-size="13" font-weight="bold" text-anchor="middle">Change the definition once...</text>
  <text x="320" y="378" fill="#374151" font-size="12" text-anchor="middle">and all four headings update together.</text>
</svg>
