<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" font-family="Arial, sans-serif">
  <rect width="460" height="360" fill="#FFFFFF"/>
  <text x="230" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#141B5C">The three zones of a page</text>

  <!-- Page outline -->
  <rect x="110" y="45" width="240" height="300" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>

  <!-- Header zone -->
  <rect x="110" y="45" width="240" height="55" fill="#1E2A8E" fill-opacity="0.08"/>
  <line x1="110" y1="100" x2="350" y2="100" stroke="#1E2A8E" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="126" y="76" font-size="12" font-weight="bold" fill="#1E2A8E">Smith v. Harlow · No. 24-118</text>
  <text x="95" y="76" text-anchor="end" font-size="11" font-weight="bold" fill="#1E2A8E" transform="rotate(-90 30 76)"></text>
  <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E2A8E">HEADER</text>

  <!-- Body zone -->
  <line x1="126" y1="128" x2="334" y2="128" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="126" y1="145" x2="334" y2="145" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="126" y1="162" x2="334" y2="162" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="126" y1="179" x2="334" y2="179" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="126" y1="196" x2="334" y2="196" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="126" y1="213" x2="334" y2="213" stroke="#E5E7EB" stroke-width="4"/>
  <line x1="126" y1="230" x2="290" y2="230" stroke="#E5E7EB" stroke-width="4"/>
  <text x="50" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">BODY</text>

  <!-- Footer zone -->
  <line x1="110" y1="290" x2="350" y2="290" stroke="#3E9B6B" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="110" y="290" width="240" height="55" fill="#3E9B6B" fill-opacity="0.08"/>
  <rect x="196" y="306" width="68" height="22" rx="3" fill="#3E9B6B" fill-opacity="0.18" stroke="#3E9B6B" stroke-width="1"/>
  <text x="230" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">Page 1 of 12</text>
  <text x="50" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E9B6B">FOOTER</text>

  <!-- Field callout -->
  <line x1="264" y1="317" x2="330" y2="317" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="360" y="314" font-size="10" fill="#C4683A" font-weight="bold">field:</text>
  <text x="360" y="327" font-size="10" fill="#111827">counts</text>
  <text x="360" y="339" font-size="10" fill="#111827">itself</text>

  <text x="230" y="358" text-anchor="middle" font-size="10" fill="#111827">Typed once in the header or footer, it repeats on every page.</text>
</svg>
